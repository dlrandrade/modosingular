<!doctype html><html lang="pt-BR"><meta charset="utf-8">
<style>
@font-face{font-family:"IT";src:url("../../public/estudio/fontes/inter-tight-latin-wght-normal.woff2");font-weight:100 900}
@font-face{font-family:"EBG";font-style:italic;src:url("../../public/estudio/fontes/eb-garamond-latin-wght-italic.woff2");font-weight:400 800}
html,body{margin:0;background:#0b0c0f;width:1080px;height:1920px;overflow:hidden}
#fig{position:absolute;left:13px;top:661px;width:1717px;height:916px;transform-origin:0 0;transform:scale(.6134)}
#fig .e{position:absolute;inset:0;visibility:hidden}
#fig .i{position:absolute;inset:0;background:url(sonhos.png) 0 0/1717px 916px no-repeat}
#rule{position:absolute;left:112px;top:150px;height:2px;background:#d8b26a}
#foot{position:absolute;left:112px;right:112px;bottom:64px;display:flex;justify-content:space-between;align-items:baseline;color:#6b7383}
#foot .m{font:italic 400 26px "EBG",serif}
#foot .c{font:500 19px "IT",sans-serif;letter-spacing:.08em}
</style>
<div id="rule"></div><div id="fig"></div>
<div id="foot"><span class="m">Modo Singular</span><span class="c">@DANIELLUZZ</span></div>
<script>
// Caixas na imagem original (1717x916). m "up": o texto sobe de dentro de uma máscara; "x": barra cresce da esquerda para a direita.
const W=1717,H=916,D=7;
const EL=[
 {b:[67,123,180,269],   t:[.2,.8],  m:"up",c:"c"},   // O
 {b:[201,123,424,269],  t:[.4,1.0], m:"up",c:"a"},   // que
 {b:[445,123,730,269],  t:[.6,1.2], m:"up",c:"a"},   // mais
 {b:[751,123,1161,269], t:[.8,1.4], m:"up",c:"a"},   // destrói
 {b:[1182,123,1651,269],t:[1.0,1.7],m:"up",c:"c"},   // sonhos?
 {b:[75,355,465,452],   t:[1.8,2.3],m:"up",c:"c"},   // Distração
 {b:[71,466,1548,537],  t:[2.2,3.5],m:"x", c:"w"},   // barra longa
 {b:[75,607,664,704],   t:[3.5,4.0],m:"up",c:"c"},   // Incompetência
 {b:[70,720,450,788],   t:[4.05,5.0],m:"x",c:"w"},   // barra curta (fecha em 5 s)
];
const fig=document.getElementById("fig"),rule=document.getElementById("rule");
EL.forEach(e=>{const [x0,y0,x1,y1]=e.b;e.o=document.createElement("div");e.o.className="e";
 e.o.style.clipPath=`inset(${y0}px ${W-x1}px ${H-y1}px ${x0}px)`;e.i=document.createElement("div");e.i.className="i";e.o.appendChild(e.i);fig.appendChild(e.o)});
const E=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function render(t){
 rule.style.width=(856*Math.min(1,t/D))+"px";
 EL.forEach(e=>{
  const p=E((t-e.t[0])/(e.t[1]-e.t[0])),[x0,y0,x1,y1]=e.b;
  if(p<=0){e.o.style.visibility="hidden";return}
  e.o.style.visibility="visible";
  if(e.m==="up"){e.i.style.transform=`translateY(${(1-p)*(y1-y0)*.9}px)`;e.i.style.opacity=Math.min(1,p*2.5);e.i.style.clipPath="none"}
  else{e.i.style.transform="none";e.i.style.opacity=1;e.i.style.clipPath=`inset(0 ${W-x0-(x1-x0)*p}px 0 0)`}
 });
}
// eventos de sincronia para o áudio: texto = impacto na entrada; barra = whoosh durante o crescimento + impacto na chegada
const L=[];EL.forEach((e,k)=>{
 if(e.c==="w"){const last=k===EL.length-1;L.push({c:"w",t:e.t[0]-.07,d:e.t[1]-e.t[0]});L.push({c:last?"b":"c",t:e.t[1]-.12})}
 else L.push({c:e.c,t:e.t[0]+.12});
});
window.S=[{a:0,b:D,L:L}];window.D=D;window.render=render;
</script></html>
