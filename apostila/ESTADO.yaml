decisoes:
- '2026-09-27: Formato 17x24 cm; WeasyPrint; Newsreader + Instrument Serif + Inter; revisão cega por agente independente;
  gate >= 9.0 sem critério < 8.0'
- '2026-09-27: Extensão por capítulo fixada em 14 a 16 páginas (corpo 10,8 pt + espaço de escrita). ''Faça/Evite''
  passa para depois do esqueleto, para eliminar brancos.'
- '2026-09-27: Cap. 1 aprovado na r5 (9,14). Correções de linha da r5 aplicadas depois da aprovação (cena da cardiologista
  virou cena de reconhecimento; faixas do autodiagnóstico completas); serão reconferidas na revisão de coerência
  da Fase I.'
- '2026-09-27: Palavras compostas ficam sem tratamento especial: qualquer caixa inquebrável (span nowrap/inline-block/word
  joiner) faz o WeasyPrint engolir o espaço anterior em linha justificada. Quebra no hífen é aceita.'
- '2026-09-27: Termo: ''tradução de formato'' (caps. 5 e 7) é a troca de forma (fala→texto); ''tradução'' sem qualificação
  é o conceito da Fase III (experiência→peça, cap. 13).'
- '2026-09-28: Box Para guardar mais compacto (9,8/13,2 pt, margens menores) e com break-before: avoid: quando não
  cabe, leva junto as últimas linhas do texto, em vez de ficar sozinho na página.'
- '2026-09-28: Caps. 13 (r4, 9,22) e 14 (r3, 9,01) passaram; correções de linha das revisões aplicadas depois da
  aprovação. Oficinas aceitam ''numerar: true'' em campos de linhas. Cap. 30 redigido: todos os 30 capítulos têm
  rascunho.'
- '2026-09-28: Guardar reconferido após o CSS compacto: cap22 cabe na mesma página; cap10 leva duas linhas do texto
  para a p19, com ~20% livres na p18 (o box não cabe por poucos mm). Aceito.'
- '2026-09-28: Box ''Na prática'' pode quebrar entre ''O comum'' e ''O singular'' (CSS); só quebra quando o comum
  cabe inteiro no pé da página.'
