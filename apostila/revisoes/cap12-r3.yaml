        coerencia: 8.4, aplicabilidade: 9.2, impresso: 8.6, honestidade: 9.3}
bloqueadores: []
pontos_fortes:
  - 'A r2 foi resolvida quase por inteiro. A rede agora espera quando a linha está em aberto ("esta peça espera: volte a ela quando uma das três lhe custar alguma coisa"), a régua recuperou a segunda metade da pergunta 1, a abertura do Caio mostra de onde sai a linha do ritmo ("embaixo Caio acrescentou, de memória, o número que tinha tirado da conta do pior mês"), "janeiro manda" voltou (fecha com o cap. 21), o Caio prende a folha na parede e a evidência da rede ganhou 6 linhas. A seção "A linha em branco" ficou só com o Caio e o leitor.'
  - 'A tabela 12.1 continua sendo o centro do capítulo e confere com os caps. 7 a 11, agora com dia e hora em todos os ritmos ("Duas por semana, terça e quinta, no carro, antes de ligar o motor"; "Uma por semana, na quinta de manhã; medida no mês de entrega"). A leitura na vertical e na horizontal foi fundida num só parágrafo e ensina a olhar sem anunciar.'
  - 'As cenas da régua mostram linhas diferentes decidindo coisas diferentes: Renata usa o modo para mudar a captura ("a coluna cabia, desde que nascesse falada"), Otávio usa o repertório para recusar um assunto ("a reforma em geral é informação pública, e o que só ele tem é o documento feito depois do fato"), Lúcia aceita a própria voz gravada porque a conversa é o modo dela. O fecho do parágrafo-síntese é bom: "A segunda pergunta tem resposta. A primeira quase nunca tem."'
  - 'O último parágrafo termina em cena e planta o cap. 18 sem entregá-lo: "Só a vazia continuava pedindo atenção, e ele passou a escutar de outro jeito as conversas de obra em que alguém lhe pedia para fazer uma coisa que ele não faria."'
problemas:
  - criterio: coerencia
    trecho: 'Lúcia passou por isso com a linha do rótulo: a posição pedia um texto comprido, e o ritmo dela era de uma peça curta por semana. Resolveu dividindo a posição em duas perguntas, uma em cada semana.'
    por_que: 'Aqui Lúcia já publicou a posição "rótulo não é diagnóstico", em duas semanas. O cap. 17 (plano: "Lúcia decide discordar em público da moda de rotular todo desconforto e quase desiste três vezes") diz o contrário: "Desde que começou a publicar [...] tinha evitado de propósito qualquer assunto em que tivesse de dizer que alguém estava errado. [...] Esta seria a primeira peça em que ela diria que uma ideia muito aceita [...] estava deixando alguma coisa de fora". O cap. 12 gasta a cena reservada ao cap. 17 e quebra a linha do tempo da personagem (lições cap01-r2, cap04-r1 e cap08-r1).'
    correcao: 'Troque o exemplo por um conflito que não seja a posição publicada. Por exemplo, repertório contra ritmo: "Lúcia passou por isso com a linha do repertório: o paciente que volta em março pedia um texto comprido, com o antes e o depois do carnaval, e o ritmo dela era de uma peça curta por semana. Resolveu dividindo o caso em duas perguntas, uma em cada semana." O parágrafo anterior (primeira frase do conflito) passa a dizer "Um repertório rico pede um formato mais longo do que o ritmo permite". Ou dê o exemplo ao Otávio, que ainda não publica: o parecer sobre banco de horas que não cabia numa sexta.'
  - criterio: originalidade
    trecho: 'Eu penso escrevendo: antes de uma entrevista de desligamento, escrevo à mão as três perguntas que vou fazer. [...] mesmo em dezembro, que é o mês das demissões. [...] comparando equipe com time de várzea.'
    por_que: 'A r2 apontou que a paisagista repetia o Caio em duas linhas; a consultora de RH agora repete o Otávio. O modo é o mesmo gesto dele, escrever à mão antes ("Escrevendo, à mão primeiro", na tabela uma página antes; "escreve à mão antes de digitar", marca do elenco), e o território é vizinho ao dele: demissão, desligamento, relação com o chefe. "Dezembro, que é o mês das demissões" disputa com o cap. 8, em que o mês das demissões das pequenas empresas é janeiro ("quando as pequenas empresas que ele defende fazem as demissões adiadas no fim do ano"). O leitor lê dois meses de demissão em dois capítulos. E comparar equipe com time é a analogia mais gasta do mundo corporativo; "de várzea" não a salva. O único enunciado fora do elenco devia provar a frase "nenhuma linha de um caberia no outro", e hoje a desmente.'
    correcao: 'Troque o modo e o mês e mantenha a profissão, que é boa: "Eu penso respondendo: as minhas melhores ideias saem quando um gestor me pergunta por que perdeu alguém. Consigo sustentar uma peça por semana, às segundas antes das oito, mesmo em março, quando chegam as avaliações do ano." Comparação menos gasta: "comparando equipe com cozinha de restaurante: o problema aparece no prato, mas nasce na passagem". Se o modo ficar "respondendo", a pergunta 5 da consultora não pode repetir a Lúcia (evitar "pergunta antes de responder").'
  - criterio: voz
    trecho: 'A tabela tem quatro enunciados. O quinto é o seu, e os campos 01 a 05 da oficina seguem a ordem das linhas da tabela, para que você o escreva como uma quinta coluna.'
    por_que: 'É o narrador explicando a oficina no fecho da prosa, o que a lição cap02-r1 veta ("o fecho da prosa não descreve a oficina"), e o que diz nem é verdade no papel: a oficina tem campos em sequência, sem grade. A contagem também tropeça, como a r1 já apontava: a tabela impressa tem cinco colunas (Parte + quatro), e a do leitor seria a sexta. "Quinta coluna" é ainda expressão feita para traidor infiltrado, o que um leitor de 50 anos ouve de imediato.'
    correcao: '"A tabela tem quatro enunciados e espaço, ao lado, para mais um. Se o seu se parecer demais com o de algum personagem, volte à linha mais parecida e procure o detalhe da sua prática que só você tem: um caso, uma cidade, a pergunta que você faz e ninguém mais faz." Sem mencionar campos nem oficina.'
  - criterio: clareza
    trecho: 'O estabilizador veio por mensagem de um fornecedor: novo, com desconto, mais leve que o antigo. A tentação voltou por dois dias. Na terceira manhã, ele releu a segunda linha do enunciado'
    por_que: 'O parágrafo não nomeia o Caio. Vem logo depois do da Lúcia, e o "ele" fica sem antecedente; o leitor só descobre quem é na frase seguinte ao parágrafo ("A demora do Caio"). A variação de entrada pedida pela r2 era para a Renata e o Caio, mas não à custa do sujeito. O estabilizador do cap. 3 está a nove capítulos de distância.'
    correcao: '"O estabilizador veio por mensagem de um fornecedor ao escritório do Caio: novo, com desconto, mais leve que o dele. A tentação voltou por dois dias. Na terceira manhã, Caio releu a segunda linha..."'
  - criterio: clareza
    trecho: 'Este formato respeita o meu modo? Se não, dá para capturar no meu modo e publicar nele?'
    por_que: '"Nele" tem como antecedente mais próximo "o meu modo", e a leitura natural é "capturar no meu modo e publicar no meu modo", o contrário da regra do cap. 7 (capturar no modo, publicar no formato). É a pergunta que protege o método e a que o leitor vai consultar toda semana.'
    correcao: '"Este formato respeita o meu modo? Se não, dá para capturar no meu modo e publicar nesse formato?"'
  - criterio: coerencia
    trecho: 'Releia-o quando algo grande mudar na sua prática'
    por_que: 'O parágrafo manda consultar o enunciado nas semanas comuns e "relê-lo" quando algo grande mudar, mas reler e consultar são a mesma coisa. A verificação 04 e o gabarito perguntam "Quando o enunciado deve ser reescrito?" e respondem com esta frase. No mesmo parágrafo, o verbo muda três vezes: "revisto", "Revisá-lo", "Releia-o".'
    correcao: '"Reescreva-o quando algo grande mudar na sua prática, como uma nova área de atuação, uma mudança de cidade ou uma fase muito diferente da vida. Nas outras semanas, apenas consulte." E na primeira frase: "Feito para durar meses, o enunciado não deve ser reescrito toda semana. Reescrevê-lo a cada sete dias..."'
  - criterio: originalidade
    trecho: 'Uma linha em branco não impede o enunciado de funcionar. As outras quatro já decidem boa parte das dúvidas, e a da posição aparece quando a prática a revelar.'
    por_que: 'A linha vazia do Caio é o fio do capítulo, e por isso é dita demais. A ideia "a posição aparece quando a prática cobra/revela" está aqui, no guardar 3 ("A posição aparece quando a prática cobra um preço") e na explicação 03 ("a da posição aparece quando a prática cobrar um preço"). "Nenhuma frase lhe tinha custado nada" está na abertura e em "A linha em branco" ("ainda não tinha passado por uma situação em que defender uma posição lhe custasse alguma coisa"). "As outras quatro linhas bastam" aparece depois da tabela, aqui e no gabarito. Lição cap02-r1: a mesma ideia no máximo duas vezes, e a terceira traz ganho novo.'
    correcao: 'Corte o parágrafo "Uma linha em branco não impede..." e leve a sua última frase para o fim do anterior: "...e o capítulo 10 mostrou o que as constatações valem. Até lá, a linha fica escrita a lápis, na margem: “em aberto”." Na abertura, encurte para "A da posição estava vazia: nenhuma daquelas frases lhe tinha custado nada. Deixou assim." Na explicação 03, troque a segunda frase por "É o que a linha em branco protege: o enunciado continua honesto enquanto a prática não decide."'
  - criterio: ritmo
    trecho: 'Otávio riscou três versões numa folha pautada, e a final parecia uma cláusula de contrato, com o custo da posição anotado entre parênteses, como quem registra uma ressalva, e, ao lado do ritmo, duas palavras de aviso: janeiro manda.'
    por_que: 'O terceiro parágrafo da abertura tem cerca de 150 palavras em quatro frases, o dobro da calibragem (65 a 80), e duas delas passam de 45 palavras. Nesta, a vírgula-e-vírgula ("ressalva, e, ao lado do ritmo") empilha o terceiro complemento, e o leitor perde o fio antes de "janeiro manda", que é a imagem que o cap. 21 vai citar. A frase da Lúcia faz o mesmo ("a mesma da pergunta sobre a primeira sessão, que lhe fizesse as cinco perguntas por mensagem, uma por dia, e respondeu cada uma por áudio; na sexta...").'
    correcao: 'Separe o parágrafo em dois (Renata e Otávio / Lúcia) e quebre as frases longas: "Otávio riscou três versões numa folha pautada. A final parecia uma cláusula de contrato, com o custo da posição entre parênteses, como quem registra uma ressalva. Ao lado do ritmo, duas palavras de aviso: janeiro manda." / "Lúcia pediu à colega recém-formada do grupo de estudos, a da pergunta sobre a primeira sessão, que lhe mandasse as cinco perguntas por mensagem, uma por dia. Respondeu cada uma por áudio. Na sexta, só faltava tirar as perguntas."'
  - criterio: coerencia
    trecho: 'Renata o usou para trocar um texto mensal por uma entrevista gravada, e Otávio para recusar uma transmissão ao vivo sobre um assunto que não era dele.'
    por_que: 'A reforma trabalhista é o assunto dele: Otávio é advogado trabalhista há 25 anos. A cena diz outra coisa, que "a reforma em geral é informação pública" e que o repertório dele é outro. O gabarito resume errado a cena que cita.'
    correcao: '"...e Otávio para recusar uma transmissão ao vivo sobre informação que qualquer colega explica, e responder por escrito ao que só ele sabe."'
  - criterio: aplicabilidade
    trecho: 'Porque as plataformas reduzem o alcance de conteúdo parecido.'
    por_que: 'A lição cap01-r1 pede distratores inequivocamente falsos. Este é verdade parcial: plataformas anunciaram reduzir o alcance de conteúdo não original ou republicado, e o leitor informado hesita. O distrator b ("o público percebe a cópia logo nas primeiras peças") também não é falso em si, e o capítulo nunca diz que o público não percebe. A questão testa menos o conceito do que a capacidade de adivinhar qual resposta o livro prefere.'
    correcao: 'Distratores que o capítulo desmente: "Porque formatos copiados não podem ser publicados sem autorização." / "Porque só funciona o formato que ninguém na sua área usou ainda." Mantenha o "d" (saturação) ou troque-o por "Porque o formato bom é sempre o mais caro de produzir."'
  - criterio: originalidade
    trecho: 'Em vez de escrever, propôs gravar uma conversa de dez minutos por mês com o editor [...] Propôs responder por escrito a perguntas sobre advertências e recibos.'
    por_que: 'A r2 já apontava: duas das quatro cenas da régua fecham com a mesma batida, um convite no formato errado e uma contraproposta no próprio modo, anunciada com o mesmo verbo. A de Otávio agora é sustentada pela linha do repertório, mas o desfecho ainda é o da Renata.'
    correcao: 'Deixe o Otávio recusar sem contraproposta e mostre o ganho em outra coisa: "Recusou numa linha. Na sexta seguinte, usou a tarde de escrita para o texto que só ele podia fazer, sobre a advertência escrita depois da demissão." Ou mantenha a contraproposta e mude o verbo e a ordem: "A associação ficou com as respostas dele por escrito, sobre advertências e recibos, e publicou na newsletter."'
  - criterio: coerencia
    trecho: 'Uma que custou três noites falhou no modo ou no ritmo: Otávio descobriu isso com um texto sobre banco de horas que levou três sextas'
    por_que: 'A regra fala em "três noites", e o exemplo que a comprova são "três sextas", que pelo ritmo dele são tardes. A conta do caso não fecha com a regra que ele ilustra (lição cap01-r1).'
    correcao: '"Uma que custou três vezes o tempo previsto falhou no modo ou no ritmo: Otávio descobriu isso com um texto sobre banco de horas que levou três sextas..."'
edicoes_de_linha:
  - 'a autoridade de cada um não tinha caminho para chegar a quem ainda não os conhecia -> a autoridade de cada um não tinha caminho para chegar a quem ainda não o conhecia'
  - 'Responderam a primeira linha, porque ele pensa escrevendo -> Duas linhas responderam: a primeira, porque ele pensa escrevendo (o sujeito posposto faz "Responderam" parecer que alguém respondeu a ele)'
  - 'para o canal que ela mantém com duas psicólogas do grupo de estudos -> para o canal que a colega mantém com duas psicólogas do grupo de estudos (o "ela" pode ser a Lúcia)'
  - 'Na segunda, percebeu que já não precisava ler as quatro linhas -> Na segunda vez, percebeu que já não precisava ler as quatro linhas (lê-se "segunda-feira")'
  - 'Sem o enunciado, cada convite teria virado uma semana de dúvida -> Sem o enunciado, cada convite e cada compra teriam virado uma semana de dúvida (o caso do Caio não é convite)'
  - 'A demora do Caio foi a de deixar de querer o estabilizador, e não a de saber se precisava dele. -> A demora do Caio foi a de deixar de querer o estabilizador; saber se precisava dele levou um minuto. (tira a antítese com ", e não")'
  - 'Se não, é daqui que eu parto. -> De um jeito ou de outro, é daqui que eu parto. (no roteiro, "de onde eu parto" não depende do que o ouvinte procura)'
  - 'o julho dela ainda deixa cinco blocos de vinte minutos, e o áudio no carro cabe neles -> o julho dela ainda deixa cinco blocos de vinte minutos, três deles no carro, onde o áudio cabe (cap. 8: dois dos cinco são no fim da tarde)'
  - 'Para você, o mesmo formato pode custar o triplo -> Para você, o mesmo formato pode custar muito mais (número sem base, mesmo hipotético)'
diagramacao:
  - 'p012: cerca de 17% da página em branco no pé, depois de "descrito com precisão suficiente para ser usado." A figura 12.1 não coube. É a terceira revisão com o mesmo branco. Deixe o parágrafo "Duas pessoas podem ter o mesmo modo..." subir antes da figura, ou reduza a órbita (hoje ocupa cerca de 40% da p013 para cinco rótulos).'
  - 'p013: cerca de 20% em branco no pé, depois de "no vigésimo terceiro dia"; o box Conceito foi inteiro para a p014. Com a figura menor, o box cabe na p013.'
  - 'p015: cerca de 25% em branco no pé, depois de "de convites a compras de equipamento"; o box "Na prática" foi para a p016. Apontado também na r1 e na r2. Permita a quebra do box entre "O comum" e "O singular", ou coloque o box antes do parágrafo "A última coluna, a do Caio".'
  - 'p023: cerca de 20% em branco depois do Faça/Evite, porque o roteiro de fala foi para a p024. Se o roteiro não couber, suba a nota do roteiro para junto dele e aceite o branco; se couber com o espaçamento entre blocos reduzido, junte.'
  - 'p015: a tabela 12.1 continua sem espaço para o leitor, embora a prosa (p018-p019) diga que o enunciado dele é "uma quinta coluna" e o plano peça "o do leitor fica em branco". Uma coluna "Você" vazia na tabela, ou uma grade de cinco linhas no campo 08, faria o que a frase só promete.'
veredito: 'O capítulo está perto de passar: a r2 foi quase toda resolvida, a tabela e as cenas da régua funcionam e o fecho termina em cena. Faltam quatro coisas: tirar da Lúcia a posição publicada que é do cap. 17, trocar o modo e o mês da consultora de RH (que hoje repete o Otávio), deixar a prosa de explicar a oficina e acabar com os três brancos de pé de página que resistem desde a r1.'
