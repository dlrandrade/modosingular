capitulo: 26
iteracao: 3
notas: {metodo: 9.0, voz: 9.0, originalidade: 9.0, clareza: 8.9, ritmo: 9.1, concretude: 9.4,
        coerencia: 9.0, aplicabilidade: 9.1, impresso: 8.6, honestidade: 9.3}
bloqueadores: []
pontos_fortes:
  - "Os problemas da r2 foram resolvidos quase todos, e bem. A rima com o cap. 1 virou ganho de arco: 'Depois da avaliação, Renata reconheceu o padrão do Marcos [...] O Marcos tinha chegado apesar do perfil; ela tinha chegado por causa dele.' A Renata saiu de dentro do livro ('É um ponto de partida, e não uma regra; nenhum estudo conhecido fixa esses números'). A pergunta de origem voltou para o cap. 28. A cena da paciente passou a apontar para a peça certa ('era a pergunta de outra peça do alto do perfil'). O 'Faça assim' ganhou uma área fora da saúde (o engenheiro estrutural)."
  - "A conta fecha em todo lugar, e fecha com o sistema do cap. 23. São cinco peças por semana, e 'uma peça de ação a cada duas semanas' dá exatamente o 1 de cada 10 da referência. A auditoria (5/3/1/1) confere com a figura 26.2 e com o teste rápido ('contou duas: um áudio de agosto e uma peça de critério'). O resultado final é modesto e crível: 'De vinte e nove pacientes novos no trimestre, quatro tinham chegado pelo perfil'."
  - "As imagens são próprias e o leitor sai com elas: 'o perfil era uma porta fechada com uma placa bonita'; 'bom para quem estava dentro, mudo para quem passava na calçada'; 'No alto, a primeira coisa que um estranho lia agora era a meia.' O teste do rosto aparece em ação, e não só enunciado: 'Outro fisioterapeuta poderia falar da mesma dor. Não falaria da meia, nem da meia hora, nem do café.'"
  - "O limite ético em saúde é operacional e atravessa texto, oficina e rede sem virar sermão: 'a peça descreve, e quem examina decide'; na rede, 'Diagnosticar quem lê. Em saúde, descreva o sinal e devolva a decisão a quem examina.'"
problemas:
  - criterio: clareza
    trecho: "{rotulo: \"O nome\", texto: \"Isso tem explicação, e ela vai além do que se costuma ouvir.\", linhas: 2}"
    por_que: "O capítulo promete nomear e depois evita o nome. A tabela 26.1 e o funil prometem que a boca de funil responde 'Isso que eu sinto tem nome?'. A prosa diz que a peça 'começa pela experiência [...] e só depois dá nome a ela', e o campo 05 manda 'dê nome a ela'. Mas o único exemplo completo, a peça da meia, não dá nome nenhum ('isso tem explicação, e ela vai além de ‘é da idade’'). O exemplo do engenheiro também não ('Isso tem explicação.'). E o esqueleto chama de 'O nome' uma parte cujo texto não nomeia nada. O leitor apressado não sabe se deve escrever o nome técnico na peça, onde e como. A omissão da Renata tem uma boa razão (não diagnosticar quem lê), mas o capítulo não a diz, e ela não vale para o contador ou para o engenheiro."
    correcao: "Dizer a regra uma vez na prosa, no parágrafo da ética: 'Fora da saúde, a peça pode dar o nome (dilatação térmica, capital de giro); em saúde, Renata nomeava o mecanismo e deixava o diagnóstico para quem examina: “isso tem explicação, e ela vai além de ‘é da idade’”.' No esqueleto, trocar para {rotulo: 'O nome', texto: 'O nome do que acontece, dito depois da experiência. Em saúde, o mecanismo, nunca o diagnóstico de quem lê.'}. Na primeira linha do roteiro, manter 'Isso tem explicação' só como alternativa."
  - criterio: impresso
    trecho: "p. 18: \"perto das indicações, que continuavam sendo a maior parte, e Renata não espe-\" [cerca de 35% da página em branco]"
    por_que: "É a terceira revisão seguida que aponta o mesmo branco (r1, r2). O último parágrafo é quebrado com hifenização no meio de 'espe-/rava', e só duas linhas mais o 'Para guardar' passam para a p. 19. Não é branco antes de oficina nem antes de esqueleto indivisível: é o bloco 'guardar' puxando as últimas linhas do texto. Para uma página impressa, é o defeito mais visível do capítulo."
    correcao: "No CSS/renderizador, deixar o 'guardar' começar sozinho no alto da página, sem 'keep-with-previous' e sem 'orphans/widows' altos no último parágrafo. Se o motor não permitir, cortar a frase da biblioteca do p. 118 (ver problema de coerência): isso encurta o fecho em duas linhas e provavelmente faz o texto terminar na p. 18."
  - criterio: voz
    trecho: "A peça de reconhecimento fica do lado certo da linha quando entrega uma pergunta, e não uma conclusão."
    por_que: "A antítese disfarçada ', e não' aparece 12 vezes no capítulo. Na prosa são 3, o teto do lint. No resto: 'Se ela funcionar igual, tem processo, e não rosto', 'e não depende de ninguém', 'Tire do caderno de campo, e não da cabeça', 'compare a ordem das colunas, e não os números', 'e não no nome técnico', 'e não pelo termo técnico'. Por seção, 'Reconhecimento' tem duas antíteses explícitas ('não procura pelo nome técnico. Procura pelo que sente' e esta). A cena final empilha três em cinco frases: 'apesar do perfil; [...] por causa dele', 'Não falaria da meia', 'quem procura o assunto; [...] quem procura o que sente'. Isso passa da lição cap01-r1 (uma antítese explícita por seção). Lido em sequência, o tique vira a marca do narrador."
    correcao: "Na prosa: 'A peça de reconhecimento fica do lado certo da linha quando termina numa pergunta.' Nos blocos: 'Classifique pelo que o corpo da peça faz; a última linha não conta.' / 'Tire do caderno de campo.' / 'Com menos de dez peças, compare só a ordem das colunas.' / 'A experiência do campo 04 está nas palavras de quem a sente.' / regra 1 da rede: 'Quem ainda não tem o nome do problema procura pelo que sente. É pela experiência que a pessoa se reconhece, e é por ela que encontra você.' No guardar 1: 'A boca de funil começa a decisão de quem ainda não conhece você, sem depender de ninguém.'"
  - criterio: coerencia
    trecho: "A biblioteca do capítulo 25 é achada por quem procura o assunto; a peça de reconhecimento, por quem procura o que sente."
    por_que: "A frase ficou melhor do que na r2, mas ainda briga com o cap. 25. Lá, a biblioteca é achada por quem 'tem o problema — E não sabe que você existe', 'Pelo link de alguém, ou procurando o problema', e a lacuna dos banheiros é descrita como a de 'Uma pessoa [...] procurando o problema'. A fronteira entre 'procurar o assunto' e 'procurar o que sente' é fina demais para aguentar uma frase-tese. Além disso, a frase é uma moral de narrador enfiada no meio da cena, entre a anotação na agenda e a conta de fim de ano. Interrompe a batida mais forte do fecho ('Renata escreveu: perfil, sem indicação.')."
    correcao: "Cortar a frase. A cena fecha em 'Na agenda, ao lado do nome dela, Renata escreveu: perfil, sem indicação.' Se quiser manter a ponte com o cap. 25, levá-la para a seção 'Reconhecimento', sem antítese: 'A biblioteca do capítulo 25 fica mais fácil de achar quando cada peça começa pelas palavras que a pessoa usaria para procurar.'"
  - criterio: originalidade
    trecho: "No dia seguinte, pediu a Bianca, a assistente, que imprimisse as três publicações fixadas e as dez últimas peças, e, depois do último paciente, leu as folhas na mesa da recepção, anotando a caneta em cada uma para quem ela tinha sido feita."
    por_que: "No capítulo anterior, a imagem registrada em ESTADO.yaml › imagens é 'ler a própria peça impressa como de outra pessoa' (cap. 25, a folha dobrada e o 'Leu como se fosse de outra pessoa'). O cap. 25 também tem um inventário do acervo relido com caderno ao lado. Aqui a protagonista seguinte imprime as próprias peças e as relê de caneta na mão para classificá-las. É o mesmo gesto, em capítulos vizinhos (lição cap02-r1). A abertura repete também a fórmula de data da fase: 'Numa terça-feira de agosto' (25), 'Numa segunda-feira de setembro' (26), 'numa quinta-feira de outubro' (27)."
    correcao: "Tirar a impressão: 'No dia seguinte, depois do último paciente, abriu o perfil no computador da recepção e, com o caderno ao lado, anotou para quem cada uma das três publicações fixadas e das dez últimas peças tinha sido feita.' Abrir o capítulo pela ação, sem data: 'Renata pegou a agenda dos três meses anteriores numa segunda-feira à noite e fez uma conta que vinha adiando desde o começo do ano.'"
  - criterio: aplicabilidade
    trecho: "exemplo: \"Classifique pelo corpo da peça, e não pela última linha. Se publicou menos de dez, classifique todas as que tem.\""
    por_que: "A grade das p. 20-21 só tem números de 1 a 10 e caixas. Não há onde escrever qual peça é a 1, a 2... A r2 sugeriu uma coluna 'assunto'. Sem ela, a classificação não pode ser revista nem comparada com o campo 05, e quem classifica a peça 7 como 'critério' não sabe depois qual era. O campo 03 pede o 'Real: __ · __ · __ · __', mas a grade não tem linha de total, e o leitor soma de cabeça. Os dois ajustes são pequenos e fecham o ciclo que o checklist cobra ('Classifiquei as peças e comparei com a referência')."
    correcao: "Acrescentar à grade uma primeira coluna larga 'A peça (3 palavras)' e uma linha final 'Total'. No exemplo: 'Anote três palavras de cada peça e marque uma camada só, pelo que o corpo faz.'"
  - criterio: metodo
    trecho: "Renata passou a dizer também a camada: reconhecimento, critério, confiança."
    por_que: "Na conversão de vitrine em boca de funil, a camada de ação fica sem dono. Bianca 'não decidia a camada, do mesmo jeito que não decidia o assunto', mas é ela quem passa a 'guardar o convite para marcar [...] para uma peça de ação a cada duas semanas'. A lista da Renata omite 'ação'. Então quem grava e decide a peça de ação? Pelo cap. 23, nada sai sem a ideia dita pela Renata. É uma pequena brecha no sistema que o próprio capítulo defende (o rosto em cada camada, inclusive na menor)."
    correcao: "'Renata passou a dizer também a camada: reconhecimento, critério, confiança ou ação.' E: 'Mas passou a saber onde cada peça entrava, e o convite para marcar, que antes ia no fim de quase toda legenda, ficou para a peça de ação que Renata gravava a cada duas semanas.'"
  - criterio: honestidade
    trecho: "Funciona por um tempo. Depois falha, porque, num trabalho baseado em confiança, a pessoa não escolhe apenas o serviço."
    por_que: "É uma afirmação empírica geral, herdada do PWA, apresentada como lei ('Funciona por um tempo. Depois falha'). O capítulo a ancora em abril ('Renata a tinha visto de perto'), mas o que o cap. 23 mostra em abril é descaracterização, não falha de captação: 'Os números subiram.' O mesmo vale para 'O ganho de curto prazo, um ou outro agendamento, custa o de longo', dito como fato."
    correcao: "Ancorar no que a Renata viu: 'Em abril, com seis peças por semana, os números tinham subido e ela não se reconhecia em nenhuma. Uma boca de funil sem rosto pode até trazer gente; traz para um lugar em que ninguém sabe quem vai encontrar, e num trabalho baseado em confiança a pessoa escolhe alguém, e não só um serviço.' No outro trecho: 'O que se ganha, um ou outro agendamento, Renata achou pouco perto do que perdia: ser lembrada como a fisioterapeuta que explicou.'"
  - criterio: ritmo
    trecho: "Eram trinta e um. Vinte e quatro vieram por indicação, a maioria dos mesmos dois ortopedistas de sempre. Cinco vieram de outros pacientes. Dois disseram que tinham encontrado o perfil."
    por_que: "O primeiro parágrafo tem sete frases, e o do p. 90 também ('A matéria-prima estava pronta havia anos.' + três falas de paciente + mais três frases). Os dois passam do teto de seis (lição cap01-r2). No primeiro, as quatro frases curtas seguidas soam como relatório. Há também uma ambiguidade: 'outros pacientes' também é indicação, então o leitor não sabe se 'indicação' quer dizer só de médicos."
    correcao: "'Eram trinta e um: vinte e quatro indicados por médicos, a maioria pelos mesmos dois ortopedistas de sempre, cinco por outros pacientes e dois que disseram ter encontrado o perfil.' No p. 90, juntar as três falas numa frase com dois-pontos ou cortar 'e nenhuma delas precisava ser inventada'."
  - criterio: concretude
    trecho: "Renata demorou a entender o que a camada de reconhecimento exigia."
    por_que: "A frase abre a seção prometendo um tropeço que não aparece: nada mostra a Renata errando antes de entender. A seção segue direto para a regra ('Quem sente dor e ainda não tem diagnóstico não procura pelo nome técnico'). É a única descida ao abstrato num capítulo que, no resto, mostra tudo em cena."
    correcao: "Mostrar o tropeço em uma frase: 'A primeira peça de reconhecimento que Renata gravou começava por “lombalgia mecânica” e ficou dois dias sem ser publicada; ao ouvir de volta, percebeu que tinha falado com colegas.' Ou abrir direto: 'Quem sente dor e ainda não tem diagnóstico não procura pelo nome técnico.'"
edicoes_de_linha:
  - "Há um jeito rápido de saber qual das duas funções o seu perfil cumpre hoje. Olhe as últimas dez peças -> Olhe as suas últimas dez peças (a primeira frase anuncia; cortar)"
  - "Era a peça que os dois pacientes que abriram o perfil antes de marcar tinham citado: -> Era a peça que os dois pacientes do perfil tinham citado: (o relativo duplo 'que... que' pesa em voz alta)"
  - "O convite colado no fim da legenda era um problema à parte: estava em quase todas, e contaminava qualquer camada. -> O convite colado no fim da legenda era um problema à parte: estava em quase todas e contaminava qualquer camada. (vírgula antes de 'e' com mesmo sujeito)"
  - "Renata usava só as que já tinham passado da data anotada na seleção (cap. 19) -> Renata usava só as que já tinham passado da data anotada na seleção do capítulo 19 (o resto do capítulo escreve 'capítulo 25', 'capítulo 18'; uniformizar)"
  - "Contou, antes de sentar, que achou que alguém tinha descrito as manhãs dela. -> Contou, antes de se sentar, que parecia que alguém tinha descrito as manhãs dela."
  - "Mas eram quatro pessoas que, sem a troca de setembro, talvez nunca tivessem ouvido o nome dela. -> Mas eram quatro pessoas que, sem a troca de setembro, talvez nunca ouvissem o nome dela."
diagramacao:
  - "p. 18: cerca de 35% da página em branco embaixo; o último parágrafo quebra em 'espe-/rava', e só duas linhas mais o 'Para guardar' vão para a p. 19. É a terceira vez que isso é apontado. Liberar o 'guardar' para começar sozinho na página seguinte ou encurtar o fecho."
  - "p. 13: cerca de 20% da página vazio embaixo, porque o box 'Conceito' foi inteiro para a p. 14 (já apontado na r2). Permitir que o box comece no pé da página, com ao menos o título e a definição, ou aproximar o parágrafo do teste rápido."
  - "p. 22: cerca de 20% em branco no pé da página depois das três regras da rede. O quadro 'Faça assim / Evite' (duas colunas curtas) foi para a p. 23 e caberia ali. Na p. 23 sobra outro quarto de página antes do roteiro. Não é esqueleto nem oficina: são dois brancos evitáveis seguidos."
  - "p. 14, figura 26.1: o destaque agora cai corretamente na camada 1. As camadas 2 e 3 saem num bege, e a 4 num bege mais amarelado, sem motivo no texto. Em preto e branco, a camada 4 pode parecer mais pesada que as 2 e 3. Usar o mesmo tom para as três camadas não destacadas."
  - "p. 20-21, grade do campo 02: falta uma coluna para identificar a peça e uma linha de total (ver problema de aplicabilidade). A grade quebra entre as linhas 8 e 9; com uma coluna nova e o total, ela cabe inteira na p. 21 se o campo 01 ficar sozinho na p. 20."
veredito: "O capítulo chegou ao nível de publicação na substância: a conta fecha, o arco com o Marcos virou ganho e a oficina é executável. Falta uma passada curta para decidir o que 'dar nome' significa na peça de reconhecimento, podar a antítese ', e não' e, pela terceira vez, fechar o branco da p. 18."
