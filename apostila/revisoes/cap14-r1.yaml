capitulo: 14
iteracao: 1
notas: {metodo: 8.4, voz: 8.5, originalidade: 7.8, clareza: 9.0, ritmo: 8.6, concretude: 8.7,
        coerencia: 7.2, aplicabilidade: 8.0, impresso: 7.8, honestidade: 8.0}
bloqueadores:
  - 'Figura 14.2 ("Esquema ilustrativo, feito só com aritmética") tem uma conta que contradiz o próprio capítulo. Se cada pergunta rende três peças e o caderno acrescenta "uma pergunta a cada duas semanas", entram 1,5 peça por semana e sai 1: o estoque CRESCE. A curva "Com o caderno de campo" (57, 50, 44, 37, 31) só fecha se cada pergunta nova valer uma peça (saldo de -0,5 por semana). A prosa diz ainda outra coisa: "toda semana aparece uma pergunta nova [...] e o estoque se renova antes de acabar". Três números diferentes para a mesma conta, num esquema que se apresenta como aritmética pura.'
pontos_fortes:
  - 'O nível crítico do Caio é o melhor exemplo de "trocar a pergunta" do livro até aqui: "O que passa dentro dessa parede, e quem responde por ela?". Nasce de detalhes de ofício exatos ("o cano de gás, a prumada de água do prédio inteiro, a fiação que ninguém mapeou") e muda de fato o critério de quem pergunta.'
  - 'A cena de abertura é física e precisa: "Bateu com os nós dos dedos em três pontos e ouviu o som. Olhou o teto, procurando a marca de uma viga. Abriu o armário da pia". O modo e as marcas do Caio aparecem sem que ninguém precise explicá-los.'
  - 'O exemplo da dentista entrega uma régua que o cliente usa sozinho ("onde a sua gengiva sangra?"), como pede a lição cap02-r3, e o parágrafo "Nem toda pergunta tem os três níveis, e não é preciso forçá-los" acrescenta à fonte uma ressalva honesta que o PWA não tinha.'
  - 'A regra de ouro se mantém em toda a parte de caderno: a oficina, a rede e o roteiro tratam só de dúvidas da área do leitor, e o roteiro_nota ("a pergunta certa leva a pessoa a uma avaliação melhor, e nunca substitui a avaliação") protege as profissões regulamentadas.'
problemas:
  - criterio: coerencia
    trecho: "A recusa tinha um custo, e ele sabia exatamente qual. No ano anterior, um cliente quis derrubar a parede da cozinha num fim de semana, com um pedreiro de confiança, para economizar o laudo e o prazo do condomínio. Caio disse que não participaria."
    por_que: 'Há duas quebras de continuidade. (1) O cap. 12 afirma, na voz do narrador, que Caio "ainda não tinha passado por uma situação em que defender uma posição lhe custasse alguma coisa" e que "nenhuma daquelas frases lhe tinha custado nada". Aqui ele perdeu um projeto por uma posição no ano anterior. (2) O plano reserva ao cap. 18 "o projeto que Caio recusou e a régua que ele usou para recusar", e o rascunho do cap. 18 já usa essa batida ("Nos oito anos de escritório, tinha recusado outras propostas parecidas [...] sem nunca a escrever"). Recusar, perder o cliente para outro executor e o problema aparecer depois é a mesma cena, gasta quatro capítulos antes (lições cap04-r1 e cap08-r1). E "nenhuma parede sai sem alguém que responda por ela" é quase a régua do cap. 18 ("se a obra vai esconder [...] um problema que eu vi, eu não faço").'
    correcao: 'Cortar o episódio do cliente com o pedreiro e a mancha no teto do vizinho. Tirar a posição da camada estrutural da própria pergunta, onde ela ainda é discutível e não repete o cap. 18. Por exemplo: "eu defendo que nem toda parede que pode sair deve sair: em apartamento dos anos 70, integrar a cozinha à sala é quase sempre trocar um problema de fotografia por um de cheiro, ruído e gás, mesmo perdendo o cliente que chega com a pasta de recortes". O custo passa a ser futuro e visível no capítulo (o casal da abertura, que quer "como em todas as fotos da pasta"), o que respeita o cap. 12.'
  - criterio: aplicabilidade
    trecho: "Uma por linha, sem traduzir para o jargão da sua área."
    por_que: 'O campo 01 pede quinze perguntas, "uma por linha", e a entrega e o primeiro item do checklist (3 pontos) dependem disso. Na página impressa (p020) há dez linhas. O leitor ou escreve duas por linha, contra a instrução, ou não cumpre o critério no papel. Os campos 04 e 05, que no PWA tinham 4 linhas, caíram para 3. É pouco para escrever à mão "o que a pergunta deixa de fora, e qual seria a pergunta certa", e as páginas p020 e p021 têm espaço sobrando.'
    correcao: 'Campo 01 com 15 linhas numeradas de 1 a 15. Com as linhas numeradas, o critério "São quinze ou mais" fica verificável num olhar. Campos 04 e 05 com 4 linhas cada. Tudo cabe nas duas páginas da oficina sem mudar a paginação.'
  - criterio: originalidade
    trecho: "Na semana seguinte, Caio gravou a resposta crítica sobre a parede, no corredor vazio de uma obra, com a autorização do proprietário e o celular apoiado num cavalete. Começou como sempre: \"Teve uma obra…\"."
    por_que: 'A cena já existe quase palavra por palavra no cap. 3 ("pediu ao proprietário licença para gravar no corredor, que ainda estava vazio [...] apoiou o celular num cavalete") e no rascunho do cap. 18 ("no corredor vazio de uma obra [...] com a autorização do proprietário. Começou, como sempre, por \"teve uma obra\""). A abertura também repete a do cap. 11: casal, visita a apartamento antigo, "atravessou a sala contando os passos", parede, a mulher fala primeiro. O desfecho, com a cliente que chega citando a peça, antecipa a cena-âncora do cap. 25 ("Uma cliente chega com um texto que Caio publicou catorze meses antes") e repete o fecho de "publicou e alguém respondeu" dos caps. 3 e 11. Pela lição cap02-r1, nenhuma imagem se repete entre capítulos.'
    correcao: 'Abrir com outra geometria de cena, por exemplo por telefone, por um áudio de cliente às onze da noite ou por uma pergunta do mestre de obras, e sem "contando os passos". Fechar sem gravação e sem cliente citando a peça. Uma opção é Caio, na visita seguinte, ouvir a pergunta e devolver ele mesmo a pergunta certa antes de responder, notando que a resposta ficou mais curta. Outra é o caderno aberto na página das dezenove perguntas, com a primeira marcada para quinta.'
  - criterio: concretude
    trecho: "Caio explicou que o síndico não decide se a parede sai, mas precisa saber antes, receber o plano da reforma e o nome de quem responde por ela."
    por_que: 'Pela mesma norma que o capítulo invoca (NBR 16280, reforma em edificações), o síndico ou responsável legal analisa o plano de reforma e autoriza ou não o início da obra. Pode impedi-la se o plano não vier ou se houver risco à edificação. Um arquiteto que leia "o síndico não decide" vai tropeçar. O leitor leigo sai com uma informação que o expõe a um embargo. Pela lição cap09-r1, fato de ofício no caso central é conferido como um especialista conferiria.'
    correcao: '"Caio explicou que o síndico não escolhe o projeto, mas recebe o plano da reforma, com o nome de quem responde por ela, e pode barrar a obra enquanto esse plano não chegar."'
  - criterio: metodo
    trecho: "Lúcia pediu à amiga que lembrasse as perguntas que ela mesma já tinha feito no grupo de estudos, e a lista saiu da conversa."
    por_que: 'O conceito depende de a pergunta vir de quem o especialista atende ("alguém sentou diante de você e perguntou"). As perguntas de uma amiga de grupo de estudos são de colega. Não validam demanda nenhuma, e o próprio capítulo diz que Lúcia ouve dos pacientes "se ansiedade tem cura". A frase é ainda ambígua ("ela mesma" pode ser a amiga ou a Lúcia). O modo respondendo pode ser mostrado sem trocar a fonte.'
    correcao: '"Lúcia pediu à amiga que lesse em voz alta as crenças anotadas no caderno de campo e, para cada uma, perguntasse: como o paciente diz isso? A lista saiu das respostas, com as palavras de quem chega ao consultório, e sem nenhum nome."'
  - criterio: metodo
    trecho: "sem que um responsável técnico assinasse a obra e o síndico recebesse o plano de reforma antes do primeiro golpe de marreta, como pede a norma de reformas em edificações"
    por_que: 'A posição que preenche a linha "em aberto" do enunciado é o cumprimento de uma norma técnica. Pela lição cap10-r2, recusar o que a regra já exige só é posição se a praça faz o contrário, e o texto mostra isso de passagem (o pedreiro do fim de semana). Mesmo assim, nenhum colega vai discordar dela em público. O teste do custo do cap. 10 passa, mas a posição não é discutível, e o capítulo vende isso como a descoberta da opinião que faltava.'
    correcao: 'Ver o primeiro problema. A posição precisa ser legal e discutível, algo de que um arquiteto sério poderia discordar, como a de que integrar nem sempre é melhor em apartamento antigo. Manter a menção à norma só como condição de trabalho, fora da frase do enunciado.'
  - criterio: honestidade
    trecho: "Contou a história da mancha no teto do vizinho, sem dizer onde nem de quem."
    por_que: 'A peça pública conta o caso de um cliente que dispensou o Caio e se deu mal, um ano depois, numa cidade onde o vizinho de baixo e o próprio cliente reconhecem a história. É um "eu avisei" (autoelogio e indireta ao cliente e ao pedreiro), e ignora o que o capítulo anterior acabou de ensinar sobre caso composto e tempo deslocado. "Sem dizer onde nem de quem" é o atalho que o cap. 13 condena.'
    correcao: 'Se a gravação ficar, Caio conta um caso composto de várias obras ("em três apartamentos dos anos 70 que eu abri, o que estava dentro da parede era...") ou uma obra dele em que abrir a parede revelou a prumada, sem vencedor nem perdedor.'
  - criterio: honestidade
    trecho: "e de que ele tem uma versão clara de uma explicação que muitos colegas ainda dão de forma atrapalhada."
    por_que: 'Generalização sem fonte sobre terceiros, com indireta a colegas. O capítulo acumula outras acima do limite de duas: "por que tanta gente pergunta a mesma coisa", "são as que mais gente tem", "Quem pergunta se dá para derrubar a parede quase sempre tem", "Quando você escolhe sobre o que publicar, quase sempre está apostando" e, no checklist, "As básicas costumam ser as que mais gente tem".'
    correcao: 'Trocar por uma comparação consigo mesmo: "uma explicação que ele mesmo, no primeiro ano de escritório, dava de forma atrapalhada". Nos demais casos, atribuir ao Caio ("nas visitas dele, quem pergunta...") ou cortar o quantificador. No checklist: "As básicas são as que você responde com mais frequência."'
  - criterio: voz
    trecho: "A ordem do inventário importa pouco, mas dois cuidados ajudam. O primeiro é começar pelas perguntas que mais aparecem"
    por_que: 'É voz de apostila de curso. O narrador anuncia e enumera ("dois cuidados", "O primeiro", "O segundo") no lugar de mostrar. O capítulo tem outros sinais do mesmo registro: "Há um cálculo que ajuda a enxergar o tamanho disso.", "Vale reler as respostas de nível crítico do seu inventário", "Por isso vale guardá-lo" e "A conta é simples."'
    correcao: 'Passar os cuidados para a ação do Caio: "Caio pôs no topo as que mais apareciam no caderno e alternou: uma semana a resposta direta, na outra a pergunta certa, para que a sequência não virasse uma série de correções." Cortar "Há um cálculo que ajuda a enxergar o tamanho disso." e começar em "Caio levava uns dez minutos".'
  - criterio: ritmo
    trecho: "Os outros personagens têm as suas perguntas. Renata ouve toda semana se a dor lombar dela é hérnia."
    por_que: 'São duas rodadas de "os outros personagens" no mesmo capítulo (esta e "Os outros três personagens montaram inventários de tamanhos diferentes"), e a fórmula abre parágrafos idênticos nos caps. 13 e 16. A rodada vira lista de chamada e interrompe a linha do Caio duas vezes. Além disso, Renata monta a lista por escrito, "numa tarde", sem o modo oral dela aparecer.'
    correcao: 'Fundir as duas rodadas numa só, na seção "O estoque", abrindo por um detalhe e não pela fórmula: "Renata gravou as dela no carro, uma por áudio: vinte e três, quase todas sobre dor e movimento. [...]". Cortar o parágrafo da p. 14.'
  - criterio: coerencia
    trecho: "O inventário resolve também o problema com que o capítulo 6 começou, o da tela em branco na hora reservada para criar."
    por_que: 'O cap. 6 começa com a terça-feira do Otávio. A cena do horário reservado sem ideia está no meio dele. Somam-se duas remissões que quebram a ficção: Caio "abriu o caderno de campo que mantinha desde o capítulo 6" (o personagem não vive em capítulos) e a volta ao "apartamento do Cambuí", que no cap. 3 é o do vídeo mais bonito do Caio, de 1972. O leitor pode achar que é o mesmo imóvel.'
    correcao: '"O inventário resolve também a cena que o capítulo 6 descreveu: o horário reservado, o celular aberto e nenhuma ideia." Trocar "que mantinha desde o capítulo 6" por "que mantinha havia alguns meses". Mudar o bairro da abertura (Taquaral, Castelo, Jardim Chapadão).'
  - criterio: aplicabilidade
    trecho: "{rotulo: \"Guardei o inventário onde eu produzo\", ajuda: \"A lista está no caderno de campo, e não só na memória.\", pontos: 2}"
    por_que: 'Pela lição cap01-r1, todo item do checklist precisa de um campo correspondente na oficina. Nenhum campo da oficina registra onde o inventário foi guardado. Além disso, Otávio "achou catorze" perguntas, abaixo do mínimo de quinze que o critério cobra, e o texto não comenta a diferença.'
    correcao: 'Acrescentar ao fim do campo 01 uma linha curta: "Onde esta lista vai morar (caderno, nota fixada, pasta):". Dar ao Otávio dezessete perguntas, ou dizer que ele parou em catorze e completou a lista na semana seguinte.'
  - criterio: clareza
    trecho: "- Ela propõe uma pergunta melhor."
    por_que: 'Nas questões 03 e 04, a alternativa correta é visivelmente a mais curta ("Ela propõe uma pergunta melhor." e "Percebendo o que sempre recusava."), o que a entrega por forma. A lição cap01-r1 pede opções de comprimento parecido.'
    correcao: 'Q3 a: "Ela troca a pergunta feita por outra, mais útil para quem perguntou." Q4 d: "Percebendo, na própria resposta, o que ele sempre se recusava a fazer." Rever a Q4 se a posição mudar conforme o primeiro problema.'
edicoes_de_linha:
  - 'É ali que a escova não está chegando. -> É ali que o fio não está chegando. (a resposta acabou de dizer que sangra "porque o fio não passou ali por semanas")'
  - 'Caio atravessou a sala contando os passos, parou diante da parede que separava os dois cômodos e esperou. -> Caio mediu a sala com o passo até a parede que separava os dois cômodos e esperou. (a frase original é idêntica à do cap. 11)'
  - 'Nunca tinha pensado nisso como opinião, porque para ele era só o jeito certo de trabalhar. -> Para ele, era só o jeito certo de trabalhar. (repete a batida "nunca tinha pensado nela como assunto" da p. 12)'
  - 'Dezenove perguntas em três níveis dão cinquenta e sete peças. -> Dezenove perguntas em três níveis dão até cinquenta e sete peças. (o próprio texto diz que nem toda pergunta tem os três níveis)'
  - 'toda semana aparece uma pergunta nova, ou uma variação de uma antiga, e o estoque se renova antes de acabar -> a cada duas semanas aparece uma pergunta nova, ou uma variação de uma antiga, e o estoque se renova antes de acabar (alinhar com a legenda da figura 14.2 e refazer a curva)'
  - 'A facilidade com que você responde é sinal de que a resposta está madura, e não de que ela vale pouco. -> A facilidade com que você responde é sinal de que a resposta está madura. (tira a antítese do ", e não")'
  - 'Por isso vale guardá-lo para as perguntas que você mais ouve. -> Guarde-o para as perguntas que você mais ouve.'
  - 'E o critério para respondê-la, que a pessoa pode usar sozinha. -> O critério para respondê-la, que a pessoa pode usar sozinha. (esqueleto, 4ª parte)'
  - 'subtitulo: O assunto mais valioso da sua área é o que você responde toda semana sem perceber -> O assunto mais valioso da sua área é o que você já responde toda semana (evita a viúva "perceber" na abertura)'
diagramacao:
  - 'p020: o campo 01 tem 10 linhas para 15 perguntas "uma por linha", e sobram cerca de 15% da página. Passar para 15 linhas numeradas.'
  - 'p021: os campos 03, 04 e 05 têm 3 linhas cada, e cerca de 30% da página fica em branco abaixo do "Confira antes de seguir". Dar 4 linhas aos campos 04 e 05.'
  - 'p013: cerca de 30% em branco no pé. A figura 14.1 desceu inteira para a p014, e o parágrafo seguinte ("Há um cálculo...") não subiu para ocupar o espaço. Permitir que o texto corrente flua antes da figura ou posicioná-la no topo da p014 com o texto preenchendo a p013.'
  - 'p014: cerca de 18% em branco no pé, porque a tabela 14.1 desceu para a p015.'
  - 'p015: cerca de 25% em branco no pé, porque o box "Na prática" desceu para a p016.'
  - 'p018: cerca de 22% em branco no pé, com o último parágrafo da prosa partido e duas linhas empurradas para a p019. Nada justifica esse branco: o box "Para guardar" cabe na p019 de qualquer modo. Verificar orphans/widows e o keep-with do .guardar (mesma pendência de QA registrada para cap10 e cap22).'
  - 'p017: a figura 14.2 não tem valores no eixo nem nos extremos das linhas. O leitor não vê 57, 31 ou 5, e a legenda fala em "um ano de publicação" sem número visível. Rotular os pontos inicial e final de cada série.'
  - 'p011: o subtítulo quebra deixando "perceber" sozinho na segunda linha.'
  - 'p017: "dezenove." sozinha na última linha do parágrafo, logo antes do intertítulo. Ajuste fino, se sobrar tempo.'
veredito: "Bom capítulo, com o melhor nível crítico do livro até aqui, mas reprovado por uma figura cuja aritmética contradiz o próprio texto, por contradizer o cap. 12 e gastar a recusa reservada ao cap. 18, por repetir cenas dos caps. 3 e 11 e por uma oficina que pede quinze perguntas em dez linhas."
