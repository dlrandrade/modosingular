bloqueadores: []
pontos_fortes:
  - 'Quase tudo o que a r3 cobrou no texto foi resolvido. A mãe saiu da faxina, e com ela o eco mais visível do cap. 13 ("a faxina do apartamento que ela aluga por temporada, quatro horas de joelhos e curvada entre a saída de um hóspede e a chegada do outro"). A analogia do Otávio agora põe o fato acima do papel ("O que convence é a sequência de fatos, o ponto batido, a escala, a testemunha que viu") e prepara o cap. 16 sem gastar a frase dele. O critério da p. 13 deixou de ser tautológico, e o parágrafo do sigilo separa o detalhe que ensina do dado que identifica: "A faxina de joelhos ficou, porque era o que ensinava; o apartamento de temporada, o banheiro e a varanda sumiram, porque identificavam demais."'
  - 'O caso comum continua sendo o melhor do livro nesta função, e a seção dos quatro tempos ensina a ordem pelo próprio caso: "Contar isso primeiro faz quem ouve reconhecer a própria tentativa; se a história começasse pelo sábado, a lição pareceria óbvia." É uma régua de ofício de escrita que um leitor apressado consegue repetir.'
  - 'A oficina leva a advogada de família até o fim com régua explícita ("porque atraso com mês marcado costuma ter um motivo, e o motivo decide o caminho"), e o sigilo virou condição eliminatória verificável no papel ("Sem este item, a peça não sai, qualquer que seja o total"). A verificação tem distratores agora inequivocamente falsos e corretas em posições variadas (b, c, a, d).'
  - 'O exemplo do veterinário ficou tecnicamente limpo e completo nos quatro tempos, com o porquê no lugar certo: "Perguntei por onde eles passeavam, porque alergia de ração não escolhe hora."'
problemas:
  - criterio: coerencia
    trecho: "O padrão fez o resto: qualquer pessoa com dor de segunda-feira se reconheceria, e nenhuma se veria exposta."
    por_que: 'É quase a mesma frase que fecha o raciocínio de sigilo do cap. 13, dois capítulos antes: "se o lesse, ela se reconheceria no domingo, como qualquer pessoa, mas não se veria exposta." Somada ao que sobrou do eco já apontado na r3 (um sintoma com dia da semana ligado ao fim de semana, "a paciente das cinco da tarde" / "a paciente das segundas", o gesto de cortar e manter do cap. 13: "Cortou o ferro, a mãe e a porta. Ficou com o domingo, a tarde e o aperto"), a frase faz o leitor atento sentir que o parágrafo do sigilo é o do cap. 13 reescrito. A lição cap02-r1 vale para formulações-chave, não só para cenas.'
    correcao: 'Fechar o parágrafo com um ganho próprio do cap. 15, que é o padrão como proteção: "O padrão fez o resto: a peça descreve dezenas de pacientes, e por isso não descreve nenhuma." Ou cortar a última frase: o parágrafo já termina bem em "porque identificavam demais."'
  - criterio: coerencia
    trecho: "Na sexta, no consultório, um paciente que chegava toda semana com dor de segunda-feira perguntou, antes de deitar na maca, se o futebol de sábado contava."
    por_que: 'A edição pedida na r3 para desambiguar criou um furo de enredo (lição cap03-r3). O capítulo diz que Renata "tinha visto a dor das segundas em dezenas de pacientes", que o jogo de futebol é uma das "versões diferentes do sábado" e que ela investiga a rotina antes de mudar o tratamento. Um paciente em tratamento com ela, que chega toda semana com dor de segunda, e que nunca ouviu a pergunta sobre o sábado desmente o critério que a peça acabou de provar. A frase também não diz como ele chegou à peça.'
    correcao: '"Na sexta, no consultório, um paciente que tinha ouvido a peça no caminho perguntou, antes de deitar na maca, se o futebol de sábado contava." Ou, se a ideia é mostrar que a peça chega a quem ainda não é paciente: "Na sexta, um paciente novo, na primeira avaliação, perguntou se o futebol de sábado contava. Tinha ouvido a peça na véspera."'
  - criterio: voz
    trecho: "Uma conclusão a que a pessoa chegou sozinha vira dela, e ninguém discute a própria conclusão."
    por_que: 'A frase é seguida, oito linhas abaixo, pelo box Conceito que diz o mesmo ("Quando alguém chega sozinho a uma conclusão, ela passa a ser dele."), depois de a epígrafe já ter dito ("Um caso deixa a pessoa concluir sozinha") e antes de o Para guardar 1 repetir ("Um caso deixa a pessoa concluir sozinha, e a conclusão passa a ser dela"). Na página 13, prosa e box ficam lado a lado com a mesma ideia e quase as mesmas palavras (lição cap02-r1: a mesma ideia no máximo duas vezes; a terceira traz ganho novo).'
    correcao: 'Cortar a frase da prosa e terminar o parágrafo em "Descreve o que aconteceu, e quem lê conclui que ela investiga a rotina." O box faz o fecho conceitual. Se quiser manter algo na prosa, dar o ganho que o box não tem: "E ninguém pede prova de uma conclusão que tirou sozinho."'
  - criterio: voz
    trecho: "Se sente admiração por você, o caso foi de vaidade, ainda que verdadeiro e bem escrito. Se sente que aprendeu a enxergar alguma coisa, foi um caso-prova. A admiração raramente faz alguém procurar um profissional; a sensação de ter entendido o próprio problema faz."
    por_que: 'Duas antíteses espelhadas em sequência, a segunda refazendo a primeira (admiração x entendimento), num parágrafo de quatro frases (lição cap01-r1: no máximo uma antítese explícita por seção). O par admiração x outra coisa já tinha sido gasto na abertura da seção 2 ("A do senhor da cadeira de rodas pede admiração. A da paciente das segundas pede que a pessoa olhe para o próprio calendário."), e a seção 2 ainda soma "O caso raro prova [...] O caso comum, bem contado, prova" e "Contado cedo demais, o milagre parece propaganda. Depois de meses [...], parece consequência": três antíteses paralelas numa seção de cinco parágrafos.'
    correcao: 'No coadjuvante, manter o teste e trocar a segunda antítese por consequência afirmativa: "Se sente que aprendeu a enxergar alguma coisa, foi um caso-prova, e é essa sensação de ter entendido o próprio problema que leva alguém a procurar um profissional." Na seção 2, ficar com raro x comum (é a da fonte) e desmontar a do milagre: "Contado cedo demais, o milagre parece propaganda; depois de meses de raciocínio acompanhado em público, passa a ser lido como consequência dele." ou simplesmente "Contado depois de meses de raciocínio acompanhado em público, o milagre deixa de parecer propaganda."'
  - criterio: originalidade
    trecho: 'Aquela história provava que Renata era capaz de resolver o raro. [...] O caso raro prova que você resolve o raro, e ninguém que lê acha que tem o problema raro. [...] a lição do senhor da cadeira de rodas não se transfere. [...] um critério que servia a ele e a quase mais ninguém.'
    por_que: 'A ideia "o caso do senhor não serve a quem lê" aparece quatro vezes na prosa (p. 12, p. 14 duas vezes, p. 17) e uma quinta na legenda da figura 15.1 ("mostra um critério que serve a poucos"). A p. 14 ainda remete à p. 12 ("pelo motivo que Renata percebeu ao transcrever o próprio áudio") e a repete em seguida. Só a da p. 17 traz ganho (o que sobra ao cortar os adjetivos). O leitor sente o capítulo girando no mesmo ponto no meio do livro.'
    correcao: 'Na p. 14, cortar a repetição do segundo parágrafo depois da figura: "A paciente de quarenta e poucos anos era um exemplo de um padrão, e o padrão é o que torna o caso útil a quem lê." (sem o "a lição do senhor [...] não se transfere"). E, no parágrafo do instinto, trocar a remissão por avanço: "Para quem ainda está começando a ser conhecido, é a pior escolha: o caso raro prova que você resolve o raro, e ninguém que lê acha que tem o problema raro."'
  - criterio: aplicabilidade
    trecho: '{rotulo: "Passei no teste do coadjuvante", ajuda: "Cortei os adjetivos sobre mim (campo 06); quem lê aprende a enxergar.", pontos: 2}'
    por_que: 'O item vale 2 pontos, mas o campo 06 só cobre os adjetivos. A segunda metade do teste, a que dá nome ao item ("quem lê aprende a enxergar"), não tem campo nem critério verificável no papel (lições cap01-r1 e cap03-r3). O leitor marca o item por impressão. O campo 02 também é o único dos quatro tempos sem exemplo de ofício ("O que parecia óbvio, e o que a pessoa já tinha tentado."), e a advogada que atravessa 03 a 05 começa sem a situação.'
    correcao: 'Campo 06: "Os adjetivos que você cortou, e o que quem lê passa a enxergar", com 2 linhas e o exemplo "Complexo, delicado, gratificante… / Quem lê passa a olhar para os meses dos atrasos, e não só para o valor." Ajuda do checklist: "Cortei os adjetivos e escrevi o que quem lê passa a enxergar (campo 06)." Campo 02: "A advogada: “Ela chegou certa de que era calote e queria entrar com a execução; já tinha cobrado o ex por mensagem três vezes.”"'
  - criterio: concretude
    trecho: "a faxina dividida entre sábado e domingo"
    por_que: 'A faxina acontece "entre a saída de um hóspede e a chegada do outro". Se o hóspede seguinte entra no sábado, não há domingo para dividir. O leitor que aluga por temporada (há muitos entre profissionais liberais) nota o furo, justo no tempo 3, que o capítulo chama de "o conteúdo".'
    correcao: '"o rodo de cabo comprido no lugar do pano de joelhos, o banheiro antes e a varanda depois de um intervalo, e uma pausa a cada hora." Ou tirar a janela apertada da cena: "quatro horas de joelhos e curvada, todo sábado, antes de o próximo hóspede chegar no domingo".'
  - criterio: honestidade
    trecho: "O que o caso prova, no sentido mais estrito, é que o critério dela funciona: a dor lombar com dia marcado costuma ter a causa dois ou três dias antes, num esforço que na hora não doeu."
    por_que: 'O narrador passa a afirmar, em voz própria e com "costuma", uma regularidade clínica sobre dor lombar em geral. Dor que piora na segunda pode vir do próprio dia (a volta à cadeira do escritório, o trajeto), e um fisioterapeuta leitor lembra disso. Na p. 15 o critério está bem formulado como onde procurar ("procure o que você fez dois ou três dias antes"); aqui virou lei. "No sentido mais estrito" é enchimento.'
    correcao: '"O que o caso prova é que o critério dela funciona: quando a dor lombar tem dia marcado, ela procura dois ou três dias antes, num esforço que na hora não doeu."'
  - criterio: coerencia
    trecho: "O caderno de campo é o primeiro lugar, sobretudo as anotações que parecem sem importância."
    por_que: 'Renata não achou o caso no caderno de campo, e sim "na margem de uma ficha de avaliação de mais de um ano antes, a lápis". A frase recomenda um lugar e o caso-modelo mostra outro, sem que o texto ligue os dois.'
    correcao: '"O caderno de campo é o primeiro lugar, e as fichas antigas, com as anotações na margem, fazem o mesmo papel para quem ainda não tinha caderno."'
edicoes_de_linha:
  - 'A resposta veio sem nenhuma importância -> Ela respondeu como quem fala de nada (a p. 12 tem cinco "nenhum/nenhuma": "sem dificuldade nenhuma", "nenhuma cirurgia", "Nenhum dos pacientes", "sem nenhum milagre", "sem nenhuma importância")'
  - 'e que melhorou em cinco semanas sem nenhum milagre -> e que melhorou em cinco semanas, sem milagre'
  - 'Porque ele provava que ela resolvia o raro. -> Porque ele só provava que ela resolvia o raro. (sem o "só", a correta soa como elogio ao caso)'
  - 'leve à consulta a lista dos meses: é ela que mostra se o caminho é cobrar ou rever o acordo. -> leve à consulta a lista dos meses: é por ela que se decide se o caminho é cobrar ou rever o acordo. (a lista não mostra sozinha; o motivo é que decide, como diz o campo 04)'
  - 'esqueleto_rotulo: "Passe a limpo os campos 02 a 05, sem o que o campo 07 cortou" -> "Passe a limpo os campos 02 a 05, já sem nada que identifique alguém" (o campo 07 é uma grade de conferir; ele não corta nada)'
  - 'Esse tempo, o mais curto, pesa mais que os outros, porque resolver é o que se espera de qualquer profissional, e perceber -> Esse tempo, o mais curto, pesa mais que os outros: resolver é o que se espera de qualquer profissional, e perceber'
diagramacao:
  - 'p. 21: dois terços da página em branco depois das três regras, pela quarta rodada seguida. O esqueleto não é indivisível pela altura: são quatro faixas de cerca de 100 px, e a página tem cerca de 540 px livres. Se o gabarito não aceita separar esqueleto de Faça/Evite, inverter a ordem no bloco rede (regras, Faça/Evite, esqueleto, roteiro): o Faça/Evite (cerca de 180 px) sobe para a p. 21 e o esqueleto e o roteiro cabem juntos na p. 22.'
  - 'p. 14, figura 15.1: os rótulos do eixo vertical continuam assimétricos. "Mostra o seu critério" está na horizontal, acima do eixo, e "Não mostra critério" está girado 90°, embaixo. É a terceira rodada. A legenda também fica colada aos rótulos "Raro/Comum" do eixo horizontal; dar ao menos uma linha de respiro.'
  - 'p. 23, roteiro de fala: a lacuna "o critério" continua quebrando no fim da linha e deixa o artigo "o" sublinhado sozinho ("olhe primeiro para o / critério."). É a segunda rodada. Impedir a quebra dentro de lacunas curtas (white-space: nowrap até umas quatro palavras).'
  - 'p. 15: cerca de 20% da página em branco no pé, porque a figura 15.2 não coube e desceu para a p. 16. Pôr a figura logo depois do primeiro parágrafo de "Os quatro tempos" (antes de "No áudio novo..."), para que a prosa preencha o pé da p. 15 e a figura funcione como mapa antes do percurso.'
  - 'p. 16/17: o box "Na prática" agora quebra entre "O comum" e "O singular", o que resolve o branco apontado três vezes. Está aceitável.'
veredito: "Resolveu o que a r3 cobrou no texto e está a um passe de linha do 9: falta tirar a frase de sigilo quase copiada do cap. 13, consertar o paciente que desmente o critério da Renata na cena final, enxugar a ideia repetida (conclusão sozinha, caso raro) e, na diagramação, acabar com o branco da p. 21, que já está na quarta rodada."
