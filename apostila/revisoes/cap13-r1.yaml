capitulo: 13
iteracao: 1
notas: {metodo: 8.2, voz: 8.6, originalidade: 8.4, clareza: 8.5, ritmo: 8.6, concretude: 8.7,
        coerencia: 7.9, aplicabilidade: 8.5, impresso: 8.8, honestidade: 8.6}
bloqueadores:
  - 'Contradição com o método e problema ético no caso-modelo, no capítulo que o plano reserva para "Sigilo e códigos de ética". A sessão é numa quinta de maio; "Lúcia publicou o texto do domingo na terça seguinte, às oito, no horário de sempre". Uma paciente em terapia ativa, que cinco dias antes descreveu o aperto de domingo, lê um texto sobre o aperto de domingo e se reconhece. Ninguém de fora a identifica, mas ela mesma, sim. O próprio capítulo cobra o contrário: o critério da oficina exige que nada permita "reconhecer alguém, nem a própria pessoa"; a regra 1 da rede é "Desloque o tempo, sempre"; a prosa diz "esperar até que ele se torne um padrão". A cena final ainda ensina que a preocupação era à toa ("a espera tinha sido desnecessária"). O leitor de saúde e de psicologia aprende pelo exemplo que cinco dias bastam.'
pontos_fortes:
  - 'Os dois cadernos da Lúcia ("O de sessão fica trancado na gaveta do consultório e guarda o que pertence a cada paciente") transformam a fronteira do sigilo num objeto físico. O fecho retoma a imagem sem moral: "a música da televisão da vizinha continuava no caderno trancado, onde pertencia".'
  - 'A regra "a frase mais bonita da sessão é, quase sempre, a que mais identifica", com a explicação em cadeia ("Ela é bonita porque é particular, e é particular porque é da pessoa"), é a formulação mais memorável e operacional do capítulo. Supera a fonte.'
  - 'O parágrafo sobre a autorização é adulto e raro em livro do gênero: "Numa relação de cuidado, dizer não ao profissional que cuida de você é difícil, e a autorização dada nessas condições pode não ser tão livre quanto parece." Ele dá ao leitor de saúde uma razão ética, e não só jurídica.'
  - 'Na oficina, a grade "Tirei / Não havia" transforma despersonalizar numa conferência item por item, verificável no papel. Os quatro itens do checklist remetem a campos numerados que existem (01 a 05, 02, 04, 06).'
problemas:
  - criterio: metodo
    trecho: 'Lúcia publicou o texto do domingo na terça seguinte, às oito, no horário de sempre.'
    por_que: 'Ver bloqueador. O caso composto protege contra terceiros; contra a própria paciente, o que protege é o tempo, e é justamente a proteção que o capítulo ensina e a personagem não usa. Em psicologia, uma paciente que suspeita ter virado assunto do texto da terapeuta pode ter o vínculo abalado. A paciente não mencionar nenhum texto na sessão seguinte não prova nada, e o capítulo apresenta isso como desfecho feliz.'
    correcao: 'Faça a Lúcia esperar e diga por quê. Por exemplo: "Guardou as quatro operações numa folha dentro do caderno de campo e esperou. A paciente das cinco da tarde tinha falado do domingo naquela semana; um texto sobre o domingo cinco dias depois seria um recado, por mais limpo que estivesse. Publicou em julho, numa terça às oito, quando o assunto já tinha aparecido em outra sessão, com outra pessoa." Reescreva o último parágrafo: em vez de "a espera tinha sido desnecessária", um ganho novo (por exemplo, uma resposta de leitora que ela guarda sem nome). Acrescente a regra à seção do sigilo: "Desloque também a data da publicação: nunca na semana do atendimento."'
  - criterio: clareza
    trecho: 'Algumas pessoas sentem o domingo acabar às seis da tarde'
    por_que: 'A tabela 13.1, que demonstra o método, contradiz a si mesma: a coluna ao lado diz "Tirou horário exato", e o horário exato da paciente ("por volta das seis da tarde") continua na frase despersonalizada. O Isolar também sai trocado. A prosa isola como "uma pessoa descreveu uma angústia que começa no domingo à tarde e antecipa a semana" e na frase seguinte define "Isolar é isso, dizer o que aconteceu numa frase curta, antes de qualquer interpretação". "Antecipa a semana" já é a interpretação, é o padrão da etapa 3. O leitor apressado sai sem saber onde uma etapa termina e a outra começa.'
    correcao: 'Tabela, Despersonalizado: "Algumas pessoas sentem o domingo acabar antes da hora, no fim da tarde". Prosa: "A primeira foi fácil: uma pessoa sente um aperto que começa no domingo à tarde." (igual à linha Isolado da tabela). Tabela, Generalizado/O que fez: "Perguntou do que aquilo era exemplo e juntou outros dois casos" (a composição serve ao sigilo e ao padrão; hoje a tabela a põe só no padrão).'
  - criterio: coerencia
    trecho: 'O de campo, que ela começou no capítulo 6, fica na bolsa e guarda crenças, perguntas e padrões, sempre sem nome.'
    por_que: 'Três choques com capítulos aprovados. (1) A lista da Lúcia começou no cap. 2 ("Naquela semana, Lúcia abriu uma nota no celular"), e o cap. 6 confirma: "Lúcia percebeu isso no capítulo 2, quando começou a anotar no celular". Não começou no 6, e é nota de celular, não objeto "na bolsa". (2) "o de campo só recebia o que vinha de fora da sala" desmente o cap. 2, onde ela anota "as perguntas e as crenças com que os pacientes chegavam", e o cap. 9/12, cujo repertório é "O paciente que volta em março dizendo que estava tudo bem até o carnaval", um padrão de dentro da sala. (3) A "regra que se impôs no dia em que decidiu sair do silêncio: nada que venha de dentro da sala de atendimento" não aparece no cap. 2 e é desmentida por ele: a primeira peça dela nasce da Débora.'
    correcao: 'Troque por: "O de campo, a nota no celular que ela abriu no capítulo 2, guarda crenças, perguntas e padrões, sempre sem nome, nunca um episódio. Até aquela quinta-feira, a fronteira tinha sido fácil de manter: o que atravessava era a crença que o paciente trazia de fora, nunca o que ele vivia dentro da sala." A regra do parágrafo seguinte vira: "nenhuma cena de sessão, só as crenças que chegam com os pacientes".'
  - criterio: originalidade
    trecho: 'quando a televisão da vizinha começava a tocar a música de abertura do programa de domingo à noite, do outro lado da parede'
    por_que: 'Para um leitor brasileiro, "a música de abertura do programa de domingo à noite" é a do Fantástico, e a angústia de domingo associada a ela é um lugar-comum nacional, repetido em piada, meme e crônica. O capítulo apoia a lição central nesse detalhe ("a imagem mais bonita da história e, por isso mesmo, a mais perigosa"), e ele é, ao contrário, o menos identificável e o menos original da cena. Por isso "Nunca tinha ouvido uma descrição tão precisa" soa falso. O padrão final ("A angústia do domingo é a semana chegando antes da hora") também passa perto do teste do horóscopo que o próprio capítulo propõe.'
    correcao: 'Troque a música por um detalhe de fato particular, que só aquela pessoa diria. Por exemplo: "quando a mãe dela, do quarto ao lado, começava a passar as camisas da semana, e o cheiro do ferro atravessava a porta". Mantenha "a vizinha/a parede" só se continuarem idiossincráticos. Afine o padrão para algo que a Lúcia vê e o senso comum não diz. Por exemplo: "o aperto do domingo costuma ser maior em quem descansou bem no sábado: é a perda antecipada do descanso, não o medo do trabalho". Assim ele fica menor que uma obviedade, como o capítulo exige.'
  - criterio: coerencia
    trecho: 'As respostas às perguntas da amiga, que eram traduções de uma conversa, custavam em torno de setenta minutos.'
    por_que: 'Dois problemas. (1) O projeto fixou que "tradução de formato" (fala→texto, caps. 5 e 7) é outra coisa que "tradução" (episódio→peça, cap. 13). Responder por áudio à pergunta da amiga e passar a limpo é exatamente tradução de formato. Chamar aquilo de "traduções de uma conversa" mistura os dois termos no capítulo que define o segundo, e a figura 13.1 compara "responder a uma pergunta" com "escrever do zero", não "episódio da prática" com "criação". (2) O cap. 8 fecha março dizendo que "o relógio marcou menos de uma hora"; em maio, "em torno de setenta minutos" anda para trás sem explicação.'
    correcao: 'Use como origem um episódio da prática que ela já tenha publicado (por exemplo, a crença da Débora do cap. 2 ou uma pergunta da lista de crenças): "As peças que partiam de uma crença anotada no caderno custavam menos de uma hora desde março." Rótulo da figura: "Partindo de um episódio anotado: 55 min" (ou o número que fechar com o cap. 8). Não use "tradução" para a resposta à amiga.'
  - criterio: aplicabilidade
    trecho: 'tempo: 30'
    por_que: 'O capítulo desmente o tempo da oficina. A Lúcia, treinada, faz as quatro operações numa manhã ("Na sexta de manhã") e diz que a segunda "foi a que mais tempo levou", e as peças dela custam cerca de setenta minutos. O leitor de primeira viagem precisa escolher um episódio, preencher seis campos e montar a peça em sete linhas, tudo em 30 minutos. A lição cap08-r1 pede tempo honesto e tempo_nota quando a oficina produz uma peça.'
    correcao: 'tempo: 45, com tempo_nota: "mais o tempo de passar a peça a limpo". Ou mantenha 30 e troque a entrega por "as quatro operações feitas e um rascunho da peça"; o passar a limpo fica na rede.'
  - criterio: aplicabilidade
    trecho: '“Se disseram que não tem jeito, pergunte: não tem jeito, ou não tem jeito com o que essa pessoa faz?”'
    por_que: 'O exemplo do critério, dito por uma veterinária, é uma indireta ao colega que desenganou o animal, e a lição cap01-r2 proíbe isso em exemplos de "Faça assim". Além disso, os cinco exemplos da oficina são da mesma veterinária. A cadeia tem valor didático, mas o gabarito de estrutura pede "profissões variadas", e o campo 04 ("Muita gente convive anos com um problema que tem solução, porque ninguém explicou") fica perto da obviedade que o critério 2 manda evitar.'
    correcao: 'Campo 05: "“Antes de decidir pela idade do animal, pergunte o que, no exame dele, torna a cirurgia arriscada.”" Campo 04, mais estreito: "Tutores de cães idosos costumam decidir pela idade do animal, e não pelo exame." Se quiser variar profissões sem quebrar a cadeia, dê um segundo exemplo curto, de outra área, no campo 02 ou no 03.'
  - criterio: honestidade
    trecho: 'titulo: Sempre seguro'
    por_que: 'O título promete uma segurança absoluta que o próprio capítulo nega duas páginas depois: em Caruaru, "o tipo de empresa e o tipo de problema bastariam para alguém reconhecer o caso". Um caso composto de três pacientes com uma condição rara, numa cidade pequena, continua identificável. A mesma coluna traz "“com alguma frequência”" como exemplo de tempo deslocado, e isso é frequência, não tempo.'
    correcao: 'Título: "Mais seguro". Item 3: "O tempo deslocado: “há alguns anos”, “certa vez”." Acrescente ao parágrafo do caso composto: "Numa cidade pequena ou num caso raro, nem ele basta; aí a saída é esperar ou escolher outro caso."'
  - criterio: voz
    trecho: 'É o jeito como quase todo especialista pensa'
    por_que: 'Há generalizações sem fonte sobre terceiros acima do limite de 2 (lição cap01-r4/cap02-r2): esta; "quem tenta generalizar antes de despersonalizar costuma levar para o padrão os detalhes do caso"; "pular uma delas é a forma mais comum de errar"; "o atalho é quase sempre a tentação"; e o intertítulo "A operação que quase todo mundo pula". Há também duas antíteses explícitas na mesma seção "A linha que não se cruza" ("O sigilo não impede a tradução. Impede o atalho" e "Não é ficção [...] É agregação"), contra o limite de uma por seção.'
    correcao: 'Troque por "É o que a expressão “criar conteúdo” faz pensar: algo que sai pronto..."; "e pular uma delas estraga a peça de um jeito previsível"; intertítulo "A operação que falta" ou "Do que isso é exemplo". Na seção do sigilo, mantenha "Não é ficção [...] É agregação" e reescreva a outra: "O sigilo não impede a tradução; fecha o atalho de publicar o caso como ele aconteceu, com o nome trocado e mais nada."'
  - criterio: concretude
    trecho: 'Os outros personagens fazem a mesma operação nos seus ofícios.'
    por_que: 'Este é o único parágrafo sem chão, e é um catálogo. "Caio transforma uma parede em muitas paredes" é bonito e vazio (qual parede, qual padrão?). "Otávio transforma a demissão mal documentada de um cliente numa peça" sugere uma publicação do Otávio antes do cap. 16, com as publicações suspensas desde o cap. 4 (lição cap04-r1). A frase da Renata ("dor que muda com o movimento") é o único exemplo com padrão enunciado.'
    correcao: 'Fique com um exemplo inteiro em vez de três pela metade, ou dê a cada um o padrão em palavras. Otávio: "...numa lição, guardada no caderno, sobre o que acontece com toda advertência escrita às pressas". Caio: "uma parede que o cliente achava estrutural vira uma lição sobre como saber, antes de quebrar, se uma parede segura alguma coisa" (sem gastar a pergunta do cap. 14).'
  - criterio: ritmo
    trecho: 'publica um caso interessante que serve para uma pessoa só: a que o viveu, e que nem vai lê-lo.'
    por_que: 'A última seção junta três coisas diferentes: a teoria do generalizar, o catálogo dos outros personagens e o desfecho da cena da Lúcia. O intertítulo só cobre a primeira (lição cap01-r2: a seção não vira depósito). O fecho da cena chega sem transição depois do catálogo. A frase citada também contradiz a seção anterior, em que o risco é justamente que a paciente leia ("Se a paciente lesse o texto").'
    correcao: 'Corte "e que nem vai lê-lo". Separe o desfecho com um intertítulo próprio ("A terça às oito" ou "O que atravessou") ou devolva-o à seção do sigilo, logo depois do parágrafo "A regra mais importante...", onde ele fecha o fio do caderno trancado.'
  - criterio: voz
    trecho: 'Mas vale pesar o que o pedido significa para quem o recebe.'
    por_que: 'Narrador que aconselha em fórmula de curso. Repete-se em "vale ler o seu antes de publicar" e na rede ("então vale falar"). O item da rede ainda é metadiscurso sobre publicar, e não fala da área do leitor (lição cap01-r1).'
    correcao: '"Mas pese o que o pedido significa para quem o recebe." / "leia o seu antes de publicar qualquer peça" / Faça assim: "“Já vi isso acontecer tantas vezes que deixou de ser exceção.”"'
  - criterio: impresso
    trecho: 'O RECONHECIMENTO (p. 22, rótulo quebrado em "O" / "RECONHECIMENTO")'
    por_que: 'No esqueleto, a coluna de rótulos é estreita demais: o artigo fica sozinho numa linha. O rótulo "O caso" pede "Duas ou três linhas" e recebe duas. Na p. 21 sobram cerca de 60% em branco antes do esqueleto; é aceito pelo projeto, mas os três itens do "Faça assim / Evite" caberiam ali.'
    correcao: 'Alargue a coluna do rótulo ou use "RECONHECIMENTO" sem artigo nos quatro rótulos. Dê 3 linhas ao campo "O caso" ou mude o texto para "Duas linhas". Se o motor permitir, suba "Faça/Evite" para a p. 21 quando o esqueleto for para a página seguinte.'
edicoes_de_linha:
  - 'profissionais de saúde, advogados, psicólogos, contadores, consultores -> profissionais de saúde, advogados, psicólogos, contadores (consultores não estão sob sigilo legal; o parágrafo de Caruaru já os cobre)'
  - 'e que eu penso até hoje -> e em que eu penso até hoje (roteiro)'
  - 'unidade: minutos até publicar, medidos pela Lúcia -> unidade: minutos de trabalho por peça, medidos pela Lúcia (a barra de 180 min nunca foi publicada)'
  - 'Nomear o que se antecipa, escreveu, costuma diminuir o tamanho do aperto -> Nomear o que se antecipa, escreveu, às vezes diminui o tamanho do aperto'
  - 'O que me marcou não foi o desfecho. Foi perceber que -> O que me ficou foi perceber que (o caso composto nem sempre tem desfecho, e a antítese é dispensável)'
  - 'Quando for o caso, diga a quem lê que está juntando situações parecidas -> Diga a quem lê que está juntando situações parecidas, e faça isso na primeira linha (e mostre a Lúcia fazendo: "Tinha doze linhas, começava por “juntei aqui o que ouvi de algumas pessoas”...")'
  - 'Tinha doze linhas, uma pergunta no fim e nenhum detalhe de ninguém. -> manter, acrescentando a frase de abertura que declara o caso composto (coerência com a regra do próprio capítulo)'
diagramacao:
  - 'p. 22: rótulo do esqueleto quebra em "O" / "RECONHECIMENTO"; o artigo fica órfão.'
  - 'p. 22: "O caso" pede "Duas ou três linhas" e tem 2 linhas de escrita.'
  - 'p. 21: cerca de 60% da página em branco depois das 3 regras, antes do esqueleto indivisível (aceito pelo projeto); o "Faça/Evite" caberia ali.'
  - 'p. 13, figura 13.1: a barra "Criada do zero: 180 min, sem terminar" ocupa a largura toda sob a unidade "minutos até publicar", e essa peça nunca foi publicada; ajustar a unidade.'
  - 'p. 18: meia página em branco antes da oficina (aceito pelo projeto: a oficina começa em página nova).'
veredito: 'Capítulo bem escrito, com a melhor lição de sigilo do livro até aqui, mas a própria Lúcia publica o caso cinco dias depois da sessão, contra o critério que a oficina cobra; isso, a tabela 13.1 que se contradiz e os choques com os caps. 2, 6 e 8 impedem a aprovação.'
