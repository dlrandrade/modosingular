capitulo: 6
iteracao: 1
notas: {metodo: 8.6, voz: 8.4, originalidade: 8.8, clareza: 8.8, ritmo: 8.6, concretude: 9.0,
        coerencia: 7.8, aplicabilidade: 8.0, impresso: 8.6, honestidade: 8.4}
bloqueadores:
  - 'Roteiro de fala põe na boca do leitor uma indireta a colegas: "é sinal de que quase ninguém está explicando isso direito". Viola a lição cap01-r2 (nunca indireta a colegas) e bate de frente com os códigos de publicidade de profissões regulamentadas, que vedam depreciar colegas. É o texto que o leitor vai dizer em voz alta, em público, com o próprio nome.'
pontos_fortes:
  - 'A terça-feira hora a hora é a melhor cena de abertura da Fase I até aqui: cada episódio tem detalhe de ofício exato e verificável ("cliente havia seis anos, perguntando se podia mandar embora um motorista que estava de férias"; "os próprios e-mails dele, que trouxe impressos, mostravam horário fixo, chefe e metas") e o modo do Otávio aparece sem ser nomeado ("respondeu em quatro parágrafos [...] primeiro o que não fazer, depois o que fazer, por fim o risco"). A virada "O estagiário saiu da sala com duas páginas de anotações. Otávio não anotou nada." faz o conceito inteiro numa imagem.'
  - 'O parágrafo que explica por que nada daquilo parecia conteúdo é de autor, não de curso: "Eram pedaços de trabalho, com nome de cliente, cheiro de fórum e pressa. [...] Tudo o que era dele parecia sujo demais para ser publicado." A arte do Dia do Trabalhador (ou equivalente) no calendário da agência é um contraste irônico e seco, no tom certo.'
  - 'O filtro ético entra cedo e sem sermão: "a pergunta sem o nome de quem perguntou, o padrão sem o caso, a decisão sem o cliente". O formato mínimo de captura (palavras exatas entre aspas + contexto + data) é a instrução mais útil do capítulo e é executável no mesmo dia.'
  - 'Lint limpo, zero travessão, frase média 17,3 com desvio 10,4. Figurantes (mecânico de motos, confeiteira) com detalhe próprio ("Dá para congelar bolo já com a cobertura?"), e o arco da Helena ganha um passo sem roubar cena ("Helena começou o dela na semana seguinte").'
problemas:
  - criterio: coerencia
    trecho: "No da Lúcia, sobram objeções e crenças, porque os pacientes chegam cheios delas. Caio coleciona casos, cada obra com a sua história. Renata acumula perguntas, quase sempre as mesmas, feitas com palavras diferentes. A fonte que mais aparece no seu caderno diz alguma coisa sobre o seu jeito de pensar"
    por_que: 'O parágrafo planta a correspondência fonte-modo e a planta errada. O cap. 7 (já rascunhado) diz: "Quem é oral acaba gravando áudios em vez de escrever [...] Quem é dialógico anota quase só perguntas; quem é narrativo anota casos". Lúcia é a dialógica (pensa RESPONDENDO) e Renata a oral. Aqui as perguntas vão para a Renata e as objeções para a Lúcia; o leitor que seguir a pista do cap. 6 chega ao cap. 7 com a leitura trocada. Além disso, a frase final anuncia a fase seguinte ("essa pista vai ser útil na próxima fase do livro"), narrador que sinaliza.'
    correcao: 'Alinhar com o cap. 7 sem revelar rótulos: "No caderno do Otávio, sobram decisões e opiniões, escritas por extenso, porque ele passa o dia pesando riscos. No da Lúcia, sobram perguntas, cada uma com a crença que veio junto. Caio coleciona casos, cada obra com começo, meio e fim. Renata quase não escreve: três palavras e uma seta, o resto ela explica em voz alta a quem estiver perto. O que mais aparece no seu caderno, e o jeito como aparece, diz alguma coisa sobre como você pensa." Cortar "e essa pista vai ser útil na próxima fase do livro".'
  - criterio: coerencia
    trecho: "Otávio pensou no que diria quando a agência voltasse a publicar, dali a algumas semanas, e concluiu que não tinha nenhuma ideia. O calendário que ela tinha sugerido para a retomada abria com uma arte comemorativa do Dia do Trabalhador."
    por_que: 'Dois problemas. (1) Datas: a regra de captura cita a mesma terça como "almoço, 14/5"; se a retomada está "dali a algumas semanas", ela cai em junho, e um calendário de retomada não abre com o 1º de maio, que já passou. (2) Arco: a lição cap04-r1 diz que as publicações ficam suspensas até o cap. 24, quando Otávio volta à agência com novo arranjo. "Quando a agência voltasse a publicar, dali a algumas semanas" cria no leitor a expectativa de uma retomada iminente que o livro não vai cumprir por dezoito capítulos (e o cap. 4 já deu "dois meses").'
    correcao: 'Tirar a retomada do horizonte próximo e acertar a data: "Às sete da noite, sentado no carro, Otávio abriu o e-mail que a agência tinha mandado por conta própria, um calendário para quando a pausa acabasse, e que ele ainda não tinha respondido. A primeira linha era uma arte de São João, com bandeirinhas e o logotipo do escritório. Naquele único dia, ele tinha vivido pelo menos sete peças publicáveis sobre a própria área. Não guardou nenhuma." (São João em junho é coerente com 14/5 e é Recife puro.)'
  - criterio: clareza
    trecho: "A testemunha que desmentiu o ponto era um caso. Os cartões de ponto mal controlados, um erro comum."
    por_que: 'O mapeamento das sete fontes não bate com a cena. A testemunha e os cartões de ponto são o mesmo episódio, contado duas vezes como fontes diferentes, enquanto o episódio mais claro de erro comum da terça fica órfão: "por que os clientes pequenos quase nunca guardam os recibos de pagamento, se eles pesam tanto nas ações". O leitor apressado, que usa este parágrafo como gabarito das sete fontes, aprende a classificação errada. A tabela diz que o erro comum é "O que as pessoas fazem antes de chegar a você", exatamente o caso dos recibos.'
    correcao: '"A testemunha que desmentiu o ponto era um caso. Os recibos que os clientes pequenos não guardam, a pergunta do estagiário, eram um erro comum." O resto do parágrafo fica como está.'
  - criterio: aplicabilidade
    trecho: "São dez itens ou mais, e nenhum foi descartado por parecer óbvio demais."
    por_que: 'A oficina não comporta o que exige. Os campos 02 a 06 têm 4+3+3+3+3 linhas, mas os campos 04 e 05 pedem um item só cada ("Um caso", "Uma decisão"), com três partes ("o que se esperava, o que aconteceu, o que você viu"). O máximo possível é 4+3+1+1+1 = 10, exatamente o piso, e só se cada linha dos campos 02 e 03 tiver um item. Faltam campos para duas das sete fontes (erro comum e opinião), o que torna o checklist incoerente: o rótulo diz "Reconheci as sete fontes na minha rotina" e a ajuda aceita "pelo menos quatro delas". A lição cap01-r1 exige campo correspondente para cada item do checklist.'
    correcao: 'Acrescentar um campo 07 "Erros comuns e opiniões: o que as pessoas fazem antes de chegar a você, e onde você discorda dos seus pares", com 4 linhas e exemplo em profissão nova (ex.: uma farmacêutica: "Guardam antibiótico que sobrou para a próxima vez."), ou transformar 02 a 07 numa grade de 12 linhas com a coluna "Fonte" para marcar. Trocar o rótulo do checklist para "Reconheci as fontes na minha rotina" (ajuda: "pelo menos quatro das sete, nos campos 02 a 07").'
  - criterio: aplicabilidade
    trecho: "capturando pelo menos dez itens reais ao longo de um único dia de trabalho."
    por_que: 'Tempo e procedimento ambíguos. O objetivo fala em "um único dia", o tempo diz "15 min" e o campo 02 pede "Perguntas que fizeram a você esta semana". O leitor não sabe se anota no livro durante o dia, se anota no caderno e passa a limpo, nem quando classifica por fonte (classificar na hora seria julgar, o que o próprio capítulo proíbe). O cap. 2 também prometeu, no campo de equívocos, que "no capítulo 6 eles entram no seu caderno de campo", e a oficina não recolhe essa promessa.'
    correcao: 'Abrir a oficina com uma instrução de duas frases: "Durante um dia de trabalho, anote no caderno de campo tudo o que aparecer, do jeito que vier. À noite, em quinze minutos, passe os registros para cá, cada um no campo da sua fonte; comece pelos quatro equívocos que você anotou no capítulo 2." Campo 02: "Perguntas que fizeram a você hoje (ou, se o dia foi fraco, nesta semana)".'
  - criterio: aplicabilidade
    trecho: "E se você também pensava assim, faz todo sentido: {por que a dúvida é razoável}."
    por_que: 'O roteiro não é a versão falada do esqueleto (lição cap01-r1). O esqueleto termina em "O critério: Como decidir sozinho da próxima vez"; o roteiro termina na normalização, que já tinha aparecido, e o critério some. Além disso, o roteiro obriga o leitor a afirmar um fato que pode não ser verdade ("Esta semana três pessoas diferentes me fizeram a mesma pergunta"); o "Faça assim" repete a fórmula.'
    correcao: 'Reescrever: "{quantas vezes e em quanto tempo você ouviu esta pergunta}, alguém me perguntou: {a pergunta, com as palavras de quem perguntou} / É das perguntas que eu mais ouço, e faz todo sentido: {por que a dúvida é razoável}. / A resposta é esta: {a sua resposta, com o detalhe que só quem faz sabe} / E da próxima vez, para decidir sozinho: {o critério}." No "Faça assim", trocar por "“É a pergunta que eu mais ouço neste mês. Vou responder com calma.”"'
  - criterio: voz
    trecho: "Nenhuma daquelas sete coisas parecia conteúdo, e o motivo é revelador."
    por_que: 'Cinco tiques de narrador que anuncia, acima do limite de sinalização (1) que o lint não pegou: "e o motivo é revelador"; "É exatamente por isso que serve de exemplo."; "O outro lado da frase também importa"; "A explicação real é outra."; "É aqui que entra o caderno de campo". Cada um anuncia o que a frase seguinte já faria sozinha.'
    correcao: '"Nenhuma daquelas sete coisas parecia conteúdo. Elas não se pareciam com nada do que a agência publicava." / Cortar "É exatamente por isso que serve de exemplo." / "Nem tudo que pode virar conteúdo deve virar." (sem o preâmbulo) / "A explicação costuma ser… A explicação real é outra." -> "Quem passa por isso culpa a inspiração. O que falta é contexto: quando você senta para criar conteúdo…" / "O caderno de campo entra aqui, e vai acompanhar você até o fim do livro." ou simplesmente "O instrumento é o caderno de campo, que…".'
  - criterio: ritmo
    trecho: "A primeira fase deste livro termina aqui, com um diagnóstico completo. A assimetria existe, o silêncio tem custo, a produção não substitui o pensamento, a voz não se terceiriza antes de ser descoberta, a constância depende de encaixe, e a matéria-prima nunca faltou."
    por_que: 'O fecho da prosa vira sumário de curso: lista os seis capítulos da fase e termina anunciando a Fase II ("é isso que o caderno de campo [...] vai ajudar a revelar"). A lição cap01-r1 manda fechar em consequência prática, sem listar seções. O recap também vem depois da citação do dossiê e apaga a melhor saída do capítulo, a frase da Helena e o "cuidado novo" do Otávio. O balanço da fase pertence à abertura da Fase II, não ao cap. 6.'
    correcao: 'Cortar o parágrafo inteiro. Pôr a citação do dossiê logo depois da seção "Por que a tela vazia trava" (ou antes do parágrafo da Helena) e terminar a prosa em "Helena começou o dela na semana seguinte." Se quiser uma consequência explícita: "Três semanas, vinte e seis linhas, nenhuma delas escrita diante de uma tela vazia."'
  - criterio: honestidade
    trecho: "Quase todo especialista que tentou publicar conhece a cena"
    por_que: 'Generalizações sem fonte sobre terceiros acima do limite de duas (lições cap01-r4/cap02-r2): "costuma ser mal entendida", "Quase todo especialista que tentou publicar conhece a cena", "A explicação costuma ser", "É por isso que tanta gente que “não tem ideias” produz", "Quem lê percebe a diferença sem saber nomeá-la". A legenda da figura 6.2 promete resultado: "Em poucas semanas, deixa de faltar ideia e passa a faltar tempo para usar todas."'
    correcao: 'Manter no máximo duas e passar as outras para o Otávio ou para o leitor: "Se você já tentou publicar, conhece a cena"; "É por isso que peças nascidas diante da tela vazia poderiam ser de qualquer colega". Legenda: "Esquema ilustrativo de um estoque que cresce sem esforço extra. Com algumas semanas de caderno, o problema pode deixar de ser falta de ideia."'
  - criterio: concretude
    trecho: "nota que as entregas por aplicativo mudaram o tipo de desgaste que aparece na oficina. Sete fontes, nenhum roteiro inventado."
    por_que: 'O exemplo do mecânico mostra quatro fontes (pergunta, erro comum, decisão, observação) e fecha dizendo "Sete fontes". É um erro de conta que o leitor atento pega na hora (lição cap01-r1: contas têm de fechar).'
    correcao: 'Ou completar (acrescentar objeção, caso e opinião em meia frase cada: "ouve que óleo sintético é desperdício em moto pequena; lembra da moto que chegou sem freio e com o dono jurando que era a pastilha; acha que revisão por quilometragem faz menos sentido que por uso"), ou fechar com "Quatro fontes num dia comum, nenhum roteiro inventado."'
  - criterio: coerencia
    trecho: "papel assinado vale pouco quando alguém em carne e osso conta outra história"
    por_que: 'Paráfrase da frase-marca reservada para o cap. 16 ("contrato assinado não é prova de nada"). A lição cap04-r1 proíbe gastar frases-marca antes da hora; aqui ela aparece com outra roupa, e o leitor do cap. 16 terá a sensação de repetição. O mesmo parágrafo e o seguinte repetem "de cor" ("o que já sabia de cor"; "uma audiência de 1998 que ele ainda lembra de cor"), e 1998 força a conta com "25 anos de prática" (cap. 4).'
    correcao: '"Otávio, que defendia a empresa, anotou mentalmente a lição que conhecia bem: cartão de ponto com horário sempre igual perde para quem conta o dia como ele foi." E trocar "uma audiência de 1998 que ele ainda lembra de cor" por "uma audiência do começo da carreira que ele ainda conta com detalhes".'
edicoes_de_linha:
  - 'do mesmo jeito que percebe a diferença entre uma carta escrita para ela e uma circular -> do mesmo jeito que percebe a diferença entre uma carta escrita para si e uma circular'
  - '"“Todo advogado só manda fazer acordo”, almoço, 14/5." -> Por exemplo: “Todo advogado só manda fazer acordo”, almoço, 14/5. (sem as aspas externas; hoje saem aspas duplicadas na página)'
  - 'Nenhum dos dois estava tentando criar conteúdo. Estavam trabalhando, e o trabalho entregou o assunto pronto. -> Os dois estavam trabalhando, e o trabalho entregou o assunto pronto. (evita mais uma antítese na mesma seção)'
  - 'Lúcia percebeu isso no capítulo 2 quando começou a anotar -> Lúcia percebeu isso no capítulo 2, quando começou a anotar'
  - '“Esta semana três pessoas me perguntaram a mesma coisa. Vou responder aqui.” -> “É a pergunta que eu mais ouço neste mês. Vou responder com calma.”'
  - 'Descartar uma pergunta por achá-la básica demais. É justamente a que mais gente tem. -> Descartar uma pergunta por achá-la básica demais. Quem a fez não achou.'
diagramacao:
  - 'p018: aspas duplicadas na abertura do exemplo de captura ("““Todo advogado só manda fazer acordo”, almoço, 14/5.”"). Vem das aspas retas externas do manuscrito.'
  - 'p016: cerca de um terço da página em branco depois do parágrafo "A captura também muda a qualidade..." porque o quadro comparativo foi inteiro para a p017. Branco evitável: deixar o parágrafo da Lúcia e do Caio subir antes do quadro, ou permitir que o quadro fique no pé da p016 com a seção seguinte começando depois.'
  - 'p021-p022: o terço inferior da p021 fica vazio (a seção de rede começa em página nova sem que o projeto exija) e a p022 tem só as três regras, com dois terços em branco antes do esqueleto. Começar a rede logo depois do "Confira antes de seguir" na p021 põe as regras ali e o esqueleto inteiro na p022, economizando uma página.'
  - 'p012: espaçamento comprimido na justificação em "no assunto.Otávio" (linha 4) e em "acordo”.Otávio" (linha 12); o espaço depois do ponto quase some. Conferir hifenização ou tolerância de espaçamento dessas linhas.'
  - 'p018, figura 6.2: o eixo vertical não tem rótulo nem unidade; o leitor não sabe que a área são anotações acumuladas. Acrescentar "anotações no caderno" como unidade.'
veredito: 'Cena de abertura excelente e conceito bem traduzido para o papel, mas reprovado nesta rodada: o roteiro de fala carrega uma indireta a colegas, o capítulo contradiz o cap. 7 na pista fonte-modo, a cronologia da agência não fecha e a oficina não cabe no que exige.'
