capitulo: 16
iteracao: 2
notas: {metodo: 9.0, voz: 8.7, originalidade: 8.8, clareza: 9.0, ritmo: 8.8, concretude: 9.2,
        coerencia: 8.3, aplicabilidade: 8.7, impresso: 9.0, honestidade: 8.9}
bloqueadores:
  - 'Sigilo e ética (contradição com o método que o próprio capítulo e os caps. 13 e 15 ensinam). O texto afirma que, "Com o tempo deslocado e os detalhes fora, sobrou a explicação, que serve a qualquer pequena empresa com prestador de serviço", mas a versão publicada, mostrada no bloco exemplo, ainda diz "Quem definia o horário dele? [...] Ele usava a camiseta da academia? Podia mandar outra pessoa no lugar num dia de folga?". O pretérito e o "dele" falam de um ex-prestador específico, e a palavra academia continua lá. Três semanas depois da reunião, com a ação em curso e Otávio como advogado constituído da ré, o instrutor e o advogado dele reconhecem o caso. Os códigos de publicidade da advocacia restringem justamente o uso de casos concretos, e a checagem do cap. 15 ("Aconteceu há tempo suficiente para ninguém se reconhecer pela data") não passaria. O raciocínio do calendário também mira a pessoa errada: "Uma dona de academia em Boa Viagem que lesse [...] se reconheceria pela data". A cliente já sabe que o caso é dela. O risco está em terceiros (o instrutor, os colegas dele, a parte contrária). Correção: (1) no exemplo, generalizar a versão cortada: "Quem define o horário? Quem chama a atenção quando ele chega atrasado? Ele usa a camiseta da empresa? Pode mandar outra pessoa no lugar num dia de folga?"; (2) no parágrafo do corte, incluir entre os itens cortados "a academia, trocada por empresa" e "o tempo do verbo, que contava a história de um só instrutor"; (3) reescrever a frase do calendário pelo lado certo: "Um instrutor que acabou de processar uma academia no Recife, lendo naquela semana um texto do advogado da academia sobre instrutor autônomo, reconheceria o próprio processo." Se quiser encurtar o problema, Otávio espera o processo terminar ou escolhe o e-mail de um cliente antigo, com caso encerrado.'
pontos_fortes:
  - 'Os dois bloqueadores técnicos da r1 foram resolvidos com precisão: "como prova de que não havia vínculo, não valia" está certo para um leitor advogado, e as perguntas agora "procuram um sinal de subordinação ou de pessoalidade". A fronteira com o cap. 14 ficou clara numa frase: "A pergunta recorrente diz o assunto; a explicação madura é a resposta que já passou por centenas de ouvintes e chegou à forma final."'
  - 'O bloco exemplo com a versão "melhorada" contra a testada mostra a tese na página: "Nos termos do artigo 3º da CLT, é fundamental que o empregador compreenda..." contra "Contrato assinado não é prova de nada. Sei que parece estranho, então vamos pelos fatos." O porquê ("a conclusão chega antes do artigo de lei") ensina.'
  - 'Fecho em ação, sem plateia e com ganho novo: as doze explicações na pasta de enviados, ligadas a assuntos plantados em capítulos anteriores (banco de horas do cap. 4, advertência escrita depois do cap. 13), e a palavra "prontas" no alto da página do caderno de capa preta.'
  - 'Imagens próprias e econômicas: "ninguém publica o próprio expediente", "um cozinheiro não pensa em fotografar o arroz", "O corte cuida do que está escrito; o calendário cuida do resto." A fig. 16.2 agora afirma no título ("Em vinte anos, a explicação ficou seis vezes menor") e se declara caso do personagem, não regra.'
problemas:
  - criterio: coerencia
    trecho: "disse a frase que diz a todo cliente novo, há mais de vinte anos"
    por_que: 'Contradiz a linha do tempo do próprio capítulo. Otávio tem 25 anos de prática; a primeira explicação foi "no segundo ano de escritório" (o e-mail de 2003, que a fig. 16.2 mostra sem a frase), e "A frase de abertura apareceu por acaso, uns cinco anos depois da primeira reunião". Isso dá uns dezoito anos de frase, não mais de vinte. O leitor atento que soma as datas da figura percebe o furo, e o erro cai justamente no caso central.'
    correcao: '"disse a frase que diz a todo cliente novo há quase vinte anos" (ou "há muitos anos"). Conferir que a fig. 16.2 (frase já presente em 2012) continua compatível.'
  - criterio: originalidade
    trecho: "a do apartamento em que a parede do banheiro escondia um cano de ferro de 1968"
    por_que: 'É a terceira vez que o livro usa o que está escondido dentro da parede do Caio: o cano de ferro dos apartamentos dos anos 70 (cap. 3), "a obra do Castelo em que uma parede fina [...] escondia a prumada de água do prédio inteiro" e "o cano de gás, a prumada de água" (cap. 14, dois capítulos atrás). A lição cap02-r1 proíbe repetir imagem entre capítulos, e o cap. 14 é quase vizinho. Além disso, "só percebeu quando o sócio a cronometrou" não explica por que cronometrar revelaria a repetição, e "Em oito anos, nenhum reclamou do orçamento quando a parede abriu" é resultado apresentado como fato, sem mostrar como se chega a ele.'
    correcao: 'Trocar a explicação do Caio por uma que não passe pela parede aberta, por exemplo "a de por que a obra parece parada na terceira semana", contada sempre pela mesma obra (a cliente que ligou achando que ele tinha sumido, quando a equipe passava a fiação por dentro do contrapiso), com a pausa no mesmo ponto. Trocar o gatilho por "só percebeu quando o sócio, que já tinha ouvido a história umas trinta vezes, terminou a frase por ele". Cortar a frase do "nenhum reclamou" ou reduzi-la à observação do sócio.'
  - criterio: aplicabilidade
    trecho: "Inteira, na ordem em que ela sai sozinha."
    por_que: 'O esqueleto da rede pede de novo abertura, explicação, comparação e fecho, com 2, 4, 2 e 1 linhas, depois de a oficina já ter pedido a explicação inteira em 14 linhas (campo 03) e a comparação em 2 (campo 04). Viola a lição cap02-r2 (quando a oficina já escreveu as partes, o esqueleto é "passe a limpo"). E aqui há um problema de método: fatiar e reescrever a explicação em 4 linhas é exatamente o "melhorar" que o capítulo proíbe. Quatro linhas não comportam uma explicação que "leva quatro minutos". O fecho, por sua vez, não é pedido em campo nenhum da oficina, porque o campo 03 manda transcrever "da frase de abertura até a comparação".'
    correcao: 'Usar esqueleto_rotulo: "Confira a explicação do campo 03 antes de publicar" e transformar o esqueleto em conferência, com 1 linha por parte: "A abertura: a mesma do campo 03?", "A comparação ou a pergunta: no mesmo ponto? (campo 04)", "O que saiu: só o do campo 05?", "O fecho: escreva aqui como você termina quando a pessoa entendeu" (2 linhas, porque é a única parte nova). Isso também libera espaço para o roteiro subir para a p. 22.'
  - criterio: aplicabilidade
    trecho: "Abrir pela frase ou pela pergunta com que você abre na vida real."
    por_que: 'Repete o primeiro item do Faça ("Começar pela frase de sempre, mesmo que fora da conversa ela pareça brusca."). Um dos três itens se perde, e o leitor nota a repetição de relance, porque as duas linhas ficam lado a lado na p. 22.'
    correcao: 'Trocar o terceiro item por "Deixar a comparação no ponto em que ela aparece, mesmo que chegue tarde no texto." ou por "Manter as perguntas como perguntas, sem transformá-las em afirmações."'
  - criterio: voz
    trecho: "O método para publicar uma explicação madura cabe em três passos, e o último é o que custa. Consiste em registrá-la como ela é"
    por_que: 'Voz de apostila em sequência. A seção anterior já foi construída como lista em prosa ("A primeira é [...] A segunda é [...] A terceira razão [...] A quarta é a mais sutil"), e esta repete o andaime ("O corte é o segundo passo", "O terceiro passo é o mais difícil"). "Consiste em" é registro de manual, e "o último é o que custa" e "O terceiro passo é o mais difícil" dizem a mesma coisa duas vezes. Somam-se a isso a sinalização "Há sinais que se reconhecem de relance, e a oficina volta a eles." (narrador que anuncia e descreve a oficina, lições cap01-r1 e cap02-r1) e o vocabulário gasto: "franz-" aparece 7 vezes na prosa ("A cliente franziu a testa, como todos franzem. Otávio já sabia que franziria"; "era o que fazia o cliente franzir a testa, e era por franzir a testa") e "centenas" 10 vezes no capítulo.'
    correcao: 'Abrir a seção pela ação: "Publicar uma explicação madura pede três coisas: registrá-la como ela é, cortar só o que pertence àquela conversa e não melhorar o resto. A última é a que custa." Depois, "O corte tem uma regra estreita" (sem "é o segundo passo") e "Não melhorar é o mais difícil." Cortar a frase "Há sinais que se reconhecem de relance, e a oficina volta a eles." (o intertítulo e a nota bastam). Deixar "franzir a testa" só na cena de abertura e na da Helena. No resto, "em que ponto a pessoa trava", "Cada cliente que se perdeu mostrou". Na Helena: "A frase de abertura era o que incomodava o cliente, e era por se incomodar que ele prestava atenção no resto." Tirar ao menos três "centenas" da prosa e do guardar.'
  - criterio: clareza
    trecho: "ou refazê-la no carro logo depois, em voz alta"
    por_que: 'O parágrafo seguinte repete a mesma alternativa como se fosse novidade: "dar a explicação de verdade ao cliente e, logo depois, sozinho, refazê-la em voz alta enquanto ela ainda está quente". O leitor lê duas vezes, em parágrafos vizinhos, a solução do refazer sozinho e da licença ("com a licença do paciente" / "precisa de licença e de cuidado"), e a segunda ocorrência apresenta como "outro" caminho o que já foi dado.'
    correcao: 'No parágrafo dos modos, deixar Renata só com "gravar a explicação da próxima vez que ela acontecer de verdade". O parágrafo do sigilo fica com a alternativa, agora com Renata como sujeito: "Por isso Renata, na maioria das vezes, faz outra coisa: dá a explicação ao paciente e, no carro, sozinha, refaz em voz alta enquanto ela ainda está quente, sem nenhum dado dele."'
  - criterio: clareza
    trecho: "A sugestão que Otávio recusou."
    por_que: 'O bloco exemplo (p. 17) chama a versão melhorada de "sugestão que Otávio recusou" antes de o leitor saber que houve sugestão: a cena da Helena só vem na p. 18, depois do alerta. A ordem inverte causa e ilustração e tira força da cena.'
    correcao: 'Mover o bloco exemplo (e o alerta, se quiser) para depois do parágrafo "Helena foi a primeira a sentir a tentação...". Ou trocar o rótulo por "A versão que Helena sugeriria" e deixar a cena confirmar.'
  - criterio: metodo
    trecho: "Cortei só o contexto da pessoa"
    por_que: 'O PWA tem critério próprio para a analogia fixa ("Identifiquei a analogia fixa que uso", 2 pontos), e a oficina agora tem o campo 04 para isso, mas o checklist de aplicação não o cobra. A comparação ou pergunta fixa é o núcleo do conceito ("qual comparação funciona") e fica sem pontuação.'
    correcao: 'Redistribuir: Listei (3), Registrei (3), "Identifiquei a comparação ou a pergunta fixa" (campo 04, 2), "Cortei só o contexto e resisti a melhorar" (campos 05 e 06, 2). Ou manter cinco itens e ajustar a condição para 7 de 12.'
  - criterio: honestidade
    trecho: "Todo profissional que atende gente desenvolve, sem perceber, um repertório de explicações-padrão."
    por_que: 'Generalização universal sem fonte, na abertura da primeira seção. O conceito repete o exagero: "É o único material da sua prática que já passou por centenas de testes reais de compreensão". Não é o único, porque o caso-prova do cap. 15 e as respostas do cap. 14 também passaram por gente real. No capítulo seguinte ao do caso-prova, o "único" soa como disputa entre capítulos.'
    correcao: '"Quem atende gente há anos acaba com um repertório de explicações-padrão, quase sempre sem perceber." No conceito: "É o material da sua prática que mais vezes foi posto à prova com gente real."'
  - criterio: coerencia
    trecho: "O nome do remédio que o cliente trouxe e a idade da mãe dele"
    por_que: 'Farmacêutica/o já apareceu nos caps. 3, 6 e 14 (dois capítulos atrás, no exemplo do campo de origem), e a lição cap02-r2 pede profissões que não se repitam em capítulos vizinhos. Para um farmacêutico, o nome do remédio costuma ser o próprio assunto da explicação, e não contexto da pessoa, então o exemplo ensina o corte errado.'
    correcao: 'Trocar por uma profissão ainda distante no ESTADO, por exemplo "Uma confeiteira: “O nome da noiva e a data da festa. O resto ficou.”" ou "Um mecânico de motos: “A placa e o nome do cliente que caiu na chuva. O resto ficou.”"'
  - criterio: concretude
    trecho: "Quando os dois não combinam, vale o que aconteceu."
    por_que: 'Categórico demais para o leitor advogado. Desde a reforma de 2017 e com a discussão em curso no STF sobre contratação de autônomos e PJ, "vale o que aconteceu" é a regra da Justiça do Trabalho, mas não é absoluta. O texto já cuida disso depois ("cada caso depende dos fatos"), e basta um advérbio para a cena não soar datada.'
    correcao: '"Quando os dois não combinam, em regra vale o que aconteceu."'
  - criterio: aplicabilidade
    trecho: "É assim que eu explico para quem está na minha frente."
    por_que: 'O roteiro acrescenta ao fecho uma frase que ninguém diz no atendimento (a pessoa está na frente), o que contradiz a regra "sem adaptar para a internet" e o Faça "Começar pela frase de sempre". É meta-comentário, parente do "Vou explicar isso do mesmo jeito" que a r1 mandou cortar.'
    correcao: 'Encerrar o roteiro em "{o fecho curto que você usa quando a pessoa entendeu}." e, se quiser o sinal de informalidade, pô-lo na roteiro_nota como opção: "Se sentir falta de uma moldura, uma frase basta: é assim que eu explico no consultório, no escritório, na obra."'
edicoes_de_linha:
  - '"Lúcia pede a alguém do grupo de estudos" -> "Lúcia pede à amiga do grupo de estudos" (é a mesma amiga dos caps. 8 e 13)'
  - '"Um engenheiro estrutural: “A viga é uma régua apoiada em dois livros. Tire um livro e veja.”" -> "Um engenheiro estrutural, quando o cliente quer tirar um pilar: “A viga é uma régua apoiada em dois livros. Tire um livro e veja.”" (o exemplo precisa dizer o que a comparação explica)'
  - '"A quarta é a mais sutil:" -> "A quarta é a mais difícil de ver:"'
  - '"Otávio se lembrou do cliente de 2003, que tinha saído confuso justamente por causa dos artigos" -> "Otávio se lembrou do e-mail de 2003, de três páginas, que o cliente respondeu com mais perguntas" (casa com a fig. 16.2; a reunião confusa do segundo ano é outra cena)'
  - '"Deixar mais profissional costuma significar devolver o texto ao vocabulário de todo mundo." -> "Deixar mais profissional, na prática, devolve o texto ao vocabulário de todo mundo." (há seis "costuma" no capítulo)'
  - '"Os colegas explicam a mesma coisa de um jeito mais longo, ou mais confuso." -> "Quando você ouve um colega explicar a mesma coisa, a sua versão é mais curta." (verificável pelo leitor e sem juízo sobre a classe)'
diagramacao:
  - 'p. 15: cerca de 20% em branco no pé, porque a fig. 16.2 (indivisível) foi para a p. 16. Não é seção que o projeto aceita. Pôr a figura logo depois do parágrafo "Maturidade produz encurtamento..." e o parágrafo do Caio depois dela: a figura fica colada ao parágrafo que ilustra e o texto do Caio preenche o pé.'
  - 'p. 22: cerca de 30% em branco depois do Faça/Evite, porque o roteiro foi para a p. 23. Com o esqueleto reduzido a conferência (ver problema de aplicabilidade), o roteiro cabe na p. 22 e a p. 23 abre direto na Verificação.'
  - 'p. 17: o sobretítulo "NA PRÁTICA" está colado ao título do exemplo, sem entrelinha, e o bloco aparece antes da cena da Helena que ele cita (ver problema de clareza).'
  - 'p. 21: cerca de 35% em branco depois das três regras, antes do esqueleto indivisível. Aceito pelo projeto, sem ação obrigatória.'
  - 'p. 19 (branco antes do campo 03 indivisível) e p. 24 (fim de capítulo): aceitos pelo projeto.'
veredito: "Revisão sólida da r1, com os erros técnicos corrigidos, a fronteira com o cap. 14 clara e o exemplo que faltava. Ainda reprova porque o texto publicado continua reconhecível, com processo em curso, contradizendo o próprio corte, e há um furo de datas no caso central. Corrigidos esses dois pontos, a parede repetida do Caio, o esqueleto que repete a oficina e o andaime de 'primeira/segunda razão, segundo/terceiro passo', fica acima de 9."
