capitulo: 10
iteracao: 1
notas: {metodo: 8.6, voz: 8.8, originalidade: 8.6, clareza: 8.9, ritmo: 9.0, concretude: 8.7,
        coerencia: 8.4, aplicabilidade: 8.7, impresso: 8.6, honestidade: 8.6}
bloqueadores: []
pontos_fortes:
  - 'A cena de abertura é das melhores da Fase II: a casadinha é um detalhe de ofício exato, pouco conhecido fora do foro trabalhista, que ninguém inventaria ("No corredor do fórum chamam isso de casadinha"). O modo do Otávio aparece já na primeira cena (a pior hipótese contada "sem nomes, uma depois da outra", a folha escrita à mão), e a frase que ele tira dali, "defender a pequena empresa inclui dizer não a ela", é uma opinião de verdade, que dá para discordar.'
  - 'Ganho real sobre o PWA no parágrafo do custo de não ter posição: "Quem não diz o que defende acaba escolhido pelo que dá para comparar sem conhecer ninguém: o preço, a distância, o horário livre." E fecha na cena: "ficou num grupo menor, o dos advogados que dizem não."'
  - 'Tabela 10.1 com profissões variadas e detalhes conferíveis (a veterinária que mudou de ideia sobre castrar só depois do primeiro cio por causa dos tumores de mama é exata), e um critério prático e memorável para achar as próprias opiniões: "Um sinal ajuda a achar as suas: o calor."'
  - 'O sigilo aparece dentro do próprio caso central, sem sermão: "o sigilo profissional do advogado vale também para o cliente que foi embora. E não precisa: a prática existe em todo o Recife, e o assunto é ela." A verificação 03 cobra exatamente isso, e o fecho ("tinha certeza sobre o assunto antes de pensar no formato") respeita o arco (agência suspensa até o cap. 24).'
problemas:
  - criterio: metodo
    trecho: 'Um despachante: “Não tiro documento com ‘jeitinho’ no Detran. Quem quer rapidez a qualquer custo procura outro.”'
    por_que: 'O capítulo ensina que opinião é o que alguém do outro lado pode defender, e o próprio "Evite" da rede proíbe "Discordar de algo que ninguém de fato defende". Mas o exemplo do campo 01 é recusar corrupção, e o item da comparação ("“Não faço acordo combinado com o funcionário. Perco cliente por isso.”") é recusar uma ação simulada, coisa ilegal que ninguém defende em público. O leitor sai com um modelo errado: "a minha opinião não negociável é não fazer nada ilegal". Isso é cumprir a lei, e o próprio texto chamaria de constatação. Na cena, a opinião que dá para discutir é a da folha (o advogado de pequena empresa tem de contrariar o dono), e o capítulo não deixa essa diferença clara. A justa causa, o dermatologista, o professor de cursinho e a veterinária mostram o tipo certo.'
    correcao: 'Trocar o exemplo do campo 01 por uma recusa legal e discutível, de profissão que não aparece nos capítulos vizinhos: "Um mecânico de motos: “Não troco só a corrente quando a coroa e o pinhão estão gastos, mesmo que o cliente peça. Perco o serviço para a oficina do lado.”" Na comparação, no lugar do item da casadinha, algo como "“Advogado de empresa que nunca contraria o dono está defendendo o humor dele. Perco cliente por pensar assim.”" Em O teste do custo, uma frase depois de "custou ao Otávio um contrato de nove anos": "Recusar a ação simulada era só cumprir a lei. A opinião estava na frase da folha: que defender o dono às vezes é contrariá-lo, coisa que o escritório para onde a conta foi não pensa."'
  - criterio: honestidade
    trecho: 'Advogados, médicos, psicólogos e dentistas, entre outros, têm normas que vedam críticas públicas a colegas identificáveis. A posição continua cabendo; o alvo é a prática.'
    por_que: 'A ressalva ética está incompleta, e para uma das profissões citadas o erro é justamente o que importa. O Código de Ética Odontológica vai além de proibir crítica a colega identificável: entre as infrações de publicidade está criticar técnicas usadas por outros profissionais como inadequadas ou ultrapassadas (confirmar o artigo na resolução do CFO em vigor). Nesse caso "o alvo é a prática" não protege o dentista, e o capítulo inteiro diz a ele que protege. A lição cap02-r2 manda formular pelo que é certo quando houver dúvida.'
    correcao: '"Em profissões com código de ética, a regra de não atacar colegas não é só elegância. Advogados, médicos, psicólogos e dentistas, entre outros, têm normas sobre como se fala de colegas em público, e algumas restringem até a crítica a técnicas usadas por outros profissionais. Antes de publicar uma posição contra uma prática da sua área, confira o que o seu código diz." Repetir a ideia em uma linha na roteiro_nota.'
  - criterio: coerencia
    trecho: 'Caio ainda não sabe dizer qual é a dele, e é justamente o que vai descobrir mais adiante.'
    por_que: 'Três problemas na mesma frase. (1) Contradição interna: a frase anterior diz "Os outros três personagens pagam os seus", e o terceiro não paga. (2) Contradição com o cap. 3: o áudio do taco tem "uma afirmação contrária ao que o prédio inteiro estava fazendo" e "uma frase que repete há anos", ou seja, Caio já tem pelo menos uma posição. (3) O narrador anuncia um capítulo futuro, voz de curso (lição cap01-r1).'
    correcao: '"Caio repete há anos a frase do taco e nunca a tratou como posição; ainda não fez a conta das obras de porcelanato que ela já lhe custou." Assim fica compatível com o cap. 14 ("Nunca tinha pensado nisso como opinião"). Se preferir não mexer, trocar a frase de abertura por "Lúcia e Renata pagam os seus."'
  - criterio: coerencia
    trecho: 'No mês seguinte, chegou por e-mail o aviso de rescisão do contrato de assessoria. A conta das cinco lojas foi para outro escritório.'
    por_que: 'A linha do tempo fica ambígua. "Naquela noite", logo depois, parece ser a noite em que o e-mail chegou, no mês seguinte. Mas o quadro fala em "a frase da noite da casadinha", e a empresária chega "Três semanas depois do telefonema", já dizendo "Tinha custado um cliente". O leitor não sabe se a folha foi escrita no dia da ligação ou semanas depois, nem se a rescisão veio antes ou depois da nova cliente (lições cap03-r3 e cap08-r1).'
    correcao: 'Inverter os dois parágrafos e datar: "Na noite do telefonema, Helena, a sócia, perguntou se tinha valido a pena. [...] defender a pequena empresa inclui dizer não a ela." Depois: "Dez dias mais tarde, chegou por e-mail o aviso de rescisão do contrato de assessoria. A conta das cinco lojas foi para outro escritório."'
  - criterio: originalidade
    trecho: 'Explicou, com a calma de quem já tinha dado a mesma explicação dezenas de vezes, que aquilo era uma ação simulada'
    por_que: 'Pelo terceiro capítulo, a cena do Otávio segue a mesma batida: o cliente propõe um atalho irregular, Otávio recusa e explica. Foi assim no cap. 6 (a tese do autônomo), no cap. 9 (as advertências feitas na véspera: "Por isso não as junta ao processo, e explica ao cliente por quê") e agora aqui. Além disso, "a mesma explicação dezenas de vezes" invade o enquadramento reservado ao cap. 16 ("A explicação que você repete há anos"; lição cap04-r1). O que o cap. 10 tem de novo é o custo e o diálogo com o Seu Ednaldo, e é nisso que a cena deve apostar.'
    correcao: 'Tirar a remissão às explicações repetidas: "Otávio disse que não faria. Explicou, sem levantar a voz, que aquilo era uma ação simulada: [...]". Se couber, dar uma frase a mais ao que só este capítulo tem, o silêncio do Seu Ednaldo antes da pergunta "Você está do meu lado ou do dele?".'
  - criterio: honestidade
    trecho: 'Tinha custado um cliente e trazido outro, e o que ela trouxe tinha um perfil que o escritório queria mais'
    por_que: 'O desfecho é arrumado demais. O cliente se perde num mês e, três semanas depois, chega outro pela boca do contador, com uma frase-tese pronta ("Ele é chato. Não faz acordo de fachada. Por isso eu indico."). O leitor aprende que a posição se paga e o resultado vem logo, perto da promessa de resultado que o briefing proíbe. O texto não diz que a troca foi desigual nem que poderia não ter vindo ninguém.'
    correcao: '"Não era uma troca: a conta das lavanderias pagava menos de um terço da das padarias, e Otávio sabia que podia não ter vindo ninguém. Mas a cliente nova tinha um perfil que o escritório queria ter mais: uma empresária que preferia ouvir não a descobrir o problema no fórum."'
  - criterio: concretude
    trecho: 'Uma empresa que passa a responder por uma dívida maior do que a que tentou evitar, com o nome anotado no cartório do fórum.'
    por_que: 'Na Justiça do Trabalho não há "cartório do fórum" (há secretaria da vara), e "nome anotado" não corresponde a nenhuma consequência real. Um advogado trabalhista leitor tropeça aqui, no parágrafo que existe para mostrar o domínio técnico do Otávio (lição cap09-r1). A consequência concreta que um advogado citaria é a inscrição no Banco Nacional de Devedores Trabalhistas, que torna positiva a certidão trabalhista de que a empresa precisa para licitar e conseguir crédito.'
    correcao: '"Uma empresa que passa a responder por uma dívida maior do que a que tentou evitar, com o nome no cadastro de devedores trabalhistas e a certidão, que o banco pede para renovar o capital de giro, positiva."'
  - criterio: clareza
    trecho: 'eixoY: ["Não custa nada", "Você defende mesmo pagando"]'
    por_que: 'O eixo vertical põe a "Polêmica gratuita" em "Não custa nada", mas o texto diz que ela "cansa depressa, a você e a quem lê", e na prática a polêmica gratuita costuma custar reputação. O que o eixo quer medir é se a pessoa sustenta a posição quando ela custa. Do jeito que está, a figura contradiz o parágrafo que vem logo depois. Na legenda, "que você sustenta quando cobra o preço" deixa o sujeito de "cobra" ambíguo.'
    correcao: 'eixoY: ["Abandona quando custa", "Sustenta mesmo pagando"]. Legenda: "Esquema ilustrativo. A divergência sozinha leva à polêmica gratuita, que chama atenção e se esgota. A posição que vale diverge e continua de pé quando cobra o preço."'
  - criterio: aplicabilidade
    trecho: 'Escreva a prática, e nunca o nome de quem a pratica. “A maioria na minha área faz isto. Eu faço aquilo, porque…”'
    por_que: 'O campo 02 é o único sem exemplo de profissão (estrutura_do_capitulo pede exemplos em profissões variadas). O exemplo do campo 03 ("Escola que manda criança para avaliação só no fim do ano, quando já perdeu o ano.") não responde à metade do rótulo, "e o que você faria no lugar". Além disso, o esqueleto da rede pede "A razão: o raciocínio, com o caso típico que o sustenta", e só o campo 01 pede o porquê; nenhum campo pede o caso típico. O leitor chega ao esqueleto sem a matéria-prima da parte mais importante (lição cap02-r1).'
    correcao: 'Campo 02: "Uma professora de piano: “A maioria dos colegas começa pelo método de leitura. Eu passo os três primeiros meses tocando de ouvido, porque a criança que só lê desiste antes do primeiro recital.” Escreva a prática, nunca o nome de quem a pratica." Campo 03: "Uma fonoaudióloga: “Escola que manda a criança para avaliação só em novembro, quando o ano já foi. Eu peço a triagem em março.”" Rótulos dos campos 02 e 03 terminando em ", e por quê". Ampliar o campo 04 para "O custo de cada uma, e o caso típico que a sustenta" (5 linhas) ou acrescentar "e o caso típico" ao campo 06.'
  - criterio: aplicabilidade
    trecho: 'Para ter uma resposta pronta nos comentários.'
    por_que: 'O distrator da verificação 04 não é claramente falso: ter uma resposta pronta é uma consequência legítima de pensar no contra-argumento, e a própria rede usa isso (lição cap01-r1). Ainda por cima, traz a tela ("comentários") para a verificação. Na 03, a opção "Esperando o cliente autorizar a história por escrito" só é falsa por uma regra que o texto não explica (o sigilo do advogado não depende de autorização do cliente). Um leitor de outra profissão, em que o consentimento resolve, vai achar a opção correta.'
    correcao: 'Q4, opção b: "Para poder citar quem defende o outro lado." Q3, explicação: "O sigilo profissional vale também para o cliente que foi embora, e para o advogado não depende de autorização dele. A prática existe em toda a cidade; o assunto é ela, e ninguém precisa ser reconhecido para que a peça funcione."'
  - criterio: voz
    trecho: 'O preço varia. O que não varia é que uma opinião de verdade tem algum.'
    por_que: 'É uma fórmula de palestra (X varia; o que não varia é Y), da mesma família das antíteses limitadas pela lição cap01-r1. Há outras do mesmo tipo: "É o custo mais visível, mas não é o único tipo.", "O problema é que ela protege apenas um dos lados." e "a regra de não atacar colegas não é só elegância". Soltas passam; juntas dão ao texto uma cadência de curso. A palavra "ninguém" aparece 13 vezes na prosa, puxada pelo tema, e o ouvido cansa.'
    correcao: '"O preço varia, mas uma opinião de verdade sempre tem algum." "A recusa da casadinha custou ao Otávio um contrato de nove anos, o custo mais visível." "Só que ela protege um lado só." Cortar três ou quatro "ninguém", por exemplo "Nenhuma está errada, e nenhuma acrescenta nada a quem lê" e "sem conhecer a pessoa".'
  - criterio: honestidade
    trecho: 'e provavelmente muitos donos de pequenas empresas do Recife'
    por_que: 'São cinco generalizações sobre terceiros, e o limite é 2 (lição cap01-r4/cap02-r2): "provavelmente muitos donos de pequenas empresas", "O motivo de tanto especialista se refugiar nelas", "A polêmica gratuita costuma ser contra", "Quase ninguém precisa inventar opiniões" e "As opiniões de verdade costumam aparecer".'
    correcao: '"Seu Ednaldo discordava, e o amigo dele também, e todos os empresários a quem o amigo tinha ensinado o truque." "Refugiar-se nelas é compreensível." "A polêmica gratuita mira uma coisa que ninguém de fato defende, ou uma pessoa." "Não é preciso inventar opiniões." Manter só "costumam aparecer" no parágrafo do calor.'
  - criterio: ritmo
    trecho: 'Existe um teste simples para saber se uma frase é opinião ou constatação'
    por_que: 'Lida em voz alta, a prosa corre bem nas cenas e trava nas aberturas expositivas, que repetem o mesmo arranque existencial: "Há um tipo de frase que circula em toda área profissional", "Existe um teste simples", "Há opiniões que custam o respeito". A seção Defender sem virar briga termina num parágrafo de três frases que parece nota de rodapé ("Em profissões com código de ética...") e corta a transição para a cena final.'
    correcao: 'Abrir O teste do custo pela ação: "Para saber se uma frase é opinião ou constatação, pergunte o que ela custa." Juntar o parágrafo do código de ética ao da indireta, que trata do mesmo risco, ou levá-lo reescrito (ver problema de honestidade) para a roteiro_nota, deixando a seção terminar no argumento contrário do Otávio, que prepara a cena seguinte.'
edicoes_de_linha:
  - 'quitação de tudo o que tinha direito -> quitação de tudo a que tinha direito'
  - 'o juiz podia perceber, e quando percebe, o acordo cai -> o juiz podia perceber e, quando percebe, o acordo cai'
  - 'que nenhuma das quinze publicações mensais da agência do Otávio tinha tido -> que nenhuma das quinze publicações mensais da agência tivera'
  - 'e nenhuma acrescenta o que quer que seja a quem lê -> e nenhuma acrescenta nada a quem lê'
  - 'quem paga a conta é a empresa que ele deveria proteger -> quem paga a conta é a empresa que o acordo deveria proteger'
  - 'Quem compra descobre na vistoria. -> Quem compra descobre na escritura, com a vaga registrada à parte.'
  - 'Não faço acordo combinado com o funcionário. -> Não faço ação combinada com o funcionário. (se o item ficar; ver problema de método)'
  - 'um perfil que o escritório queria mais -> um perfil que o escritório queria ter mais'
  - '“Perco cliente por isso” transforma a opinião em prova de que você acredita nela. -> Dito como fato, sem heroísmo, o custo prova que você acredita no que diz.'
diagramacao:
  - 'p013: cerca de um terço da página em branco depois de "onde você está.", porque o box Conceito foi inteiro para a p014. Evitável: deixar o box começar no pé da página ou puxar para cima uma linha do parágrafo seguinte.'
  - 'p014: cerca de um sexto em branco no pé; a Figura 10.1 foi empurrada para a p015.'
  - 'p016: cerca de um quarto da página em branco depois de "antes do primeiro problema."; a comparação foi para a p017.'
  - 'p018 e p019: a p018 termina com cerca de um terço em branco e a p019 tem só o Para guardar (cerca de 70% em branco). O guardar, com seis linhas, cabe no pé da p018; a oficina começaria na p019 e o capítulo ficaria uma página menor. Este branco não se justifica pela regra da oficina, porque o guardar poderia ter subido.'
  - 'p015, Figura 10.1: em "Polêmica gratuita" e "A sua posição" o ponto fica à direita do rótulo, nos demais à esquerda. O eixo Y tem um rótulo vertical embaixo e outro horizontal em cima; seria melhor uniformizar.'
  - 'p024, roteiro: a lacuna "a sua posição, dita direto" sai numa linha própria com um recuo antes do sublinhado, diferente das outras lacunas, que vêm dentro da frase.'
veredito: 'Capítulo bom, com a melhor cena de ofício da fase, mas o modelo de opinião escorrega para "não faço o que é ilegal", contradiz o cap. 3 sobre o Caio, deixa a ressalva ética incompleta e tem brancos evitáveis; uma passada de revisão resolve.'
