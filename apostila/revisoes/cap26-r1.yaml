capitulo: 26
iteracao: 1
notas: {metodo: 8.6, voz: 8.4, originalidade: 8.5, clareza: 8.3, ritmo: 8.8, concretude: 8.3,
        coerencia: 7.9, aplicabilidade: 8.0, impresso: 8.2, honestidade: 9.0}
bloqueadores: []
pontos_fortes:
  - "A cena de abertura é um diagnóstico feito com a agenda, e não com impressão: 'Eram trinta e um. Vinte e quatro vieram por indicação [...] Dois disseram que tinham encontrado o perfil. Os dois [...] tinham recebido o nome dela de alguém'. A conta fecha e reinterpreta com inteligência o 'pacientes citando áudios antigos' do cap. 23 ('Estava confirmando gente que vinha de qualquer jeito')."
  - "As frases de paciente são matéria-prima de verdade e mostram o modo oral da Renata: 'Acordo mais velho do que fui dormir.' / 'Levo meia hora para conseguir calçar a meia.' O detalhe clínico está certo (rigidez matinal longa que melhora com o movimento merece investigação médica) e fecha com o Marcos do cap. 1."
  - "Honestidade exemplar com o 40/30/20/10 do PWA: 'que o livro propõe como ponto de partida e não como regra [...] Não há pesquisa que fixe esses números'. O gráfico do PWA virou a contagem da personagem, rotulada como dela."
  - "O limite ético da camada de reconhecimento em saúde está bem posto e é operacional: 'Nomear uma experiência não é diagnosticar quem lê' e a peça 'entrega uma pergunta, e não uma conclusão'. O resultado final é modesto e crível (quatro de vinte e nove)."
problemas:
  - criterio: coerencia
    trecho: "Seis terminavam em ação, o convite para agendar. Duas eram de confiança, casos contados sem identificar pacientes. Uma era de critério."
    por_que: "O diagnóstico central contradiz o próprio capítulo e o arco. (1) O parágrafo anterior explica o problema de outro jeito: 'Quando Renata pensava em publicar, pensava nos pacientes que tinha [...] Escrevia para eles' — isso produz peças de critério e confiança para quem já chegou, e não seis peças de ação. (2) As peças são classificadas como 'ação' porque 'terminavam' no convite, mas o p. 15 diz que 'quase todas' as dez terminavam com 'agende a sua avaliação'; então as de confiança, critério e reconhecimento também terminavam, e a regra de classificação some. (3) Depois do cap. 23, a Renata escolhe a ideia de toda peça e grava todas; seis de dez peças que são só convite não cabem nesse sistema nem no arco F3 (caso-prova, contraponto). O leitor sai sem saber como classificar uma peça de conteúdo com convite colado no fim — exatamente o que ele vai enfrentar na grade do campo 02."
    correcao: "Refazer a contagem para ficar coerente com o p. 19: por exemplo, 'Cinco eram de confiança, casos que só faziam sentido para quem já estava em tratamento. Três eram de critério. Uma era o convite puro, a lista de tratamentos. Uma, apenas, era de reconhecimento.' Tratar o convite colado no fim como um problema à parte (contamina qualquer camada), e dar a regra explícita na prosa e no campo 02: 'classifique pelo que o corpo da peça faz, não pela última linha'. Ajustar a figura 26.2, o p. 15 ('quase todas') e o 'contou duas' do teste rápido à nova contagem."
  - criterio: aplicabilidade
    trecho: "exemplo: \"Tire do caderno de campo, e não da cabeça. A frase da meia da Renata: “Levo meia hora para conseguir calçar a meia.”\""
    por_que: "Viola a lição cap01-r1 (exemplos da oficina em profissões diferentes da do personagem em foco) e expõe um problema maior: o capítulo inteiro, oficina e rede incluídas, só mostra a camada de reconhecimento em saúde. O 'Faça assim' também é da Renata, e o roteiro fecha com 'leve esta pergunta a quem cuida de você', que só serve a quem atende pessoas em cuidado. Uma contadora, um advogado trabalhista ou um arquiteto não recebem nenhum modelo de 'experiência que o cliente sente e ainda não sabe nomear' na área deles, e é aí que o conceito é menos óbvio."
    correcao: "No campo 03 e no 'Faça assim', trocar a Renata por dois ou três exemplos de outras áreas, escolhidos fora dos figurantes recentes: 'Uma contadora: “O faturamento subiu e o dinheiro no caixa sumiu.”' / 'Um técnico de ar-condicionado: “Liga, gela e a conta de luz dobrou.”' / 'Uma professora de piano: “Meu filho estuda todo dia e não sai do lugar.”'. No roteiro, generalizar a última linha: 'Se isso é com você, leve esta pergunta a quem cuida disso para você: {a pergunta}.'"
  - criterio: clareza
    trecho: "termo: Boca de funil"
    por_que: "O conceito do capítulo tem um nome e o capítulo usa outro. 'Boca de funil' aparece no título e no box. A prosa, os intertítulos, a tabela, a oficina, a rede, o 'Para guardar' e a verificação dizem 'porta de entrada', e o próprio 'porque' do box troca de nome no meio ('A porta de entrada traz quem nunca chegaria'). O leitor apressado não sabe qual dos dois termos explicar, e o glossário do Apêndice B vai registrar um termo que o texto quase não usa. As metáforas também se atropelam: vitrine, porta, farol, funil, andar e placa, até 'Quem atravessa uma porta de entrada passa por camadas'."
    correcao: "Adotar 'boca de funil' como termo e usar 'porta de entrada' uma única vez, como paráfrase na primeira definição ('a boca de funil, a porta de entrada de quem ainda não conhece você'). Reescrever o box para dizer 'A boca de funil traz quem nunca chegaria' e o início da seção 2: 'Quem entra pela boca do funil passa por camadas'. Cortar 'Tinha descido um andar' (ver edições)."
  - criterio: coerencia
    trecho: "Em novembro, numa quarta-feira, uma paciente nova chegou sem indicação."
    por_que: "É a mesma batida da cena central do cap. 25, imediatamente anterior: um estranho chega ao consultório citando uma peça antiga (lá, a mulher com a folha dobrada; aqui, a paciente do áudio da meia). Lição cap02-r1: nenhuma cena se repete entre capítulos. Além disso, a cena mostra o resultado sem mostrar o caminho (lição cap03-r3): como o áudio chegou a alguém que não segue a Renata? O cap. 25 acabou de dizer que o caminho mais comum é 'o link mandado por alguém', e isso, se foi o caso, é quase indicação e contradiz 'sem que ninguém os mandasse'."
    correcao: "Dizer em uma frase como ela chegou ao áudio, de um modo que não seja indicação ('tinha procurado no celular por dor nas costas de manhã, numa madrugada', ou 'apareceu entre vídeos de alongamento'). E dar à cena um ganho que o cap. 25 não teve: por exemplo, a peça mandava investigar com o médico, e Renata, depois da avaliação, faz exatamente isso ('saiu com um encaminhamento ao reumatologista e voltou três semanas depois'), mostrando que a porta de entrada leva ao critério, não à venda. Acrescentar uma remissão ao cap. 25 ('a biblioteca espera quem já procura; o reconhecimento alcança quem ainda não sabe o que procurar')."
  - criterio: voz
    trecho: "O depoimento saiu do alto e não saiu do perfil. Continuava útil para quem chegava indicado e queria confirmar, que é a função da vitrine, e a vitrine não tinha deixado de existir. Tinha descido um andar. O que mudou foi a ordem: a primeira coisa que o perfil dizia a um estranho deixou de ser \"venha\" e passou a ser \"isso que você sente tem explicação\"."
    por_que: "Três antíteses num parágrafo de quatro frases (saiu do alto/não saiu do perfil; não tinha deixado de existir/tinha descido; deixou de ser/passou a ser). A antítese é o gesto dominante do capítulo e passa do limite de uma por seção (lição cap01-r1): 'tinha passado a achar que a presença estava trazendo gente nova. Estava confirmando gente que vinha de qualquer jeito' e 'O perfil tinha deixado de atrapalhar. Ainda não trazia pessoa alguma' (mesmo parágrafo); 'não está no desenho [...] Está em para quem'; 'Não procura pelo nome técnico. Procura pelo que sente'; 'descrever um sinal é uma coisa; saber se ele vale...'; 'Deixou de ser empurrado'; 'Outro fisioterapeuta poderia [...] Não falaria'. 'O que mudou foi' aparece duas vezes (p. 89 e p. 111)."
    correcao: "Reescrever o p. 111 pela ação, sem antítese: 'O depoimento foi para baixo, onde continuava servindo a quem chegava indicado e queria confirmar. No alto, a primeira coisa que um estranho lia agora era a meia.' No p. 13, manter só uma das duas viradas (sugestão: cortar 'O perfil tinha deixado de atrapalhar. Ainda não trazia pessoa alguma.' e fechar em 'Estava confirmando gente que vinha de qualquer jeito.'). Trocar 'O que mudou foi uma marca a mais' por 'Entrou uma marca a mais'."
  - criterio: aplicabilidade
    trecho: "exemplo: \"Olhe a agenda de três meses. Indicação de colega, de cliente, perfil sem indicação, outro caminho. Anote quantos de cada.\""
    por_que: "A agenda da maioria dos profissionais não registra a origem do cliente; a Renata anotou, mas o leitor em geral não tem esse dado, e o critério 'O campo 01 tem números, e não impressões' fica impossível de cumprir. A grade do campo 02 também não fecha o raciocínio que o checklist cobra ('sei o quanto o meu funil está invertido'): não há linha de total nem a referência 4-3-2-1 para comparar, nem coluna para anotar qual é a peça."
    correcao: "Campo 01: 'Se a agenda não diz, conte os que você lembra com certeza e marque os demais como “não sei”. A partir de hoje, pergunte a cada cliente novo como chegou e anote.' Critério: 'O campo 01 tem números, mesmo que incluam “não sei”.' Campo 02: acrescentar uma coluna estreita 'assunto' e duas linhas no pé, 'Total' e 'Referência: 4 · 3 · 2 · 1', e a instrução 'classifique pelo corpo da peça, não pela última linha'."
  - criterio: aplicabilidade
    trecho: "- {rotulo: \"A experiência\", texto: \"O que a pessoa sente, nas palavras dela.\", linhas: 2}"
    por_que: "A oficina já pediu a peça inteira no campo 04; o esqueleto da rede ('ESQUELETO DA PEÇA — RASCUNHE AQUI', p. 23) pede de novo as mesmas quatro partes. Lição cap02-r2: quando a oficina já escreveu as partes, o esqueleto é 'passe a limpo'. O campo 04, com 7 linhas, é justamente o apertado para uma peça inteira à mão."
    correcao: "Usar esqueleto_rotulo 'Passe a limpo a peça do campo 04' e deixar o esqueleto como versão final (2 linhas por parte), ou reduzir o campo 04 a notas e mandar escrever a peça no esqueleto. Nos critérios da oficina, acrescentar o que a entrega promete e hoje nenhum critério cobra: 'O campo 05 aponta pelo menos uma coisa na peça que um colega não diria.'"
  - criterio: coerencia
    trecho: "e a guardar o convite para marcar, que antes ia no fim de quase toda legenda, para uma peça de ação por mês."
    por_que: "Pelo cap. 23, o perfil publica quatro peças por semana mais a peça de controle, cerca de vinte por mês. Uma de ação por mês é 1 em 20, a metade da referência de 'uma de ação' em dez que a Renata acabou de adotar três parágrafos antes."
    correcao: "'para uma peça de ação a cada duas semanas' (ou 'duas por mês')."
  - criterio: clareza
    trecho: "A primeira que gravou começava pela frase da meia. Se você leva meia hora para conseguir calçar a meia de manhã, e melhora depois que anda um pouco, isso tem uma explicação, e ela é diferente da que costumam dar."
    por_que: "A fala gravada entra em discurso indireto livre, sem aspas nem itálico, num livro que trata o leitor por 'você'. Na página 16 o leitor lê 'Se você leva meia hora...' como se o narrador falasse com ele. E 'diferente da que costumam dar' insinua que os colegas explicam errado; em saúde é delicado (lição cap01-r2, sem indireta a colegas), e o mesmo molde passa para o esqueleto e o roteiro."
    correcao: "'A primeira que gravou começava pela frase da meia: “Se você leva meia hora para calçar a meia de manhã, e melhora depois que anda um pouco, isso tem explicação, e ela vai além de ‘é da idade’.”' No esqueleto e no roteiro, mirar a crença popular, não o colega: 'Isso tem explicação, e ela vai além do que se costuma ouvir.'"
  - criterio: honestidade
    trecho: "e a indicação continua sendo a maior fonte de pacientes de quase todo profissional que atende gente."
    por_que: "Generalização empírica sem fonte sobre terceiros (lições cap02-r1 e cap01-r4)."
    correcao: "'e a indicação continuava sendo, de longe, a maior fonte de pacientes dela.'"
  - criterio: honestidade
    trecho: "uma foto da sala de atendimento, uma lista dos tratamentos oferecidos e um depoimento de paciente, autorizado por escrito."
    por_que: "Depoimento de paciente fixado como publicidade é justamente o tipo de item que os códigos de publicidade da saúde restringem. O capítulo o mantém no perfil ('Continuava útil para quem chegava indicado') sem conferir a regra da fisioterapia. Se houver restrição, o livro mostra como normal uma prática vedada à personagem-modelo."
    correcao: "Conferir as regras de publicidade do Código de Ética da Fisioterapia (COFFITO) sobre depoimento de paciente. Se houver restrição, trocar por outro item de vitrine ('uma foto da sala, a lista de tratamentos e os convênios que atende') e ajustar os p. 17, 109 e 111."
  - criterio: clareza
    trecho: "Renata fez a pergunta e contou duas."
    por_que: "Logo depois, a auditoria e a figura 26.2 mostram uma única peça de reconhecimento; o leitor não sabe qual é a segunda que passou no teste."
    correcao: "'Renata fez a pergunta e contou duas: o áudio de agosto e a peça de critério.' Ou alinhar ao número da nova contagem."
  - criterio: clareza
    trecho: "- Porque quem lê ainda não está pronto para nenhuma consulta."
    por_que: "O distrator é parcialmente verdadeiro pela lógica do próprio capítulo (quem está na camada de reconhecimento ainda não decidiu nada). Lição cap01-r1: distratores inequivocamente falsos. Na questão 01, a correta diz 'quase não trazia gente nova', e o texto diz 'Ainda não trazia pessoa alguma'."
    correcao: "Trocar por 'Porque uma peça curta não tem espaço para um convite.' Na 01: 'Que o perfil confirmava quem já vinha indicado, mas não trazia ninguém de fora.'"
  - criterio: voz
    trecho: "É uma vitrine que custa como porta de entrada. O convite em toda peça também muda a leitura: o que parecia “ela entende disso” passa a soar como “ela quer me vender”."
    por_que: "A primeira frase é opaca (custa o quê?). A segunda repete uma ideia que aparece de novo no p. 93 ('descobre que estava lendo um anúncio'), na regra 2 da rede e na explicação da questão 03: quatro vezes no capítulo (lição cap02-r1: no máximo duas)."
    correcao: "'Dá o trabalho de uma porta de entrada e rende o que rende uma vitrine.' Cortar a segunda frase da nota e deixar a ideia no p. 93 e na rede."
edicoes_de_linha:
  - "Está em para quem ele foi pensado. -> A diferença está no leitor para quem ele foi pensado."
  - "Renata usava só as que já tinham passado da data da seleção -> Renata usava só as que já tinham passado da data anotada na seleção (cap. 19)"
  - "fora do texto que Renata lia frase por frase: agende a sua avaliação. -> numa linha que Bianca acrescentava à legenda depois da leitura da Renata: agende a sua avaliação."
  - "Não há pesquisa que fixe esses números -> Não conheço pesquisa que fixe esses números"
  - "titulo: Do desconhecido ao paciente, sem perder o rosto -> titulo: Do desconhecido ao cliente, sem perder o rosto (a figura é o modelo geral; as notas já falam com o leitor: 'A sua régua')"
  - "rotulo: \"Confiança: ela entende disso?\" / \"Ação: quero falar com ela\" -> \"Confiança: você entende disso?\" / \"Ação: quero falar com você\""
  - "e eram contadas com a voz dela, as mãos no ar, a palavra \"alarme\" no meio -> e eram contadas com a voz dela, no ritmo de quem explica com as mãos, com a palavra \"alarme\" no meio (as peças são áudio e vídeo com legenda: as mãos não aparecem)"
  - "a da pergunta sobre as manhãs, que ela faz a todo paciente; e a do alarme, que explica por que ela investiga antes de desligar. Uma de reconhecimento, uma de critério, uma de confiança. -> nomear a peça de confiança como caso ('e a do paciente que [...]'); hoje as duas últimas parecem ambas de critério"
  - "Mas eram quatro pessoas que, um ano antes, provavelmente teriam continuado -> Mas eram quatro pessoas que, sem a troca de setembro, teriam continuado"
  - "Se você {a experiência, com as palavras de quem a sente}, presta atenção nisto. -> Se você {sente / vive a experiência, com as palavras de quem a sente}, presta atenção nisto. (a lacuna precisa começar por verbo)"
  - "Tinha descido um andar. -> (cortar; sexta metáfora espacial do capítulo)"
diagramacao:
  - "Os PNG de QA em apostila/saida/qa/cap26/ estão desatualizados: são das 06:59, e o manuscrito foi alterado às 20:51. Refeito o build em pasta temporária, as páginas 12, 13 e 15 a 25 saem diferentes. A avaliação abaixo usa o build atual. Rodar de novo 'build --caps 26 --png' antes do registro."
  - "p. 18: quase metade da página em branco no meio de um parágrafo. O texto quebra em 'provavelmente' e as duas últimas linhas vão para a p. 19 com o 'Para guardar'. É um branco evitável: permitir que o box 'guardar' fique sozinho no alto da p. 19, ou encurtar o último parágrafo, para que ele feche na p. 18."
  - "p. 15: cerca de um quinto da página vazio embaixo, porque a nota 'O erro de proporção' foi inteira para a p. 16. Evitável: deixar a nota quebrar, ou encurtá-la (ver problema de voz), para que caiba."
  - "p. 20: a oficina abre com o campo 01 e mais da metade da página fica vazia, porque a grade do campo 02 não coube. A grade é indivisível, mas dá para evitar o branco reduzindo a altura das linhas da grade (hoje cerca de 1 cm) ou trazendo o campo 03 para antes dela."
  - "p. 16: a fala gravada da Renata ('Se você leva meia hora...') não tem aspas nem itálico e se confunde com o narrador falando ao leitor."
  - "p. 11: o farol já é a ilustração de abertura dos caps. 10 e 29. Três usos da mesma imagem, um deles a três capítulos deste; considerar 'ponte' ou 'mapa'."
veredito: "Capítulo bem ancorado na agenda da Renata, clinicamente correto e honesto com os números, mas a auditoria central contradiz o próprio texto e o arco, o termo do conceito se dilui em 'porta de entrada', a cena final repete a batida do cap. 25 e a oficina e a rede só modelam a camada de reconhecimento em saúde. Precisa de uma passada de revisão dirigida antes de atingir 9."
