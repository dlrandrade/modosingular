bloqueadores: []
pontos_fortes:
  - 'A r2 foi resolvida quase ponto a ponto. O modelo da rede não data mais a pergunta ("“De todas as dúvidas que chegam aqui, esta é a que mais se repete, há anos.”"), a regra 1 traz a ressalva do sigilo ("frase que só um cliente diria identifica quem perguntou"), o roteiro_nota proíbe "nesta semana" e "hoje", e o desfecho respeita o calendário do cap. 13 ("marcou a primeira para o fim do mês, depois que o casal decidisse"). O campo 01 tem 15 linhas numeradas, e o lugar de guardar ganhou campo próprio (07).'
  - 'O caso central agora entrega a peça inteira, com a régua que o cliente usa sozinho (lição cap02-r3): "olhar o que está encostado na parede do lado da cozinha, como registro, ralo, ponto de gás e tomada do fogão, e pedir ao síndico a planta de instalações do prédio antes de pedir orçamento a quem quer que seja". Com o nível estrutural ("A pergunta nasce do descompasso entre o prédio e o jeito de morar"), é o melhor modelo de três níveis que o livro poderia dar.'
  - 'Detalhe de ofício exato e imagem própria. A pasta de recortes ("cozinhas integradas de revista, todas claras, todas sem parede nenhuma") abre a cena, volta como o preço da posição e fecha no gabarito. "Trocar um problema de fotografia por três de uso: o cheiro da fritura na sala, o barulho da máquina na hora da televisão, o gás mais perto do sofá" é uma frase que um arquiteto assinaria. O síndico está de acordo com a NBR 16280.'
  - 'O modo do Caio aparece na primeira cena, sem anúncio ("contou, sem tirar os olhos dele, a obra do Castelo em que uma parede fina, igualzinha àquela, escondia a prumada de água do prédio inteiro"). Os tiques apontados na r2 sumiram: não sobrou nenhum "quase" na prosa, e a rodada dos quatro personagens caiu para um só.'
problemas:
  - criterio: coerencia
    trecho: "A mais antiga estava num e-mail de onze anos atrás, de um porteiro demitido depois de uma cirurgia, e Otávio percebeu, ao reler a resposta, que ainda a dava com as mesmas palavras, na mesma ordem, com a mesma ressalva no fim. Onze anos de uma explicação lapidada a cada cliente"
    por_que: 'O parágrafo tem três problemas. (1) Pelo elenco, Otávio "defende pequenas empresas"; o cap. 6 reforça que ele "defendia a empresa". O cliente dele não é o porteiro demitido, que é a parte contrária, e sim quem demitiu. Um advogado trabalhista tropeça nisso na primeira leitura. (2) A cena gasta o cap. 16, que é todo dela: Otávio procura no arquivo o primeiro e-mail de uma explicação ("o primeiro e-mail que encontrou no arquivo sobre o assunto, de 2003"), e Helena nota que ele a dá "com as mesmas perguntas, na mesma ordem" (lições cap04-r1 e cap08-r1). (3) Contradiz a tese do cap. 16 ("Maturidade produz encurtamento": três páginas em 2003, quatro parágrafos hoje) e se contradiz: uma explicação "lapidada a cada cliente" não fica "com as mesmas palavras" por onze anos. Há ainda um estranhamento: com 25 anos de prática e arquivo desde 2003, a pergunta recorrente mais antiga dele tem só onze anos.'
    correcao: 'Tirar a busca pelo e-mail mais antigo e dar ao Otávio um gesto do modo dele que não seja o do cap. 16. Por exemplo: "No Recife, Otávio fez o próprio inventário sem sair da caixa de entrada. As perguntas estavam no campo de assunto dos e-mails, escritas pelos próprios clientes, com a pontuação de quem tem pressa: “Posso descontar o uniforme?”, “Atestado de um dia conta?”. Achou catorze no último semestre e completou dezessete na semana seguinte. Pôs no topo a de um síndico que queria saber se podia demitir o porteiro na volta de uma cirurgia, porque era a que ele mais tinha respondido em pé, no corredor do fórum." Assim o cliente é o empregador, a pergunta chega com as palavras de quem pergunta e nada antecipa o cap. 16.'
  - criterio: aplicabilidade
    trecho: "É ali que as posições costumam aparecer. A do Caio: nem toda parede que pode sair deve sair."
    por_que: 'Pela lição cap01-r1, os exemplos da oficina ficam em profissões diferentes da do personagem em foco. O campo 06 é o único da oficina com exemplo de ofício que não é instrução, e ele repete a posição do Caio que o leitor acabou de ler. Quem não trabalha com obra não vê como a pergunta se aplica à própria área. Os campos 03 e 04 só têm instruções, e o nível 2 ("por que essa dúvida existe") é justamente o que mais pede um modelo.'
    correcao: 'Campo 06: "Uma professora de piano: desaconselho comprar teclado de 61 teclas para quem vai estudar a sério, mesmo sabendo que é o que cabe no orçamento de muitas famílias." Campo 04: acrescentar um exemplo curto, noutra profissão, por exemplo: "Uma farmacêutica: “posso partir o comprimido?” nasce de receitas com doses que a farmácia não tem, e de quem já partiu outro remédio sem problema."'
  - criterio: coerencia
    trecho: "Até ali, nenhuma frase dele sobre paredes e pisos tinha custado nada, porque todo cliente que a ouvira concordara. Esta, não."
    por_que: 'Dois parágrafos antes, o texto diz que Caio propunha não derrubar "na maior parte das visitas", e a própria posição nomeia um tipo recorrente de cliente, "o cliente que chega com a pasta de recortes". Se ele fazia a proposta havia anos e esse cliente é comum, alguém discordou. Das duas, uma: ou ele já perdeu projetos por isso, o que contraria o cap. 12 ("nenhuma daquelas frases lhe tinha custado nada"), ou cedeu, e então nunca foi posição. O texto não diz qual, e a leitura atenta encontra o furo justamente no parágrafo que fecha a linha "em aberto".'
    correcao: '"Até ali, a proposta nunca tinha custado nada, porque ele a fazia como sugestão e, quando o cliente insistia, derrubava. Desta vez, pretendia defendê-la por escrito." Tira também a frase-soco "Esta, não." e dá à cena um ganho novo: a diferença entre sugerir e defender.'
  - criterio: clareza
    trecho: "Nem todas com os três níveis, mas nenhuma com um só."
    por_que: 'A frase, correta, abre um buraco na conta seguinte. A figura 14.2 parte de 57 peças, e a prosa conclui que "o inventário dura mais de um ano"; 57 é o teto, que só vale se TODAS as dezenove tiverem os três níveis, o que a frase acabou de negar. Com "nem todas" e "nenhuma com um só", o estoque real fica entre 38 e 56 peças, e "mais de um ano" pode ser falso. O esquema se apresenta como "feito só com aritmética" e desenha o máximo como se fosse o estoque. É a mesma figura que já reprovou a r1 por conta.'
    correcao: 'Dar ao Caio a contagem real e refazer a figura a partir dela. Por exemplo: "Contou os níveis de cada uma: catorze rendiam três peças, cinco paravam no segundo. Deu cinquenta e duas peças, uma por semana durante um ano." Figura: partida em 52; "Só as 19 perguntas: acaba na semana 52" (52, 39, 26, 13, 0); "Com o caderno de campo: sobram 26" (52, 45.5, 39, 32.5, 26). Ajustar a legenda ("dão 52 peças") e a unidade ("partindo de 52").'
  - criterio: concretude
    trecho: "Se dá para tirar o taco. Se o prédio antigo aguenta ar-condicionado em todos os quartos. Se vale trocar as janelas de ferro. Se reforma com a família morando dentro é loucura."
    por_que: 'O parágrafo anterior diz que a lista foi feita "todas com as palavras dos clientes", a oficina cobra isso num critério e a regra 1 da rede pede a pergunta "como ela chega, entre aspas". A amostra da lista do Caio, porém, vem em discurso indireto, que é exatamente a tradução que o capítulo proíbe. O leitor perde o modelo do que é "a palavra de quem perguntou" no único lugar em que o vê em série.'
    correcao: '"“Dá para tirar esse taco?” “Esse prédio aguenta ar-condicionado em todo quarto?” “Vale trocar essas janelas de ferro?” “Reformar morando dentro é loucura?” Nem todas com os três níveis, mas nenhuma com um só."'
  - criterio: voz
    trecho: "Não inventou a posição para completar a frase. Ela apareceu quando uma pergunta que ele ouvia toda semana o obrigou a escrever o que fazia e por quê."
    por_que: 'A seção "A linha que faltava" empilha duas antíteses explícitas ("Esta, não." e "Não inventou [...]. Ela apareceu"), acima do máximo de uma por seção (lição cap01-r1). O capítulo tem outras de narrador de curso: "quando na verdade era o sinal de que a resposta está madura" e "Com a pergunta que se repete, não há aposta". O parágrafo seguinte fecha em sinalização de apostila: "O campo 06 guarda o que você encontrar."'
    correcao: 'Cortar "Não inventou a posição para completar a frase." e começar em "A posição apareceu quando uma pergunta que ele ouvia toda semana o obrigou a escrever o que fazia e por quê." Resolvida a frase-soco "Esta, não." (ver o problema de coerência acima), a seção fica com zero antíteses. Cortar "O campo 06 guarda o que você encontrar.", porque o rótulo do campo já dá a instrução. Trocar "quando na verdade era o sinal" por "mas era o sinal".'
  - criterio: honestidade
    trecho: "É uma decisão de dois minutos, e ela tira da rotina a parte que mais trava quem está começando."
    por_que: 'A r2 já tinha apontado esta generalização sobre terceiros, sem fonte, e ela ficou. Na mesma linha, "Quem percebe a segunda, e responde às duas, é lembrado como a pessoa que explicou direito" promete um efeito sobre o público que o texto nunca mostra.'
    correcao: '"É uma decisão de dois minutos." E: "Caio aprendeu a responder às duas." (ou "Nas visitas do Caio, é a segunda que o cliente repete ao marido na porta", o que o capítulo mostra de fato na cena do síndico).'
  - criterio: coerencia
    trecho: "Nas visitas do Caio, quem pergunta se dá para derrubar a parede costuma ter, por baixo, outra pergunta que não faz em voz alta: se o prédio vai cair."
    por_que: 'Uma página antes, o caderno registra a pergunta feita em voz alta, com as palavras do cliente: "“Se eu tirar essa parede, o prédio cai?”". A pergunta escondida aparece anotada como pergunta dita.'
    correcao: '"[...] outra pergunta que nem sempre faz em voz alta: se o prédio vai cair."'
  - criterio: coerencia
    trecho: "Na segunda seguinte, Caio mandou ao casal do Taquaral o orçamento com duas opções: a parede inteira fora, como na pasta"
    por_que: 'A régua que Caio acabou de entregar ao cliente é "pedir ao síndico a planta de instalações do prédio antes de pedir orçamento a quem quer que seja", e na visita ele disse que "ninguém derrubaria nada antes de ele ver a planta do prédio e conversar com o síndico". Quatro dias depois, manda orçamento com "a parede inteira fora" sem que o texto diga que viu a planta. O caso-modelo parece desobedecer à própria régua.'
    correcao: '"Na segunda seguinte, com a planta do prédio já conferida com o síndico, Caio mandou ao casal [...]".'
edicoes_de_linha:
  - 'e contou, sem tirar os olhos dele, a obra do Castelo -> e contou, sem tirar os olhos do teto, a obra do Castelo ("dele" pode ser o marido)'
  - 'quando na verdade era o sinal de que a resposta está madura -> mas era o sinal de que a resposta estava madura (concordância de tempo e menos uma antítese)'
  - 'Use o caderno de campo, as mensagens dos últimos meses e a memória das consultas. -> Use o caderno de campo, as mensagens dos últimos meses e a memória dos atendimentos. ("consultas" fala só com a saúde)'
  - 'esqueleto, 4ª parte: O critério para respondê-la, que a pessoa pode usar sozinha. -> A pergunta melhor, e o critério para respondê-la sozinha. (o rótulo é "A pergunta certa", e o texto só falava do critério)'
  - 'e tudo bem publicá-las assim de vez em quando -> e podem ser publicadas assim de vez em quando'
  - 'Era, achava ele, o tipo de coisa que não merecia uma peça. -> Achava que não merecia uma peça. (a frase anterior, "Parecia básica demais", já diz o mesmo)'
diagramacao:
  - 'p012: cerca de 15% em branco no pé. O intertítulo "A pauta que chega pronta" desceu inteiro para a p013, embora cabessem o intertítulo e ao menos três linhas do parágrafo. A r2 apontou o mesmo branco, e ele continua. Rever o keep-with-next do h2, para exigir só 2 linhas de orphans.'
  - 'p016: cerca de 14% em branco no pé, abaixo de "Chegou a dezenove.", e o parágrafo seguinte ("Se dá para tirar o taco...", 4 linhas) abre a p017. Nada indivisível justifica o branco. Conferir se a figura 14.2 está puxando o texto anterior (keep-together em excesso) ou se falta orphans: 2.'
  - 'p017: a figura 14.2 continua sem valores no eixo vertical. Se o estoque de partida mudar (ver problema de clareza), rotular o ponto inicial no gráfico, e não só na linha de unidade.'
  - 'p022: cerca de 25% em branco no pé, porque o roteiro de fala e a nota (cerca de 30% de página) desceram para a p023. É aceitável se o roteiro for tratado como bloco indivisível, mas o Faça/Evite poderia ir para depois do roteiro e fechar a página.'
veredito: "Aprovável, no limite: resolveu o bloqueador de sigilo e os problemas de oficina da r2 e tem o melhor caso de três níveis do livro. Antes de fechar, o parágrafo do Otávio precisa sair do terreno do cap. 16 (e parar de pôr um porteiro como cliente de quem defende empresas), o exemplo do campo 06 precisa mudar de profissão e a conta da figura 14.2 tem de partir do estoque real."
