pontos_fortes:
  - 'A r3 foi resolvida quase inteira, e sem deixar remendo visível. A rotina alternativa agora é de produção ("escrever um artigo, preparar uma aula nova ou manter um relatório periódico"). O campo 02 traz as etapas dela ("juntar o material, montar o roteiro, escrever, revisar, entregar") e a grade ganhou a terceira linha "Etapa: ______". O diagnóstico da Renata ficou guardado para a autópsia ("Qual era, ela só saberia semanas depois."), e o parágrafo do custo social foi cortado. A energia ganhou causa que fecha ("o cansaço de cada semana de trabalho se soma ao da anterior"). A comparação não promete mais produção, e a figura 5.3 está presa ao texto ("a ordem está na figura 5.3"). Lint limpo: 0 travessão, 0 interrogação, 0 frase-soco, frase média 17,4 com desvio 8,9.'
  - 'A espinha do capítulo é própria e memorável: a fisioterapeuta que sabe diagnosticar a desistência dos pacientes e não diagnostica a sua ("Consigo mesma, o raciocínio desapareceu."). O Aurélio tem ofício e medida ("dava para apoiar as mãos na beirada de granito [...] Nos três meses seguintes, não falhou uma semana"). A autópsia usa as perguntas clínicas dela ("o quê, em que horário, em que etapa, depois de quê") e culmina numa imagem de avaliação ("o paciente que diz que tudo dói e, perguntado movimento por movimento, descobre que só dois doem de verdade").'
  - 'Abertura e fecho de editora. A conta da cena fecha, porque com um carrossel a cada dois dias o 23º dia é dia de publicar. A irmã desmonta a culpa com fatos ("Renata acorda às seis há catorze anos, não falta a um paciente"). O fecho encontra a prova no corpo ("quatro, a quatro pacientes diferentes, de pé, com as mãos, sem cansar") e não antecipa o modo oral da Fase II ("esse caminho não passava pela lâmina em branco").'
  - 'A honestidade está acima do PWA: o número mágico é desarmado ("O número vinte e três é dela; não serve de regra para ninguém"), energia é separada de formato na prosa e no autodiagnóstico ("desde que o resto da vida não estivesse parando junto"), e a rede tem limite ético claro ("O ajuste da peça é de método, e não de dose"). A variação de profissões na rede, com a contadora ao lado da enfermeira, era o que faltava para o público não clínico.'
problemas:
  - criterio: coerencia
    trecho: "Os outros três personagens também pararam, cada um num ponto diferente. [...] Otávio e Lúcia pararam por outros motivos, a terceirização e o receio de se expor, que o livro trata no lugar deles. Nenhum deles tem menos disciplina que os outros."
    por_que: 'Três problemas no mesmo parágrafo. (1) Lúcia não parou, porque nunca começou: o elenco diz "Não publica nada", e o cap. 2 é justamente sobre esse silêncio. Otávio também não parou por atrito. A agência publicou até o fim do cap. 4, quando ele pediu "dois meses sem publicações" para repensar. O verbo atribui aos dois uma história que o leitor não viu. (2) "que o livro trata no lugar deles" é ambíguo (pode ser lido como "em nome deles") e soa como promessa, quando os dois motivos já foram tratados nos caps. 2 e 4. (3) "Nenhum deles tem menos disciplina que os outros" erra o alvo: a tese é que ninguém parou por falta de disciplina, e a comparação entre eles não importa. A frase ainda antecipa a batida do cap. 7 ("Nenhum dos quatro tem mais talento do que os outros"), a mesma estrutura dois capítulos adiante.'
    correcao: '"Caio também parou, e num ponto diferente: não teve dificuldade para gravar; o custo dele estava na edição, onze fins de semana para seis vídeos, uma taxa de formato tão clara quanto a da Renata. Otávio e Lúcia não chegaram a esse ponto, por outros caminhos: ele entregou a voz a uma agência (cap. 4), ela nunca começou, por receio de se expor (cap. 2). Nenhum dos quatro tem falta de disciplina."'
  - criterio: concretude
    trecho: "Uma contadora: “Quem promete separar as notas do mês costuma desistir em abril, logo depois da declaração. Uma pasta sanfonada na gaveta da entrada dura mais do que a planilha.”"
    por_que: 'O detalhe de ofício não fecha (lição cap01-r1). Para o leitor comum, "a declaração" é o imposto de renda da pessoa física, cujo prazo termina no fim de maio. "Abril, logo depois da declaração" põe o fim da declaração antes de abril, e um contador que leia a frase percebe o erro. O livro também se contradiz: no cap. 8, outra contadora diz que o pior mês é "Abril, por causa do imposto de renda", isto é, abril está no meio da declaração. É ainda a quarta contadora em oito capítulos (caps. 1, 3, 5 e 8), e o cap. 5 não está registrado para ela em ESTADO.yaml › figurantes.'
    correcao: 'Mudar o mês: "Quem promete separar os recibos do mês costuma desistir em junho, logo depois da declaração. Uma pasta sanfonada na gaveta da entrada dura mais do que a planilha." A regra 2 continua servindo ("depois da declaração"). Registrar contadora, designer de interiores e professor de cursinho no cap. 5. Se o autor preferir evitar a repetição da profissão, trocar por uma professora de piano (só no cap. 1): "Adulto que começa piano costuma parar por volta da oitava semana, quando acabam as músicas que já sabia de ouvido e começa a leitura. Dez minutos por dia com a partitura aberta rendem mais do que uma hora no sábado." Nesse caso, a regra 2 passa a "“Na terceira semana” ou “quando começa a partitura”".'
  - criterio: clareza
    trecho: "Renata precisava descobrir qual etapa custava caro e trocar a etapa, como faz com os exercícios dos pacientes."
    por_que: 'O capítulo usa dois remédios diferentes sem dizer como se relacionam. A comparação diz "A solução é trocar o formato.", a prosa diz "trocar a etapa", a faixa alta diz "troque a etapa que mais custa", e o gabarito 04 diz "isso aponta para uma troca de formato". "Trocar a etapa" também não se sustenta ao pé da letra, porque Renata não pode trocar "escrever o texto de cada uma": ela precisa de um caminho em que essa etapa deixe de existir, que é o que o fecho diz ("esse caminho não passava pela lâmina em branco"). O leitor apressado sai sem saber se muda o formato ou uma etapa dele. Há ainda uma questão de método: a faixa alta manda trocar já, mas o critério para escolher a troca (o modo de pensar) só chega no cap. 7. Quem obedecer hoje troca carrossel por vídeo às cegas.'
    correcao: 'Fixar a relação: a etapa é o endereço, e o formato é o que muda. Na prosa: "Renata precisava descobrir qual etapa custava caro e mudar o caminho em volta dela, como faz com o plano dos pacientes." Faixa alta: "Os sinais apontam para um formato que não combinava com você, desde que o resto da vida não estivesse parando junto. Não tente de novo com mais força; faça a autópsia e anote a etapa que mais custa. A troca de formato vem na Fase II, quando você souber como pensa."'
  - criterio: honestidade
    trecho: "Uma rotina raramente quebra por causa de um grande acontecimento."
    por_que: 'É uma afirmação empírica sobre terceiros, sem fonte, repetida quase literalmente no "Para guardar" ("A sequência raramente quebra por um grande acontecimento"). O capítulo já está no limite de generalizações ("O que costuma se repetir é o desenho"; "A adesão aos exercícios costuma ser alta na primeira semana"). A frase não precisa do "raramente" para funcionar: a cena da Renata prova o ponto sozinha.'
    correcao: 'Prosa: "A rotina da Renata não quebrou por causa de um grande acontecimento. Parou numa quinta-feira comum, um pouco mais pesada que as outras, quando o custo acumulado do formato ultrapassou a energia que sobrava no fim do dia." Guardar: "A sequência não precisa de um grande acontecimento para quebrar. Basta o custo acumulado passar da energia de um dia comum."'
  - criterio: coerencia
    trecho: "Um professor de cursinho: “Sem a lousa e sem aluno na frente, eu não sabia por onde começar o vídeo. Regravava a abertura cinco vezes e desistia no meio.”"
    por_que: 'Pendência da r3 que não foi tratada. O cap. 7 tem um professor de cursinho com a mesma imagem ("Dou aula há seis anos sem usar slide", "explico o mesmo assunto em dois minutos de áudio"), e o cap. 10 tem outro. São três aparições da mesma profissão em seis capítulos, duas delas sobre o professor que rende ao vivo e trava no formato.'
    correcao: 'Trocar por uma profissão ainda livre na vizinhança, por exemplo uma oftalmologista (só no cap. 2): "Uma oftalmologista: “No consultório eu explico com o modelo do olho na mão. Na frente da câmera, sem o modelo e sem paciente, eu regravava a abertura cinco vezes e desistia no meio.”" Registrar no cap. 5.'
  - criterio: voz
    trecho: "Este capítulo parte de outra hipótese: quem se considera inconstante pode estar tentando sustentar uma forma de criar que não combina com o jeito como pensa, vive e trabalha."
    por_que: '"Este capítulo parte de" é o narrador de curso falando do próprio livro, justo no parágrafo que entrega a tese e antecede o box Conceito. O capítulo inteiro evita esse registro, e o trecho destoa. O triplo "pensa, vive e trabalha" volta idêntico no box da p018 ("como eu penso, vivo e trabalho"). Uma vez é marca; duas em cinco páginas, fórmula.'
    correcao: '"Há outra hipótese: quem se considera inconstante pode estar tentando sustentar uma forma de criar que não combina com o jeito como pensa e trabalha. O problema está no encaixe, como estava no plano do Aurélio." Manter o triplo só no box.'
  - criterio: ritmo
    trecho: "Semanas depois do almoço, numa noite sem paciente tardio"
    por_que: '"Semanas depois" é a única marca de tempo do capítulo e aparece três vezes: p012 ("Semanas depois, contou a história à irmã"), p014 ("ela só saberia semanas depois") e p017. A repetição achata a cronologia, e o leitor não sabe se a autópsia vem um mês ou três depois do 23º dia.'
    correcao: 'p017: "Um mês depois do almoço, numa noite sem paciente tardio, [...]". Ou p012: "No fim do mês, contou a história à irmã num almoço de domingo".'
  - criterio: clareza
    trecho: "A taxa parece suportável no primeiro dia e se torna impagável no vigésimo."
    por_que: 'A frase mistura escalas: a designer é contada em semanas ("Na primeira semana", "Na quarta"), e a conclusão salta para dias. Um "vigésimo" genérico, duas páginas antes de "O número vinte e três é dela; não serve de regra para ninguém", sugere justamente a regra que o texto depois desmente.'
    correcao: '"A taxa parece suportável na primeira peça e se torna impagável algumas semanas depois."'
edicoes_de_linha:
  - 'Autodiagnóstico, nota: "releia a seção “Disciplina ou compatibilidade”, nas páginas anteriores" -> "releia “Disciplina ou compatibilidade”, pp. 16 e 17" (no papel, o número da página é o endereço útil; o gabarito já usa referência de página, "Apêndice A, página 27")'
  - 'Renata passa os dias aplicando, em outro assunto, o raciocínio de que precisava. -> Renata passa os dias aplicando aos pacientes o raciocínio de que precisava. ("em outro assunto" é vago; o contraste com "Consigo mesma" fica mais nítido)'
  - 'É essa a pergunta que tira você da posição de incompetente digital e devolve o problema ao lugar onde ele pode ser resolvido. -> Ela tira você da posição de incompetente digital e devolve o problema ao lugar onde ele pode ser resolvido. (a ênfase "É essa a pergunta que" é voz de palestra)'
  - 'que o livro trata no lugar deles -> (ver problema de coerência; se o parágrafo for mantido, ao menos: "de que tratam os capítulos 2 e 4")'
diagramacao:
  - 'p016: título da caixa direita da comparação ainda defeituoso. A hifenização saiu, mas agora a linha é justificada à força: "SE    O    PROBLEMA    É" com vãos enormes, e "COMPATIBILIDADE" sozinho embaixo. A caixa esquerda está alinhada à esquerda, e as duas não conversam. Títulos de caixa com text-align: left (sem justify, sem text-align-last: justify) e hyphens: none, ou tracking menor para caber numa linha.'
  - 'p014: pendência da r3. A unidade da figura 5.1 ("quanto menor a barra, mais fácil sustentar") continua colada à legenda ("Os valores são ilustrativos..."), no mesmo corpo e cor, e as duas se leem como uma frase só. Pôr a unidade acima das barras ou separá-la com espaço e estilo distintos. Na mesma figura, a nota da terceira barra deixa "quebra." sozinho na linha. Alargar a coluna da nota até a largura da barra resolve.'
  - 'p023: cerca de 40% da página em branco DEPOIS do esqueleto. O bloco Faça assim/Evite ocupa uns 37% da p024 e caberia ali, se não estiver preso ao roteiro. A decisão registrada em ESTADO.yaml ("Faça/Evite passa para depois do esqueleto, para eliminar brancos") não está produzindo o efeito aqui. Permitir quebra entre Faça/Evite e o roteiro de fala.'
  - 'Última linha de uma palavra só em fim de parágrafo, pendência da r3: p013 "Aurélio.", p016 "novo." ("Quase tudo funciona enquanto é / novo."), p017 "formato." ("antes de pensar em trocar de / formato."). Na figura 5.3 (p017), "você." sozinho no nó 5. Ajuste local de tracking ou de texto. O "novo." fere a frase que fecha o raciocínio.'
  - 'Brancos aceitos pelo projeto: p020 (~25%, antes da grade indivisível do campo 03) e p022 (~12%, antes do esqueleto). p026 fecha o capítulo, e o Apêndice começa na ímpar. O autodiagnóstico cabe numa página (p019). O capítulo tem 16 páginas (p011 a p026), dentro do alvo. A abertura (p011) está correta, com fase, número, título, subtítulo, epígrafe, ilustração e legenda.'
veredito: "Capítulo aprovável, de nível editorial alto, que resolveu a r3 quase inteira. Faltam uma passada de coerência (Lúcia e Otávio não 'pararam'; o mês da contadora contradiz o calendário do imposto e o cap. 8; o professor de cursinho repetido) e a fixação de uma única ideia de remédio, etapa como endereço e formato como troca, além de três pendências de diagramação que já vinham da r3."
