bloqueadores: []
pontos_fortes:
  - 'Quase tudo o que a r1 apontou foi resolvido, e resolvido bem. Os quatro agora ouvem a mesma pergunta de fundo ("quatro pessoas ouviram, com outras palavras, a mesma pergunta"). O Otávio trava no ponto certo ("Pergunta de cliente ele responde de pronto; uma ideia dele, sem ninguém perguntando nada de concreto, precisava de papel"). A pista do caderno é paga pela forma de anotar, sem contradizer o cap. 6. O "triplo" sumiu. As faixas passaram a ter ordem de leitura. A figura agora leva o selo de esquema ilustrativo.'
  - 'As cenas de abertura continuam sendo o melhor do capítulo. Cada modo aparece em ação, com detalhe de ofício, antes de ganhar nome: "As mãos desenhavam no ar uma coluna, uma dor que sobe, um músculo que protege demais"; "Na primeira, rodeou o assunto. Na segunda, contou duas audiências"; "O cunhado entendeu pela história, e Caio também."'
  - 'O capítulo trata o resultado com honestidade exemplar: "A nota de atrito dessa etapa, refeita duas semanas depois, caiu para 4. O tempo gasto continuou parecido, e sentar para começar ficou bem mais fácil." O teste é chamado de "estimativa" e o caderno de campo, de juiz final.'
  - 'As subseções dos modos ficaram mais enxutas e variadas. O par risco e remédio aparece em formas diferentes, e o dialógico se liga ao caderno de campo ("O remédio é ter perguntas guardadas, e o caderno de campo está cheio delas"). O lint está limpo, sem frase-soco nem travessão, com frase média de 18,3 palavras e desvio de 8,4.'
problemas:
  - criterio: coerencia
    trecho: "Otávio, que escreve com prazer, sofreria para gravar vídeos falados de improviso; cada gravação seria uma tradução do texto que ele tem na cabeça para uma fala que não é a dele."
    por_que: 'O trecho contradiz uma cena-chave do cap. 4. Lá, Otávio grava de improviso três minutos sobre o "acertar por fora" ("Gravou só para ouvir"; "o áudio saiu sem nenhum [cuidado]"), e o livro conclui: "era a primeira vez que alguma coisa dita por ele para fora do escritório soava como ele". O cap. 6 ainda lembra esse áudio. Dizer agora que a fala improvisada "não é a dele" desmente o momento em que ele encontrou a própria voz. A distinção que o próprio cap. 7 criou resolve o conflito: o áudio do cap. 4 respondia a um assunto que clientes trazem recortado, e é isso que ele faz bem falando.'
    correcao: '"Otávio, que escreve com prazer, sofreria para gravar de improviso uma ideia que ainda não passou pelo papel. O áudio do “acertar por fora” saiu fácil porque respondia a uma pergunta que cliente faz toda semana; um vídeo sobre o que ele pensa, sem pergunta nenhuma, seria uma tradução do texto que ele tem na cabeça." Manter em seguida a frase "Não há nada de errado com vídeo nem com carrossel".'
  - criterio: aplicabilidade
    trecho: "Nenhuma soma passa de 6, ou três empatam. Refaça o teste depois de uma semana de caderno de campo."
    por_que: 'A faixa foi testada só contra o empate no topo. Como é a primeira a ser lida, "três empatam" captura qualquer trio igual, inclusive os três mais baixos. Com somas 10-5-5-5, o modo mais marcado possível, o leitor para em "Perfil difuso" e é mandado refazer o teste. A lição cap01-r4 pede testar cada faixa contra combinações extremas.'
    correcao: '"Nenhuma soma passa de 6, ou as três maiores estão a 1 ponto ou menos umas das outras." Conferir de novo com 10-5-5-5 (dominante), 9-9-9-3 (difuso), 10-9-2-2 (duplo), 6-6-6-6 (difuso) e 7-5-2-2 (dominante).'
  - criterio: coerencia
    trecho: "Quando o formato não corresponde ao modo, aparece uma etapa que ninguém vê: a tradução de formato, que é passar o pensamento da forma em que ele nasce para a forma em que vai sair. A fase III usa a palavra tradução num sentido mais largo, para a passagem da experiência à peça; aqui ela é só troca de forma. Antes de produzir, você precisa converter o pensamento da forma em que ele nasce para a forma que escolheu publicar."
    por_que: 'O parágrafo tem três problemas. (1) Apresenta como novidade o que o cap. 5 já revelou, quase com as mesmas palavras: "havia uma etapa que ninguém vê e que gastava justamente o fôlego que faltou no vigésimo terceiro dia" e "O atrito morava no meio, numa etapa de tradução de formato". Aqui aparece de novo "uma etapa que ninguém vê" e "consome justamente a energia que faltou". (2) A definição vem duas vezes em frases seguidas ("passar o pensamento da forma em que ele nasce para a forma em que vai sair" e "converter o pensamento da forma em que ele nasce para a forma que escolheu publicar"). (3) O aparte sobre a Fase III interrompe o raciocínio com voz de narrador que anuncia e grafa "fase III" em minúscula. Com 129 palavras, é o parágrafo mais pesado do capítulo.'
    correcao: 'Partir do cap. 5 em vez de redescobrir: "A etapa que Renata encontrou na autópsia do capítulo 5 tem nome: tradução de formato, a passagem do pensamento da forma em que ele nasce para a forma em que vai sair. (A Fase III usa tradução, sem qualificação, para outra coisa: a passagem da experiência à peça.) Ela não aparece no planejamento, não é contada como trabalho e cobra o seu preço no começo de cada peça. No caso da Renata, cada carrossel exigia transformar uma explicação falada, com as mãos, em frases curtas e ordenadas, depois de dez horas de atendimento." Cortar a frase "Antes de produzir, você precisa converter...".'
  - criterio: clareza
    trecho: "Mais do que preferência estética ou habilidade treinada, é a forma como o seu pensamento naturalmente se estrutura."
    por_que: '"Mais do que" diz que o modo inclui preferência e habilidade e vai além delas. É o contrário da fonte ("Não é preferência estética nem habilidade treinada") e do próprio gabarito da questão 01 ("O modo não é preferência nem habilidade treinada"). O box Conceito, que vai para o glossário, e o gabarito dizem coisas diferentes sobre a definição central do capítulo.'
    correcao: 'Definição: "A operação mental em que você organiza ideias com menos esforço e mais clareza: a forma como o seu pensamento se estrutura por conta própria, antes de qualquer gosto estético ou habilidade treinada." O lint ainda permite uma antítese, então também serve "Não depende de gosto estético nem de habilidade treinada: é a forma como o seu pensamento naturalmente se estrutura."'
  - criterio: aplicabilidade
    trecho: "Qual formato eu vinha forçando por obrigação, e quanto cada peça me custava?"
    por_que: 'O campo supõe que o leitor já publicava, e o público do livro inclui quem nunca publicou (a própria Lúcia). O cap. 5 resolveu isso na oficina e no autodiagnóstico ("Se nunca tentou publicar, use outra tarefa de produção que abandonou"), mas este capítulo não. Quem nunca publicou fica sem ter o que escrever no campo 03 e perde 2 pontos no checklist ("Identifiquei o formato que eu vinha forçando"), ou então inventa uma resposta.'
    correcao: 'Exemplo do campo 03: "Em minutos e em disposição; use as notas de atrito do capítulo 5. Se nunca publicou, anote o formato que você imaginava usar (ou a tarefa que abandonou no capítulo 5) e diga o que nele exigiria sair do seu modo." Na ajuda do checklist: "Sei qual era, ou qual seria, e quanto custava (campo 03)."'
  - criterio: concretude
    trecho: "Lúcia respondeu durante vinte minutos, com exemplos, distinções finas e uma pergunta de volta que desmontou a dúvida da colega. A colega saiu com a dúvida desfeita."
    por_que: 'Das quatro cenas, só a da Lúcia não mostra a ideia a que a personagem chegou. Renata acha a frase do alarme, Otávio a tese sobre "o que não fazer" e Caio "decidir o que não mexer". A Lúcia ficam "exemplos, distinções finas", que é justamente o adjetivo no lugar do detalhe. O parágrafo seguinte afirma que "Cada um chegou à sua ideia central", e no caso dela o leitor não vê qual. "Dúvida" também se repete em frases seguidas.'
    correcao: 'Dar a ela uma frase que nasça da pergunta de volta, sem gastar "rótulo não é diagnóstico" nem o contraponto do cap. 17. Por exemplo: "...e uma pergunta de volta, “o que o paciente já tentou para não sentir isso?”, que desmontou a dúvida da colega. Dali saiu a ideia que ela nunca tinha dito assim: na primeira sessão, a queixa importa menos do que o que a pessoa faz para fugir dela. A colega anotou." Cortar "A colega saiu com a dúvida desfeita."'
  - criterio: concretude
    trecho: "Cortar a transcrição em dez trechos. Cada trecho vira uma lâmina, com as palavras dela intactas."
    por_que: 'O detalhe de ofício não fecha. Quatro minutos de fala dão umas 500 a 600 palavras, e dez lâminas com 50 a 60 palavras de fala crua, com repetições e frases que mudam no meio (o cap. 4 manda preservá-las só na transcrição), não formam um carrossel legível. O próprio capítulo diz, duas páginas depois, que o trabalho da Renata "virava cortar e ajustar". O "Por quê" do box ainda fecha com "O pensamento nasceu no formato certo", quando a tese do capítulo é que o pensamento nasce no modo e o formato vem depois.'
    correcao: 'Singular: "...Cortar a transcrição em dez trechos, tirar as repetições e deixar em cada lâmina uma ou duas frases dela, com as expressões que ela usa no consultório." Por quê: trocar a última frase por "O pensamento nasceu no modo dela; o formato veio depois."'
  - criterio: clareza
    trecho: "Caio conta as histórias dele melhor em voz alta do que por escrito, e isso o aproxima do oral; Lúcia escreve bem quando responde a uma pergunta por escrito."
    por_que: 'O exemplo do Caio mostra um modo secundário e o da Lúcia não. Responder por escrito a uma pergunta continua sendo o modo dialógico, só que num canal escrito. Isso confunde modo com formato, a distinção que o capítulo inteiro sustenta. O leitor não sabe se deve concluir que o secundário da Lúcia é o escrito.'
    correcao: 'Nomear o secundário dela de forma inequívoca. Por exemplo: "Lúcia, quando não tem pergunta nenhuma, recorre a um caso de consultório com os dados trocados, e isso a aproxima do narrativo." Ou manter o canal escrito e dizer o que ele prova: "Lúcia escreve bem, desde que a página comece por uma pergunta: o canal muda, o modo não."'
  - criterio: coerencia
    trecho: "Uma professora de piano: “Explico uma passagem difícil tocando e falando, e a aluna entende na hora; por escrito, a mesma explicação vira uma página que ninguém lê.”"
    por_que: 'A professora de piano já aparece na oficina do cap. 6 ("Uma professora de piano: “Não passei o aluno para a peça que ele pediu...”"). A lição cap02-r2 veta repetir profissão de figurante em capítulos vizinhos. A sugestão veio da própria r1, que não conferiu o cap. 6, e o registro de figurantes no ESTADO também não anota a professora de piano no cap. 6. Também não fica claro de quem é a segunda evidência ("Meus e-mails longos ficam confusos...").'
    correcao: 'Trocar por uma profissão ainda não usada nos caps. 6 a 8, como a nutricionista: "Uma nutricionista: “Explico a troca de lanche com o prato na mão e a paciente entende na hora; o mesmo plano, por escrito, volta intocado na consulta seguinte.” E: “Meus e-mails longos ficam confusos, mas explico o mesmo assunto em dois minutos de áudio.”" Registrar a professora de piano no cap. 6 em ESTADO.yaml › figurantes.'
  - criterio: aplicabilidade
    trecho: "É adaptar a mesma peça para cada rede social em que ela vai sair."
    por_que: 'Na questão 02, este distrator não é falso sem ambiguidade. Adaptar uma peça de carrossel para vídeo é passar de uma forma para outra, perto demais da definição dada no texto ("a forma em que ele nasce para a forma em que vai sair"). A alternativa "d" ("trocar os termos técnicos por palavras que o público entende") ficou, apesar da r1, e descreve parte do que a Fase III chamará de tradução. O leitor atento hesita entre três alternativas.'
    correcao: 'Alternativa "c": "É pedir a um colega que revise a peça antes de ela sair." Alternativa "d": "É calcular quantas peças cabem na sua semana de trabalho." As duas são inequivocamente falsas e têm comprimento parecido com o da correta.'
  - criterio: voz
    trecho: "O teste a seguir ajuda a identificar os seus dois primeiros modos. É uma estimativa. O caderno de campo, nas próximas semanas, vai confirmá-la ou corrigi-la com a sua própria prática."
    por_que: 'A prosa termina anunciando a seção seguinte, o que a lição cap01-r1 e a cap02-r1 vetam ("não listar as seções seguintes", "o fecho [...] termina na cena ou numa consequência"). O parágrafo também abre com "Nenhum dos quatro tem", a mesma fórmula que abre "O mesmo talento, quatro caminhos" ("Nenhum dos quatro tem mais talento"). Na cena do Otávio, "Só entendeu o que pensava depois de ver escrito" explica o que a cena acabou de mostrar e antecipa, palavra por palavra, a subseção do modo escrito, o item 2 do teste e a questão 04.'
    correcao: 'Fecho: "Por isso nenhum resultado de teste vale mais do que o caderno de campo das próximas semanas: é ele que confirma o seu modo, ou o corrige." Abertura do parágrafo: "Ninguém tem um modo puro." Na cena do Otávio, cortar "Só entendeu o que pensava depois de ver escrito." e terminar em "o que já foi feito".'
  - criterio: aplicabilidade
    trecho: "Eu reescrevo mensagens antes de enviar, mesmo as simples."
    por_que: 'O item, herdado da fonte, mede cautela ou perfeccionismo tanto quanto modo. Um leitor ansioso de modo dialógico pontua alto no eixo E, e com dois itens por eixo um item enviesado desloca a faixa. No texto, o sinal vem acompanhado de outro que o leitor não consegue verificar ("ter os e-mails guardados pelos clientes").'
    correcao: 'Item 6: "Quando preciso pensar num assunto difícil, escrevo sobre ele antes de conversar com alguém." Na subseção do modo escrito, trocar "e ter os e-mails guardados pelos clientes" por "e preferir mandar por escrito o que poderia dizer numa ligação". A questão 04 pode continuar com a fonte.'
edicoes_de_linha:
  - '"No Recife, um colega de faculdade, hoje professor, telefonou a Otávio convidando-o para uma conversa com os alunos sobre o que ele sabe hoje que nenhum professor ensinou." -> "No Recife, um colega de faculdade que hoje dá aula telefonou a Otávio e o convidou para conversar com os alunos sobre o que ele sabe e nenhum professor ensinou." ("hoje" e "professor" aparecem duas vezes na mesma frase.)'
  - '"Nenhum dos quatro tem mais talento do que os outros, e nenhum respondeu mal." -> "Nenhum dos quatro tem mais talento do que os outros, e todos chegaram a uma resposta." (A primeira resposta do Otávio foi fraca, e a página da Lúcia ficou em branco.)'
  - '"A divagação é o preço: a ideia aparece cercada de voltas, e se corta depois, nunca antes de falar." -> "A divagação é o preço: a ideia aparece cercada de voltas, e as voltas se cortam depois, nunca antes de falar."'
  - '"Sem alguém do outro lado, a explicação simplesmente não vinha." -> "Sem alguém do outro lado, a explicação não vinha."'
  - '"Renata quase não escreve: três palavras e uma seta, e o resto ela explica em voz alta." -> "Renata quase não escreve: três palavras e uma seta, e o resto só existe quando ela explica em voz alta."'
  - '"Há um motivo histórico para desconhecer o próprio modo." -> "Há um motivo antigo para desconhecer o próprio modo." (O que o parágrafo conta é biografia escolar, e não história.)'
  - '"legenda: Na coluna Respostas, respostas a perguntas do público." -> "legenda: “Respostas” são respostas escritas ou gravadas a perguntas do público."'
  - '"Ele resolve o atrito; o conteúdo continua sendo seu trabalho." -> "Ele reduz o atrito; o conteúdo continua sendo seu trabalho." (Resolver é promessa.)'
  - '"Renata passou a gravar áudios curtos no carro" -> "Renata passou a gravar áudios de três ou quatro minutos no carro" (o parágrafo seguinte fala de "uma explicação inteira", e o cap. 19 reserva os áudios de 20 segundos).'
diagramacao:
  - 'p015, figura 7.1: o problema da r1 continua. O cabeçalho "Respostas" encosta em "Conversa" e se lê "RespostasConversa". Fixar a largura de cada coluna e quebrar o rótulo em duas linhas ("Perguntas / do público") ou reduzir o corpo do cabeçalho. Conferir se há pelo menos 2 mm entre os rótulos.'
  - 'p016: cerca de 30% da página em branco depois de "que pode sair das suas mãos.", porque o box "Na prática" foi empurrado inteiro para a p017. O branco é evitável: pôr antes do box o parágrafo "A tradução de formato, no fim do processo, pode ser feita por você...", que não depende dele, ou deixar o box vir depois desse parágrafo.'
  - 'p022: três quartos da página em branco depois das regras 3 e 4 da rede. O branco antes do esqueleto é aceito pelo projeto, mas aqui dá para evitá-lo: com "faca_antes: true" (como no cap. 6), o bloco Faça assim/Evite, que ocupa um quarto da p023, sobe para a p022, e o roteiro de fala provavelmente cabe na p023, junto do esqueleto. O capítulo pode ganhar uma página.'
  - 'p014: o primeiro parágrafo depois de cada intertítulo de nível 3 (ORAL, ESCRITO, DIALÓGICO, NARRATIVO) sai com recuo, enquanto depois dos intertítulos de nível 2 (p013, p015, p016) sai sem recuo. Unificar sem recuo depois de qualquer título.'
  - 'p013: cerca de 18% em branco no pé da página, porque o box Conceito foi para a p014. É tolerável; conferir depois dos outros ajustes, que mudam a paginação.'
veredito: "Revisão sólida, que resolveu o bloqueador e quase todas as contradições da r1, mas ainda abaixo do gate. Faltam três correções: a fala improvisada do Otávio contradiz o áudio do cap. 4, a primeira faixa do teste manda o leitor de modo fortemente dominante refazer o teste, e o parágrafo da tradução de formato repete o cap. 5 e a própria definição. Faltam ainda ajustes menores de definição, oficina e figura."
