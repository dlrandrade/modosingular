capitulo: 21
iteracao: 3
notas: {metodo: 9.0, voz: 9.1, originalidade: 9.2, clareza: 8.9, ritmo: 9.0, concretude: 8.2,
        coerencia: 8.5, aplicabilidade: 8.8, impresso: 8.4, honestidade: 9.1}
bloqueadores:
  - "Erro de fato de ofício no caso central (lição cap09-r1). O capítulo põe o escritório trabalhista do Otávio em plena pauta de audiências nas três primeiras semanas de janeiro: 'o escritório vive de audiências marcadas às pressas', 'Nas três primeiras semanas, o escritório fez nove audiências' e 'almoçou no carro, entre o fórum e o escritório'. Na Justiça do Trabalho os prazos ficam suspensos de 20 de dezembro a 20 de janeiro, e nesse período 'não se realizarão audiências nem sessões de julgamento' (CLT, art. 775-A, § 2º, incluído pela Lei 13.545/2017). Um advogado trabalhista com 25 anos de prática, que é o público do livro, para de ler aqui. O janeiro pesado continua crível, só que por outro motivo: rescisões conferidas às pressas, clientes com notificação na mão e as defesas que precisam estar prontas para quando os prazos voltarem a correr, no dia 21. Correção: 'As pequenas empresas que ele defende fazem em janeiro as demissões que adiaram no fim do ano, o telefone não para, e o escritório passa o mês preparando as defesas que vão vencer todas juntas quando os prazos voltarem a correr, no dia 21.' E: 'Nas três primeiras semanas, Otávio assinou dezessete pareceres, quase todos sobre rescisões que os clientes tinham adiado para depois das festas. Houve dias em que ele almoçou no carro, entre uma empresa e outra.' A audiência de conciliação da primeira sexta de dezembro pode ficar (é anterior ao dia 20)."
pontos_fortes:
  - "Quase tudo o que a r2 pediu foi resolvido com precisão: a regra de sigilo agora é a do livro ('nenhum verso sai antes de um mês do último parecer sobre o mesmo assunto, a regra do capítulo 13: [...] a data anda quando o assunto volta'), a rede diz 'Dirija a lição a um estranho, no seu modo.', a grade virou sete linhas rotuladas com espaço para 'hora, lugar e minutos', o gabarito da q. 4 traz o argumento do pior mês, a secretária substituiu a Helena na digitação e o eco do cap. 4 foi assumido ('a resposta que ele tinha escrito à mão para a dona das lavanderias, meses antes, e que a agência não soubera dar'), o que faz o banco de horas voltar como ganho de arco, e não como repetição."
  - "A imagem central continua a melhor da Fase IV e é de ofício, presa ao modo do personagem: 'antes de fechar a pasta, virou a folha. No verso em branco, com a mesma caneta, escreveu um parágrafo.' A troca de destinatário é uma técnica que o leitor consegue repetir: 'A primeira frase era para quem já estava sentado diante dele. A segunda era para quem ainda não sabia que precisava estar.'"
  - "O conceito ganha sua melhor formulação na prosa, e não no box: 'Presa a esse momento, a peça herda a regularidade dele.' O argumento do formato do tempo agora fecha com a história do personagem e com o critério do livro: 'Duas horas seguidas, com energia e sem interrupção, existiam nas semanas boas e sumiam exatamente nas que mais importavam.'"
  - "Boa disciplina diante do PWA: saem os 380 minutos do 'feed alheio', a 'versão mínima para semana ruim' (reservada ao cap. 29) e as diretrizes que mandavam o leitor falar do próprio processo; o Evite proíbe 'Falar da sua rotina, da sua disciplina ou do seu jeito de produzir', e a peça fica 100% sobre a área. O fecho do maço lido por Helena termina em ação e planta os caps. 24 e 28 sem anunciá-los."
problemas:
  - criterio: concretude
    trecho: "Nas três primeiras semanas, o escritório fez nove audiências e Otávio assinou dezessete pareceres"
    por_que: "Ver bloqueador: não há audiências trabalhistas entre 20 de dezembro e 20 de janeiro (CLT, art. 775-A, § 2º). O erro aparece em três frases do mesmo trecho ('vive de audiências marcadas às pressas', 'nove audiências', 'entre o fórum e o escritório') e sustenta o 'janeiro manda' que o livro vem plantando desde o cap. 12."
    correcao: "Trocar as audiências pelo que de fato enche o janeiro de um trabalhista de empresa: rescisões, notificações, defesas represadas para o dia 21. Texto sugerido no bloqueador. Conferir se algum outro capítulo (12, 24, 28) atribui o peso de janeiro às audiências."
  - criterio: coerencia
    trecho: "faça a lição dela para um estranho, no formato-base do capítulo 20"
    por_que: "A rede manda usar o formato-base do leitor e, em seguida, entrega outro esqueleto e outro roteiro, com abertura fixa própria ('Tem uma situação que aparece muito no meu trabalho'). O cap. 20 acabou de ensinar 'Abra sempre do mesmo jeito' e de pedir ao leitor 'A sua frase de sempre' como primeira linha, com a regra das trinta repetições antes de qualquer troca. Um leitor que fixou o 'teve uma obra' do Caio, ou a abertura de uma cardiologista ('A pergunta desta semana no consultório foi…'), não sabe qual das duas estruturas seguir; se seguir a do cap. 21, quebra o formato-base na primeira semana."
    correcao: "Fazer o esqueleto servir dentro do formato-base. Roteiro, primeira linha: '{A sua abertura de sempre}. {O tipo de situação, sem ninguém}.' Roteiro_nota: 'Se o seu formato-base tem ordem própria, como as cinco linhas do Caio, mantenha a ordem dele e só confira se a situação, o erro, a lição e a pergunta estão lá. A pergunta final faz o papel do critério.' No esqueleto, rótulo 'A situação' com texto 'Depois da sua abertura de sempre, o tipo de situação, sem o cliente.'"
  - criterio: clareza
    trecho: "O segundo é o deslocamento, o tempo do carro, da fila, do trajeto, que já é seu: é onde Renata grava as peças inteiras, no estacionamento, antes de ligar o motor."
    por_que: "O exemplo de deslocamento é, pela definição que o próprio capítulo dá três linhas depois, uma transição: o carro parado no estacionamento, antes de sair, é 'o bloco curto entre o fim de uma coisa e o começo de outra'. O leitor fica sem um único exemplo real de deslocamento (fila, ônibus, sala de espera, banco do passageiro) e sem saber distinguir os dois encaixes, justamente o que o campo 02 pede que ele escolha. Além disso, a mesma imagem volta quase literal no parágrafo seguinte: 'Renata grava com o carro parado, antes de ligar o motor.'"
    correcao: "'O segundo é o deslocamento, o tempo da fila, do ônibus, da sala de espera, do banco do passageiro, que já é seu. Para quem dirige, ele começa antes da partida: é onde Renata grava as peças inteiras, no estacionamento, antes de ligar o motor.' No parágrafo dos modos, cortar a repetição: 'Quem pensa falando tende a render no carro, porque a voz está livre, e a Renata mostra onde: parado, antes da partida.' Ou só 'Quem pensa falando tende a render no carro parado, porque a voz está livre.'"
  - criterio: coerencia
    trecho: "Pegou um dos primeiros que tinha escrito, na segunda quinzena de dezembro, sobre a advertência escrita depois da demissão."
    por_que: "Dois problemas no verso escolhido. (1) Pela regra que o próprio capítulo acabou de fixar ('a data anda quando o assunto volta'), um verso sobre advertência na demissão dificilmente estaria vencido num janeiro de 'dezessete pareceres, quase todos sobre rescisões': é o assunto com mais chance de ter voltado (a r2 já tinha levantado o risco). (2) O mesmo assunto é o do cap. 9 ('advertências feitas na véspera da audiência') e o da peça de abril que o cap. 28 trata como descoberta ('uma peça de abril, sobre advertências escritas na véspera da audiência [...] tinha passado despercebido'). Publicado em janeiro, o tema perde o frescor que o cap. 28 precisa."
    correcao: "Escolher um verso de assunto que janeiro não trouxe de volta, e dizê-lo: 'Pegou um dos primeiros que tinha escrito, na segunda quinzena de dezembro, sobre férias coletivas, um assunto que nenhum parecer de janeiro tinha tocado.' (ou outro tema sazonal de dezembro)."
  - criterio: coerencia
    trecho: "Na semana inteira | Uma peça publicada e alguns parágrafos guardados | Cerca de quarenta minutos"
    por_que: "A conta do personagem não fecha com a própria tabela e com a cena (lição cap01-r1). Cinco minutos 'quatro a seis vezes' dão 20 a 30; mais os 20 da sexta e as capturas de vinte segundos, a semana fica entre 42 e 53 minutos. A semana da cena teve 'os seis da semana', ou seja, uns 50. O texto repete 'cerca de quarenta' quatro vezes (tabela, prosa, figura, Para guardar) e ainda diz 'Quarenta minutos em pedaços de cinco', quando o maior pedaço tem vinte."
    correcao: "Tabela: 'Entre quarenta e cinquenta minutos'. Prosa: 'O total ficou entre quarenta e cinquenta minutos por semana, espalhados.' e 'Menos de uma hora em pedaços existiu na semana do Otávio até em janeiro.' Figura: rótulo 'A peça como consequência: 40 a 50, em pedaços' (valor 45). Para guardar 3: 'menos de uma hora em pedaços sobrevive ao pior mês; duas horas seguidas, não.' Gabarito q. 4 no mesmo sentido."
  - criterio: aplicabilidade
    trecho: "O encaixe que você testou hoje, o que aconteceu e a primeira lição que ele deixou"
    por_que: "O capítulo proíbe o encaixe depois do jantar e, ao mesmo tempo, cobra 'Testei um encaixe hoje' (2 pontos). Quem lê o capítulo à noite, que é quando boa parte do público de agenda cheia lê, não tem como testar um encaixe válido no mesmo dia sem violar o critério 1. Além disso, o campo 05 pede três coisas (o teste, o que aconteceu e uma lição escrita para um estranho) em quatro linhas, o que à mão dá umas 45 palavras: não cabe um parágrafo como o do verso."
    correcao: "Rótulo: 'O encaixe que você testou (hoje ou no primeiro encaixe de amanhã), o que aconteceu e a primeira lição que ele deixou'. Tempo_nota: 'e um encaixe testado no seu dia, hoje ou amanhã'. Checklist: 'Testei um encaixe' (sem 'hoje'). Subir o campo 05 para 6 linhas, ou separar em 05a (o teste, 2 linhas) e 05b (a lição para um estranho, 4 linhas)."
  - criterio: metodo
    trecho: "A recomendação ao cliente já existe. Tirar dela o nome, a cidade e o setor é o que a transforma numa peça que serve a outras pessoas."
    por_que: "O porquê da regra 1 reduz a técnica a tirar identificadores, quando o capítulo mostrou que o ganho está na troca de destinatário e de tom: 'A mudança de destinatário muda o tom'. De 'recomendamos que a empresa implante controle mensal assinado' para 'quem tem uma pequena empresa e usa banco de horas precisa de uma folha por mês'. O leitor que só apagar nomes vai publicar um parecer anônimo."
    correcao: "'A recomendação ao cliente já existe. Tirar dela o nome, a cidade e o setor é o mínimo; o que a transforma em peça é trocar o destinatário: escrever para quem ainda não sabe que precisa dela.'"
  - criterio: coerencia
    trecho: "a orientação que o veterinário escreve para o tutor levar para casa"
    por_que: "Veterinária é a figurante do comum-vs-singular do cap. 22, o capítulo seguinte, e já esteve nos caps. 2, 10, 13, 15 e 18 (lição cap02-r2: profissões de figurantes não se repetem em capítulos vizinhos). Na oficina, a professora de piano fica colada ao professor de violão do cap. 20 (mesmo ofício, mesmo tipo de exemplo); esse caso é menor, mas soma."
    correcao: "Trocar o veterinário da prosa por uma profissão sem uso recente, por exemplo: 'a orientação de alta que a enfermeira escreve para a família levar para casa'. Se houver folga, trocar também a professora de piano por uma profissão fora da música (conferir ESTADO.yaml › figurantes) e registrar o cap. 21 lá."
  - criterio: ritmo
    trecho: "Otávio terminou o parecer de uma pequena rede de oficinas mecânicas de Jaboatão sobre o banco de horas dos mecânicos. Terminou à mão a última folha do rascunho"
    por_que: "A primeira frase do livro neste capítulo tropeça em 'terminou... Terminou' em frases seguidas, e 'oficinas mecânicas [...] dos mecânicos' repete a raiz na mesma oração. Lido em voz alta, a abertura soa rascunhada, logo no parágrafo que carrega a imagem do capítulo."
    correcao: "'Na terceira terça-feira de janeiro, às seis e dez da tarde, Otávio chegou ao fim do parecer de uma pequena rede de oficinas de Jaboatão sobre o banco de horas dos funcionários. Escreveu à mão a última folha do rascunho, a que a secretária digitaria no dia seguinte, e, antes de fechar a pasta, virou a folha.'"
edicoes_de_linha:
  - "Terminou à mão a última folha do rascunho -> Escreveu à mão a última folha do rascunho (evita 'terminou... Terminou')"
  - "oficinas mecânicas de Jaboatão sobre o banco de horas dos mecânicos -> oficinas mecânicas de Jaboatão sobre o banco de horas dos funcionários"
  - "Quem pensa falando tende a render no carro, porque a voz está livre: Renata grava com o carro parado, antes de ligar o motor. -> Quem pensa falando tende a render no carro parado, porque a voz está livre. (a imagem da Renata já está no parágrafo anterior)"
  - "Quarenta minutos em pedaços de cinco existiram -> Menos de uma hora em pedaços existiu (ver problema da conta)"
  - "unidade: minutos por semana, medidos por ele -> minutos por semana, anotados por ele (os 120 são o bloco marcado 'das três às cinco', não uma medição)"
  - "Sexta, às cinco e meia | Datar os versos da semana, escolher um que já passou da data -> Sexta, às cinco e meia | Conferir as datas dos versos, escolher um que já passou da data (na prosa, os versos já têm 'a data a lápis' desde o dia em que foram escritos: 'o da semana vai para a pasta com a data a lápis')"
  - "Porque a agência atrasou a entrega das artes. (q. 1) / Porque a agência voltou a publicar no lugar dele. (q. 1) / De uma sugestão da agência (q. 2) -> trocar um dos dois distratores de agência da q. 1 por outro ('Porque o caderno de campo estava vazio em dezembro.'); três distratores sobre a agência em duas questões entregam o padrão."
diagramacao:
  - "p. 11: a ilustração de abertura é idêntica, traço por traço, à do cap. 20 (p. 11 do cap20: as mesmas três engrenagens, a mesma dourada, os mesmos raios de saída). Apontado na r1 e na r2 e não resolvido. O leitor vira a página do cap. 20 para o 21 e vê a mesma abertura; a 'mais uma saída' da legenda não aparece como diferença. Trocar a ilustração de um dos dois ou redesenhar a do 21 (uma engrenagem só, com uma segunda saída visível)."
  - "p. 17: cerca de oito linhas em branco no pé da página e o parágrafo final de 'O que sobra' partido com só duas linhas na p. 18 ('aparecido nos pareceres de janeiro [...] controle de horário.'). Não há bloco indivisível logo depois (só o Para guardar, que cabe na p. 18). Branco evitável, apontado na r2; ajustar widows/orphans para levar o parágrafo inteiro na p. 17."
  - "p. 17: o subtítulo da figura 'minutos por semana, medidos por ele' continua em sans negrito, no mesmo peso dos rótulos das barras (sugestão da r1 e da r2). Passar para corpo menor, sem negrito, ou itálico como a legenda."
  - "p. 16: cerca de cinco linhas em branco no pé porque a Figura 21.1 não coube; aceitável. p. 18 (Para guardar sozinho antes da oficina), p. 19 (branco antes do campo 03, indivisível), p. 22 (branco depois do roteiro) e p. 24 (fim do capítulo) aceitos pelo projeto."
  - "p. 20: as linhas rotuladas do campo 03 resolvem a r2. Com uma linha por dia, cabe um momento; se o leitor tiver captura e produção no mesmo dia, falta espaço. Considerar duas linhas por dia útil, ou um exemplo que mostre as duas coisas numa linha ('intervalos: captura, 2 min; 18h, mesa: produção, 5 min')."
veredito: "Capítulo quase pronto, com a melhor imagem da Fase IV e as correções da r2 bem feitas, mas o janeiro de audiências do Otávio contradiz a suspensão legal de 20 de dezembro a 20 de janeiro, um erro que um trabalhista pega na hora. Somam-se a rede, que briga com o formato-base do cap. 20, e a conta dos 'quarenta minutos', que não fecha; resolvidos esses pontos, o capítulo passa."
