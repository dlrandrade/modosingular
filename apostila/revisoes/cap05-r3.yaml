bloqueadores: []
pontos_fortes:
  - 'Quase tudo o que a r2 apontou foi resolvido, e sem remendo visível. O autodiagnóstico ganhou a pergunta de controle ("Antes de ler a faixa: nesse mesmo período, você abandonou também coisas de que gosta?") e faixas que respeitam a ressalva de energia ("desde que o resto da vida não estivesse parando junto"). O parágrafo dos quatro personagens agora só usa o que os capítulos anteriores mostraram ("Otávio pagou a dele terceirizando, e o capítulo anterior mostrou o preço"). As generalizações sobre "muita gente" saíram, e o fecho termina em consequência ("esse caminho não passava pela lâmina em branco").'
  - 'O capítulo tem uma espinha própria e memorável: a fisioterapeuta que sabe diagnosticar a desistência dos pacientes e não diagnostica a sua. O caso do Aurélio ("dava para apoiar as mãos na beirada de granito e fazer o exercício sem que nenhum morador percebesse"), o retorno marcado "para ajustar o plano antes da desistência" e a autópsia feita com as mesmas perguntas ("o quê, em que horário, em que etapa, depois de quê") demonstram a tese por dentro do ofício dela, sem sermão.'
  - 'Cena de abertura e fecho de editora. O detalhe que derruba a rotina é pequeno e humano ("uma paciente que chorou metade da sessão, porque a dor nas costas tinha voltado na mesma semana em que ela perdeu o emprego"); a irmã desmonta a culpa com fatos ("Renata acorda às seis há catorze anos, não falta a um paciente"); o fecho encontra uma imagem física para a descoberta ("contou nos dedos [...] quatro, a quatro pacientes diferentes, de pé, com as mãos, sem cansar").'
  - 'Honestidade acima do PWA: o número mágico é desarmado ("O número vinte e três é dela; não serve de regra para ninguém"), há um teste simples para separar energia de formato ("Seria desonesto dizer que toda desistência é culpa do formato"), a figura 5.2 agora cruza de fato em D23 com eixo proporcional, e a rede lembra que "o ajuste da peça é de método, e não de dose". Lint limpo: 0 travessão, 0 interrogação, 0 frase-soco, média de frase 17,1 com desvio 8,9.'
problemas:
  - criterio: aplicabilidade
    trecho: "Se nunca tentou, pense em outra rotina que abandonou, como academia, curso ou dieta; os itens valem para as duas."
    por_que: 'A afirmação é falsa para dois dos seis itens. "Eu refazia a mesma coisa várias vezes antes de dar por pronta" e "Eu olhava o resultado e achava que ele não tinha nada a ver comigo" não fazem sentido para academia ou dieta; quem escolhe essas rotinas marca 1 nos dois por falta de aplicação, e a soma cai de forma sistemática para a faixa baixa. O mesmo desvio segue na oficina: a grade do campo 03 tem cinco etapas de publicação e só duas linhas "Etapa: ______", mas o próprio campo 02 sugere quatro etapas para o treino ("separar a roupa, sair de casa, treinar, voltar"); o leitor não tem onde escrevê-las, e o critério "As notas de atrito são diferentes entre si" fica difícil de cumprir. Há ainda um problema de método: a autópsia de uma academia não diz nada sobre formato de publicação, que é o que o capítulo quer que o leitor descubra (o leitor do perfil da Lúcia sai da oficina sem nenhuma pista para a Fase II).'
    correcao: 'Trocar a rotina alternativa por uma rotina de PRODUÇÃO, que tem as mesmas etapas e diz algo sobre o modo de criar: autodiagnóstico, "Se nunca tentou, pense em outra tarefa de produção que abandonou ou empurrou, como escrever um artigo, preparar uma aula nova, montar um relatório periódico ou manter um curso com trabalhos a entregar; os itens valem para as duas." Faixa média: "como estruturar, gravar ou escrever a primeira versão". Campo 01: "Se nunca tentou publicar, use outra tarefa de produção que abandonou (um artigo, uma aula nova, um relatório)." Campo 02: "Se a tarefa foi outra, use as etapas dela: juntar o material, montar o roteiro, escrever, revisar, entregar." Grade: três linhas "Etapa: ______" em vez de duas.'
  - criterio: clareza
    trecho: "O que consumia toda a energia era passar a explicação falada para texto estruturado, uma etapa extra que ninguém vê e que gastava justamente o fôlego que faltou no vigésimo terceiro dia."
    por_que: 'Na p014 o narrador entrega o diagnóstico completo da Renata, e quatro páginas depois a autópsia o apresenta como descoberta ("O problema tinha endereço, e o endereço não era ela"; "O atrito morava no meio"). A cena perde a revelação, e a ideia "passar fala para texto curto" aparece cinco vezes no capítulo: p012 ("Não conseguia fazer aquilo caber em frases curtas, uma por lâmina"), p013 ("transformasse uma fala em texto curto e estruturado"), p014 (este trecho), p018 ("transformar uma explicação falada em frases escritas, curtas e em ordem") e p019 ("não passava pela lâmina em branco"). A lição cap02-r1 limita a duas, com ganho novo na terceira. Há também uma pequena contradição: aqui "Ter a ideia não custava nada", e na folha da autópsia "Ter a ideia recebeu 2".'
    correcao: 'Em "Quanto custa uma peça", deixar a etapa sem nome e guardar o diagnóstico para a autópsia: "No caso da Renata, o custo não estava onde ela procurava. Ter a ideia custava pouco, porque as ideias aparecem aos montes durante os atendimentos, e ela as anotava num bloco ao lado do computador, sem nome de ninguém. Publicar também era fácil. Em algum ponto entre uma coisa e outra havia uma etapa que ninguém vê e que gastava justamente o fôlego que faltou no vigésimo terceiro dia. Qual era, ela só saberia semanas depois." Na p013, cortar "transformasse uma fala em texto curto e estruturado" para "exigia que ela, que explica tudo em voz alta e desenhando no ar, sentasse para escrever depois de dez horas de atendimento".'
  - criterio: clareza
    trecho: "Otávio pagou a dele terceirizando, e o capítulo anterior mostrou o preço. Lúcia nem chegou a pagar: a taxa de se expor era alta o bastante para ela não começar."
    por_que: 'O parágrafo resolveu a antecipação do cap. 7, mas agora estica o conceito. A "taxa" foi definida uma frase antes como o custo de uma "combinação errada entre pessoa e formato", cobrada "por peça". Terceirizar a voz e ter receio de exposição e zelo com sigilo são outros custos, e não atrito de formato. O leitor apressado sai com a ideia de que "taxa" é qualquer dificuldade de publicar, o que dilui justamente o "Custo invisível da linguagem errada", o termo que ele precisa saber repetir.'
    correcao: 'Manter o Caio, que é atrito de formato no sentido exato, e marcar a diferença nos outros dois: "Os outros três personagens também pararam, cada um num ponto diferente. Caio não teve dificuldade para gravar; o custo dele estava na edição, onze fins de semana para seis vídeos, uma taxa de formato tão clara quanto a da Renata. Otávio e Lúcia pararam por outros motivos, a terceirização e o receio de se expor, que o livro trata no lugar deles. Nenhum deles tem menos disciplina que os outros."'
  - criterio: clareza
    trecho: "A energia disponível cai, porque a vida continua exigindo o de sempre."
    por_que: 'A causa não explica o efeito: se a vida exige o de sempre, a energia deveria ficar estável. É a linha dourada, a mais importante do gráfico central, e a frase que a explica é a mais fraca do capítulo. O próprio texto dá a causa no parágrafo seguinte ("um começo animado, em que a novidade paga a diferença"), mas o leitor lê primeiro a explicação que não fecha.'
    correcao: '"A energia que sobra para a tarefa cai, porque o cansaço de cada semana de trabalho se soma ao da anterior e o entusiasmo do começo não se renova."'
  - criterio: aplicabilidade
    trecho: "Uma enfermeira de posto de saúde: “Quem para o remédio de pressão costuma parar no mesmo momento: quando a pressão normaliza. Antes de parar, converse com quem prescreveu.”"
    por_que: 'Todos os modelos da rede são de saúde: a intro (Renata e Aurélio), a regra 2 ("quando a dor melhora") e o único exemplo concreto do "Faça assim" (a enfermeira). O público inclui advogados, contadores, arquitetos e engenheiros, para quem "o resultado da sua área que exige constância" não é óbvio. A estrutura pede exemplos em profissões variadas; o arquiteto ou o contador fecha a página sem saber como a peça fica na área dele.'
    correcao: 'Acrescentar ao "Faça assim" um exemplo fora da saúde, na mesma forma: "Uma contadora: “Quem promete separar as notas do mês costuma desistir em abril, logo depois da declaração. Uma pasta sanfonada na gaveta da entrada dura mais do que a planilha.”" Na regra 2, variar o segundo exemplo: "“Na terceira semana” ou “depois da declaração” mostra que você já viu isso muitas vezes; “com o tempo” não mostra nada."'
  - criterio: ritmo
    trecho: "Existe ainda um custo social para quem anuncia a rotina antes de começar: conta aos colegas, avisa os seguidores, promete três publicações por semana."
    por_que: 'A seção "Disciplina ou compatibilidade" virou depósito (lição cap01-r2): comparação, efeito colateral da primeira leitura, figura 5.3, teste de energia, sinais de incompatibilidade e, por fim, este parágrafo sobre anunciar a rotina, que não é nem disciplina nem compatibilidade e termina num conselho solto ("Uma boa regra é prometer pouco, em silêncio"). A frase "Renata não tinha anunciado nada" mostra que o caso dela nem se aplica. O parágrafo adia a entrada da autópsia sem dar nada ao argumento.'
    correcao: 'Cortar o parágrafo inteiro. Se a ideia for cara ao autor, guardá-la para o cap. 8 (ritmo), onde "prometer pouco" tem casa. A prosa perde cerca de 70 palavras; compensar no parágrafo da designer (ver concretude) ou na autópsia, para não cair abaixo de 1800.'
  - criterio: honestidade
    trecho: "A vergonha diminui e a produção aumenta."
    por_que: 'Na caixa de comparação, o lado "compatibilidade" promete resultado ("a produção aumenta"), e a figura 5.3 fecha em "Reconhecimento: É aqui que a autoridade chega a quem ainda não conhece você", apresentado como etapa garantida de uma sequência. A bíblia manda não prometer resultado. A figura 5.3 também está solta: nenhuma frase da prosa fala de "presença acumulada" ou de "reconhecimento", e ela entra entre dois parágrafos que tratam de outra coisa.'
    correcao: 'Caixa: "A vergonha diminui e sobra energia para tentar de outro jeito." Figura 5.3, nó 5: "Reconhecimento: Só aqui a autoridade tem chance de chegar a quem ainda não conhece você." E prender a figura ao texto com uma frase antes dela, no fim do parágrafo "A primeira leitura…": "Trocar a etapa vem antes de qualquer meta de frequência; a ordem está na figura 5.3."'
  - criterio: honestidade
    trecho: "Há fricção real, mas localizada: uma etapa específica que trava, como estruturar, gravar ou sair de casa para o treino."
    por_que: 'A faixa média afirma o que a escala não mede (lição cap01-r4). Uma soma entre 14 e 21 pode vir de atrito moderado espalhado por todos os itens; nada nas seis linhas indica que ele esteja concentrado numa etapa.'
    correcao: '"Há fricção real. Ela pode estar concentrada numa etapa, como estruturar ou gravar, ou espalhada pelo processo; a autópsia da oficina mostra qual dos dois."'
  - criterio: coerencia
    trecho: "Semanas depois, contou a história à irmã num almoço de domingo"
    por_que: 'Três pontos de coerência entre capítulos. (1) O cap. 9, já rascunhado, abre com a mesma moldura para a mesma personagem ("No domingo, no almoço de família, a irmã perguntou…"), e o cap. 7 põe o Caio "num almoço de domingo". O cap. 5 tem precedência, mas a imagem precisa ser registrada, porque ESTADO.yaml não tem a seção "imagens" que a lição cap02-r1 pede. (2) O professor de cursinho do campo 04 ("Sem a lousa e sem aluno na frente, eu não sabia por onde começar o vídeo") tem a mesma imagem do professor de cursinho do cap. 7 ("Dou aula há seis anos sem usar slide [...] explico o mesmo assunto em dois minutos de áudio"), dois capítulos adiante. Em ESTADO.yaml › figurantes, professor de cursinho e designer de interiores não estão registrados para o cap. 5. (3) "Isso descartava duas conclusões apressadas que ela quase tirou naquele almoço de domingo: a de que não tinha o que dizer e a de que não servia para aparecer": no almoço mostrado, a única conclusão é "Eu não tenho disciplina para essas coisas". O texto atribui à cena algo que ela não contém.'
    correcao: '(1) Registrar "almoço de domingo com a irmã (Renata, cap. 5)" e pedir ao cap. 9 outra moldura. (2) Registrar designer de interiores e professor de cursinho no cap. 5 e trocar o do cap. 7; ou, aqui, trocar o do campo 04 por uma professora de piano: "Sem o aluno ao lado, eu não sabia por onde começar a explicar. Regravava a abertura cinco vezes e desistia no meio." (3) "Isso descartava duas conclusões que rondavam desde o 23º dia: a de que não tinha o que dizer e a de que não servia para aparecer." (escrever "vigésimo terceiro" por extenso, como no resto).'
  - criterio: concretude
    trecho: "Uma designer de interiores que resolve tudo com amostras de tecido na mão sofre para escrever listas de dicas; o mesmo raciocínio sai inteiro quando ela o explica com o tecido na mão, diante da cliente, em dois minutos."
    por_que: '"com amostras de tecido na mão" e "com o tecido na mão" na mesma frase. E o exemplo prova o modo, mas não a taxa: mostra que ela explica bem ao vivo, sem dizer o que a lista de dicas cobra dela nem em que dia a conta deixa de fechar. É o único caso fora do elenco no corpo do capítulo, e merece o mesmo grau de ofício do Aurélio.'
    correcao: '"Uma designer de interiores que pensa com amostras de tecido na mão leva uma noite para escrever cinco dicas de cortina, porque precisa descrever em palavras a textura e o caimento que, diante da cliente, ela mostra dobrando o pano em dois minutos. Na primeira semana, a noite parece um preço justo. Na quarta, ela já está escolhendo entre a lista e o jantar."'
  - criterio: originalidade
    trecho: "Aurélio nunca mais parou. O plano passou a caber no dia dele."
    por_que: 'O caso do Aurélio é a melhor invenção do capítulo, e o desfecho absoluto ("nunca mais parou") o empurra para a parábola. O "nunca mais" também ecoa, sem intenção, o "Nunca mais abriu aquele arquivo" da abertura. Um fisioterapeuta leitor sabe que adesão não é para sempre; o próprio capítulo diz, duas páginas depois, que ela cai "quando a dor melhora".'
    correcao: '"Nos três meses seguintes, não falhou uma semana. O plano passou a caber no dia dele."'
  - criterio: metodo
    trecho: "Faça com os seus clientes o que você acabou de fazer consigo, como Renata fez com o Aurélio"
    por_que: 'A virada da rede está bem pensada e respeita a regra de ouro. A ordem da comparação, porém, está invertida: Renata fez a análise com o Aurélio ANTES de fazê-la consigo, e é isso que o capítulo inteiro sustenta. Do jeito que está, "como Renata fez com o Aurélio" parece exemplo do que o leitor acabou de fazer consigo.'
    correcao: '"Faça com os seus clientes o que Renata faz com os pacientes e o que você acabou de fazer consigo: o que eles abandonam, em que etapa, e o que muda quando o plano muda. […]"'
  - criterio: voz
    trecho: "A Débora da Lúcia, no capítulo 2, tinha feito o mesmo com um protocolo de vinte e um dias; o assunto muda, e a conclusão é sempre a mesma."
    por_que: '"A Débora da Lúcia" é possessivo de fofoca, e a frase acumula "o mesmo" e "a mesma" antes da seguinte, que traz "a mesma explicação" e "também se repete". O capítulo tem 14 ocorrências de "mesmo/mesma" na prosa, nove delas nas primeiras três páginas. É a principal marca mecânica que sobra numa prosa limpa.'
    correcao: '"Débora, a paciente da Lúcia no capítulo 2, tirou a mesma conclusão depois de um protocolo de vinte e um dias." Depois: "Renata fez o que faz quem ouviu a vida inteira uma única explicação para esse tipo de desistência: falta de disciplina, de organização, de comprometimento. A receita também não muda: um calendário mais rígido, um lembrete no celular, alguém para cobrar."'
edicoes_de_linha:
  - 'Tinha ouvido de uma colega que carrossel era o formato que "mais salvava", e montou um plano: um a cada dois dias, sete lâminas cada, escritos à noite -> Tinha ouvido de uma colega que carrossel era o formato que "mais salvava", e montou um plano: sete lâminas por carrossel, escritas à noite ("a cada dois dias" repete a frase anterior; "cada" duas vezes)'
  - 'Na consulta seguinte, ele descreveu o balcão da portaria com orgulho -> Na consulta seguinte, ele descreveu o balcão com orgulho ("balcão da portaria" na frase anterior)'
  - 'Roteiro: "A pergunta que eu faço é outra: qual é o jeito que cabe na vida que você tem de verdade? Na maioria das vezes que eu vejo, a resposta é {…}" -> "Em vez de perguntar como se esforçar mais, eu pergunto: qual é o jeito que cabe na vida que você tem de verdade? Na maioria dos casos que acompanho, a resposta é {…}" ("outra" sem termo de oposição; "eu vejo" duas vezes no roteiro)'
  - 'Ter a ideia não custava nada -> Ter a ideia custava pouco (a folha da autópsia dá nota 2)'
  - 'Verificação q2, opção d: "Diminui, porque vira hábito." -> "Diminui, porque vira hábito e se encaixa na rotina." (a correta é a mais curta das quatro, com folga)'
  - 'Autodiagnóstico, nota: "releia a seção “Disciplina ou compatibilidade”" -> "releia a p. 17" ou "releia “Disciplina ou compatibilidade”, p. 17" (no papel, a página é o endereço útil)'
diagramacao:
  - 'p016: o título da caixa direita da comparação quebra com hífen dentro do versalete espaçado ("SE O PROBLEMA É COMPATIBILI- / DADE"), com espaçamento entre letras visivelmente maior que o da caixa esquerda. Proibir hifenização e justificar à esquerda nos títulos de caixa (hyphens: none; text-align: left), ou reduzir o tracking para caber numa linha.'
  - 'p013, p015, p016 e p018: brancos de 12% a 20% no pé, sempre porque um parágrafo inteiro de 4 a 6 linhas desce para a página seguinte ("Quanto custa uma peça" desce para a p014, já apontado na r2; "O formato compatível…" desce da p015; "A primeira leitura…" desce da p016; "Na mesma semana…" desce da p018). O padrão sugere orphans/widows altos demais ou page-break-inside: avoid nos parágrafos de prosa. Com orphans: 2; widows: 2, os parágrafos dividem e os brancos somem.'
  - 'Últimas linhas de uma só palavra em fim de parágrafo: p013 "Aurélio.", p016 "novo.", p017 "formato.", p018 "ela." A da p018 fere a frase-chave da cena ("o endereço não era / ela."). Ajuste de linha ou tracking local nesses parágrafos.'
  - 'p014: a unidade da figura 5.1 ("quanto menor a barra, mais fácil sustentar") e a legenda saem coladas, no mesmo corpo e cor, e se leem como uma frase só. Separar a unidade (acima das barras, ou com espaço antes da legenda).'
  - 'p022: grade do campo 03 com só duas linhas "Etapa: ______" para quem não publica (ver aplicabilidade). Há espaço no pé da p022 (~20%) para uma terceira linha sem mudar a paginação.'
  - 'p019 (~55% de branco antes do autodiagnóstico), p021 (~25% antes da grade indivisível) e p023/p024 (antes do esqueleto) são aceitos pelo projeto. Capítulo com 16 páginas (p011 a p026), dentro do alvo. Versalete de abertura e hifenização de última linha, pendentes da r2, estão resolvidos.'
veredito: "Capítulo forte e quase pronto, que resolveu bem a r2, mas ainda fica logo abaixo de 9: a rotina alternativa para quem nunca publicou não serve à escala nem à grade, o diagnóstico da Renata é entregue antes da autópsia que deveria revelá-lo, a 'taxa' se estica até cobrir custos que não são de formato e a rede só dá modelos de saúde; tudo se corrige numa passada curta."
