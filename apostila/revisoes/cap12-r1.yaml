capitulo: 12
iteracao: 1
notas: {metodo: 7.9, voz: 8.6, originalidade: 8.3, clareza: 8.5, ritmo: 8.4, concretude: 8.8,
        coerencia: 7.6, aplicabilidade: 7.9, impresso: 8.8, honestidade: 8.8}
bloqueadores:
  - 'Contradição com o método (os quatro modos do cap. 7) no único enunciado completo fora do elenco, o modelo que o leitor vai copiar. O box "Uma apresentação e um enunciado" abre com: "Eu penso desenhando, e explico melhor com um lápis na mão do que falando." "Desenhando" não é nenhum dos quatro modos que o livro ensinou ("Uma pessoa pensa falando. Outra pensa escrevendo. Uma terceira ganha clareza respondendo. Outra, contando.", epígrafe do cap. 7). A própria oficina, duas páginas depois, restringe o campo 01 a "Falando, escrevendo, respondendo ou contando". Um leitor visual vai escrever "desenhando" e achar que o livro autorizou um quinto modo. É o mesmo tipo de erro que bloqueou o cap. 11 na r1.'
pontos_fortes:
  - 'A abertura mostra o modo de cada personagem no gesto de escrever a frase, sem precisar nomeá-lo: Otávio escreve "com o custo da posição anotado entre parênteses, como quem registra uma ressalva", e Helena diz que "parecia uma cláusula de contrato"; Caio fala e o sócio "anotou num guardanapo"; Lúcia responde a "uma por dia, sem avisar qual viria". A última frase da abertura ("descobriu que uma das cinco linhas estava vazia, e deixou vazia") planta o fio do capítulo sem anunciar nada.'
  - 'A tabela 12.1 é coerente, linha por linha, com os caps. 7 a 11 (conferido): a Lúcia da "terça às oito", a condição da Renata ("a que falha não passa para a seguinte"), o cliente "de nove anos" do Otávio, o pacote que a Renata não vende, a linha do Caio "em aberto", que respeita o cap. 10 ("Uma frase que nunca custou nada ainda não diz onde ele está"). É um modelo concreto, e a leitura na vertical e na horizontal ensina a olhar para ela.'
  - 'As cenas da régua aplicam a regra do cap. 7 (capturar no modo, publicar no formato) sem sermão. A melhor é a da Renata, em que a coluna do jornal do bairro vira uma entrevista gravada. A do Caio fecha em quatro frases o fio do estabilizador que vem do cap. 3 ("Nenhuma das duas precisava de estabilizador. Respondeu ao fornecedor que ficaria para outra vez.").'
  - 'A seção "A linha em branco" melhora a fonte. Aceitar "em aberto" em vez de uma posição inventada é honesto e coerente com o cap. 10. O parágrafo sobre o enunciado que "parece brigar consigo mesmo" dá uma regra de desempate que o PWA não tem e que se pode usar ("Uma posição dita em três minutos, no seu modo, vale mais do que a mesma posição num texto longo que nunca sai da gaveta").'
problemas:
  - criterio: metodo
    trecho: 'Eu penso desenhando, e explico melhor com um lápis na mão do que falando.'
    por_que: 'Ver bloqueador. O modelo de preenchimento introduz um modo que o método não tem. Há um agravante: a paisagista é da área vizinha à do Caio (arquitetura) no único exemplo externo do capítulo.'
    correcao: 'Mantenha a paisagista, que tem ótimos detalhes, num dos quatro modos: "Eu penso contando: explico um jardim pela história do jardim anterior, o que morreu e por quê." Ou use "Eu penso escrevendo, à mão, no verso das pranchas, antes de conversar com o cliente." Confira a coerência com o resto da frase ("E eu falo em frases curtas, comparando planta com gente").'
  - criterio: coerencia
    trecho: 'As outras quatro linhas dele, mesmo sem a quinta, já bastam para decidir quase tudo'
    por_que: 'A posição é a QUARTA parte do enunciado, e o próprio capítulo diz isso ("Pediu só uma condição, coerente com a quarta linha"). Ainda assim, o texto chama a linha vazia do Caio de "a quinta" duas vezes: aqui e em "As outras quatro já decidem boa parte das dúvidas, e a quinta aparece quando a prática a revelar". O erro passa para a verificação e para o gabarito ("As outras quatro linhas já decidem muito, e a quinta aparece quando a prática cobrar um preço"). Pouco depois vem "A tabela dos quatro enunciados tem, de propósito, uma coluna a menos. A quinta é a sua", e a tabela impressa já tem cinco colunas (Parte + quatro personagens). O leitor atento tropeça três vezes na numeração.'
    correcao: 'Troque "a quinta" por "a da posição" nas três ocorrências (prosa, 2x; explicação da verificação 03). Fecho: "A tabela tem quatro enunciados e espaço para mais um: o seu." Se possível, acrescente à tabela 12.1 uma coluna "Você" em branco, ou reproduza a grade de cinco linhas no fim da oficina. É a cena prevista no plano ("o do leitor fica em branco"), e no papel ela funciona melhor mostrada do que dita.'
  - criterio: coerencia
    trecho: 'Renata e um ortopedista que também pensa falando teriam repertórios diferentes, posições diferentes, ritmos diferentes; um fala em frases curtas e a outra desenha no ar.'
    por_que: 'Pela construção, quem "fala em frases curtas" é o ortopedista. A tabela, uma página depois, dá à Renata "Frases curtas" como primeiro traço do léxico. O Caio também tem "frases curtas", e a paisagista "fala em frases curtas". Três de cinco léxicos começam igual, e isso desmente a frase-chave da seção: "Nenhuma linha de um caberia no outro sem que alguém percebesse." Pelo cap. 11, o traço da Renata é a comparação com "coisas que dobram ou não dobram" e a palavra "alarme"; "frases curtas" é traço do Caio ("Frases curtas, com pausa depois da afirmação").'
    correcao: 'Prosa: "...ritmos diferentes; ele explica com o laudo na mão, ela com as mãos no ar." Tabela, Renata/Falo: "Comparações de coisas que dobram, mãos no ar, “alarme”". Paisagista: troque "em frases curtas" por outra estrutura ("em frases compridas, que voltam atrás para corrigir o nome da planta").'
  - criterio: voz
    trecho: 'Este capítulo fecha a fase da descoberta. As próximas partes do livro partem do enunciado de cada leitor: a fase III ensina a traduzir experiência em peça sem expor ninguém, e a fase IV encaixa a produção na rotina.'
    por_que: 'O fecho da prosa viola duas lições. Primeiro, o narrador anuncia o que vem (cap01-r1: "não listar as seções seguintes"; aqui são as fases seguintes, é o mesmo tique de curso). Segundo, o parágrafo final descreve a oficina: "a oficina deste capítulo existe para preenchê-la" (cap02-r1: "o fecho da prosa não descreve a oficina"). O mesmo narrador de sumário aparece em "e o resto do capítulo volta a ela". Assim o texto corrido termina em mapa, quando deveria terminar em consequência ou cena.'
    correcao: 'Corte o parágrafo "Este capítulo fecha a fase da descoberta..." inteiro; a pergunta de fundo já foi dita na seção do conceito. Reescreva o último parágrafo sem a oficina: "Ao lado das quatro colunas cabe uma quinta, e ela vai ficar diferente das outras. Se a sua se parecer demais com a de algum personagem, volte à linha mais parecida e procure o detalhe da sua prática que só você tem: um caso, uma cidade, a pergunta que você faz e ninguém mais faz." Corte "e o resto do capítulo volta a ela".'
  - criterio: aplicabilidade
    trecho: 'Uma decisão que o enunciado tomou por você esta semana'
    por_que: 'O leitor acabou de escrever o enunciado, 35 minutos antes. O campo 07 e o critério "O campo 07 registra uma decisão real, e não uma hipótese" cobram algo que talvez não exista quando a oficina termina (lições cap03-r3 e cap08-r1). O critério 2 ("alguém que conhece vocês dois perceberia") depende de uma terceira pessoa e também não se verifica no papel naquele momento. A entrega repete a promessa ("e uma decisão real tomada com ele").'
    correcao: 'Campo 07: "Uma decisão que está na sua frente agora (um convite, um formato, um assunto) e o que o enunciado responde sobre ela". Exemplo: "Um convite para falar numa rádio local; uma série de vídeos que você vinha adiando; um assunto que um colega sugeriu." Critério 3: "O campo 07 aponta uma decisão concreta e diz qual linha do enunciado a decide." Critério 2: "No campo 06, você nomeou a linha que caberia num colega e a reescreveu." A decisão tomada de fato fica para o checklist de aplicação, que já cobra isso.'
  - criterio: aplicabilidade
    trecho: 'Deixei o enunciado onde eu produzo'
    por_que: 'O item do checklist (2 pontos) não tem campo na oficina (lição cap01-r1), e a prosa nunca pede para fixar o enunciado. A instrução da fonte ("Fixe o enunciado onde você produz... é a régua") se perdeu, e sobrou só a mesa da paisagista. Pior: a oficina nunca pede ao leitor que escreva o enunciado como UMA frase. Ela entrega cinco fragmentos, e o capítulo inteiro fala de "uma frase com cinco partes".'
    correcao: 'Acrescente o campo 08 (4 linhas): "O enunciado passado a limpo, numa frase só, do jeito que vai para a parede". Exemplo: "Copie numa ficha e prenda onde você produz: no painel do carro, na mesa, na primeira página do caderno de campo." Ajuda do checklist 4: "... (campo 08)". Na prosa da "régua", uma frase: "Renata prendeu o dela no quebra-sol do carro, onde grava."'
  - criterio: aplicabilidade
    trecho: 'Tem três coisas que eu defendo na minha área, e tudo o que eu faço parte delas.'
    por_que: 'A peça da rede pede três posições, e a oficina produziu uma, que pode estar "em aberto" por recomendação do próprio capítulo. O leitor que seguiu o exemplo do Caio chega à rede sem material, e a rede não diz onde buscá-lo. As três opiniões existem, no cap. 10 ("O seu manifesto de três linhas", campos 01 a 03), mas nada remete a elas (lição cap02-r1: o esqueleto serve a todos os exemplos que o capítulo dá).'
    correcao: 'Intro da rede: "... Use as três opiniões do manifesto do cap. 10 (campos 01 a 03) e a posição do seu enunciado. Se a sua linha está em aberto, publique duas, e diga que a terceira você ainda está testando: isso também é posição." Ajuste o roteiro_nota: "Duas ou três posições, uma evidência para cada."'
  - criterio: clareza
    trecho: 'Este formato respeita o meu modo? Esta frequência cabe no meu pior mês? Este assunto usa o meu repertório ou é informação que qualquer um tem? Esta peça defende alguma coisa, ou é uma constatação? Este texto soa como eu falo, ou como a minha área costuma escrever?'
    por_que: 'As cinco perguntas da régua são a ferramenta que o leitor vai consultar toda semana, mas estão enterradas no meio de um parágrafo em cinco interrogações seguidas. A lição cap09-r1 manda: "listas que o leitor vai consultar (perguntas, critérios) saem numeradas". Numeradas, elas também permitiriam que as cenas remetessem à "pergunta 1" e que a rede cobrasse "passe as cinco perguntas antes de publicar" (regra 3 da fonte, que se perdeu).'
    correcao: 'Transforme as perguntas num bloco nota com itens numerados ("As cinco perguntas da régua"), um item por linha do enunciado. Na prosa, fique com "O enunciado vale pelo uso. Ele responde, em poucos segundos, a cinco perguntas que aparecem o tempo todo." Troque a regra 3 da rede, ou o item 2 do faça, por: "Antes de cada peça, as cinco perguntas da régua. Dez segundos."'
  - criterio: coerencia
    trecho: 'O vídeo que parece fácil para aquela psicóloga famosa é barato para ela porque combina com o modo, o ritmo e o léxico dela.'
    por_que: '"Aquela" pede um antecedente que não existe no capítulo nem nos anteriores. A psicóloga famosa é a imagem reservada do cap. 22 (Lúcia "estava copiando a voz de uma psicóloga famosa"; lições cap04-r1 e cap08-r1: cena reservada não se gasta antes).'
    correcao: '"O vídeo que parece fácil para um médico que você acompanha há anos é barato para ele porque combina com o modo, o ritmo e o léxico dele." Qualquer profissão genérica serve, desde que não seja psicóloga.'
  - criterio: coerencia
    trecho: 'o custo aparece na terceira semana, como apareceu para a Renata no vigésimo terceiro dia.'
    por_que: 'O dia 23 cai na quarta semana (dias 22 a 28). A conta não fecha (lição cap01-r1: contas de personagens têm de fechar).'
    correcao: '"... e o custo aparece no fim do primeiro mês, como apareceu para a Renata no vigésimo terceiro dia."'
  - criterio: originalidade
    trecho: 'Os quatro escreveram o enunciado na mesma semana, cada um na sua cidade, e cada um do seu jeito. Nenhum deles sabia que os outros existiam.'
    por_que: 'A abertura repete a arquitetura do cap. 7 ("Na mesma semana de maio, em quatro cidades, quatro pessoas ouviram... a mesma pergunta"), a cinco capítulos de distância. Depois o capítulo desfila os quatro mais duas vezes, na tabela e nas quatro cenas da régua ("Renata usou a régua... Otávio usou a régua... Lúcia usou a régua... Caio usou a régua"), e o efeito vira inventário. Duas das quatro cenas têm a mesma batida (convite num formato ruim, contraproposta no próprio modo: "Ela propôs outra coisa" / "Propôs receber as perguntas por escrito"). A amiga do grupo de estudos entra pela quarta vez como o recurso da Lúcia (caps. 7, 8, 11 e 12). E "Nenhum deles sabia que os outros existiam" chama atenção para o artifício sem ganho algum.'
    correcao: 'Abra por uma só cena em close, a do Caio com o guardanapo e a linha vazia, que é o fio do capítulo, e conte as outras três em uma frase cada ("Renata gravou no carro; Otávio riscou três versões numa folha pautada; Lúcia respondeu a uma pergunta por dia"). Corte "Nenhum deles sabia que os outros existiam". Na régua, varie a batida: o Otávio pode usar a linha do repertório para recusar um ASSUNTO (um convite para comentar reforma trabalhista em geral, informação pública), em vez de repetir a contraproposta de formato. A régua ganha a demonstração de outra linha além de modo e ritmo.'
  - criterio: clareza
    trecho: 'O grupo aceitou metade da proposta, e a outra metade ficou para depois.'
    por_que: 'O leitor não sabe qual metade foi aceita, e a cena fecha num enigma (lição cap03-r3: a cena mostra o resultado e como se chegou a ele). O gabarito resume a cena como "Otávio para recusar uma transmissão ao vivo", e o texto não diz se ele recusou ou fez a transmissão lendo.'
    correcao: '"O grupo aceitou as perguntas por escrito e publicou as respostas dele na newsletter da associação; a transmissão ao vivo ficou sem o Otávio."'
  - criterio: voz
    trecho: 'O que torna a sua linguagem sua é a combinação, e não nenhuma das partes sozinha.'
    por_que: 'A prosa passa no lint, mas os blocos repetem a antítese disfarçada que a lição cap01-r1 condena. São seis ", e não": na legenda da figura, nos guardar 1 e 2, na rede ("e não a frase em si"), no critério 3 ("e não uma hipótese") e na explicação 04 ("e não reescrito"). "E não nenhuma" ainda soa mal (dupla negação), e a frase aparece duas vezes, na legenda e no guardar 1. "A mudança de pergunta parece pequena e muda tudo o que vem depois" ecoa o "E isso muda tudo" da lista de exemplos ruins da voz.'
    correcao: 'Legenda: "Cada parte foi o assunto de um capítulo desta fase. Nenhuma, sozinha, faz a sua linguagem; a combinação faz." Guardar 1: "A sua linguagem é a combinação de modo, ritmo, repertório, posição e léxico. Uma parte sozinha não diz quase nada." Guardar 2: "O enunciado é um instrumento de decisão: ele responde por você sobre formato, assunto e convite." Rede 1: "Para fora vai o que ele decide." Explicação 04: "Nas semanas comuns, o enunciado é consultado; reescrito, só quando algo grande muda." Prosa: "A mudança de pergunta parece pequena e reorganiza o resto do livro."'
  - criterio: ritmo
    trecho: 'Renata não conseguiu escrever. Tentou duas vezes, à mesa da cozinha, e as duas folhas ficaram com uma linha e meia. Na terceira tentativa, fez o que já sabia fazer'
    por_que: 'O parágrafo tem 7 frases, acima do limite de 6 (lição cap01-r2). O da coluna do jornal ("Renata usou a régua na semana seguinte. ... A coluna saiu no modo dela...") também tem 7. "Não conseguiu escrever... fez o que já sabia fazer" retoma a batida "não fez o óbvio; fez outra coisa", dada como esgotada na lição cap04-r1.'
    correcao: 'Abertura da Renata pela ação: "Renata gravou o dela no carro, no estacionamento da clínica, depois de duas folhas que não passaram de uma linha e meia." Funda "Falou quatro minutos. Transcreveu em casa..." numa frase só. No parágrafo do jornal, corte "Era uma boa vitrine, e ela quase aceitou por reflexo" ou "O jornal topou."'
  - criterio: coerencia
    trecho: 'e ela não teve de pagar a taxa de traduzir fala em texto.'
    por_que: 'O ESTADO.yaml registra a decisão de termo: "tradução de formato" é a troca de forma (fala→texto); "tradução" sem qualificação é o conceito da Fase III. O capítulo usa o verbo solto aqui e, dois parágrafos antes do fim, "a fase III ensina a traduzir experiência em peça". O leitor encontra "traduzir" nos dois sentidos na mesma página.'
    correcao: '"... e ela não teve de pagar a tradução de formato, da fala para o texto; quem pagou foi o editor."'
  - criterio: honestidade
    trecho: 'O ritmo de Renata é o maior dos quatro porque o modo dela é o mais barato de capturar'
    por_que: 'O cap. 8 chegou às duas peças da Renata por conta de relógio (35 minutos por peça, cinco blocos de 20 minutos em julho), não porque o modo oral seja "o mais barato". A frase cria uma hierarquia entre os modos que o livro não sustenta, e o cap. 7 insiste que nenhum modo é melhor. Menor: "a fórmula da moda muda a cada seis meses" é afirmação empírica sem fonte.'
    correcao: '"O ritmo de Renata é o maior dos quatro porque o julho dela ainda deixa cinco blocos de vinte minutos, e o áudio no carro cabe neles." Troque "a fórmula da moda muda a cada seis meses" por "e a fórmula da moda não dura".'
  - criterio: clareza
    trecho: 'Uma por semana, na sexta à tarde; janeiro manda'
    por_que: '"Janeiro manda" é telegráfico demais para quem não guardou o cap. 8. Entendido só por quem lembra que janeiro é o pior mês do Otávio.'
    correcao: '"Uma por semana, na sexta à tarde; medida pelo janeiro" (e, por paralelismo, Lúcia: "medida pelo dezembro", se couber).'
edicoes_de_linha:
  - 'A frase foi feita para durar meses. Revisá-lo toda semana é uma forma de não usá-lo -> O enunciado foi feito para durar meses. Revisá-lo toda semana é uma forma de não usá-lo'
  - 'a convidou para uma coluna mensal sobre saúde da coluna -> a convidou para escrever todo mês sobre dor nas costas'
  - 'A coluna saiu no modo dela -> A página saiu no modo dela'
  - 'e o assunto estava inteiro na terceira linha dela -> e o assunto cabia na terceira linha dela: o paciente que volta em março'
  - 'Numa conversa com o sócio do escritório -> Numa conversa com o mestre de obras (personagem já estabelecido no cap. 11; o sócio do Caio é novo e não tem função)'
  - 'como se explicasse a um paciente novo quem ela era -> como se explicasse a um paciente novo como ela trabalha'
  - 'O enunciado respondeu antes: -> O enunciado respondeu antes dela:'
  - 'titulo: As cinco partes da sua linguagem criativa -> titulo: Nenhuma parte sozinha faz a sua linguagem (título que afirma, conforme o princípio das figuras)'
  - 'O que Caio fez com a linha da posição, que ainda não tinha? -> O que Caio fez com a linha da posição, que ele ainda não tinha?'
diagramacao:
  - 'p015: cerca de 12% da página em branco no pé, depois do parágrafo sobre a última coluna, porque o box "Na prática" (paisagista) não coube e foi para a p016. É branco evitável: encurtar a legenda da figura na p013 ou deixar o box quebrar entre "O comum" e "O singular".'
  - 'p020: a regra 1 da rede fica sozinha no pé da p020, e as regras 2 e 3 vão para a p021, com branco embaixo. As três regras são uma unidade de leitura; mantê-las juntas (break-inside: avoid no bloco de regras) ou levar a abertura da rede para a p021.'
  - 'p015: a tabela 12.1 tem colunas estreitas, e a célula "Uma por semana, calculada no mês de entrega de obra" ocupa cinco linhas. Diminuir a coluna "Parte" ou encurtar o texto ("Uma por semana, medida no mês de entrega").'
  - 'p013: a figura 12.1 é uma órbita com cinco rótulos e nenhuma relação entre eles; ocupa quase meia página e repete o subtítulo. Ou ganha conteúdo (em cada satélite, o capítulo de origem e a pergunta da régua), ou encolhe.'
veredito: 'Síntese bem amarrada aos caps. 7 a 11, com uma tabela de personagens que funciona e uma boa ideia na linha em branco. Não passa: o modelo da paisagista traz um quinto modo, a posição é numerada ora como quarta, ora como quinta linha, o fecho anuncia a oficina e as fases seguintes, e oficina e rede cobram o que o leitor ainda não tem.'
