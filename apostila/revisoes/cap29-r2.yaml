capitulo: 29
iteracao: 2
notas: {metodo: 9.2, voz: 9.0, originalidade: 8.8, clareza: 8.8, ritmo: 8.9, concretude: 9.3,
        coerencia: 8.5, aplicabilidade: 9.0, impresso: 9.0, honestidade: 8.9}
bloqueadores: []
pontos_fortes:
  - "A r1 foi bem resolvida no essencial: a peça mínima do Caio agora é 'Uma foto do arquivo, de uma laje de outra obra, entregue em março e com a autorização do dono assinada' em todos os lugares; o campo 01 usa um corretor de seguros; o eco com o cap. 20 ficou assumido ('sentou no mesmo tipo de degrau em que, um ano antes, escrevia as cinco linhas sem esforço'); o checklist 4/2/2/2 obriga a peça mínima; a cena de março saiu e deu lugar a remissões aos caps. 8 e 20."
  - "Detalhe de ofício exato e útil: três atrasos com três causas de obra diferentes, e a linha publicada 'laje úmida não recebe manta, nem que a obra atrase um mês', que é ao mesmo tempo peça mínima e critério de arquiteto."
  - "A distinção 'Quem mede o vale pelos números barulhentos conclui que nada está acontecendo. Quem mede pelos silenciosos vê pouca coisa, mas vê que alguma coisa está.' é própria, memorável e amarra o capítulo ao painel do cap. 28 sem repeti-lo."
  - "A rede cumpre a regra de ouro com inteligência: transpõe o vale para o processo do cliente do leitor, o exemplo da fonoaudióloga entrega um sinal verificável e um ponto de reavaliação ('Se nem isso mudou em um mês, a gente reavalia'), e o Evite proíbe 'Falar do seu próprio vale como produtor de conteúdo'."
problemas:
  - criterio: coerencia
    trecho: "o seu pode ser de doença na família, de mudança de casa, de um cliente grande que consome todas as horas, ou de um cansaço que não passa com o fim de semana. O protocolo não pergunta a causa"
    por_que: "Contradição dentro do mesmo parágrafo, introduzida pela correção da r1. O parágrafo lista 'doença na família' como caso de aplicar o protocolo e diz que ele 'não pergunta a causa'; quatro linhas depois, afirma: 'Há meses que pedem outra coisa, como um luto ou uma doença, sua ou de alguém próximo. Nesses, parar é legítimo'. O leitor não sabe se a doença do pai é mês de peça mínima ou mês de parar, e o 'não pergunta a causa' passa a ser falso."
    correcao: "Tirar a doença da lista e trocar a frase sobre a causa: 'O de Caio foi de obra atrasada; o seu pode ser de mudança de casa, de um sócio que saiu de repente, de um cliente grande que consome todas as horas, ou de um cansaço que não passa com o fim de semana. O protocolo não pede justificativa: você não precisa provar a si mesmo que o mês está difícil para ter o direito de usar as quatro linhas. […] Há meses de outra natureza, como um luto ou uma doença, sua ou de alguém próximo. Nesses, parar é legítimo […]'."
  - criterio: clareza
    trecho: "Entre o segundo e o quinto mês, mais ou menos, o esforço já é real e o retorno ainda não aparece."
    por_que: "O próprio caso do capítulo desmente a janela. Caio começou em junho, 'até novembro nenhum cliente tinha chegado citando nada' e o primeiro chegou 'em fevereiro', no nono mês; a figura 29.1 cruza as curvas entre o mês 9 e o 12. Logo depois, a frase 'Quem para no quarto mês […] Desiste pouco antes do ponto em que ela começaria a funcionar' fica falsa para o Caio: no quarto mês faltavam cinco. O leitor apressado sai com '2 a 5 meses' na cabeça e, no sexto mês sem nada, conclui que o vale dele é anormal, que é exatamente a conclusão que o capítulo quer evitar. O item 1 do Guardar repete a janela sem nenhuma ressalva."
    correcao: "Manter a janela do método para o começo do vale e dizer que o fim depende da área, com o motivo de ofício do Caio. P. 23: 'Por volta do segundo mês, o esforço já é real e o retorno ainda não aparece. Quanto isso dura depende da área: onde o cliente decide devagar, o vale se estende.' P. 40, depois de 'sem saber que era um vale': 'Reforma é decisão lenta: entre ler um texto e chamar um arquiteto, uma pessoa pode levar meses, às vezes o tempo de comprar o apartamento.' Fecho do parágrafo: 'Quem para no quarto mês desiste antes do ponto em que a coisa começaria a funcionar.' (resolve também uma antítese). Guardar 1: 'Nos primeiros meses, o esforço é real e o retorno ainda não aparece, e essa forma normal da curva parece fracasso.'"
  - criterio: coerencia
    trecho: "O conjunto tinha trabalhado no mês em que ele não pôde trabalhar muito. Foi a primeira vez que o conjunto trabalhou num mês em que ele quase não publicou."
    por_que: "Duas frases seguidas com a mesma ideia (resíduo da correção da r1, que substituiu a segunda sem cortar a primeira). E a segunda é falsa pelo próprio texto: dois parágrafos antes, 'Caio contou as peças de outubro: quatro, todas publicadas no dia'. O argumento do capítulo é justamente que ele não deixou de publicar."
    correcao: "Ficar com uma: 'O conjunto tinha trabalhado no mês em que ele só pôde publicar o mínimo.'"
  - criterio: originalidade
    trecho: "No fim de novembro, Caio arrancou do caderno a página das quatro linhas e prendeu na parede do escritório, ao lado da prancheta. Embaixo, acrescentou à mão uma quinta linha"
    por_que: "É o gesto de fecho mais gasto do livro, e o próprio Caio já o fez no mesmo lugar: cap. 12 ('Caio prendeu a folha passada a limpo na parede sobre a prancheta'). O cap. 10 tem a mesma batida completa ('A folha […] ficou presa no quadro de cortiça […]. Embaixo, na mesma letra, apareceram mais duas linhas'), e o cap. 28, imediatamente anterior, fecha com Otávio prendendo a lista 'no quadro de cortiça, ao lado da folha'. Renata prende papéis nos caps. 12, 19 e 23. Em sequência com o cap. 28, o leitor percebe a fórmula (lição cap02-r1)."
    correcao: "Fechar num gesto que ainda não existe no livro e que ecoa a abertura do próprio capítulo: 'Em dezembro, o caderno de campo acabou. Antes da primeira anotação no caderno novo, Caio copiou as quatro linhas na última página dele, onde em outubro as tinha encontrado, e acrescentou uma quinta, que não estava em julho: o mês ruim passa, e a quinta-feira seguinte continua sendo quinta-feira.' (Liga também com 'Releia-o uma vez por ano'.)"
  - criterio: ritmo
    trecho: "A peça mínima de Caio era uma foto do arquivo de obras entregues e uma frase, a que ele diria ao cliente se tivesse um minuto. O pior mês do capítulo 8 é o que se pode prever."
    por_que: "O parágrafo tem 7 frases (limite 6) e a correção da r1 aparece enxertada: vai de Caio para a regra geral e volta a Caio sem transição, e diz duas vezes a mesma coisa ('pode abrir mão da história inteira' / 'Não tinha a história inteira, nem precisava ter'). Concentra também três antíteses da seção ('nunca um formato-base menor', 'Não tinha […], nem precisava ter', além de 'A sequência não quebra […]. Quebra na segunda' no parágrafo anterior). E não responde à objeção que o cap. 20 cria: lá, as legendas de uma linha ('mais um taco recuperado') foram reprovadas porque 'não diziam nada que outro arquiteto não pudesse dizer'."
    correcao: "Reescrever em 5 frases: 'A peça mínima de Caio era uma foto do arquivo de obras entregues e uma frase, a que ele diria ao cliente se tivesse um minuto. Não era a legenda de uma linha que o capítulo 20 reprovou: a frase tinha a régua dele dentro, e a foto era de uma obra dele. O pior mês do capítulo 8 é o que se pode prever; outubro não estava em conta nenhuma. Faltou a quarta-feira da seleção, e sem ela não havia assunto. A peça mínima existe para esse mês, e só para ele, e segurou a quinta-feira até que as cinco linhas voltassem a caber.'"
  - criterio: coerencia
    trecho: "Zero é uma decisão que se repete sozinha; um é um compromisso que se mantém."
    por_que: "O cap. 24 fecha o arco do Otávio aceitando a semana vazia: 'O perfil do escritório fica em silêncio nessas semanas, e Otávio preferiu esse silêncio ao antigo barulho.' Quem leu os dois capítulos em dias seguidos vê uma regra desmentida ('Nunca para zero'). A diferença existe (lá, o silêncio impede a agência de preencher o perfil com o que não é dele; aqui, a peça mínima é do próprio autor), mas o capítulo não a diz."
    correcao: "Acrescentar uma frase à nota 'A peça mínima', ou logo depois dela: 'Ela não se confunde com o silêncio que o capítulo 24 aceita: aquele impede que alguém preencha a semana com o que não é seu; a peça mínima é sua, só menor.'"
  - criterio: aplicabilidade
    trecho: "1. Reduzo de ___ para ___. 2. Volto ao estoque em ___. 3. Uso a versão ___. 4. Não anuncio nada."
    por_que: "O campo 04 é o centro da oficina e é o único sem exemplo de profissão: o 'exemplo' é o próprio molde, com a linha 4 já preenchida pelo livro. 'Volto ao estoque em ___' é ambíguo (onde? quando?), e o critério 'tem ações, e não intenções' fica sem modelo. O campo 03 junta duas tarefas (por que essa causa e o antídoto) em 3 linhas, uma a menos do que a soma que a fonte dava (2 + 3)."
    correcao: "Campo 04, exemplo: 'Uma professora de piano: “1. Reduzo de duas peças para uma, e de uma para o áudio de noventa segundos. 2. Volto ao estoque no domingo à tarde, na página das dúvidas dos pais. 3. Gravo sem regravar. 4. Não anuncio nada.”' Campo 03: linhas: 4."
  - criterio: aplicabilidade
    trecho: "Todo processo da sua área tem um vale: o período em que o cliente já se esforçou e o resultado ainda não aparece."
    por_que: "Universal que não vale para todo o público: a oftalmologista que prescreve óculos numa consulta, a contadora que entrega uma declaração, o advogado de um parecer pontual. Esse leitor trava no esqueleto ('O momento difícil') sem instrução."
    correcao: "'Quase todo trabalho que se estende no tempo tem um vale: o período em que o cliente já se esforçou e o resultado ainda não aparece. Se o seu atendimento se resolve numa visita, procure o vale no que o cliente faz depois dela: o tratamento, a adaptação, a obra, o processo.'"
  - criterio: honestidade
    trecho: "porque ela sempre aparece disfarçada de bom senso"
    por_que: "Categóricos sem base, que a voz do livro evita: 'ela sempre aparece disfarçada de bom senso', 'a decisão mais fácil é sempre parar', somados a 'o motivo que se diz costuma ser falta de tempo' e 'A vontade de mudar tudo costuma aparecer no vale' (as generalizações sobre terceiros estão no teto de duas)."
    correcao: "'porque ela chega com cara de bom senso'; 'e a decisão mais fácil é parar'."
  - criterio: coerencia
    trecho: "uma delas de janeiro, sobre o rodapé que descola"
    por_que: "O cap. 30 usa o rodapé como imagem de fecho do Caio ('na quinta seguinte, publicou a foto de um rodapé descolado, com cinco linhas', em dezembro). Voltar a um assunto é legítimo (cap. 25), mas em capítulos seguidos parece a mesma peça com duas datas."
    correcao: "'uma delas de janeiro, sobre o taco que estufa perto da janela' (ou outro assunto de piso ou parede)."
  - criterio: concretude
    trecho: "voltasse com a nova responsabilidade técnica assinada"
    por_que: "Vago para um arquiteto, que diria o nome do documento. O plano de reforma em condomínio vai com o registro de responsabilidade técnica, que para arquiteto é o RRT (CAU); 'nova' não se explica."
    correcao: "'até que o plano de reforma, entregue em agosto, fosse reapresentado com o RRT anexado.'"
edicoes_de_linha:
  - "Releia-o uma vez por ano, num mês bom, e ajustar as linhas que envelheceram. -> Releia-o uma vez por ano, num mês bom, e ajuste as linhas que envelheceram. (erro de concordância verbal)"
  - "Mas esse período parece exatamente igual a um fracasso. Nele, a decisão de parar parece mais sensata -> Mas esse período se confunde com um fracasso, e nele a decisão de parar parece mais sensata (três 'parece' em quatro frases)"
  - "Para o Caio, o segundo ano foi mais leve que o primeiro -> Para o Caio, o segundo ano estava sendo mais leve que o primeiro (a cena é de novembro, cinco meses depois do início do segundo ano)"
  - "Alguém tinha chegado citando uma peça -> Gente tinha chegado citando peças (o próprio capítulo cita a de fevereiro e a mulher das janelas)"
  - "As duas viraram cinco linhas sem que ele precisasse pensar em assunto. -> As duas viraram cinco linhas, com fotos de obras já entregues, sem que ele precisasse pensar em assunto. (as anotações são de agosto; deixar explícito, como na peça mínima, que a foto não é de obra em curso)"
  - "Guardar, item 1 (duas frases) -> uma frase só, ver problema de clareza."
  - "Verificação 01, opção b: 'O período em que o esforço é real e o retorno ainda não aparece.' -> 'O período em que o esforço já é real, o retorno ainda não aparece e tudo parece um fracasso.' (a correta é visivelmente a mais curta; igualar ao comprimento dos distratores)"
  - "Figura 29.1: a ressalva aparece três vezes (selo 'esquema ilustrativo', unidade 'sem escala; mostra a forma da curva, e não uma medição' e legenda 'Esquema ilustrativo, sem medição.') -> cortar a unidade ou a primeira frase da legenda."
  - "O Caio de outubro publicou as quatro peças do mês em menos tempo do que aquele levava para escolher a trilha de um vídeo. -> conferir a conta (2 x 3 min + 2 x até 15 min + 20 min de seleção no domingo, perto de uma hora); mais seguro: 'em menos tempo do que aquele gastava na edição de um único vídeo'."
diagramacao:
  - "p. 15: cerca de sete linhas em branco no pé, depois do parágrafo 'As outras duas causas…'; o intertítulo 'O protocolo do mês difícil', o parágrafo de abertura e a figura 29.2 vão juntos para a p. 16. Persistente desde a r1. Deixar o parágrafo de abertura da seção acompanhar o intertítulo na p. 15 e a figura começar a p. 16."
  - "p. 22: cerca de sete linhas em branco depois da questão 02 da verificação; a questão 03 (cinco linhas) caberia ali."
  - "p. 14: duas a três linhas em branco depois da tabela 29.1; o parágrafo seguinte poderia começar na página e quebrar."
  - "p. 19, campo 03: três linhas para duas respostas (por que e antídoto) ficam apertadas à mão; com a correção para 4 linhas, conferir se o campo continua inteiro na p. 19."
veredito: "Capítulo forte, que resolveu o bloqueador de sigilo e quase tudo da r1, mas ainda não aprova: a própria correção criou duas contradições (a doença que é e não é caso de protocolo; o mês em que Caio 'quase não publicou' as quatro peças), a janela de 2 a 5 meses é desmentida pelo caso do Caio, e o fecho repete o gesto de prender a folha na parede, usado pelo próprio Caio no cap. 12 e pelo Otávio no cap. 28."
