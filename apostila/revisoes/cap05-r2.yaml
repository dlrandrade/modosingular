bloqueadores: []
pontos_fortes:
  - 'Os três bloqueadores da r1 foram resolvidos sem deixar cicatriz. A figura 5.2 agora cruza em D23, tem eixo proporcional e legenda que admite isso ("Esquema ilustrativo, com o eixo proporcional aos dias"). A ficha do paciente virou "um bloco ao lado do computador, sem nome de ninguém", e a cena do semáforo saiu. O fecho deixou de repetir a batida do áudio barato dos caps. 3 e 4, e isso guarda a descoberta do modo oral para a Fase II (cap. 8: "Desde que passou a gravar áudios no estacionamento da clínica").'
  - 'O caso do Aurélio continua sendo o eixo do capítulo, e agora a rede o aproveita: "Faça com um cliente o que você acabou de fazer consigo, como Renata fez com o Aurélio". A regra nova ("“Na terceira semana” ou “quando a dor melhora” mostra que você já viu isso muitas vezes; “com o tempo” não mostra nada") recupera o "Traga o número" do PWA sem cair na regra de ouro. O exemplo da enfermeira ("quando a pressão normaliza. Antes de parar, converse com quem prescreveu") mostra o ajuste de método exatamente como o "Evite" manda.'
  - 'A autópsia da Renata é o melhor trecho novo: as notas ficam numa frase só ("Ter a ideia recebeu 2; estruturar a sequência de lâminas, 8; escrever o texto de cada uma, 10; escolher cores e imagens, 6; publicar, 1") e a leitura da folha ensina o leitor a ler a própria folha ("A nota 6 das cores incomodava, mas sozinha não teria derrubado ninguém"; "O atrito morava no meio"). Oficina, checklist e verificação q4 apontam para a mesma descoberta, e o campo 03 virou grade com caixa para a nota.'
  - 'A honestidade intelectual está acima do PWA: "Seria desonesto dizer que toda desistência é culpa do formato", com um teste simples para separar energia de formato, e o número mágico desarmado ("O número vinte e três é dela; não serve de regra para ninguém"). Lint limpo, 0 travessão, 0 interrogação, frase média 16,7 com desvio 8,5.'
problemas:
  - criterio: aplicabilidade
    trecho: "Os sinais apontam para uma forma que não combina com você. Não tente de novo com mais força; comece pela autópsia da oficina e troque a etapa que mais custa."
    por_que: 'O autodiagnóstico contradiz a ressalva mais honesta do próprio capítulo. A prosa diz que, "Se você abandona também as coisas que combinam com você, [...] o problema provavelmente é de energia", mas a escala não tem item que faça essa separação. Teste com uma combinação extrema: quem atravessa um esgotamento geral marca 4 ou 5 em "Eu precisava me preparar mentalmente antes de cada vez", "Eu sentia alívio quando um imprevisto me impedia de fazer" e "A tarefa consumia a energia que eu queria ter para o trabalho", soma 22 ou mais e ouve que o problema é o formato e que deve trocá-lo. A lição cap01-r4 manda testar cada faixa contra combinações extremas e só afirmar o que as linhas medem. A faixa baixa tem o problema inverso: quem parou com atrito baixo recebe uma promessa ("O seu ganho nos próximos capítulos virá de sistema e captura"), já apontada na r1, sem nenhuma pista sobre o motivo da parada. A faixa média ("como estruturar ou gravar") só serve a quem publica, e a instrução diz que "os itens valem para as duas".'
    correcao: 'Acrescentar uma linha de controle sob a soma, fora da conta: "Antes de ler a faixa: nesse mesmo período, você abandonou também coisas de que gosta? Se sim, leia primeiro a p. 17; o problema pode ser de energia, e não de formato." Faixa alta: "Os sinais apontam para uma forma que não combinava com você, desde que o resto da vida não estivesse parando junto. Não tente de novo com mais força; comece pela autópsia." Faixa baixa: "A forma combinava razoavelmente com você. Se mesmo assim você parou, olhe primeiro para o ritmo e a energia daquele período (cap. 8), e só depois para o formato." Faixa média: "…uma etapa específica que trava (estruturar, gravar, sair de casa para o treino). A autópsia ajuda a isolá-la."'
  - criterio: aplicabilidade
    trecho: "Ter a ideia, estruturar, gravar ou escrever, editar, publicar. A etapa importa mais do que o dia."
    por_que: 'A r1 pediu um caminho na oficina para quem nunca publicou, e ele só chegou ao campo 01 ("Se nunca tentou publicar, use outra rotina que abandonou"). O campo 02 e a grade do campo 03 continuam só com etapas de publicação (Ter a ideia / Estruturar / Gravar ou escrever / Editar / Publicar) e uma única linha "Outra etapa". O leitor que escolheu a academia ou o curso, parte grande do público (o perfil da Lúcia), tem cinco linhas que não se aplicam e uma só para escrever as etapas dele. O critério 2 ("As notas de atrito são diferentes entre si") vira impossível de cumprir.'
    correcao: 'Campo 02, exemplo: "Ter a ideia, estruturar, gravar ou escrever, editar, publicar. Se a rotina foi outra, use as etapas dela: separar a roupa, sair de casa, treinar, voltar. A etapa importa mais do que o dia." Na grade, trocar a última linha por três em branco ("Etapa: ______") e pôr uma instrução curta sob o rótulo: "Se a sua rotina não foi de publicação, risque as etapas que não servem e escreva as suas nas linhas em branco."'
  - criterio: coerencia
    trecho: "Otávio sofreria pouco com um carrossel, mas travaria diante de uma câmera ligada sem roteiro. [...] Lúcia, que desenvolve um assunto por vinte minutos quando alguém lhe pergunta, travaria diante de um microfone mudo."
    por_que: 'A r1 pediu para cortar a frase da Lúcia, e ela ficou. O parágrafo continua sendo a matriz do cap. 7 sem os rótulos: Renata "explica tudo em voz alta e desenhando no ar", Otávio escreve, Caio conta obra, Lúcia "desenvolve um assunto [...] quando alguém lhe pergunta". O leitor atento chega ao cap. 7 com a revelação já feita. Além disso, dois dos quatro são especulação ("sofreria", "travaria") e um deles briga com o cap. 4, onde Otávio gravou sem roteiro "três minutos" que foram, pela primeira vez, "alguma coisa com o nome dele" que "soava como ele". O "carrossel natural" do Otávio também já foi dito uma página antes ("Para Otávio, que escreve pareceres longos por gosto, o carrossel talvez fosse natural"): são dois parágrafos seguidos com a mesma ideia.'
    correcao: 'Usar só o que os capítulos anteriores já mostraram, sem condicional: "Os outros três personagens pagam taxas diferentes. Caio não teve dificuldade para gravar; o custo dele estava na edição, onze fins de semana para seis vídeos. Otávio pagou a dele terceirizando, e o capítulo anterior mostrou o preço. Lúcia nem chegou a pagar: a taxa de se expor era alta o bastante para ela não começar. Nenhum deles tem menos disciplina que os outros." Cortar da p014 a frase "Para Otávio, que escreve pareceres longos por gosto, o carrossel talvez fosse natural." ("Para ela, era trabalho dobrado." segue direto a "ninguém vê").'
  - criterio: clareza
    trecho: "A explicação não custava nada. O que custava era outra coisa, e ela ainda não sabia o nome."
    por_que: 'O fecho contradiz o parágrafo anterior e termina em suspense, sem consequência. Duas frases antes, o texto já deu nome ao custo ("O atrito morava no meio, numa etapa de tradução que ela tinha acrescentado ao próprio trabalho sem perceber"), e a q4 do gabarito diz que "a etapa cara era passar a fala para texto curto". O leitor apressado se pergunta que "outra coisa" é essa. Se é o modo de pensar do cap. 7, o capítulo está anunciando o seguinte, o que a lição cap01-r1 proíbe ("fecho termina em consequência prática"). O mesmo parágrafo diz pela terceira vez que não faltavam ideias ("Em nenhum momento dos vinte e dois dias tinha faltado assunto"; antes: "as ideias aparecem aos montes durante os atendimentos" e "O assunto sobrava"), acima do limite de duas repetições da lição cap02-r1.'
    correcao: 'Cortar "Em nenhum momento [...] sem nome de ninguém." e fechar em consequência: "Na mesma semana, Renata contou nos dedos quantas vezes tinha dado aquela explicação desde segunda-feira: quatro, a quatro pacientes diferentes, de pé, com as mãos, sem cansar. A explicação estava pronta havia anos. O que precisava mudar era o caminho entre ela e a publicação, e esse caminho não passava pela lâmina em branco." Se o bloco de anotações precisar ficar (é bom detalhe), levar para "Quanto custa uma peça": "as ideias aparecem aos montes durante os atendimentos, e ela as anotava num bloco ao lado do computador, sem nome de ninguém".'
  - criterio: honestidade
    trecho: "Muita gente faz isso, e não por acaso: a leitura que circula para esse tipo de desistência é quase sempre falta de disciplina"
    por_que: 'A r1 cortou o "Quase todo especialista", mas a família voltou em outras formas. O narrador faz generalizações sem fonte sobre terceiros seis vezes: "Muita gente faz isso", "é quase sempre falta de disciplina", "Muita gente que se considera inconstante está tentando sustentar", "O que costuma se repetir é o desenho", "costumam aparecer juntos", "Muita gente anuncia a rotina antes de começar". O limite da lição cap01-r4/cap02-r2 é dois por capítulo. As que saem da boca ou da observação da Renata ("Quase sempre descobre", "A adesão aos exercícios costuma ser alta") são aceitas.'
    correcao: '"Renata fez o que faz quem ouviu a vida inteira a mesma explicação para esse tipo de desistência: falta de disciplina, de organização, de comprometimento." / "Este capítulo parte de outra hipótese: quem se considera inconstante pode estar tentando sustentar…" / "O desenho, esse, se repete: um começo animado…" (manter, é a tese do gráfico) / "Os sinais de incompatibilidade são outros, e aparecem juntos com mais frequência do que sozinhos" -> "Os sinais de incompatibilidade são outros." / "Existe ainda um custo social para quem anuncia a rotina antes de começar: conta aos colegas…".'
  - criterio: aplicabilidade
    trecho: "A pergunta que ajuda é outra: qual é o jeito que cabe na vida que você tem de verdade?"
    por_que: 'O roteiro contradiz a regra 3 da própria página ("Termine no ajuste") e a si mesmo. Depois de apresentar o ajuste como "o que costuma ajudar", a frase seguinte diz que "a pergunta que ajuda é outra", e o leitor, em voz alta, não sabe a que o "outra" se opõe. O roteiro termina numa pergunta, e não no ajuste. Há também "ajudar"/"ajuda" em frases seguidas.'
    correcao: 'Inverter e fundir: "A pergunta que eu faço é outra: qual é o jeito que cabe na vida que você tem de verdade? Na maioria das vezes que eu vejo, a resposta é {o ajuste de método que você propõe}." Ou cortar a última linha e terminar em "O que costuma ajudar é {…}."'
  - criterio: honestidade
    trecho: "Faça com um cliente o que você acabou de fazer consigo, como Renata fez com o Aurélio: o que ele abandonou, em que etapa, e o que mudou quando o plano mudou. A peça fala disso"
    por_que: '"A peça fala disso", isto é, de um cliente. Para o público de saúde e psicologia, a instrução leva a publicar a história de adesão de um paciente específico, que é justamente o que o sigilo desaconselha e o que o cap. 13 vai tratar com cuidado. O esqueleto já fala do padrão ("A etapa específica em que as pessoas desistem, na sua observação"), e o exemplo da enfermeira também, então basta alinhar a intro. A roteiro_nota lembra tratamento, mas não sigilo.'
    correcao: '"Faça com os seus clientes o que você acabou de fazer consigo, como Renata fez com o Aurélio: o que eles abandonam, em que etapa, e o que muda quando o plano muda. A peça fala desse padrão, sem caso identificável, e nunca da sua rotina de publicação. Leva uns dez minutos."'
  - criterio: coerencia
    trecho: "Descobrir qual etapa custa caro pede um pouco de investigação, e é o que a oficina propõe: uma autópsia da última tentativa, etapa por etapa, com notas de atrito. Renata fez a dela numa folha de papel, à mesa da cozinha."
    por_que: 'Dois problemas numa frase. (1) Narrador que anuncia a oficina (lição cap01-r1 e cap02-r1), e o capítulo tem outros quatro metacomentários: "Este capítulo parte de outra hipótese", "A Débora da Lúcia, no capítulo 2", "o autodiagnóstico deste capítulo ajuda a pesá-los", "assunto do capítulo 8". (2) "Renata fez a dela" põe a personagem fazendo a oficina do livro, sem mostrar como chegou a ela (lição cap03-r3: toda cena de resultado mostra o caminho). O capítulo já tem a ponte perfeita, as perguntas que ela faz a quem abandona os exercícios ("quais exercícios, em que horário, em que lugar da casa, depois de quê").'
    correcao: '"Semanas depois do almoço, numa noite sem paciente tardio, Renata fez consigo as perguntas que faz a quem abandona os exercícios: o que, em que horário, em que etapa, depois de quê. Escreveu as respostas numa folha de papel, à mesa da cozinha, e deu a cada etapa uma nota de atrito." Das remissões, manter a do cap. 8 (útil) e a do cap. 2 (eco assumido, pedido na r1); trocar "o autodiagnóstico deste capítulo ajuda a pesá-los" por "três ou quatro juntos apontam para o formato."'
  - criterio: voz
    trecho: "A diferença entre as duas leituras parece acadêmica, mas muda tudo o que você faz depois de uma desistência."
    por_que: 'Duas muletas apontadas na r1 continuam no texto: esta ("muda tudo" está nos exemplos ruins da bíblia) e "O mais curioso da história é que Renata passa os dias aplicando…". A ideia da novidade que paga o começo aparece cinco vezes em quatro páginas: "a novidade compensava o cansaço", "o entusiasmo inicial se esgota", "um começo animado, em que a novidade paga a diferença", "Quase tudo funciona enquanto é novo" e a legenda da 5.2 ("O entusiasmo do começo encobre o custo"). O limite é duas. Restam também antíteses de molde, como "Renata não precisava de mais força de vontade. Precisava descobrir…" (já apontada na r1) e "Nenhum deles tem menos disciplina que os outros. Cada um tem…".'
    correcao: '"A diferença entre as duas leituras decide o que você faz depois de uma desistência." / "Renata passa os dias aplicando, em outro assunto, o raciocínio de que precisava." / Na curva: "A energia disponível cai, porque a vida continua exigindo o de sempre." Legenda 5.2: "Esquema ilustrativo, com o eixo proporcional aos dias." Manter "Quase tudo funciona enquanto é novo", que é a melhor das cinco. / "Renata precisava descobrir qual etapa custava caro e trocar a etapa, como faz com os exercícios dos pacientes."'
  - criterio: ritmo
    trecho: "A folha mostrava mais uma coisa."
    por_que: 'Parágrafo de sete frases, acima do teto de seis. Dentro dele, "O assunto sobrava, e a publicação em si nunca tinha custado nada" repete a frase anterior ("As pontas da sequência, a ideia e a publicação, estavam baratas desde o começo").'
    correcao: 'Cortar "O assunto sobrava, e a publicação em si nunca tinha custado nada." O parágrafo fica com seis frases e sem a redundância.'
  - criterio: originalidade
    trecho: "o mesmo raciocínio sai inteiro quando ela fotografa a amostra encostada na parede e escreve duas linhas embaixo"
    por_que: 'A designer é um bom figurante, mas a solução dela é o formato mínimo viável do Caio, que a bíblia reserva para o cap. 20 ("uma foto de obra e cinco linhas"). Pela lição cap04-r1, cena reservada no plano não pode ser gasta antes. Vale também registrar como imagem da Renata o almoço de domingo com a irmã: o cap. 9, já rascunhado, abre com a mesma cena ("No domingo, no almoço de família, a irmã perguntou…"), e o cap. 7 põe o Caio "num almoço de domingo". Quem ajusta são os capítulos seguintes, mas o registro começa aqui.'
    correcao: '"…o mesmo raciocínio sai inteiro quando ela o explica com o tecido na mão, diante da cliente, em dois minutos." Registrar em ESTADO.yaml › figurantes: designer de interiores, professor de cursinho, enfermeira de posto de saúde (cap. 5). A enfermeira não está em figurantes_permitidos e o cap. 9 usa uma enfermeira obstetra; incluir "enfermeira" na lista ou trocar pela fonoaudióloga ou pela cardiologista. Anotar "almoço de domingo com a irmã (cap. 5)" para o cap. 9 trocar a moldura.'
  - criterio: clareza
    trecho: "titulo: Se o problema é encaixe"
    por_que: 'O intertítulo diz "Disciplina ou compatibilidade", a caixa logo abaixo diz "encaixe", a epígrafe diz "modelo de conteúdo" e o conceito diz "linguagem", que o texto define bem ("O formato [...] é a parte visível dela"). Depois disso, porém, voltam "as duas formas de criar", "uma forma que não combina com você" (faixa alta) e "o método escolhido" (roteiro). É pouco, mas é o ponto que um leitor apressado precisa repetir a outra pessoa.'
    correcao: 'Caixa: "Se o problema é compatibilidade". Na prosa depois do box, preferir "formato" onde se trata do visível: "E o custo dos dois formatos anda em direções opostas." Na faixa alta: "Os sinais apontam para um formato que não combina com você."'
edicoes_de_linha:
  - 'A irmã, que a conhece desde sempre, riu. -> A irmã, que a conhece desde criança, riu. ("a frase de sempre", "desde sempre" e "no mesmo dia, sempre" em três frases seguidas)'
  - 'uma etapa extra que ninguém vê e que gastava a energia que faltou no vigésimo terceiro dia -> uma etapa extra que ninguém vê e que gastava justamente o fôlego que faltou no vigésimo terceiro dia ("energia" duas vezes na frase)'
  - 'Por isso as primeiras duas semanas de qualquer rotina -> Por isso as duas primeiras semanas de qualquer rotina'
  - 'A quebra de uma rotina quase nunca acontece por causa de um grande acontecimento. -> Uma rotina raramente quebra por causa de um grande acontecimento. (evita "acontece [...] acontecimento")'
  - 'Verificação q4: "O que Renata descobriu com a autópsia da sua tentativa?" -> "O que Renata descobriu com a autópsia da própria tentativa?" ("sua" pode ser lido como do leitor)'
  - 'Duas coisas acontecem ao mesmo tempo nessa curva. -> Duas coisas acontecem ao mesmo tempo no gráfico. (a "curva" são três linhas)'
  - 'Uma boa regra é prometer pouco e em silêncio, e deixar que a regularidade apareça sozinha. -> Uma boa regra é prometer pouco, em silêncio, e deixar que a regularidade apareça sozinha. (tira o "e... e")'
  - 'Faça assim, enfermeira: "Quase todo mundo que para o remédio de pressão para no mesmo momento" -> "Quem para o remédio de pressão costuma parar no mesmo momento" (no modelo que o leitor vai imitar, uma observação, e não uma estatística)'
diagramacao:
  - 'p012: o versalete de abertura continua cortando o numeral ao meio ("DURANTE VINTE E dois dias"), como na r1. Limitar o versalete à primeira palavra ou ao grupo "DURANTE VINTE E DOIS DIAS".'
  - 'p012 e p013: última linha de parágrafo só com uma sílaba hifenizada, "cum-/prido." e "pri-/meiro.". Pendente desde a r2 do cap. 1 (hyphenate-limit-chars ou proibir hífen na penúltima linha).'
  - 'p013: ~18% de branco depois do parágrafo "Linguagem, aqui…", e o intertítulo "Quanto custa uma peça" abre a p014. Conferir se o h2 está preso à figura 5.1 em vez de só às duas primeiras linhas do parágrafo seguinte.'
  - 'p014: a unidade da figura 5.1 ("quanto menor a barra, mais fácil sustentar") segue em cinza-claro, mais apagada que a legenda embaixo. Pendente das r1/r2 do cap. 1: escurecer para o tom da legenda.'
  - 'p021: ~30% de branco no pé (a grade do campo 03, indivisível, desce para a p022; aceito). O espaço pode ir para o campo 02, que tem só 2 linhas para "Em que etapa, exatamente, travou?": subir para 3 ou 4.'
  - 'p022: os campos 04 e 05 têm 3 linhas cada e sobram ~15% no pé. A 4 linhas cada, o campo 04 cabe o porquê escrito à mão. Se a grade ganhar as linhas "Etapa: ______" para quem não publica (ver aplicabilidade), o espaço também serve para isso.'
  - 'p019 (~70% em branco antes do autodiagnóstico) e p023 (~40% antes do esqueleto indivisível) são aceitos pelo projeto. Extensão de 16 páginas (p011 a p026), dentro do alvo.'
veredito: "Revisão sólida e bem-sucedida nos pontos graves da r1 (figura, ética, semáforo, fecho repetido, rede), mas ainda abaixo de 9: o autodiagnóstico contradiz a ressalva de energia do próprio capítulo, a oficina segue sem caminho para quem nunca publicou, o parágrafo dos quatro personagens antecipa o cap. 7, o fecho termina num suspense que desmente o parágrafo anterior e as generalizações sobre 'muita gente' voltaram; tudo isso se corrige numa passada."
