bloqueadores: []
pontos_fortes:
  - 'A r1 foi bem absorvida no texto corrido. A ressalva ética agora é exata e prudente ("algumas restringem até a crítica a técnicas usadas por outros profissionais. Antes de publicar uma posição contra uma prática da sua área, confira o que o seu código diz"), o desfecho deixou de ser prêmio ("Não era uma troca: a conta das lavanderias pagava menos de um terço da das padarias, e Otávio sabia que podia não ter vindo ninguém") e a linha do tempo está datada ("Na noite do telefonema", "Dez dias mais tarde", "Três semanas depois").'
  - 'O detalhe de ofício da cena central está afinado como um trabalhista afinaria: a ação combinada com advogado pago pela empresa, a juíza que "pergunta ao trabalhador, diretamente, quem escolheu o advogado dele", o cadastro de devedores e a certidão positiva, o FGTS "até o dia 20". O silêncio ganhou um detalhe sensorial próprio ("só se ouvia o barulho do forno da loja") e a resposta do Otávio fecha a cena sem sermão: "estava do lado da padaria, e por isso mesmo não faria".'
  - 'Os exemplos novos da oficina e da tabela são opiniões discutíveis e legais, o tipo certo de modelo: a professora de piano que passa "os três primeiros meses tocando de ouvido", a veterinária que mudou de ideia sobre o primeiro cio, a corretora irritada com a garagem somada à metragem. O campo 06 traz para o papel a contra-objeção do PWA, com um critério útil: "Se não conseguir, a opinião ainda não está pensada."'
  - 'O parágrafo do custo de não ter posição é ganho real sobre a fonte e fecha em imagem, não em moral: "Otávio perdeu um cliente e ficou num grupo menor, o dos advogados que dizem não." O mesmo vale para "Otávio recusou a casadinha num telefonema, sem plateia", que resolve em uma linha a diferença entre posição e polêmica gratuita.'
problemas:
  - criterio: metodo
    trecho: 'Recusar a ação simulada, em si, era só cumprir a lei. A opinião estava na frase da folha'
    por_que: 'A correção da r1 abriu uma contradição interna no conceito central. Na p014 o texto diz que recusar a casadinha não é opinião, só cumprimento da lei. Duas páginas depois, a mesma recusa volta como a primeira opinião do Otávio ("Otávio achou as dele sem muito esforço [...] A casadinha era uma recusa."), a cena final é premiada justamente por ela ("Ele é chato. Não faz acordo de fachada. Por isso eu indico.") e o narrador a chama de posição ("A posição que ele nunca tinha publicado já circulava sozinha"). Os capítulos seguintes também a tratam como a posição dele: cap. 12, tabela 12.1, "Não faço acordo de fachada (perdi um cliente de nove anos)"; cap. 18, "O de Otávio, no capítulo 10, também: não faz acordo de fachada". O leitor sai sem saber se recusar o ilegal é ou não é opinião, que é exatamente o que a oficina pede para ele decidir. Na mesma linha, a terceira opinião do quadro (a irritação com o "sempre fiz assim") não tem custo nenhum no texto, embora a cena diga "Três opiniões, todas com o custo anotado ao lado".'
    correcao: 'Manter a recusa como posição, que é o que o livro inteiro faz, e dizer por que ela tem contorno mesmo sendo o que a lei manda: a praça faz o contrário. Trocar a frase por: "A lei proíbe a ação simulada, mas a casadinha tinha nome no corredor do fórum porque muita banca faz, e o cliente sabia onde encontrar quem fizesse. Recusá-la, naquela praça, é uma posição. A frase da folha dizia o resto: defender o dono às vezes é contrariá-lo, coisa que o escritório que ficou com a conta não pensa." (Se preferir evitar "muita banca", que é generalização, usar "porque a banca que ficou com a conta faz, e não é a única".) No parágrafo do Otávio, dar custo à irritação: "A irritação era o ''sempre fiz assim e nunca deu problema'' [...], e dizer isso ao cliente em voz alta já lhe custou mais de uma primeira reunião."'
  - criterio: coerencia
    trecho: 'Caio repete há anos a frase do taco de peroba, que vale mais raspado do que coberto, e nunca a tratou como posição; ainda não fez a conta das obras de porcelanato que ela já lhe custou.'
    por_que: 'A correção da r1 resolveu o conflito com o cap. 3 e criou outro com o cap. 12. Aqui a frase do taco já custou obras ao Caio, ou seja, é uma posição com preço. No cap. 12 ele deixa a linha "Defendo" "Ainda em aberto" porque "ainda não tinha passado por uma situação em que defender uma posição lhe custasse alguma coisa", e no cap. 14 a posição que aparece é outra (parede só com responsável técnico). Além disso, o parágrafo abre com "Os outros três personagens pagam os seus", e o Caio não paga. "Coberto" também não bate com o cap. 3, onde o taco é "arrancado" para dar lugar ao porcelanato.'
    correcao: '"Lúcia e Renata pagam os seus. [...] Caio repete há anos a frase do taco de peroba, que vale mais raspado do que arrancado, mas nunca precisou defendê-la contra ninguém: até hoje, todo cliente que a ouviu concordou. Uma frase que nunca custou nada ainda não diz onde ele está." Isso prepara o "Ainda em aberto" do cap. 12 e usa o próprio teste do custo.'
  - criterio: coerencia
    trecho: 'Tinha uma rede de lavanderias em Olinda e no Recife, onze funcionários, e estava trocando de advogado.'
    por_que: 'No cap. 4 a "dona de uma pequena rede de lavanderias de Olinda" comentou o post da agência ("Eu tinha acordo e perdi uma ação trabalhista por causa do banco de horas"), e Otávio respondeu a ela de próprio punho, na cena que abre o arco dele. Qualquer leitor atento vai supor que é a mesma mulher. Se for, o capítulo omite que ela já conhecia o Otávio pela resposta pública, e a tese da cena ("A posição que ele nunca tinha publicado já circulava sozinha, de boca em boca") perde força, porque ela chegou também por um texto. Se não for, é uma colisão de figurante.'
    correcao: 'Escolher. (a) Trocar o negócio da empresária: "Tinha três lojas de material de construção em Olinda e no Recife, onze funcionários [...]". (b) Assumir o reencontro, o que dá um ganho novo à cena: "Era a dona das lavanderias de Olinda, a do comentário sobre o banco de horas. Tinha guardado a resposta dele, mas só ligou quando o contador, que também atendia uma das padarias do Seu Ednaldo, contou o resto: ''Ele é chato. [...]''." A opção (b) exige conferir que o arco não fica resolvido antes da hora (a resposta dela no cap. 4 não pode virar prova de que publicar funciona).'
  - criterio: aplicabilidade
    trecho: 'Explicando a prática e o risco, sem contar nenhum caso.'
    por_que: 'A resposta correta da verificação 03 contradiz o próprio método do capítulo. A oficina pede "o caso típico que a sustenta", a regra 2 da rede diz "Com a razão e um caso típico, vira critério" e o esqueleto pede "O raciocínio, com o caso típico que o sustenta". Quem marcar (a) aprende que a peça de posição não leva caso nenhum. O que o sigilo proíbe é o caso das padarias, não o caso típico sem identificação.'
    correcao: 'Opção (a): "Explicando a prática e o risco, sem contar o caso das padarias." Na explicação, acrescentar: "O caso típico, sem ninguém reconhecível, continua cabendo; o das padarias, não."'
  - criterio: aplicabilidade
    trecho: 'rotulo: "O custo de cada uma, e o caso típico que a sustenta"'
    por_que: 'O campo 04 pede seis coisas (custo e caso para cada uma das três opiniões) em cinco linhas de escrita à mão. Não cabe, e a lição cap04-r1 pede espaço dimensionado para o que se pede. O critério "Cada opinião tem um custo real nomeado no campo 04" também fica difícil de conferir num bloco corrido. O terceiro critério ("Você defenderia as três num jantar com colegas da sua área") é uma hipótese, não algo que se verifica no papel quando a oficina termina (lição cap03-r3).'
    correcao: 'Transformar o campo 04 em grade de três linhas (Opinião 1, 2, 3) e duas colunas ("O que me custa", "O caso típico, sem nomes"), com altura para duas linhas manuscritas por célula; ou dividir em 04 (custo, 3 linhas, uma por opinião) e 05 (caso, 4 linhas), renumerando o resto. Terceiro critério: "Cada opinião tem, no campo 01 a 03, um porquê que não depende de ninguém concordar com você."'
  - criterio: aplicabilidade
    trecho: 'Para descobrir se vale a pena mudar de lado.'
    por_que: 'Distrator da verificação 04 que não é inequivocamente falso (lição cap01-r1). Escrever o melhor argumento contra é, entre outras coisas, testar se a posição resiste, e o próprio capítulo diz "Se não conseguir, a opinião ainda não está pensada". Um leitor honesto pode marcar (a) com razão. Na verificação 02, "Porque as plataformas costumam reduzir o alcance dela" é uma afirmação empírica sobre terceiros que o livro não pode dar como falsa, e traz a rede para dentro do fechamento.'
    correcao: 'Q4 (a): "Para ter mais o que escrever na peça." Q2 (a): "Porque ela só funciona em profissões sem código de ética."'
  - criterio: voz
    trecho: 'Se ninguém pode discordar do que você diz, você disse uma constatação, e constatações não ficam na memória de ninguém.'
    por_que: 'A mesma ideia, quase com as mesmas palavras, aparece cinco vezes: epígrafe ("Se ninguém pode discordar do que você diz, ninguém tem motivo para lembrar"), intertítulo ("O que ninguém discute ninguém lembra"), Conceito ("O que todo mundo aceita, ninguém guarda"), comparação ("Ninguém discorda. Ninguém lembra.") e Para guardar 1. A lição cap02-r1 limita a duas; a partir da terceira, o eco vira fórmula de curso, e o duplo "ninguém" em quatro delas cansa o ouvido. Na prosa ainda há sete "ninguém" e sete "nenhum/nenhuma".'
    correcao: 'Manter a epígrafe e o Conceito. Intertítulo: "A frase que protege um lado só" (vem do próprio parágrafo). Comparação, último item da esquerda: "Corretas, e esquecidas na mesma hora." Para guardar 1: "Frase com que todos concordam é constatação: está certa, e não diz onde você está."'
  - criterio: metodo
    trecho: '{rotulo: "A posição", texto: "Dita na primeira linha, sem preâmbulo.", linhas: 2}'
    por_que: 'A oficina já escreveu todas as partes da peça: posição (campos 01 a 03), custo e caso (04) e outro lado (06). O esqueleto da rede pede tudo de novo sob o título "RASCUNHE AQUI", o que a lição cap02-r2 manda evitar: nesse caso ele deve ser um "passe a limpo".'
    correcao: 'Acrescentar esqueleto_rotulo: "Passe a limpo, em frases de quem lê, uma das três opiniões com o que anotou nos campos 04 e 06", e reduzir as partes para 2 linhas cada. Isso também encurta o bloco e pode reduzir o branco da p022.'
  - criterio: coerencia
    trecho: 'Um mecânico de motos: “Não troco só a corrente quando a coroa e o pinhão estão gastos, mesmo que o cliente peça. Perco o serviço para a oficina do lado.”'
    por_que: 'O cap. 9, vizinho, usa "Um mecânico" (e "O mesmo mecânico") nos exemplos do Faça assim, e o cap. 3 também tem um mecânico na tabela de sinais. Três mecânicos em oito capítulos, dois deles seguidos, contrariam a lição cap02-r2. A corretora de imóveis da tabela 10.1 também aparece em cena no cap. 11 (a corretora do apartamento de 1968). O ESTADO.yaml não registra o mecânico do cap. 9, o que explica o tropeço.'
    correcao: 'Trocar o mecânico por uma profissão livre da lista, por exemplo um corretor de seguros: "Não vendo seguro de vida com o valor que o cliente pede quando a conta da família não fecha com ele. Perco a venda para quem vende o que pediram." Se a corretora do cap. 11 ficar, trocar a da tabela por um engenheiro estrutural ou uma farmacêutica. Registrar o mecânico do cap. 9 em ESTADO.yaml › figurantes.'
  - criterio: clareza
    trecho: 'Eu peço a triagem em março.'
    por_que: 'A fonoaudióloga não manda na escola; "eu peço" a quem? Sem isso, a posição parece uma conduta dela que não depende dela, e o leitor não sabe o que ela faz no lugar. No mesmo tom, "Explico por quê e indico outra conversa" (dermatologista, tabela 10.1) é vago: que conversa?'
    correcao: 'Fonoaudióloga: "Nas escolas que me encaminham crianças, peço a triagem em março." Dermatologista: "Explico por quê e proponho outra conversa, sobre o rosto dela."'
edicoes_de_linha:
  - 'o juiz podia perceber e, quando percebe, o acordo cai -> o juiz pode perceber e, quando percebe, o acordo cai'
  - 'com o nome no cadastro de devedores trabalhistas e a certidão, que o banco pede para renovar o capital de giro, positiva -> com o nome no cadastro de devedores trabalhistas e a certidão trabalhista positiva, justo a que o banco pede para renovar o capital de giro'
  - 'coisa que o escritório para onde a conta foi não pensa -> coisa que o escritório que ficou com a conta não pensa'
  - 'que vale mais raspado do que coberto -> que vale mais raspado do que arrancado'
  - 'A folha com a frase da noite da casadinha -> A folha da noite do telefonema'
  - 'O canto de baixo, à direita, merece cuidado. Divergir só para chamar atenção -> No canto de baixo, à direita, está a divergência sem compromisso. Divergir só para chamar atenção'
  - 'provavelmente é uma constatação -> é quase certo que se trata de uma constatação (evita o segundo "provavelmente" do capítulo, que volta em "provavelmente há ali uma posição")'
diagramacao:
  - 'p014: cerca de um terço da página em branco depois de "que ela já lhe custou.", porque a Figura 10.1 inteira foi para a p015. Já apontado na r1 (então na p013/p014) e não resolvido. Permitir que o parágrafo "O canto de baixo..." venha antes da figura, ou reduzir a altura do quadrante em 10 a 15%.'
  - 'p015 e p016: cerca de um oitavo em branco no pé da p015 (a Tabela 10.1 desceu para a p016) e cerca de um quarto no pé da p016 (a comparação desceu para a p017). Mesmo problema da r1. Deixar a tabela quebrar entre linhas, com o cabeçalho repetido, ou colocar o parágrafo do calor antes dela.'
  - 'p018 e p019: a p018 termina com cerca de um terço em branco e a p019 tem só o Para guardar (cerca de 70% em branco). Não resolvido desde a r1. O guardar, com seis linhas, cabe no pé da p018; a oficina começaria na p019 e o capítulo perderia uma página.'
  - 'p022: cerca de 55% em branco depois das três regras, porque o esqueleto foi inteiro para a p023. Aceito pelo projeto (esqueleto indivisível), mas com o esqueleto em "passe a limpo" de 2 linhas por parte o bloco provavelmente cabe na p022.'
  - 'p015, Figura 10.1: o rótulo do eixo Y continua dividido, um vertical na base ("Abandona quando custa") e outro horizontal no topo ("Sustenta mesmo pagando"), e os pontos de "Polêmica gratuita" e "A sua posição" ficam à direita do rótulo, os outros à esquerda. Apontado na r1; uniformizar.'
  - 'p024, roteiro: a lacuna "a sua posição, dita direto" continua numa linha própria com um recuo antes do sublinhado, diferente das outras lacunas. Apontado na r1.'
veredito: 'Os problemas de texto da r1 foram quase todos resolvidos, mas as correções abriram contradições (a recusa da casadinha é e não é opinião; o Caio já pagou um custo que o cap. 12 nega; a lavanderia do cap. 4 reaparece sem explicação), a verificação 03 desmente o método, e os brancos da r1 continuam; ainda falta uma passada.'
