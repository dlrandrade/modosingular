capitulo: 20
iteracao: 4
notas: {metodo: 8.8, voz: 9.2, originalidade: 9.1, clareza: 8.9, ritmo: 9.1, concretude: 9.4,
        coerencia: 8.5, aplicabilidade: 9.1, impresso: 8.6, honestidade: 9.2}
bloqueadores:
  - "Contradição com o método (sigilo pelo calendário) num exemplo que o leitor vai copiar. O 'Faça assim' da rede propõe: 'Uma cardiologista: “A pergunta desta semana no consultório foi…”, toda semana'. A abertura fixa obriga a publicar, na mesma semana, uma pergunta que nasceu de um atendimento. Isso contraria a regra do cap. 13 ('Desloque também a data da publicação: nunca antes de um mês depois do último atendimento em que o assunto apareceu'), a quarta pergunta da seleção do cap. 19 e a lição cap13-r1 ('peça que parte de um atendimento nunca sai na semana dele'). Contraria também o próprio capítulo, que exige na oficina 'uma captura selecionada e já liberada' e mostra o Caio esperando ('liberar em dezembro'). É profissão regulamentada. A correção é de uma linha (ver problemas)."
pontos_fortes:
  - "Quase tudo o que a r3 apontou foi resolvido. O gabarito da questão 01 bate com a prosa ('tanto quanto levou a peça'), a regressão às legendas de uma linha agora tem motivo ('com a obra do Taquaral em entrega') e remete à 'legenda de três frases da parede que mentia'. A obra do dia saiu do Botafogo ('um prédio de 1968 na Vila Industrial'), a conta da leitora fiel fecha ('quem aparecia de vez em quando tinha visto duas ou três') e a grade dos testes perdeu a terceira coluna, com a data na própria linha ('conferir na 4ª peça, em ___/___')."
  - "A linha do tempo fecha no calendário. Com a 17ª quinta caindo na segunda de outubro, a primeira cai na terceira semana de junho, e a trigésima, na segunda de janeiro, como diz o texto ('Deu a segunda semana de janeiro'). O exemplo da massoterapeuta ('terça, 14 de outubro; a quarta, sexta, 24 de outubro') é exato. Os números da Lúcia (72 e 84) e da Renata (35, duas por semana) conferem com o cap. 8."
  - "A peça-modelo é lícita, tecnicamente segura e dissecada logo depois na página ('A primeira dizia qual obra... a quarta, o que custaria o outro caminho'). A quinta linha é uma régua que o cliente aplica sozinho ('Antes de tirar uma peça velha, pergunte o que ela deixa passar'). O detalhe de ofício sustenta a cena sem ostentação: 'bandeira de vidro canelado', 'fundo anticorrosivo', 'fusíveis de rosca'."
  - "O capítulo ensina que mínimo não quer dizer rápido e prova isso com números dos próprios personagens: a Lúcia passa no pior mês com 'setenta e dois minutos', e as legendas de 'dois minutos' reprovam. O fecho termina em consequência prática, sem moral ('O resto da noite voltou a ser dele'), e a venda das luzes fecha o arco do cap. 3 sem discurso."
problemas:
  - criterio: metodo
    trecho: "Uma cardiologista: “A pergunta desta semana no consultório foi…”, toda semana, com a mesma foto do estetoscópio sobre a mesa."
    por_que: "É o bloqueador. A frase fixa anuncia que o assunto saiu de um atendimento daquela semana, o que o livro proíbe desde o cap. 13 para qualquer peça que parta de atendimento, e mais ainda em profissão com código de publicidade. Como é o exemplo da regra 'Abra sempre do mesmo jeito', o leitor vai copiar a fórmula inteira. (A r3 propôs esta redação para resolver outro problema, o da abertura que se desmentia, e criou este.)"
    correcao: "“Uma cardiologista: “Uma pergunta que ouço no consultório:”, toda semana, com a mesma foto do estetoscópio sobre a mesa.” Com isso a abertura continua fixa e verdadeira a cada semana, e não data o atendimento."
  - criterio: coerencia
    trecho: "e encontrou quatro vezes a mesma frase de abertura, “teve uma obra”, a primeira regra da ficha, que ele nunca tinha repetido de propósito."
    por_que: "Contradiz dois capítulos. No cap. 7, 'Caio passou a começar qualquer peça por \"teve uma obra\", mesmo quando o assunto era técnico'. No cap. 11, a ficha diz 'Quando explica, começa por uma obra: “Teve uma obra…”', e ele passa 'a relê-la antes de escrever qualquer legenda'. Quem relê a regra antes de cada legenda repete a frase de propósito. O próprio capítulo já tinha dito, no terceiro parágrafo, que as cinco linhas vinham 'desde a terceira sempre começando por \"teve uma obra\"'. A descoberta da sexta semana tem de ser outra."
    correcao: "Trocar a descoberta pelo que só a releitura em sequência mostra: '...não sentiu vontade de mudar nenhuma delas. Lidas juntas, as quatro abriam com a mesma frase e fechavam com uma régua, e a moldura igual fazia cada obra parecer mais diferente das outras, e não menos.' Isso também prepara a ideia de 'Fixar o formato não deixa as peças iguais'."
  - criterio: clareza
    trecho: "Se um teste que parecia aprovado falha na prática, porque o formato não comporta o repertório que você quer mostrar, ele também precisa mudar. A diferença está na causa: um teste que falhou é informação."
    por_que: "'A diferença' não tem com o que se comparar. O parágrafo lista os dois motivos legítimos e não menciona o ilegítimo, a vontade da décima semana, que ficou no parágrafo anterior. O leitor apressado não entende de que diferença se fala, e a frase que deveria fechar o argumento fica pela metade."
    correcao: "'...ele também precisa mudar. O que separa esses dois motivos da vontade da décima semana é a causa: um teste que falhou é informação sobre o formato, e o cansaço de quem faz não é.'"
  - criterio: clareza
    trecho: "O teste que reprovou primeiro, no caso do Caio, foi o terceiro, e ele o viu reprovar a primeira versão da foto."
    por_que: "O parágrafo anterior acabou de mostrar o vídeo reprovando no pior mês e o texto reprovando no modo, ambos 'de abril e maio', ou seja, antes da foto. 'Reprovou primeiro' contradiz essa ordem. O que se quer dizer vale só para a foto."
    correcao: "'Na foto, o primeiro teste a reprovar foi o terceiro. Nas duas primeiras semanas, com a obra do Taquaral em entrega, ele voltou...'"
  - criterio: clareza
    trecho: "{rotulo: \"Texto de três parágrafos: 50\", valor: 50, nota: \"Passa no repertório. Cai no modo: sem a obra na frente, ele rodeia o assunto.\"}"
    por_que: "Na p015, a barra mais longa da figura (50 minutos, contra os 'uns trinta minutos por semana' do pior mês) tem uma nota que só registra a reprovação no modo. O leitor que acabou de ver o vídeo de 40 cair no pior mês pergunta por que o de 50 não cai. A prosa ('O texto de três parágrafos passava no repertório e não passava no modo') tem a mesma lacuna."
    correcao: "Nota da barra: 'Passa no repertório. Cai no modo, e por isso também no pior mês: sem a obra na frente, ele rodeia o assunto.' Na prosa: '...não passava no modo: escrever sem uma obra na frente o fazia rodear o assunto, e o rodeio custava cinquenta minutos.'"
  - criterio: coerencia
    trecho: "Os números do vídeo e do texto são de abril e maio, anotados no caderno; os da foto, de junho a setembro."
    por_que: "Pelo calendário do próprio capítulo (17ª semana na segunda quinta de outubro), a primeira foto saiu na terceira semana de junho, e as cinco linhas, 'na terceira', já em julho. Em junho só existiam as legendas de dois minutos. A barra 'Foto da obra e cinco linhas: 12 a 15' não pode ter números de junho."
    correcao: "'...os das cinco linhas, de julho a setembro.'"
  - criterio: coerencia
    trecho: "explicacao: A vontade de mudar pode aparecer bem antes de o formato ter sido testado."
    por_que: "No caso que o capítulo conta, o formato já tinha sido testado quando a vontade apareceu: os quatro testes, inclusive o da repetição, conferido 'Na sexta semana', antes da 'décima semana'. A regra das trinta se justifica pelo outro lado, o de quem lê ('o cansaço é de quem faz, não de quem lê'). O gabarito dá ao leitor a razão errada."
    correcao: "'A vontade de mudar aparece bem antes de quem lê ter visto a série. Para o público, ela ainda está começando, e a repetição é o que começa a produzir reconhecimento.'"
  - criterio: coerencia
    trecho: "A segunda é o formato, e essa volta todas as semanas, inteira, como se fosse a primeira vez."
    por_que: "O cap. 14 prometeu ao leitor que, com o inventário, a hora reservada começa com 'uma única decisão: em que nível respondê-la. É uma decisão de dois minutos.' O cap. 20 mostra o mesmo Caio, que já tinha o inventário e publicava às quintas, gastando 'quarenta minutos' decidindo o formato. As duas coisas podem conviver, mas o leitor atento vê a contradição, e nada no texto a desfaz."
    correcao: "Uma oração basta no parágrafo da medição: 'O inventário de perguntas lhe dava o assunto em dois minutos; o formato, não.' Ou, no fim de 'Decidir cansa mais do que fazer': 'Nem o inventário resolve essa segunda decisão.'"
  - criterio: concretude
    trecho: "O vídeo do granilite tinha custado quatro minutos, numa tomada só; os seguintes ele passou a regravar até sair certo, e o custo subiu para quarenta."
    por_que: "O capítulo diz que o vídeo de uma tomada funciona 'para quem aceita a primeira tomada, com o erro no meio, como Caio aceitou no vídeo do granilite'. Se ele já tinha provado que conseguia, o leitor fica sem saber por que não voltou a esse formato, e a coluna 'Nenhum dos quatro' da tabela fica sem explicação. Falta o motivo de ofício, que o próprio livro já deu no cap. 3: gravar na obra exige quadro limpo, licença do dono e a furadeira parada."
    correcao: "Acrescentar uma oração com o motivo real: '...e o custo subiu para quarenta. Na obra, a tomada única dependia de um corredor vazio, da licença do dono e de a furadeira parar, e nas semanas de entrega nada disso acontecia.'"
  - criterio: voz
    trecho: "a foto torta e o “teve uma obra” já anunciavam quem estava falando antes da segunda linha. Guardou-a sem ligar."
    por_que: "O pronome 'a' está a cinco frases da câmera, e os femininos mais próximos são 'a série', 'a repetição', 'a foto torta' e 'a segunda linha'. Na leitura em voz alta, o fecho, que deveria ser o gesto seco da cena, tropeça."
    correcao: "'Guardou a câmera sem ligar.'"
  - criterio: honestidade
    trecho: "Fixá-la poupa essa decisão e, com o tempo, faz quem lê reconhecer você antes da segunda linha."
    por_que: "O efeito sobre o público é afirmado como certo numa regra dirigida ao leitor. Na cena, a mesma ideia é inferência do Caio, e ali está no lugar certo. Na regra, soa como promessa de resultado."
    correcao: "'Fixá-la poupa essa decisão e, com o tempo, dá a quem lê um sinal de que é você antes da segunda linha.' Ou: '...e deixa a atenção de quem lê livre para o que muda.'"
edicoes_de_linha:
  - "roteiro_nota: 'como nas cinco linhas do Caio: onde, o que achou, o que decidiu' -> 'como nas cinco linhas do Caio: qual obra, o que achou, o que decidiu' (alinha com a prosa corrigida na r3: 'A primeira dizia qual obra')"
  - "'A foto com cinco linhas passou nos quatro, e passou pelo motivo que ele menos esperava.' -> 'A foto com cinco linhas passou nos quatro, por um motivo que ele não tinha previsto.' (o 'menos esperava' promete uma surpresa que a frase seguinte não entrega; a versão mais seca combina com o narrador)"
  - "'O problema aparecia na quarta-feira à noite, [...] e a decisão levava tanto tempo quanto a peça, e vinha primeiro, quando a cabeça já estava gasta.' / 'A decisão pesava tanto quanto a peça, e vinha no fim do dia, com a cabeça gasta pela obra.' -> manter só uma das duas 'cabeças gastas'. Sugestão: no parágrafo da medição, fechar em 'A decisão pesava tanto quanto a peça.' e deixar a cabeça gasta só na abertura."
  - "'Um formato-base precisa caber no número que você calculou, com folga, e a Lúcia mostra que isso pode ser setenta minutos.' -> '...e a Lúcia mostra que isso pode passar de uma hora.' (72 não é 70; o arredondamento parece descuido logo depois de o texto dar o número exato)"
  - "Guardar, item 3: 'desconfie: é cansaço de quem faz.' -> 'desconfie: o cansaço é de quem faz, não de quem lê.' (o item isolado perde metade do argumento; a nota da regra das trinta já tem a forma completa)"
diagramacao:
  - "p018: Figura 20.2, nota da base ainda quebra com 'para.' sozinho na segunda linha ('O caderno de campo do capítulo 19. Nunca / para.'). É a quarta revisão seguida que aponta isso. Trocar no manuscrito por 'Caderno de campo, cap. 19. Nunca para.', que resolve sem mexer no CSS."
  - "p013: ainda há cerca de 25% da página em branco depois de 'o que é novo.', porque o box Conceito não coube e foi inteiro para a p014. Branco evitável, apontado na r3. Saídas: pôr o parágrafo do mecânico antes do box (ele é curto e cabe no pé da p013) ou cortar uma frase do parágrafo das cinco linhas."
  - "p021-p022: a p021 fecha com cerca de 35% livres depois do 'Confira antes de seguir', porque a rede não abre em página nova por regra: o bloco das regras é indivisível (.regras com break-inside: avoid) e não coube. A p022 também fecha com cerca de 35% livres antes do esqueleto indivisível, o que é aceito. Permitir a quebra entre as regras 2 e 3 (tirar o avoid do .regras e manter só o dos itens) deixaria a rede começar na p021."
  - "p015: o subtítulo da Figura 20.1 ('minutos por peça, medidos com relógio') continua em sans negrito, mais pesado que o título em itálico, como já apontado na r1 e na r2. A figura também não marca a linha dos 30 minutos do pior mês do Caio, que é o que faz as barras de 40 e 50 reprovarem."
  - "p024-p025: a verificação deixa uns 25% livres na p024, e o checklist ocupa só o terço superior da p025. Isso é aceitável, mas já foi apontado três vezes."
veredito: "O capítulo está a uma passada da aprovação: prosa segura, cena bem armada e oficina amarrada. Mas o exemplo da cardiologista ('A pergunta desta semana no consultório foi…') contradiz a regra de sigilo pelo calendário que o livro ensina desde o cap. 13 e é bloqueador. Restam ainda a descoberta de 'teve uma obra' que desmente os caps. 7 e 11, três pontos de clareza de uma linha cada e o 'para.' órfão da Figura 20.2, na quarta revisão."
