capitulo: 3
iteracao: 3
notas: {metodo: 9.2, voz: 9.1, originalidade: 9.3, clareza: 8.9, ritmo: 9.2, concretude: 9.0,
        coerencia: 8.6, aplicabilidade: 8.8, impresso: 8.6, honestidade: 9.3}
bloqueadores: []
pontos_fortes:
  - 'O bloqueador da r2 foi resolvido na ação, sem sermão: "Caio pediu ao proprietário licença para gravar no corredor, que ainda estava vazio. Antes de começar, tirou da parede a planta com o nome do dono"; a regra 1 da rede ganhou "Se o lugar é do cliente, peça autorização antes e mostre o mínimo da casa."; e o campo 06 passou para o espaço da própria pessoa ("Vou gravar no meu ateliê, com o celular encostado numa prateleira"). A regra das tomadas continua idêntica na regra 2, no roteiro_nota e na cena ("Errou uma palavra no meio e não regravou.").'
  - 'A divisão de trabalho entre oficina e rede agora funciona: o campo 05 junta a matéria ("O que sustenta a ideia: o caso, o número ou o sinal da sua prática que só você teria"), o esqueleto a organiza, e o terceiro tempo ("O que muda a decisão", "A exceção, o risco ou o motivo da recusa") serve a quase todos os sinais. O roteiro é 100% sobre a área do leitor ("Na prática, o que eu vejo é isto:"), e a rede abre com a regra de ouro ("O assunto continua sendo o problema que você resolve.") e dá caminho a quem pensa escrevendo.'
  - 'Prosa de autor, com humor seco e frases que ficam: "Não houve decisão de parar; houve um sábado em que ele preferiu dormir, e depois outro."; "Comprar equipamento é uma das formas mais respeitáveis de adiar."; "Ela funciona como um bom par de óculos: deixa ver melhor o que já está ali, sem acrescentar nada à paisagem."; "a presença que depende de esforço extraordinário termina no primeiro mês comum." Lint limpo: zero frase-soco, zero "não é X, é Y", zero travessão.'
  - 'Detalhe de ofício exato e honestidade de leitor exigente: a exceção da professora de pilates descreve a diástase sem nomeá-la ("em quem teve bebê há pouco e vê a barriga formar um volume no meio ao subir"), a fonoaudióloga dá um critério verificável ("Rouquidão que piora ao longo da semana e melhora no domingo"), a dermatologista acerta o UVA através do vidro, e o texto não se dá razão fácil ("Parte da diferença de resultado veio do caminho, porque o áudio chegou pelas mãos de uma cliente."; "É cedo para tirar conclusões de um único vídeo, e Caio não tirou.").'
problemas:
  - criterio: coerencia
    trecho: "O proprietário, que tinha dado licença sem muita atenção, assistiu naquela noite e mandou uma mensagem de uma linha: não sabia que o piso dele valia alguma coisa. Na reunião seguinte, pediu para manter o granilite"
    por_que: 'Furo de enredo que enfraquece o protagonista e o método. Caio é o arquiteto daquela obra; se o proprietário "não sabia que o piso dele valia alguma coisa" e só "na reunião seguinte" pede para manter o granilite, o arquiteto deixou a decisão do cliente seguir para "cobrir" sem dizer nada, e o cliente descobre o valor do próprio chão por um vídeo público. É o oposto do Caio da cena do taco, que aconselha uma cliente em quarenta segundos, e reintroduz pela porta dos fundos o que a r2 apontou: o assunto da peça volta a ser uma decisão pendente do cliente. Além disso, "licença sem muita atenção" modela uma autorização distraída logo depois de a regra 1 ensinar a pedir autorização de verdade; para as profissões regulamentadas do público, é o exemplo errado.'
    correcao: 'Na cena, tornar a autorização informada e a decisão anterior ao vídeo: "Caio pediu ao proprietário licença para gravar no corredor, que ainda estava vazio, e contou o que ia dizer." (o proprietário já sabe, desde a primeira visita, por que o granilite fica). No resultado, trocar as duas frases por: "O proprietário assistiu naquela noite e mandou uma mensagem de uma linha: agora sabia explicar às visitas por que o chão tinha ficado." Mantém o ganho novo da cena sem repetir a batida do áudio encaminhado.'
  - criterio: aplicabilidade
    trecho: "Citar o número de anos de formado logo na abertura."
    por_que: 'A questão 3 pergunta "Qual destes é um sinal de autoridade que NÃO depende de produção?", e esta opção também responde à pergunta tal como está escrita: dizer há quantos anos se formou é um sinal de autoridade (fraco, mas é) e não depende de câmera, luz ou edição. O leitor que marca (c) tem argumento para contestar o gabarito, e a explicação da (d) não o refuta. Distrator precisa ser inequivocamente falso (lição cap01-r1).'
    correcao: 'Trocar a opção (c) por outro elemento de produção plausível: "Uma vinheta com o logotipo no começo de cada vídeo." Ou, se quiser manter a credencial como armadilha, mudar o enunciado: "Qual destes é um dos sinais de autoridade descritos no capítulo, que não dependem de produção?"'
  - criterio: coerencia
    trecho: "O áudio do taco tinha as duas camadas de baixo, e nenhuma das de cima."
    por_que: 'A figura 3.1, na página seguinte, define a camada Formato como "Vídeo, texto, áudio, carrossel. Decide como a ideia viaja.": o áudio do taco tem formato, e foi justamente o formato que o fez viajar até a irmã. A frase contradiz a figura que ela prepara. Na mesma passagem, "e por isso faltava também a do meio" é ambígua num esquema de quatro camadas (há duas do meio), e a prosa nunca diz os nomes "pensamento" e "clareza", que a questão 1 cobra.'
    correcao: '"Faltava a camada de baixo, o pensamento: uma opinião sobre aquela reforma. Por isso faltava também a clareza, logo acima: não havia nenhuma frase que alguém pudesse repetir a outra pessoa. O áudio do taco tinha as duas, um formato que ninguém escolheu e acabamento nenhum."'
  - criterio: aplicabilidade
    trecho: "A ideia do campo 04, lida em voz alta sem pressa, cabe em até um minuto."
    por_que: 'Critério que não mede nada: o campo 04 pede "a ideia da peça em uma frase", e qualquer frase cabe em um minuto. A caixa é marcada por todos, inclusive por quem escreveu uma frase vaga. O que merece conferência no papel é se a frase passa no teste do mudo e se o conjunto 04 + 05 cabe numa peça curta.'
    correcao: '"A frase do campo 04, lida sozinha, sem imagem e sem explicação, ainda interessa a alguém que não conhece você." (é o teste do mudo aplicado à própria peça). Se quiser manter o tempo: "Os campos 04 e 05, lidos em voz alta sem pressa, cabem em até um minuto."'
  - criterio: metodo
    trecho: "A exceção, o risco ou o motivo da recusa. É aqui que aparece o seu critério."
    por_que: 'A tabela oferece cinco sinais e o campo 04 manda escolher ("Qual desses sinais você vai usar"), mas o terceiro tempo do esqueleto e o roteiro ("{a exceção, o risco ou o motivo}") não servem a quem escolhe a mudança de opinião, que é o exemplo mais narrativo da tabela (o treinador de natação). Lição cap02-r1: o esqueleto serve a todos os exemplos que o capítulo dá. O "desses" do campo 04 também é ambíguo: pode remeter às três frases do campo 03 (detalhe, exceção, recusa) ou aos cinco sinais da tabela.'
    correcao: 'Esqueleto: "A exceção, o risco, o motivo da recusa ou o que fez você mudar de ideia. É aqui que aparece o seu critério." Roteiro: "E aqui está o que muda a decisão: {a exceção, o risco, o motivo ou o que fez você mudar de ideia}." Campo 04: "Qual dos cinco sinais você vai usar, e a ideia da peça em uma frase".'
  - criterio: clareza
    trecho: "e uma exceção nomeada (todo mundo troca o taco; aquele, não)"
    por_que: 'O parêntese descreve um contraponto ao que os vizinhos fazem, e não uma exceção a uma regra, que é como a tabela define o sinal ("Abdominal serve para quase todo mundo; em quem teve bebê há pouco [...] eu troco o exercício"). É a primeira vez que o leitor vê o conceito aplicado a um caso do capítulo, e o exemplo ensina a coisa errada. A prosa anterior já tinha chamado isso de "uma afirmação contrária ao que o prédio inteiro estava fazendo".'
    correcao: '"e uma exceção nomeada (trocar piso velho costuma valorizar o apartamento; taco de peroba é a exceção)".'
  - criterio: concretude
    trecho: "Contadora: “Planejamento para esconder receita eu não faço: a multa chega depois, e em nome do cliente.”"
    por_que: 'Esconder receita é sonegação, crime (Lei 8.137/1990), e não um "planejamento" que uma contadora escolhe recusar; recusá-lo é obrigação legal de qualquer profissional honesto, e não o "critério raro" que a coluna ao lado promete. "A multa chega depois" ainda subestima a consequência. O sinal "recusa" convence quando se recusa algo legal, comum e ruim para o cliente.'
    correcao: 'Uma recusa legal com critério: "Contadora: “Não recomendo pró-labore no mínimo só para pagar menos imposto a quem conta com a aposentadoria do INSS: economiza agora e recebe menos depois.”"'
  - criterio: voz
    trecho: "ninguém que os assista vai achar que ele trabalha mal. Vai achar apenas que ele filma bem."
    por_que: 'A última seção acumula antíteses acima do limite de uma por seção (lição cap01-r1): esta, "O vídeo simples não ganha em tudo, mas pode se repetir numa semana cheia. Onze fins de semana para seis vídeos não se repetem", e ainda o "Não houve decisão de parar; houve..." da abertura ecoando. "Onze fins de semana" aparece cinco vezes na prosa, duas no último parágrafo, e o refrão perde força. No mesmo trecho, "valer" se amontoa: "vale mais polido", "valia alguma coisa", "vale ser feita", "o que ela vale".'
    correcao: 'Manter a frase do "filma bem" (é a melhor das três) e desfazer a do fecho: "Meia hora de preparo e quatro minutos de gravação cabem numa semana cheia. A presença que depende de esforço extraordinário termina no primeiro mês comum." E: "Mas só se sabe o que a experiência vale depois de fazê-la uma vez."'
  - criterio: coerencia
    trecho: "Arquiteto: \"Em quase todo apartamento dos anos 70 que eu abro, o cano de ferro da cozinha está no fim da vida.\""
    por_que: 'Num capítulo conduzido por um arquiteto, a tabela traz um segundo arquiteto anônimo, o que fere a regra de uma participação por profissão e faz o leitor perguntar se é o Caio. O detalhe é bom (tubulação de ferro galvanizado dos anos 70) e é a cara do Caio.'
    correcao: 'Atribuir: "Caio: “Em quase todo apartamento dos anos 70 que eu abro, o cano de ferro da cozinha está no fim da vida.”" (reforça o personagem e resolve a repetição).'
  - criterio: concretude
    trecho: "Mecânico: \"Em carro com mais de quinze anos, retificar o motor custa perto do que o carro vale. Antes de fazer, eu pensaria em trocar de carro.\""
    por_que: 'A linha se chama "Cálculo de risco", mas o exemplo só compara custo e valor; não há risco nomeado. No treinador de natação, a mudança de prática (ensinar a respirar) não responde à causa dada (crianças que "corriam na frente" e largavam por excesso de volume), e "corriam" é verbo de outro esporte.'
    correcao: 'Mecânico: "...custa perto do que o carro vale, e o câmbio e a suspensão continuam com quinze anos. Antes de fazer, eu pensaria em trocar de carro." Natação: "Hoje o primeiro mês é de respiração e técnica, e a distância vem depois, porque as que nadavam na frente largavam aos doze."'
  - criterio: clareza
    trecho: "e virou para o outro lado a porta do quarto"
    por_que: 'Imagem opaca: porta não se "vira para o outro lado". O leitor não sabe se Caio fechou a porta, escondeu algo pendurado nela ou tirou-a do quadro. Num gesto que modela a regra do quadro limpo, a ação precisa ser inequívoca.'
    correcao: '"e fechou a porta do quarto, onde estavam as caixas da mudança." (ou apenas "e fechou a porta do quarto.").'
  - criterio: aplicabilidade
    trecho: "Anotei três frases da minha semana (campo 03)."
    por_que: 'A mesma tarefa aparece com três formulações: a prosa pede "anotar, ao fim de três expedientes, uma frase", o campo 03 pede "Três frases dos últimos dias", e o checklist fala em "da minha semana". Lição cap03-r1: regra operacional idêntica em todos os lugares.'
    correcao: 'Checklist: "Anotei três frases dos últimos dias (campo 03)." Se a prosa mantiver os três expedientes como hábito, acrescentar ao exemplo do campo 03: "Se não lembrar de nenhuma, anote uma ao fim de cada um dos próximos três expedientes."'
edicoes_de_linha:
  - {de: "Mas a experiência vale ser feita pelo menos uma vez antes de decidir o que ela vale.", para: "Mas só se sabe o que a experiência vale depois de fazê-la uma vez."}
  - {de: "e a lista do que você vai deixar de fazer para gravá-la.", para: "e a lista do que você vai deixar de fazer para gravá-la ou escrevê-la. (a rede aceita texto; a entrega não)"}
  - {de: "Os vídeos do Caio tinham a camada de cima impecável e a de baixo quase vazia.", para: "Os vídeos do Caio tinham a camada de cima impecável e a de baixo vazia. (a prosa diz \"Faltava a camada de baixo\")"}
  - {de: "Escolha a sua última peça publicada, ou a de um colega, se você ainda não publica. Reescreva, à mão, só o que ela dizia.", para: "Se você ainda não publica, faça o teste com a última peça de um colega. (o resto do box repete a prosa do parágrafo anterior)"}
  - {de: "Quem assiste a um vídeo ou lê um texto de um especialista procura, sem perceber, sinais", para: "Eu diria que quem assiste a um vídeo ou lê um texto de um especialista procura, sem perceber, sinais (a generalização sobre o público vira opinião do narrador)"}
  - {de: "ROTEIRO DE FALA — PARA LER EM VOZ ALTA, GRAVANDO", para: "ROTEIRO DE FALA — PARA DIZER EM VOZ ALTA (\"ler gravando\" contradiz \"você falando como fala com um cliente\"; se o rótulo vem do modelo, ajustar no modelo)"}
diagramacao:
  - 'p016: cerca de 40% da página em branco depois do parágrafo "O áudio do taco tinha três desses sinais…", porque o box "Na prática" é indivisível e desceu para a p017 (na r2 o branco era de 1/4; piorou). Evitável: pôr o parágrafo "Os cinco sinais nascem do trabalho real…" antes do box, para que ele preencha a p016, ou colocar o box logo depois do parágrafo de abertura da seção, antes da tabela.'
  - 'p012: cerca de 1/5 da página em branco no pé; o intertítulo "A confusão entre bonito e bom" foi para o alto da p013, embora caibam o título e ao menos três linhas do primeiro parágrafo. Rever a margem superior do h2 ou o orphans do parágrafo que o segue.'
  - 'p021/p022: a abertura da rede ("DO CADERNO PARA A REDE", "Uma tomada, uma ideia" e duas linhas da intro) ficou no pé da p021, e a intro quebra no meio da frase ("a regra é a" / "mesma: escreva de uma vez"). A p022 tem quase metade livre (branco aceito antes do esqueleto); empurrar a abertura inteira para a p022 cabe e mantém título e intro juntos.'
  - 'p018, figura 3.2: os rótulos "Edição elaborada" e "Rende pouco", e também "Ter o que dizer" e "Rende muito", ficam empilhados a 1 ou 2 mm um do outro e, em preto e branco, leem-se como um rótulo só. Afastar os rótulos das extremidades (ou pô-los na mesma linha da barra, fora dela).'
  - 'p013: cerca de 1/6 da página em branco no pé, porque a figura 3.1 não coube; aceitável, mas some se o parágrafo das camadas (problema 3) crescer uma linha ou se a figura vier antes do parágrafo "Visto de perto…".'
  - 'Extensão: p011 a p025, 15 páginas, dentro do alvo de 14 a 16. Os brancos da p019 (antes da oficina, que abre página) e da p022 (antes do esqueleto indivisível) são aceitos pelo projeto; a p026 em branco é alinhamento para o apêndice. O rótulo "A BASE" da figura 3.1 e a tabela 3.1 (rótulo junto do título) estão resolvidos.'
veredito: "Capítulo maduro, que resolve o bloqueador e a duplicação oficina/rede da r2 e fica no limiar da aprovação; faltam ajustes: o furo de enredo do granilite (o arquiteto deixa o cliente descobrir pelo vídeo o valor do próprio piso, com licença dada sem atenção), uma questão da verificação com duas respostas defensáveis e um critério da oficina que não mede nada."
