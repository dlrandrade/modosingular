capitulo: 15
iteracao: 1
notas: {metodo: 8.6, voz: 8.8, originalidade: 9.0, clareza: 8.7, ritmo: 8.8, concretude: 9.0,
        coerencia: 7.9, aplicabilidade: 8.3, impresso: 8.7, honestidade: 8.5}
bloqueadores:
  - 'Erro técnico no critério central (lição cap09-r1). O capítulo dá como lição transferível "se a sua dor tem dia da semana, procure o que você faz na véspera" (repetido em "vale procurar o que acontece na véspera" e em "terminou na pergunta sobre a véspera"). No próprio caso, porém, a sobrecarga é no sábado e a dor pior vem "na segunda e na terça": a véspera da segunda é o domingo. A dor tardia de sobrecarga costuma aparecer um a três dias depois, e é por isso que o caso funciona. Quem aplicar o critério ao pé da letra vai olhar para o dia errado, e um fisioterapeuta nota isso na primeira leitura. Trocar nos três lugares por "procure o que você fez nos dois ou três dias antes" (ou "no fim de semana anterior", na peça da Renata).'
  - 'O sigilo pelo calendário sumiu do capítulo, e o caso-modelo o contraria. Na fonte, "O caso está seguro quanto a sigilo" exige "Tempo deslocado, nada identificável, ou caso composto", e a tarefa tem um campo "Checagem de sigilo: Tempo deslocado? Nada identificável? É caso composto?". A lição cap13-r1 diz que "o caso-modelo do livro mostra a espera". Aqui Renata tira o caso "entre as anotações das últimas semanas" e o grava "na terça seguinte". O tempo deslocado não aparece no parágrafo do sigilo, nos critérios da oficina nem no checklist. Só sobra implícito no roteiro ("há algum tempo"). Correção: situar o caso num caderno antigo ("uma linha de mais de um ano atrás") ou mostrar a espera, pôr o tempo deslocado no parágrafo do sigilo e criar na oficina o campo de checagem (ver aplicabilidade).'
pontos_fortes:
  - 'O caso central é próprio, comum e memorável, e cumpre a nota do plano ("Não escolher o caso espetacular") sem precisar anunciá-la: "faxina na casa da mãe, que já não conseguia fazer sozinha, quatro horas, de joelhos e curvada, lavando o banheiro e o quintal". O contraste com o senhor da cadeira de rodas faz o conceito nascer da cena antes do box, como pede a estrutura de prosa.'
  - '"O áudio do senhor da cadeira de rodas continua guardado no celular, com uma anotação no nome do arquivo: “para quando já me conhecerem”" é um fecho de cena com imagem própria, que o cap. 19 retoma ("O senhor da cadeira de rodas continua lá"). A continuidade é boa.'
  - 'A voz é adulta e contida, com lint limpo (0 frase-soco, 0 travessão, frase média 15,7). Há frases que um editor assinaria: "Nenhum dos pacientes que ela queria atender se achava raro." e "O “o quê” é enredo."'
  - 'O exemplo do veterinário e o da nutricionista na oficina trazem sinais concretos e transferíveis ("ele só coçava as patas, e só depois de passear"; "o cansaço vinha sempre às quatro da tarde"). O roteiro de fala é 100% sobre a área do leitor e já embute o tempo deslocado ("há algum tempo").'
problemas:
  - criterio: coerencia
    trecho: "Esquema ilustrativo. O caso do senhor da cadeira de rodas mora no alto, à esquerda; o da paciente das segundas, no alto, à direita."
    por_que: 'A legenda põe o caso do senhor no quadrante "Mostra o seu critério". A prosa diz o contrário duas vezes: "a lição dele não se transfere para ninguém" e "Renata cortou os três adjetivos do primeiro áudio e, ao cortar, percebeu que o caso do senhor ficava sem assunto". Um caso que fica sem assunto quando se tiram os adjetivos mora em "Vaidade", embaixo e à esquerda. A figura que deveria fixar o conceito contradiz o texto.'
    correcao: 'Legenda: "Esquema ilustrativo. Sem os adjetivos, o caso do senhor da cadeira de rodas desce para o canto de baixo, à esquerda; o da paciente das segundas mora no alto, à direita." Ou então tirar a frase "ficava sem assunto" e dizer qual critério o caso do senhor mostra (e por que ele não se transfere).'
  - criterio: coerencia
    trecho: "Renata escreveu o primeiro rascunho numa noite de chuva, sem dificuldade nenhuma."
    por_que: 'A primeira ação da personagem em foco contraria o modo dela: Renata "pensa FALANDO", e desde a Fase II grava áudios no carro. O parágrafo seguinte já trata o rascunho como áudio ("O áudio que gravou no carro [...] Ao transcrever"), o que deixa o leitor sem saber se houve texto e áudio ou só áudio. A lição cap01-r2 pede que o modo apareça já na primeira cena.'
    correcao: '"Renata gravou o primeiro rascunho no carro, numa noite de chuva, sem dificuldade nenhuma." E no parágrafo seguinte: "O áudio saiu emocionado e comprido."'
  - criterio: aplicabilidade
    trecho: '{rotulo: "Conferi o sigilo", ajuda: "Nada identifica ninguém; o caso é composto, se precisou ser.", pontos: 2}'
    por_que: 'Nenhum campo da oficina corresponde a esse item (lição cap01-r1). A entrega promete um caso "conferido contra [...] a lista do sigilo", mas não há lista no capítulo: o parágrafo do sigilo é prosa, e o critério 3 ("Nada no caso identifica alguém") não cobre o tempo. Pela fonte, a checagem de sigilo é critério de peso 3.'
    correcao: 'Acrescentar um campo 07, "Checagem de sigilo", com uma grade de três linhas para marcar: "Aconteceu há tempo suficiente para a pessoa não se reconhecer pela data", "Nada identifica ninguém (nome, idade exata, profissão, bairro, frase literal)", "Se o caso é raro ou a cidade é pequena, é composto ou ficou só o padrão". A ajuda do checklist passa a remeter a ele ("campo 07"), e a entrega troca "a lista do sigilo" por "a checagem do sigilo (campo 07)".'
  - criterio: coerencia
    trecho: 'O áudio do senhor da cadeira de rodas continua guardado no celular, com uma anotação no nome do arquivo: "para quando já me conhecerem".'
    por_que: 'O cap. 13 fixou que "Numa cidade pequena ou num caso raro, nem o caso composto basta". O caso do senhor é, por definição do próprio capítulo, o raro: cadeira de rodas, duas cirurgias, três médicos, a subida da escada presenciada pela secretária. O plano de publicá-lo "quando já me conhecerem" não menciona autorização, e o leitor aprende que o caso raro só espera uma questão de reputação. Pela ética de saúde, é o caso que mais exige consentimento.'
    correcao: 'No último parágrafo: "Sabe que, um dia, com a autorização dele e um público que já acompanha o raciocínio dela, ele vai ter lugar." Isso também resolve a repetição quase literal de "parece propaganda / parece consequência" (ver ritmo).'
  - criterio: honestidade
    trecho: "Na sexta, uma paciente nova marcou avaliação e, na primeira consulta, antes de qualquer pergunta, contou o que fazia aos sábados."
    por_que: 'O texto não diz se o áudio foi publicado nem como a paciente chegou a ele (lição cap03-r3: toda cena que mostra resultado mostra como a pessoa chegou a ele). Três dias entre a gravação e uma paciente nova convertida soa como a promessa que o próprio capítulo veda ("Não garante que vai acontecer de novo"). Também antecipa o arco da Fase V ("pacientes chegam citando vídeos antigos").'
    correcao: 'Trocar a conversão por um efeito menor e verificável, que ecoe o critério. Por exemplo: "Na sexta, uma paciente antiga respondeu ao áudio com uma linha: tinha ido olhar o próprio fim de semana." Se a paciente nova ficar, dizer como ela ouviu o áudio e tirar o "antes de qualquer pergunta".'
  - criterio: aplicabilidade
    trecho: '{rotulo: "A situação óbvia", texto: "Como qualquer um leria o caso, e o que já tinha sido tentado.", linhas: 2}'
    por_que: 'O esqueleto da rede repete, parte por parte, os campos 02 a 05 da oficina (situação, detalhe, decisão, critério). A lição cap02-r2 manda que, quando a oficina já escreveu as partes, o esqueleto seja "passe a limpo" (esqueleto_rotulo). Na página impressa, isso gera uma página inteira de rascunho redundante (p. 22) e um branco de dois terços na p. 21.'
    correcao: 'Usar esqueleto_rotulo "Passe a limpo, cortando o que a checagem do sigilo tirou" e 2 linhas por parte. Ou transformar o esqueleto numa versão com limite ("a peça em até oito frases: duas por tempo").'
  - criterio: aplicabilidade
    trecho: 'exemplo: "O que você fez de diferente, e qual régua usou para decidir."'
    por_que: 'Dos seis campos, só o 03 tem exemplo de ofício (a nutricionista), e ele para no detalhe. Os campos 04 e 05, que são os mais difíceis (a régua e o critério que sobrevive fora da história), só trazem instrução. O leitor que não é fisioterapeuta nem veterinário fica sem modelo justamente onde mais precisa.'
    correcao: 'Levar a nutricionista até o fim. Campo 04: "Uma nutricionista: “Em vez de cortar calorias, pedi que ela anotasse o que comia até as duas da tarde.”" Campo 05: "“Se o cansaço tem hora marcada, olhe para o que você comeu, ou deixou de comer, seis horas antes.”" O critério 2 da oficina também pode ficar verificável no papel: "A última frase é um critério que funciona sem o seu nome, e nenhuma frase tem você como sujeito de um elogio."'
  - criterio: coerencia
    trecho: 'Caio faz o mesmo sem dar nome ao método: quase toda peça dele começa por "teve uma obra" e termina num critério, como a da parede no capítulo anterior. Lúcia faz com casos compostos, do jeito que aprendeu no capítulo 13'
    por_que: 'No cap. 14, a peça da parede ainda não saiu: ela fica marcada "para o fim do mês", no nível crítico, e é uma resposta a pergunta, não um caso. O caso do Caio que começa com "Teve uma obra" e termina num critério é o da parede que mentia, no cap. 11. Além disso, personagem não "aprende no capítulo 13": quem lê o livro é o leitor. E a rodada dos três outros protagonistas num parágrafo só soa como ficha de elenco (lição cap01-r1).'
    correcao: 'Manter o Otávio, que traz a melhor analogia do capítulo, e reduzir os outros dois a uma frase: "Caio faz o mesmo sem dar nome ao método, desde a parede que mentia do capítulo 11: começa em “teve uma obra” e termina num critério." Cortar a Lúcia ou trocar por "o domingo da Lúcia, no capítulo 13, também é um caso-prova, composto de três".'
  - criterio: voz
    trecho: "Renata não mudou os exercícios. Mudou o sábado"
    por_que: 'É a batida "o personagem não fez o óbvio; fez outra coisa", que a lição cap04-r1 dá por esgotada, e volta idêntica na seção dos quatro tempos ("Renata não mudou os exercícios; mudou o sábado."). O capítulo acumula antíteses explícitas acima de uma por seção (lição cap01-r1). Em "O argumento e o caso": "A do senhor [...] pede admiração. A da paciente das segundas pede", "O caso não prova que Renata é boa fisioterapeuta [...] O que o caso prova é". Em "Os quatro tempos": "A autoridade de Renata não aparece no desfecho [...] Aparece na percepção", "Sem esse tempo [...] Com ele". Em "O teste do coadjuvante": "Se sente admiração [...] Se sente que aprendeu", "e nunca como plateia do profissional".'
    correcao: 'Abrir pela ação: "Renata deixou os exercícios como estavam e foi ao sábado: três ajustes de postura e uma pausa a cada hora." No terceiro tempo, dizer só o porquê: "A decisão foi mexer no sábado, porque a dor seguia a sobrecarga, e não a falta de alongamento." Em cada seção, manter uma antítese e transformar as outras em afirmação simples.'
  - criterio: ritmo
    trecho: "O primeiro tempo põe o leitor do lado do erro comum. [...] O segundo tempo é o mais importante, e o mais curto. [...] O terceiro tempo conta a decisão [...] O quarto tempo é o único"
    por_que: 'Logo abaixo da figura 15.2, que já lista os quatro tempos com nota, vêm quatro parágrafos que começam pelo ordinal. É estrutura de apostila, e a seção lê como legenda estendida. O fecho do capítulo também recicla quase ao pé da letra uma frase de dez parágrafos antes: "Contado por alguém cujo raciocínio o público já acompanha há meses, parece consequência" e depois "contado por alguém cujo raciocínio o público já acompanha, ele vai parecer consequência, e não propaganda". O fecho deveria trazer um ganho novo (lição cap01-r2).'
    correcao: 'Fundir o primeiro e o segundo tempos num parágrafo que conte a virada na ordem em que Renata a gravaria (alongamento, colchão, cadeira, e então a dor com dia marcado), e variar as entradas dos outros. No fecho, ver a correção de coerência (autorização) e não repetir a fórmula.'
  - criterio: ritmo
    trecho: "Há ainda um limite que nenhum caso atravessa: ele não promete resultado."
    por_que: 'A seção "O teste do coadjuvante" virou depósito: coadjuvante, adjetivos, promessa de resultado, sigilo, gravação e destino do áudio antigo. O intertítulo não cobre metade disso (lição cap01-r2). Três parágrafos do capítulo abrem com "Há" ("Há também uma diferença", "Há um jeito rápido", "Há ainda um limite").'
    correcao: 'Abrir um quinto intertítulo antes deste parágrafo, por exemplo "O que um caso não pode fazer", com promessa, sigilo (e tempo) e a cena final. Variar as aberturas: "Contar um caso e afirmar uma coisa pedem coisas diferentes a quem ouve." e "Um caso não atravessa um limite: ele não promete resultado."'
  - criterio: honestidade
    trecho: "Nas profissões regulamentadas, os códigos de ética vedam a promessa de resultado e, em várias delas, a exibição de antes e depois."
    por_que: 'A primeira metade é segura. A segunda é um fato normativo em movimento: conselhos como o CFM (2023) e o CFO passaram a admitir o antes e depois sob condições. "Vedam [...] em várias delas" pode estar desatualizado para parte do público. A lição cap02-r2 diz: "na dúvida, formular pelo que é certo".'
    correcao: '"Nas profissões regulamentadas, os códigos de ética vedam a promessa de resultado, e vários deles impõem regras próprias ao antes e depois. Confira as do seu conselho."'
  - criterio: honestidade
    trecho: "O instinto de quase todo especialista é escolher o caso mais impressionante"
    por_que: 'Há generalizações sobre terceiros acima do teto de duas (lição cap01-r4/cap02-r2): esta, "Os casos comuns quase nunca parecem casos a quem os viveu", "costumam render mais quando o especialista já é conhecido" e "quem lê as desconta automaticamente".'
    correcao: '"O instinto é escolher o caso mais impressionante" (Renata já é o exemplo). "Os casos comuns raramente parecem casos a quem os viveu": melhor, "não pareciam caso à Renata, e por isso ela teve de procurá-los". Cortar "automaticamente".'
  - criterio: originalidade
    trecho: "se a sua dor tem dia da semana, procure o que você faz na véspera"
    por_que: 'O critério do sintoma com ritmo semanal já foi usado no cap. 3 pela fonoaudióloga ("Rouquidão que piora ao longo da semana e melhora no domingo costuma ter mais a ver com o jeito de usar a voz"). Não é a mesma cena, mas é a mesma forma de sinal, e o leitor atento vai notar o eco (lição cap02-r1). Além disso, o "comum" do exemplo do veterinário é quase uma cópia do "ruim" da fonte ("Recebi um caso complexo [...] É por isso que amo o que faço").'
    correcao: 'Manter o caso da Renata, que é forte, e tirar o eco do cap. 3: ou reformular o sinal da fonoaudióloga no cap. 3, ou deslocar a ênfase do critério da Renata de "dia da semana" para "a dor que vem depois do esforço, e não durante". No exemplo do veterinário, reescrever o "comum" com vícios próprios do ofício, por exemplo: "Mais um peludinho que voltou a ser feliz. Caso difícil, mas com amor e ciência a gente chega lá."'
  - criterio: concretude
    trecho: "Mudou o sábado, com três ajustes de postura e uma pausa a cada hora."
    por_que: 'É o único momento do caso em que o detalhe de ofício vira abstração, justo no tempo 3, que o capítulo diz ser "o conteúdo". Um fisioterapeuta leitor quer saber quais ajustes.'
    correcao: '"Foi ao sábado: o rodo de cabo comprido no lugar do pano de joelhos, o banheiro num sábado e o quintal no outro, e uma pausa a cada hora."'
edicoes_de_linha:
  - 'Achou uma linha de três palavras e uma seta -> Achou uma linha de quatro palavras e uma seta ("dor às segundas → sábado" tem quatro)'
  - 'Um bom caso, numa peça, funciona como uma boa prova numa audiência -> Um bom caso publicado funciona como uma boa prova numa audiência ("peça", na boca de um advogado, lê-se como peça processual)'
  - 'Pedi para ver o caminho do passeio. -> Perguntei por onde eles passeavam.'
  - 'e quem lê as desconta automaticamente -> e quem lê as desconta'
  - 'O quarto tempo é o único que precisa sobreviver sozinho, fora da história -> O quarto tempo é o único que precisa sobreviver fora da história ("sozinho/sozinha" aparece 9 vezes na prosa)'
  - 'e o leitor aplica o adjetivo sozinho -> e o leitor aplica o adjetivo por conta própria'
  - 'O padrão, que Renata já tinha visto em muitos pacientes, fez o resto -> O padrão fez o resto (repete "tinha visto a dor das segundas em dezenas de pacientes")'
  - 'Renata não o apagou, nem pensa em apagar. -> Renata não o apagou.'
  - 'Um episódio real, sem nada que identifique alguém, escolhido porque mostra um critério seu em funcionamento, e não porque impressiona. -> Um episódio real, sem nada que identifique alguém, escolhido porque mostra um critério seu em funcionamento. (a antítese já está na frase seguinte do box)'
  - 'Verificação 1, opção a: Porque histórias são mais fáceis de lembrar do que regras. -> Porque o caso dispensa explicar o que foi feito. (a original é verdade parcial, e o distrator tem de ser inequivocamente falso)'
diagramacao:
  - 'As PNGs de QA em apostila/saida/qa/cap15/ estão defasadas (27/09, 21h) em relação ao manuscrito (28/09, 12h29). Elas mostram rótulos com numeração duplicada na oficina ("02 / 1. A situação como qualquer um leria") e "a casa da mãe sumiu". A revisão usou uma recompilação feita no scratchpad. Rodar build --caps 15 --png antes da próxima rodada.'
  - 'p. 16: cerca de 35% da página em branco depois do primeiro parágrafo de "O teste do coadjuvante", porque o box "Na prática" (exemplo do veterinário) desceu inteiro para a p. 17. É um branco evitável. Mover o exemplo para depois do parágrafo "O mesmo teste pega um erro comum..." ou deixar o box quebrar entre "O comum" e "O singular".'
  - 'p. 21: dois terços da página em branco antes do esqueleto. O projeto aceita esse branco antes de um esqueleto indivisível, mas ele existe só porque o esqueleto repete a oficina. Com o "passe a limpo" de 2 linhas por parte, esqueleto e regras cabem na p. 21 e o Faça/Evite sobe.'
  - 'p. 20: a oficina termina a 60% da página. Com o campo 07 de sigilo (grade de três linhas), o espaço fica aproveitado sem empurrar nada.'
veredito: "Caso central forte e voz adulta, mas o critério transferível aponta para o dia errado (a véspera da segunda é o domingo) e o capítulo perdeu o sigilo pelo calendário que o cap. 13 fixou. Com isso corrigido, e a legenda do quadrante, a oficina e o esqueleto ajustados, chega a 9."
