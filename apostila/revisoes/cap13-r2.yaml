capitulo: 13
iteracao: 2
notas: {metodo: 8.4, voz: 8.9, originalidade: 9.0, clareza: 8.7, ritmo: 8.9, concretude: 9.0,
        coerencia: 8.3, aplicabilidade: 8.6, impresso: 8.8, honestidade: 8.9}
bloqueadores:
  - 'A regra do calendário, lição cap13-r1 e regra do próprio capítulo ("Desloque também a data da publicação: nunca na semana do atendimento"), continua quebrada em dois lugares. (1) Instrução ao leitor: a oficina pede "um episódio real da sua semana" e a rede abre com "Publique a peça da oficina". Quem faz um capítulo por dia publica, na semana do atendimento, exatamente o que o capítulo proíbe; a ressalva só aparece no roteiro_nota, no pé da p. 23, depois da ordem de publicar. (2) Caso-modelo: "Em julho, outra paciente, de outra idade e noutro horário, descreveu o mesmo aperto com outras palavras. Só então Lúcia tirou a folha do caderno e escreveu a peça, numa terça às oito." O "só então" lê-se como publicação logo depois dessa sessão. A paciente de julho recebe, dias depois de falar do aperto, um texto sobre o aperto: é o mesmo "recado" que a seção A espera acabou de condenar, transferido para outra pessoa. A própria regra ("de preferência só quando o mesmo assunto tiver aparecido com outra pessoa") cria a armadilha, porque a reaparição é sempre recente para quem a trouxe.'
pontos_fortes:
  - 'A troca da música de televisão por "quando a mãe, do quarto ao lado, começava a passar as camisas da semana, e o cheiro do ferro atravessava a porta" resolveu o problema da r1: é um detalhe de fato particular, sustenta a regra "a frase mais bonita da sessão é, quase sempre, a que mais identifica" e dá ao fecho uma imagem forte ("O cheiro do ferro continuava no caderno trancado, onde pertencia").'
  - 'O teste do horóscopo ("se o padrão caberia num horóscopo, está grande demais; se só faz sentido para quem estava na sala, está pequeno demais") é uma régua original, operacional e fácil de repetir a outra pessoa. É o melhor achado de clareza do capítulo.'
  - 'A nova seção A espera ensina pela cena, não pela regra: "um texto sobre o domingo cinco dias depois seria um recado, por mais limpo que estivesse, e ela se reconheceria não pelos detalhes, que tinham saído, mas pela data". A declaração do caso composto na primeira linha ("juntei aqui o que ouvi de algumas pessoas, em anos diferentes") agora aparece feita pela personagem.'
  - 'O parágrafo sobre a autorização ("a autorização dada nessas condições pode não ser tão livre quanto parece") e a grade "Tirei / Não havia" continuam sendo o que o capítulo tem de mais adulto e mais executável.'
problemas:
  - criterio: metodo
    trecho: 'Publique a peça da oficina. O assunto é o padrão da sua área'
    por_que: 'Ver bloqueador (1). A oficina se chama "A sua primeira tradução completa" e pede "um episódio real da sua semana"; a rede manda publicar a peça. O roteiro_nota ("nunca publicado na semana do atendimento") contradiz a intro da mesma seção. O leitor de saúde e de psicologia, que é quem mais precisa dessa regra, recebe duas ordens opostas.'
    correcao: 'Oficina, objetivo: "Executar as quatro operações num episódio real da sua prática, de preferência de semanas ou meses atrás, e chegar a uma peça que você possa publicar sem expor ninguém." Rede, intro: "Publique a peça da oficina quando o calendário permitir: se o episódio é desta semana, guarde a folha e publique depois. O assunto é o padrão da sua área; o caso é só a porta de entrada." Acrescente um critério ao "Confira antes de seguir": "O episódio não é desta semana, ou a folha ficou guardada com data para sair."'
  - criterio: metodo
    trecho: 'Só então Lúcia tirou a folha do caderno e escreveu a peça, numa terça às oito.'
    por_que: 'Ver bloqueador (2). A regra da prosa ("de preferência só quando o mesmo assunto tiver aparecido com outra pessoa") e a cena juntas ensinam a publicar logo depois de um novo atendimento sobre o mesmo tema. Além disso, a espera por reaparição não faz sentido na lógica do próprio capítulo: Lúcia "já tinha ouvido versões dessa história muitas vezes" e compôs o caso com "outras duas, de anos diferentes"; o padrão já existia em maio.'
    correcao: 'Cena: "Em julho, outra paciente descreveu o mesmo aperto com outras palavras. Lúcia anotou a data e esperou mais três semanas; agora eram duas pessoas que não podiam receber o texto como recado. Publicou no começo de agosto, numa terça às oito." (Confira com o cap. 17, que abre numa segunda de agosto; se colidir, publique no fim de julho e desloque a sessão para o fim de junho.) Regra da prosa: "Desloque também a data da publicação: nunca na semana do atendimento, nem na semana de qualquer atendimento recente sobre o mesmo assunto."'
  - criterio: coerencia
    trecho: 'custavam em torno de setenta minutos'
    por_que: 'A r1 apontou este choque e ele persiste. O cap. 8 mede 72 minutos em janeiro e, em março, "o relógio marcou menos de uma hora, pela primeira vez"; em maio, a figura 13.1 volta a "Partindo de algo que aconteceu: 72 min", o número exato de janeiro. A prosa também continua chamando de "algo que tinha acontecido" a "pergunta real da amiga", que é tradução de formato (fala para texto), não episódio da prática; o conceito do capítulo diz "um episódio da sua prática, como um atendimento, uma dúvida ou uma decisão".'
    correcao: '"As peças que partiam de uma crença anotada no caderno, trazida por algum paciente, tinham caído para menos de uma hora desde março." Figura: "Partindo de um episódio anotado: 55 min" (ou outro número abaixo de 60 que não coincida com nenhum outro personagem).'
  - criterio: coerencia
    trecho: 'Na sexta de manhã, Lúcia fez as quatro operações no papel, uma de cada vez, sem tentar escrever a peça.'
    por_que: 'Lúcia pensa RESPONDENDO, e todo o seu ritmo, no cap. 8 e no enunciado do cap. 12, está "amarrado à pergunta da amiga". Neste capítulo ela escreve no celular à noite, faz as operações sozinha no papel e publica sem interlocutor; o modo dela, que é o traço de coerência que o livro vem construindo, some justamente no capítulo em que ela está em foco. Contraria a lição cap11/cap12 ("regras de produção dizem no seu modo").'
    correcao: 'Faça as operações nascerem de perguntas, o que é natural para ela: "Na sexta de manhã, pediu à amiga do grupo de estudos que lhe fizesse quatro perguntas, sem saber do caso: o que aconteceu, numa frase; o que disso é só daquela pessoa; do que isso é exemplo; o que alguém faria com isso sozinho. Respondeu cada uma por escrito, no papel." Uma frase no parágrafo final da seção "Do que isso é exemplo" pode lembrar que quem pensa escrevendo, falando ou contando faz as mesmas quatro operações no seu modo.'
  - criterio: clareza
    trecho: 'Algumas pessoas sentem o domingo acabar antes da hora, no fim da tarde'
    por_que: 'A tabela 13.1 ainda mistura etapas. Despersonalizar deveria manter um caso, sem os identificadores; a linha já passa para o plural ("Algumas pessoas") e já traz a interpretação que será o padrão da etapa 3 ("antes da hora" = "a perda do descanso chegando antes"). A prosa, por sua vez, diz que ela "ficou com o domingo, a tarde e o aperto", sem "antes da hora". O leitor que copia a tabela aprende a generalizar na etapa 2, que é o erro que a seção "As quatro operações" diz ser previsível.'
    correcao: 'Despersonalizado: "Alguém sente um aperto que começa no domingo, no fim da tarde". O que fez: "Tirou horário exato, mãe, ferro e a frase literal".'
  - criterio: clareza
    trecho: 'o que exatamente você está antecipando? A tarefa da segunda-feira, a conversa com alguém, a sensação de não ter descansado?'
    por_que: 'O devolver não sai do generalizar, e o capítulo inteiro diz que o padrão é o que torna o critério possível. O padrão é "a perda do descanso, mais do que o medo do trabalho", e a pergunta oferece como primeiras opções justamente o trabalho ("a tarefa da segunda-feira") e o oposto do padrão ("a sensação de não ter descansado", quando o padrão fala de quem descansou bem). A resposta da leitora no fecho ("o fim do único dia em que ninguém lhe pedia nada") confirma o padrão, não a pergunta.'
    correcao: '"Podia oferecer uma pergunta que ajuda a pessoa a observar o próprio domingo: o que exatamente você está antecipando, o que vem na segunda ou o que acaba no domingo? Nomear o que se perde, escreveu, às vezes diminui o tamanho do aperto, e ajuda a decidir se vale procurar ajuda."'
  - criterio: coerencia
    trecho: 'Uma delas dizia que a pessoa tinha lido o texto num domingo, às cinco da tarde'
    por_que: 'O capítulo chama a paciente de "a paciente das cinco da tarde" quatro vezes. Uma leitora que escreve "às cinco da tarde", no fecho, faz o leitor suspeitar que a resposta veio da própria paciente, e isso desmonta a lição sobre reconhecimento no último parágrafo. Se a coincidência é intencional, está ambígua; se não é, é um eco acidental.'
    correcao: '"...tinha lido o texto num domingo, no fim da tarde, e que pela primeira vez..."'
  - criterio: aplicabilidade
    trecho: '{rotulo: "Montei a peça na minha voz", ajuda: "Li em voz alta antes de passar a limpo (campo 06).", pontos: 2}'
    por_que: 'O checklist perdeu o critério "Entreguei um critério, não só uma história", que é a quarta operação e um dos quatro pontos da fonte. Hoje "devolver" só vale como parte do item 1 (três operações e meia bastam para marcar). O item "Li em voz alta" mede um hábito, não o resultado; e o campo 06 ("Junte as quatro partes do jeito que você falaria") pressupõe o modo falado.'
    correcao: 'Substitua o item 4 por: {rotulo: "Entreguei um critério, e não só uma história", ajuda: "Quem lê leva uma pergunta ou um sinal para observar sozinho (campo 05).", pontos: 2}. Campo 06, exemplo: "Junte as quatro partes no seu modo: falando, escrevendo, respondendo ou contando. Leia em voz alta antes de passar a limpo."'
  - criterio: voz
    trecho: 'O sigilo não impede a tradução; fecha o atalho de publicar o caso como ele aconteceu'
    por_que: 'A seção "A linha que não se cruza" ainda tem duas antíteses explícitas: esta e "Não é ficção: nenhum dos elementos foi inventado. É agregação." (lição cap01-r1: no máximo uma por seção). A reescrita proposta na r1 manteve a estrutura "não X; Y". Há também uma terceira forma do tique em "Criar ou traduzir": "A diferença de custo não vem da velocidade de escrever. Vem de onde está o trabalho."'
    correcao: 'Sigilo: "O sigilo fecha um atalho, o de publicar o caso como ele aconteceu, com o nome trocado e mais nada. A tradução continua aberta." Criar ou traduzir: "A diferença de custo está em onde fica o trabalho."'
  - criterio: voz
    trecho: 'A regra mais importante cabe numa linha:'
    por_que: 'Narrador que anuncia antes de dizer (lição cap01-r1), e com um superlativo que o capítulo não sustenta: duas páginas depois, a regra do calendário é tratada como a mais grave. Mesma família: "Um teste rápido ajuda a calibrar:". E "Os outros personagens fazem a mesma operação" apresenta um só personagem, o Otávio.'
    correcao: '"A frase mais bonita da sessão é, quase sempre, a que mais identifica." (comece por ela) / "Para calibrar: se o padrão caberia num horóscopo..." / "Otávio faz a mesma operação no ofício dele."'
  - criterio: coerencia
    trecho: 'e fez bem em não publicá-lo'
    por_que: 'No cap. 4, Otávio gravou "só para ouvir"; nunca pensou em publicar aquele áudio. O capítulo 13 lhe dá crédito por uma decisão que ele não tomou. Menor: "O de campo, que ela passou a usar quando a nota no celular ficou pequena, fica na bolsa" é uma costura aceitável com o cap. 2, mas "ficou pequena" é vago (pequena de espaço? de hábito?).'
    correcao: '"Otávio, no capítulo 4, trocou o nome de um cliente de Caruaru num áudio que gravou só para si. Se um dia quiser publicar aquele exemplo, trocar o nome não vai bastar: numa cidade do tamanho de Caruaru..." / "O de campo, um caderno de bolso que substituiu a nota no celular quando a lista passou de cem linhas, fica na bolsa..."'
  - criterio: honestidade
    trecho: 'Você não cria conteúdo do nada. Você traduz o que já aconteceu na sua prática, e traduzir custa muito menos.'
    por_que: 'O "Para guardar" transforma a medição de uma personagem numa lei geral ("custa muito menos"), quando a legenda da figura diz com cuidado "Os números são da Lúcia, e não uma regra". A prosa também generaliza sem fonte sobre terceiros: "Custa caro e costuma sair genérico, porque o que se inventa tende a se parecer com o que todo mundo inventa"; "quem tenta generalizar antes de despersonalizar costuma levar para o padrão os detalhes do caso". Está no limite de 2 da lição cap01-r4.'
    correcao: 'Guardar: "Você não cria conteúdo do nada. Você traduz o que já aconteceu na sua prática, e o episódio já traz o assunto, o exemplo e o ângulo." Prosa: "Custa caro e sai genérico com facilidade, porque o que se inventa se parece com o que já foi inventado."'
  - criterio: coerencia
    trecho: 'Uma veterinária: “Um tutor chorou quando eu disse que a cirurgia do cachorro velho era possível.”'
    por_que: 'Lição cap02-r2: profissões de figurantes não se repetem em capítulos vizinhos. O cap. 15 já usa "O mesmo veterinário", com tutor e cachorro, no exemplo comum-vs-singular. Duas cenas de tutor e cão, com dois capítulos de distância, parecem o mesmo figurante. Também, a jusante: o cap. 15 chama o caso de "o domingo das seis da tarde", repondo o horário que a Lúcia cortou; convém avisar o autor do cap. 15.'
    correcao: 'Troque a veterinária por uma profissão ainda livre na vizinhança (por exemplo, fonoaudióloga: "Uma mãe chorou quando eu disse que o filho de quatro anos ia, sim, falar"; padrão: "Pais de crianças com atraso de fala esperam a escola para agir"; critério: "Antes de esperar pelo ano que vem, observe se ele entende o que você pede sem gesto"). No cap. 15, "o domingo no fim da tarde".'
  - criterio: impresso
    trecho: 'p. 18: o parágrafo final termina em "Lúcia guardou a resposta no caderno," e continua na p. 19'
    por_que: 'A p. 18 fica com cerca de um quarto em branco no pé e o último parágrafo da prosa é partido, com duas linhas órfãs no topo da p. 19. O branco precede o "Para guardar", não a oficina, e por isso não é o caso aceito pelo projeto. Em seguida a p. 19 tem cerca de 60% em branco antes da oficina (esse, aceito).'
    correcao: 'Deixe o "Para guardar" quebrar livremente ou encurte o parágrafo final em duas linhas para que ele termine na p. 18; se o motor segura o guardar com o parágrafo anterior, solte essa amarra.'
edicoes_de_linha:
  - 'Cada profissão regulamentada tem um código que trata disso, leia o seu antes de publicar -> Cada profissão regulamentada tem um código que trata disso; leia o seu antes de publicar (vírgula unindo duas orações independentes)'
  - 'Nenhuma combinação de detalhes do campo 06 permite reconhecer alguém, nem a própria pessoa. -> Nenhuma combinação de detalhes do campo 06 permite reconhecer alguém, nem que a própria pessoa se veja como o caso. (o capítulo quer que ela se reconheça no padrão, como "milhares de outras pessoas")'
  - 'Porque o código de ética proíbe citar familiares de pacientes. -> Porque o cheiro do ferro não tinha relação com o aperto. (para um psicólogo, citar a mãe da paciente num texto público pode de fato ferir o sigilo; o distrator não é inequivocamente falso)'
  - 'Numa semana sem pergunta, tentou escrever do zero um texto sobre ansiedade no trabalho -> Numa semana em que nem a amiga nem a lista trouxeram nada, tentou escrever do zero um texto sobre ansiedade no trabalho (no cap. 8, semana sem pergunta já tinha solução: a lista de crenças)'
  - 'que ela passou a usar quando a nota no celular ficou pequena -> que substituiu a nota no celular quando a lista passou de cem linhas'
  - 'Era exatamente o tipo de assunto que valia uma peça -> Era o tipo de assunto que valia uma peça'
  - 'sem expor ninguém (subtítulo, objetivo da oficina, prosa, duas vezes) -> manter no subtítulo; na prosa, variar ("sem que ninguém se reconheça como o caso")'
diagramacao:
  - 'p. 18: cerca de 25% da página em branco no pé; o último parágrafo da prosa quebra em "Lúcia guardou a resposta no caderno," e deixa duas linhas no topo da p. 19. O branco precede o "Para guardar", não a oficina.'
  - 'p. 19: cerca de 60% em branco antes da oficina (aceito pelo projeto: a oficina começa em página nova).'
  - 'p. 13, figura 13.1: a barra "Criada do zero: 180 min, sem terminar" é desenhada cheia, como medida fechada; se possível, termine a barra em traço aberto ou tracejado para marcar que a peça não acabou.'
  - 'p. 23: a ressalva "nunca publicado na semana do atendimento" está em corpo pequeno e cinza, no pé da rede; se a intro não mudar, esta regra precisa subir para o topo da seção (p. 22) em corpo normal.'
  - 'p. 22: resolvido o rótulo "O / RECONHECIMENTO" da r1; o esqueleto na p. 23 cabe inteiro, com 3 linhas para "O caso".'
veredito: 'Capítulo muito melhor que na r1 e perto de aprovado na escrita, mas a regra do calendário, que é a lição deste capítulo, ainda falha na instrução ao leitor ("Publique a peça da oficina" sobre um episódio "da sua semana") e na cena de julho; resolvidos isso, o custo de 72 minutos que volta atrás em relação ao cap. 8 e a ausência do modo da Lúcia, deve passar.'
