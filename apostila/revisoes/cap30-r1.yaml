capitulo: 30
iteracao: 1
notas: {metodo: 8.8, voz: 8.4, originalidade: 8.6, clareza: 8.9, ritmo: 8.8, concretude: 8.6,
        coerencia: 7.6, aplicabilidade: 8.5, impresso: 8.8, honestidade: 8.4}
bloqueadores: []
pontos_fortes:
  - "A imagem das fotos antigas deixadas no fundo do perfil 'como a marca de altura das crianças no batente de uma porta' é própria, memorável e resolve o arco da Renata sem triunfalismo. A cena não apaga o passado nem o celebra: mede a distância."
  - "Honestidade do desfecho coletivo: 'Nenhum dos quatro ficou conhecido fora da própria cidade e da própria área. Nenhum deles tem uma peça com milhões de visualizações, e nenhum deixou de depender, em alguma medida, das indicações de sempre.' Fecha o livro sem prometer resultado e com o critério certo (presença reconhecível, sustentável no pior mês)."
  - "A figura 30.1 vira instrumento de papel: 'Marque a lápis, na linha, onde você estava no dia em que abriu este livro e onde está hoje. A distância entre as duas marcas é o seu resultado, e só você pode medi-la.' Assim o espectro do PWA deixa de ter valores fixos e passa a ser uma estimativa que o próprio leitor faz sobre si."
  - "O autodiagnóstico troca o item 'segundo emprego' do PWA pela linha 6 do termômetro do capítulo 1 (conferida: idêntica, invertida nos dois). Com isso, o livro fecha o círculo com um dado que o leitor já tem escrito."
problemas:
  - criterio: coerencia
    trecho: "às fotos que o sobrinho tinha montado quase sete anos antes"
    por_que: "A linha do tempo se contradiz dentro da própria cena e com os vizinhos. O cap. 1 (e o 9) dá o perfil como montado 'seis anos antes'. Se, como diz o parágrafo seguinte, já há 'mais de dois anos de áudios gravados no carro', o perfil tem pelo menos oito anos, e não 'quase sete'. O mesmo desencontro aparece na Lúcia: 'Um ano antes, ela estava do lado de fora da conversa em que eles circulavam', mas no cap. 17 (setembro) ela já publicava 'havia mais de um ano', e os caps. 22 e 27 somam mais um ano de terças. E 'Este livro acompanhou quatro pessoas por mais de um ano' subestima o que o cap. 24 fixa ('dois anos depois de suspender as publicações da agência'). Além disso, 'mais de dois anos de áudios' não fecha com a Renata do cap. 19, que em setembro tinha áudios 'de junho a setembro' (até janeiro de dois anos depois, dá cerca de um ano e meio)."
    correcao: "Fixar a cronologia a partir do cap. 1 e aplicá-la nos quatro. Sugestão: 'às fotos que o sobrinho tinha montado havia quase nove anos' (ou 'muitos anos antes', sem número); 'Quem chegasse até elas teria passado antes por um ano e meio de áudios gravados no carro'; Lúcia: 'Dois anos antes, ela estava do lado de fora da conversa…'; fecho: 'Este livro acompanhou quatro pessoas por mais de dois anos'. Conferir cada número contra os caps. 17, 19, 22, 24 e 26."
  - criterio: coerencia
    trecho: "Caio vai tirar a foto de uma parede, com o capacete no braço, e escrever cinco linhas sobre o que ela esconde."
    por_que: "A última imagem do Caio no livro junta num só gesto a captura e a peça, na obra em curso. O cap. 20 fixou o contrário: ele escreve as cinco linhas no degrau a partir de uma foto 'de junho, de uma obra entregue em agosto', com autorização assinada na entrega, e 'subiu para a obra do dia, que não tinha nada a ver com a peça'. O cap. 29 (revisado exatamente por isso) usa 'foto do arquivo de obras entregues'. O leitor do último capítulo leva como modelo final a conduta que o livro restringiu (sigilo pelo calendário, cap. 19; autorização, cap. 3). Na mesma linha, 'na quinta seguinte, publicou a foto de um rodapé descolado' fica ambíguo, e o cap. 29 já registrou uma peça 'de janeiro, sobre o rodapé que descola', o que faz esta parecer repetida."
    correcao: "'Caio vai fotografar uma parede, com o capacete no braço, guardar a foto na pasta das que só saem depois da entrega e, numa quinta de outro mês, escrever cinco linhas sobre o que ela esconde.' E na cena: 'publicou uma foto do arquivo, de um batente de peroba de uma obra entregue em setembro, com cinco linhas.'"
  - criterio: concretude
    trecho: "Para quem passou mais de vinte e cinco anos dizendo a clientes que o que não está escrito não existe, a linha nova era menos uma garantia do que um costume."
    por_que: "A máxima contradiz o personagem e o direito do trabalho que o livro já mostrou. A marca de Otávio é 'contrato assinado não é prova de nada', e o cap. 6 abre com a lição de que 'cartão de ponto com horário sempre igual perde para quem conta o dia como ele foi', ou seja, a primazia da realidade. Um advogado trabalhista não ensinaria ao pequeno empresário que o que não está escrito não existe; ensina que o escrito só vale se bater com o que aconteceu. Um especialista da área tropeça aqui. Além disso, 'menos uma garantia do que um costume' não se entende: costume de quê?"
    correcao: "'Para quem passou vinte e cinco anos dizendo a clientes que contrato assinado não é prova de nada, a linha nova valia menos pelo papel do que pelo que já acontecia desde abril.' Ou cortar a frase: a anterior ('A regra valia desde abril, na folha de fluxo; agora estava no contrato.') já fecha o parágrafo."
  - criterio: coerencia
    trecho: "Existe uma dimensão desse trabalho que o livro evitou dizer cedo, para não soar como argumento de venda."
    por_que: "Falso em relação ao próprio livro. O cap. 2 tem como conceito o 'Custo da ausência' ('a ausência é preenchida por quem tem menos preparo e mais disposição') e define 'Ocupação de território' com a mulher do protocolo de vinte e um dias. A seção repete essa ideia ('alguém ocupa o lugar dele… Muitas vezes é alguém que explica pior, com mais confiança') como se fosse inédita. A frase também é narrador que anuncia (lição cap01-r1)."
    correcao: "Abrir pela remissão, com ganho novo: 'O capítulo 2 mostrou quem ocupa o espaço que o especialista deixa vazio. Trinta capítulos depois, dá para dizer a outra metade: o mercado não consegue recompensar um conhecimento que não consegue perceber.' Cortar 'Às vezes é um colega bem preparado… de comparar', que já está no cap. 2."
  - criterio: voz
    trecho: "O que tinha mudado era outra coisa."
    por_que: "A primeira seção inteira anda na mesma fórmula: 'X continuou; o que mudou foi Y'. Renata: 'Os dois ortopedistas continuavam mandando… O que tinha mudado era outra coisa.' Otávio: 'O tempo dele não mudou.' Lúcia: 'Os rótulos continuavam chegando ao consultório, e continuariam. O que mudou foi o lugar de onde Lúcia os recebia.' Fecho: 'Nenhum dos quatro ficou conhecido… O que os quatro têm é mais modesto'. Some-se a densidade de antíteses nas outras seções, acima do teto de uma por seção (lição cap01-r1). Em 'Os próximos noventa dias': 'e não pela variedade', 'e não o entusiasmo das boas', 'O plano não exige semanas perfeitas; exige que a sequência não quebre'. Em 'O espaço': 'Ocupar o território não pede que você fale de tudo… Pede que', 'tem menos de vaidade do que de distribuição'. O lint para em 3 ', e não', mas o tique está espalhado."
    correcao: "Manter a fórmula só na Lúcia, onde o ganho é maior. Renata: cortar 'O que tinha mudado era outra coisa.' e emendar: 'Pela primeira vez em mais de quinze anos de consultório, havia também uma segunda porta…'. Noventa dias: 'É quando o hábito se instala, pela repetição.'; 'O critério é o que aconteceu nas semanas ruins.'; 'O plano admite semanas fracas, desde que a sequência não quebre.' Território: 'Ocupar o território é estar presente, no pedaço da sua área em que você é bom de verdade, com uma voz que ninguém confunda…'"
  - criterio: aplicabilidade
    trecho: "Volte às oficinas dos capítulos 19 a 21, começando pela linha mais baixa entre 2, 3 e 7. São elas que instalam o sistema."
    por_que: "A faixa só trata três das oito linhas. Quem soma 8 a 20 com as linhas 1, 4 e 5 no chão (linguagem, posições, voz: caps. 10 a 12) é mandado ao sistema, que não resolve o que falta. O título 'Construído, ainda não instalado' afirma algo que a escala não mede: com tudo em 2, nada foi necessariamente construído (lição cap01-r4). Falta também a instrução para quem ainda não publica: as linhas 3 e 5 ('O que eu publico…') não têm resposta para esse leitor, e o cap. 1 tinha ('Sem perfil?…')."
    correcao: "Faixa 8–20, título 'Ainda em construção', leitura: 'Volte à oficina ligada à sua linha mais baixa: 1 → cap. 12; 2 → cap. 19; 3 → caps. 20 e 21; 4 → cap. 10; 5 → cap. 11; 6 → caps. 1 e 7; 7 → cap. 14; 8 → cap. 29.' Na instrução: 'Se ainda não publicou, responda às linhas 3 e 5 pelo que já está escrito no caderno para publicar.'"
  - criterio: metodo
    trecho: "Se é o tipo de conversa que interessa a você, é isso que eu vou continuar dizendo por aqui."
    por_que: "A última linha do roteiro faz o que o 'Evite' da mesma página proíbe ('Agradecer, prometer conteúdo ou pedir que as pessoas interajam') e fala do canal ('por aqui'), o que a lição cap01-r1 veda no roteiro. Também não entrega o 'Para quem' que o esqueleto pede ('A quem essa conversa serve, dito uma vez'): diz o que o autor vai fazer, e não a quem serve."
    correcao: "'Isso serve a quem {para quem: a situação de quem ouve, por exemplo, tem uma pequena empresa e usa banco de horas}.'"
  - criterio: concretude
    trecho: "Eu defendo que ninguém precisa cortar o pão para emagrecer, e isso já me custou pacientes que queriam uma lista de proibidos."
    por_que: "Uma nutricionista não diria 'ninguém': há quem precise cortar (doença celíaca, sensibilidade ao glúten, alguns quadros de diabetes mal controlado). O absoluto é o tipo de erro técnico que o livro manda evitar, e aproxima a frase de promessa de resultado ('para emagrecer'), numa oficina cujo critério e a nota da rede cobram 'conduta e critério'."
    correcao: "'Eu defendo que cortar o pão não é condição para emagrecer, e isso já me custou pacientes que queriam uma lista de proibidos.'"
  - criterio: honestidade
    trecho: "A maior parte das pessoas que abre um livro como este descreve o próprio problema numa frase parecida com \"preciso postar mais\"."
    por_que: "Generalização sobre terceiros sem fonte (lições cap02-r1 e cap01-r4). Com 'Muitas vezes é alguém que explica pior' e 'Em muitas profissões, saber deixou de bastar', passa do teto de duas. Na mesma linha: 'Uma presença reconhecível que custa mais do que você pode pagar dura três meses' dá como regra um número que é imagem; e a nota do autodiagnóstico ('a distância mais importante do livro diminuiu') atribui à linha 6 a medida da assimetria, que ela não mede (ela mede o medo de virar outra pessoa, cap. 1)."
    correcao: "'Se você abriu este livro pensando que precisava postar mais, já não descreve o problema assim, se o método funcionou…'; 'Muitas vezes' -> 'Às vezes é alguém que explica pior'; 'dura três meses' -> 'dura até o primeiro mês ruim'; nota: 'Se lá você concordou com ela e hoje discorda, o medo que o capítulo 1 nomeou diminuiu.'"
  - criterio: coerencia
    trecho: "Acrescentou uma linha, redigida à mão antes de mandar digitar: as peças partem dos textos do advogado, e nenhuma sai sem a última frase dele."
    por_que: "Metade da linha já estava no contrato novo de abril: o cap. 24 diz 'O contrato novo começa por outra frase: a partir do material escrito enviado pelo cliente'. O que era novo, a última frase, estava no manual ('como sétima linha'). O leitor atento vê a agência assinar duas vezes a mesma coisa. Também 'venceu em janeiro' um contrato fechado em abril pede uma palavra de explicação."
    correcao: "'No Recife, o contrato com a agência chegou à primeira renovação em janeiro, e Otávio só acrescentou uma linha, a sétima do manual, redigida à mão antes de mandar digitar: nenhuma peça sai sem a última frase dele, palavra por palavra.'"
  - criterio: coerencia
    trecho: "Renata de fato não tinha disciplina para o carrossel"
    por_que: "Concede o diagnóstico que o cap. 5 ('Constância não é disciplina') desmonta: o 23º dia foi atrito de formato, e não falta de disciplina. A frase quer dizer que a queixa descrevia algo real, mas diz que ela não tinha disciplina."
    correcao: "'Renata de fato parou no vigésimo terceiro dia do carrossel, e Caio de fato não tinha tempo para editar vídeo.'"
  - criterio: originalidade
    trecho: "Renata rolou o próprio perfil até o fim."
    por_que: "O gesto já é imagem registrada do cap. 23 ('Renata rola o perfil à noite e descobre o problema'; 'Rolou as últimas trinta publicações'). Como eco deliberado no último capítulo, pode funcionar, mas o texto não o marca, e a lição cap02-r1 pede que nada se repita sem ganho explícito. A rolagem também pula a fase da Bianca (carrosséis e frases sobre fundo azul, cap. 23), que estaria no caminho até as fotos do sobrinho."
    correcao: "Assumir o eco: 'Renata rolou o próprio perfil até o fim, como tinha feito numa noite de março, mas desta vez de manhã e sem pressa.' E incluir a camada do meio: 'Passou pelo áudio da meia, pelos carrosséis da primavera em que quase deixou de se reconhecer, pelo contraponto sobre a postura correta…'"
edicoes_de_linha:
  - 'quase a metade do que publicava no tempo do "Você sabia?" -> pouco mais da metade do que publicava no tempo do "Você sabia?" (8 de 15 passa da metade)'
  - "junto com o estabilizador antigo -> junto com o estabilizador e a luz que tinham sobrado (no cap. 29 as luzes já foram vendidas; 'antigo' sugere um estabilizador novo)"
  - "Vale fazer a tradução com a sua própria frase. -> Faça a tradução com a sua própria frase."
  - "Um formato que não cabia no tempo, mais do que a falta dele -> Um formato que não cabia no tempo que havia"
  - "A declaração do campo 02 foi escrita para ser publicada, e fala da sua área, e não do seu processo. -> A declaração do campo 02 foi escrita para ser publicada e fala da sua área, sem mencionar o seu processo."
  - "Com 7 pontos ou mais, você fechou os trinta capítulos. Com menos, volte à oficina antes do plano de noventa dias. -> Com menos, complete os campos que faltam antes do primeiro dia do plano. (o plano é o campo 03 da própria oficina)"
  - "Repetição do formato-base, no ritmo assumido. -> Repetição do formato-base, no ritmo assumido, sem nenhum formato novo. (a correta é visivelmente a mais curta das quatro)"
  - "a sequência não quebre. -> a sequência não se quebre."
diagramacao:
  - "p. 14: cerca de um terço da página em branco depois de 'A queixa antiga, relida agora, costuma mostrar o que ainda falta.'; o box Conceito vai inteiro para a p. 15. Não é caso aceito (não é oficina, autodiagnóstico nem esqueleto). Deixar o box quebrar entre definição e 'Por que importa', ou puxar para a p. 14 o parágrafo 'A definição tem duas metades…'."
  - "p. 14, tabela 30.1: a primeira coluna é estreita demais e parte os nomes das fases ('I · O / Diagnóstico', 'II · A / Descoberta', 'III · A / Tradução'), enquanto 'IV · O Sistema' cabe numa linha. Alargar a coluna ou usar só o numeral e o nome curto ('I Diagnóstico')."
  - "p. 15: cerca de 20% em branco no pé, porque a figura 30.1 não coube e foi para a p. 16. É aceitável, mas some se a correção da p. 14 puxar texto para cima."
  - "Os PNG de QA em apostila/saida/qa/cap30 são de 12:35, anteriores à última versão do manuscrito (20:47): a p. 12 ainda mostra 'um ano de áudios' e 'renovou com uma cláusula a menos'. Esta revisão usou uma renderização nova da versão atual, que tem a mesma paginação. Regerar os PNG antes do QA final."
veredito: "Um fecho digno, com imagens próprias e sem promessa, mas a cronologia dos quatro, a última imagem do Caio e a máxima do Otávio contradizem capítulos anteriores, e o autodiagnóstico ainda manda todo leitor fraco ao mesmo lugar: precisa de uma passada de coerência antes de fechar o livro."
