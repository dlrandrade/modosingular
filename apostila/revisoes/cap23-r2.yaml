capitulo: 23
iteracao: 2
notas: {metodo: 9.3, voz: 9.2, originalidade: 9.1, clareza: 9.2, ritmo: 9.3, concretude: 9.5,
        coerencia: 8.9, aplicabilidade: 9.0, impresso: 9.0, honestidade: 9.4}
bloqueadores: []
pontos_fortes:
  - 'Quase tudo o que a r1 apontou foi resolvido. A frase do alarme agora tem uma forma só, e a continuação "alarme a gente investiga antes de desligar" retoma o cap. 7 sem inventar nada. O manual de voz do cap. 11 entrou na cena ("prendeu a folha no monitor da recepção, onde Bianca trabalhava"), na figura e no campo 05. A rede ganhou peça própria, sobre a decisão do atendimento, com o roteiro do PWA. O paciente de junho chega "mandado por um dos ortopedistas", o que não contradiz o cap. 26.'
  - 'A cena de abertura põe a culpa na aprovação, sem transformar Bianca em vilã: "posso agendar?" / "pode", "enviada do corredor, com o próximo paciente já na maca". A solução nasce da própria cena ("cada áudio passaria a terminar com uma frase dita por ela: a ideia desta peça é"), e o alívio da Bianca é um ganho narrativo que o leitor não esperava.'
  - 'A distinção entre cortar e reescrever ("Cortar é tirar do áudio o então, o né, a frase que começou e não terminou") é operacional, própria e fácil de repetir. A mesma regra aparece na tabela, na figura, na verificação e no gabarito.'
  - 'O fecho é contido e cumpre o que promete: Marcos "Não falou do perfil, e Renata não perguntou", e o capítulo termina com Renata perguntando pelas manhãs do paciente novo. O lint dá zero frase-soco e zero travessão.'
problemas:
  - criterio: coerencia
    trecho: 'Dos três formatos que Bianca tirava de cada áudio, dois continuaram: o texto transcrito e o vídeo com a própria voz de Renata e legenda.'
    por_que: 'Na p. 12, os três formatos eram "um carrossel, uma frase de destaque sobre fundo azul e um vídeo curto com legenda animada". "O texto transcrito" não estava entre eles. O leitor não sabe se o carrossel acabou, e nesse caso a conta seria 2 áudios x 1 formato, ou se ele passou a trazer o texto dela. É justamente o formato do "carrossel do travesseiro" que o capítulo usa como prova do estrago, e a pergunta sobre o destino dele fica sem resposta.'
    correcao: '"Dos três formatos que Bianca tirava de cada áudio, dois continuaram: o carrossel, agora com as frases da transcrição e nenhuma outra, e o vídeo com a própria voz de Renata e legenda."'
  - criterio: originalidade
    trecho: 'Não havia nada de errado em nenhuma das peças, e era isso que mais incomodava. Estavam corretas, bem organizadas e bonitas.'
    por_que: 'É a mesma batida do cap. 4 ("Não havia nada de errado ali. Faltava tudo o que ele diria." / "Nenhuma estava errada, e ele aprovava todas"), que o cap. 24 retoma ("achava que não havia nada de errado. Não havia mesmo."). Dar à Renata a fórmula do Otávio faz os arcos soarem iguais, contra a lição cap02-r1 (nenhuma cena ou imagem se repete entre capítulos). O que é novo aqui é outra coisa: desta vez o material era dela. Somado ao "aprovar sem ler", também parente do "aprova tudo" do Otávio, o leitor atento pode ter a impressão de estar relendo o cap. 4.'
    correcao: 'Abrir o parágrafo pelo gesto da Renata: "Renata procurou uma frase para corrigir e não achou. O que faltava não cabia numa correção: a pergunta sobre as manhãs, o paciente do carrinho de supermercado, a desconfiança do exame que não combina com a queixa." O resto do parágrafo fica como está, porque é no "Dessa vez, feito a partir da voz dela" que mora a diferença em relação ao Otávio.'
  - criterio: clareza
    trecho: 'No caso da Renata, as quatro tinham saído das mãos dela sem que ninguém decidisse isso. A ideia de cada peça passou a ser escolhida por Bianca, a partir de trechos dos áudios, e o critério foi o primeiro a cair na edição'
    por_que: 'O texto diz "as quatro", mas só mostra três: a ideia (aqui), o critério (aqui) e a fala (no parágrafo seguinte, com a reescrita). A opinião não aparece em lugar nenhum, e o gabarito repete a lacuna ("A ideia de cada peça, o critério e a própria fala"). Como a Renata continuou gravando os áudios, o leitor apressado pode concluir que ao menos a fala e a opinião ficaram com ela, o que enfraquece a regra dos quatro.'
    correcao: 'Mostrar a quarta com um detalhe: "A ideia de cada peça passou a ser escolhida por Bianca, a partir de trechos dos áudios; a opinião virou conselho ("durma de lado", "escolha o travesseiro certo"); e o critério foi o primeiro a cair na edição, porque era a parte mais difícil de caber numa arte." No gabarito 01: "A ideia, a opinião, o critério e a própria fala passaram a ser escolhidos ou reescritos por outra pessoa…".'
  - criterio: aplicabilidade
    trecho: '1. Ter a ideia; 2. ter a opinião; 3. falar ou rascunhar; 4. decidir o critério. Uma linha para cada, com o seu nome no fim.'
    por_que: 'O campo 02 é o centro da oficina ("como cada uma acontece no seu modo") e é o único sem modelo. O exemplo só repete a lista da tabela, e o leitor tende a escrever "Ideia: eu" quatro vezes, que foi exatamente o que a r1 criticou na grade. Isso passa no critério "tem o seu nome" e não produz a descrição no modo que o próprio critério exige. Os campos 01, 03 e 04 também não trazem exemplo de profissão (estrutura_do_capitulo: "Exemplos dos campos sempre em profissões variadas").'
    correcao: 'Exemplo do campo 02 em profissão nova: "Uma nutricionista que pensa respondendo: 1. A ideia sai das perguntas da semana, anotadas no caderno. Eu. 2. A opinião é a que eu daria à paciente que perguntou. Eu. 3. Respondo em voz alta, como na consulta. Eu. 4. O critério é o que eu observo antes de mudar um plano. Eu." Campo 04: "Um engenheiro estrutural: “Pode formatar e agendar. Qual trinca eu comento e o que ela quer dizer, isso fica comigo.”"'
  - criterio: aplicabilidade
    trecho: 'Um contador: “Quinta, antes de agendar, com o manual ao lado: eu diria esta frase a um cliente, na minha mesa, com esta palavra?”'
    por_que: 'O rótulo pede "contra quais linhas do seu manual de voz", e o critério cobra que a revisão "usa linhas do seu manual de voz", mas o exemplo não cita nenhuma linha de manual. É a pergunta da Renata com "cliente" no lugar de "paciente". Quem seguir o modelo ao pé da letra não cumpre o critério.'
    correcao: '"Um contador: “Quinta, antes de agendar, frase por frase, contra as regras 2 e 4 do meu manual: eu dou o número antes da opinião; eu nunca uso sigla sem abrir. E a pergunta: eu diria isto a um cliente, na minha mesa?”"'
  - criterio: coerencia
    trecho: 'Bianca não escolheria mais o assunto. Transcreveria o áudio inteiro, cortaria as repetições e as hesitações, e não trocaria nenhuma palavra.'
    por_que: 'O cap. 24 resolve o problema do Otávio com o mesmo mecanismo, quase com as mesmas palavras: "A agência digitaria sem trocar nenhuma palavra, conferiria com as regras", e Helena pergunta "quem escolhe o que vai ser publicado?". O parágrafo "A ordem natural da ajuda começa pelo mais mecânico" também avança sobre o tema do cap. 24 ("Quando e como delegar"). Como o cap. 23 vem antes, a solução é dele. Mas os dois capítulos seguidos precisam de ângulos distintos, ou o leitor lê a mesma virada duas vezes.'
    correcao: 'No cap. 23, manter o eixo na revisão e na peça de controle, que são exclusivos dele, e reduzir "A ordem natural da ajuda…" a uma frase ("Se um dia passar alguma coisa adiante, comece pela transcrição; o corte vem por último, porque é onde se escorrega para a reescrita"). Registrar em ESTADO.yaml as soluções "o assunto é dito no fim do áudio" e "transcrever sem trocar palavras" como do cap. 23, para que o cap. 24 dê destaque ao escopo do contrato, aos quatro sinais de prontidão e à cláusula da semana vazia.'
  - criterio: voz
    trecho: 'Há etapas da produção que são mecânicas, e ganham com mais gente e mais processo. Há outras que são o próprio conteúdo, e deixam de existir quando passam para outras mãos.'
    por_que: 'A seção "O que escala e o que não escala" tem um título antitético e três antíteses explícitas: "Nenhuma delas, sozinha, apagava a Renata. Somadas…", este par "Há etapas… Há outras…" e "Cortar e reescrever parecem vizinhos e fazem coisas opostas… O corte cabe… A reescrita…". A lição cap01-r1 permite uma por seção. A de cortar/reescrever é a que ensina, então é ela que fica. O mesmo parágrafo tem ainda dois conectores de curso: "Diante disso, a pergunta útil é" e "Na tabela a seguir" (a sinalização contada pelo lint).'
    correcao: 'Fundir o segundo parágrafo sem o par: "Em algum momento, quem começa a dar certo precisa de mais volume, ou de ajuda para sustentá-lo, e aí a pergunta passa a ser o que pode crescer e o que precisa continuar nas suas mãos." Trocar "Na tabela a seguir, as quatro primeiras linhas são as que o livro inteiro ajudou você a encontrar" por "As quatro primeiras linhas da Tabela 23.1 você já encontrou:".'
  - criterio: honestidade
    trecho: '{nome: "Com as quatro etapas preservadas", pontos: [70, 76, 79, 80], destaque: true}'
    por_que: 'A curva preservada sobe com o volume, e o esquema passa a dizer que publicar mais aumenta a diferença percebida. O texto não defende isso: diz só que "Volume não apaga uma voz". Mesmo rotulado como ilustrativo, o esquema sugere um efeito que ninguém argumentou. O título também tropeça: "o que cai é a voz delegada" dá a entender que cai a voz, quando o que cai é a diferença.'
    correcao: 'Curva quase plana ([72, 74, 74, 75]) e título "Com a voz preservada, o volume não apaga a diferença". No box, trocar o título "A culpa costuma cair no lugar errado" (generalização) por "A culpa cai no lugar errado". Trocar "e a pessoa reduz o volume sem mudar o que de fato estava errado" por "e o remédio óbvio, cortar o volume, deixaria intacto o que de fato estava errado".'
  - criterio: aplicabilidade
    trecho: 'Uma dermatologista: “A decisão de biopsiar ou não uma pinta, eu não passo a ninguém.”'
    por_que: 'Indicar biópsia já é ato privativo de médico. Sem uma qualificação, a frase soa como virtude que a lei impõe (lição cap10-r2). A posição só existe se a praça faz diferente, por exemplo quando o retorno é atendido por outra médica ou pela residente.'
    correcao: '"Uma dermatologista: “Quem decide se uma pinta vai para biópsia sou eu, mesmo no retorno que outra colega da clínica poderia atender.”"'
edicoes_de_linha:
  - 'Um modelo de arte que decide o tamanho de cada frase -> Uma arte pronta que decide o tamanho de cada frase (evita "modelo" duas vezes, em sentidos diferentes, com "um modelo de pedido" duas frases depois)'
  - 'obtido quando crescem as etapas mecânicas, como transcrever, formatar e distribuir -> obtido quando se amplia a parte mecânica, como transcrever, formatar e agendar (etapa não cresce; "agendar" é o termo da tabela)'
  - 'No fim de abril, Marcos voltou ao consultório. -> Em meados de abril, Marcos voltou ao consultório. (o cap. 26 diz que a nova rotina foi "combinada em abril", e a reunião é na "segunda-feira seguinte")'
  - 'Diante disso, a pergunta útil é -> (cortar; ver problema de voz)'
  - 'que são justamente os dois lugares em que a presença dela importa -> os dois lugares em que a presença dela importa'
  - '- O tipo de arte que a assistente escolheu para as peças. -> - A troca do consultório por uma assistente na recepção. (hoje o distrator é parcialmente verdadeiro, porque a arte de frase isolada saiu justamente por ser inadequada)'
diagramacao:
  - 'p013: continua com cerca de 1/5 da página em branco no pé, porque a Tabela 23.1 não cabe e vai para a p014 (a r1 já tinha apontado). Colocar o parágrafo "Cortar e reescrever parecem vizinhos…" antes da tabela enche a p013. O texto se sustenta nessa ordem, e o box Conceito vem logo depois da tabela.'
  - 'p015: cerca de 5 linhas em branco no pé antes do intertítulo "A arquitetura que protege o rosto", que foi para a p016 junto com o primeiro parágrafo. É aceitável. Se a correção da p013 mover o fluxo, conferir de novo.'
  - 'p012: o hífen quebra um nome próprio ("Insta-/gram da fisioterapeuta"). Proibir hifenização em nomes de marca (hyphens: manual no termo, ou &shy; desativado).'
  - 'p013, linha 5: linha viúva com uma palavra só ("dela."). Um ajuste mínimo no parágrafo resolve, por exemplo "Dessa vez, feito com a voz dela."'
  - 'p020: o campo 03 pede três informações por linha (etapa, quem faz hoje, quem pode fazer um dia) em linhas corridas. Uma grade de três colunas de pelo menos 45 mm facilitaria a escrita e a conferência do critério "cada uma tem quem faz".'
veredito: 'Revisão bem-sucedida, com a média estimada em 9,2. O capítulo passa no gate depois de três ajustes: corrigir os formatos que "continuaram" e não existiam, mostrar como a opinião saiu das mãos da Renata e dar modelo em profissão variada aos campos 02 e 05 da oficina.'
