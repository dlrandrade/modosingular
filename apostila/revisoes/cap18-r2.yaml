bloqueadores: []
pontos_fortes:
  - "O bloqueador da r1 foi resolvido com elegância: o risco elétrico saiu da bifurcação e virou contraste pedagógico ('Aceitou trocar o quadro e a fiação sem discutir: isso era segurança, e ali não havia régua, havia norma.'). A cena ganhou uma distinção que o leitor leva para a própria área: norma e protocolo de um lado, régua do outro."
  - "Agora o modo do Caio aparece na cena central, com ofício e humor seco: 'Teve uma obra em que o hóspede também não ia abrir a parede, e a infiltração abriu sozinha, no segundo verão, em cima da cama de casal.' O dilema material continua concreto (a sala, o estagiário, a ata do sócio como 'uma forma de dividir a culpa')."
  - "O parágrafo dos quatro tipos cobre agora os quatro de verdade, com um critério legal e discutível para o Otávio ('quando a empresa tem o controle de ponto documentado, ele defende até a sentença') e uma mini-cena da Lúcia que mostra o custo de dizer a régua de parada ('Tinha medo de que um paciente novo ouvisse \"eu proponho encerrar\" como \"eu vou mandar você embora\".')."
  - "O exemplo do ortopedista (menisco degenerativo acima dos quarenta, fisioterapia primeiro, exceção do joelho que trava) é tecnicamente correto e percorre as quatro partes numa área distante da arquitetura. As formulações próprias continuam fortes: 'são a ausência dela dita com educação'."
problemas:
  - criterio: metodo
    trecho: "há quem trate o que aparece e deixe o resto para depois, e há quem abra o que precisa ser aberto antes de fechar."
    por_que: "A bifurcação e a régua do caso-modelo estão em eixos diferentes. A bifurcação opõe ADIAR a ABRIR. A régua ('se a obra vai esconder de quem vem depois um problema que eu vi, eu não faço') trata de ESCONDER ou INFORMAR. O limite confirma que o eixo é o segundo: a obra rápida da senhora teria sido aceitável porque 'ela pretendia informar o comprador de tudo'. Pela régua do próprio Caio, adiar com aviso é aceitável. Então a régua não escolhe entre os dois ramos que a bifurcação nomeou. É justamente o caso que o leitor vai copiar na oficina, e o modelo ensina a montar uma régua que não responde à bifurcação."
    correcao: "Alinhe as quatro partes no eixo do aviso. Bifurcação: 'depois de resolvido o que é segurança, há quem feche o que viu e deixe o aviso por conta do dono, e há quem abra antes de fechar'. Régua: 'se ninguém que vai usar o espaço depois vai saber do problema que eu vi, eu abro antes de fechar, ou não faço a obra'. Assim o limite (a senhora que ia contar ao comprador) mostra exatamente onde a condição falhou. Ajuste também a frase da recusa no parágrafo 21 para o mesmo eixo."
  - criterio: coerencia
    trecho: "Uma contadora: “Para empresa com um sócio só e faturamento pequeno, há o regime que paga menos este ano e o que aguenta o crescimento.”"
    por_que: "O cap. 17, capítulo vizinho, usa um contador no mesmo lugar (exemplos da oficina) e com a mesma ideia: 'Quem abre MEI para economizar e cresce no segundo ano chega aqui com o limite estourado'. O limite da contadora do cap. 18 ('Errei com um cliente que dobrou de tamanho em seis meses') é quase a mesma observação. Isso fere duas lições: profissões de figurantes não se repetem em capítulos vizinhos, e nenhuma imagem se repete entre capítulos. O exemplo também fica vago ('o regime'), sem dizer a régua inteira."
    correcao: "Troque a profissão do fio da oficina por uma ainda livre e distante da construção. Uma sugestão é uma veterinária, com critério de escolha: 'Para cão idoso com tártaro e sopro leve, há a limpeza com anestesia agora e o controle em casa por mais seis meses.' / 'Eu indico a anestesia quando os exames de sangue e do coração estão dentro do esperado para a idade.' / 'Errei com um cão cujo sopro piorou entre o exame e a data marcada; hoje refaço a avaliação do coração se passar de um mês.' Confira em ESTADO.yaml › figurantes e registre."
  - criterio: aplicabilidade
    trecho: "  - rotulo: \"O que cada caminho custa\"\n    exemplo: \"Tempo, dinheiro, risco, possibilidade de voltar atrás. O custo informa mais do que o benefício.\""
    por_que: "O exemplo da profissão de apoio acompanha os campos 02, 04 e 05 e some justamente no 03, a parte que o capítulo chama de mais informativa. Quem é de outra área fica sem modelo do custo escrito para os dois lados. O campo 02 também não pede a situação ('em que ponto do seu trabalho'). Sem ela, a bifurcação vira abstrata, e o roteiro repete o problema ('Nesse ponto do meu trabalho, existem dois caminhos'), porque ninguém que ouve sabe que ponto é esse."
    correcao: "No campo 03, dê a mesma profissão de apoio com os dois custos ('A limpeza agora custa o risco da anestesia; esperar custa dor e dente perdido.'). Mude o rótulo do 02 para 'A situação e as duas saídas, as duas defensáveis'. Comece o roteiro por 'Quando {a situação típica da sua área}, existem dois caminhos, e os dois são defensáveis: …'. No esqueleto, troque 'Os dois caminhos, ditos com justiça.' por 'A situação e os dois caminhos, ditos com justiça.'"
  - criterio: metodo
    trecho: "Em saúde e direito, deixe claro que a régua é a sua forma de decidir, e que cada caso pede avaliação própria."
    por_que: "A nota manda fechar a peça com a mesma fórmula que o capítulo condena: 'Preferências vagas, como \"depende de cada caso\" ou \"avalio individualmente\", não são régua; são a ausência dela dita com educação'. O quadro Evite também traz '“Depende de cada caso” como resposta final'. O leitor de saúde recebe duas instruções que se contradizem. Psicologia é área regulamentada e fica implícita."
    correcao: "'Uma régua por peça. Em saúde, psicologia e direito, diga que ela mostra como você decide, e que não substitui a avaliação de quem lê por um profissional.'"
  - criterio: concretude
    trecho: "Bastava pintar a parede manchada, deixar a prumada de ferro como estava e colocar um piso vinílico por cima do taco solto."
    por_que: "Detalhe de ofício inexato no caso central. A prumada é tubulação vertical de área comum. Trocá-la, ou mesmo o trecho dela dentro da unidade, depende do condomínio, e o próprio Caio sabe disso no cap. 14 ('ninguém derrubaria nada antes de ele ver a planta do prédio e conversar com o síndico'). Adiar a prumada não é decisão do investidor, e 'o dono assume esse risco' não vale para ela. Ela também aparece sem ter sido encontrada: o parágrafo das descobertas não a menciona."
    correcao: "Troque por algo da unidade: 'deixar os ramais de ferro galvanizado do banheiro como estavam'. Inclua-os na lista do parágrafo 13 ('Os canos de ferro do banheiro, com a água saindo amarelada no primeiro minuto'). No parágrafo 68, troque 'adiar a infiltração e a prumada' por 'adiar a infiltração e os canos'."
  - criterio: coerencia
    trecho: "Duas semanas depois, um casal que tinha comprado um apartamento de 1958 no Bosque escreveu pedindo orçamento. A mensagem terminava com uma frase que ele guardou: \"Queremos a obra que não esconde.\""
    por_que: "Três ressalvas. O cliente que chega citando um texto do Caio é o ponto de chegada reservado ao cap. 25 (a mulher que traz impresso o texto das janelas 'catorze meses antes', que Caio tinha achado 'um fracasso'). Gastá-lo aqui, com retorno em duas semanas, tira a surpresa daquele capítulo e soa como promessa de resultado rápido. A cena não mostra como o casal chegou ao texto (lição cap03-r3). E o cap. 17 também fecha com alguém que leu a peça e reagiu: são duas batidas iguais seguidas."
    correcao: "Feche sem resultado comercial. Mantenha a visita, mas com um casal que chegou por indicação e que Caio trata pela régua: ele aponta a parede da cozinha, diz que só fecha o orçamento depois de abrir e explica por quê. A consequência prática fica no gesto, não no retorno da peça. Se quiser manter o texto como origem, diga como o casal o encontrou (um vizinho do prédio mandou o link) e tire a frase citada, que antecipa o cap. 25."
  - criterio: honestidade
    trecho: "Muitos colegas bons fazem o primeiro."
    por_que: "Generalizações sobre terceiros continuam bem acima do limite de duas: 'isso vale para quase todas as áreas em que um especialista atende um leigo'; 'Raramente repete a técnica'; 'quase ninguém a publica'; 'essa é, muitas vezes, a informação que decide a escolha entre dois especialistas igualmente competentes'; 'Muitos colegas bons fazem o primeiro'; 'que quase sempre crescem'; 'muitas vezes são os clientes que dariam problema depois'; 'quem lê percebe a diferença na hora'."
    correcao: "Fique com duas no máximo. 'Muitos colegas bons fazem o primeiro' -> 'Caio conhece colegas bons que fazem o primeiro.' 'que quase sempre crescem' -> 'que nas obras dele crescem'. Corte 'e essa é, muitas vezes, a informação que decide…' e termine em 'acima do próprio faturamento.' Corte 'e isso vale para quase todas as áreas…' (o parágrafo 31 já generaliza). 'e quem lê percebe a diferença na hora' -> 'e deixa de ser critério'."
  - criterio: metodo
    trecho: "O de Renata, no capítulo 1, era de encaminhamento: a rigidez que melhorava com o movimento a fez mandar Marcos ao reumatologista antes de qualquer exercício."
    por_que: "Dor lombar pior ao acordar e que melhora com o movimento é sinal clássico de lombalgia inflamatória. Encaminhar ali está mais perto de protocolo do que de bifurcação, e o capítulo acabou de dizer que 'protocolo não é régua' e que uma saída 'claramente pior' não forma bifurcação. Não encaminhar não era defensável."
    correcao: "Diga o que torna aquilo uma escolha: 'O de Renata é de encaminhamento: quando a dor contraria o laudo, ela manda o paciente de volta ao médico antes de começar, mesmo que isso custe o paciente, e com Marcos, no capítulo 1, foi o reumatologista.' Outra saída é buscar um encaminhamento em zona cinzenta, como encaminhar ou não ao psicólogo o paciente cuja dor piora nas semanas de crise em casa."
  - criterio: coerencia
    trecho: "Numa quinta de maio, antes de ter decidido qualquer formato, Caio escreveu a peça à mão no caderno e publicou como um texto curto."
    por_que: "'Escreve à mão antes de digitar' é marca do Otávio no elenco. Dada ao Caio, que pensa contando, borra a fronteira entre os dois, e o cap. 20 diz que o texto sem obra na frente 'não passava no modo' dele. O termo 'régua' também merece uma linha de distinção: no cap. 11 a régua é o manual de voz, e no cap. 12 é o enunciado de cinco perguntas ('A régua'). Aqui ela vira sinônimo de critério."
    correcao: "'Numa quinta de maio, antes de ter decidido qualquer formato, Caio contou a obra do cano em voz alta ao sócio, anotou o que tinha dito e publicou como um texto curto.' Na definição do conceito ou no parágrafo 29, uma oração basta: 'régua, aqui, é o critério de uma decisão, e não o enunciado do capítulo 12'. Ou troque 'régua' por 'critério' nas passagens em que os dois sentidos podem se cruzar."
  - criterio: voz
    trecho: "A régua de parada merece atenção porque quase ninguém a publica."
    por_que: "'merece atenção' é o narrador anunciando. 'Há um cuidado a tomar:' e 'O outro cuidado é' repetem a moldura de curso. Nos boxes ainda há três antíteses com ', e não' ('Mostra pensamento, e não protocolo'; 'Mostra honestidade em ato, e não em discurso'; 'e não só pelas contratações'), que a r1 pediu para reduzir."
    correcao: "'Quase ninguém publica a régua de parada. Dizer \"aqui eu paro\"…'. 'Há um cuidado a tomar: publicar a régua sem expor quem a motivou.' -> 'A régua se publica sem quem a motivou.' Na tabela: 'Mostra como você pensa' e 'Prova honestidade no ato'."
  - criterio: clareza
    trecho: "E, ao escrever, entendeu de onde vinha a terceira pergunta. Três anos antes, Caio tinha recusado uma obra rápida de uma senhora"
    por_que: "O erro com a senhora gera dois ajustes que não se encaixam: a terceira pergunta ('O que vai ficar por fazer, e quem vai saber disso?') e o hábito de perguntar 'por que o prazo é aquele'. O leitor não sabe qual dos dois é o ajuste da régua. A verificação e a peça publicada ficam só com o segundo."
    correcao: "Fique com um só. Se a régua for reescrita no eixo do aviso (problema 1), o ajuste natural é a terceira pergunta: 'Desde então, antes de recusar, pergunta quem vai saber do que ficou por fazer.' Ajuste então a verificação 04 e a frase da peça publicada. Se preferir o prazo, tire 'entendeu de onde vinha a terceira pergunta'."
edicoes_de_linha:
  - "o leitor não precisa entender de fiação para perceber -> o leitor não precisa entender de impermeabilização para perceber (a fiação não fez parte da recusa: o investidor aceitou trocá-la)"
  - "Dois caminhos defensáveis (campos 01 e 02). -> Dois caminhos defensáveis, com o tipo marcado (campos 01 e 02). (hoje o 01 é só o tipo e a ajuda sugere que ele contém a bifurcação)"
  - "“Nesse ponto, existem dois caminhos, e os dois são defensáveis.” (Faça assim) -> “Quando o cliente chega com tal quadro, há dois caminhos, e os dois são defensáveis.” (evita repetir quase literalmente a primeira linha do roteiro)"
  - "Dez dias depois, havia uma caçamba de entulho na porta do prédio perto da rodoviária. -> Dez dias depois, passando pela rodoviária, viu uma caçamba de entulho na porta do prédio. (diz como ele sabe)"
  - "Porque poucos profissionais conhecem esse tipo de critério. -> Porque exige um conselho profissional que o autorize. (o distrator atual fica perto demais de 'quase ninguém a publica')"
  - "Porque a régua já tinha errado com alguém que pretendia contar tudo. -> Porque a régua já tinha errado com uma cliente que ia avisar o comprador. (mais claro fora de contexto)"
diagramacao:
  - "p17: na figura 18.1, os trapézios do funil têm espaços desiguais entre si (o intervalo entre 3 e 4 é visivelmente maior que entre 1 e 2), porque cada linha acompanha a altura do rótulo ao lado. Fixar a altura das faixas e alinhar o rótulo ao centro de cada uma."
  - "p17: a faixa 1 do funil está num bege mais escuro que as faixas 2 a 4, sem função explicada. Em preto e branco, parece uma segunda ênfase que compete com a 5. Uniformizar 1 a 4."
  - "p12: a linha 'fechado.' fecha o parágrafo com uma palavra só, logo antes de 'Recusou o projeto…'. Aceitável, mas some com um ajuste mínimo de texto."
  - "p18: pouco mais de metade da página fica em branco depois do Para guardar, antes da oficina em página nova. Aceito pelo projeto."
  - "p23: dois terços da página em branco depois do checklist, no fim do capítulo, e a p24 fica em branco antes do apêndice em página ímpar. Aceito (fim de capítulo)."
veredito: "O capítulo evoluiu muito e já não tem bloqueador. Mas o caso-modelo ainda ensina uma régua que não responde à própria bifurcação, a contadora repete o contador do cap. 17 e o fecho gasta o retorno reservado ao cap. 25. Uma passada focada nesses três pontos e nas generalizações deve levá-lo acima de 9."
