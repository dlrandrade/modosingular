bloqueadores: []
pontos_fortes:
  - "Quase tudo o que a r3 apontou foi resolvido no lugar certo. A rede agora concorda com a seleção: 'Comece pela frase como as pessoas a dizem, nas palavras delas', 'Se só uma pessoa diria a frase daquele jeito, troque-a pela forma comum', e o esqueleto e o roteiro pedem 'a frase, do jeito que você a ouve'. A saída para o leitor do dia 19 cabe no esqueleto ('use uma crença da sua área que você ouve fora do atendimento: de um parente, de um vizinho, de uma conversa de fila'). A busca de julho fecha ('achava que em julho', 'Julho não tinha o áudio'). A escolha da sexta tem razões verdadeiras ('E o carro é onde está o enunciado e onde ela já grava. O domingo, ela tinha acabado de perder.'). O corredor ganhou o cuidado de sigilo ('no fim do corredor, longe da recepção, e em voz baixa')."
  - "A abertura continua a melhor cena da Fase IV. Tem objeto, custo e reviravolta sem sublinhado: 'gravação 212, gravação 213, gravação 214', 'o caderninho de capa verde que ficava na gaveta do consultório, com anotações a lápis de quando a bateria acabava', 'percebeu que a captura estava funcionando melhor do que nunca'. E fecha em consequência prática, sem moral: 'Cumpriu a regra e não compensou.'"
  - "O capítulo acrescenta ao PWA uma peça real de método e a amarra ao sigilo do cap. 13 sem sermão: decidir não é liberar. A regra aparece igual na figura ('se anota a data em que cada uma pode sair'), no box numerado, no Para guardar, no critério da oficina e no fecho em ação: 'Na sexta, no carro, foi o primeiro da semana a ganhar nome: usar, repouso que piora. Ao lado, ela anotou a data de novembro.' A crença do repouso volta 'com outras palavras' e passa na pergunta 1 por ter aparecido duas vezes, sem que o texto precise dizer isso."
  - "O detalhe de ofício é variado e exato. O ortodontista ('tira o elástico para comer e esquece de pôr. As duas acham que uma noite sem não faz diferença'), a cabeleireira ('Os papéis do balcão, eu passo para lá hoje e jogo fora'), a engenheira agrônoma ('na caminhonete, antes de sair da última propriedade'). O aplicativo da irmã, no lugar do Notion da fonte, transforma um alerta genérico numa cena com custo: 'onde ficaram duas semanas de abril que ela nunca mais abriu'."
problemas:
  - criterio: aplicabilidade
    trecho: "O lugar único do seu caderno, os seus dois gatilhos, o horário da seleção e as duas capturas escolhidas da última semana."
    por_que: "A r3 já apontou isto e o ponto não voltou. A entrega da oficina fixa 'as duas capturas', que é o ritmo da Renata. O campo 05 manda o contrário: 'circule tantas quantas o seu ritmo do capítulo 8 pede'. O leitor lê o 'Ao final, você terá' (p. 20) antes do campo e começa a oficina com um número que não é o dele. O Otávio, a Lúcia e o Caio têm uma peça por semana (cap. 12), e o leitor pode ter uma, duas ou três."
    correcao: "'O lugar único do seu caderno, os seus dois gatilhos, o horário da seleção e as capturas escolhidas para a próxima semana, cada uma com a sua data.'"
  - criterio: coerencia
    trecho: "pulando os do corredor pelo tamanho e demorando nos do carro, que eram longos"
    por_que: "O capítulo impõe à captura um teto de meio minuto. Está nas regras ('vinte segundos por captura, meio minuto no limite'), no Para guardar ('menos de meio minuto [...] Qualquer regra a mais encarece a captura'), na grade da oficina ('Leva mais de 30 s') e no critério. Mas o segundo gatilho da própria Renata, que responde por um quarto do mês, produz áudios 'longos'. A nota da figura 19.2 confirma ('Mais longos, e mais soltos.'), e a busca de domingo depende disso. O texto não explica por que a regra afrouxa no carro. O leitor atento conclui que a personagem-modelo descumpre a regra, ou que o teto só vale no corredor. As duas leituras enfraquecem o critério da oficina."
    correcao: "Diga uma vez, na seção das regras ou dos gatilhos, por que o carro é exceção e qual é o limite dele: 'No carro, parada, ninguém espera, e o áudio pode passar de um minuto. O risco é ele virar rascunho de peça, e por isso ela para quando percebe que começou a explicar.' Ou encurte: 'demorando nos do carro, que eram os mais longos, de quase um minuto', e na figura 'Um pouco mais longos, e mais soltos.'"
  - criterio: coerencia
    trecho: "Havia mais de um ano, Renata gravava quase todo dia, em vinte segundos, sem julgar."
    por_que: "A linha do tempo parece não fechar (lição cap08-r1). A captura de vinte segundos nasce no cap. 6, depois de a Renata reconhecer, no cap. 1, que o perfil não a representava. O cap. 23 situa março e abril do ano seguinte 'Um ano e meio depois de reconhecer que o perfil antigo não a representava'. Isso põe o cap. 1 por volta de setembro ou outubro do ano anterior a este capítulo. Em setembro, portanto, a Renata tem no máximo onze ou doze meses de caderno, e não 'mais de um ano'. Os 'setecentos e poucos áudios' fecham com onze meses no ritmo de agosto (cerca de 65 por mês)."
    correcao: "Confira contra os caps. 1, 8 e 23. Se o cap. 1 está mesmo em setembro ou outubro, troque por 'Havia quase um ano, Renata gravava quase todo dia'. Para evitar a dupla com 'quase todos com o nome', escreva 'Fazia onze meses que Renata gravava todo dia útil'."
  - criterio: ritmo
    trecho: "Renata amarrou a captura a coisas que acontecem todo dia, de modo que o fim de uma puxe o registro sem esforço de vontade. Renata descobriu os seus gatilhos olhando para trás."
    por_que: "A r3 pediu três ajustes nesta seção e nenhum foi feito. (1) Duas frases seguidas abrem com 'Renata', e a seção dá o resultado ('amarrou') antes da descoberta que leva a ele. (2) A prosa repete a nota da figura que está logo acima, na mesma página 16: 'O corredor era o gatilho mais frequente: vinte segundos' repete 'O mais frequente. Vinte segundos antes de chamar o próximo paciente.' (3) A seção fecha numa frase de curso que generaliza sem base: 'Os cinco servem para qualquer ofício que atende gente.'"
    correcao: "Abra por 'Renata descobriu os seus gatilhos olhando para trás. Na segunda semana de setembro, contou [...] e dois momentos respondiam por três de cada quatro.' Deixe o 'amarrou' para o parágrafo da decisão ('Renata ficou com dois gatilhos...'). Na figura, tire as notas das duas primeiras barras, ou comece a prosa por 'O corredor era longe da recepção: ela gravava no fim dele, em voz baixa.' Troque o fecho por uma ponte para a tabela: 'Na sua rotina, os cinco têm outro nome e outra hora.'"
  - criterio: concretude
    trecho: "Volta e meia um encarregado me diz que o capacete atrapalha a ouvir o rádio."
    por_que: "O detalhe de ofício soa estranho a quem é da área. O capacete de segurança não cobre as orelhas. A queixa clássica de canteiro e de fábrica é outra: o protetor auricular 'atrapalha a ouvir o rádio' ou os alarmes. É justamente uma crença em que o técnico de segurança tem algo a dizer (atenuação adequada, protetor com comunicação). Como está, o exemplo do 'Faça assim' ensina a forma certa com um conteúdo que um técnico não reconheceria (lição cap09-r1)."
    correcao: "'Um técnico de segurança do trabalho: “Volta e meia um encarregado me diz que o protetor auricular atrapalha a ouvir o rádio.”'"
  - criterio: aplicabilidade
    trecho: "Se a semana tiver menos de cinco, complete com as do caderno desde o capítulo 6. Passe cada uma pelas quatro perguntas"
    por_que: "Há duas falhas pequenas no campo mais importante da oficina. (1) Não há saída para quem não manteve o caderno desde o cap. 6 e tem zero capturas. A fonte resolvia isso com um dia de uso real ('As capturas de hoje (mínimo 5)', critério 'Capturei sem julgar por um dia inteiro'), e esse teste sumiu. (2) 'as quatro perguntas' e, no campo 03, 'os cinco da tabela' não dizem onde estão. As perguntas estão na p. 18 e a tabela na p. 17. No papel, o leitor volta três ou quatro páginas procurando. A r3 já pediu a remissão."
    correcao: "Campo 05: '...complete com as do caderno desde o capítulo 6. Se o caderno está vazio, capture hoje, sem julgar, até o fim do dia, e faça a seleção amanhã. Passe cada uma pelas quatro perguntas (p. 18)...'. Campo 03: 'Escolha entre os cinco da tabela (p. 17)...'. Ajuste o tempo_nota, se o projeto tiver, para avisar que a seleção pode ficar para o dia seguinte."
  - criterio: clareza
    trecho: "O momento continua o mesmo: o fim de alguma coisa que ia acontecer de qualquer jeito."
    por_que: "A frase é boa, mas desmente a tabela logo acima: só dois dos cinco gatilhos são o 'fim' de alguma coisa (fim de atendimento, volta para casa). A segunda explicação, o incômodo e a surpresa acontecem no meio. O leitor apressado sai com uma regra ('capture no fim das coisas') que exclui o gatilho que o próprio capítulo elegeu como o que mais dá peça."
    correcao: "'O momento continua o mesmo: alguma coisa que ia acontecer de qualquer jeito.' Ou: 'O momento continua o mesmo, e continua sendo parte do dia, não um esforço a mais.'"
  - criterio: ritmo
    trecho: "Na sexta, a semana terminou e os áudios de segunda ainda são reconhecíveis: ela lembra da pessoa, da sala, do que veio antes."
    por_que: "Na seção da seleção, o tempo verbal oscila sem regra. 'Renata a marcou' (passado), 'a semana terminou e os áudios [...] ainda são' (passado e presente na mesma oração), 'ela prendeu' (passado), 'Ela escolhe dois' (presente), 'nas primeiras semanas foram eles que encheram' (passado), 'Quando a fila está curta, ela ouve' (presente). Presente habitual e narrativa passada podem conviver, mas aqui trocam de frase em frase, e a leitura em voz alta tropeça. No mesmo trecho, 'Ela escolhe dois' (os áudios) é seguido de 'As escolhidas ganham' (as capturas)."
    correcao: "Fixe o presente habitual para a descrição da rotina e o passado para os fatos datados. 'Na sexta, a semana está fechada, e os áudios de segunda ainda são reconhecíveis'. 'Ela escolhe duas, porque o ritmo dela é de duas peças por semana. As escolhidas ganham...'"
  - criterio: honestidade
    trecho: "Volta para casa, no carro: 17"
    por_que: "O gatilho 'No trajeto' e os áudios 'no carro' não dizem se ela grava dirigindo. No cap. 21, o livro teve o cuidado de pôr as peças 'no estacionamento, antes de ligar o motor'. Um livro para profissionais de saúde que mostra a fisioterapeuta-modelo pegando o celular no trânsito sem uma palavra deixa um ruído desnecessário. Manusear o celular ao volante é infração no Brasil. O exemplo da oficina resolve o caso do leitor ('no ônibus'), mas não o da personagem."
    correcao: "Um detalhe basta. No parágrafo do corredor: 'O carro vinha depois, gravado ao chegar na garagem de casa, antes de descer.' Ou na nota da barra: 'Na garagem, antes de descer do carro. Mais longos, e mais soltos.'"
  - criterio: coerencia
    trecho: "A primeira regra é um lugar só. Renata tinha três"
    por_que: "O próprio capítulo, três parágrafos depois, cria um quarto lugar: o aplicativo 'onde ficaram duas semanas de abril que ela nunca mais abriu'. Esta foi a correção sugerida na r3, que apresentava o aplicativo como reforço da regra. O ajuste entrou pela metade: a contagem da abertura ('Três lugares') e a das regras ('Renata tinha três') não o incluem. Não é furo de enredo, porque o áudio procurado é de julho, mas o leitor que conta encontra quatro."
    correcao: "Feche o arco na frase do aplicativo: '...onde ficaram duas semanas de abril que ela nunca mais abriu, e que não entravam na conta dos três lugares.' Ou, na seção das regras: 'Renata tinha três, quatro se contasse o aplicativo das etiquetas'."
edicoes_de_linha:
  - "Ela escolhe dois, porque o ritmo dela é de duas peças por semana. -> Ela escolhe duas, porque o ritmo dela é de duas peças por semana. (concorda com 'As escolhidas' e 'as duas escolhidas')"
  - "esqueleto, O que fazer: O gesto possível, ou a pergunta a se fazer. -> O gesto possível e a pergunta a se fazer. (o roteiro pede os dois: 'experimente {o gesto possível}. E, da próxima vez, pergunte a si mesmo: {a pergunta}')"
  - "Os outros dois, a surpresa e o incômodo, continuam valendo quando aparecem. Não precisam ser vigiados. -> Os outros dois, a surpresa e o incômodo, continuam valendo quando aparecem, sem precisar de vigia. (a frase curta solta repete o fecho de parágrafo do tipo aula)"
  - "Na sexta, no carro, foi o primeiro da semana a ganhar nome -> manter; é o fecho certo"
  - "Quando o assunto já é um padrão, a data se conta a partir do último atendimento de onde vem a frase que você vai usar -> manter; agora alinhado com a rede"
  - "A irmã de Renata, que trabalha com projetos numa empresa de software -> A irmã de Renata, que gerencia projetos numa empresa de software (mais exato e mais curto)"
diagramacao:
  - "p. 13: a figura 19.1 continua como na r1, na r2 e na r3. Esta é a quarta vez. O nó 1 quebra 'Capturar: todo dia, em / segundos', o nó 2 empilha 'Selecionar: uma / vez por semana, / dez minutos', e o nó 3 sai alinhado à direita numa coluna de dez linhas curtas ('Com a / matéria-prima / escolhida.'). Se o componente não alarga os nós, encurte os rótulos para 'Capturar: todo dia', 'Selecionar: 1 vez por semana' e 'Produzir: no seu ritmo', e mova o resto para a nota."
  - "p. 13: cerca de 12% em branco no pé, abaixo da figura, porque o box Conceito vai inteiro para a p. 14. Com rótulos mais curtos, a figura encolhe e o branco some."
  - "p. 16: cerca de 13% em branco no pé, porque a tabela 19.1 vai inteira para a p. 17. É evitável: ponha o parágrafo 'O modo de cada um muda a forma do gatilho...' (sete linhas) antes de 'Tabela: Cinco gatilhos...'. Ele preenche o pé da p. 16 e a tabela abre a p. 17."
  - "p. 20 e 21: os campos 03 e 05 remetem à tabela e às 'quatro perguntas' sem dizer a página (p. 17 e p. 18)."
  - "p. 21: cerca de 15% em branco depois do campo 06, porque o 'Confira antes de seguir' vai para a p. 22. Faz parte da oficina, e o bloco não cabe; aceito."
  - "p. 19 (cerca de 40% em branco antes da oficina), p. 23 (cerca de 22% depois do roteiro, antes do fechamento em página nova) e p. 24–25 (verificação com cerca de 25% livres e checklist no terço superior): aceitos pelo projeto."
veredito: "Um capítulo maduro e aprovável, com a melhor abertura da fase e um método que respeita o sigilo de ponta a ponta. Faltam a entrega da oficina, que ainda impõe o ritmo da Renata, a exceção dos áudios longos do carro e três ajustes da r3 na seção dos gatilhos que não voltaram."
