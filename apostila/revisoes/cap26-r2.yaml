capitulo: 26
iteracao: 2
notas: {metodo: 9.1, voz: 8.9, originalidade: 8.8, clareza: 9.1, ritmo: 9.0, concretude: 9.3,
        coerencia: 8.6, aplicabilidade: 8.9, impresso: 8.6, honestidade: 9.1}
bloqueadores: []
pontos_fortes:
  - "A auditoria agora fecha com o texto, com a figura 26.2 e com a oficina, e entrega ao leitor a regra que ele vai precisar na grade: 'Renata classificou cada uma pelo que o corpo da peça fazia, e não pela última linha.' O convite colado no fim virou 'um problema à parte: estava em quase todas, e contaminava qualquer camada'. O principal problema da r1 foi resolvido."
  - "A matéria-prima da camada de reconhecimento é de ofício e mostra o modo oral da Renata: 'Acordo mais velho do que fui dormir.' / 'Levo meia hora para conseguir calçar a meia.' O sigilo é resolvido sem sermão e com o sistema do cap. 19: 'Renata usava só as que já tinham passado da data anotada na seleção (cap. 19) e que tinha ouvido de mais de um paciente, com pequenas variações'."
  - "Honestidade exemplar com os números do PWA e com o resultado: 'Nenhum estudo conhecido fixa esses números para a fisioterapia ou para qualquer área.' e 'De vinte e nove pacientes novos no trimestre, quatro tinham chegado pelo perfil [...] Era pouco perto das indicações [...] e Renata não esperava outra coisa.'"
  - "Imagens próprias que o leitor leva: 'o perfil era uma porta fechada com uma placa bonita'; 'O perfil tinha ficado com o formato do consultório: bom para quem estava dentro, mudo para quem passava na calçada.' O limite ético em saúde é operacional: a peça 'entrega uma pergunta, e não uma conclusão'."
problemas:
  - criterio: coerencia
    trecho: "Depois da avaliação, Renata fez o que a peça dizia: antes de qualquer exercício, encaminhou a paciente a um reumatologista, e ela voltou três semanas depois, com o diagnóstico e o pedido médico."
    por_que: "É, quase com as mesmas palavras, a cena do Marcos no cap. 1 ('antes de qualquer exercício ele precisava passar por um reumatologista, porque aquele padrão merecia ser investigado primeiro'): coluna que amanhece travada, melhora com o movimento, encaminhamento ao reumatologista. E o capítulo inteiro gira no mesmo sinal: o áudio de agosto é 'sobre a dor que acorda antes da pessoa', a peça da meia é rigidez matinal, e a terceira fixada é 'a do paciente que chegou com três exames normais e uma dor que só aparecia de manhã'. Como o texto não assume o eco, o leitor lê a cena final como repetição do caso de abertura do livro (lição cap02-r1), e não como fechamento de arco. Com o Marcos já citado no p. 13, a rima está a uma frase de virar ganho."
    correcao: "Assumir a rima em uma frase e tirar o decalque verbal. Por exemplo: 'Depois da avaliação, Renata reconheceu o padrão do Marcos e fez o que a peça dizia: encaminhou a paciente a um reumatologista antes de começar o tratamento. Ela voltou três semanas depois, com o diagnóstico e o pedido médico. O Marcos tinha chegado apesar do perfil; ela tinha chegado por causa dele.' Se preferir não rimar, trocar o sinal clínico da paciente de novembro (por exemplo, a dor que desce pela perna quando fica muito tempo em pé, que pede outra conduta) e diversificar uma das três peças fixadas."
  - criterio: coerencia
    trecho: "A partir de hoje, pergunte a cada cliente novo como chegou e anote."
    por_que: "Gasta a ferramenta que o cap. 28 anuncia como entrega ('a pergunta de origem implantada', item de 3 pontos no checklist dele), e que o cap. 27 também já pede ('Daqui em diante, pergunte a cada cliente novo como chegou e anote'). São três capítulos seguidos com a mesma instrução (lições cap04-r1 e cap08-r1: solução reservada a outro capítulo não é gasta antes). O campo 01 e o item 'Sei como os meus clientes chegam' não vêm do PWA, que pedia a proporção real contra a recomendada, e o que o PWA pedia ficou sem campo (ver problema de aplicabilidade)."
    correcao: "Cortar a frase do campo 01 e manter só a conta retrospectiva ('conte os que você lembra com certeza e marque os demais como “não sei”'). Melhor ainda: trocar o campo 01 pelo campo de proporção do PWA ('A sua proporção real contra a referência: Real __ · __ · __ · __ / Referência 4 · 3 · 2 · 1. Onde o seu funil está invertido?', 2 linhas) e deixar a origem dos clientes só na cena da Renata. Ajustar o checklist ('Comparei a minha proporção com a referência', campo 02/03)."
  - criterio: voz
    trecho: "Para inverter a proporção, Renata adotou uma referência simples, que o livro propõe como ponto de partida e não como regra"
    por_que: "A personagem adota uma referência 'que o livro propõe': a Renata passa a ser leitora do livro em que vive. É uma quebra de moldura involuntária, que o leitor atento percebe e que desmonta a 'nota ao leitor' (personagens compostos que atravessam o livro, não leitores dele)."
    correcao: "Separar a proposta do narrador da decisão da personagem: 'Para inverter a proporção, Renata adotou uma referência simples: de cada dez peças, umas quatro de reconhecimento, três de critério, duas de confiança e uma de ação. É a que eu proponho como ponto de partida, e não como regra; nenhum estudo conhecido fixa esses números para a fisioterapia ou para qualquer área.'"
  - criterio: clareza
    trecho: "A biblioteca do capítulo 25 espera quem já procura; a peça de reconhecimento alcança quem ainda não sabe o que procurar."
    por_que: "Contradiz a cena que acabou de ser contada: a paciente 'tinha encontrado o áudio da meia numa madrugada, procurando no celular por \"dor nas costas de manhã\"'. Ela procurava. A diferença verdadeira, e é o ponto do capítulo, está no que se procura: a biblioteca do cap. 25 é achada por quem procura o assunto ou o problema com nome; a peça de reconhecimento, por quem procura o que sente. Do jeito que está, o leitor apressado sai com uma distinção falsa entre os dois capítulos."
    correcao: "'A biblioteca do capítulo 25 é achada por quem procura o assunto; a peça de reconhecimento, por quem procura o que sente.' Ou tirar a frase da cena e fechar em 'Renata escreveu: perfil, sem indicação.'"
  - criterio: voz
    trecho: "Nomear uma experiência não é diagnosticar quem lê. Renata passou a encerrar as peças desse tipo com uma frase que devolvia a decisão a quem pode tomá-la: descrever um sinal é uma coisa; saber se ele vale para você depende de alguém que examine."
    por_que: "Três antíteses num parágrafo ('não é diagnosticar'; 'descrever um sinal é uma coisa; saber se...'; 'entrega uma pergunta, e não uma conclusão'), numa seção que já abriu com outra ('Quem sente dor não procura pelo nome técnico. Procura pelo que sente'). Passa do limite de uma antítese explícita por seção (lição cap01-r1). Na mesma seção, a mesma fórmula de narrador de curso volta três vezes no capítulo: 'cada uma pede um tipo de peça', 'A camada de reconhecimento pede um cuidado que Renata demorou a entender', 'a camada de reconhecimento pede ainda outro limite'. E 'Renata tinha uma vantagem que não sabia que tinha' é anúncio."
    correcao: "Manter só a última antítese do parágrafo, que é a mais útil: 'Nas áreas da saúde, há ainda outro limite: a peça descreve, e quem examina decide. Renata passou a encerrar as peças desse tipo com uma frase que devolvia a decisão a quem pode tomá-la, e a peça de reconhecimento fica do lado certo da linha quando entrega uma pergunta, e não uma conclusão.' Abrir a seção pela ação: 'Renata demorou a entender o que a camada de reconhecimento exigia.' Trocar 'Renata tinha uma vantagem que não sabia que tinha.' por 'A matéria-prima estava pronta havia anos.'"
  - criterio: aplicabilidade
    trecho: "exemplo: \"Classifique pelo corpo da peça, e não pela última linha. Some cada coluna e compare com a referência: 4 · 3 · 2 · 1.\""
    por_que: "A grade (p. 20-21) não tem linha de total nem espaço para escrever a comparação, e o checklist cobra 'E sei o quanto o meu funil está invertido (campo 02)'. O leitor soma de cabeça e não registra nada que possa ser conferido no papel (lição cap03-r3). A grade também não tem onde anotar qual é a peça 1, 2, 3..., então a classificação não pode ser revista depois. E nada diz o que fazer quem publicou menos de dez peças."
    correcao: "Acrescentar ao pé da grade duas linhas, 'Total' e 'Referência: 4 · 3 · 2 · 1', e uma coluna estreita 'assunto (3 palavras)'. Ao exemplo, somar: 'Se publicou menos de dez, classifique todas as que tem e compare a ordem das colunas, não os números.' Se o campo 01 virar o de proporção (problema acima), o checklist remete a ele."
  - criterio: honestidade
    trecho: "Quem sente dor não procura pelo nome técnico."
    por_que: "Afirmação absoluta sobre terceiros, repetida na regra 1 da rede ('Ninguém procura pelo nome técnico'). Paciente de coluna procura, sim, por 'hérnia de disco' ou 'bico de papagaio' quando já ouviu o nome de alguém. O que é certo, e basta para o argumento, é que quem ainda não tem diagnóstico procura pelo que sente. O mesmo cuidado vale para 'Os códigos de ética da saúde proíbem, na publicidade, promessa de resultado e qualquer coisa que funcione como diagnóstico de quem lê': a segunda metade é interpretação, não texto de código."
    correcao: "'Quem sente dor e ainda não tem diagnóstico não procura pelo nome técnico. Procura pelo que sente' (e, na rede: 'Quem ainda não tem o nome do problema procura pelo que sente'). Nos códigos: 'Os códigos de ética da saúde vedam, na publicidade, a promessa de resultado, e diagnosticar quem lê é exatamente o que uma peça pública não pode fazer.'"
  - criterio: ritmo
    trecho: "Saíram a foto da sala, a lista de tratamentos e os convênios, que continuaram publicados mais abaixo."
    por_que: "O parágrafo seguinte diz a mesma coisa: 'Os convênios foram para baixo, onde continuavam servindo a quem chegava indicado e queria confirmar.' A correção da r1 foi acrescentada sem tirar a versão antiga, e o leitor lê duas vezes, em dois parágrafos seguidos, que os convênios desceram."
    correcao: "'Saíram a foto da sala, a lista de tratamentos e os convênios.' e manter o parágrafo curto seguinte como está."
  - criterio: coerencia
    trecho: "Renata perguntou como eram as manhãs, e a paciente riu, porque era a pergunta do áudio."
    por_que: "O áudio da meia não tem essa pergunta: começa pela frase da meia e 'terminou com uma pergunta para a pessoa fazer ao próprio médico'. A pergunta sobre as manhãs é outra peça fixada ('a da pergunta sobre as manhãs, que ela faz a todo paciente'). E 'Renata fez o que a peça dizia' exagera o que a peça dizia (que a dor 'merece ser investigada')."
    correcao: "'e a paciente riu, porque era a pergunta de outra peça do alto do perfil, que ela tinha ouvido na mesma madrugada.' Ou: 'porque o áudio começava pelas manhãs dela.'"
  - criterio: originalidade
    trecho: "- \"Uma contadora: “O faturamento subiu e o dinheiro no caixa sumiu? Isso tem explicação.”\""
    por_que: "É a mesma frase da contadora do campo 03 da oficina, duas páginas antes. O leitor recebe um único exemplo fora da saúde, repetido; o outro exemplo da oficina (a dentista) é de novo saúde. O capítulo ainda não mostra como fica a camada de reconhecimento para quem trabalha com obra, contrato ou ensino, onde ela é menos óbvia."
    correcao: "No 'Faça assim', usar outra área, fora das profissões dos caps. 25 e 27: 'Um engenheiro estrutural: “A rachadura em cima da porta abre no inverno e fecha no verão? Isso tem explicação.”' Manter a contadora só no campo 03."
  - criterio: clareza
    trecho: "Era, não por acaso, a peça que os dois pacientes do trimestre tinham citado."
    por_que: "É a primeira vez que se diz que eles citaram uma peça, e 'os dois pacientes do trimestre' obriga o leitor a voltar ao p. 11 para saber quais (o trimestre teve trinta e um). O 'não por acaso' pede uma explicação que só vem na frase seguinte, e de forma negativa ('Mesmo sem ter trazido gente de fora')."
    correcao: "'Era a peça que os dois pacientes que abriram o perfil antes de marcar tinham citado: tinham o nome dela, mas ainda não a conheciam, e era a única que falava com alguém nessa situação.'"
edicoes_de_linha:
  - "No dia seguinte, pediu à Bianca que imprimisse -> No dia seguinte, pediu a Bianca, a assistente, que imprimisse (e no p. 91: 'Bianca, a assistente, continuou cuidando' -> 'Bianca continuou cuidando')"
  - "e leu as folhas na mesa da recepção, depois do último paciente, com uma caneta, anotando em cada uma -> e, depois do último paciente, leu as folhas na mesa da recepção, anotando a caneta em cada uma"
  - "O perfil da Renata era uma vitrine, e, desde os primeiros áudios, uma vitrine muito melhor do que a de antes. -> O perfil da Renata era uma vitrine; desde os primeiros áudios, muito melhor do que a de antes."
  - "O limite dela é que depende inteira de alguém ter mandado a pessoa. -> O limite da vitrine é depender de alguém ter mandado a pessoa. ('dela' hoje pode ser a Renata)"
  - "Renata fez a pergunta e contou duas: o áudio de agosto e uma peça de critério. -> Renata fez a pergunta e contou duas: um áudio de agosto e uma peça de critério. (o áudio só é apresentado dois parágrafos depois)"
  - "A peça do campo 04 não menciona o seu serviço, a sua agenda nem a sua clínica. -> A peça do campo 04 não menciona o seu serviço, a sua agenda nem o lugar onde você atende."
  - "explicacao: A pessoa que estava entendendo o próprio corpo descobre, no fim, que lia uma propaganda. -> explicacao: A pessoa que estava entendendo o próprio problema descobre, no fim, que lia uma propaganda. (a questão vale para todas as áreas)"
  - "Mas eram quatro pessoas que, sem a troca de setembro, provavelmente teriam continuado achando que a dor era coisa da idade -> Mas eram quatro pessoas que, sem a troca de setembro, talvez nunca tivessem ouvido o nome dela (nem todas as quatro, necessariamente, achavam que a dor era da idade)"
  - "Há uma versão desse raciocínio que dá errado, e Renata tinha visto de perto em abril. -> Há uma versão desse raciocínio que dá errado, e Renata a tinha visto de perto em abril."
diagramacao:
  - "p. 18: cerca de um terço da página em branco embaixo, com o último parágrafo cortado em 'prova-/velmente'; só duas linhas e o 'Para guardar' passam para a p. 19. Branco evitável, já apontado na r1 e não resolvido. Permitir que o 'guardar' fique sozinho no alto da p. 19 (sem prender a ele as últimas linhas do texto) ou encurtar o fecho para que feche na p. 18."
  - "p. 14, figura 26.1: a camada 4 (Ação) sai em dourado cheio e as camadas 1 a 3 em bege claro. A ênfase visual cai justamente na camada que o texto chama de 'a menor de todas', e a do reconhecimento, que é o ponto do capítulo, é a mais apagada. O renderizador 'funil()' em apostila/diagramacao/figuras.py sempre destaca a última etapa ('cor = ACC if i == n - 1'). Aceitar um campo 'destaque' no funil e destacar a etapa 1 aqui."
  - "p. 20, campo 02: a referência quebra no meio, 'compare com a referência: 4' no fim de uma linha e '· 3 · 2 · 1.' no começo da seguinte. Usar espaços não separáveis na sequência."
  - "p. 13: cerca de 12% da página vazio embaixo porque o box 'Conceito' foi inteiro para a p. 14. Branco pequeno, mas evitável se o box puder começar no pé da página ou se o parágrafo do teste rápido subir uma linha."
veredito: "Revisão sólida: a auditoria agora fecha, o termo é um só e a oficina ficou executável; o capítulo chega a 9 depois de uma passada curta que assuma (ou desfaça) o eco com o caso do Marcos, devolva ao cap. 28 a pergunta de origem, tire a Renata de dentro do 'livro' e resolva o branco da p. 18 e o destaque errado do funil."
