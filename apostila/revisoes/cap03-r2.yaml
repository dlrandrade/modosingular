capitulo: 3
iteracao: 2
notas: {metodo: 8.8, voz: 8.8, originalidade: 9.0, clareza: 8.7, ritmo: 8.9, concretude: 8.9,
        coerencia: 8.4, aplicabilidade: 8.3, impresso: 8.5, honestidade: 8.9}
bloqueadores:
  - 'Problema ético numa instrução modelada e num exemplo que o leitor vai copiar: gravar e publicar dentro da casa do cliente sem autorização. A cena-modelo do capítulo é Caio gravando "no meio de uma obra no bairro Guanabara", no corredor do apartamento de um cliente, justamente sobre uma decisão desse cliente ("por que o piso de granilite que o cliente queria cobrir valia mais polido do que escondido"), e publicando em quatro minutos. O exemplo do campo 06 repete o gesto: "Vou gravar na sala da cliente, sem arrumar as almofadas, com o celular encostado na estante." A regra 1 da rede ("Grave onde você trabalha, com o quadro limpo.") só cobre papel, tela, prontuário e cliente no quadro. Para arquitetos, designers, personal trainers que atendem em casa, veterinárias a domicílio e cuidadores, "onde você trabalha" É a casa de outra pessoa: o ambiente identifica o cliente para vizinhos e conhecidos, expõe o interior de uma residência e, no caso do Caio, transforma a preferência de um cliente em assunto público sem que ele saiba. O livro trata sigilo como inegociável (lição cap03-r1, cap. 2); a ressalva tem de valer também para o espaço do cliente. Correção: ver problema 1.'
pontos_fortes:
  - 'Os bloqueadores da r1 foram resolvidos de verdade, não maquiados: a regra das tomadas aparece idêntica nos quatro lugares ("Uma tomada; uma segunda só se a primeira for interrompida."; critério da oficina; roteiro_nota; "Errou uma palavra no meio e não regravou."), e o sigilo virou detalhe de ofício exato ("Na obra, o risco costuma ser a planta com o nome do proprietário presa na parede.").'
  - 'Caio mostra o seu modo na primeira cena, sem que o texto anuncie: "Em quarenta segundos, contou outra obra: um casal que, dois anos antes, tinha arrancado um taco igual àquele e descoberto, tarde demais, que era peroba". A cena do taco, com a frase "O taco é a única coisa nesse apartamento que foi feita para durar cinquenta anos. Não troca o que está dando certo.", continua a melhor da Fase I.'
  - 'Formulações próprias, de autor: "Comprar equipamento é uma das formas mais respeitáveis de adiar."; "Ela funciona como um bom par de óculos: deixa ver melhor o que já está ali, sem acrescentar nada à paisagem."; "ninguém comentou a trilha, porque não havia trilha"; "a presença que depende de esforço extraordinário termina no primeiro mês comum."'
  - 'Honestidade de leitor exigente: "Parte da diferença de resultado veio do caminho, porque o áudio chegou pelas mãos de uma cliente. A outra parte está nesses três sinais." e "É cedo para tirar conclusões de um único vídeo." O checklist agora remete a campos reais da oficina (campos 01, 02, 03, 05), e o gabarito tem corretas em posições variadas (b, c, d, a).'
problemas:
  - criterio: metodo
    trecho: "gravou em uma tomada só, com o barulho de uma furadeira ao fundo, por que o piso de granilite que o cliente queria cobrir valia mais polido do que escondido"
    por_que: 'Bloqueador (ver acima). Além da autorização, o assunto da peça é a divergência com o próprio cliente, em obra corrente: o cliente se reconhece, e o vídeo vira exposição dele. O exemplo do campo 06 ("na sala da cliente, sem arrumar as almofadas") ensina o mesmo gesto ao leitor de outra área.'
    correcao: 'Cena: "...no meio de uma obra no bairro Guanabara, com a autorização do proprietário, Caio esperou a furadeira parar, apoiou o celular num cavalete e gravou em uma tomada só por que um piso de granilite como aquele, que quase todo mundo manda cobrir, vale mais polido do que escondido." (tira o cliente do assunto e resolve também o problema do áudio, ver problema 7). Regra 1, porque: acrescentar "Se o lugar é do cliente, peça autorização antes e mostre o mínimo da casa." Campo 06: "Uma designer de interiores: “Vou gravar no meu estúdio, entre as amostras de tecido, com o celular encostado na estante.”"'
  - criterio: aplicabilidade
    trecho: "O que você vai dizer, em quatro tempos: a afirmação, o detalhe, a exceção, a frase que fica"
    por_que: 'O leitor escreve a mesma peça duas vezes. O campo 05 da oficina (7 linhas) pede exatamente os quatro tempos que o esqueleto da rede pede de novo, com os mesmos rótulos ("A AFIRMAÇÃO", "O DETALHE", "A EXCEÇÃO", "O FECHO", 10 linhas, "rascunhe aqui"), e depois o roteiro pede a terceira versão. Nos caps. 1 e 2 a oficina produz a matéria e a rede a transforma; aqui as duas seções fazem o mesmo trabalho em sequência, e o esqueleto vira cópia a limpo.'
    correcao: 'Manter os quatro tempos só no esqueleto da rede. Campo 05 passa a pedir a matéria que o esqueleto vai organizar: "O que sustenta a ideia: o caso, o número ou o sinal da sua prática que só você teria" (5 linhas). Intro da rede: "Organize os campos 04 e 05 no esqueleto abaixo e grave hoje, onde você trabalha." Ajuda do item 3 do checklist: "Montei o esqueleto a partir dos campos 04 e 05 e gravei a peça em uma tomada."'
  - criterio: metodo
    trecho: "Mas tem uma exceção: {quando a regra falha}."
    por_que: 'Esqueleto e roteiro não servem a todos os sinais que o próprio capítulo oferece (lição cap02-r1). O campo 04 manda escolher entre cinco sinais, e o exemplo dado é uma recusa ("Recusa. Não passo lista de macetes para a prova de física"). Quem escolhe recusa, mudança de opinião ou cálculo de risco chega ao terceiro tempo ("A exceção. Quando a regra falha.") sem ter o que pôr. O PWA previa "A exceção ou o critério".'
    correcao: 'Esqueleto, terceiro tempo: {rotulo: "O que muda a decisão", texto: "A exceção, o risco ou o motivo da recusa. É aqui que aparece o seu critério."}. Roteiro: "E aqui está o que muda a decisão: {a exceção, o risco ou o motivo}." Rótulo do campo 05 (se mantido) e subtítulo do esqueleto com a mesma formulação.'
  - criterio: aplicabilidade
    trecho: "Uma tomada só, ou duas se a primeira for interrompida. Se errar uma palavra, siga em frente."
    por_que: 'O "Confira antes de seguir" fecha a oficina, cuja entrega agora é um roteiro ("pronto para gravar de uma vez"), mas dois dos três critérios só podem ser conferidos depois de gravar, o que acontece na rede: este e "Você não adiou por causa de nenhum elemento de produção." O leitor chega às caixas de marcar sem ter como marcá-las.'
    correcao: 'Critérios da oficina, verificáveis no papel: "O roteiro cabe em até um minuto lido em voz alta, sem pressa."; "A peça contém um detalhe que só quem faz o seu trabalho saberia."; "O campo 06 tem pelo menos uma coisa que você vai deixar de fazer." A regra das tomadas já está na rede (regra 2) e no roteiro_nota; basta.'
  - criterio: aplicabilidade
    trecho: "Um professor de cursinho: “Recusa. Não passo lista de macetes para a prova de física, e explico por quê.”"
    por_que: 'O campo pede "a ideia da peça em uma frase", e o exemplo adia a ideia ("e explico por quê"). Pelo teste do mudo que o capítulo ensina, o que sobra é "eu não faço X", uma frase sobre o professor, não sobre o problema do aluno (o contrário da ocupação de território do cap. 2). É o único exemplo que mostra como fica o campo 04 preenchido, e mostra a coisa errada. O mesmo tique ("e explico por quê") aparece na tabela.'
    correcao: '"Uma professora de piano: “Recusa. Não ensino música só por aplicativo de notas coloridas: a criança toca a música, mas não aprende a ler, e trava no primeiro livro sem cor.”" (troca também a profissão repetida, ver problema 6).'
  - criterio: coerencia
    trecho: "Designer de interiores: \"Projeto sem visitar o imóvel eu não faço, e explico por quê.\""
    por_que: 'Duas profissões aparecem duas vezes no mesmo capítulo, o que a regra do elenco proíbe ("Uma participação por profissão, sem repetir no mesmo capítulo"): designer de interiores (tabela e campo 06) e professor de cursinho (tabela e campo 04). Além disso, o capítulo reaproveita figurantes já gastos nos vizinhos: corretor de seguros (caps. 1, 2 e 4), farmacêutica (caps. 1, 2 e 5), personal trainer (cap. 4), nutricionista (cap. 1). ESTADO.yaml › figurantes não registra farmacêutica, designer nem professor de cursinho, e por isso o controle não pega.'
    correcao: 'Tabela, Recusa: "Contadora: “Planejamento para esconder receita eu não faço: a multa chega depois, e em nome do cliente.”" Tabela, Mudança de opinião: "Professora de piano: …" só se o campo 04 não a usar; senão "Engenheiro estrutural: “Eu mandava reforçar toda laje antiga. Hoje peço prova de carga antes, porque metade não precisava.”" Registrar em ESTADO os figurantes efetivamente usados em cada capítulo.'
  - criterio: coerencia
    trecho: "com o barulho de uma furadeira ao fundo"
    por_que: 'A cena-modelo contradiz a regra que o capítulo ensina três páginas depois: "Resolva o áudio e não se preocupe com o resto." / "Áudio ruim faz a pessoa sair" / "Áudio que se entende". No áudio privado do taco o barulho de serra é detalhe de autenticidade; na peça publicada, é exatamente o atrito que a produção mínima manda resolver. O leitor que imita o Caio viola a regra 3.'
    correcao: '"Caio esperou a furadeira parar, apoiou o celular num cavalete e gravou..." (o gesto mostra a regra em cena, sem explicá-la).'
  - criterio: coerencia
    trecho: "Gravei ou escrevi uma peça com produção mínima"
    por_que: 'O item aceita "escrevi", e o PWA previa texto entre os formatos, mas a ajuda exige gravar ("gravei a peça em uma tomada") e a rede só fala em vídeo ("Grave hoje", "Uma tomada", "Resolva o áudio", "Celular apoiado, luz de janela no rosto"). O cap. 5 dirá que o formato errado para o modo da pessoa é o que faz desistir, e o próprio capítulo afirma que "O teste vale igualmente para textos e imagens". O leitor que pensa escrevendo (Otávio) não tem caminho nesta rede.'
    correcao: 'Acrescentar à intro da rede: "Se o seu meio é o texto, a regra é a mesma: escreva de uma vez, em até dez linhas, sem abrir o editor de imagens, e publique sem reescrever três vezes." Ajuda do item 3: "Gravei em uma tomada, ou escrevi de uma vez, a partir do esqueleto."'
  - criterio: clareza
    trecho: "Cada camada só funciona se a de baixo existir."
    por_que: 'O conceito do capítulo é a "Inversão da hierarquia", e a questão 1 da verificação cobra a ordem das quatro camadas, mas a prosa nunca fala de "clareza" nem de "formato" como degraus: ela opera só no binário produção x substância. As duas camadas do meio existem apenas nas notas da figura 3.1. Um leitor apressado explica "pensamento antes de embalagem", mas não a hierarquia que dá nome ao conceito.'
    correcao: 'Depois de "Comprar equipamento é uma das formas mais respeitáveis de adiar.", um parágrafo de três frases que passa o Caio pelas quatro camadas: "O vídeo do Cambuí tinha acabamento de sobra e um formato escolhido com cuidado. Faltava a camada de baixo, uma opinião sobre aquela reforma, e por isso faltava também a do meio: não havia uma frase que alguém pudesse repetir. O áudio do taco tinha as duas, e nenhuma das de cima."'
  - criterio: concretude
    trecho: "Agachamento serve para quase todo mundo; para quem tem esta dor no quadril, primeiro outra coisa."
    por_que: 'O exemplo de "exceção nomeada" não nomeia a exceção: "esta dor" e "outra coisa" são dêiticos que dependem de gesto ou de imagem, o oposto do que a linha quer provar. O do cálculo de risco é fórmula sem conteúdo e com lógica torta: "O ganho dessa cobertura é pequeno e o risco que ela deixa é real." (cobertura não "deixa" risco; qual cobertura?). A tabela é onde o leitor de outra área mais precisa se ver.'
    correcao: 'Exceção: "Personal trainer: “Agachamento profundo serve para quase todo mundo; se aparece uma fisgada na virilha no fundo do movimento, eu reduzo a amplitude e peço avaliação antes de seguir.”" Cálculo de risco: "Corretor de seguros (ou outra profissão ainda não usada): “Em carro com mais de quinze anos, o seguro completo custa perto do que o carro vale. Eu faria só o de terceiros.”"'
  - criterio: coerencia
    trecho: "Caio aprendeu a olhar o fundo antes de começar a gravar."
    por_que: 'O parágrafo do quadro limpo está solto entre a nota "O mínimo que resolve quase tudo" e a figura 3.2, numa seção ("Para que serve, então, a boa produção") que não trata de onde gravar: é depósito de assunto (lição cap01-r2). Abre com uma premissa que a prosa ainda não apresentou ("Gravar onde você trabalha tem uma condição"), e o "aprendeu" é anacrônico: Caio só grava na obra pela primeira vez na seção seguinte.'
    correcao: 'Levar a ideia para a cena de "O vídeo seguinte", como ação: "Antes de gravar, tirou da parede a planta com o nome do proprietário." A regra geral já está na regra 1 da rede. O corte também reduz o branco da p013 ao puxar texto para cima.'
  - criterio: ritmo
    trecho: "Numa noite de chuva, reassistiu ao do Cambuí e percebeu o que faltava."
    por_que: 'Caio já tinha percebido isso no teste do mudo ("Não havia uma decisão explicada, um erro evitado, uma escolha que só um arquiteto experiente faria."). A segunda descoberta repete a batida e quebra a cronologia da seção (o vídeo novo, depois um flashback, depois o resultado do vídeo novo). A lista das decisões ausentes é boa e merece ficar, mas não como revelação.'
    correcao: 'Mover o parágrafo para logo depois do teste do mudo, sem "percebeu": "Faltavam as decisões: por que a cozinha tinha mudado de lugar, por que a janela da sala foi mantida mesmo torta, por que ele desaconselhou o forro de gesso que a cliente queria. Estavam todas fora do filme." Em "O vídeo seguinte", manter só "Os seis vídeos antigos continuam publicados; são bons registros de obras de que ele se orgulha."'
  - criterio: voz
    trecho: "Os cinco sinais têm uma coisa em comum:"
    por_que: 'O molde "anúncio + dois-pontos + revelação" se repete e começa a soar fórmula: "O plano era simples:", "é outra coisa: expõe", "O nome vem daí:", "procurando uma coisa: sinais", "Os cinco sinais têm uma coisa em comum:", "só que é outra: ela reduz atrito", "tem uma condição que nenhuma luz resolve:". Somado a isso, "coisa" aparece 11 vezes na prosa e "todo mundo", 6. A seção "Para que serve" tem duas antíteses ("só que é outra"; "O que a produção não faz é criar autoridade"), acima do limite de uma por seção.'
    correcao: 'Desmontar ao menos quatro: "Os cinco sinais nascem do trabalho real; por isso não precisam ser inventados, só percebidos."; "Quem assiste a um vídeo de especialista procura, sem perceber, sinais de que existe ali alguém que pensa"; "Ter uma opinião sobre o próprio ofício e dizê-la em público expõe, não tem tutorial e pode dar errado diante de todo mundo."; "A boa produção tem uma função real: reduz atrito." Trocar "como todo mundo estava fazendo" por "como as vizinhas do prédio estavam fazendo".'
  - criterio: voz
    trecho: "Para quem vive de vender produção, a ideia de que presença profissional precisa parecer peça publicitária faz sentido."
    por_que: 'A correção da r1 criou eco literal: a frase anterior termina em "a ideia de que presença profissional precisa parecer peça publicitária", e esta repete as nove palavras. O mesmo parágrafo fecha em "como no caso do Caio" e o seguinte abre em "No caso do Caio".'
    correcao: '"Para quem vende produção, essa crença faz sentido." e, no parágrafo seguinte, "Para Caio, a pressão era maior porque a arquitetura vive de imagem."'
  - criterio: coerencia
    trecho: "A câmera ficou para as fotos de entrega, que ele faz uma vez por mês, com calma."
    por_que: 'O plano reserva para o cap. 20 a virada "Da câmera ao celular: uma foto de obra e cinco linhas" (lição cap04-r1: cenas reservadas não se gastam antes). O cap. 3 já faz a troca de aparelho de forma explícita e definitiva, e o fecho da prosa ("consegue gravar quatro minutos toda semana, o ano inteiro") antecipa a tese de sustentação do cap. 20 e do 29. Como experimento isolado, a cena funciona; como mudança de rotina, rouba o arco.'
    correcao: '"A câmera continuou no armário do escritório; ele não sabia ainda o que fazer com ela." (deixa a decisão para o cap. 20). No último parágrafo, falar do vídeo como prova de possibilidade, não de rotina: "Quatro minutos podem se repetir numa semana cheia; onze fins de semana, não."'
  - criterio: clareza
    trecho: "Bastava raspar e recuperar; o porcelanato novo custaria mais e valeria menos na hora de vender o imóvel."
    por_que: 'O referente muda sem aviso: "Bastava" fala do taco do casal (passado, já arrancado), "custaria" fala do taco da cliente (hipótese presente). O leitor precisa reler para saber de qual piso se trata. No parágrafo seguinte, a sequência também tropeça: "A irmã ligou na semana seguinte e fechou o projeto" antes da "primeira reunião", e reforma de apartamento não se fecha por telefone.'
    correcao: '"...e descoberto, tarde demais, que era peroba, madeira que hoje quase não se encontra; bastaria ter raspado. No apartamento da cliente, disse, o porcelanato novo custaria mais e valeria menos na hora de vender." E: "A irmã ligou na semana seguinte. Na primeira reunião, contou que tinha ouvido o áudio três vezes, e fechou o projeto ali. Caio não teria sabido de outro jeito."'
  - criterio: clareza
    trecho: "o teste cala tudo o que não é a ideia, a imagem, a trilha, o corte, a cor, e deixa só a fala, no papel."
    por_que: 'Sem parênteses ou travessões, o aposto se lê como enumeração: "tudo o que não é a ideia, [não é] a imagem, [não é] a trilha...". É justamente a frase que explica o nome do teste (resolução da r1), e ela precisa ser inequívoca, porque o distrator b da questão 4 aposta na leitura errada. A lista também repete a da frase anterior ("a imagem, a trilha, a edição e o design").'
    correcao: '"O nome vem daí: o teste cala imagem, trilha, corte e cor, e deixa só a fala, no papel."'
  - criterio: honestidade
    trecho: "Quatro minutos contra onze fins de semana."
    por_que: 'A comparação esconde o tempo de pensar: os quatro minutos vão "entre abrir a câmera do celular e publicar", e a oficina do próprio capítulo pede 25 minutos para preparar o roteiro. O leitor exigente percebe a conta favorável. Na mesma linha, dois números sem base: "corrija os erros: custa dois minutos" (regra 3) e o "Para guardar" que chama três sinais de "os mais baratos e mais raros", quando a prosa diz que o leitor os produz "toda semana".'
    correcao: '"Meia hora de preparo e quatro minutos de gravação contra onze fins de semana." Regra 3: "...deixe ligada e corrija os erros antes de publicar." Guardar 3: "Detalhe específico, exceção nomeada e recusa fundamentada custam zero e nenhuma edição fabrica."'
  - criterio: voz
    trecho: "Em pouco tempo aparece um padrão, e ele é a matéria-prima dos próximos capítulos."
    por_que: 'Resto de narrador que anuncia (lição cap01-r1). O exercício também não bate com a oficina: a prosa pede "durante três dias, anotar ao fim do expediente uma frase", e o campo 03, feito numa sentada de 25 minutos, pede "Três frases que você disse esta semana". Uma regra operacional, um formato só (lição cap03-r1).'
    correcao: '"Em pouco tempo aparece um padrão: são sempre os mesmos assuntos em que você sabe mais do que quem pergunta." Campo 03: "Três frases que você disse nos últimos dias e que um colega menos experiente não diria" (e a prosa: "anotar, ao fim de três expedientes, uma frase...").'
  - criterio: voz
    trecho: "Grave antes de pensar demais."
    por_que: 'Num capítulo cuja tese é "Primeiro vem o pensamento", a nota do roteiro manda gravar antes de pensar. O sentido pretendido (não ficar ajustando a gravação) é outro, e a frase, lida no fim da seção, contradiz o título da oficina ("pensamento máximo").'
    correcao: '"Grave antes de começar a mexer no enquadramento."'
  - criterio: aplicabilidade
    trecho: "Qual destes é um sinal de autoridade que NÃO depende de produção?"
    por_que: 'Três opções são elementos de produção (corte rápido, identidade visual, legenda animada) e a quarta é a única que não é, o que torna a questão respondível sem ler o capítulo. Na questão 2, "Dispensar o especialista de ter uma opinião própria." é absurdo demais para distrair, e "Justificar um preço maior" não é inequivocamente falso para arquitetos e designers, em quem a apresentação visual é parte do serviço.'
    correcao: 'Q3, trocar dois distratores por sinais plausíveis mas dependentes de produção ou vazios: "Um cenário que mostre o diploma e o consultório." / "Citar o número de anos de formado logo na abertura." Q2: "Aumentar a confiança do público no conteúdo." no lugar de "Dispensar…", e "Fazer a peça durar mais tempo no ar." no lugar de "Justificar um preço maior…".'
edicoes_de_linha:
  - {trecho: "Caio fez o teste com o seu vídeo preferido", correcao: "Caio fez o teste com o vídeo de que mais gostava (num livro em \"você\", \"o seu\" parece falar do leitor)"}
  - {trecho: "No mesmo período, aconteceu uma coisa em que ele não prestou atenção. Uma cliente mandou", correcao: "No mesmo período, sem que ele desse importância, uma cliente mandou"}
  - {trecho: "oferece mais em poucas palavras do que dez carrosséis bonitos", correcao: "oferece mais do que dez carrosséis bonitos (\"cinco linhas\" já disse que são poucas palavras)"}
  - {trecho: "Um jeito simples de começar a notar é,", correcao: "Um bom começo é, (\"simples\" aparece quatro vezes; \"Existe um jeito simples\" abre a seção anterior)"}
  - {trecho: "Até lá, a regra é gastar primeiro em pensamento e só depois em acabamento.", correcao: "Até lá, o dinheiro e o tempo vão para o pensamento."}
  - {trecho: "É cedo para tirar conclusões de um único vídeo. Mas faça a experiência da produção mínima pelo menos uma vez antes de decidir o que ela vale para você.", correcao: "É cedo para tirar conclusões de um único vídeo, e Caio não tirou. Mas a experiência vale ser feita pelo menos uma vez antes de decidir o que ela vale. (o \"Mas faça\" salta da cena para o leitor sem transição)"}
  - {trecho: "Escolha a sua última peça publicada. Reescreva, à mão, só o que ela dizia.", correcao: "Escolha a sua última peça publicada, ou a de um colega, se você ainda não publica. Reescreva, à mão, só o que ela dizia. (a nota repete a prosa e esquece quem não publica, que a oficina contempla)"}
  - {trecho: "O teste vale igualmente para textos e imagens.", correcao: "O teste vale também para textos e imagens."}
  - {trecho: "Onze fins de semana para seis vídeos não se repetem nem uma vez", correcao: "Onze fins de semana para seis vídeos não se repetem"}
diagramacao:
  - 'p013: cerca de 1/3 da página em branco no pé, porque a figura 3.1 não coube e desceu para a p014 junto com o box Conceito. Evitável: pôr a figura depois do parágrafo "No caso do Caio, a pressão era maior…" ou deixar os dois últimos parágrafos da seção correrem depois dela. Cortar o parágrafo do quadro limpo (problema 11) também puxa texto.'
  - 'p014, figura 3.1: o rótulo "A BASE" continua encostado na legenda ("A BASE" / "Cada camada só funciona…"), sem o respiro de 2 a 3 mm pedido na r1.'
  - 'p015/p016: o rótulo "TABELA 3.1" ficou órfão no pé da p015, separado do título "Sinais de autoridade que não dependem de produção" e da tabela, que abrem a p016. Manter rótulo, título e tabela juntos (break-after: avoid no rótulo).'
  - 'p016: cerca de 1/4 da página em branco depois do parágrafo "Os cinco sinais têm uma coisa em comum…", porque o box "Na prática" (exemplo) é indivisível e desceu para a p017. Evitável: pôr o exemplo logo depois do parágrafo do taco, antes de "Os cinco sinais…", ou deixar o primeiro parágrafo de "Para que serve" subir.'
  - 'p020: o rótulo do campo 03 quebra deixando só "diria" na segunda linha. Encurtar: "Três frases desta semana que um colega menos experiente não diria".'
  - 'p022: o branco de mais de metade da página antes do esqueleto indivisível é aceito pelo projeto. Se o campo 05 for enxugado (problema 2), conferir se a rede pode abrir no pé da p021, onde há cerca de 1/5 de página livre.'
  - 'Extensão: p011 a p025, 15 páginas, dentro do alvo de 14 a 16. A p026 em branco é alinhamento para o apêndice.'
veredito: "Revisão sólida, que resolve os dois bloqueadores da r1 e deixa a prosa madura, mas ainda reprova: a cena-modelo e um exemplo ensinam a gravar e publicar na casa do cliente sem autorização, a oficina faz o leitor escrever a mesma peça duas vezes com um esqueleto que só serve a um dos cinco sinais, e duas profissões se repetem no capítulo."
