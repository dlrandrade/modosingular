bloqueadores: []
pontos_fortes:
  - 'A r2 foi quase toda resolvida, e bem. O Otávio já não contradiz o áudio do cap. 4 ("O áudio do “acertar por fora” saiu fácil porque respondia a uma pergunta que cliente faz toda semana"). A primeira faixa passou nos casos extremos: 10-5-5-5 dá dominante, 9-9-9-3 difuso, 10-9-2-2 duplo, 6-6-6-6 difuso e 7-5-2-2 dominante. O parágrafo da tradução parte do cap. 5 em vez de redescobri-lo ("A etapa que Renata encontrou na autópsia do capítulo 5 tem nome"). O conceito não diz mais "Mais do que". O campo 03 atende quem nunca publicou. A cena da Lúcia ganhou uma ideia própria ("a queixa importa menos do que o que a pessoa faz para fugir dela"). A questão 02 tem distratores inequivocamente falsos. O item 6 do teste deixou de medir perfeccionismo.'
  - 'As cenas de abertura continuam em nível de editora. Cada modo aparece em ação, com detalhe de ofício, antes de ganhar nome: "As mãos desenhavam no ar uma coluna, uma dor que sobe, um músculo que protege demais"; "Na primeira, rodeou o assunto. Na segunda, contou duas audiências"; "O cunhado entendeu pela história, e Caio também."'
  - 'O resultado da Renata vem contado com honestidade e com os números do cap. 5, que batem: nota 10 para "escrever o texto de cada uma" lá, e aqui "A nota de atrito dessa etapa, refeita duas semanas depois, caiu para 4. O tempo gasto continuou parecido, e sentar para começar ficou bem mais fácil." Não há promessa nem número apresentado como dado, e a figura leva o selo de esquema ilustrativo.'
  - 'O lint está limpo, com 0 travessão, 0 frase-soco, 0 "não é X, é Y", frase média de 18,9 palavras e desvio de 8,6. A regra de ouro é cumprida em todo o caderno: o roteiro, o esqueleto e os exemplos tratam só da área do leitor.'
problemas:
  - criterio: clareza
    trecho: "Em Curitiba, a filha de uma paciente esperou Renata no corredor, no fim da sessão, e perguntou o que ela fazia de diferente [...] Renata não sabia responder e começou a falar assim mesmo."
    por_que: 'As cenas não separam o modo oral do dialógico, e são elas que ensinam a diferença. Renata e Lúcia recebem uma pergunta, respondem falando e acham uma frase nova no meio da resposta, e a subseção define o dialógico justamente por isso ("diante de uma pergunta, desenvolve longamente"). A única prova de que Lúcia é dialógica é que ela trava sozinha, e trava no papel ("A página ficou em branco por quase uma hora"), onde a Renata do cap. 5 também travou ("quarenta minutos diante da primeira lâmina em branco"). O leitor apressado fica sem o sinal que distingue as duas, que é o que acontece com cada uma quando fala sozinha. A dúvida pesa no teste: quem se reconhece nas duas cenas não sabe se marca alto no eixo O ou no D.'
    correcao: 'Fazer o contraste passar pela fala sem interlocutor. Renata, no fim da cena: "Renata foi para casa repetindo a frase e, sozinha no carro, continuou explicando em voz alta até achar a segunda." Lúcia: "No dia seguinte, tentou gravar para si mesma um áudio com aquela ideia, no carro, antes de subir para o consultório. Recomeçou quatro vezes. Sem alguém do outro lado, a explicação não vinha." Assim o texto separa os dois modos no mesmo lugar (o carro) e antecipa a rota do cap. 7 e do cap. 9, em que Renata grava no carro. Se quiser manter o papel, acrescente na subseção dialógica: "O oral fala bem até sozinho; o dialógico precisa de alguém, ou de uma pergunta, do outro lado."'
  - criterio: clareza
    trecho: "Cada um dos quatro tem um dominante e um secundário próximo, que funciona como rota alternativa nos dias em que o principal não está disponível. Caio conta as histórias dele melhor em voz alta do que por escrito, e isso o aproxima do oral; Lúcia escreve bem, desde que a página comece por uma pergunta: o canal muda, o modo não."
    por_que: 'A correção da r2 foi aplicada, mas no lugar errado. A frase anuncia exemplos de modo secundário, e o segundo exemplo diz o contrário: que a Lúcia, escrevendo, continua no mesmo modo. O leitor tem dois exemplos em que um prova a regra e o outro a desmente, sem transição. Renata e Otávio ficam sem secundário nomeado, embora a frase diga "Cada um dos quatro tem".'
    correcao: 'Separar as duas ideias. "Ninguém tem um modo puro. Cada um tem um dominante e um secundário próximo, que serve de rota alternativa nos dias em que o principal não está disponível: Caio conta as histórias dele melhor em voz alta do que por escrito, e isso o aproxima do oral. Canal e modo também não se confundem. Lúcia escreve bem, desde que a página comece por uma pergunta; o canal mudou, o modo continua o dela." E trocar "Cada um dos quatro tem" por "Cada um tem", para não prometer quatro secundários.'
  - criterio: aplicabilidade
    trecho: "Nenhuma soma passa de 6, ou as três maiores estão a 1 ponto ou menos umas das outras. Refaça o teste depois de uma semana de caderno de campo."
    por_que: 'A faixa está certa, mas deixa quem cai nela sem ter o que fazer na oficina da página seguinte. Esse leitor vai preencher o campo 01 ("O meu modo dominante e o secundário") e o campo 04 sem modo nomeado, e os itens 2 a 4 do checklist, que valem 7 dos 10 pontos, dependem desse campo. O resultado é inventar um modo ou travar no capítulo. O rótulo "Todas baixas" também não cobre a segunda condição (três somas altas e próximas, como 9-9-8).'
    correcao: 'Leitura: "Nenhuma soma passa de 6, ou as três maiores estão a 1 ponto ou menos umas das outras. Faça a oficina com as duas maiores somas como hipótese, escreva “provisório” no campo 01 e refaça o teste depois de uma semana de caderno de campo." Rótulo: "Baixas ou próximas".'
  - criterio: voz
    trecho: "O sinal clássico é reescrever mensagens antes de enviar [...] O risco é a formalidade, um texto correto e distante, e o remédio é ler em voz alta"
    por_que: 'As quatro subseções continuam presas ao mesmo molde de ficha. "Sinal" aparece nas quatro ("O sinal mais claro", "O sinal clássico", "O sinal é", "O sinal é"), "risco" em três ("O risco é a formalidade", "o risco é a dependência", "é o risco") e "remédio" em três ("o remédio é ler", "O remédio é ter", "o remédio é perguntar"). Lidas em sequência, as subseções soam como apostila de curso, que é o que a rubrica de voz pede para evitar. A r1 e a r2 já apontaram o molde, e a variação feita desde então só mexeu na ordem das peças.'
    correcao: 'Tirar os rótulos de pelo menos duas subseções e dizer a coisa pela cena ou pelo efeito. Dialógico: "Sozinha, a pessoa trava; diante de uma pergunta, desenvolve longamente, e as melhores frases saem em conversa, quase nunca quando ela se prepara. Sem pergunta, nada acontece, e por isso vale ter perguntas guardadas: o caderno de campo está cheio delas." Narrativo: "[...] O perigo é a história sem ponto, que diverte e não ensina; antes de publicar, pergunte que frase a pessoa deve levar dali." Manter "sinal" no máximo duas vezes e "remédio" uma.'
  - criterio: ritmo
    trecho: "Lúcia respondeu durante vinte minutos, com exemplos, distinções finas e uma pergunta de volta [...] Dali saiu uma ideia que ela nunca tinha dito assim [...] A colega anotou."
    por_que: 'O parágrafo tem sete frases, acima do limite de seis (lição cap01-r2), e repete duas batidas da cena da Renata, que está duas linhas acima: "uma frase que nunca tinha formulado" / "uma ideia que ela nunca tinha dito assim" e "A filha anotou no celular." / "A colega anotou." Na terceira cena seguida, o leitor já prevê o desenho. "Vinte minutos" repete também a marca do Otávio no cap. 6 ("Otávio levou vinte minutos para responder"), o que enfraquece o sinal dialógico que deveria ser só da Lúcia.'
    correcao: 'Cortar "A colega anotou." e trocar "Dali saiu uma ideia que ela nunca tinha dito assim" por "Dali saiu, formulada pela primeira vez, a ideia de que". Trocar "durante vinte minutos" por "até o café esfriar" ou "até o fim da reunião". Se adotar a correção do problema 1, dividir o parágrafo antes de "No dia seguinte".'
  - criterio: ritmo
    trecho: "Renata quase não escreve: três palavras e uma seta [...] Otávio, como o capítulo 6 já deixou ver [...] Lúcia anota perguntas [...] Caio anota casos com começo, meio e fim."
    por_que: 'O quarteto aparece enumerado na mesma ordem (Renata, Otávio, Lúcia, Caio) cinco vezes: nas cenas, em "Renata falando, Otávio escrevendo, Lúcia respondendo, Caio contando", neste parágrafo, nas rotas ("Renata passou a [...] Otávio continuou [...] Lúcia pediu [...] Caio passou a") e, com dois nomes, no parágrafo do modo puro. Cada lista traz informação nova, e por isso não é repetição de ideia, mas lida em voz alta a ladainha fica evidente. As rotas e o caderno estão a uma página de distância.'
    correcao: 'Quebrar a ordem e o paralelismo em pelo menos duas listas. No caderno de campo, começar por Caio e fundir Lúcia e Otávio numa frase ("Lúcia anota perguntas, cada uma já com a pergunta que ela faria de volta; Otávio, como o capítulo 6 deixou ver, não consegue deixar uma frase pela metade"). Nas rotas, abrir pela Lúcia, ou reduzir a Otávio e Caio, já que a Renata ganha parágrafo próprio logo depois.'
  - criterio: concretude
    trecho: "Renata passou a gravar áudios de três ou quatro minutos no carro, ainda parada no estacionamento da clínica"
    por_que: 'O elenco dá a Renata um "consultório próprio em Curitiba há 14 anos", e o cap. 1 fala em "consultório da Renata". "Clínica" com estacionamento sugere outro lugar de trabalho, e o leitor atento nota.'
    correcao: '"ainda parada em frente ao consultório".'
  - criterio: originalidade
    trecho: "Em Campinas, num almoço de domingo, o cunhado perguntou a Caio"
    por_que: 'O cap. 5 já usa o mesmo cenário para a mesma função, o personagem que explica a si mesmo diante da família: "contou a história à irmã num almoço de domingo". São dois capítulos de distância, e a lição cap02-r1 veta repetir cena entre capítulos. A cena da Renata também ecoa a premissa do cap. 1 ("a mãe já tinha passado por tanta gente" / Marcos, que "tinha passado por um clínico geral, dois ortopedistas e uma quiropraxista").'
    correcao: 'Caio: "Em Campinas, na festa de aniversário do sobrinho, o cunhado perguntou..." ou "numa visita de obra, o mestre de obras perguntou...". Renata: "porque a mãe tinha melhorado em três semanas depois de anos de dor" ou outro motivo que não seja a peregrinação do cap. 1.'
  - criterio: honestidade
    trecho: "A maior soma supera as outras por 2 ou mais. Os formatos do eixo mais baixo tendem a custar mais para você; o quadro de atrito do capítulo 5 mostra quanto."
    por_que: 'Eixo é modo, não formato; o leitor precisa cruzar a faixa com a figura 7.1 para entender "formatos do eixo". "Mostra quanto" também promete mais do que o quadro do cap. 5 dá: ele mede a última tentativa do leitor, que pode ter sido num formato sem relação com o eixo mais baixo.'
    correcao: '"A maior soma supera as outras por 2 ou mais. Os formatos que a figura 7.1 marca como “não combina” para o seu modo tendem a custar mais para você; se a sua última tentativa foi num deles, as notas de atrito do capítulo 5 dão uma ideia de quanto."'
  - criterio: clareza
    trecho: "Para o modo oral, é o formato mais caro da tabela: exige traduzir fala em texto antes de começar."
    por_que: 'Na figura 7.1, logo acima, o texto longo também aparece como "não combina" para o Oral. O carrossel divide a posição e não é "o mais caro".'
    correcao: '"Para o modo oral, é, com o texto longo, o formato mais caro da tabela: exige traduzir fala em texto antes de começar."'
  - criterio: coerencia
    trecho: "Para essa pessoa, gravar vídeos de improviso é caríssimo."
    por_que: 'O gabarito da questão 04 generaliza o que o texto teve o cuidado de delimitar. O próprio capítulo lembra que o áudio improvisado do Otávio "saiu fácil" quando respondia a uma pergunta de cliente. O leitor que confere o gabarito recebe a versão menos precisa da ideia.'
    correcao: '"Para essa pessoa, gravar de improviso uma ideia que ainda não passou pelo papel costuma sair caro."'
  - criterio: voz
    trecho: "O teste a seguir ajuda a identificar os seus dois primeiros modos."
    por_que: 'A prosa ainda anuncia a seção seguinte, o que a lição cap01-r1 veta ("não listar as seções seguintes"). A r2 pediu o corte, e a frase ficou antes da nova frase de fecho.'
    correcao: 'Cortar a frase. O parágrafo termina em "é ele que confirma o seu modo, ou o corrige", que já leva ao teste.'
edicoes_de_linha:
  - '"No Recife, um colega de faculdade, hoje professor, telefonou a Otávio convidando-o para uma conversa com os alunos sobre o que ele sabe hoje que nenhum professor ensinou." -> "No Recife, um colega de faculdade que hoje dá aula telefonou a Otávio e o convidou para conversar com os alunos sobre o que ele sabe e nenhum professor ensinou." ("hoje" e "professor" se repetem na frase; a r2 já tinha apontado.)'
  - '"e todos chegaram a uma resposta. Cada um chegou à sua ideia central" -> "e todos chegaram a uma resposta. Cada um achou a sua ideia central" (o verbo se repete em frases seguidas).'
  - '"A tradução de formato, no fim do processo, pode ser feita por você, por um assistente ou por uma ferramenta." -> "Nessa posição, ela pode ser feita por você, por um assistente ou por uma ferramenta." (o parágrafo anterior acabou de dizer que ela "pode sair das suas mãos"; o termo aparece duas vezes seguidas).'
  - '"legenda: As respostas são escritas ou gravadas, a perguntas do público." -> "legenda: Na coluna Respostas, respostas escritas ou gravadas a perguntas do público." (a vírgula separa o complemento do nome e a frase fica truncada).'
  - '"Sozinho eu travo; com uma pergunta, desenvolvo por muito tempo." -> "Sem ninguém perguntando, eu travo; com uma pergunta, desenvolvo por muito tempo." (item 3 do teste; tira o masculino genérico de uma frase em primeira pessoa que muitas leitoras vão assinar).'
  - '"intro: [...] As regras abaixo dizem como capturar conforme o modo; o esqueleto vale para todos." -> "[...] o esqueleto vale para todos, com o ajuste de ordem indicado sob o roteiro." (a nota do roteiro manda o narrativo inverter a ordem).'
  - '"roteiro_nota: Se o seu modo é narrativo, [...]" -> acrescentar ao fim: "Se é escrito, escreva o roteiro inteiro antes e leia no seu ritmo." (os quatro modos passam a ter instrução; hoje o escrito fica sem).'
diagramacao:
  - 'p012 -> p013: o nome próprio "Vila Itapura" é hifenizado na virada de página ("Vila Ita-" no pé da p012, "pura…”" no alto da p013). Proibir hifenização em nomes próprios (hyphens: none num span, ou &shy; bloqueado) ou ajustar a linha.'
  - 'p015, figura 7.1: os cabeçalhos "Respostas" e "Conversa" já não se tocam, mas ficam a cerca de 1 mm um do outro, e o olho ainda os lê juntos. Quebrar "Respostas" em "Respos-/tas" não serve; melhor reduzir meio ponto no corpo dos cabeçalhos ou fixar a largura das colunas para ter pelo menos 2 mm entre os rótulos.'
  - 'p013: cerca de 20% em branco no pé da página, porque o box Conceito vai inteiro para a p014. É a terceira rodada com esse branco. Se a correção do problema 1 alongar a cena, conferir de novo; se não, aceitar.'
  - 'p018 (cerca de 55% em branco antes do autodiagnóstico) e p022 (cerca de 55% em branco antes do esqueleto indivisível): brancos aceitos pelo projeto; registro só para a conferência final.'
veredito: "Capítulo aprovado por margem estreita (média ponderada estimada de 9,1). Resolveu as três pendências da r2 e quase todos os ajustes menores; faltam separar nas cenas o oral do dialógico, desfazer o exemplo de secundário que se contradiz, dar um caminho na oficina a quem cai em Perfil difuso e soltar o molde sinal/risco/remédio das subseções."
