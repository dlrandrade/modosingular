bloqueadores: []
pontos_fortes:
  - 'A cena de abertura é de editora e mostra o modo da Renata sem dizê-lo: "desenhou no ar, com as mãos, uma coluna que amanhece travada e vai soltando ao longo do dia" / "Marcos não entendeu todos os termos. Entendeu o desenho". O detalhe de ofício está certo (dor pior ao acordar que cede com o movimento, fita na flexão lombar, reumatologista antes do exercício), e o fecho "Não liga para o Instagram dela." resolve a tese numa fala de personagem.'
  - 'Tem frases que o leitor sublinha e que não são clichê do mercado digital: "a média da profissão, com o nome dela em cima"; "Dizia que ela atende coluna, o que é verdade; que gosta de alongamento, o que é meia verdade; e que se parece com todas as outras, o que é falso"; "cresce na velocidade de outra pessoa"; "No caso da Renata, trabalhou contra, e por pouco não ganhou."'
  - 'A seção das três razões (reflexo, sinais que só aparecem ao vivo, escrúpulo), agora aberta por "Há um paradoxo aqui: quem sabe mais costuma aparecer menos", é o que o capítulo acrescenta ao PWA e desarma a objeção do público ("não tenho jeito para isso") antes que ela apareça.'
  - 'A regra de ouro está íntegra do conceito ao roteiro: "a coluna, o contrato, o balanço, a reforma, a ansiedade, o dente"; o roteiro de fala é o esqueleto dito em voz alta, com a ressalva de ética no lugar certo. Lint limpo (1 "não é/é", 0 frase-soco, 0 travessão, média 17 e desvio 11), 16 páginas (p011 a p026), autodiagnóstico numerado e inteiro na p020.'
resolvidos_das_anteriores:
  - 'r4, bloqueador da faixa moderada: resolvido para o caso testado na r4 (soma 18 com 1 nas linhas 5 e 6 cai agora em "a sua presença já trabalha a favor"). Resta uma lacuna para quem circula 3 (ver problemas, aplicabilidade).'
  - 'r4, "Há um paradoxo aqui." sem referente, "por pouco não trabalhou contra", "meça" -> "estime", faixa baixa com direção das colunas, numeração das linhas da tabela, exemplo da advogada de família, farmacêutica no campo 06, distratores da q3, "só" na correta da q3, "Este livro trata de diminuí-la", campo 02 com 4 linhas: todos resolvidos e conferidos nas páginas.'
  - 'r4, tique "muita gente": resolvido (a cardiologista virou observação de personagem; "Muita gente que recebe o nome de um médico" saiu). Resta "costuma(m)" três vezes (ver problemas).'
  - 'r4, edições de linha ("havia duas Renatas", "existe, mas circula", "mesmo número de pacientes", "fatos, não adjetivos", exemplo do faça em outra área) aplicadas. Diagramação: contorno no reflexo da p011 resolvido; notas da fig. 1.1 seguem pequenas.'
problemas:
  - criterio: coerencia
    trecho: "Renata não resolveu nada naquela noite. Só guardou a frase do Marcos num papel, dentro da gaveta da recepção."
    por_que: 'Contradição interna de cena. O texto já pôs Renata em casa naquela noite ("À noite, em casa, a frase voltou"; "Naquela noite, ela fez uma conta"), e a gaveta da recepção fica no consultório. O leitor atento tropeça justamente no parágrafo que faz a ponte para o elenco.'
    correcao: '"Renata não resolveu nada naquela noite. Escreveu a frase do Marcos num papel e, na manhã seguinte, deixou-o na gaveta da recepção, a poucos passos da cadeira onde ele tinha sentado."'
  - criterio: clareza
    trecho: "Mas ela tem uma condição de funcionamento cara: exige presença física ou uma pessoa intermediando. Não trabalha enquanto você atende outro cliente, nem no sábado, nem no mês em que você sai de férias."
    por_que: 'O sujeito escorregou. No PWA, quem "não trabalha enquanto você atende" é a sua autoridade; aqui virou "ela", a indicação, e a frase fica falsa: a indicação é justamente o que trabalha enquanto você atende outro cliente ou está de férias (o ortopedista indica a Renata no consultório dele, em qualquer dia). "Exige presença física ou uma pessoa intermediando" também é circular, porque indicação já é uma pessoa intermediando. O leitor exigente percebe e desconfia do argumento que sustenta a q2.'
    correcao: '"Mas ela tem uma condição de funcionamento cara: depende de alguém se lembrar de você na hora certa, e a sua competência só entra em campo quando a pessoa indicada chega à sala. Até lá, ela só tem o seu nome, e é com ele que vai procurar você." (a última frase prepara o parágrafo do Marcos abrindo o perfil). Manter "E tem dono, porque depende da memória e da boa vontade de quem indica."'
  - criterio: aplicabilidade
    trecho: "Se em alguma delas você circulou 4 ou 5, a distância existe e já pesa […]. Se nas três você circulou 1 ou 2, a soma veio das outras linhas e a sua presença já trabalha a favor."
    por_que: 'Testada linha a linha, a faixa moderada deixa sem leitura quem circulou 3 ("Mais ou menos") em alguma das linhas 2, 5 e 6 e não passou de 3 nas outras: 4+3+4+3+3+3 = 20 ou 5+3+5+5+3+1 = 22 não se encaixam em nenhuma das duas frases, e "Mais ou menos" é a resposta mais comum de um leitor que se estima com cautela. A faixa alta tem o problema vizinho: começa afirmando "Existe uma distância grande" sem condição, mas 5+3+5+5+3+2 = 23 cai nela com as linhas de distância em 3, 3 e 2, e as linhas 1, 3 e 4 (que não medem distância) fizeram 15 dos 23 pontos. É o caso que a lição cap01-r4 manda testar ("só afirma o que aquelas linhas medem"). O leitor não recebe uma leitura errada, recebe nenhuma ou uma exagerada; por isso não é bloqueador.'
    correcao: 'Moderada, última frase: "Se nenhuma passou de 3, a soma veio sobretudo das linhas 1, 3 e 4: a distância é pequena, e o trabalho é tornar sistemático o que já funciona." Alta: "Com essa soma, pelo menos uma das linhas 2, 5 e 6 passou do meio. Comece pela que tem o número mais alto: é ali que a distância se forma. Se nenhuma chegou a 4, a distância é real, mas menor do que a soma sugere." (as três leituras continuam cabendo na coluna; se não couber, cortar "É desconfortável de ler").'
  - criterio: coerencia
    trecho: "O que a incomoda é saber que, na semana seguinte, vai gastar metade de uma consulta desfazendo o que ele ensinou."
    por_que: 'A cena antecipa o mecanismo que é a cena principal do cap. 2 (paciente chega com um rótulo de vídeo curto; Lúcia passa três sessões desfazendo). Quem ler os dois capítulos em sequência lê a mesma batida duas vezes, e a lição cap02-r1 já registra "passar a consulta desfazendo o que outro ensinou" como ideia com cota. O problema do trecho é reconhecimento (é o que o parágrafo diz: "ele mexe com reconhecimento"), e a cena ilustra outra coisa, retrabalho clínico.'
    correcao: 'Trocar a consequência por uma cena de reconhecimento, sem retrabalho clínico: por ex., a cardiologista vê o rapaz de camiseta convidado para falar no congresso regional da especialidade (ou na associação do bairro onde ela atende há vinte anos), e ela não. Manter "A raiva é compreensível. O problema é que ela não publica nada."'
  - criterio: voz
    trecho: '"A coluna da esquerda fabrica uma presença; a da direita revela uma que já existe." / "O método deste livro é a forma de pensar e de trabalhar essa matéria; ele nunca é o assunto." / "Ninguém precisa ouvir você falar de presença digital. As pessoas precisam ouvir você falar do problema que você resolve."'
    por_que: 'A seção "O que este livro não vai pedir" tem, além do próprio quadro comparativo, três antíteses explícitas seguidas (fabricar/revelar, método/assunto, presença digital/problema), mais "Elas justificam a distância sem diminuí-la um milímetro. Este livro trata de diminuí-la." A lição cap01-r1 fixa no máximo uma antítese explícita por seção; aqui a cadência binária vira a música da seção inteira, justo depois de um quadro que já é binário.'
    correcao: 'Manter só a última (é a regra de ouro, e é a melhor). "O método deste livro é a forma de pensar e de trabalhar essa matéria; ele nunca é o assunto." -> "O método deste livro é a forma de pensar e de trabalhar essa matéria." Parágrafo das colunas: "A coluna da esquerda obriga você a sustentar um personagem, e isso cansa em poucas semanas. A da direita dá trabalho no começo, porque exige olhar para o próprio ofício com atenção, mas depois pede menos esforço: cada peça sai de algo que você já faz."'
  - criterio: concretude
    trecho: "A primeira tem catorze anos de consultório, uma pergunta que nenhum colega faz e uma coleção de casos que outros deram por perdidos."
    por_que: 'Rigidez matinal é pergunta de anamnese de manual para dor lombar (é critério clássico de dor lombar inflamatória); um fisioterapeuta lê "nenhum colega faz" e discorda na hora, e a frase soa como indireta à própria categoria, o que o capítulo proíbe no "Evite". O que é marca da Renata, segundo a bíblia, é fazer a pergunta a TODO paciente, e o próprio texto diz depois que para ela "é simplesmente o que se pergunta".'
    correcao: '"A primeira tem catorze anos de consultório, uma pergunta que faz a todo paciente, mesmo quando a queixa parece simples, e uma coleção de casos que outros deram por perdidos."'
  - criterio: voz
    trecho: '"O resultado é o que costuma acontecer quando ninguém decide" / "Por que os melhores costumam ter a distância maior" / "quem sabe mais costuma aparecer menos"'
    por_que: 'A lição nova (cap01-r4/cap02-r2) limita a 2 por capítulo as generalizações "costuma(m)", "muita gente", "quase todo" sobre terceiros; há três "costuma(m)" na prosa, mais "quem é bom raramente sabe que precisa contar" e "A assimetria raramente fecha". A primeira é a mais fácil de cortar, e o mesmo parágrafo ainda diz três vezes que ninguém decidiu ("nunca foi uma decisão", "Ninguém jamais decidiu", "quando ninguém decide").'
    correcao: 'Cortar "Ninguém jamais decidiu o que o perfil deveria dizer sobre ela a quem ainda não a conhece." e fechar o parágrafo com "Deu no que dá quando ninguém decide: a média da profissão, com o nome dela em cima."'
  - criterio: aplicabilidade
    trecho: "Uma dentista: “O convite para falar na associação de pais da escola do meu filho, que foi para uma colega que eu nunca vi atender.” Seja específico: um nome, um mês, um valor aproximado."
    por_que: 'O exemplo não cumpre a instrução que vem logo depois dele: não tem mês nem valor, e o leitor copia o exemplo, não a instrução. "Que eu nunca vi atender" é uma alfinetada leve na colega, o tipo de indireta que o capítulo manda evitar (lição cap01-r2 sobre exemplos). E dentista (e corretor de seguros, no campo 02) também aparece como figurante no cap. 2, contra a lição cap02-r2 de não repetir profissões em capítulos vizinhos.'
    correcao: '"Uma dentista: “Em março, o convite para falar sobre cárie na associação de pais da escola do meu filho foi para uma colega que eu só conhecia de vídeos. Três famílias da escola passaram a tratar com ela.”" Quanto às profissões repetidas, o cap. 1 tem precedência: trocar no cap. 2 e registrar.'
  - criterio: honestidade
    trecho: "A indicação é excelente, mas precisa de alguém que a acione e depende da memória de quem indica. A presença digital retira essa condição."
    por_que: 'No gabarito (Apêndice A), "retira" é absoluto e promete mais do que o capítulo sustenta: a prosa diz que a presença faz "parte da confiança" ser construída antes do encontro, não que dispense quem indica.'
    correcao: '"A presença digital afrouxa essa condição: parte da confiança chega antes do encontro, mesmo sem alguém que indique."'
  - criterio: ritmo
    trecho: '"A consulta começa alguns passos adiante, porque parte da confiança foi construída…" / nó 4 da fig. 1.2: "A conversa começa alguns passos adiante."'
    por_que: 'A mesma expressão, a meia página de distância (p018), na prosa e na figura que vem logo depois. A figura parece legenda do parágrafo em vez de síntese.'
    correcao: 'Nó 4: nota "Já sabe como você pensa antes da primeira conversa."'
edicoes_de_linha:
  - 'Virar influenciador, ou mudar de profissão sem perceber. -> Virar influenciador, que é mudar de profissão sem perceber. (a vírgula + "ou" faz parecer duas coisas; é uma só, e a segunda explica a primeira).'
  - 'O que não vai ser pedido / O que vai ser pedido -> O livro não pede / O livro pede (a voz passiva é de edital, e repete o intertítulo logo acima).'
  - 'Guardar 2: ("não tenho tempo", "não gosto") -> ("não tenho tempo", "não gosto de aparecer") ("não gosto" sozinho fica truncado).'
  - 'Entrega da oficina: a sua dependência de indicação posta em números e a explicação confortável posta à prova -> a sua dependência de indicação em números e a explicação confortável posta à prova (dois "posta" na mesma frase).'
  - 'Roteiro: Quase todo mundo acha que o problema, nesse caso, é {o problema aparente}. -> Parece que o problema, nesse caso, é {o problema aparente}. (ensina ao leitor a generalização sem fonte que o livro corta da própria prosa; o esqueleto pode manter "O que todo mundo acha", que é instrução, não fala).'
  - 'Escolher o próprio público fica fora de alcance. -> Escolher o próprio público fica difícil. (absoluto demais para quem vive bem de indicação, que o texto acabou de admitir que existe).'
  - 'uma cardiologista com vinte anos de consultório que abre o celular -> manter, mas se a cena for trocada (ver problemas) conservar "rapaz de camiseta", que já está registrado como imagem do cap. 1.'
  - '"sem que" aparece quatro vezes na prosa ("sem que ninguém notasse", "sem que ela tivesse feito nada de errado", "sem que ninguém pedisse", "sem que você estivesse na sala"), mais uma no autodiagnóstico: trocar uma delas, de preferência "sem que ela tivesse feito nada de errado" -> "por nada que ela tivesse feito".'
diagramacao:
  - 'p016: cerca de 30% de página em branco depois de "Não significa.", porque o quadro comparativo (indivisível) foi para a p017. Não é seção de página inteira nem campo de escrita; é branco evitável. Deixar o quadro flutuar para o alto da p017 com o parágrafo "A coluna da esquerda…" correndo na p016, ou reduzir o respiro interno do quadro para que caiba.'
  - 'p014: cerca de 20% em branco no pé; o intertítulo "A conta que ninguém faz" com as primeiras linhas do parágrafo caberia ali. Conferir as regras de keep-with-next/orphans do h2 (duas ou três linhas bastam).'
  - 'p013: cerca de 12% em branco depois do box Conceito; o parágrafo de três linhas "A confiança que você gera existe…" caberia. Provável margem inferior do box somada à do parágrafo.'
  - 'p015, fig. 1.1: notas das barras seguem em itálico cinza claro de corpo pequeno (pendente desde a r1). Legível, mas é o texto mais fraco da página: 8,5 pt e cinza mais escuro.'
  - 'p019: "Para guardar" sozinho com cerca de 70% em branco, antes do autodiagnóstico de página inteira. Aceito pelo projeto.'
  - 'p021, p022 e p023: brancos de 15 a 20% no pé antes de campos indivisíveis e do esqueleto. Aceitos pelo projeto.'
veredito: "Capítulo no nível de uma boa editora de não ficção e sem bloqueadores; passa no gate com média ponderada de cerca de 9,15, e as correções que faltam são de uma frase cada: a gaveta da recepção naquela noite, a indicação que \"não trabalha enquanto você atende\", a faixa moderada sem leitura para quem circula 3 e a cena da cardiologista, que antecipa o cap. 2."
