capitulo: 27
iteracao: 2
notas: {metodo: 8.8, voz: 9.0, originalidade: 8.5, clareza: 9.0, ritmo: 8.9, concretude: 9.2,
        coerencia: 8.3, aplicabilidade: 8.9, impresso: 8.7, honestidade: 9.1}
bloqueadores: []
pontos_fortes:
  - 'A r2 resolveu quase tudo o que a r1 apontou, e resolveu bem. Os quatro silenciosos viraram "mais duas pacientes"; o furo do telefone fechou ("o número que uma achou na lista do convênio e que a outra ganhou de uma amiga"); o CRP entrou na oferta ("que o código exige em qualquer divulgação", conferido: art. 20, a, do Código de Ética do Psicólogo); a rede lembra os conselhos; a porta ganhou campo (05); a irmã substituiu a secretária no teste; "degrau" ficou fixo em todo o capítulo; o roteiro fecha a frase ("Se você {tem ou vive o quê}").'
  - 'A cena ética continua sendo a melhor da Fase V: a linha do 188 que "passou a pôr em todas as respostas desse tipo", "Sentiu mais responsabilidade do que satisfação" e, na oferta, "Lúcia escreveu essa linha antes de todas as outras, e foi a única que não mudou em nenhuma revisão". Aqui a ética aparece como gesto de ofício, sem sermão.'
  - 'A oferta agora nasce de uma pergunta ("a resposta foi a oferta"), coerente com o modo da Lúcia, e ganha um detalhe de ofício verificável: a cópia impressa deixada com a secretária, e o adolescente encaminhado "seguindo a oferta". É a demonstração, em cena, de que a exclusão também protege.'
  - 'A oficina ficou completa: seis campos com exemplos em profissões diferentes (professora de inglês, contador, engenheira agrônoma), campo 01 feito de memória, critério sobre "prazo para o resultado" e checklist com um campo para cada item. A verificação tem corretas em 1, 0, 2, 3 e distratores falsos para qualquer profissão.'
problemas:
  - criterio: originalidade
    trecho: "Quem pergunta a cada cliente novo como ele chegou, e anota a resposta com as palavras dele, passa a enxergar o degrau que as métricas escondem. Lúcia não perguntava. Passou a perguntar em toda primeira sessão"
    por_que: 'A correção da r1 tirou a conta de agenda do cap. 26, mas pôs no lugar o mecanismo que abre o cap. 28: "Helena tinha começado a perguntar, a todo cliente novo, na primeira ligação, como tinha chegado ao escritório" e "Nenhum dos três tinha curtido a peça". Aqui temos "Lúcia foi procurar os nomes nas curtidas e nos comentários, e não encontrou nenhum". O campo 01 da oficina repete, quase palavra por palavra, a instrução final do campo 01 do cap. 26 ("A partir de hoje, pergunte a cada cliente novo como chegou e anote" contra "Daqui em diante, pergunte a cada cliente novo como chegou e anote com as palavras dele"). São três capítulos seguidos com a mesma descoberta: quem chega nunca curtiu, e é preciso perguntar. Isso fere as lições cap02-r1 (cena repetida entre capítulos) e cap08-r1 (solução reservada a outro capítulo). O painel de quatro números é do 28.'
    correcao: 'Deixar o "perguntar a cada cliente novo" para o 28 e tirar a busca nas curtidas. No parágrafo do quarto degrau, parar em "“Você falou uma vez de pedir ajuda.”" e fechar com uma frase da Lúcia, não com regra: "Lúcia passou a ouvir essas frases de outro jeito: não como elogio, mas como o rastro que o perfil não mostrava." No parágrafo das duas pacientes, cortar "Lúcia foi procurar os nomes nas curtidas e nos comentários, e não encontrou nenhum." No campo 01, tirar a última frase ou remeter ao 26: "Se você anota desde o capítulo 26 como cada cliente chegou, releia as anotações."'
  - criterio: metodo
    trecho: "Lúcia pediu à amiga do grupo que a pergunta daquela semana fosse a da leitora: como faço para marcar?"
    por_que: 'Em novembro, a leitora já é paciente. O próprio texto diz que a pergunta publicada é a dela, e cita a mensagem literal ("Como faço para marcar?"). Para a personagem de "cuidado extremo com sigilo", que no cap. 13 espera meses para que nenhum paciente receba um texto como recado, transformar em peça pública a mensagem de alguém que está em terapia com ela há poucas semanas contradiz o método (lição cap13-r1) e o arco F5 ("a oferta sem quebrar vínculo, dentro do código"). A pergunta é genérica e ninguém seria identificado, mas a paciente se reconheceria. Justamente no capítulo de ética, o caso-modelo não pode deixar essa brecha.'
    correcao: '"Lúcia pediu à amiga do grupo que a pergunta daquela semana fosse uma que ninguém tinha feito em público, e que agora ela sabia que muita gente fazia calada: como alguém que lê você marca uma conversa?" Ajustar também "que a leitora da quinta-feira, se tivesse lido a oferta, reconhecesse nela" para "que alguém como a leitora da quinta-feira reconhecesse nela", já que a leitora não é mais o público da oferta.'
  - criterio: metodo
    trecho: "Tabela: O que cada distância pede"
    por_que: 'O primeiro critério do PWA vale 3 pontos: "Identifiquei em que estágio está a maioria da minha audiência. Sei se preciso de alcance ou de aprofundamento". Ele sumiu da apostila. Nenhum campo da oficina pede ao leitor que se situe na escada, e a tabela 27.1, que diz o que publicar em cada degrau, fica sem uso prático. Metade do conceito do capítulo, a distância, não chega à oficina, que trata só do último metro e da oferta.'
    correcao: 'Reescrever o campo 01 (o que também resolve o problema anterior): rótulo "Em que degrau está a maior parte de quem acompanha você, e como você sabe"; exemplo "Pense nos seus últimos clientes novos: quantos citaram algo que você publicou? Se quase nenhum, a maioria ainda está entre o segundo e o terceiro degrau, e a tabela 27.1 diz o que falta publicar. Uma fonoaudióloga: “Leem, mas ninguém cita. Preciso de mais critério e menos dica.”" Checklist: "Sei em que degrau está quem me acompanha (campo 01)".'
  - criterio: coerencia
    trecho: "Renata fala dela no fim de um áudio, uma vez por mês, com a mesma voz com que explica a dor."
    por_que: 'Contradiz o cap. 26, em que Bianca passa a "guardar o convite para marcar, que antes ia no fim de quase toda legenda, para uma peça de ação a cada duas semanas". O 26 também fixa a regra de que "uma peça de reconhecimento que termina em “agende” muda de natureza no último segundo". Aqui a frequência é outra (mensal contra quinzenal), e o lugar ("no fim de um áudio") é justamente o que o 26 condenou. O leitor que leu os dois capítulos em dias seguidos percebe.'
    correcao: '"Renata dedica um áudio inteiro, uma vez a cada dez, a dizer quem ela atende e quem não, com a mesma voz com que explica a dor." Avisar o cap. 26, que está em revisão, para alinhar "a cada duas semanas" à referência de uma a cada dez peças (no ritmo de duas por semana, a cada cinco semanas, mais ou menos).'
  - criterio: coerencia
    trecho: "Na semana depois da oferta, a secretária recebeu três ligações de gente que citou os textos."
    por_que: 'O cap. 28 abre com "três empresários" que citaram a mesma peça e "Nenhum dos três tinha curtido a peça". São dois capítulos vizinhos com três pessoas que chegam citando o texto, e isso fere a lição cap08-r1 (números de personagens diferentes nunca coincidem). O número do 28 está no plano ("trouxe três consultas"), então quem muda é o 27.'
    correcao: '"…recebeu duas ligações de gente que citou os textos. Uma marcou a primeira conversa. A outra era a mãe de um adolescente, e a secretária, seguindo a oferta, passou o contato de uma colega que atende jovens." (A mãe ligando é também mais verossímil do que um adolescente marcando sozinho.)'
  - criterio: coerencia
    trecho: "Um contador: “Empresas com folha acima de cinquenta pessoas; para essas, indico um escritório com equipe de departamento pessoal.”"
    por_que: 'A lição cap02-r2 proíbe repetir profissões de figurantes em capítulos vizinhos. O cap. 26 tem uma contadora duas vezes (campo e Faça assim), e o cap. 28 tem "um contador" que manda o link. Com este, são três capítulos seguidos com contabilidade.'
    correcao: 'Trocar por uma profissão sem uso entre os caps. 25 e 29, com a exclusão tecnicamente certa. Por exemplo: "Um cardiologista: “Arritmias que precisam de ablação; para essas, indico um eletrofisiologista.”"'
  - criterio: ritmo
    trecho: "Lúcia descobriu que o telefone da descrição era de quatro anos antes porque uma pessoa, depois de sete meses, precisou perguntar."
    por_que: 'A frase repete a informação da abertura ("o do consultório antigo, de quatro anos antes, desativado") sem trazer nada novo, e é a quarta vez que "sete meses" aparece na prosa ("Sete meses de leitura silenciosa", "tinha passado sete meses construindo", "tinha passado sete meses lendo"). No mesmo trecho, o parágrafo do quarto degrau ("Os três primeiros degraus estão na figura…") tem sete frases, uma acima do limite (lição cap01-r2).'
    correcao: 'Cortar a última frase do parágrafo "A última linha é a mais simples…", que passa a terminar em "Faltou logística." Na abertura, trocar "Lúcia tinha passado sete meses construindo" por "Lúcia tinha passado todo esse tempo construindo". No parágrafo do quarto degrau, fundir "Nele, a pessoa sabe como você pensa… É ali que a preferência se forma." em "Nele, a pessoa sabe como você pensa e consegue adivinhar o que você diria sobre um assunto novo, e é ali que a preferência se forma."'
  - criterio: clareza
    trecho: "Naquela sexta, Lúcia pediu à irmã, que nunca tinha marcado nada com ela, que tentasse marcar pelo perfil, sem ajuda."
    por_que: 'A cronologia volta atrás sem aviso. O capítulo já avançou para "Nas semanas seguintes" (duas pacientes) e para "naquele ano" e depois retorna à sexta de outubro, três blocos e uma tabela depois. O leitor apressado precisa reconstruir de que sexta se trata. A irmã curiosa, além disso, já é um recurso da Renata (caps. 5, 9 e 19). A Lúcia tem a mãe em Santa Cruz do Sul (cap. 8), que é uma testadora melhor: de outra cidade, noutro celular, sem nenhuma intimidade com perfis.'
    correcao: '"Na mesma sexta em que respondeu à leitora, Lúcia ligou para a mãe, em Santa Cruz do Sul, e pediu que ela descobrisse pelo perfil, sem ajuda, como marcar uma consulta com a filha. A mãe levou quatro minutos e acabou mandando mensagem…"'
  - criterio: honestidade
    trecho: "Cada degrau acontece na cabeça de quem lê. Nenhum deles aparece nos números das suas peças."
    por_que: 'A segunda frase é falsa ao pé da letra. O alcance conta exatamente quem chegou ao segundo degrau (viu uma peça), e curtidas e comentários pegam parte do terceiro. O que os números não mostram é em que degrau cada pessoa está, e sobretudo o quarto, que é a tese do capítulo. Um leitor que confira as próprias estatísticas encontra o erro.'
    correcao: '"Cada degrau acontece na cabeça de quem lê. Os números mostram quantos viram; nenhum mostra quem já chegou ao quarto."'
  - criterio: voz
    trecho: "Isso tem uma consequência prática, que vale para qualquer área."
    por_que: 'É o narrador anunciando o que vai dizer (lição cap01-r1, "Dizer, não anunciar"). A frase seguinte já é a consequência.'
    correcao: 'Cortar e começar o parágrafo por "Quem decide se continua publicando olhando para os comentários corre o risco de desistir cedo."'
  - criterio: impresso
    trecho: "p016: o texto termina em “que o código exige em qualquer divulgação.” e o box compara abre a p017"
    por_que: 'O branco de cerca de 25% no pé da p016, apontado na r1, continua lá. O box compara não se divide e não cabe. Não antecede oficina, autodiagnóstico nem esqueleto, então não é branco aceito.'
    correcao: 'Mover o compara para depois do parágrafo "A parte mais importante era a segunda…" ou, melhor, para logo depois do parágrafo "A mesma oferta… O que mudou foi a distância." (p015), onde o contraste entre as duas ofertas nasce e onde há espaço antes da tabela.'
  - criterio: concretude
    trecho: "Naquela tarde, a descrição do perfil passou a ter uma linha só: o telefone da secretária, os dias e o horário em que ela atende, e a informação de que a primeira conversa é para decidir, das duas partes, se o trabalho faz sentido."
    por_que: 'Não cabe "uma linha só" com quatro informações. E, se o próprio capítulo diz que o CRP é exigido "em qualquer divulgação", a descrição do perfil, que é divulgação, também precisa dele. Detalhe pequeno num capítulo que ensina justamente isso.'
    correcao: '"Naquela tarde, a descrição do perfil ganhou três linhas: o número do CRP, o telefone da secretária com os dias e o horário, e a informação de que a primeira conversa é para decidir, das duas partes, se o trabalho faz sentido."'
edicoes_de_linha:
  - '"Nenhuma curtida, nenhuma resposta, nenhuma pergunta à amiga do grupo de estudos que pudesse ter vindo daquela pessoa." -> "Nenhuma curtida, nenhuma resposta, nenhuma mensagem." (as perguntas vêm da amiga, não dos leitores; a frase confunde o mecanismo)'
  - '"mais ou menos a cada dois meses e meio no ritmo dela" -> "pouco mais de dois meses no ritmo dela" (dez terças são setenta dias; conta de personagem tem de fechar)'
  - '"para o número que uma achou na lista do convênio e que a outra ganhou de uma amiga, já paciente" -> "para um número que uma achou na lista do convênio e a outra ganhou de uma amiga, já paciente"'
  - '"Uma engenheira agrônoma: “Na primeira visita, ando a lavoura com você" -> "Uma engenheira agrônoma: “Na primeira visita, percorro a lavoura com você"'
  - '"subtitulo: O caminho da confiança quando ninguém pediu para ser vendido" -> "subtitulo: O caminho da confiança quando ninguém pediu uma oferta" (“pediu para ser vendido” é decalque e soa como se a pessoa fosse a mercadoria)'
  - '"Informar o que ela faz e para quem, porém, é permitido, e útil." -> "Informar o que ela faz e para quem, porém, é permitido e útil."'
  - '"E como marcar, com o telefone da secretária e o número do CRP" -> "E como marcar: o telefone da secretária e, ao lado, o número do CRP"'
diagramacao:
  - 'p016: branco de cerca de 25% no pé, antes do box compara (p017). Já tinha sido apontado na r1 e não foi resolvido. Ver o problema de impresso.'
  - 'p020: a seção "Do caderno para a rede" começa no pé da página, com o título e só duas linhas da intro, cortada no meio da frase ("confira / antes o que o seu conselho…"), e deixa ~15% em branco. Forçar quebra antes da seção da rede ou manter título, intro e primeira regra juntos (break-inside/keep-with-next).'
  - 'p011: a ilustração trocou "ponte" (cap. 13) por "semente", que é a do cap. 8, também da Lúcia (e do 19). A r1 pediu que dois capítulos da mesma personagem não abrissem com a mesma imagem, e isso continua acontecendo. "iceberg" não foi usado em nenhum dos 30 capítulos e serve exatamente à tese. Legenda sugerida: "Os comentários são a ponta. Quem vai procurar você está abaixo da linha d’água."'
  - 'p021: branco de ~40% antes do esqueleto indivisível (p022). É aceito pelo projeto, fica só registrado.'
veredito: "Salto real desde a r1, com contradições, furo do telefone, conselho e oficina resolvidos, mas ainda abaixo de 9: a descoberta de que quem chega nunca curtiu e o conselho de perguntar a cada cliente repetem o 26 e antecipam o 28, a oferta publica a pergunta de uma paciente atual, a oficina perdeu o diagnóstico do degrau e há atritos com os vizinhos (Renata, três ligações, contador)."
