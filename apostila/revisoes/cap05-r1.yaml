capitulo: 5
iteracao: 1
notas: {metodo: 8.7, voz: 8.3, originalidade: 8.4, clareza: 8.6, ritmo: 8.5, concretude: 8.8,
        coerencia: 7.8, aplicabilidade: 8.0, impresso: 7.6, honestidade: 7.9}
bloqueadores:
  - 'Erro de fato na figura 5.2 (p015), que contradiz o próprio rótulo e o texto. A marca diz "as linhas se cruzam" em D23, mas com os dados do manuscrito (energia 58 -> 44 entre D15 e D20; custo incompatível 48 -> 52) a energia passa por baixo do custo por volta de D17. Na página, o cruzamento aparece claramente à esquerda de D20, e a linha tracejada de D23 cai num ponto em que as curvas já estão separadas. Além disso, o eixo põe D1, D5, D10, D15, D20, D23 e D30 à mesma distância (intervalos de 4, 5, 5, 5, 3 e 7 dias), o que deforma as inclinações. O erro vem do PWA, mas no papel ele é o gráfico central do capítulo, e o leitor atento percebe. Correção: dados que cruzem em D23, por exemplo energia [95, 85, 76, 68, 60, 54, 46] e custo incompatível [38, 40, 43, 46, 50, 54, 60] (em D20, 60 contra 50; em D23, 54 contra 54), e eixo proporcional aos dias, ou rótulos equidistantes D1, D5, D10, D15, D20, D25, D30 com a marca em 23 posicionada por interpolação.'
  - 'Problema ético num detalhe de ofício, lido por um público de saúde: "ela chegava a anotar algumas no verso das fichas dos pacientes". A ficha do paciente é prontuário, documento clínico com regras de guarda e sigilo; anotar nele ideias para publicar é exatamente o tipo de prática que o livro promete não pedir (ver "Antes de começar", aviso sobre ética). Fisioterapeutas, psicólogos e médicos leitores vão notar. Correção: "e ela chegava a anotar algumas num bloco que ficava ao lado do computador, sem nome de ninguém".'
  - 'Problema legal na cena que o livro oferece como modelo: "ela gravou no carro, parada num semáforo, um áudio de um minuto". Manusear o celular ao volante, mesmo com o carro parado no semáforo, é tratado como infração pelo Código de Trânsito (art. 252). O livro não pode dar como cena exemplar uma infração, e o detalhe "Levou menos tempo do que o sinal fechado" reforça a imagem. Correção: ver o problema de originalidade sobre o áudio; se a cena ficar, "ela gravou no carro, ainda estacionada na garagem do consultório, um áudio de um minuto…" e cortar "Levou menos tempo do que o sinal fechado".'
pontos_fortes:
  - 'A cena de abertura é de editora: o detalhe que dispara a quebra é pequeno e humano ("uma paciente que chorou metade da sessão, porque a dor nas costas tinha voltado na mesma semana em que ela perdeu o emprego"), o gesto é seco ("Fechou o computador. Nunca mais abriu aquele arquivo.") e a desmontagem da culpa vem pela irmã, com fatos e sem sermão ("Renata acorda às seis há catorze anos, não falta a um paciente, faz as próprias anotações clínicas no mesmo dia, sempre.").'
  - 'O caso do Aurélio é a melhor invenção do capítulo e resolve o método por dentro: a tese é demonstrada com o próprio ofício da Renata ("Trocou os vinte minutos por três exercícios curtos, feitos em pé, atrás do balcão da portaria, em três momentos do turno em que o movimento caía"; "Costuma dizer que exercício bom é o que o paciente faz"). Detalhe de ofício exato (turno de doze horas, adesão alta na primeira semana e queda quando a dor melhora, retorno marcado antes da desistência).'
  - 'O deslocamento da peça da rede foi bem feito no essencial. O capítulo prepara a virada na prosa (Renata aplica aos pacientes o raciocínio que não aplicou a si mesma), a rede fala do que os clientes do leitor abandonam, o exemplo da farmacêutica ("quando a pressão normaliza") é preciso e o roteiro, com a nota "A peça fala dos seus clientes e do que eles tentam fazer, nunca da sua rotina de publicação", respeita a regra de ouro.'
  - 'Honestidade intelectual acima do PWA: a seção "Quando o formato é inocente" ("Seria desonesto dizer que toda desistência é culpa do formato") dá um teste simples para separar energia de formato, e o número mágico do PWA é desarmado ("O número vinte e três é dela; não serve de regra para ninguém. Para outras pessoas a conta deixa de fechar no décimo primeiro dia, ou no quadragésimo."). Figuras rotuladas como ilustrativas.'
  - 'Formulações próprias que um leitor sublinha: "A taxa parece suportável no primeiro dia e se torna impagável no vigésimo"; "Por isso as primeiras duas semanas de qualquer rotina de publicação dizem pouco sobre a rotina. Quase tudo funciona enquanto é novo."; "O problema tinha endereço, e o endereço não era ela."'
  - 'Lint limpo (0 "não é/é", 0 frase-soco, 0 travessão, 0 interrogação, média de frase 16,2, desvio 8,4), cinco intertítulos, arco da Renata compatível com o cap. 1 ("Houve um mês em que tentou publicar a cada dois dias, e parou no vigésimo terceiro dia sem saber explicar por quê").'
problemas:
  - criterio: coerencia
    trecho: "Para uma pessoa que pensa escrevendo, como o Otávio, o carrossel talvez fosse natural."
    por_que: 'A bíblia determina que cada personagem encarna um dos quatro modos e que "o leitor só descobre isso na Fase II, mas os sinais estão plantados desde a Fase I"; o cap. 7 existe para essa revelação. O cap. 5 entrega o mapa inteiro com rótulos: Renata é "uma pessoa que pensa falando" (texto, oficina campo 04 e verificação q4), Otávio "pensa escrevendo", Lúcia "ganha clareza quando alguém lhe faz uma pergunta", e o parágrafo "Os outros três personagens deste livro ilustram bem a variedade dessas taxas" associa cada um ao seu formato fraco. O cap. 7 fica sem surpresa.'
    correcao: 'Mostrar comportamento, sem rótulo de modo. Linha 23: "O plano de três carrosséis por semana exigia que ela, que explica tudo em voz alta e desenhando no ar, transformasse todo dia uma fala em texto curto e estruturado…". Linha 37: "Para Otávio, que escreve pareceres longos por gosto, o carrossel talvez fosse natural." Cortar do parágrafo dos outros personagens a frase da Lúcia (que é também especulação: "provavelmente se sentiria perdida") e o fecho "a próxima fase do livro trata de descobrir o seu". Na oficina e na q4, trocar "pensa falando" por "explica falando".'
  - criterio: originalidade
    trecho: "Na mesma semana, por curiosidade, ela gravou no carro, parada num semáforo, um áudio de um minuto com a explicação que não tinha conseguido transformar em carrossel."
    por_que: 'Terceiro capítulo seguido que termina com a mesma batida: o personagem grava algo rápido no celular e descobre que custa quase nada. Cap. 3: Caio grava "em uma tomada só" e "Levou quatro minutos entre ligar a câmera e publicar". Cap. 4: Otávio "gravou no celular, entre uma audiência e outra, três minutos" e depois "ouviu o áudio no carro". Cap. 5: Renata grava no carro. O leitor da Fase I passa a prever o fim de cada capítulo. A cena ainda antecipa a descoberta do modo oral, que o arco reserva para a Fase II, e os áudios do cap. 19. E contém a infração de trânsito apontada nos bloqueadores.'
    correcao: 'Trocar a gravação por uma constatação sem aparelho: "Na mesma semana, contou nos dedos quantas vezes tinha dado aquela explicação sobre dor e movimento: quatro, a quatro pacientes diferentes, de pé, com as mãos, sem cansar. A explicação não custava nada. O que custava era outra coisa, e ela ainda não sabia o nome." Assim o capítulo guarda a descoberta do formato para a Fase II.'
  - criterio: coerencia
    trecho: "Durante vinte e dois dias, Renata publicou um carrossel a cada dois dias"
    por_que: 'O cap. 2 abre com a mesma estrutura: "Durante vinte e um dias seguiu um protocolo" e "No vigésimo segundo dia…", seguida da mesma conclusão ("o problema era ela"), que o cap. 5 inverte em "O problema tinha endereço, e o endereço não era ela". Três capítulos depois, parece repetição de molde, não eco pensado. Dentro do próprio capítulo, o plano também oscila: "a cada dois dias" (3,5 por semana) e, na frase seguinte, "três por semana", repetido em "O plano de três carrosséis por semana" e na q4.'
    correcao: 'Assumir o eco em uma frase, para que ele vire argumento: no parágrafo "Com ela mesma, o raciocínio desapareceu", acrescentar "A Débora da Lúcia tinha feito o mesmo com um protocolo de vinte e um dias; o mercado muda o assunto, e a conclusão é sempre a mesma." Uniformizar o plano como "um carrossel a cada dois dias" (coerente com o cap. 1 e com o dia 23 ser dia de publicar): "montou um plano: um carrossel a cada dois dias, sete lâminas cada"; "O plano de um carrossel a cada dois dias exigia…"; q4 a: "Que não tinha ideias suficientes para publicar a cada dois dias."'
  - criterio: aplicabilidade
    trecho: "Se nunca tentou, pense em outra rotina que abandonou, como academia, curso ou dieta."
    por_que: 'A lição da r1 do cap. 1 vale aqui: o autodiagnóstico precisa de caminho para quem não publica, e as faixas não podem afirmar o que a escala não mede. A instrução manda pensar em academia ou dieta, mas os itens falam de "antes de cada peça", "antes de publicar", "me impedia de publicar", "a peça pronta", e as faixas leem "O formato que você usa combina razoavelmente com você" e "Você vem tentando sustentar uma linguagem que não é sua". Quem nunca publicou (o perfil da Lúcia, parte grande do público) responde itens que não se aplicam e recebe uma leitura sobre um formato que não usa. A oficina tem o mesmo buraco: o campo 02 lista "Ter a ideia, estruturar, gravar ou escrever, editar, publicar", etapas que não existem numa dieta.'
    correcao: 'Itens neutros: "Eu adiava começar mesmo com o tempo livre reservado." / "Eu precisava me preparar mentalmente antes de cada vez." / "Eu refazia a mesma coisa várias vezes antes de dar por pronta." / "Eu sentia alívio quando um imprevisto me impedia de fazer." / "Eu olhava o resultado e achava que ele não tinha nada a ver comigo." / "A tarefa consumia a energia que eu queria ter para o trabalho." Acrescentar à instrução: "Se você respondeu pensando em outra rotina, leia a faixa como pista sobre o seu jeito de abandonar, e não como veredito sobre um formato." No campo 02 da oficina: "Se a rotina foi outra, escreva as etapas dela (por exemplo: separar a roupa, chegar à academia, treinar, voltar)."'
  - criterio: aplicabilidade
    trecho: "Renata: “Eu penso falando. O carrossel me obrigava a traduzir tudo para texto curto depois de dez horas de atendimento.”"
    por_que: 'Viola a lição "exemplos da oficina em profissões diferentes da do personagem em foco" e repete o que o leitor acabou de ler na prosa, em vez de ampliar o repertório. É também o terceiro lugar em que o modo da Renata é rotulado.'
    correcao: 'Um professor de cursinho: “Sem a lousa e sem aluno na frente, eu não sabia por onde começar o vídeo. Regravava a abertura cinco vezes e desistia no meio.”'
  - criterio: aplicabilidade
    trecho: "O raciocínio deste capítulo vale para os seus clientes. Na sua área também existe algo que exige constância e que as pessoas abandonam, e é sobre isso que a peça fala."
    por_que: 'O deslocamento da rede está certo, mas a oficina não produz nada para ela: os 25 minutos são todos sobre a rotina do leitor, e ele chega ao esqueleto sem ter anotado o que os clientes abandonam nem em que etapa. Perdeu-se ainda a regra mais forte do PWA, "Traga o número", que no deslocamento viraria o momento da quebra ("na terceira semana", "quando a pressão normaliza"). E o tempo não fecha com o pacto (30 a 45 minutos): leitura (~9), autodiagnóstico (~5), oficina (25), rede sem tempo indicado e verificação passam de 50.'
    correcao: 'Abrir a rede com uma ponte explícita e curta: "Faça com um cliente o que você acabou de fazer consigo, como Renata fez com o Aurélio: o que ele abandonou, em que etapa, e o que mudou quando o plano mudou." Trocar a regra 2 por: {regra: "Diga quando a desistência acontece.", porque: "“Na terceira semana” ou “quando a dor melhora” mostra que você já viu isso muitas vezes; “com o tempo” não mostra nada."}. Indicar "10 minutos" na rede, ou reduzir a oficina a 20 minutos.'
  - criterio: honestidade
    trecho: "Quase todo especialista faz o mesmo, porque o mercado oferece sempre a mesma leitura para esse tipo de desistência"
    por_que: 'Afirmação empírica sem fonte, a família que a r1 do cap. 1 mandou cortar ("quase todo mundo faz isso hoje"). O capítulo repete o recurso: "a frase que quase todo especialista usa nessa hora", "que não aparece em nenhum tutorial", "Quase sempre descobre", e, na figura 5.3, "Noventa peças medianas fazem mais do que cinco excelentes", apresentada como fato. Esta última ainda contradiz a tese do livro, que no cap. 1 critica justamente "a média da profissão, com o nome dela em cima". Nas faixas, "o resultado é aritmética pura" afirma causa que a escala não mede, e "O seu ganho nos próximos capítulos virá de sistema e captura" é promessa.'
    correcao: '"Muita gente faz o mesmo, e não por acaso: a leitura que circula para esse tipo de desistência é quase sempre a mesma." / "resumiu com a frase de sempre: …" / "uma etapa extra que ninguém vê e que gastava exatamente a energia…" (cortar "que não aparece em nenhum tutorial"). Figura 5.3: "Presença acumulada — Muitas peças simples, uma depois da outra, dizem mais sobre você do que cinco caprichadas." Faixa alta: "Os sinais apontam para uma forma de criar que não combina com você. Não tente de novo com mais força; a Fase II existe para trocar a engrenagem." Faixa baixa: "…Os próximos capítulos, de sistema e captura, devem ajudar mais do que uma troca de formato."'
  - criterio: honestidade
    trecho: "O que costuma resolver é {o ajuste que você propõe}."
    por_que: 'Para as profissões de saúde, "o ajuste" dito em público pode virar orientação de tratamento a distância, e o exemplo da própria página é sobre suspender remédio de pressão. O livro promete lembrar os códigos "onde importa"; aqui importa.'
    correcao: 'Acrescentar ao "Evite": "Propor em público uma mudança de tratamento que só cabe numa consulta. O ajuste da peça é de método (horário, lembrete, com quem conversar), e não de dose." No exemplo da farmacêutica, deixar o fecho implícito: o ajuste é "conversar com quem prescreveu antes de parar".'
  - criterio: voz
    trecho: "Renata não teve um ataque de preguiça no vigésimo terceiro dia; teve uma conta que parou de fechar."
    por_que: 'O lint zera o "não é/é", mas a antítese migrou para formas que ele não conta, e em densidade de assinatura: "Renata ajusta o plano, e não a pessoa."; "Ele não ficou mais disciplinado de uma hora para outra. O plano é que passou a caber no dia dele."; "ela culpou a pessoa em vez do plano"; "Nenhum deles tem menos disciplina que os outros. Cada um tem…"; "Renata não parou por causa de uma viagem… Parou numa quinta-feira comum"; esta; "e não depois dela"; "Renata não precisava de mais força de vontade. Precisava descobrir…". A seção de abertura tem três; a da curva, três. A lição é no máximo uma antítese explícita por seção. O tema convida à antítese; justamente por isso ela precisa ser rara.'
    correcao: 'Manter uma por seção e afirmar as outras. Exemplos: "Renata ajusta o plano à pessoa." / "Aurélio nunca mais parou. O plano passou a caber no dia dele." / "No vigésimo terceiro dia, a conta de Renata parou de fechar." / "Parou numa quinta-feira comum, um pouco mais pesada que as outras…" (cortar a frase da viagem) / "É justamente nesse ponto que ela marca um retorno, para ajustar o plano antes da desistência." / "Renata precisava descobrir qual etapa custava caro e trocar a etapa…".'
  - criterio: voz
    trecho: "Uma boa regra, que vai reaparecer quando o livro tratar de ritmo, é prometer pouco e em silêncio"
    por_que: 'O narrador que anuncia voltou em forma de remissão: "a próxima fase do livro trata de descobrir o seu", esta, "assunto do capítulo 8", "isso é assunto da próxima fase do livro", "é a pergunta do próximo capítulo", além de "A Fase II vai ajudar a isolá-la" nas faixas. Seis anúncios em 1.800 palavras é voz de curso. Somam-se as muletas "O mais curioso da história é que", "Os outros três personagens deste livro ilustram bem", "vai muito além do tempo gasto", "parece acadêmica, mas muda tudo".'
    correcao: 'Deixar no máximo uma remissão numerada (a do cap. 8, que é útil) e cortar as outras: "Uma boa regra é prometer pouco e em silêncio, e deixar que a regularidade apareça sozinha."; "Ainda não sabia o que faria com aquilo." Muletas: "Renata passa os dias aplicando, em outro assunto, exatamente o raciocínio de que precisava."; "Os outros três personagens pagam taxas diferentes."; "Toda peça publicada tem um custo, e o tempo é a menor parte dele."; "A diferença entre as duas leituras decide o que você faz depois de uma desistência."'
  - criterio: ritmo
    trecho: "De onde vêm essas ideias, e como não deixar que se percam, é a pergunta do próximo capítulo."
    por_que: 'O texto corrido termina anunciando o capítulo seguinte (lição: "fecho termina em consequência prática; não listar as seções seguintes"), e depois dele vem uma figura que a prosa nunca comenta (5.3), de modo que o capítulo fecha num esquema solto. A última seção virou depósito: o intertítulo "Quando o formato é inocente" cobre dois parágrafos, e sob ele estão a nota, a autópsia da Renata, o áudio, as ideias que não faltavam e a figura.'
    correcao: 'Fundir os dois primeiros parágrafos de "Quando o formato é inocente" ao fim de "Disciplina ou compatibilidade" (mantendo a frase "Seria desonesto…" como abertura do trecho) e renomear a última seção "O endereço do problema", que passa a cobrir a autópsia. Mover a figura 5.3 para logo depois de "A segunda leitura transforma cada tentativa frustrada em dado", onde ela ilustra a lógica. Fechar em consequência: "O que faltou foi um caminho barato entre a ideia e a publicação, e esse caminho se constrói, coisa que força de vontade nenhuma faz."'
  - criterio: ritmo
    trecho: "O vigésimo terceiro dia foi uma quinta-feira."
    por_que: 'Parágrafos acima do teto de 6 frases da bíblia: este (7), "Duas coisas acontecem ao mesmo tempo nessa curva." (7) e "Fazer essa pergunta exige um pouco de investigação…" (8, com a sequência de notas em frases nominais que, lida em voz alta, soa como planilha).'
    correcao: 'Partir o primeiro em "…ficou quarenta minutos diante da primeira lâmina em branco." / "Sabia exatamente o que queria dizer…". No da curva, abrir parágrafo novo em "O formato compatível fica mais barato…". Na autópsia, juntar as notas numa frase: "Ter a ideia recebeu 2; estruturar a sequência de lâminas, 8; escrever o texto de cada uma, 10; escolher cores e imagens, 6; publicar, 1."'
  - criterio: clareza
    trecho: "termo: Custo invisível da linguagem errada"
    por_que: 'O conceito fala em "linguagem", o texto fala quase só em "formato", e entre os dois circulam "forma de criar", "modelo de conteúdo", "método" e "engrenagem". "Linguagem" só reaparece na faixa alta. Como "linguagem criativa" é o termo-síntese da Fase II (cap. 12), o leitor apressado não sabe se linguagem e formato são a mesma coisa. Um leitor que precise explicar o conceito a outra pessoa tropeça exatamente aí.'
    correcao: 'Uma frase logo depois do box: "Linguagem, aqui, é o jeito como você transforma o que pensa em algo que outra pessoa recebe: falando, escrevendo, contando, respondendo. O formato (carrossel, vídeo, texto) é a parte visível dela, e é nele que o atrito aparece primeiro." Depois disso, usar "formato" sempre e cortar "modelo de conteúdo" e "método" quando se referirem à mesma coisa.'
  - criterio: concretude
    trecho: "O mesmo vale para quem pensa contando histórias e tenta escrever listas de dicas, ou para quem pensa melhor respondendo a perguntas e tenta gravar monólogos para a câmera."
    por_que: 'Fora do universo da Renata, o texto corrido não tem nenhum figurante; as outras profissões aparecem só como abstração ("quem pensa contando histórias") ou nos três personagens fixos. A bíblia pede "profissões variadas; nunca um profissional genérico". A promessa do cap. 3 ("O capítulo 5 volta a essa conta com mais cuidado") é paga com meia frase sobre o Caio.'
    correcao: 'Trocar a frase genérica por um caso: "Uma designer de interiores que resolve tudo com amostras de tecido na mão sofre para escrever listas de dicas; o mesmo raciocínio sai inteiro quando ela fotografa a amostra encostada na parede e escreve duas linhas." No parágrafo dos personagens, pagar a promessa do cap. 3: "Caio não teve dificuldade para gravar; o custo dele estava na edição, onze fins de semana para seis vídeos. Quando passou a gravar em uma tomada, no meio da obra, a mesma ideia custou quatro minutos."'
  - criterio: metodo
    trecho: "Que o problema estava no horário noturno em que ela escrevia."
    por_que: 'Distrator que não é inequivocamente falso: o próprio capítulo diz que ela escrevia "à noite, depois do último paciente", que a quebra veio quando o custo passou "a energia que sobrava no fim do dia", e o exemplo da oficina fala em "depois de dez horas de atendimento". Um leitor atento marca (b) com argumento. A correta (c) é a mais longa e a única com o vocabulário do capítulo, e ainda rotula o modo ("o que ela pensa falando").'
    correcao: 'b: "Que os pacientes não se interessavam pelos assuntos dos carrosséis." c: "Que a etapa cara era passar a fala para texto curto."'
  - criterio: aplicabilidade
    trecho: "Sei nomear a etapa e a causa real, sem desculpa (campos 01 e 02)."
    por_que: 'O mapeamento checklist-oficina não fecha: a "causa real" está no campo 04 ("Por que essa etapa custava tanto para você"), e o item 2 ("Dei nota ao atrito de cada etapa") remete aos campos 03 e 04, mas o 04 não tem nota nenhuma. E o campo 03 dá cinco notas para escrever em três linhas soltas, com o modelo impresso em cinza itálico ("Ter a ideia: ___"), sem lugar claro para o número.'
    correcao: 'Item 1: "(campos 01, 02 e 04)". Item 2: "(campo 03)". Campo 03 como quadro de cinco linhas rotuladas (Ter a ideia / Estruturar / Gravar ou escrever / Editar / Publicar) com uma caixa para a nota à direita, mais uma linha em branco para "outra etapa".'
edicoes_de_linha:
  - 'Epígrafe: "Talvez o modelo de conteúdo é que nunca tenha combinado com você." -> "Talvez o modelo de conteúdo nunca tenha combinado com você." ("Talvez… é que…" mistura indicativo e subjuntivo; a frase fica mais limpa sem o realce.)'
  - 'O caso de que ela mais gosta de lembrar é o do Aurélio -> O caso de que ela mais gosta é o do Aurélio'
  - 'Com ela mesma, o raciocínio desapareceu. -> Consigo mesma, o raciocínio desapareceu.'
  - 'Muita gente que se considera inconstante está, na verdade, tentando sustentar -> Muita gente que se considera inconstante está tentando sustentar'
  - 'O problema está no encaixe, como no caso do Aurélio. -> O problema está no encaixe, como estava no plano do Aurélio.'
  - 'Ter a ideia não custava nada: elas aparecem aos montes durante os atendimentos. -> Ter a ideia não custava nada: as ideias aparecem aos montes durante os atendimentos. ("elas" retoma "a ideia", singular.)'
  - 'Os outros três personagens deste livro ilustram bem a variedade dessas taxas. -> Os outros três personagens pagam taxas diferentes.'
  - 'Cada falha vira informação sobre o que não serve. -> Cada falha vira informação sobre o que não serve para você.'
  - 'A solução é trocar o formato, e não a pessoa. -> A solução é trocar o formato. (a coluna da esquerda já faz o contraste)'
  - 'Menos atrito: "Cada peça custa menos energia do que a resistência que gerava." -> "Cada peça custa menos do que custava no formato errado."'
  - 'Reconhecimento: "É aqui que a autoridade atravessa a tela." -> "É aqui que a autoridade chega a quem ainda não conhece você."'
  - 'Rede, regra 1, porque: "Mostrar que o método é que falhou é o que faz a pessoa tentar de novo." -> "Mostrar que o método falhou dá à pessoa um motivo para tentar de novo."'
  - 'Roteiro: "A pergunta que ajuda é outra: qual é o jeito que cabe na vida que você tem de verdade." -> "A pergunta que ajuda é outra: qual é o jeito que cabe na vida que você tem de verdade?"'
  - 'Autodiagnóstico, instrução: "É uma estimativa, não uma sentença." -> "É uma estimativa."'
  - 'Figura 5.1, título: "O custo de uma peça, conforme o formato" -> "O formato errado cobra antes de você começar" (princípio da bíblia: título que afirma). Figura 5.3: "A lógica da constância que se sustenta" -> "Primeiro o encaixe, depois a constância".'
  - 'Registrar em ESTADO.yaml › figurantes a farmacêutica (cap. 5) e, se adotados, a designer de interiores e o professor de cursinho.'
diagramacao:
  - 'Extensão: o capítulo vai de p011 a p026, 16 páginas contra o alvo de 10 a 14, com a prosa praticamente no piso (1.805 palavras). Os brancos da prosa somam quase uma página: p013 (~25%), p016 (~40%), p018 (~20%), p014 (~10%). Os de p019 (antes do autodiagnóstico), p023 (antes do esqueleto indivisível) e p026 (fim) são aceitos pelo projeto.'
  - 'p016: o intertítulo "Disciplina ou compatibilidade" e uma frase de duas linhas ficam sozinhos acima de ~40% de branco; a caixa comparativa abre a p017. É o mesmo defeito apontado na r2 do cap. 1 (p016). Permitir que a comparação quebre entre colunas não é opção; a solução é deixar o parágrafo "A primeira leitura tem um efeito colateral grave…" subir para antes da caixa, ou reduzir o espaço vertical da caixa (itens com 4 linhas cada cabem em ~150 px), para que intertítulo, frase e caixa caibam na p016.'
  - 'p013: ~25% de branco depois do box Conceito, espaço suficiente para o intertítulo "Quanto custa uma peça" e o primeiro parágrafo. Verificar a regra que prende o h2 à figura 5.1.'
  - 'p015: figura 5.2 com o cruzamento em ~D17 e a marca em D23 (ver bloqueador); eixo com intervalos desiguais desenhados como iguais.'
  - 'p012: "riu.Renata" sai sem espaço depois do ponto na página impressa, embora o manuscrito tenha o espaço ("riu. Renata"). Provável efeito do tratamento de aspas de fechamento ("coisas.” A irmã…") na mesma linha; conferir o pós-processamento tipográfico.'
  - 'p012: o versalete de abertura corta o numeral ao meio: "DURANTE VINTE E dois dias". Limitar o versalete à primeira palavra ("DURANTE vinte e dois dias") ou a um grupo sintático completo.'
  - 'p017: o título da coluna direita da comparação quebra com hífen em caixa-alta espacejada ("SE O PROBLEMA É COMPATIBILI-/DADE") e a linha de cima fica justificada com espaços enormes ("S E  O  P R O B L E M A"). Desligar hifenização e justificação nos títulos da caixa (text-align: left; hyphens: none) ou encurtar para "SE É COMPATIBILIDADE".'
  - 'Última linha de parágrafo com sílaba hifenizada: "cum-/prido." (p012), "vigé-/simo." (p014). Pendente da r2 do cap. 1 (hyphenate-limit-chars).'
  - 'p014 e p015: notas e legendas das figuras continuam em Inter itálico cinza pequeno ("quanto menor a barra, mais fácil sustentar" quase some). Pendente da r1/r2 do cap. 1: subir para 8,5 pt e escurecer.'
  - 'p021: campo 03 sem estrutura para as cinco notas (ver problema de aplicabilidade); o modelo em cinza itálico com "___" parece lugar de escrever, mas é pequeno demais para a caneta.'
  - 'p023: ~70% em branco antes do esqueleto; aceito pelo projeto, mas daria para reduzir as linhas do esqueleto (2/3/3/3 -> 2/2/3/2) e trazer o esqueleto para a p023, deixando o roteiro sozinho na p024.'
veredito: "Capítulo com cena, caso clínico (Aurélio) e honestidade intelectual acima da média, e com o deslocamento da rede bem resolvido, mas ainda não aprovável: a figura central contradiz o próprio rótulo, dois detalhes de cena ferem ética e lei (fichas de paciente, celular no semáforo), o texto revela os quatro modos antes do cap. 7 e repete pela terceira vez a batida do áudio barato, e autodiagnóstico e oficina deixam sem caminho quem nunca publicou."
