capitulo: 28
iteracao: 2
notas: {metodo: 9.3, voz: 9.0, originalidade: 8.8, clareza: 8.9, ritmo: 9.0, concretude: 9.3,
        coerencia: 8.6, aplicabilidade: 8.9, impresso: 9.0, honestidade: 9.2}
bloqueadores: []
pontos_fortes:
  - "O bloqueador da r1 foi resolvido de forma que cumpre o método por dentro da cena: 'Otávio pediu a Sílvia que a planilha da agência deixasse de ser semanal e passasse a chegar uma vez por mês, na véspera da primeira segunda-feira'. Veio com o custo emocional honesto ('Nas primeiras semanas, sentiu falta da conferência') e com a constatação que sustenta o conceito: 'a conferência nunca tinha mudado nada do que ele fazia na semana seguinte'."
  - "A abertura segue sendo a melhor cena da fase: a peça do São João levada por uma página de humor e a peça das advertências com doze curtidas, sustentadas por detalhe de ofício exato ('Tinha a gaveta cheia de advertências, todas escritas na mesma tarde'; 'a frase sobre a mesma caneta e a mesma letra'). O quiasmo 'Os mil que curtiram não ligaram. Os três que ligaram não tinham curtido.' faz o conceito sem nenhuma lição."
  - "O custo do alcance errado tem uma camada ética própria e verossímil: quinze empregados que o advogado de empresas não pode orientar, respondidos com o sindicato e o atendimento gratuito das faculdades. A consequência vem pela cena: 'A peça tinha trazido ao escritório exatamente o público que ele não podia atender.' O fecho cumpre o que a r1 pediu: a lista no quadro de cortiça ao lado da folha do Seu Ednaldo (cap. 10) e a peça de feriado do ano seguinte, sem viralizar, 'do lado de quem ele defende'."
  - "A oficina e o checklist ficaram coerentes entre si. Os pesos 4/3/2/1 impedem seguir sem a pergunta de origem (3+2+1 = 6 < 7). Os exemplos agora são concretos e variados (farmacêutica, eletricista, professor de cursinho), e há instrução para quem atende sozinho ('a pergunta vai na primeira mensagem ou na ficha de cadastro')."
problemas:
  - criterio: coerencia
    trecho: "Otávio conferiu os doze nomes que tinham curtido a peça: nenhum era dos três. Dois tinham salvado o texto; o terceiro o recebera por mensagem."
    por_que: "A correção da r1 abriu um furo novo. Três frases antes, o texto diz que um guardou o texto, que outro 'recebeu o link de um contador' e que 'O terceiro não lembrava como tinha encontrado'. Então só um salvou com certeza, e o 'terceiro' que 'recebera por mensagem' é na verdade o segundo. Pior: a plataforma não mostra quem salvou uma peça, só quantos salvaram, e Otávio não teria como saber isso de quem não contou (lição cap03-r3: mostrar como a pessoa chegou ao resultado). O leitor atento de 30 a 60 anos para aqui e volta o parágrafo."
    correcao: "'Otávio conferiu os doze nomes que tinham curtido a peça: nenhum era dos três. O das esquadrias tinha guardado o texto, o segundo o recebera por mensagem, e o terceiro não sabia dizer.'"
  - criterio: clareza
    trecho: "O segundo número já apareceu aqui: os quarenta e um salvamentos e os dezenove envios da peça das advertências."
    por_que: "A r1 pediu a ordem 1, 2, 3, 4. A seção expõe o 1, põe o 2 como cauda de um parágrafo que já tratava de outra coisa (a lista de Helena e as remissões a Caio e Lúcia) e depois passa ao 4 ('O quarto número entrou no painel...') antes do 3 ('O terceiro número pede um critério...'). Sem voltar à figura, o leitor apressado não reconstrói o painel. 'já apareceu aqui' é também um narrador que sinaliza."
    correcao: "Trocar a ordem dos §78 e §80: o terceiro vem antes do quarto. Tirar a frase do fim do §76 e abrir com ela o parágrafo do terceiro número, sem sinalizar: 'O segundo número Otávio já conhecia: quarenta e um salvamentos e dezenove envios na peça das advertências. O terceiro pede um critério para contar.'"
  - criterio: clareza
    trecho: "O envio por mensagem é o sinal que ele passou a olhar primeiro."
    por_que: "Contradiz o painel, que é olhado 'na mesma ordem, do mais importante para o menos importante', com as citações em primeiro lugar e os envios dividindo o segundo com os salvamentos. O leitor fica sem saber qual número vem antes."
    correcao: "'Entre os números da tela, o envio por mensagem passou a ser o que ele olha primeiro.' Ou: 'Depois das citações, o envio por mensagem passou a ser o sinal que ele mais respeita.'"
  - criterio: honestidade
    trecho: "O aplicativo mostra, com destaque, curtidas, alcance e seguidores, porque são os números que ele consegue contar."
    por_que: "A justificativa é falsa pelo próprio capítulo. Dois parágrafos depois o texto diz que o aplicativo conta salvamentos e envios e os põe 'nas estatísticas da conta'. O aplicativo consegue contar tudo isso; ele escolhe o que destacar. A frase atribui à plataforma um limite técnico que ela não tem."
    correcao: "'O aplicativo põe em destaque curtidas, alcance e seguidores.' Ou manter a causa verdadeira: '...porque são os números que fazem as pessoas voltar ao aplicativo.' (esta é opinião do narrador; a primeira forma é mais segura)."
  - criterio: coerencia
    trecho: "Caio tinha descoberto isso por acaso, com uma folha dobrada em quatro sobre a mesa; Lúcia, pelas frases de quem chegava. Helena transformou o acaso em pergunta, e a pergunta em coluna."
    por_que: "A remissão pedida na r1 esquece o precedente mais próximo. No cap. 26, Renata 'marcou, ao lado de cada paciente novo, como ele tinha chegado' e, 'quando ela perguntou mais', transformou a origem em conta; no fim do ano 'refez a conta'. Dizer que foi Helena quem transformou o acaso em pergunta desmente o capítulo anterior ao anterior. O 'isso' também é vago: Caio não descobriu que a métrica só existe se alguém perguntar, porque ninguém perguntou nada à mulher das janelas. Somada ao 'do mesmo jeito que as perguntas recorrentes do Caio' (§82), são duas remissões a Caio num capítulo do Otávio. A cena central já é a quarta versão da mesma descoberta (caps. 25, 26, 27), e ressaltar isso enfraquece o ganho do capítulo, que está no instrumento e no que parar de olhar."
    correcao: "Cortar as duas frases de remissão do §76 e escrever: 'Helena fez da pergunta um hábito da primeira ligação, e da resposta uma coluna.' No §82, cortar 'do mesmo jeito que as perguntas recorrentes do Caio mostravam os assuntos' e fechar em 'as repetições bastavam para mostrar o caminho.'"
  - criterio: aplicabilidade
    trecho: "2. Estatísticas da conta, no primeiro dia do mês."
    por_que: "O número 2 (salvamentos e envios) supõe uma plataforma que os mostre. Parte do público publica em formatos que não mostram nenhum dos dois, ou só um deles: o leitor que pensa falando e publica áudio ou vídeo, o que escreve newsletter ou o que usa um perfil pessoal sem estatísticas. Sem um equivalente, o leitor não fecha o campo 02, e o critério 'tem quatro números' fica inalcançável para ele."
    correcao: "Acrescentar ao exemplo do campo 02: 'Se a sua plataforma não mostra salvamentos ou envios, use o equivalente mais próximo: respostas a uma newsletter, encaminhamentos, quem pediu o link para mandar a alguém.'"
  - criterio: aplicabilidade
    trecho: "Otávio: “Quase todo empresário avalia o advogado pelas ações que ele ganhou. Eu olho as que não chegaram a existir.”"
    por_que: "O exemplo-modelo não cumpre a regra 3 da própria seção ('Entregue o que a pessoa pode olhar sozinha... um indicador melhor, que o cliente consegue verificar sem depender de você') nem o terceiro 'Faça' ('Terminar com uma pergunta que a pessoa pode fazer a qualquer profissional'). Um empresário não tem como contar sozinho as ações que não existiram. Lição cap02-r1: esqueleto e roteiro precisam servir aos exemplos do capítulo."
    correcao: "'Otávio: “Quase todo empresário avalia o advogado pelas ações que ele ganhou. Eu olho as que não chegaram a existir. Pergunte ao seu: dos funcionários que saíram no ano passado, quantos entraram na Justiça?”'"
  - criterio: coerencia
    trecho: "Era um verso de um parecer do ano anterior, sobre escala em feriado, liberado em maio."
    por_que: "Pela linha do tempo dos caps. 21 e 24, os versos começaram na segunda quinzena de dezembro, e é o próprio Otávio quem marca qual verso sai em cada semana. Ele tinha dito a Sílvia que 'Não haveria bandeirinha de São João'. Um texto sobre trabalhar no São João, publicado na semana do São João, foi portanto uma escolha de data feita por ele, e o capítulo não diz isso. O leitor do arco pergunta quem pautou a peça. Dizer isso é também o que dá à cena um ganho: o próprio Otávio escorregou no calendário."
    correcao: "'Era um verso de um parecer de março, sobre escala em feriado, liberado em maio, e Otávio o tinha marcado para a semana do São João sem pensar duas vezes.'"
  - criterio: voz
    trecho: "defende as empresas, e aconselhar empregados, sem saber se do outro lado estava um cliente do escritório, podia pô-lo em conflito com quem ele defende."
    por_que: "'defende' aparece seis vezes no capítulo (§19, duas no §21, §25, §39, §107), três delas em cinco linhas. 'exatamente' aparece quatro vezes (§19, §21, §29, §53). Numa prosa que no resto está limpa, a repetição soa como tique."
    correcao: "§21: '...e ele não podia orientá-las: aconselhar empregados, sem saber se do outro lado estava um cliente do escritório, podia pô-lo em conflito com a própria clientela.' §25: 'as pequenas empresas que são a clientela dele'. Cortar 'exatamente' no §19 ('o que a peça tinha trazido de fato'), no §29 ('mede a parte que menos diz') e no §53 ('tinha feito isso')."
  - criterio: ritmo
    trecho: "Se as curtidas da semana caírem pela metade, Otávio escreve um parágrafo diferente no fim do próximo parecer? Não. Se três clientes seguidos disserem que chegaram por uma peça sobre advertências, ele passa a guardar mais versos sobre documentos? Sim. A primeira é ruído. A segunda é informação"
    por_que: "Duas perguntas respondidas por monossílabos seguidas de 'A primeira... A segunda...' é cadência de sala de aula. É o único trecho do capítulo em que o narrador vira professor. O conteúdo é bom; a forma é de apostila de curso."
    correcao: "'Se as curtidas da semana caírem pela metade, Otávio não muda uma linha do que escreve no fim do próximo parecer. Se três clientes seguidos disserem que chegaram por uma peça sobre advertências, ele passa a guardar mais versos sobre documentos. O primeiro número é ruído; o segundo é informação, e é o que o aplicativo não mostra.'"
edicoes_de_linha:
  - "'os números do painel são pequenos, e tudo bem.' -> 'os números do painel são pequenos, e isso não atrapalha.' ('e tudo bem' é registro de conversa de rede, não do narrador)"
  - "'Sílvia leu o rascunho e disse que ela não ia viralizar.' -> 'Sílvia leu o rascunho e disse que a peça não ia viralizar.' ('ela' pode ser a própria Sílvia)"
  - "'Otávio não respondeu na hora. Antes de dizer não, quis saber o que exatamente a peça tinha trazido.' -> 'Otávio não respondeu na hora. Antes de dizer não, quis saber quem a peça tinha trazido.' (o parágrafo acabou de listar o que ela trouxe; o que ele investiga é quem)"
  - "'e é a pergunta que Helena passou a fazer no começo de junho: como o senhor chegou até nós?' -> manter; conferir que o rótulo do campo 03 ('como você chegou até aqui?') é apresentado como adaptação ('ou a forma que couber no seu atendimento'), para o leitor não achar que a formulação é obrigatória"
  - "'Um especialista não precisa de um painel com vinte gráficos.' -> manter; mas 'O primeiro liga o que você publica ao trabalho que chega' e 'o único dado que liga o que se publica ao que se fatura' e 'O único número que liga publicar e trabalhar' (figura) e 'a ligação entre publicar e trabalhar' (tabela) repetem o mesmo verbo quatro vezes; variar uma delas: 'o único dado que junta o que se publica ao que se fatura'"
diagramacao:
  - "p016: cerca de um quinto da página em branco depois de 'e ainda permite corrigir o rumo', porque a figura 28.2 foi para a p017. A r1 apontou um terço; melhorou, mas o branco continua evitável. Deixar o parágrafo 'Otávio marcou a análise para a primeira segunda-feira...' vir antes da figura, ou pôr a figura depois dele."
  - "p021, esqueleto: nas partes 'O número comum' e 'O que você olha', a segunda das duas linhas coincide com o fio que separa as partes, e sobra na prática uma linha e meia para escrever à mão uma parte inteira da peça. Subir para 3 linhas nessas duas partes e 4 em 'Por que engana'. O quarto de página em branco que já existe no pé da p021 absorve o acréscimo."
  - "p018: cerca de 40% em branco antes da oficina, que começa em página nova. Aceito pelo projeto."
  - "p021/p022: o roteiro (box de ~6 cm) não cabe no pé da p021 e vai para a p022. Branco aceito; com o esqueleto maior (item acima), ele desaparece."
veredito: "Revisão sólida: o bloqueador e quase todos os pontos da r1 foram resolvidos, e o capítulo está no limiar da aprovação. Faltam uma passada de linha e três ajustes: o furo novo sobre quem salvou a peça, a ordem 1-2-3-4 da exposição do painel e o exemplo da rede que o cliente não consegue verificar sozinho."
