capitulo: 14
iteracao: 2
notas: {metodo: 8.9, voz: 8.7, originalidade: 8.6, clareza: 9.0, ritmo: 8.9, concretude: 9.2,
        coerencia: 8.3, aplicabilidade: 8.5, impresso: 8.6, honestidade: 8.8}
bloqueadores:
  - 'Contradição com o método do capítulo anterior, num modelo que o leitor vai copiar. O primeiro "Faça assim" da rede é "“Três pessoas me perguntaram isso nesta semana, então vou responder aqui.”". O cap. 13 põe na coluna "Nunca" o "“Atendi hoje uma paciente que…” O “hoje” data o caso e aponta para a agenda", manda "Desloque também a data da publicação: nunca na semana do atendimento" e dá como regra "Publique a dúvida, nunca o dono dela" (lição cap13-r1). Uma psicóloga, uma advogada ou um médico que abram a peça com "nesta semana" apontam para três atendimentos recentes, e quem perguntou se reconhece. A regra 1 da rede ("Cite a pergunta como ela chega, entre aspas") também colide com a coluna "Nunca" do cap. 13 ("A frase literal de alguém, com as palavras dele") e não traz ressalva nenhuma. A pergunta recorrente só pode ir entre aspas quando é a formulação que muitos usam, e não o jeito particular de uma só pessoa.'
pontos_fortes:
  - 'A nova abertura resolve a repetição apontada na r1 e tem imagem própria: "Ao fundo da foto, sobre a pia, havia uma pasta de recortes aberta, com cozinhas integradas de revista, todas claras, todas sem parede nenhuma." A pasta volta como o custo da posição ("mesmo perdendo o cliente que chega com a pasta de recortes") e amarra cena, conceito e gabarito.'
  - 'A posição que fecha a linha "em aberto" do cap. 12 agora é legal, discutível e tem custo visível na mesa ("Até ali, nenhuma frase dele sobre paredes e pisos tinha custado nada, porque todo cliente que a ouvira concordara. Esta, não."). Respeita os caps. 10 e 12 e não gasta a recusa do cap. 18, porque Caio oferece as duas opções e não recusa o projeto.'
  - 'O detalhe de ofício é exato e memorável: "a integração total costumava trocar um problema de fotografia por três de uso: o cheiro da fritura na sala, o barulho da máquina na hora da televisão, o gás mais perto do sofá". A correção do síndico ("pode barrar a obra enquanto esse plano não chegar") agora bate com a NBR 16280.'
  - 'A aritmética fecha em todos os lugares. 31 × 10 min dão "pouco mais de cinco horas". 19 × 3 dão 57 peças. A curva 57→31 corresponde a +0,5 peça por semana, como dizem a legenda e a prosa ("a cada duas semanas [...] que rende ao menos uma peça"). O desfecho termina em ação, com o resultado em aberto: "O casal ainda não tinha respondido."'
problemas:
  - criterio: coerencia
    trecho: "“Três pessoas me perguntaram isso nesta semana, então vou responder aqui.”"
    por_que: 'Ver o bloqueador. O modelo contradiz a regra de calendário do sigilo que o cap. 13 acabou de ensinar ("nunca na semana do atendimento") e a coluna "Nunca" ("o “hoje” data o caso"). A regra 1 ("Cite a pergunta como ela chega, entre aspas") pede a frase literal sem a ressalva do cap. 13. Para o público de saúde, direito e psicologia, é exatamente o erro que o livro proibiu um capítulo antes.'
    correcao: 'Faça assim: "“Essa é a pergunta que eu mais ouço, há anos.”" (a normalização da fonte, sem data). Acrescentar ao porquê da regra 1: "Use a formulação que muitos repetem, e não o jeito particular de uma pessoa: em profissão com sigilo, frase que só um cliente diria identifica quem perguntou." No roteiro_nota, acrescentar: "Nunca date a pergunta (“nesta semana”, “hoje”)."'
  - criterio: aplicabilidade
    trecho: "Uma por linha, sem traduzir para o jargão da sua área. Na última linha, anote onde esta lista vai morar."
    por_que: 'O campo 01 tem exatamente 15 linhas (p019) e pede 15 perguntas "uma por linha" e, além delas, o lugar onde a lista vai morar "na última linha". São 16 registros em 15 linhas. Quem segue a instrução fica com 14 perguntas e não cumpre o primeiro critério ("São quinze ou mais"), que vale 3 pontos no checklist. As linhas continuam sem numeração, e a r1 tinha pedido de 1 a 15 para o critério ficar verificável num olhar.'
    correcao: 'Campo 01 com 15 linhas numeradas de 1 a 15, e o lugar de guardar num campo curto à parte, logo abaixo: "Onde esta lista vai morar (caderno, nota fixada, pasta):", com 1 linha. A p019 tem folga para essa linha, porque o espaço entre a instrução e a primeira linha é grande.'
  - criterio: metodo
    trecho: "Cada uma com os seus três níveis."
    por_que: 'Contradiz o parágrafo que o capítulo acrescentou, com acerto, à fonte: "Nem toda pergunta tem os três níveis, e não é preciso forçá-los." Contradiz também o "até" da conta ("dão até cinquenta e sete peças"). O "Para guardar" repete a versão forte ("Uma pergunta rende três peças."), e o leitor apressado sai com a regra que o próprio texto desmentiu. É a ideia que ele vai lembrar.'
    correcao: 'Prosa: "Nem todas com os três níveis, mas quase nenhuma com um só." Ou só "Cada uma com mais de um nível." Para guardar: "Uma pergunta pode render até três peças. A literal informa, a estrutural explica, a crítica troca o critério de quem pergunta."'
  - criterio: aplicabilidade
    trecho: "Releia as respostas de nível crítico do seu inventário procurando isso: onde, ao responder, você diz o que não faria."
    por_que: 'A seção inteira "A linha que faltava" desemboca numa instrução que não tem onde ser feita. A oficina responde em nível crítico uma pergunta só, e nenhum campo, critério ou item do checklist registra a recusa encontrada (lição cap01-r1: instrução com consequência precisa de campo). Quando lê o parágrafo, o leitor ainda nem tem inventário. É a ponte com os caps. 10 e 12, e ela fica sem chão.'
    correcao: 'Acrescentar ao campo 05 uma linha final: "Nesta resposta, há algo que você desaconselha? Anote numa frase." Na prosa, trocar por: "Na oficina, depois de escrever a resposta crítica, procure nela o que você desaconselha: é ali que as posições costumam aparecer."'
  - criterio: concretude
    trecho: "Por isso a pergunta que Caio queria que o cliente fizesse era outra: \"O que passa dentro dessa parede, e quem responde por ela?\""
    por_que: 'O esqueleto e o roteiro pedem, na quarta parte, "O critério para respondê-la, que a pessoa pode usar sozinha", e a lição cap02-r3 exige a régua que o cliente usa sozinho. O exemplo da dentista entrega essa régua ("onde a sua gengiva sangra?"). O caso central, não: o leitor vê a pergunta certa do Caio, mas não vê o que o cliente faz com ela antes de chamar alguém. Justamente no modelo que o capítulo mais quer que se copie falta a última parte da peça.'
    correcao: 'Acrescentar uma frase: "E dava ao cliente o primeiro passo para responder sozinho: olhar o que está encostado na parede do lado da cozinha (registro, ralo, ponto de gás, tomada do fogão) e pedir ao síndico a planta de instalações do prédio antes de pedir orçamento a quem quer que seja."'
  - criterio: coerencia
    trecho: "Na mesma noite, abriu o caderno na página das dezenove perguntas e marcou a primeira para quinta: dá para derrubar essa parede? Ao lado, anotou o nível: crítico. O casal ainda não tinha respondido."
    por_que: 'A peça sairia dez dias depois da visita, com o orçamento aberto, sobre a pergunta que aquele casal fez com aquela foto, e no nível que contém a posição que eles ainda estão decidindo se aceitam. Para o casal, a peça seria um recado, e soaria como pressão de venda. O cap. 13 fecha justamente com "A regra do deslocamento vale também para o calendário" e mostra Lúcia esperando semanas. O caso-modelo deste capítulo faz o contrário, logo em seguida.'
    correcao: '"[...] e marcou a primeira para o fim do mês, depois que o casal decidisse: dá para derrubar essa parede? Ao lado, anotou o nível: crítico. Para esta quinta, ficou a do taco." O fecho continua em ação e respeita o cap. 13.'
  - criterio: voz
    trecho: "E ela é quase sempre subestimada por quem a responde."
    por_que: 'O "quase" virou tique: aparece 11 vezes em 1800 palavras ("quase sempre depois da primeira", "quase sempre está apostando", "quase sempre tem, por baixo", "quase sempre subestimada", "quase toda visita", "quase sempre propunha", "quase nunca a da cozinha", "quase todas sobre dor", e "quase ninguém menciona" duas vezes na rede). O capítulo também empilha antíteses curtas de narrador de curso: "A facilidade de responder parecia sinal de pouco valor. É o contrário.", "Esta, não.", "Não inventou a posição para completar a frase. Ela apareceu...", "Quem tem um inventário não precisa ter ideias. Precisa abrir o caderno". E "A conta é simples.", apontado na r1, continua lá.'
    correcao: 'Cortar ao menos metade dos "quase". Por exemplo: "E quem a responde é o primeiro a subestimá-la."; "Quando você escolhe sobre o que publicar, está apostando"; "Depois de explicar o que passava dentro da parede, ele propunha não derrubar". Cortar "A conta é simples." Trocar "Quem tem um inventário não precisa ter ideias. Precisa abrir o caderno [...]" por "Com um inventário, a hora reservada começa com o caderno aberto, a pergunta da semana escolhida e uma única decisão: em que nível respondê-la."'
  - criterio: originalidade
    trecho: "Os outros três montaram inventários de tamanhos diferentes. Renata gravou as dela no carro, uma por áudio"
    por_que: 'É a mesma rodada do cap. 12, quase com as mesmas palavras ("Os outros três chegaram ao enunciado [...] Renata gravou o dela no carro"). A Lúcia que "pediu à amiga" aparece pela quinta vez seguida (caps. 7, 11, 12, 13 e 14). A rodada dos quatro modos virou refrão: o leitor adivinha a frase de cada um antes de lê-la. A r1 pediu que o parágrafo não abrisse pela fórmula, e ele continua abrindo.'
    correcao: 'Reduzir a rodada a um personagem, com um gesto novo e um ganho, e não com o gesto de sempre. Por exemplo, só Otávio e a pergunta de onze anos atrás, que ele ainda respondia do mesmo jeito (essa é a imagem mais forte do parágrafo). Ou abrir pelo número: "Vinte e três, no caso da Renata, quase todas..." (sem "quase", de preferência). Tirar a amiga da Lúcia deste capítulo.'
  - criterio: honestidade
    trecho: "Uma peça bem feita sobre o assunto levaria uma hora para ser preparada e poderia ser ouvida por centenas de pessoas antes de elas chegarem à primeira visita."
    por_que: '"Centenas de pessoas" é uma projeção de alcance sem base, no único parágrafo de contas do capítulo, que o leitor lê como dado. Soma-se às generalizações sobre terceiros que a r1 pediu para reduzir e que continuam acima do limite de duas: "por que tanta gente pergunta a mesma coisa", "são as que mais gente tem", "Quem pergunta se dá para derrubar a parede quase sempre tem", "a parte que mais trava quem está começando" e "Quem acompanha percebe que ele tanto responde quanto questiona" (afirmação sobre um público que o texto nunca mostra).'
    correcao: '"[...] e poderia chegar a quem ainda vai fazer a pergunta, antes da primeira visita." Atribuir ao Caio o que é observação dele: "Nas visitas dele, quem pergunta se dá para derrubar a parede quase sempre tem, por baixo..."; "são as que ele mais ouve e as que responde melhor". Cortar "Quem acompanha percebe que ele tanto responde quanto questiona." ou trocar por "A ideia era que quem acompanhasse visse que ele tanto responde quanto questiona."'
  - criterio: clareza
    trecho: "Otávio achou catorze relendo os e-mails de clientes do último semestre, cada uma com a data em que tinha aparecido pela primeira vez, e completou dezessete na semana seguinte. A mais antiga estava num e-mail de onze anos atrás"
    por_que: 'Quem relê só o último semestre não encontra um e-mail de onze anos atrás. O leitor tropeça e volta à frase. Falta o passo intermediário: a busca no arquivo pela primeira ocorrência de cada pergunta.'
    correcao: '"Otávio achou catorze relendo os e-mails de clientes do último semestre e completou dezessete na semana seguinte. Depois procurou no arquivo a primeira vez que cada uma tinha aparecido: a mais antiga estava num e-mail de onze anos atrás, e ele ainda a respondia do mesmo jeito."'
  - criterio: coerencia
    trecho: "Respondeu como responde há oito anos. Explicou que dependia do que a parede fazia além de separar a cozinha da sala."
    por_que: 'O modo do Caio (pensa CONTANDO; marca "começa com ‘teve uma obra…’"; no cap. 7, "Caio anota casos com começo, meio e fim") não aparece em nenhum momento do capítulo em que ele é o foco. Ele explica, bate na parede, anota perguntas, lista. Sem a batida "contando os passos", corretamente cortada na r1, o personagem perdeu a marca. A lição cap01-r2 pede o modo já na primeira cena.'
    correcao: 'Uma frase basta, e sem repetir a cena de gravação dos caps. 3 e 18. Por exemplo, na visita: "Contou, enquanto olhava o teto, a obra do Castelo em que a parede fina escondia a prumada do prédio inteiro." Ou, em "A linha que faltava", escrever a resposta crítica no caderno "como escrevia tudo, a partir de uma obra".'
  - criterio: clareza
    trecho: "Ela troca a pergunta feita por outra, mais útil para quem perguntou."
    por_que: 'A r1 pediu opções de comprimento parecido, e a correção passou do ponto. Nas questões 03 e 04, a correta é agora visivelmente a mais longa: 68 caracteres contra 50 a 52 na Q3, e "Percebendo, na própria resposta, o que ele sempre desaconselhava." (65) contra 48 a 55 na Q4. O leitor acerta pela forma.'
    correcao: 'Q3 a: "Ela troca a pergunta feita por outra, mais útil." Alongar um distrator: "Ela explica por que a mesma dúvida surge para tanta gente diferente." Q4 d: "Percebendo, na resposta, o que sempre desaconselhava."'
edicoes_de_linha:
  - 'Caio respondeu antes de dormir, com uma frase só [...] Respondeu como responde há oito anos. -> [...] Na visita, explicou como explica há oito anos. ("respondeu" duas vezes em quatro linhas)'
  - 'e o estoque se renova antes de acabar -> e o estoque dura o dobro do tempo (com saldo de -0,5 peça por semana, ele não se renova: acaba mais devagar, como diz a legenda)'
  - 'A conta é simples. Dezenove perguntas em três níveis -> Dezenove perguntas em três níveis'
  - 'Uma corretora de seguros: “Não é ‘quanto custa o seguro do carro’. É ‘o que o meu seguro não cobre’.” -> Uma corretora de seguros: em vez de “quanto custa o seguro do carro?”, “o que o meu seguro não cobre?” (tira o molde "Não é X. É Y" do exemplo que o leitor vai imitar)'
  - 'explicacao Q2: e é mais clara do que a de quem responde pouco. -> e é mais clara do que a versão que ele mesmo dava no primeiro ano de escritório. (alinha o gabarito com a prosa corrigida na r1; tira a comparação com colegas)'
  - '{rotulo: "O que ela deixa de fora", texto: "A variável que quase ninguém menciona."} -> texto: "A variável que fica fora da conversa." (idem no roteiro: "{a variável que fica fora da conversa}")'
  - 'Guarde-o para as perguntas que você mais ouve. -> Guarde-o para as que você mais ouve. ("pergunta" três vezes no parágrafo)'
  - 'Saíram dali satisfeitos, com a resposta que queriam ouvir e as condições que não tinham imaginado. -> O casal ficou satisfeito, com a resposta que queria ouvir e condições que não tinha imaginado. (o apartamento é deles: quem "sai dali" é o Caio)'
diagramacao:
  - 'p012: cerca de 20% em branco no pé. O intertítulo "A pauta que chega pronta" e o primeiro parágrafo desceram inteiros para a p013, mas cabem o intertítulo e ao menos duas linhas. Rever o keep-with-next do h2 (bastam 2 linhas de orphans).'
  - 'p013: cerca de 22% em branco no pé. A figura 14.1 desceu para a p014 e nada ocupou o espaço. Branco evitável; o mesmo problema foi apontado na r1 para esta figura.'
  - 'p019: as 15 linhas do campo 01 continuam sem número (a r1 pediu de 1 a 15), e a instrução "Na última linha, anote onde esta lista vai morar" exige uma 16ª linha. Há folga entre a instrução e a primeira linha para acrescentar o campo curto do lugar de guardar.'
  - 'p017: a figura 14.2 não tem valores no eixo vertical, e o ponto de partida (57) não está rotulado. O leitor vê "sobram 31" e "sobram 5", mas não de onde a linha partiu. "S0 [...] S52" não diz que S é semana: usar "semana 0 [...] semana 52" ou explicar na unidade.'
veredito: "Revisão sólida, que resolveu quase tudo da r1 (posição, abertura, síndico, conta da figura), mas ainda reprovada: o modelo de rede com “nesta semana” contradiz a regra de sigilo do cap. 13, e o campo 01 pede dezesseis registros em quinze linhas."
