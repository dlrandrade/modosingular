capitulo: 23
iteracao: 1
notas: {metodo: 8.8, voz: 9.0, originalidade: 9.1, clareza: 9.0, ritmo: 9.1, concretude: 9.4,
        coerencia: 8.4, aplicabilidade: 8.5, impresso: 8.8, honestidade: 9.2}
bloqueadores: []
pontos_fortes:
  - 'A cena de abertura põe a culpa onde ela deve estar sem transformar ninguém em vilã: Bianca "era boa no que fazia, e fazia de boa-fé", e a virada vem das mensagens de sexta, "posso agendar?" e "pode". O fecho do parágrafo, "Tinha aprovado tudo, e não tinha lido quase nada", entrega o conceito antes de ele ter nome.'
  - 'A volta do Marcos do cap. 1 funciona como medida: "Agora eu acho que voltaria a avisar." Junto com o coração azul que reaparece, a cena rima com a abertura do livro sem repeti-la.'
  - 'A distinção entre cortar e reescrever ("Cortar e reescrever parecem vizinhos e fazem coisas opostas") é própria, operacional e fácil de repetir. A solução do áudio que termina em "a ideia desta peça é", com o alívio da Bianca, mostra a arquitetura nascendo da cena, sem virar esquema abstrato.'
  - 'As contas fecham (2 áudios x 3 formatos = 6 peças; 30 publicações são cerca de cinco semanas; de 6 para 4 quando cai um formato). A figura 23.2 vem rotulada e com legenda honesta, e em nenhum lugar há promessa de resultado.'
problemas:
  - criterio: coerencia
    trecho: '"A dor não é o inimigo, é o alarme" tinha virado "Escute o seu corpo: a dor é um sinal"'
    por_que: 'A frase que a Bianca reescreveu aparece em três versões diferentes no capítulo. No primeiro trecho, o original é "A dor não é o inimigo, é o alarme". Em seguida vira "Reescrever é trocar "a dor é um alarme" por "escute o seu corpo"". Depois, na revisão, o texto diz que "Escute o seu corpo" voltou a ser "a dor é um alarme, e alarme a gente investiga antes de desligar". Num capítulo sobre a frase exata que se perde na reescrita, a própria frase não pode mudar de forma. O leitor atento percebe a incoerência e o argumento perde força.'
    correcao: 'Fixar uma única forma original, a marca do elenco ("a dor não é o inimigo, é o alarme"), e usá-la nos três lugares. Na p. 45: "Reescrever é trocar "a dor não é o inimigo, é o alarme" por "escute o seu corpo"…". Na p. 86: ""Escute o seu corpo" voltou a ser "a dor não é o inimigo, é o alarme", e ganhou de volta a continuação que Renata sempre diz: alarme a gente investiga antes de desligar."'
  - criterio: aplicabilidade
    trecho: 'Uma folha basta: as quatro etapas no alto, com o seu nome ao lado de cada uma, e embaixo as que podem passar, com espaço para o nome de quem um dia fizer.'
    por_que: 'A prosa promete uma folha com nomes, mas a oficina não a produz. O campo 02 é uma grade com as colunas "Só eu" e "Pode passar", cujas linhas repetem a tabela 23.1, que já traz a resposta. O critério "As quatro primeiras etapas do campo 02 estão marcadas como só suas" é cumprido copiando a tabela, e isso é exercício de verificação, não de desenho. Também se perdeu o que o PWA pedia neste campo: "escritos por extenso, com o seu nome em cada um" e "o que eu faria se alguém propusesse mudar isso". Para quem pensa escrevendo, "Transcrever" nem existe como etapa, e a grade genérica não se ajusta ao modo do leitor.'
    correcao: 'Trocar a grade do campo 02 por uma grade de três colunas: "Etapa (como ela acontece no meu modo)", "Quem faz hoje" e "Quem pode fazer um dia (nome ou função)". As quatro etapas vêm pré-impressas no alto, com a instrução "escreva o seu nome", e há 4 linhas em branco para as etapas do campo 01. Acrescentar um campo curto, de 2 linhas: "O que eu respondo se alguém propuser assumir uma das quatro". Reescrever o critério: "Cada uma das quatro etapas tem o seu nome, e as etapas do campo 01 aparecem na parte de baixo com quem faz."'
  - criterio: metodo
    trecho: 'a cada frase, Renata se perguntava se diria aquilo daquele jeito a um paciente'
    por_que: 'No PWA, a revisão é feita "contra o manual de voz" (cap. 11): a figura diz "revisa contra o manual de voz", a diretriz diz "Revise contra o manual, não contra a gramática" e o campo diz "as 5 regras do manual de voz". O capítulo não cita o manual nenhuma vez, embora o cap. 11 o tenha definido como "a régua com que você revisa qualquer texto que leve o seu nome antes de publicar". A pergunta única da Renata é boa, mas vira mais uma régua em vez de usar a que o leitor já escreveu. Também não aparece a outra função do manual no PWA, "Manter visível o manual de voz para quem produz com você", que é justamente o que faria a Bianca parar de reescrever. (A "última frase" ficou de fora, corretamente, porque está reservada ao cap. 24.)'
    correcao: 'Na cena da segunda-feira, fazer Renata entregar à Bianca uma cópia das cinco linhas do manual de voz do cap. 11 e ler, ela própria, com o manual ao lado. A pergunta "eu diria isto assim, a um paciente?" passa a ser a primeira das cinco. No nó 4 da figura 23.1: "Renata revisa, lendo inteiro, com o manual de voz ao lado". No campo 04: "O seu ponto de revisão: quando, onde e contra quais linhas do seu manual de voz (cap. 11)".'
  - criterio: originalidade
    trecho: 'O assunto é uma explicação que você dá quase todo dia no atendimento.'
    por_que: 'A seção de rede repete a do cap. 16 ("A explicação que você repete há anos"; rede "Do jeito que eu explico"). O esqueleto chega a coincidir: "O jeito como você explica: A comparação, o gesto ou a pergunta que você usa" é o campo de comparação do cap. 16. O leitor escreve a mesma peça pela segunda vez em sete capítulos. O PWA tinha um roteiro próprio para este capítulo, que ecoa o tema sem sair da área do leitor ("Uma coisa que eu não delego, e não vou delegar nunca: {o que só você decide}… a decisão de {a decisão central} é minha, caso a caso").'
    correcao: 'Manter a função de peça de controle feita sem ajuda e trocar o assunto pela decisão que o leitor nunca passa adiante NO ATENDIMENTO dele, nunca na produção de conteúdo. Esqueleto na linha do PWA: "O que eu não passo a ninguém" / "Por que não" / "O que isso custa (tempo, agenda)" / "O que o cliente ganha". Roteiro: "No meu trabalho, tem uma decisão que eu não passo a ninguém: {a decisão}. Posso ter ajuda para {as partes mecânicas do atendimento}. Mas {a decisão} eu tomo caso a caso, porque {o que se perderia}. Para quem é atendido, a diferença aparece em {o que o cliente ganha}." Exemplo de Faça: "Uma dermatologista: “A decisão de biopsiar ou não uma pinta, eu não passo a ninguém.”" Evite: "Prometer resultado ou falar mal de quem delega."'
  - criterio: coerencia
    trecho: 'Na semana seguinte, um paciente novo chegou dizendo que tinha escolhido a fisioterapeuta depois de ouvir um vídeo sobre a pergunta que ela faz a todo mundo, a das manhãs.'
    por_que: 'O fecho entrega agora o ganho do arco F5 (o perfil como porta de entrada), e isso bate com o cap. 26. Lá, a conta de junho a agosto, que inclui este paciente de junho, conclui que o perfil "Ainda não trazia pessoa alguma" e que quem citava o perfil "tinha recebido o nome dela de alguém". O capítulo também fica confuso: "a mulher dele tinha dor de manhã havia anos" não deixa claro quem é o paciente e por que é ele quem vem.'
    correcao: 'Fazer o paciente chegar por indicação e usar o vídeo como confirmação, o que antecipa sem contradizer o cap. 26: "Na semana seguinte, um paciente novo, mandado por um dos ortopedistas, contou que antes de ligar tinha ouvido o vídeo sobre a pergunta das manhãs, e que ninguém nunca tinha perguntado aquilo a ele. Renata perguntou, antes de qualquer coisa, como eram as manhãs dele." Cortar a mulher.'
  - criterio: aplicabilidade
    trecho: 'Uma pergunta que dê para responder frase por frase. A de Renata: eu diria isto assim, a um paciente?'
    por_que: 'O exemplo do campo 04 é o da personagem em foco (lição cap01-r1: exemplos da oficina em profissões diferentes). O leitor tende a copiar a pergunta trocando "paciente" por "cliente", e o critério "pode ser respondida frase por frase" aprova a cópia. O campo 05 não diz nada a quem ainda não publica ou não recebe comentários (lição cap01-r1), embora a prosa afirme que a maioria dos leitores produz sozinha.'
    correcao: 'Campo 04: "Uma dermatologista: “Quinta, antes de agendar, com o manual ao lado: eu diria esta frase a uma paciente, no consultório, com esta palavra?”" Campo 05: acrescentar a instrução "Se você ainda não publica, marque a linha 1 como “não acontece” e responda às linhas 2 e 3 pensando nos últimos rascunhos que alguém, ou alguma ferramenta, mexeu por você."'
  - criterio: ritmo
    trecho: 'O problema estava menos no número de peças do que no caminho de cada uma'
    por_que: 'A antítese central (volume contra delegação) aparece no box "Volume não apaga uma voz. O que apaga é passar a voz para outras mãos.", logo depois neste parágrafo, de novo no título e na legenda da figura 23.2 ("O volume não derruba a diferença; o que derruba é o que acontece com a voz") e ainda no Para guardar e na verificação. São quatro vezes na prosa e nos boxes, e a terceira não traz ganho novo (lição cap02-r1). A seção "O que escala" também soma duas antíteses explícitas ("Há etapas… Há outras…" e "O corte cabe… A reescrita…").'
    correcao: 'Abrir o parágrafo 15 pela ação, sem a antítese: "Renata quase cometeu esse erro. Na primeira noite, pensou em voltar às duas peças por semana e dispensar a Bianca. Na manhã seguinte, pegou o carrossel do travesseiro e refez o caminho dele, do áudio à arte: a ideia tinha sido escolhida por outra pessoa, a frase tinha sido trocada, e a aprovação tinha sido dela, do corredor." Cortar a segunda frase da legenda da figura e deixar só "Esquema ilustrativo, sem medição; mostra a lógica do capítulo, não um dado."'
  - criterio: clareza
    trecho: 'Em março, Renata contratou uma assistente.'
    por_que: 'O parágrafo seguinte diz que Bianca "trabalhava à tarde na recepção e aceitou cuidar também do perfil por algumas horas a mais", o que dá a entender que ela já estava lá, e logo depois que "Não conhecia o consultório por dentro", o que não combina com quem trabalha na recepção. O leitor não sabe se ela foi contratada em março ou se ganhou uma função nova.'
    correcao: '"Em março, Renata contratou uma assistente para a recepção da tarde. […] Bianca estudava publicidade e aceitou cuidar também do perfil por algumas horas a mais." No parágrafo seguinte: "Nunca tinha entrado na sala durante um atendimento, não sabia por que Renata perguntava sobre as manhãs…".'
  - criterio: clareza
    trecho: '{nome: "Com a voz passada adiante", pontos: [68, 55, 38, 24]}'
    por_que: 'A 2 peças por semana as duas curvas quase coincidem (70 e 68), e o esquema acaba dizendo que delegar a voz só prejudica quando o volume sobe, o contrário do título e do box, onde o volume é inocente. O leitor apressado sai da figura com a leitura errada: "com pouco volume, posso delegar a voz".'
    correcao: 'Fazer a curva delegada começar já abaixo (por exemplo, 70 contra 58) e cair devagar, para que a distância exista desde a primeira peça e o volume apenas a acumule. Outra opção é trocar o eixo x por "peças publicadas no ano" e o título por "Cada peça com a voz trocada afasta um pouco mais".'
  - criterio: coerencia
    trecho: 'O perfil passou de seis para quatro peças por semana.'
    por_que: 'Logo adiante: "Uma peça por semana seria feita inteira por Renata, do áudio à publicação". Não fica claro se a peça de controle é uma das quatro, o que desmontaria a conta de 2 áudios x 2 formatos, ou se é uma quinta, o que muda o tempo de Renata ("uns quinze minutos" por peça).'
    correcao: 'Deixar explícito: "Além das quatro, uma quinta, curta, seria feita inteira por Renata…". Outra saída: "Um dos dois áudios da semana, a cada semana, seguiria inteiro com Renata, do áudio à publicação", ajustando a contagem.'
  - criterio: honestidade
    trecho: 'A maior parte de quem lê este livro ainda produz sozinho, e talvez continue assim.'
    por_que: 'É afirmação empírica sem fonte sobre os leitores, acompanhada de um "talvez" de narrador. Somada a "Como as duas coisas costumam acontecer no mesmo mês" (box) e a "a escala costuma levar a culpa" (Para guardar), o capítulo generaliza o comportamento de terceiros três vezes (lição cap01-r4: máximo 2).'
    correcao: '"Se você ainda produz sozinho, a arquitetura serve do mesmo jeito, por outro motivo: …". No box: "Como as duas coisas chegaram juntas no caso da Renata, a escala levou a culpa por um efeito que a delegação produziu…".'
  - criterio: coerencia
    trecho: 'Renata riu com ele, e à noite abriu o perfil com calma pela primeira vez em semanas. Rolou as últimas trinta publicações.'
    por_que: 'A mesma batida (Renata, à noite, rola o próprio perfil e descobre um problema) volta no cap. 26 ("Naquela noite, rolou o próprio perfil de cima a baixo") e no cap. 30. Como o cap. 23 vem antes, a cena é dele, mas precisa ser registrada em ESTADO.yaml › imagens para que o cap. 26 a troque (lição cap02-r1).'
    correcao: 'Registrar a imagem "Renata rola o perfil à noite" como do cap. 23 e pedir outra entrada de cena no cap. 26, por exemplo a agenda de papel com a origem de cada paciente, que já existe lá.'
  - criterio: aplicabilidade
    trecho: '- Aprovar sem ler inteiro.'
    por_que: 'Nas perguntas 02 e 03 da verificação, a alternativa correta é visivelmente a mais curta, o que dá uma pista ao leitor (lição cap01-r1: opções de comprimento parecido).'
    correcao: 'Q2: "Aprovar as peças da semana sem ler cada uma inteira." Q3: manter a correta e encurtar os distratores para quatro palavras soltas cada um ("Ideia, edição, legenda e comentários.").'
edicoes_de_linha:
  - 'Na manhã seguinte, fez uma conta diferente. -> Na manhã seguinte, refez o caminho de uma peça. (não há conta nenhuma no parágrafo)'
  - 'Bianca também propôs uma regra, e foi a mais útil de todas. -> Foi a Bianca quem propôs a regra que mais serviu. (ou só: Bianca também propôs uma regra.)'
  - 'O volume se ajustou sozinho. -> O volume se ajustou pelo uso. (a frase de destaque saiu por decisão da revisão, não "sozinha")'
  - 'Não conhecia o consultório por dentro -> Nunca tinha entrado na sala durante um atendimento'
  - 'rolando a tela do celular entre um paciente e outro -> com o polegar, entre um paciente e outro (a imagem do polegar volta na p. 57 e amarra as duas cenas)'
  - 'uma inteligência artificial que reescreve o áudio em tom de postagem -> uma inteligência artificial que reescreve a transcrição em tom de postagem'
  - 'Os comentários elogiam o formato, e não a ideia -> Os comentários elogiam o formato; ninguém discute a ideia (tira a quarta ", e não" do capítulo)'
diagramacao:
  - 'Os PNGs de QA em apostila/saida/qa/cap23/ são anteriores ao manuscrito atual: p013 traz "daquela primavera" e "catorze anos", que o texto já trocou por "daqueles dois meses" e "quinze anos". Avaliei um render novo (build --caps 23 --saida no scratchpad). Refazer o build com --png antes da próxima revisão.'
  - 'p013: cerca de um terço da página em branco depois do fim da seção "O que escala", porque a Tabela 23.1 não coube e foi para a p014. Colocar a tabela depois do parágrafo "As quatro primeiras linhas…", ou deixar esse parágrafo correr antes dela, para encher a p013.'
  - 'p014: branco de cerca de 1/6 no pé da página, porque o box Conceito foi inteiro para a p015. Com a correção da p013, o problema tende a sumir. Se não sumir, permitir que "Cortar e reescrever…" venha depois do box.'
  - 'p016: cerca de um quarto da página em branco antes da Figura 23.1, empurrada para a p017. Subir a figura para logo depois de "redesenharam o caminho de cada peça", ou reduzir a altura dos rótulos laterais (nós 2 e 4 com três a quatro linhas cada).'
  - 'p020: a grade do campo 02 só tem caixas de marcar, sem espaço para nome ou função, o que não serve à "folha" que a prosa descreve (ver problema de aplicabilidade). Se virar grade com nomes, prever colunas de pelo menos 35 mm para escrita à mão.'
veredito: 'Capítulo de cena excelente e conceito claro, mas ainda abaixo do gate: a frase do alarme aparece em três versões, a oficina não produz a folha que a prosa promete nem usa o manual de voz do cap. 11, e a rede repete a peça do cap. 16.'
