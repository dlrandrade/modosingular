capitulo: 19
iteracao: 2
notas: {metodo: 8.8, voz: 8.9, originalidade: 8.9, clareza: 8.9, ritmo: 9.0, concretude: 9.3,
        coerencia: 8.2, aplicabilidade: 8.4, impresso: 8.8, honestidade: 9.2}
bloqueadores: []
pontos_fortes:
  - "O bloqueador da r1 foi resolvido pelo lado certo. A seleção continua semanal, mas separa decidir de liberar: 'Os escolhidos ganham um nome novo, com a palavra \"usar\", o assunto em três palavras e a data a partir da qual podem sair', a pergunta 4 traz a regra do cap. 13 ('Um mês depois do último atendimento em que o assunto apareceu, no mínimo'), a peça da terça sai de um áudio com 'dezoito segundos e seis semanas' e a rede pede 'uma captura aprovada cuja data já chegou'. O fecho em ação ('Ao lado, ela anotou a data de novembro.') amarra o sistema e a regra de sigilo numa imagem só."
  - "A abertura continua a melhor da fase: 'gravação 212, gravação 213, gravação 214', 'o caderninho de capa verde que ficava na gaveta do consultório, com anotações a lápis de quando a bateria acabava'. As contas agora fecham ('setecentos e poucos áudios', 'tinha ouvido mais de cem, pulando os do corredor pelo tamanho'), e a figura 19.2 (31+17+9+6+2 = 65 em agosto) bate com 'três capturas por dia útil'."
  - "O capítulo acrescenta ao PWA uma peça real de método: sem seleção, 'a busca devolve o problema da tela vazia com outra cara, a de um arquivo grande demais'. As perguntas saíram num box numerado e entram pelo gesto da personagem ('No quebra-sol, ao lado do enunciado'), que retoma com precisão o cap. 12 ('Renata prendeu o enunciado no quebra-sol do carro, onde grava')."
  - "Regra de ouro bem guardada na rede: 'O caderno e o jeito de anotar ficam fora dela', com o evite 'Falar do caderno de campo, do seu método ou da sua rotina de anotar'. A regra 2 ('“Ouço isso com frequência” é verdade que a sua agenda confirma. “Muita gente pensa isso” não se confirma em lugar nenhum') é a lição cap02-r1 transformada em instrução para o leitor."
problemas:
  - criterio: aplicabilidade
    trecho: "Escolha uma captura aprovada cuja data já chegou, de preferência uma que tenha aparecido mais de uma vez."
    por_que: "O leitor que segue o pacto de um capítulo por dia abriu o caderno de campo no cap. 6, treze dias antes. Nenhuma captura vinda de atendimento passou um mês, e as que ele acabou de escolher no campo 05 só vencem daqui a quatro semanas. Do jeito que está, a rede pede algo que o leitor ainda não tem, sem dizer o que fazer. O mesmo vale para a oficina: não há instrução para quem tem poucas capturas na última semana (ou nenhuma, se não manteve o caderno), e o campo 05 fica vazio."
    correcao: "Acrescente à intro da rede: 'Se nenhuma data chegou ainda, use uma captura que não veio de atendimento (um incômodo com alguma coisa da sua área, uma pergunta ouvida fora do trabalho), ou rascunhe agora a escolhida com a data mais próxima e grave no dia anotado.' No campo 05, depois de 'Uma por linha, só as primeiras palavras': 'Se a semana tiver menos de cinco, complete com as do caderno desde o capítulo 6.'"
  - criterio: coerencia
    trecho: "Os mais raros e os que mais viraram peça."
    por_que: "A nota da figura 19.2 erra duas vezes. 'Os mais raros' é falso no próprio gráfico: surpresa (6) e incômodo (2) são mais raros que a segunda explicação (9). 'Viraram peça' desfaz a correção da r1, que o texto acolheu ('seis estavam marcados para virar peça'). O resto voltou pela verificação: a opção correta da Q4 é 'Que era raro, mas era o que mais virava peça', e o gabarito diz 'Foram nove áudios, e seis viraram peça'. Com a regra de um mês, áudios de agosto não podiam ter virado peça na segunda semana de setembro. 'Marcados' também tem um furo: em agosto ainda não havia seleção, então não fica claro quem os marcou."
    correcao: "Texto: 'Ouvindo de novo os nove áudios nascidos de uma segunda explicação, achou seis que dariam peça.' Figura: 'Poucos, e os que mais davam peça.' Q4 d: 'Que era pouco frequente, mas era o que mais dava peça.' Gabarito: 'Foram nove áudios, e seis davam peça.'"
  - criterio: coerencia
    trecho: "Nas semanas seguintes, a seleção de sexta passou a durar entre oito e doze minutos. Algumas semanas tinham onze áudios, outras dezenove. Em nenhuma ficou sem as duas escolhidas; em duas, precisou visitar o arquivo antigo."
    por_que: "Não fecha com a regra de um mês que o próprio capítulo acabou de instalar. As escolhidas de uma sexta só ficam liberadas quatro semanas depois. Nas primeiras quatro semanas, toda a produção sai do arquivo, e o parágrafo anterior diz exatamente isso: 'nas primeiras semanas foram eles que encheram a fila, porque já tinham passado da data'. Logo, a visita ao arquivo aconteceu em todas as semanas do primeiro mês, e não 'em duas'. A lição cap01-r1 cobra que as contas dos personagens fechem."
    correcao: "'Em nenhuma ficou sem as duas escolhidas. Depois do primeiro mês, quando as escolhidas das sextas começaram a vencer a data, a fila passou a se encher sozinha, e o arquivo antigo só foi preciso em duas semanas.'"
  - criterio: clareza
    trecho: "Na semana seguinte, publicou uma peça em vez de duas. [...] À noite, percebeu que a captura estava funcionando melhor do que nunca."
    por_que: "A cronologia volta atrás sem aviso. O quarto parágrafo avança para a semana seguinte ('passou a semana com a sensação incômoda'), e o quinto abre com 'À noite', que só pode ser a noite do domingo. O leitor lê a descoberta central do capítulo como se viesse depois da semana."
    correcao: "Inverta os dois parágrafos, ou abra o quinto com 'Na noite daquele domingo, percebeu que...'. Se inverter, o quarto passa a fechar a cena com a consequência prática: a semana com uma peça só."
  - criterio: coerencia
    trecho: "A peça de terça, que ela pretendia gravar naquela tarde, não foi gravada."
    por_que: "O cap. 12 fixou o sustento da Renata: 'Duas por semana, terça e quinta, no carro, antes de ligar o motor'. Gravar no sofá, num domingo à tarde, contradiz o enunciado dela, que é justamente o papel preso no quebra-sol que este capítulo retoma. Mais adiante, 'A produção de terça pega, nessa fila, o que já está liberado' esquece a quinta."
    correcao: "'A peça de terça, cujo assunto ela queria deixar escolhido naquela tarde, ficou sem assunto e não foi gravada.' Mais adiante: 'A produção de terça e de quinta pega, nessa fila, o que já está liberado.'"
  - criterio: metodo
    trecho: "Em que data isto pode sair? Um mês depois do último atendimento em que o assunto apareceu, no mínimo."
    por_que: "A pergunta 1 prefere o que se repete, e a rede é 'A frase que se repete' ('Tem uma frase que eu ouço com frequência'). Mas a pergunta 4 conta o prazo a partir do último atendimento em que o assunto apareceu. Um assunto que volta toda semana nunca completa um mês, e o critério que o capítulo mais valoriza passa a adiar a peça sem fim. O cap. 13 oferece a saída ('ou esperar até que ele se torne um padrão'), mas o cap. 19 não diz como a regra se aplica ao padrão, e o leitor fica com duas instruções que se anulam."
    correcao: "Acrescente uma frase depois do box: 'Quando o assunto já é um padrão, ouvido de muitas pessoas, a data se conta a partir do atendimento de onde sai a frase que vai na peça, e a peça usa as palavras que qualquer um deles diria, nunca a de um só.' Ou restrinja a pergunta 4 a 'Se isto veio de um atendimento...'. Confira a formulação contra o cap. 13 antes de fixar."
  - criterio: aplicabilidade
    trecho: "Nenhuma captura levou mais de 30 segundos."
    por_que: "O critério está na fonte e o teste de atrito também ('Quanto tempo levou cada captura?'). O r1 pediu os dois e nenhum voltou. É a única verificação, no papel, da regra que dá nome ao conceito do capítulo ('o único que custa segundos'). A oficina verifica o lugar, os gatilhos e a seleção, mas não a captura em si."
    correcao: "No campo 01, acrescente uma segunda coluna à grade: 'Leva mais de 30 s?'. Nos critérios: 'O lugar do campo 02 é um em que a captura cabe em meio minuto.'"
  - criterio: voz
    trecho: "Lembrar de capturar no meio de um dia cheio não funciona. O que funciona é amarrar a captura a coisas que acontecem todo dia"
    por_que: "É a antítese 'não X; o que funciona é Y', o mesmo tique do 'não é X, é Y' (lição cap01-r1). O lint já está no limite de nao_e_e com 'Dez minutos também não é um número ao acaso. É o tempo de ouvir quinze áudios'. Somem-se o narrador que anuncia ('e a tabela a seguir mostra o que capturar em cada um') e a frase de conclusão de aula ('O resultado é que nenhum dos três era o caderno de campo'). A cena é madura, e esses trechos a devolvem ao tom de curso."
    correcao: "'Renata amarrou a captura a coisas que acontecem todo dia, de modo que o fim de uma puxe o registro sem esforço de vontade.' 'Dez minutos dão para ouvir quinze áudios curtos em velocidade acelerada e decidir sem pensar demais em nenhum.' Corte 'e a tabela a seguir mostra o que capturar em cada um' (a tabela tem título). 'Nenhum dos três era o caderno de campo.'"
  - criterio: aplicabilidade
    trecho: "Os antigos continuam guardados e entram aos poucos, quando a semana foi fraca, numa visita com hora para acabar."
    por_que: "O gabarito da Q3 descreve a regra antiga. No texto, o critério agora é a fila: 'Quando a fila está curta, ela ouve cinco dos antigos'. Com a data de liberação, a semana pode ter muitas capturas e ainda assim a fila estar vazia. A lição cap02-r2 pede conferir o gabarito contra o texto final a cada reescrita."
    correcao: "'Os antigos continuam guardados e entram aos poucos, quando a fila de liberados está curta, numa visita com hora para acabar.'"
  - criterio: clareza
    trecho: "Quando a fila está curta, ela ouve cinco dos antigos, ao acaso, e escolhe o segundo entre eles."
    por_que: "'O segundo' se lê como o segundo áudio ouvido, e não como a segunda peça da semana."
    correcao: "'Quando a fila está curta, ela ouve cinco dos antigos, ao acaso, e tira deles o que falta para a semana.'"
  - criterio: clareza
    trecho: "Na seleção, só entra a captura da semana. O arquivo antigo é visitado aos poucos, com hora para acabar."
    por_que: "O terceiro item do Para guardar fica no detalhe operacional e deixa de fora a peça nova e mais importante do sistema: decidir não é liberar. O leitor apressado que só releia os três itens perde a regra da data."
    correcao: "'A seleção olha só a captura da semana, escolhe o que o seu ritmo pede e anota a data em que cada escolhida pode sair. A produção pega só o que já está liberado.'"
  - criterio: originalidade
    trecho: "A segunda é o tempo. Uma captura precisa caber no intervalo entre um paciente que sai e outro que entra"
    por_que: "A seção das quatro regras reapresenta boa parte do cap. 6 ('vinte segundos para uma frase crua', 'Sem título, sem estrutura, sem julgamento', 'a nota fica fixada no topo'). O que é novo, a frase do paciente como abertura do áudio e o caso do aplicativo da irmã, fica espremido entre as repetições. 'setecentos' aparece cinco vezes em quatro páginas."
    correcao: "Condense a segunda regra e as duas últimas num parágrafo que remeta ao cap. 6 ('As outras três o capítulo 6 já deu: meio minuto, nada de julgar, nada de estruturar'), e dê o espaço ganho à forma oral da captura. Troque dois dos 'setecentos' por 'o arquivo' e 'os antigos'."
edicoes_de_linha:
  - "procurar alguma coisa nela custava mais do que inventar uma peça do zero -> procurar alguma coisa nele custava mais do que inventar uma peça do zero (concordância com 'arquivo'/'caderno')"
  - "A captura funcionava, com mais de oitocentos registros. -> A captura funcionava, com perto de oitocentos registros. (setecentos e poucos áudios + uns oitenta não garantem 'mais de oitocentos')"
  - "O modo de cada um muda a forma do gatilho, e pouco muda o momento. -> O modo de cada um muda a forma do gatilho. (o parágrafo já fecha com 'O momento continua o mesmo')"
  - "entre uma coisa e outra havia setecentos arquivos com número -> entre uma coisa e outra havia um arquivo inteiro de gravações com número"
  - "Os setecentos antigos ficaram onde estavam. -> Os antigos ficaram onde estavam."
  - "Renata ouviu a mesma crença de julho, com outras palavras. -> manter; é o ganho novo da cena final"
diagramacao:
  - "p. 13: a figura 19.1 continua como na r1. O rótulo do nó 1 quebra no meio da expressão ('Capturar: todo dia, em / segundos'), e o nó 3 sai alinhado à direita numa coluna estreita de dez linhas ('Com a / matéria-prima / escolhida.'). Alargue a área de texto dos nós laterais ou encurte o rótulo ('Capturar: todo dia' / 'Produzir: no seu ritmo')."
  - "p. 13: cerca de 17% de branco abaixo da figura, porque o box Conceito vai inteiro para a p. 14. É evitável: pôr o Conceito antes da figura ou deixar a figura menor."
  - "p. 24–25: a verificação deixa cerca de 25% de branco na p. 24, e o checklist ocupa só o terço superior da p. 25. Não é erro, mas o fechamento em duas páginas meio vazias pesa. Se o layout permitir, suba o checklist para a p. 24."
  - "p. 19 (cerca de 45% em branco antes da oficina) e p. 22 (cerca de 20% antes do esqueleto indivisível): aceitos pelo projeto."
veredito: "O capítulo agora ensina um sistema que respeita o sigilo e termina em cena. Faltam fechar três coisas: a nota da figura e o gabarito, que ainda dizem 'viraram peça'; a conta da fila no primeiro mês; e uma rede que o leitor do dia 19 ainda não consegue cumprir."
