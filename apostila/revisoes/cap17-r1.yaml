capitulo: 17
iteracao: 1
notas: {metodo: 8.7, voz: 8.5, originalidade: 8.8, clareza: 8.9, ritmo: 8.8, concretude: 8.9,
        coerencia: 7.6, aplicabilidade: 8.5, impresso: 8.6, honestidade: 8.6}
bloqueadores:
  - 'Contradição com o método de sigilo no calendário (lição cap13-r1: "o caso-modelo do livro mostra a espera") e com o próprio checklist do capítulo ("Alguém identificável vai se reconhecer como alvo"). No domingo, Lúcia admite que escreve "um pouco" para responder a "uma paciente específica, que tinha interrompido a terapia dizendo que já sabia o que tinha", e a solução mostrada é "Esperou mais dois dias", ou seja, publica no horário de sempre, na terça. Essa ex-paciente é exatamente o perfil de que o texto trata e pode lê-lo como recado, sobretudo se a interrupção for recente (o texto não diz quando foi). O caso-modelo ensina o contrário do que a grade do campo 06 cobra ("Não escrevo para uma pessoa" marcado como "Resolvido"): dois dias de espera não resolvem nada, e a cena não mostra como a pessoa chegou ao resolvido (lição cap03-r3). Corrigir: datar a interrupção (meses antes) e mostrar a resolução em ação. Ex.: na segunda à noite ela relê perguntando de novo para quem escreve, encontra o parágrafo que era para aquela paciente ("quem acha que já sabe o que tem…"), corta, e só então publica; ou adia algumas semanas ("publicou três terças depois") e ajusta a abertura ("só o publicou…") e a questão 04.'
pontos_fortes:
  - 'O modo da Lúcia move a cena: a primeira versão, escrita sozinha "num fim de noite", sai como bronca; a versão que presta nasce das duas perguntas da amiga ("o que ela colocaria no lugar do rótulo, e se já tinha feito aquilo mesmo que agora criticava"). É o modo "pensa respondendo" mostrado em ação, sem ser nomeado.'
  - 'A terceira altura chega pela história do personagem, e não pela tabela: Lúcia dava nome ao sofrimento na primeira sessão, "e aliviava mesmo", e é daí que nasce "rótulo não é diagnóstico". Fecha com a marca do elenco e com o cap. 10 sem contradição.'
  - 'O corte de "vídeos de um minuto que ensinam diagnóstico" por "explicações que cabem num minuto" é detalhe de ofício exato: ensina, numa troca de sete palavras, o que é descrever o fenômeno "sem desenhar ninguém".'
  - 'A substituição proposta por Lúcia (trocar "tive uma crise de ansiedade" por "meu coração disparou na reunião e eu saí da sala") é concreta, executável sozinho, eticamente limpa, e o capítulo nomeia por que ela serve de régua para qualquer contraponto. O comentário da colega que discorda "com educação" e melhora o texto é um ganho novo e verossímil.'
problemas:
  - criterio: coerencia
    trecho: "tinha evitado de propósito qualquer assunto em que tivesse de dizer que alguém estava errado"
    por_que: 'Contradiz os capítulos anteriores. No cap. 2, o primeiro texto da Lúcia já contesta uma ideia pública ("o que falhou foi a promessa de prazo"), e a lista de trinta e uma linhas é de crenças que ela "corrigia toda semana". No cap. 8 e no 13, as peças partem da "lista de crenças". No cap. 12, a posição dela é justamente "Rótulo não é diagnóstico" e o texto diz que ela a publicou: "Resolveu dividindo a posição em duas perguntas, uma em cada semana". O premissa da cena ("Esta seria a primeira peça em que ela diria que uma ideia muito aceita… estava deixando alguma coisa de fora") e o assunto (rótulos) já foram gastos. A frase "Desde que começou a publicar, no capítulo 2" ainda tira o leitor da história: personagem não vive em capítulos.'
    correcao: 'Deslocar a novidade para o que de fato é novo: discordar de algo defendido por COLEGAS, e não corrigir uma crença de paciente. Ex.: "Desde julho do ano anterior, Lúcia corrigia crenças de pacientes, uma por semana, e até tinha dito em duas peças que rótulo não é diagnóstico. Mas sempre falando com quem chega ao consultório. Nunca tinha discordado de uma coisa que colegas dela faziam e defendiam em público. Achava que o lugar da psicóloga era o da escuta…" e "Esta seria a primeira peça em que ela diria que uma prática de colegas que respeitava estava deixando alguma coisa de fora." Cortar "no capítulo 2".'
  - criterio: metodo
    trecho: "O treino em jejum tem defensores sérios, e faz sentido que tenha: para algumas pessoas, treinar cedo sem comer é o único horário possível, e muita gente se sente bem assim."
    por_que: 'O exemplo "singular" deveria modelar o passo 1 ("a posição contrária, na versão mais forte"), mas enfraquece a posição que critica. A versão "comum" ataca o jejum "como milagre" para emagrecer; o singular troca o argumento pela conveniência de horário e pelo "se sente bem", que ninguém contesta. O argumento forte dos defensores (o treino em jejum usa mais gordura como combustível durante o exercício) não aparece, e a fratura ("costuma desistir na terceira semana") fica batendo num espantalho, justamente o erro que o capítulo condena. Além disso, "com uma fruta antes, se precisar" é orientação alimentar vinda de um personal trainer, e o próprio roteiro_nota manda não fazer "prescrição em público"; um nutricionista leitor percebe o desvio de competência.'
    correcao: 'Reescrever o singular: "O treino em jejum tem defensores sérios, e o argumento deles é bom: sem comida no estômago, o corpo usa mais gordura durante o exercício. O que eu vejo com os meus alunos é o que acontece depois. Quem começou em jejum para emagrecer mais rápido costuma desistir na terceira semana, com tontura e fome o dia inteiro. Se é para escolher, eu prefiro o treino no horário em que você consegue ir sempre; o que comer antes, combine com quem cuida da sua alimentação." Ajustar o "porque" para apontar que ele enunciou o argumento do outro lado antes de contestá-lo.'
  - criterio: voz
    trecho: "Discordar de uma prática clínica, de um jeito de tratar, de uma recomendação, é uma coisa. Discordar do jeito como as pessoas nomeiam a própria dor é outra"
    por_que: 'A seção "Por que discordar funciona" empilha três antíteses explícitas: "tem pouco a ver com o assunto ou com o tom. Mora no que sustenta…", o "é uma coisa… é outra" (o padrão "X e Y são coisas diferentes" da lição cap01-r1) e "se sinta mais compreendida, e nunca corrigida". O limite é uma por seção. "Quando não publicar" tem mais duas ("Não com a moda dos rótulos, mas com uma paciente específica"; "não pedem que você desista do assunto; pedem que espere").'
    correcao: 'Ficar com a do "compreendida". Reescrever: "Há também um cuidado próprio de quem atende pessoas em sofrimento. Quando a discordância é sobre o jeito como as pessoas nomeiam a própria dor, quem lê pode ser justamente alguém que se apoia naquele nome para atravessar um período difícil." / "A diferença entre as duas está no que sustenta a divergência e no que ela deixa para quem lê…" / "Lúcia percebeu que a irritação era com uma paciente específica…" / "Qualquer um desses sinais basta para segurar a peça, quase sempre por uns dias ou até uma reescrita."'
  - criterio: coerencia
    trecho: "Os outros personagens têm contrapontos nas três alturas."
    por_que: 'É a chamada de elenco em fila que a revisão do cap. 16 já apontou como tique ("Os outros personagens têm as suas"), e aparece de novo, com a mesma forma, um capítulo depois. O parágrafo ainda cria dois atritos: "é o que os clientes mais repetem" contradiz o cap. 11, onde a frase que a cliente repete é "essa parede está mentindo para vocês"; e Renata "sabe que ainda vai escrever" sobre postura correta, mas o arco dela prevê o contraponto sobre "postura correta" publicado na Fase III, que termina no cap. 18, capítulo do Caio.'
    correcao: 'Dar ao parágrafo uma imagem só, mais longa, de um personagem, e resolver o arco. Ex.: "Renata gravou o dela no mês passado, no carro, contra a ideia de que existe uma postura correta: a melhor postura, dizia no áudio, é a próxima." E, se Caio ficar, trocar "é o que os clientes mais repetem" por "é a história que ele conta com mais gosto".'
  - criterio: honestidade
    trecho: "É, de longe, a menos usada, talvez porque exige admitir um erro em público."
    por_que: 'Afirmação empírica sem fonte ("de longe") seguida de especulação. Somam-se "É comum lembrar, anos depois, de uma opinião contrária que se ouviu uma vez, e de nenhuma das cem…" (tese de psicologia da memória apresentada como fato) e "Na maioria das vezes, eles não pedem que você desista". São três generalizações sobre terceiros; o limite é 2 (lição cap01-r4/cap02-r2). No mesmo parágrafo, "não cria inimigo nenhum, porque o único alvo é você no passado" é absoluto demais: quem conta que deixou de fazer X critica, por tabela, os colegas que ainda fazem X (o caso da própria Lúcia, que deixou de rotular na primeira sessão, é esse). A verificação já diz, com mais cuidado, "a que menos cria inimigos".'
    correcao: '"É a que menos aparece, e dá para entender: exige admitir um erro em público." / "Ela prova que você pensa enquanto trabalha, afasta a suspeita de vaidade e é a que menos cria inimigos, porque o alvo principal é você no passado." / Trocar a frase da memória por uma estimativa do leitor sobre si: "Pense na última opinião contrária que mudou alguma coisa no seu trabalho: você lembra de quem a disse. Das que só confirmavam o que você já pensava, não lembra de nenhuma."'
  - criterio: aplicabilidade
    trecho: "esqueleto:\n  - {rotulo: \"O que se costuma dizer\", texto: \"A posição contrária, na versão mais forte.\", linhas: 2}"
    por_que: 'O esqueleto da rede repete, com as mesmas etiquetas, os campos 02 a 05 da oficina (lição cap02-r2: quando a oficina já escreveu as partes, o esqueleto é "passe a limpo", com esqueleto_rotulo). A repetição custa quase uma página (p. 22) e empurra o esqueleto para página própria, deixando mais da metade da p. 21 em branco.'
    correcao: 'Acrescentar esqueleto_rotulo: "Passe a limpo os campos 02 a 05, em frases de quem lê, depois de a grade do campo 06 estar resolvida" e reduzir para 2 linhas por parte. Com isso o esqueleto tende a caber na p. 21, logo abaixo das regras.'
  - criterio: aplicabilidade
    trecho: "exemplo: \"Se não consegue escrevê-la de um jeito que quem a defende assinaria, pare aqui.\""
    por_que: 'A oficina tem um único exemplo de profissão (a nutricionista, no campo 01), e ele morre ali: o leitor não vê como o "três em três horas" ficaria na versão mais forte (o passo mais difícil do capítulo), nem uma razão, nem uma fratura, nem uma substituição. Os campos 02, 04 e 05 trazem instruções no lugar de exemplos, e o 03 não traz nada. Além disso, "pare aqui" não diz o que fazer em seguida (trocar de assunto? voltar ao campo 01?).'
    correcao: 'Dar exemplos curtos em profissões variadas e fora dos capítulos vizinhos (a nutricionista já está no cap. 15): campo 02, "Um contador: “Abrir MEI é o jeito mais barato de formalizar quem está começando.”"; campo 03, "Uma dentista: “Porque a primeira consulta cara afasta o paciente, e o orçamento fechado dá segurança.”"; campo 05, "Uma oftalmologista: “Antes de trocar o grau, anote em que horas do dia a vista embaça.”". No campo 02: "…pare e volte ao campo 01: escolha outra ideia ou estude melhor esta."'
  - criterio: coerencia
    trecho: "Na quarta-feira, a amiga do grupo de estudos perguntou, como sempre, qual seria o assunto da semana."
    por_que: 'O ritual fixado no cap. 8 é outro: a amiga manda uma pergunta na segunda à noite e Lúcia responde na terça às oito, que é também o horário de publicação ("no horário de sempre"). Na quarta, o texto da semana já saiu; a amiga não pergunta o assunto, ela manda a pergunta. Fica também sem explicação o que Lúcia publicou na terça em que decidiu "não ia publicar".'
    correcao: '"Na quarta-feira, no café depois da reunião do grupo de estudos, Lúcia contou à amiga a história do texto abandonado." (o café do grupo já existe no cap. 2). Se quiser manter o ritual, dizer que a terça daquela semana saiu com uma pergunta da lista.'
  - criterio: clareza
    trecho: "Os sinais de que um contraponto ainda não está pronto são poucos, e vale conhecê-los antes de escrever. Você não consegue enunciar a posição contrária de forma justa."
    por_que: 'A lista de consulta (é a base da grade do campo 06 e da questão 04) vem achatada em cinco frases soltas, com "vale conhecê-los" de narrador que anuncia (lição cap01-r1) e um "Ou a sua motivação…" solto no fim. A lição cap09-r1 pede listas que o leitor vai consultar numeradas, para a oficina remeter a elas.'
    correcao: 'Bloco nota "Cinco sinais de que a peça ainda não está pronta", numerado; o parágrafo de prosa fica só com "Qualquer um desses sinais basta para segurar a peça…". No campo 06: "Marque, para cada um dos cinco sinais da p. X…".'
  - criterio: aplicabilidade
    trecho: "Ele deve convidar quem discorda a se manifestar."
    por_que: 'O distrator não é inequivocamente falso dentro do próprio capítulo (lição cap01-r1): o roteiro termina em "Se você pensa diferente, vale a conversa" e o Faça pede "Responder a quem discordar com educação". O leitor pode achar que a opção c também está certa. Na questão 04, a correta é a mais longa das quatro, o que denuncia a resposta.'
    correcao: 'Q3 c: "Ele deve indicar quem, na área, defende a ideia criticada." (falso pelo "Evite"). Q4: encurtar a correta para "Porque ainda escrevia, em parte, para uma pessoa." e alongar uma distratora: "Porque a amiga do grupo de estudos pediu para ler antes."'
  - criterio: ritmo
    trecho: "Mora no que sustenta a divergência, e no que ela deixa para quem lê depois de derrubar a ideia anterior, quando a pessoa fica sem o critério que tinha e precisa de outro para seguir."
    por_que: 'Frase de 36 palavras com três encaixes (quem lê / depois de derrubar / quando a pessoa) e dois sujeitos implícitos trocados ("ela" é a divergência, "a pessoa" é quem lê). Lida em voz alta, perde o fio exatamente onde está a ideia central do capítulo. "Chama atenção" aparece duas vezes em quatro linhas ("chama atenção por um motivo simples"; "Divergir chama atenção por si mesmo").'
    correcao: '"A diferença está em duas coisas: no que sustenta a divergência e no que ela deixa no lugar. Quem derruba a ideia de alguém tira dele um critério; se não oferece outro, a pessoa fica sem ter como seguir." Trocar o segundo "chama atenção" por "Divergir atrai olhares por si mesmo".'
edicoes_de_linha:
  - '"cria um boneco de palha" -> "cria um espantalho" (termo corrente em português; o PWA usa "espantalho")'
  - '"Desde que começou a publicar, no capítulo 2," -> "Desde que começou a publicar, havia mais de um ano,"'
  - '"A troca proposta tem uma qualidade que vale procurar em qualquer contraponto:" -> "A troca proposta tem a qualidade que todo contraponto precisa ter:"'
  - '"“Eu mesma pensava assim, até perceber que…”" -> "“Eu também pensava assim, até perceber que…”" (serve a leitores e leitoras)'
  - '"O texto soava como bronca. Pior: dava a entender" -> "O texto soava como bronca e, pior, dava a entender" (evita o esquema pergunta-resposta disfarçado)'
  - '"Esperou mais dois dias." -> ver bloqueador; se mantido o prazo curto, "Cortou o parágrafo que era para ela e esperou mais dois dias."'
  - '"epigrafe: Divergir custa pouco. Divergir com argumento e com alguma coisa no lugar é o que constrói autoridade." -> "epigrafe: A descrição costuma dizer mais do que o nome." (subtítulo e epígrafe dizem hoje a mesma coisa na mesma página)'
  - '"titulo: As três alturas do contraponto" (fig. 17.2) -> "titulo: Quanto mais alto o degrau, mais o contraponto fala de você" (título que afirma)'
  - '"titulo: O que sustenta um contraponto" (fig. 17.1) -> "titulo: A indignação começa a peça; o repertório a sustenta"'
  - '"Checagem: marque o que ainda falta resolver" -> "Checagem: marque cada sinal como resolvido ou em falta"'
diagramacao:
  - 'p. 16-17: o "Por quê" do box Na prática quebra no meio da frase ("traz uma observação da prá- / tica e entrega uma alternativa"), deixando duas linhas órfãs no topo da p. 17. Manter o "Por quê" inteiro com o box (break-inside: avoid) ou puxá-lo inteiro para a p. 17.'
  - 'p. 20-21: mais da metade da p. 20 fica em branco depois do "Confira antes de seguir", porque a rede abre em página nova (a regra do projeto só exige isso da oficina); em seguida, cerca de 60% da p. 21 fica em branco antes do esqueleto. São mais de uma página de branco em sequência. Deixar a rede correr logo após a oficina, ou encurtar o esqueleto ("passe a limpo", 2 linhas por parte) para caber na p. 21.'
  - 'p. 12: cerca de seis linhas livres no pé da página antes do intertítulo "Por que discordar funciona", que foi para a p. 13. Cabe o intertítulo com as duas primeiras linhas; revisar o keep-with-next do h2.'
  - 'p. 11: subtítulo ("Discordar do consenso é fácil. Discordar com argumento é raro") e epígrafe ("Divergir custa pouco. Divergir com argumento…") repetem a mesma ideia com as mesmas palavras, um logo abaixo do outro. Ver edição de linha da epígrafe.'
veredito: 'Capítulo bem conduzido, com a melhor cena de modo da Lúcia até aqui, mas o caso-modelo publica dois dias depois de admitir que escreve para uma ex-paciente, a premissa de "primeira discordância" contradiz os caps. 2 e 12, e o exemplo do personal trainer faz o espantalho que condena; precisa de uma passada de coerência e de ofício antes de passar.'
