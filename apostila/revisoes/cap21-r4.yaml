capitulo: 21
iteracao: 4
notas: {metodo: 9.3, voz: 9.3, originalidade: 9.3, clareza: 8.9, ritmo: 9.2, concretude: 9.3,
        coerencia: 8.4, aplicabilidade: 8.8, impresso: 8.6, honestidade: 9.5}
bloqueadores: []
pontos_fortes:
  - "O bloqueador da r3 foi resolvido com precisão de ofício. O janeiro pesado agora vem do que de fato enche o mês de um trabalhista de empresa: 'As pequenas empresas que ele defende fazem em janeiro as demissões que adiaram no fim do ano, o telefone não para, e o escritório passa o mês preparando as defesas que vão vencer todas juntas quando os prazos voltarem a correr, no dia 21.' A audiência que derruba a sexta ficou na primeira semana de dezembro, antes do recesso. Também foram resolvidos a rede presa ao formato-base ('{A sua abertura de sempre}. {O tipo de situação, sem ninguém}.' e o roteiro_nota com as cinco linhas do Caio), a conta dos minutos ('Entre quarenta e cinquenta minutos' em tabela, prosa, figura e Para guardar), o verso de férias coletivas que janeiro não trouxe de volta, a enfermeira no lugar do veterinário, a abertura sem 'terminou... Terminou' e a ilustração própria (relógio, e não mais a engrenagem do cap. 20)."
  - "A imagem central é a melhor da Fase IV e nasce do modo do personagem: 'antes de fechar a pasta, virou a folha. No verso em branco, com a mesma caneta, escreveu um parágrafo.' A técnica que ela ensina se transfere para qualquer ofício: 'O trabalho de pensar já tinha sido feito. Faltavam cinco minutos para mudar o destinatário.' E o exemplo mostra a troca de tom, não só a troca de nome: 'A primeira frase era para quem já estava sentado diante dele. A segunda era para quem ainda não sabia que precisava estar.'"
  - "O conceito ganha na prosa uma formulação mais forte que a do box: 'Presa a esse momento, a peça herda a regularidade dele.' O argumento do formato do tempo fecha na história, sem número de mercado: 'Duas horas seguidas, com energia e sem interrupção, existiam nas semanas boas e sumiam exatamente nas que mais importavam.'"
  - "Boa disciplina diante do PWA e da regra de ouro: saem os 380 minutos do 'feed alheio', a versão mínima para semana ruim (reservada ao cap. 29) e as diretrizes que mandavam o leitor exibir o próprio processo. O Evite proíbe 'Falar da sua rotina, da sua disciplina ou do seu jeito de produzir', e o capítulo termina em ação, com o maço lido por Helena, plantando os caps. 24 e 28 sem anunciá-los."
problemas:
  - criterio: coerencia
    trecho: "Oito dos dezenove falavam, de um jeito ou de outro, de controle de horário [...] Helena escreveu no monte maior, a lápis: controle de horário."
    por_que: "A conta não fecha (lição cap01-r1). Helena separa os dezenove versos 'em dois montes'. Se oito tratam de controle de horário, o outro monte tem onze, e o 'monte maior' é o dos outros assuntos. A frase final do capítulo, que carrega a descoberta, rotula o monte errado. Um leitor atento faz essa conta na hora, porque o texto acabou de dar os dois números."
    correcao: "Manter os oito e trocar a última frase: 'Helena escreveu na folha de cima dos oito, a lápis: controle de horário.' Outra saída é subir para 'Onze dos dezenove', mas aí o cap. 28 precisa ser conferido ('cinco dessas eram versos sobre documentos: advertências, recibos, controle de horário')."
  - criterio: coerencia
    trecho: "Depois do jantar, em casa. Parece o horário mais livre e é o pior de todos."
    por_que: "A proibição é absoluta e bate de frente com casos que o livro já aprovou. No cap. 20, 'As quartas-feiras à noite ficaram livres. Caio passou a usar dez minutos delas para a seleção do caderno de campo'. O cap. 29 constrói a crise do Caio sobre essa mesma quarta à noite. O cap. 8 dá como exemplo 'Uma engenheira agrônoma: “Domingo à noite, depois que as crianças dormem. Na safra, a semana não tem outra hora.”' Até a semana modelo do próprio PWA põe a seleção no 'Domingo, 20h'. O critério da oficina ('Nenhum encaixe do campo 02 é depois do jantar') reprova a rotina de um protagonista e deixa sem saída o leitor cuja única hora é a noite. A fonte é contra produzir à noite. Contra escolher à noite, não diz nada."
    correcao: "Delimitar o alerta à produção: 'Depois do jantar, em casa, para escrever ou gravar a peça. Parece o horário mais livre e é o pior de todos: a energia de decidir já foi gasta no dia, o contexto do trabalho ficou no escritório, e a casa tem outras coisas a pedir. Se a noite é a única hora que sobra, dê a ela só o que pede pouco: os dez minutos da seleção.' Na oficina, campo 02: 'Depois do jantar não vale para produzir.' Critério 1: 'Nenhum encaixe de produção do campo 02 é depois do jantar ou “quando sobrar tempo”.'"
  - criterio: clareza
    trecho: "Otávio nunca deixou de terminar um parecer por estar cansado, e por isso nunca deixou de fazer a pergunta no fim dele."
    por_que: "Até aqui, a única 'pergunta' que o leitor conhece é a que fecha o verso ('quem, na sua empresa, confere essa folha todo mês?'), que Otávio 'faz a todo cliente'. A pergunta a que a frase se refere, 'isto ensina alguma coisa a quem não é o cliente?', só aparece três seções depois, em 'O que sobra'. Um leitor apressado entende que Otávio põe a pergunta ao cliente em todo parecer, e perde a ideia do parágrafo: o hábito herda a regularidade do momento a que se prende. O 'nunca' também pesa para um hábito que tem seis semanas."
    correcao: "'Otávio nunca deixou de terminar um parecer por estar cansado, e por isso, desde dezembro, nunca deixou de virar a folha no fim dele.'"
  - criterio: clareza
    trecho: "Lúcia encontrou a dela do outro lado do dia: a terça às oito, antes do primeiro paciente, com a sala vazia e a cabeça ainda sem as sessões. Uma transição funciona porque a pessoa está dentro do trabalho, com o contexto inteiro na cabeça."
    por_que: "A regra que fecha o parágrafo contradiz o exemplo que vem logo antes dela. O trunfo da transição da Lúcia é justamente a cabeça ainda vazia de sessões, e não 'o contexto inteiro na cabeça'. Quem lê não sabe qual das duas coisas faz a transição funcionar, e é essa a escolha que o campo 02 pede."
    correcao: "Nomear o que as duas transições têm em comum: 'Uma transição funciona porque a pessoa ainda está no lugar do trabalho, com as ferramentas à mão, e nada da vida de fora pede atenção. No fim do turno, ela traz o dia inteiro na cabeça; antes do primeiro paciente, traz a pergunta da véspera.'"
  - criterio: aplicabilidade
    trecho: "O encaixe que você testou (hoje ou no primeiro encaixe de amanhã), o que aconteceu e a primeira lição que ele deixou"
    por_que: "Ficou pendente da r3. O campo pede três coisas (o teste, o que aconteceu e uma lição escrita para um estranho, com data de liberação) em quatro linhas, o que à mão dá umas 45 palavras. Só a lição é um parágrafo como o do verso do parecer, e o critério 4 cobra dela quatro condições. O leitor vai espremer a lição em uma linha ou escrever fora do campo."
    correcao: "Separar em dois campos: '05 O encaixe que você testou (hoje ou no primeiro encaixe de amanhã) e o que aconteceu', com 2 linhas, e '06 A primeira lição que ele deixou, escrita para um estranho, e a data em que pode sair', com 4 ou 5 linhas. Ajustar os números nos critérios e no checklist."
  - criterio: coerencia
    trecho: "Nenhuma pessoa sensata escolhe a peça quando o cliente liga com uma notificação na mão, e Otávio não escolheu."
    por_que: "'e Otávio não escolheu' afirma uma escolha que o texto não mostrou. As duas sextas de dezembro caíram por 'uma audiência de conciliação que avançou pela tarde e a confraternização do escritório'. Nenhum cliente ligou com notificação. A frase cola o bordão do PWA sobre um caso que não aconteceu."
    correcao: "'Nenhuma pessoa sensata escolhe a peça quando uma audiência avança pela tarde, e Otávio não escolheu.' Ou cortar a segunda oração."
  - criterio: originalidade
    trecho: "As pequenas empresas que ele defende fazem em janeiro as demissões que adiaram no fim do ano, o telefone não para"
    por_que: "Repete quase palavra por palavra o cap. 8 ('O do Otávio é janeiro, quando as pequenas empresas que ele defende fazem as demissões adiadas no fim do ano e o telefone não para'). A lição cap02-r1 pede que a volta de uma ideia traga ganho novo. Aqui o ganho existe (as defesas que vencem juntas no dia 21), mas vem embrulhado na frase antiga."
    correcao: "Começar pelo que é novo: 'Janeiro sempre tinha sido o mês que derrubava tudo. As rescisões adiadas das festas chegam juntas, e o escritório passa o mês preparando as defesas que vão vencer todas no dia 21, quando os prazos voltam a correr.' O essencial é não repetir 'o telefone não para'."
  - criterio: concretude
    trecho: "Uma costureira: “O bilhete que vai preso na roupa ajustada [...]” Um técnico de ar-condicionado: “O que eu escrevo na ordem de serviço [...]”"
    por_que: "Os dois exemplos da oficina e dois dos quatro da prosa ('o bilhete que o marceneiro deixa', 'o orçamento') vêm de ofícios de fora do público do livro (saúde, direito, psicologia, arquitetura, contabilidade, engenharia, ensino, consultoria). A variedade ajuda, mas a dentista ou a contadora que lê não encontra o seu equivalente de perto. O único exemplo de profissional liberal na prosa, 'o laudo', não tem dono nem detalhe."
    correcao: "Manter um ofício manual e trocar o outro por uma profissão do público sem uso recente (ESTADO › figurantes), por exemplo: 'Uma fonoaudióloga: “O bilhete de orientação que os pais levam depois da avaliação, dizendo o que treinar em casa e o que não corrigir.”' Na prosa, dar dono ao laudo: 'o laudo que o engenheiro assina depois da vistoria'."
edicoes_de_linha:
  - "Na sexta, às cinco e meia, antes de sair, Otávio abriu a pasta dos versos -> Na sexta daquela semana, às cinco e meia, antes de sair, Otávio abriu a pasta dos versos (depois de três parágrafos de dezembro, 'Na sexta' não diz de qual se fala)"
  - "As duas primeiras sextas de janeiro tinham saído de perguntas de e-mail de novembro, já liberadas, do caderno de campo; naquela, pela primeira vez, havia um verso vencido. -> As duas primeiras sextas de janeiro tinham saído do caderno de campo, de perguntas de e-mail de novembro já liberadas; naquela, pela primeira vez, havia um verso vencido."
  - "porque só se sustenta numa ação se houver acordo escrito e controle mês a mês, assinado pelo funcionário -> porque dificilmente se sustenta numa ação sem acordo escrito e sem controle mês a mês, assinado pelo funcionário (a assinatura no controle é prova prática, não exigência legal; um trabalhista não diria 'só')"
  - "no mês que no ano anterior tinha parado tudo -> no mês que, no ano anterior, tinha derrubado tudo (retoma a imagem de 'o mês que derrubava tudo', sem o 'parado tudo', que soa como se as publicações da agência tivessem parado)"
  - "A lição do campo 05 não tem nome, cidade, setor nem data que leve a alguém, e tem a data em que pode sair. -> A lição do campo 05 não tem nome, cidade, setor nem detalhe que leve a alguém, e traz anotada a data em que pode sair. (dois sentidos de 'data' na mesma frase)"
  - "Aquele janeiro não foi diferente. -> Aquele janeiro também não perdoou. (ou cortar: a frase anterior já diz tudo e a fórmula é gasta)"
diagramacao:
  - "p. 17: o problema apontado na r2 e na r3 continua. Há cerca de sete linhas em branco no pé da página, e o último parágrafo de 'O que sobra' sobra na p. 18 com duas linhas ('aparecido nos pareceres de janeiro, e Otávio não tinha percebido enquanto os escrevia. Helena escreveu no monte maior'). Não há bloco indivisível logo depois; o Para guardar cabe na p. 18 de qualquer jeito. Levar o parágrafo inteiro para a p. 17 (ajustar orphans/widows ou o espaço antes do intertítulo)."
  - "p. 17: o subtítulo da figura ('minutos por semana, anotados por ele') continua em sans negrito, no mesmo peso dos rótulos das barras. Foi apontado na r1, na r2 e na r3. Passar para corpo menor, sem negrito, ou itálico como a legenda, para que o rótulo 'A peça como evento: 120 minutos seguidos' seja o primeiro nível."
  - "p. 21-22: o bloco Faça assim/Evite (cerca de 170 px de altura) foi para a p. 22 e ficou sozinho no topo, com uns três quartos da página em branco, embora a p. 21 tenha umas nove linhas livres depois da regra 3. O branco antes do esqueleto indivisível é aceito; o que não é aceito é o Faça/Evite ter saído da p. 21. Deixar o bloco quebrar para a p. 21, onde parece caber. O esqueleto começaria na p. 22 e o capítulo poderia ganhar uma página."
  - "p. 20: o campo 03 tem uma linha por dia (pendente, menor, da r3). Um leitor com captura e produção no mesmo dia não cabe numa linha. O exemplo poderia mostrar as duas coisas ('intervalos: captura, 2 min; 18h, mesa: produção, 5 min'), ou os dias úteis poderiam ganhar duas linhas."
  - "Aceitos pelo projeto: p. 18 (Para guardar sozinho antes da oficina, que abre em página nova), p. 19 (branco antes do campo 03, indivisível), p. 20 (pé livre antes do Confira), p. 24 (verificação e checklist em páginas separadas) e p. 25 (fim do capítulo). A abertura (p. 11) tem agora ilustração própria, o relógio com arcos dourados, que resolve a repetição da engrenagem do cap. 20; a legenda 'Nenhuma hora nova. Só pedaços que já estavam no dia.' conversa com a figura."
veredito: "O capítulo está no nível de aprovação. O erro jurídico e quase tudo o que a r3 pediu foram corrigidos, e a imagem do verso do parecer segura o livro. Ainda falta uma passada de coerência: o 'monte maior' que é o menor, a proibição absoluta da noite que reprova a seleção do Caio nos caps. 20 e 29, a 'pergunta' citada antes de existir e o campo 05, que continua apertado."
