capitulo: 1
iteracao: 2
notas: {metodo: 8.8, voz: 8.7, originalidade: 8.6, clareza: 8.9, ritmo: 8.6, concretude: 9.0,
        coerencia: 8.3, aplicabilidade: 8.2, impresso: 8.2, honestidade: 8.8}
bloqueadores:
  - 'Erro de pontuação no autodiagnóstico (o instrumento dá resultado errado justamente para o leitor a quem a instrução nova se dirige). A instrução diz: "se não aparece nada, circule o número mais à direita nas linhas 2 e 5". Na linha 2, invertida, o número mais à direita (coluna "Concordo totalmente", p020) é 1. Quem não tem presença nenhuma marca, portanto, "concordo totalmente que quem só viu o meu perfil consegue perceber o meu nível de profundidade" e soma 1 ponto em vez de 5. São 4 pontos a menos, o suficiente para empurrar alguém de "Assimetria alta" para "moderada", e o erro atinge o subgrupo que o livro mais quer alcançar (o perfil da Lúcia). Correção: "se não aparece nada, circule o 5 nas linhas 2 e 5" (na linha 2 o 5 fica à esquerda; na 5, à direita).'
pontos_fortes:
  - 'A abertura continua sendo o melhor trecho do capítulo e agora está limpa de ofício: a pergunta "e de manhã, como é?", a fita medindo "quanto a lombar se abria no movimento" (o teste que um fisioterapeuta faria de fato diante de dor inflamatória), o encaminhamento ao reumatologista e o fecho "Renata riu na hora. À noite, em casa, a frase voltou, e ela já não achou graça."'
  - 'Formulações próprias e memoráveis, que um leitor exigente sublinha: "a média da profissão, com o nome dela em cima"; "Dizia que ela atende coluna, o que é verdade; que gosta de alongamento, o que é meia verdade; e que se parece com todas as outras, o que é falso"; "cresce na velocidade de outra pessoa"; "A raiva é compreensível. O problema é que ela não publica nada."'
  - 'O argumento de que a presença digital age até sobre quem chega indicado ("entre o nome recebido e a primeira mensagem") e a seção sobre por que os melhores têm a distância maior (reflexo, sinais ao vivo, escrúpulo) são contribuições que o PWA não tinha e desarmam as objeções do público ("vivo de indicação", "não tenho jeito para isso").'
  - 'A regra de ouro está íntegra: a prosa diz que o assunto é "a coluna, o contrato, o balanço, a reforma, a ansiedade, o dente" e o roteiro de fala virou a versão falada do esqueleto, sem nenhuma menção a internet, perfil ou "vou começar a falar".'
  - 'Lint limpo (1 "não é/é", 0 frase-soco, 0 ", e não" na prosa, 0 sinalização; média de frase 16,6, desvio 10,4). Figura 1.1 agora funciona em preto e branco; autodiagnóstico cabe numa página; campo 04 da oficina amarra o checklist.'
resolvidos_da_r1:
  - 'Bloqueador do roteiro de fala: resolvido. O roteiro é o esqueleto dito em voz alta e é 100% sobre a área do leitor.'
  - 'Tique ", e não": resolvido na prosa (lint 0). Restam duas ocorrências dentro do autodiagnóstico ("e não em como gostaria", "O resultado é uma estimativa, e não uma medida"); ver problemas de voz para as antíteses que migraram de forma.'
  - 'Citação do dossiê ("roubar a parcela de mercado que seria delas"): resolvido; trocada por paráfrase contida e pela frase "A raiva é compreensível. O problema é que ela não publica nada."'
  - 'Checklist pontuando o que a oficina não pedia: resolvido para a dependência de indicação (campo 04 + ajuda do checklist remete a ele). Ver, porém, o item "Abandonei a explicação confortável", que continua sem campo.'
  - 'Autodiagnóstico para quem não publica e faixa baixa condicional: parcialmente. A faixa baixa foi reescrita bem; a instrução nova pontua errado a linha 2 (bloqueador) e a faixa moderada ainda afirma o que a escala não mede ("Você já aparece").'
  - 'Verificação: posições das corretas variadas (c, a, d, b) e distrator "indicação é proibida" removido: resolvido. Comprimento das opções: parcial (lint ainda acusa a correta como a mais longa em 3 de 4).'
  - 'Detalhes de ofício (cardiologista de consultório; curvar-se e medir a lombar com fita; "recalque da fundação ou só retração do reboco"): resolvidos.'
  - 'Conta da Renata ("quase metade dos pacientes novos deixaria de chegar"): resolvida no essencial.'
  - 'Fecho: resolvido (dois parágrafos, sem roteiro de seções, elenco apresentado por imagens).'
  - 'Narrador que anuncia ("vale entendê-lo antes de seguir", "por ora", "o que já é bastante"): resolvido.'
  - 'Honestidade ("Quase todo mundo faz isso hoje", "medida", "vai gerar diferença perceptível", "se sustenta com pouco esforço"): resolvidos.'
  - 'Seis intertítulos: resolvido (cinco).'
  - 'Legenda do iceberg ("Marcos viu a ponta. Quase foi embora.") e exemplo da oficina em profissão diferente da protagonista (contadora, professora de piano): resolvidos. O iceberg em si permanece.'
  - 'Diagramação: autodiagnóstico inteiro numa página, campo 03 sem quebra, esqueleto com 3/3/4/2 linhas, figura legível em escala de cinza, hifenização de nomes próprios, respiro do "Para guardar": resolvidos. Esqueleto ainda quebra entre páginas, notas das figuras continuam pequenas, capítulo continua com 16 páginas: não resolvidos.'
problemas:
  - criterio: aplicabilidade
    trecho: "se não aparece nada, circule o número mais à direita nas linhas 2 e 5"
    por_que: 'Bloqueador (ver acima). Na linha invertida o número mais à direita é 1, que significa "Concordo totalmente que quem só viu o meu perfil consegue perceber o meu nível de profundidade". O leitor sem presença soma 4 pontos a menos e recebe a faixa errada.'
    correcao: '"Se você não tem perfil ou quase não publica, pense no que aparece quando alguém busca o seu nome e a sua profissão; se não aparece nada, circule o 5 nas linhas 2 e 5." Aproveitar para encurtar a instrução, que ocupa seis linhas densas na p020: mover "O resultado é uma estimativa" para o rodapé, junto da soma.'
  - criterio: aplicabilidade
    trecho: "Você já aparece, mas de forma intercambiável: o que você publica poderia ser de outra pessoa."
    por_que: 'A faixa moderada afirma o que a escala não mede, exatamente a lição registrada da r1. Quem não publica nada (itens 2 e 5 no máximo) mas marca pouco nos itens 3, 4 e 6 cai entre 15 e 22 e lê "Você já aparece" e "o que você publica". A oficina tem o mesmo buraco: o campo 02 ("Mas quem só vê o meu perfil acha que eu…") não diz o que escreve quem não tem perfil.'
    correcao: 'Faixa moderada: "A distância existe e já pesa: o que alguém encontra sobre você poderia ser de outro profissional da sua área. Publicar mais não resolve; o trabalho aqui é de singularidade." Campo 02: acrescentar ao exemplo "Se você não tem perfil, escreva o que conclui quem busca o seu nome e não encontra nada."'
  - criterio: metodo
    trecho: "Abrir com a cena: “Ontem um paciente me perguntou por que ninguém tinha visto isso antes.”"
    por_que: 'O exemplo do "Faça assim" contradiz o "Evite" da mesma página ("Atacar colegas pelo nome ou por indireta reconhecível"; "Autoelogio"). "Por que ninguém tinha visto isso antes" é a indireta a quem atendeu antes, e é justamente o caso do Marcos, que passou por quatro profissionais. Em saúde e advocacia, os códigos de ética restringem o desabono a colegas; o livro não pode dar como modelo de abertura a frase que o próprio livro manda evitar. Herdado do PWA, mas o papel não precisa herdar.'
    correcao: 'Trocar por uma cena com tensão e sem comparação: "Abrir com a cena: “Ontem um paciente me perguntou por que a dor melhora justamente quando ele se mexe.”" Em "Nomear o que você viu e os outros não viram", trocar "os outros" por "o senso comum": "Nomear o que você viu e o senso comum não vê, com um detalhe que só quem faz o seu trabalho teria."'
  - criterio: clareza
    trecho: "Comece pela tensão, não pela credencial."
    por_que: 'A regra 1 manda começar pela tensão; a linha seguinte ("Abrir com a cena") e o esqueleto (A cena -> A tensão -> O critério) mandam começar pela cena. O leitor que segue as instruções ao pé da letra fica sem saber qual é o primeiro passo. É a mesma contradição do PWA, agora impressa em sequência na mesma página.'
    correcao: '"Comece por uma cena com conflito, não pela credencial." / porque: "Ninguém para de rolar a tela por causa do seu currículo. As pessoas param por causa de um conflito que reconhecem, e o conflito chega mais rápido quando vem dentro de uma cena."'
  - criterio: coerencia
    trecho: "Depois disso, ela só publicava em datas comemorativas; no resto do tempo, o perfil servia para mandar o telefone a quem pedia. Ninguém, em momento algum, sentou para pensar em como a competência dela deveria aparecer"
    por_que: 'Contradiz o ponto de partida da Renata na bíblia ("Tentou carrossel … e parou no 23º dia") e o capítulo 5, cuja cena é "O 23º dia da Renata no carrossel". Se o cap. 1 afirma que ela "só publicava em datas comemorativas" e que ninguém "em momento algum" pensou no perfil, o cap. 5 terá de desmentir o cap. 1. Há ainda duas incoerências menores: "Antes de começar" promete que "O primeiro capítulo começa numa sala de espera", mas o capítulo abre no consultório e a recepção só aparece em flashback; e o registro de figurantes do ESTADO.yaml para o cap. 1 omite pediatra, professora de piano e nutricionista (e a endocrinologista do exemplo não está na lista de figurantes permitidos), o que abre caminho para repetições nos próximos capítulos.'
    correcao: 'Deixar a tentativa plantada, sem contá-la: "Depois disso, ela quase só publicava em datas comemorativas. Houve um mês em que tentou publicar todos os dias, e parou antes do fim; o capítulo 5 volta a isso." (ou, sem remissão: "…e parou no vigésimo terceiro dia, sem saber explicar por quê."). Trocar "Ninguém, em momento algum," por "Ninguém nunca". Em "Antes de começar": "O primeiro capítulo começa num consultório em Curitiba." Registrar no ESTADO os figurantes efetivamente usados e trocar "endocrinologista" por uma profissão da lista ou por "a mesma médica".'
  - criterio: coerencia
    trecho: "Marcos não entendeu todos os termos. Entendeu o suficiente para saber que estava diante de alguém que sabia o que estava fazendo."
    por_que: 'A bíblia define a Renata como quem "pensa FALANDO — explica com as mãos, por analogia, em voz alta", marca "desenha no ar com as mãos", e pede que os sinais do modo estejam plantados desde a Fase I. Na cena de estreia, ela explica com termos que o paciente não entende, o que aponta para o modo oposto. Perde-se o momento natural de plantar o sinal e a frase-marca dela ("a dor não é o inimigo, é o alarme"). Na mesma cena, a "pasta de exames debaixo do braço" é apresentada e nunca usada, embora a prosa depois atribua à Renata desconfiar "de exame que não combina com a queixa": o traço é afirmado, não mostrado.'
    correcao: 'Acrescentar duas frases à cena: "Deixou a pasta de exames fechada sobre a mesa; primeiro queria ouvir." e, na explicação: "Desenhou no ar, com as mãos, uma coluna que amanhece travada e vai soltando com o movimento. Marcos não entendeu todos os termos. Entendeu o desenho, e isso bastou para saber que estava diante de alguém que sabia o que estava fazendo."'
  - criterio: ritmo
    trecho: "Se a assimetria custasse só dinheiro, seria administrável; existe um jeito de viver bem de indicação, e muita gente vive."
    por_que: 'A seção "A conta que ninguém faz" virou depósito: a conta (1 parágrafo), os limites da indicação (2), a figura 1.1, a indicação que se confirma no perfil (1), a visão positiva "Bem feita, ela muda a ordem dos acontecimentos" (1), o incômodo do reconhecimento com a cardiologista (9 frases, acima do teto de 6 da bíblia) e as desculpas para a ausência (1). O intertítulo cobre só a primeira metade, e a transição da visão positiva de volta à dor é brusca. Além disso, "Bem feita, ela muda a ordem…" antecipa com outras palavras a figura 1.2, três páginas depois ("A consulta começa alguns passos adiante" / "A conversa começa com a objeção já vencida").'
    correcao: 'Mover o parágrafo "Bem feita, ela muda a ordem dos acontecimentos…" para a última seção, imediatamente antes da figura 1.2, que ele passa a introduzir. Dividir o parágrafo da cardiologista em dois (a cena; depois "Muita gente competente descreve esse incômodo…"). Assim a seção "A conta" termina na dor e nas desculpas, e "O que este livro não vai pedir" responde a elas.'
  - criterio: ritmo
    trecho: "Ele só chegou até ali porque a mulher insistiu, e por pouco a segunda Renata não o mandou embora da recepção."
    por_que: 'É a quarta vez que o capítulo faz a mesma batida ("quase não tinha entrado"; "No caso da Renata, por pouco não trabalhou contra"; a legenda "Marcos viu a ponta. Quase foi embora."; e esta). No fecho, a repetição tira força em vez de dar. O parágrafo também é o que empurra o "Para guardar" para a p019 e deixa duas meias páginas em branco (ver diagramação).'
    correcao: 'Fechar a cena num ganho novo, não numa repetição: "Três semanas depois, Marcos voltou com o diagnóstico que Renata tinha levantado e o tratamento em curso com o reumatologista. Começaram a fisioterapia na mesma semana. Na primeira sessão, ele contou que tinha mandado o nome dela para um colega de trabalho, e junto, sem que ninguém pedisse, um pedido de desculpas pelo perfil." (ou simplesmente cortar a última frase do parágrafo).'
  - criterio: voz
    trecho: "O objetivo não é parecer maior do que você é. É parar de parecer menor."
    por_que: 'É o molde exato do exemplo ruim da bíblia ("Não é sobre aparecer. É sobre ser visto."), no lugar mais memorável do capítulo, o "Para guardar". A antítese também migrou para formas que o lint não conta: "Marketing, algoritmo e número de seguidores explicam pouco aqui. O que está em jogo é…"; "A coluna da esquerda fabrica uma presença; a da direita revela uma que já existe. Fabricar cansa… Revelar dá trabalho…" (a mesma estrutura "a primeira… a segunda…" que a r1 apontou); "Renata não resolveu nada naquela noite. Ela só parou de fingir…". Em trinta capítulos, isso vira assinatura.'
    correcao: 'Guardar 3: "Ninguém precisa parecer maior do que é. Basta parar de parecer menor." (ou: "O trabalho deste livro é parar de parecer menor do que você é."). Abrir o parágrafo pós-conceito pela afirmação: "A confiança que você gera existe; só circula por um único canal, estreito e lento, que é o encontro." Manter a antítese fabricar/revelar (é a melhor do capítulo) e desfazer as outras.'
  - criterio: voz
    trecho: "Talvez você já tenha percebido que também existe em duas versões"
    por_que: 'Três aberturas de parágrafo supõem o que o leitor pensa ou faz, sempre com a mesma cautela: "Talvez você já tenha percebido…", "Você provavelmente faz o mesmo…", "É provável que você já tenha dado alguma explicação…". Somadas a "Um medo costuma travar gente séria" e "Muita gente competente descreve…", formam o tique de texto de curso que lê a mente do aluno. E "parou de fingir que o problema não existia" é frase feita.'
    correcao: 'Manter uma das três suposições e afirmar as outras: "Você também existe em duas versões, a da sala e a da tela."; "Quem recebe o nome de um médico faz o mesmo." Trocar "Ela só parou de fingir que o problema não existia" por algo próprio da cena: "Só guardou a frase do Marcos num papel, dentro da gaveta da recepção."'
  - criterio: aplicabilidade
    trecho: "Abandonei a explicação confortável — Parei de justificar a ausência com falta de tempo ou de jeito."
    por_que: 'A lição da r1 diz que todo item do checklist precisa de um campo correspondente na oficina. Este item não tem campo e é inverificável ao fim de 25 minutos (é um estado de espírito, não um produto). Além disso, a rede não se liga à oficina: o leitor rascunha uma peça de caso sem ser mandado para as três evidências do campo 03, que são exatamente a matéria-prima da peça. E o tempo não fecha com o pacto de leitura ("trinta a quarenta e cinco minutos"): leitura (~12 min) + autodiagnóstico (~5) + oficina (25) + esqueleto e gravação (sem tempo indicado) + verificação passam de uma hora.'
    correcao: 'Dar campo ao item: acrescentar ao campo 05, ou num campo 06 de 2 linhas, "A explicação que você costuma dar para não aparecer, e o que ela deixa de fora." e ajustar a ajuda do checklist ("Escrevi, no campo 06, a minha explicação e o que ela deixa de fora."). Na intro da rede: "Parta de uma das três evidências do campo 03." Indicar tempo na rede ("10 minutos; a gravação pode ficar para amanhã") ou reduzir a oficina a 20 minutos.'
  - criterio: honestidade
    trecho: "Escolher o próprio público, coisa que quase todo especialista deseja em silêncio, fica fora de alcance."
    por_que: '"Quase todo especialista deseja" é afirmação empírica sem fonte, a mesma família de "quase todo mundo faz isso hoje", que a r1 mandou cortar. Na faixa alta do autodiagnóstico, "aqui, pequenas mudanças costumam aparecer rápido" é promessa de resultado com roupa de observação, em contradição com o aviso de "Antes de começar" ("Ninguém pode prometer quantos clientes a sua presença vai trazer").'
    correcao: '"Escolher o próprio público, que é o que muita gente séria gostaria de poder fazer, fica fora de alcance." Faixa alta: "Existe uma distância grande entre quem você é e o que a internet mostra. É desconfortável de ler, e diz por onde começar: pela linha em que você marcou mais alto."'
  - criterio: metodo
    trecho: "Ela converte mais devagar do que um anúncio pago."
    por_que: 'Distrator que não é inequivocamente falso: é uma afirmação empírica que o livro não discute e que, para muitos leitores, parece verdadeira. O mesmo vale para "Porque as plataformas favorecem quem publica todos os dias" (q3), que muita gente acredita ser verdade e que o capítulo não refuta. A correta da q1 continua visivelmente a mais longa e a única com o vocabulário do capítulo. O gabarito da q3 fala em "sinais de competência que dependem de tradução", termo que o capítulo não usa (e que é da Fase III), e repete a razão que a opção correta já continha.'
    correcao: 'q2 d: "Ela só vale para profissões da área da saúde." q3 b: "Porque quem é muito bom não precisa de clientes novos." q1: encurtar a correta para "A distância entre a autoridade que você exerce e a que o perfil comunica." e alongar a (a) para "A diferença entre os seguidores que você tem hoje e os que gostaria de ter." Gabarito q3: "Somam-se a isso os sinais de competência que só aparecem ao vivo e o escrúpulo de quem conhece as exceções."'
  - criterio: concretude
    trecho: "Uma pediatra experiente percebe, pelo jeito como a criança olha para ela ao entrar, se a febre é o menor dos problemas."
    por_que: 'É o único detalhe de ofício vago do capítulo, e soa mais místico do que clínico ("o jeito como olha"; "o menor dos problemas" é ambíguo: pior ou melhor?). Pediatras descrevem isso com critérios concretos (a criança que brinca na sala de espera, a que não reage ao toque), e o leitor da saúde nota.'
    correcao: '"Uma pediatra experiente percebe, pelo jeito como a criança entra no consultório, se ela brinca com o que encontra ou se nem olha, se aquela febre pede exame ou só antitérmico e observação."'
  - criterio: originalidade
    trecho: "ilustracao: iceberg"
    por_que: 'A primeira imagem do livro continua sendo a mais gasta da apresentação corporativa; a legenda nova salva a página, mas não a imagem. Ao lado dela, a caixa comparativa repete quase literalmente o vocabulário de mercado do PWA ("Virar influenciador", "dica rasa", "ganhar alcance") e a regra "Ninguém para de rolar a tela por causa do seu currículo" é frase de curso de marketing. O texto corrido tem imagens próprias muito melhores (as duas Renatas, o nome recebido e a primeira mensagem).'
    correcao: 'Se a lista permitir, trocar a ilustração por "espelho" (as duas Renatas, a da sala e a da tela), com a mesma legenda adaptada: "Marcos viu o reflexo. Quase foi embora." Na caixa, reescrever ao menos duas linhas na voz do livro (ex.: "Simplificar o que você sabe até virar dica rasa" -> "Trocar o que você sabe por frases que cabem em qualquer consultório").'
  - criterio: ritmo
    trecho: "Elas justificam a distância sem encurtá-la um milímetro, e este livro trata do outro movimento, o de encurtar."
    por_que: '"Encurtar" três vezes em três frases, atravessando o intertítulo ("encurtá-la", "o de encurtar", "encurtar a assimetria signifique"). Lido em voz alta, trava.'
    correcao: '"Elas justificam a distância sem diminuí-la um milímetro, e este livro trata do outro movimento." / "Um medo costuma travar gente séria: o de que fechar a assimetria signifique virar outra pessoa."'
edicoes_de_linha:
  - 'quase metade dos pacientes novos deixaria de chegar -> dois de cada cinco pacientes novos deixariam de chegar (a conta exata é mais forte e é a que a personagem faria)'
  - 'o diagnóstico que Renata tinha suspeitado -> o diagnóstico de que Renata tinha suspeitado (ou: que Renata tinha levantado)'
  - 'a quem ainda não te conhece (box Conceito, p013) / exatamente o que falta a quem ainda não te conhece (p014) / para quem ainda não te conhece (intro da rede) / se quem te encontra percebe (gabarito q1) -> uniformizar o tratamento com "você": "a quem ainda não conhece você", "a quem ainda não o conhece", "se quem encontra você percebe". Mistura de "você" com "te" é o primeiro ponto que um preparador de editora corrige.'
  - 'O que é óbvio para você é exatamente o que falta a quem ainda não te conhece. -> O que é óbvio para você é justamente o que falta a quem ainda não conhece você.'
  - 'Os três pontos vão voltar ao longo do livro, e cada um, tratado com método, vira matéria de trabalho. -> Nenhuma das três é defeito, e cada uma, tratada com método, vira matéria de trabalho. (tira o narrador que anuncia o livro)'
  - 'Há um paradoxo nessa história: -> Há um paradoxo aqui:'
  - 'Circule um número por linha pensando em como as coisas estão hoje, e não em como gostaria que estivessem. -> Circule um número por linha pensando em como as coisas estão hoje, não em como gostaria que estivessem.'
  - 'O resultado é uma estimativa, e não uma medida. -> O resultado é uma estimativa.'
  - 'Na segunda linha os números aparecem em ordem inversa; é de propósito, circule normalmente. -> Na segunda linha os números estão em ordem inversa, de propósito.'
  - 'Consigo nomear a diferença entre como sou percebido dentro e fora da internet, sem me defender. -> Escrevi as duas metades da frase sem suavizar a segunda.'
  - 'Uma nutricionista: “Sete de dez. Cinco deles pela mesma endocrinologista.” -> Uma nutricionista: “Sete de dez. Cinco deles pela mesma médica.”'
  - 'Na semana passada, {a cena: quem, onde, o que a pessoa disse}. -> {Quando: ontem, na semana passada, há um mês}, {a cena: quem, onde, o que a pessoa disse}. (nem todo caso é da semana passada, e o roteiro não deve induzir o leitor a inventar a data)'
diagramacao:
  - 'Extensão: o capítulo ocupa 16 páginas (p011 a p026) contra o alvo de 10 a 14, com a prosa no piso de palavras (1866). Somando os brancos, são cerca de 3 páginas vazias: p013 (~15%), p014 (~22%), p016 (~30%), p018 (~40%), p019 (~55%), p021 (~22%), p024 (~20%), p025 (~20%), p026 (~55%). Os de p021 e p026 são aceitáveis (oficina e checklist); os da prosa não.'
  - 'p018-p019: a regra ".texto > p:nth-last-child(2), .texto > .guardar { break-before: avoid }" cola o parágrafo final de Marcos, a frase da caneta e o "Para guardar" num bloco de ~400px que não cabe nos ~355px livres da p018. Resultado: 40% de branco na p018 e 55% na p019, antes do autodiagnóstico de página inteira. Cortar a última frase redundante do parágrafo de Marcos (ver problemas) e soltar a regra para prender só a frase final ao "Para guardar" já põe tudo na p018; o autodiagnóstico sobe para a p019 e o capítulo perde uma página.'
  - 'p016: o intertítulo "O que este livro não vai pedir" e o parágrafo de duas linhas ("Um medo costuma travar gente séria… Não significa.") ficam no pé da página, seguidos de ~30% de branco, e a caixa comparativa abre a p017. Intertítulo separado do seu conteúdo principal. Prender intertítulo + parágrafo de entrada ao bloco compara (ou permitir que o compara flutue para depois do parágrafo "A coluna da esquerda…").'
  - 'p014: ~22% de branco antes de "A conta que ninguém faz", espaço suficiente para o intertítulo e três linhas do primeiro parágrafo (orphans: 3). Verificar por que o motor empurrou a seção inteira (provável interação de break-after: avoid do h2 com a figura 1.1 mais adiante) e corrigir.'
  - 'p017-p018: a palavra "diferen-/tes" é hifenizada na virada de página ("temperamentos bem diferen-" no pé da p017, "tes:" no topo da p018). Proibir hifenização na última linha da página (hyphenate-limit-last: always / hyphenate-limit-zone) ou reescrever o parágrafo.'
  - 'p023-p024: o esqueleto continua quebrando: o cabeçalho "ESQUELETO DA PEÇA — RASCUNHE AQUI" e "A cena" ficam na p023; "A tensão", "O critério" e "A frase que fica" na p024. O leitor rascunha a peça virando a folha no meio. Aplicar break-inside: avoid ao .esqueleto inteiro (ou break-before: page no rótulo do esqueleto, aproveitando os ~12% livres da p023 para o faça/evite respirar).'
  - 'Linhas finais curtas de parágrafo, com hífen: "traba-/lho." (p014), "encur-/tar." (p016), "re-/cepção." (p019). Em livro de editora, a última linha do parágrafo não deve ser uma sílaba hifenizada; ajustar hyphenate-limit-chars (ex.: 6 3 3) ou tratar à mão.'
  - 'p013: "bem-/comportada" quebra no hífen sem repeti-lo na linha seguinte; a norma brasileira pede "bem-/-comportada". Pendente da r1.'
  - 'p015 e p018, notas das figuras: Inter itálico cinza em ~7,5 pt continua no limite para o leitor de 50-60 anos em offset. Subir para 8,5 pt e escurecer. Pendente da r1. Na figura 1.1, o rótulo "a assimetria" tem fundo branco que corta a hachura; usar fundo da cor da hachura ou tirar o fundo.'
  - 'p020: a instrução do autodiagnóstico tem seis linhas corridas antes da tabela; o leitor precisa decifrar regra de inversão e regra para quem não tem perfil num único bloco. Separar em duas linhas curtas, com a regra de quem não tem perfil em nota abaixo da tabela.'
veredito: "Revisão de alto nível, com abertura e argumento que já são de editora, mas ainda não aprovável: a instrução nova do autodiagnóstico pontua errado quem não tem presença (bloqueador), a rede dá como modelo uma indireta a colegas que ela mesma proíbe, a Renata contradiz o próprio arco (o carrossel do dia 23) e a diagramação ainda gasta três páginas de branco; resolvidos esses pontos e a antítese residual, o capítulo chega a 9."
