bloqueadores: []
pontos_fortes:
  - 'Quase tudo o que a r2 apontou foi resolvido. As contas das datas fecham ("há quase vinte anos", a frase em 2007 e a fig. 16.2 já com ela em 2012). O esqueleto virou conferência ("É a mesma do campo 03?") e deixou de pedir que o leitor reescreva a explicação. O exemplo agora vem depois da cena da Helena, e o checklist pontua a comparação fixa (campo 04). O texto publicado não traz mais o "dele" nem a academia: "Ela usa o uniforme da empresa?".'
  - 'A cena de abertura continua sendo a melhor da Fase III. A explicação madura aparece funcionando antes de ganhar nome, com detalhe de ofício exato: "com firma reconhecida em cartório", "se era a academia que distribuía os alunos e cobrava deles", "Cada pergunta procura um sinal de subordinação ou de pessoalidade".'
  - 'O novo exemplo do Caio é próprio e está no modo dele. Ele pensa contando, e a prova da maturidade é oral: "o sócio, que já tinha ouvido a história umas trinta vezes, terminou a frase por ele", "Os clientes riem na pausa, e o sócio ri junto, mesmo sabendo o fim". A parede aberta dos caps. 3 e 14 não volta.'
  - 'As imagens são econômicas e o fecho acontece em ação: "ninguém publica o próprio expediente", "um cozinheiro não pensa em fotografar o arroz", "O corte cuida do que está escrito; o calendário cuida do resto" e o caderno preto com "prontas" escrito no alto.'
problemas:
  - criterio: coerencia
    trecho: "um texto sobre instrutor autônomo assinado pelo advogado da academia seria lido pelo instrutor, e pelo advogado dele, como recado, qualquer que fosse a data."
    por_que: 'O raciocínio do sigilo, que é o mesmo fio desde a r1, agora se contradiz. O texto afirma que, com a ação em curso, a data não resolve ("qualquer que fosse a data"). Logo depois, o calendário passa a ser a solução: "marcou no caderno uma sexta três semanas adiante, longe da reunião das academias, para que ninguém ligasse uma coisa à outra". Três semanas não é "longe" de uma ação trabalhista que mal foi notificada. E o texto publicado trata do mesmo assunto (contrato de autônomo, horário, uniforme, substituição), tem o mesmo autor e sai com a ação em curso. Se o recado ao instrutor independia da data, trocar o e-mail de origem não o elimina. O leitor atento sai sem saber qual é a regra: esperar funciona ou não funciona? Cap. 13 e cap. 15 ensinaram a espera como proteção de quem pode se reconhecer. Aqui, ela aparece e é desautorizada no mesmo parágrafo.'
    correcao: 'Deixar uma lógica só. Sugestão: "Não usou o e-mail que tinha mandado à dona das academias: com a ação em curso, os fatos dela não saem do escritório, com nome ou sem nome." E no parágrafo seguinte: "Mesmo com o caso encerrado, Otávio guardou o e-mail cortado numa pasta e marcou no caderno uma sexta três semanas adiante, para que a dona das academias, se lesse, não achasse que a reunião dela tinha virado assunto." Assim o capítulo aplica a regra do cap. 13 (quem se reconhece pela data é quem esteve na conversa) sem afirmar antes que a data não importa.'
  - criterio: concretude
    trecho: "Abriu um e-mail de dois anos antes, de um caso encerrado, sobre a manicure de um salão de Casa Amarela."
    por_que: 'Um advogado trabalhista vai estranhar o detalhe (lição cap09-r1). Manicure de salão é justamente a categoria com regime próprio: a Lei do Salão-Parceiro (Lei 13.352/2016, validada pelo STF em 2021) exige contrato de parceria homologado. Um e-mail a um dono de salão sobre esse tema quase certamente trataria da parceria e da homologação, que não são o miolo "geral" que o texto diz ter ficado "exatamente como saiu". O caso escolhido para mostrar a explicação genérica é o menos genérico do direito do trabalho.'
    correcao: 'Trocar por um prestador sem lei específica, por exemplo: "sobre o técnico de instalação de uma pequena empresa de ar-condicionado de Casa Amarela". Ajustar o corte: "o nome da empresa, os sete técnicos, o bairro e o tempo do verbo". Conferir que "Ela usa o uniforme da empresa?" no exemplo passe a "Ele usa o uniforme da empresa?" ou fique neutro ("a pessoa").'
  - criterio: metodo
    trecho: "Transcreva o miolo, da frase de abertura até a comparação; o resto pode ficar no áudio ou no e-mail impresso, grampeado aqui. Mantenha as perguntas, as comparações e o jeito de começar."
    por_que: 'A técnica do PWA é a transcrição pura de uma fala, "incluindo hesitação, repetição e a pausa antes da analogia", e o alerta nasce do susto de ver a fala no papel ("informal demais, repetitiva, mal escrita"). O capítulo adapta bem ao modo do Otávio, que copia um e-mail. Mas nenhum trecho transcrito de fala aparece em lugar nenhum. O único exemplo "testado" é prosa escrita e limpa ("Sei que parece estranho, então vamos pelos fatos."). Quem pensa falando ou contando é metade do elenco e do público, e fica sem ver o que se mantém (o "olha", a repetição, a pausa) e o que se corta (o nome, a data). A oficina também não diz o que fazer com as hesitações.'
    correcao: 'Acrescentar duas ou três linhas de fala transcrita, sem limpar, no parágrafo do registro. Pode ser a Renata no carro: "Olha, a sua coluna é… pensa numa mangueira de jardim, tá? Ela enverga inteira. Enverga inteira. Agora, se você dobra sempre no mesmo ponto…". Em seguida, uma frase dizendo que a repetição fica porque é ali que o paciente entende. No exemplo do campo 03, acrescentar: "Deixe as repetições e os “olha”; corte só o que é de uma pessoa."'
  - criterio: voz
    trecho: "Otávio não tinha reparado. Para ele, aquilo não era uma explicação. Era só o começo de qualquer conversa com um cliente novo."
    por_que: 'A cena de abertura, que é a primeira seção, tem duas antíteses explícitas: esta, que é o "não é X. É Y" em estado puro no fecho da cena, e "A cliente não precisava saber o nome do princípio. Precisava ver...". A lição cap01-r1 limita a uma por seção. O lint já está no teto (nao_e_e: 2). Há também um tique de vocabulário: "gente de verdade" aparece 5 vezes ("trabalho de projeto feito com gente de verdade", "testada em gente de verdade", no alerta, no guardar e na verificação), e "de verdade" 7. As palavras de apoio (só/já/ninguém) passam do limite do lint (10,9/mil).'
    correcao: 'Fechar a cena pela ação ou pelo detalhe: "Otávio não tinha reparado. Achava que estava só começando a conversa, como começa todas." Manter a antítese do "nome do princípio", que ensina. Deixar "gente de verdade" em no máximo dois lugares. No resto: "com clientes reais", "com quem estava na mesa", "com gente que precisava entender". Cortar três ou quatro "só" e "já" de apoio.'
  - criterio: ritmo
    trecho: "Publicar uma explicação madura pede três coisas: registrá-la como ela é, cortar só o que pertence àquela conversa e não melhorar o resto. A última é a que custa."
    por_que: 'A mesma afirmação aparece duas vezes na mesma seção: "A última é a que custa" e, cinco parágrafos depois, "Não melhorar é o mais difícil." A r2 já tinha apontado a duplicação ("o último é o que custa" / "O terceiro passo é o mais difícil"), e ela continua. No meio desses dois pontos, três parágrafos seguidos (cerca de 260 palavras) tratam de licença, sigilo e calendário. Numa seção chamada "A transcrição pura", a leitura em voz alta perde o fio do método. A seção anterior abre com pergunta e resposta seguidas ("Se é tão boa, por que Otávio nunca publicou...? São quatro razões") e mantém o andaime "A primeira... A segunda... A terceira razão... A quarta".'
    correcao: 'Cortar "A última é a que custa." da abertura e deixar a ênfase só em "Não melhorar é o mais difícil." Fundir os parágrafos do corte e do calendário num só, de até 6 frases (ver o primeiro problema). Abrir "Por que ela nunca foi publicada" sem a pergunta retórica: "Otávio nunca publicou a explicação do contrato, e não por falta de vontade. A primeira razão..."'
  - criterio: clareza
    trecho: "Para Renata, que pensa falando, é gravar a explicação da próxima vez que ela acontecer de verdade, com a licença do paciente e sem nada que o identifique."
    por_que: 'O parágrafo apresenta a gravação do atendimento como o jeito da Renata. O parágrafo seguinte diz que "na maioria das vezes" ela "faz outra coisa". O leitor aprende primeiro a regra e depois a exceção, que na verdade é a prática habitual. Além disso, a mesma licença aparece duas vezes em parágrafos vizinhos ("com a licença do paciente" / "precisa de licença e de cuidado").'
    correcao: 'Inverter: "Para Renata, que pensa falando, é dizer a explicação ao paciente e, no carro, refazê-la em voz alta enquanto ainda está quente." No parágrafo seguinte, a gravação do atendimento entra como alternativa que pede licença e cuidado: "Gravar a conversa real também serve, mas pede licença de quem está nela e cuidado com o que ela revela..."'
  - criterio: coerencia
    trecho: "Otávio publicou o texto no perfil do escritório, que estava parado desde a suspensão da agência."
    por_que: 'O cap. 12 já mostra o Otávio produzindo peças: "Otávio descobriu isso com um texto sobre banco de horas que levou três sextas", e o ritmo dele foi fixado lá como "Uma por semana, sexta à tarde". Se aquele texto saiu, o perfil não estava parado. Se não saiu, o leitor não sabe disso. A oração relativa cria um furo de arco que não é necessário.'
    correcao: 'Cortar a oração ("Otávio publicou o texto no perfil do escritório.") ou torná-la compatível: "no perfil do escritório, onde até ali só tinha saído o texto sobre banco de horas".'
  - criterio: clareza
    trecho: "Caio tem uma assim, e só percebeu quando o sócio, que já tinha ouvido a história umas trinta vezes, terminou a frase por ele: a de por que a obra parece parada na terceira semana."
    por_que: 'Depois dos dois-pontos, "a de por que..." parece explicar "a frase" que o sócio terminou, e não "uma assim". O leitor precisa reler para saber qual é a explicação do Caio.'
    correcao: '"Caio tem uma assim, a de por que a obra parece parada na terceira semana, e só percebeu quando o sócio, que já a tinha ouvido umas trinta vezes, terminou a frase por ele."'
  - criterio: aplicabilidade
    trecho: "Porque a versão falada foi testada em gente de verdade, e a reescrita não."
    por_que: 'A resposta correta da questão 2 contradiz a adaptação por modo que o próprio capítulo faz e que a questão 4 cobra. A versão testada do Otávio é escrita (o e-mail). Um leitor que pensa escrevendo pode hesitar entre a correta e o que ele mesmo fez.'
    correcao: '"Porque a versão que você já dá foi testada em gente real, e a reescrita não."'
  - criterio: honestidade
    trecho: "e esse é um dos jeitos mais seguros de identificá-la"
    por_que: 'É um superlativo sem base, no parágrafo que abre a comparação com dados do personagem. Na mesma linha, "Nenhuma equipe de comunicação conseguiria reproduzir esse processo" soa categórico contra as agências, que o arco do Otávio vai reabilitar no cap. 24.'
    correcao: '"e esse é um jeito simples de identificá-la." / "Uma equipe de comunicação não consegue reproduzir esse processo numa reunião de pauta, porque ele exige anos de testes que só a prática oferece."'
edicoes_de_linha:
  - '"É um trabalho de projeto feito com gente de verdade." -> "É um ajuste fino feito com clientes reais." ("trabalho de projeto" ainda soa como tradução de "design")'
  - '"A explicação que você repete há anos foi desenhada com gente de verdade, ao longo de anos." (guardar) -> "A explicação que você repete há anos foi lapidada, conversa a conversa, com quem precisava entender." (evita "desenhada" e o "anos... anos")'
  - '"Otávio fez a conta sem querer: o primeiro e-mail que encontrou no arquivo" -> "Otávio conferiu no arquivo: o primeiro e-mail que encontrou" (ele procurou; não foi sem querer)'
  - '"Antes de cortar, Otávio escolheu de onde cortar." -> "Antes de cortar, Otávio escolheu o e-mail."'
  - '"Três semanas depois, numa sexta à tarde, Otávio publicou" -> "Na sexta marcada, à tarde, Otávio publicou" (as três semanas já foram ditas dois parágrafos antes)'
  - '"A cliente franziu a testa, como todos franzem. Otávio já sabia que franziria" -> "A cliente franziu a testa, como todos franzem. Otávio já contava com isso" (três "franz-" em duas frases)'
  - '"Ela tem uma comparação que você usa sempre." (verificação, q. 3, opção b) -> "Ela tem uma comparação ou uma pergunta que você usa sempre." (casa com o sinal 2 da nota)'
diagramacao:
  - 'p. 16 e p. 23: a renderização está desatualizada em relação ao manuscrito. A p. 16 imprime "bastava abrir o e-mail mais recente sobre o assunto", e a p. 23 (q. 4, opção b) imprime "Copiando o e-mail mais recente em que ele a tinha dado". As duas frases contradizem o texto, em que Otávio usa um e-mail de dois anos antes. O manuscrito já diz "um e-mail em que já a tinha dado". Regerar o PDF e as PNGs antes de aprovar.'
  - 'p. 15: cerca de 22% em branco no pé, porque a fig. 16.2 (indivisível) foi para a p. 16. O problema já estava na r2 e não é um branco aceito pelo projeto. Pôr a figura logo depois do parágrafo "Maturidade produz encurtamento..." e o parágrafo do Caio depois dela, ou deixar o Caio subir para antes da figura.'
  - 'p. 17: cerca de 25% em branco no pé, depois da cena da Helena, porque o bloco exemplo (indivisível) foi para a p. 18. Permitir quebra entre "A versão melhorada" e "A versão testada", ou mover a nota de alerta para depois do parágrafo da Helena para ocupar o pé.'
  - 'p. 18: o sobretítulo "NA PRÁTICA" continua colado ao título do exemplo e ao topo da página, sem entrelinha. O problema já estava na r2.'
  - 'p. 19: o campo 01 pede "Marque ao lado de cada uma quantos dos cinco sinais ela tem", mas as linhas ocupam a largura toda. Uma coluna estreita à direita ("sinais: __/5") tornaria a instrução executável de relance.'
  - 'p. 21 (branco antes do esqueleto indivisível), p. 19 (branco antes do campo 03) e p. 24 (fim de capítulo): aceitos pelo projeto.'
veredito: "Capítulo muito perto do 9. As correções da r2 entraram quase todas, mas o raciocínio do sigilo agora se contradiz (a data \"não importa\" e depois resolve), o caso da manicure esbarra na Lei do Salão-Parceiro e a transcrição de fala nunca aparece no papel. Com isso, a antítese da abertura e a renderização atualizada, aprova."
