capitulo: 11
iteracao: 1
notas: {metodo: 8.4, voz: 8.6, originalidade: 8.7, clareza: 8.8, ritmo: 8.9, concretude: 8.6,
        coerencia: 8.3, aplicabilidade: 8.0, impresso: 8.8, honestidade: 8.6}
bloqueadores:
  - 'Contradição com o método (os quatro modos, cap. 7) e com o próprio capítulo, numa regra que o leitor vai seguir. A rede manda: "Fale primeiro, edite depois." e justifica: "Escrever direto costuma dar em texto correto e sem vida. Grave ou fale em voz alta, e só depois limpe". Para quem pensa escrevendo, isso é o atrito de formato que os caps. 5 e 7 ensinaram a evitar, e o próprio cap. 11 desmente a regra quatro parágrafos antes: os e-mails do Otávio, "escritos às pressas, tinham um léxico mais vivo que os pareceres". O cap. 7 registra que Otávio "continuou escrevendo à mão". A fonte do PWA, aliás, diz "Áudio bruto, no seu modo". A mesma premissa contamina a oficina (campo 01 só admite gravar) e a verificação 03 ("Qual é o jeito certo de descobrir o próprio léxico?" -> só gravar), que tratam como errado o caminho que o capítulo mostrou funcionando para Otávio e Lúcia.'
pontos_fortes:
  - 'A cena de abertura é a melhor aplicação do plano até aqui para o Caio: o modo dele aparece já no primeiro gesto ("atravessou a sala contando os passos, de uma parede à outra, em silêncio"), o bordão do elenco entra com naturalidade, e a prova física encerra a discussão sem discurso ("A cliente passou o dedo, cheirou, e a conversa sobre o impermeabilizante acabou ali").'
  - 'O contraste que funda o conceito é exato e dá para explicar a outra pessoa: a frase que viaja ("O arquiteto disse que a parede estava mentindo") contra a legenda que ninguém repetiria ("É fundamental realizar uma vistoria técnica criteriosa antes da aquisição de imóveis antigos"). O detalhe de a palavra "solução" nunca aparecer nos áudios e aparecer "em quase toda legenda" é um achado de ofício, e volta no fecho com humor seco ("Na maior parte das vezes, encontra uma “solução” para apagar").'
  - 'A ficha de léxico (fig. 11.1) é uma figura útil de verdade: uma ideia, legível em P&B, e um modelo que o leitor copia. As regras escritas "como descrição do que você já faz" ("eu digo o preço quando falo de problema") são concretas e verificáveis.'
  - 'O parágrafo dos limites ("use a comparação e diga, logo em seguida, onde ela para de valer") é ganho real sobre o PWA para um público de saúde, direito e finanças, e reaparece na roteiro_nota. O exemplo do balde furado tem régua prática ("o que ele não entendeu hoje, a gente vê amanhã antes de passar para a frente").'
problemas:
  - criterio: metodo
    trecho: 'Fale primeiro, edite depois. / Escrever direto costuma dar em texto correto e sem vida. Grave ou fale em voz alta, e só depois limpe o que atrapalha o entendimento.'
    por_que: 'Ver bloqueador. A regra é universal e contradiz os modos; o parágrafo do Otávio no próprio capítulo prova o contrário. O leitor que se descobriu escritor no cap. 7 recebe aqui a ordem de gravar.'
    correcao: 'Regra 1: "Produza no seu modo, edite depois." Porquê: "Grave se você pensa falando; escreva rápido, à mão ou no e-mail, se pensa escrevendo; responda a uma pergunta se pensa respondendo. O que mata a voz é corrigir enquanto produz. Limpe depois, só o que atrapalha o entendimento." Oficina, campo 01, exemplo: "Três explicações reais, no seu modo: três áudios de dois a três minutos, ou três e-mails escritos às pressas a clientes, ou três respostas dadas a uma pergunta de verdade. Sem preparo e sem corrigir." Verificação 03, opção a: "Olhar explicações reais, no seu modo, sem corrigi-las." e explicação coerente. Checklist 1: "Reuni e passei para o papel três explicações reais".'
  - criterio: aplicabilidade
    trecho: 'tempo: 40'
    por_que: 'O tempo não é honesto (lição cap08-r1) e o próprio texto o desmente: "Caio fez em uma tarde." Gravar três áudios de dois a três minutos já são 6 a 9 minutos; transcrever à mão, palavra por palavra, 6 a 9 minutos de fala (perto de mil palavras) leva mais de meia hora sozinho. Depois vêm circular, preencher quatro campos e escrever cinco regras. Além disso, a oficina não diz ONDE se faz a transcrição inteira: o campo 01 tem 7 linhas para "trechos", e a instrução de gravar e transcrever está escondida no exemplo em cinza ("Grave antes três explicações..."), que o leitor tende a pular.'
    correcao: 'tempo: 60, com tempo_nota: "Conta a gravação e a transcrição. Se preferir, grave e transcreva na véspera, no caderno de campo, e use este tempo para ler, circular e escrever as regras." Passar a instrução para o rótulo do campo 01: "Grave (ou reúna) três explicações reais e transcreva-as no caderno, sem corrigir. Copie aqui os trechos mais seus". Se o projeto admite, sugerir a transcrição automática do celular com a ressalva de repor à mão os "né" e as hesitações que ela apaga.'
  - criterio: aplicabilidade
    trecho: 'Estrutura de frase | Curta e seca, ou longa e cheia de ramos | Conte as palavras das suas últimas cinco frases faladas'
    por_que: 'O capítulo define o léxico em quatro partes (tabela 11.1, guardar 2, ficha do Caio), mas a oficina só tem campo para três: palavras (02), comparações (03), ponto de entrada (04). A estrutura de frase fica sem lugar para ser anotada e sem item no checklist; aparece só como sugestão na regra 3 ("Eu falo em frases…"). O leitor monta uma ficha incompleta justamente na parte mais fácil de medir. Além disso, o campo 04 pede "as palavras que não aparecem em nenhuma das três gravações, mas aparecem no que você publica" e o checklist cobra "as palavras que só aparecem quando publico": o leitor que não publica (a Lúcia do início do livro, boa parte do público) fica sem material (lição cap01-r1).'
    correcao: 'Campo 03 passa a "De onde vêm as suas comparações, e como são as suas frases", com o exemplo: "... E conte as palavras de cinco frases seguidas de uma transcrição: você fala curto ou comprido?" (3 linhas). Campo 04, exemplo: "...mas aparecem no que você publica. Se ainda não publica, compare com um texto formal seu: um laudo, um relatório, um e-mail que você revisou muito." Ajuste igual na ajuda do checklist 3.'
  - criterio: honestidade
    trecho: 'Esse é um fenômeno que se repete com quase todo especialista na hora de publicar.'
    por_que: 'O limite é 2 generalizações sobre terceiros por capítulo (lições cap01-r4/cap02-r2); o capítulo tem pelo menos seis: "quase todo especialista" (duas vezes, prosa e Para guardar), "quase todo profissional carrega da faculdade o hábito", "Quase ninguém descreve o próprio jeito de falar", "Há cinco perdas mais comuns", "Quem tenta descrever o próprio jeito de falar costuma descrever o jeito como gostaria", "o problema raramente é de estratégia". A pior é a do Para guardar, que faz o leitor memorizar uma afirmação empírica sem fonte. "Esse é um fenômeno que se repete" é ainda voz de palestra.'
    correcao: 'Prosa: "Caio não inventou esse desvio. No consultório, na obra, na reunião, a gente fala do próprio jeito..." ; "A escola ensinou que texto escrito é mais formal que a fala, e a faculdade acrescentou o hábito de escrever para a banca." ; "Ninguém descreve o próprio jeito de falar com facilidade" -> "O próprio jeito de falar parece natural demais para ter partes." ; "Há cinco perdas, e todas acontecem com boa intenção." ; "Se a pessoa não souber dizer de quem é, o problema está no vocabulário". Guardar 1: "Na hora de publicar, é fácil trocar a própria linguagem pela de todo mundo, e apagar justamente a parte que faria alguém reconhecer você." Manter só "costuma descrever", que é observação sobre o método.'
  - criterio: coerencia
    trecho: 'Um casal jovem tinha encontrado um apartamento de 1968 no Botafogo, perto da estação'
    por_que: 'Três tropeços na primeira frase da cena. (1) O capítulo nunca diz que a cena é em Campinas; "Botafogo, perto da estação" o leitor lê como Rio de Janeiro (bairro e estação de metrô famosos), e os personagens vivem em cidades fixas. (2) "Apartamento de 1968" repete o ano do apartamento da Vila Itapura do cap. 7 ("Teve uma obra, um apartamento de 1968, na Vila Itapura…"); a lição cap08-r1 pede números que não coincidem. (3) Depois do cap. 3, é a segunda vez que o caso do Caio gira em torno de um cliente que leva as palavras do arquiteto para casa: no cap. 3 a cliente encaminhou o áudio à irmã e o proprietário do Guanabara passou a "explicar às visitas, com as palavras do arquiteto, por que o chão tinha ficado". A cena do plano é obrigatória, mas precisa reconhecer o eco e extrair dele o ganho novo (lição cap02-r1).'
    correcao: '"Um casal jovem tinha encontrado um apartamento de 1971 no Botafogo, em Campinas, a duas quadras da antiga estação de trem". No início de "A frase que viaja", uma frase de ganho: "Não era a primeira vez que um cliente levava para casa as palavras dele; o dono do piso de granilite tinha feito o mesmo. Era a primeira vez que Caio olhava para as palavras, e não para o assunto."'
  - criterio: concretude
    trecho: 'Caio explicou que a tinta nova servia para esconder uma infiltração antiga, provavelmente do banheiro do vizinho, e que o problema não era a mancha, e sim o cano que a alimentava. Disse quanto custava abrir, trocar e fechar, em quanto tempo'
    por_que: 'Detalhe de ofício que um arquiteto ou engenheiro leitor contesta (lição cap09-r1). Se o vazamento vem do banheiro do vizinho, o conserto está na unidade vizinha, é responsabilidade do vizinho (ou do condomínio, se for prumada), e ninguém dá custo e prazo de "abrir, trocar e fechar" um cano que não viu, na primeira visita. Mais adiante, a versão "técnica" que a cliente não repetiu, "umidade ascendente por infiltração na parede hidráulica", mistura termos: umidade ascendente é a que sobe do solo por capilaridade, não a de vazamento de tubulação. Justamente a frase que deveria soar como o jargão correto soa errada a quem é da área. Também: raspar a parede de um imóvel à venda com "uma faca de cozinha" pedida sabe-se a quem, sem licença, é pouco verossímil para quem cuida de autorização no espaço alheio (lição cap03-r2).'
    correcao: '"...uma infiltração antiga, provavelmente do banheiro da suíte, do outro lado da parede, e que o problema não era a mancha, era o cano que a alimentava. Disse quanto custava, por alto, abrir, trocar e fechar..." (e cortar a antítese ", e sim"). Na frase técnica: "Não disse “há indícios de vazamento na tubulação embutida da parede hidráulica”." Na raspagem: "Pediu licença à corretora, tirou a chave do carro do bolso e raspou um palmo de tinta perto do rodapé".'
  - criterio: coerencia
    trecho: 'Otávio, que suspendeu a agência no capítulo 4, ainda não sabe quando vai retomar o trabalho com ela. Quando retomar, vai levar uma folha como essa'
    por_que: 'O narrador profetiza o desfecho do arco reservado ao cap. 24 ("Otávio volta à agência — agora com áudios, um manual de voz") e gasta a cena antes da hora (lições cap04-r1 e cap08-r1). Também é a única frase do capítulo em que o narrador sabe o futuro de um personagem.'
    correcao: '"O manual serve também para quem ajuda você a produzir. Otávio, com a agência suspensa desde o capítulo 4, releu a ficha dele e entendeu o que tinha faltado aos quinze posts por mês: uma folha que dissesse a quem escreve no nome dele como ele escreve. Sem ela, qualquer agência volta ao “Você sabia?”, que é o vocabulário de ninguém."'
  - criterio: clareza
    trecho: 'NUNCA USA | “É fundamental”, “aquisição”, “solução”, “ambiente clean”.'
    por_que: 'A ficha diz que Caio "nunca usa" exatamente as palavras da legenda que ele escreveu ("É fundamental realizar uma vistoria técnica criteriosa antes da aquisição"). O texto esclarece que ele nunca as DIZ nos áudios, mas a figura, que o leitor vai copiar, afirma o contrário do que a cena mostrou. O mesmo descompasso aparece no "Ponto de entrada": "A conclusão vem no fim", quando a primeira fala dele na cena é a conclusão ("Essa parede está mentindo para vocês").'
    correcao: 'Rótulo da linha: "Nunca diz (e escrevia)". Ou valor: "“É fundamental”, “aquisição”, “solução”, “ambiente clean”: nenhuma aparece nos áudios; todas apareciam nas legendas." Ponto de entrada: "Quando explica, começa por uma obra: “Teve uma obra…”. A conclusão vem no fim."'
  - criterio: voz
    trecho: 'O que some entre a conversa e a publicação quase nunca é informação. É o que torna a informação sua.'
    por_que: 'O lint conta 1 "não é X. É Y", mas as antíteses disfarçadas se acumulam por seção (lição cap01-r1: no máximo uma por seção). Em "O que se apaga": esta, mais "No primeiro caso, ela chega pelo vocabulário que todos usam. No segundo..." e "Nada disso significa escrever com erros". Em "A frase que viaja": "A cliente não repetiu ao marido a informação técnica. Não disse... Repetiu a frase do Caio" e "o problema raramente é de estratégia. É de vocabulário". Na cena e no léxico: "o problema não era a mancha, e sim o cano", "As comparações vinham de gente, e não de engenharia". Somadas, dão ao capítulo a cadência de curso que o resto do texto evita.'
    correcao: '"Entre a conversa e a publicação, a informação quase sempre sobrevive. Some o que a tornava sua." ; "As comparações vinham de gente." ; "Se a pessoa não souber dizer de quem é, você escreveu na língua de todo mundo." ; cortar "No primeiro caso... No segundo..." e fechar em "A diferença está no caminho: o vocabulário que só aquela professora usa faz a informação chegar com o nome dela junto."'
  - criterio: concretude
    trecho: 'compara a coluna a coisas que se dobram, como cabo de vassoura e mangueira de jardim'
    por_que: 'Cabo de vassoura não se dobra; é o exemplo clássico do rígido. Como está, o detalhe que devia provar o repertório da Renata é um erro de imagem que uma fisioterapeuta leitora percebe na hora (e o cap. 12 herda "comparações de coisas que dobram").'
    correcao: '"compara a coluna a coisas que dobram ou não dobram: a mangueira de jardim que enverga inteira, o cabo de vassoura que quebra no ponto fraco".'
  - criterio: honestidade
    trecho: 'Três pessoas comentaram contando a própria parede mentirosa. Uma delas pediu orçamento.'
    por_que: 'É o terceiro capítulo seguido que fecha com o resultado comercial chegando (cap. 3: "Duas pessoas mandaram mensagem perguntando se ele atendia em Valinhos"; cap. 10: a empresária das lavanderias). A batida ensina que a peça certa traz cliente na semana, perto da promessa de resultado que o briefing proíbe, e é menos interessante que o ganho próprio deste capítulo: a frase viajar até um desconhecido.'
    correcao: '"Três pessoas comentaram contando a própria parede mentirosa. Uma delas, que Caio não conhecia, escreveu que tinha ido abrir os armários do apartamento que estava para comprar." Cortar "No orçamento, a pessoa escreveu que tinha gostado da parte dos armários." e abrir o parágrafo seguinte em "Caio guardou a ficha de léxico...".'
  - criterio: clareza
    trecho: 'A professora do balde sabe tanto quanto a da legenda, e diz a mesma coisa.'
    por_que: 'O exemplo apresenta UMA professora em dois registros ("A mesma professora, como ela explica às mães"); a frase trata as duas versões como duas pessoas, e o leitor apressado perde o ponto central (é a mesma pessoa que se apaga ao escrever). Também: professora de reforço escolar raramente está "na porta da escola"; o reforço acontece fora dela.'
    correcao: '"A professora sabe o mesmo na legenda e na porta da sala, e diz a mesma coisa." No exemplo: "A mesma professora, como ela explica às mães na saída da aula."'
  - criterio: clareza
    trecho: 'A primeira é a comparação esquisita, aquela que sempre funciona no atendimento e que você acha informal demais para escrever. A segunda é a expressão regional'
    por_que: 'As cinco perdas são uma lista que o leitor vai consultar ao revisar o próprio texto, e a rede ("Mantenha uma marca sua por peça") remete a elas. Enfileiradas em "A primeira... A segunda... A terceira... A quarta... A quinta", num parágrafo de seis frases, ficam mecânicas de ler e impossíveis de achar depois (lição cap09-r1).'
    correcao: 'Manter a frase de abertura e passar as cinco perdas para um bloco nota numerado (1 a 5, uma linha cada, com o exemplo "olha, isso aqui é delicado" na quarta). O parágrafo do bordão continua em prosa, logo depois.'
  - criterio: coerencia
    trecho: 'E o ponto de entrada era sempre o mesmo, a ponto de a sócia de um escritório vizinho imitá-lo nas reuniões'
    por_que: 'Não se entende que reuniões são essas nem por que a sócia de outro escritório estaria nelas; a imagem pede um detalhe de ofício do mundo do Caio. "Foi o mais fácil do livro até ali", sobre Renata, também quebra o enquadramento: personagens não leem o livro.'
    correcao: '"a ponto de o mestre de obras imitá-lo no canteiro: “Teve uma obra…”." E "Para Renata, que pensa falando, foi fácil: ela já gravava áudios no estacionamento da clínica".'
edicoes_de_linha:
  - 'Depois do vídeo do granilite -> Depois do vídeo do piso de granilite, gravado numa tomada só'
  - 'Na semana seguinte, Caio refez a legenda da foto de obra. -> Na semana seguinte, Caio escreveu a legenda da foto de obra seguinte.'
  - 'Os motivos são compreensíveis. -> Os motivos se entendem.'
  - 'O bordão merece um cuidado à parte, porque é a perda mais fácil de justificar. -> O bordão é a perda mais fácil de justificar.'
  - 'e vale trocá-la ou explicá-la numa linha -> e é melhor trocá-la ou explicá-la numa linha'
  - 'Lúcia pediu à amiga do grupo de estudos que lesse três respostas dela -> Lúcia pediu à amiga do grupo de estudos que lesse três respostas que ela tinha dado por áudio no grupo'
  - 'roteiro: acrescentar a linha do fecho que o esqueleto pede -> "{e feche do jeito que você fecha quando a pessoa entende}"'
  - 'Uso essa comparação há anos porque é a que faz a pessoa entender. -> Uso essa comparação há anos porque é com ela que a pessoa entende.'
diagramacao:
  - 'p014: cerca de um quarto da página em branco depois de "“Teve uma obra…”." porque a figura 11.1 inteira não coube e foi para a p015. Não é seção de página inteira nem esqueleto indivisível; é branco evitável. Deixar o parágrafo "Os outros três personagens..." subir para antes da figura, ou mover a figura para depois dele.'
  - 'p019: a instrução operacional da oficina (gravar e transcrever antes) está no exemplo do campo 01, em itálico cinza de corpo pequeno, com cara de exemplo opcional. Ou vai para o rótulo, ou para uma linha de instrução em corpo normal antes dos campos.'
  - 'p020: "Do caderno para a rede" começa no pé da página com título, intro e só a regra 1; as regras 2 e 3 vão para a p021, separadas da primeira. Se a oficina couber em uma linha a menos, empurrar a abertura da rede inteira para a p021 ou segurar as três regras juntas.'
veredito: 'Capítulo com a melhor cena do Caio até aqui e um conceito cristalino, reprovado por uma regra de rede que contradiz os modos de pensar (e o próprio parágrafo do Otávio), por uma oficina de tempo irreal e incompleta diante das quatro partes do léxico, e por generalizações e antíteses acima do limite.'
