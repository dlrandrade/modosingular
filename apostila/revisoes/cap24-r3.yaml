bloqueadores: []
pontos_fortes:
  - 'A rodada 2 foi absorvida quase por inteiro. O maço de versos agora sai do escritório só como foto, depois da conferência da data ("Otávio separou os que já tinham passado da data a lápis, fotografou o verso de cada um [...] Só a foto do verso saía do escritório"). As linhas 8 e 9 do manual ganharam origem concreta (a legenda e a hashtag). A regra dos dois minutos vem com a condição no Guardar e na questão 03 ("A sua ajuda só digita e formata o que você manda"). A rede adotou a estrutura do PWA (critérios que o leigo confere e convite honesto).'
  - 'A cena da pasta continua sendo o melhor do capítulo: quatro objetos tirados um a um, o calendário do Dia do Trabalhador fechado a pedido e as cinco regras lidas em silêncio até "Eu nunca escrevo “você sabia?”". O conceito nasce dos objetos, e a pergunta de Helena ("quem escolhe o que vai ser publicado?") resume numa linha a diferença entre os dois contratos.'
  - 'A adaptação ao modo do Otávio é precisa e dá ao capítulo detalhe de ofício próprio. O áudio do PWA virou foto do verso do parecer, a transcrição virou digitação, e a triagem de comentários vem com o argumento certo da advocacia: "Uma dúvida técnica respondida por outra pessoa seria, afinal, uma opinião jurídica que ele não deu, assinada com o nome dele."'
  - 'O fecho amarra fios de vários capítulos sem anunciar nada: a empresária que chegou pelo contador das padarias de Seu Ednaldo (cap. 10), a pergunta do banco de horas (cap. 21) e a frase sublinhada na folha de fluxo. A cena termina numa ação, sem moral, e mostra um ganho que as artes azuis nunca trouxeram: "uma cliente que leu, foi conferir e voltou com uma pergunta da própria empresa".'
problemas:
  - criterio: coerencia
    trecho: 'A versão digitada terminava assim: “Controle é proteção.” Sílvia tinha achado que a pergunta deixava o texto em aberto e fechou com uma frase de efeito. Otávio desfez a troca, e Sílvia não se ofendeu. Pediu que a regra entrasse também no manual, como sétima linha'
    por_que: 'O conserto da rodada 2 tirou a sobreposição com a sexta linha, mas criou outra, com a quarta regra do manual que Sílvia leu na primeira página: "Eu termino com uma pergunta que o empresário pode fazer a si mesmo." Trocar a pergunta por uma afirmação viola uma regra escrita que já estava na mesa dela. Sílvia não errou por falta de instrução: decidiu contra ela. É o caso que o capítulo diz não ser o típico ("o problema está na instrução, e não na equipe"), e ele aparece justamente na cena que abre a seção e sustenta a figura 24.1 ("A última frase voltou trocada"). O leitor atento conclui que o manual estava bom e a leitura é que falhou, o contrário da lição da seção.'
    correcao: 'Fazer a troca cair dentro da regra 4, para que a sétima linha cubra uma lacuna real. Sílvia manteve uma pergunta e a "melhorou": "A versão digitada terminava assim: “A sua empresa confere a folha de ponto todo mês?” Sílvia tinha achado a pergunta mais direta assim. Tinha tirado o quem, que era o que obrigava o empresário a dizer um nome." A regra 4 continua cumprida, a troca é de boa-fé e a sétima linha ("a última frase é sempre dele, palavra por palavra") passa a ser necessária. A frase sobre a folha de fluxo e a mesa dela pode sair.'
  - criterio: clareza
    trecho: '{regra: "Mande o material, e não a ideia do material.", porque: "Um áudio ou um texto seu já carrega a voz. Uma sugestão de tema obriga outra pessoa a escrever por você."}'
    por_que: 'A rede agora ensina uma peça ("Como escolher alguém da minha área"), mas metade dos seus blocos continua falando do processo de delegar, e não da peça. A regra 3, o segundo e o terceiro "Faça assim" ("Sublinhar a última frase antes de mandar o material."; "“Se alguma coisa não couber no manual, me pergunte antes.”") e o primeiro "Evite" ("“Faz do jeito que achar melhor, você é que entende de redes.”") são instruções para o contratado. O leitor que ainda não delega (a oficina admite "daqui a um ano") não sabe o que fazer com eles ao escrever a peça. A intro também supõe um ajudante que ele pode não ter: "É o primeiro material que você mandaria a quem vai ajudar você".'
    correcao: 'Deixar os três blocos da rede só para a peça. Regra 3: "Dê um sinal de alerta concreto." / porque: "Um critério diz o que procurar; o alerta diz quando sair, e é o que o leigo lembra na hora de decidir." Faça: manter o do Otávio e acrescentar dois exemplos de outras áreas, por exemplo uma fonoaudióloga ("veja se ela pede para ouvir a criança antes de falar de prazo") e um mecânico de motos ("desconfie de orçamento fechado antes de abrir o motor"). Evite: trocar a fala ao contratado por "Critérios que dependem de preço ou de título." Na intro, condicionar: "Se um dia tiver ajuda, é o primeiro material que você mandaria; a última frase é sua."'
  - criterio: honestidade
    trecho: 'As regras de publicidade da advocacia, como as da medicina, da psicologia e de outras áreas, proíbem promessa de resultado, captação indevida de clientela e menção a casos identificáveis.'
    por_que: 'Promessa de resultado e captação indevida valem para todas. "Menção a casos identificáveis", dita no mesmo pacote, não vale do mesmo jeito: a resolução do CFM de 2023 admite imagem de paciente com autorização e dentro de condições, e o leitor médico pode desmentir a frase. A lição cap02-r2 manda formular pelo que é certo. Na mesma linha, a nota do roteiro diz "o convite honesto, sem pedido, faz o papel que a chamada faria". Lida por um advogado, a frase soa como atalho para contornar a vedação, justamente no capítulo que pede cuidado com o código.'
    correcao: '"...proíbem promessa de resultado e captação indevida de clientela, e limitam a exposição de casos de clientes." Nota do roteiro: "Nenhuma promessa de resultado. Confira no seu código se a chamada para contratar é permitida; na advocacia não é. O convite honesto não pede nada, e por isso cabe em qualquer código."'
  - criterio: metodo
    trecho: 'Toda sexta-feira, às cinco e meia, Otávio fotografaria os versos já liberados, os parágrafos que escreve à mão atrás da última folha de cada parecer e que só saem depois da data anotada a lápis no canto, e mandaria as fotos para Sílvia.'
    por_que: 'No cap. 21, a sexta das cinco e meia tem três passos: "Conferir as datas dos versos, escolher um que já passou da data, tirar o que identifica e publicar". O capítulo 24 mantém a data e passa a publicação à agência, mas o passo "tirar o que identifica" some. Como a agência digita "sem trocar nenhuma palavra", esse passo precisa ficar explicitamente com o Otávio, antes da foto. É a proteção de sigilo que o livro trata como regra (lição cap13-r1), e o leitor de área regulamentada precisa ver onde ela fica quando a publicação passa a outras mãos.'
    correcao: '"...fotografaria os versos já liberados, depois de conferir, como sempre, que nada neles leva a um cliente, e mandaria as fotos para Sílvia." No parágrafo de maio: "Otávio separou os que já tinham passado da data a lápis, releu cada um procurando o que pudesse levar a um cliente, fotografou o verso..."'
  - criterio: coerencia
    trecho: 'Um maço com dez dos textos que ele tinha publicado desde setembro, no perfil do escritório, impressos e grampeados.'
    por_que: 'O capítulo afirma que "Otávio tinha as quatro" condições, a primeira delas "ao menos trinta peças no seu formato-base". Pelo cap. 21, ele publica uma peça por semana desde setembro, e duas caíram em dezembro. Em abril, a conta dá entre 27 e 30, e o leitor que a fizer fica em dúvida (lição cap01-r1: contas de personagem têm de fechar). Além disso, o formato-base do Otávio (o verso do parecer) só existe desde janeiro.'
    correcao: 'Tornar a conta visível e fechada: "Um maço com dez das trinta e poucas peças que ele tinha publicado desde setembro, no perfil do escritório, impressos e grampeados." Se a regra das trinta repetições do cap. 20 conta só o formato-base, dizer "trinta peças escritas à mão", que é o formato dele desde setembro, e não "o verso", que é o ritual de janeiro.'
  - criterio: coerencia
    trecho: 'A oitava veio da legenda da terceira semana, que repetia a pergunta final com outras palavras; a nona, de uma hashtag que ele nunca usaria.'
    por_que: 'No primeiro mês, a agência "só digitava e agendava, com a arte mais simples possível, o texto sobre fundo branco". A legenda não aparece em nenhuma descrição desse escopo, nem na proposta de abril. O leitor não sabe se escrever legenda estava entre as tarefas do primeiro mês. Se estava, Sílvia escrevia palavras desde o começo, o que contradiz "sem trocar nenhuma palavra". A origem das linhas 8 e 9 é boa. Falta dizer que a legenda estava no pacote.'
    correcao: 'Na proposta de abril: "A agência digitaria sem trocar nenhuma palavra, poria uma legenda curta, conferiria com as regras e agendaria para terça..." Assim a legenda entra no escopo desde o início, e as linhas 8 e 9 mostram onde as palavras novas vazaram.'
  - criterio: concretude
    trecho: 'Uma paisagista: “A partir das fotos e áudios enviados por mim: transcrição sem troca de palavras, legendas do vídeo e agendamento.”'
    por_que: 'Paisagista não está na lista de figurantes permitidos do elenco. As outras duas profissões da oficina estão na lista, mas já tiveram muitas participações: corretor de seguros aparece nos caps. 1, 4, 10 e 17, e designer de interiores nos caps. 5 e 10. Profissões ainda pouco usadas, como professora de piano, pediatra ou farmacêutica, dariam mais variedade ao fim do livro.'
    correcao: 'Trocar a paisagista por uma profissão da lista, por exemplo: "Uma professora de piano: “A partir dos vídeos e áudios enviados por mim: transcrição sem troca de palavras, legendas do vídeo e agendamento.”" Registrar em ESTADO.yaml > figurantes.'
  - criterio: ritmo
    trecho: 'Sem pauta, sem calendário, sem redação, o trabalho da agência encolheu para digitação e agenda, e mais tarde arte e triagem de comentários, e o preço acompanhou.'
    por_que: 'São três "e" coordenando blocos de naturezas diferentes (as tarefas agora, as tarefas depois, o preço). Lida em voz alta, a frase perde o sujeito no meio, e o "e o preço acompanhou" chega sem apoio.'
    correcao: '"Sem pauta, sem calendário, sem redação, o trabalho da agência encolheu para digitação e agenda; arte e triagem viriam mais tarde. O preço acompanhou."'
edicoes_de_linha:
  - '"A agência voltou a ser útil exatamente porque deixou de ter de adivinhar." -> "A agência voltou a ser útil porque deixou de ter de adivinhar." ("exatamente" é enchimento)'
  - '"Parece razoável e entrega à agência a decisão mais importante, a do que dizer." -> "Parece razoável, e entrega à agência a decisão mais importante: a do que dizer."'
  - '"Sílvia fez uma pergunta que Otávio esperava, e que merece ser feita por qualquer agência:" -> "Sílvia fez a pergunta que Otávio esperava, a que qualquer agência séria faria:"'
  - 'Figura 24.1, nota da terceira semana: "Sete linhas. Nenhuma troca na pergunta final." -> "Sete linhas. A pergunta final voltou intacta; a legenda, não." (o texto diz que a oitava linha nasceu da legenda da terceira semana)'
  - '"Delegar uma etapa por vez tem uma vantagem que só aparece quando algo dá errado:" -> "Delegar uma etapa por vez só mostra a sua vantagem quando algo dá errado:"'
diagramacao:
  - 'p14: cerca de 22% de branco no pé, depois de "Otávio preferiu esse silêncio ao antigo barulho", porque o quadro Compara, que não é campo de escrita, passou inteiro para a p15. Dá para puxar o primeiro parágrafo depois do quadro ("O contrato novo também custava menos...") para antes dele, ou permitir que o texto corra por baixo. É o único branco evitável do capítulo.'
  - 'p18: cerca de 20% de branco depois do Para guardar, antes da oficina em página própria. p19: cerca de 18% depois do campo 02, porque o campo 03 é indivisível. p21: cerca de 15% antes do esqueleto indivisível. Os três são aceitos pelo projeto; ficam só para registro.'
  - 'p22: cerca de 15% de branco depois da nota do roteiro, porque a Verificação abre página nova na p23. p23: cerca de 22% no pé. p24: cerca de 60% livres no fim do capítulo. Aceitável se a abertura do Fechamento em página nova for decisão de projeto.'
  - 'Figura 24.1 (p17): legível em preto e branco. A barra de destaque se distingue também pelo comprimento, e o rótulo traz o valor por extenso. Campo 05 (p20) agora com cinco linhas numeradas: cabe a regra e as datas. As PNGs (21:03:20) são posteriores ao manuscrito (21:03:16), então a revisão visual vale para o texto atual.'
veredito: 'Aprovável: a média fica em torno de 9,1, sem bloqueadores e com todos os critérios acima de 8. A cena e o método estão no ponto. Antes de fechar, vale uma passada para resolver a troca da última frase, que ainda viola uma regra do manual já existente, separar na rede o que é peça do que é instrução ao contratado e acertar a frase sobre casos identificáveis.'
