capitulo: 4
iteracao: 2
notas: {metodo: 8.4, voz: 8.9, originalidade: 8.7, clareza: 8.8, ritmo: 9.0, concretude: 9.3,
        coerencia: 8.5, aplicabilidade: 8.6, impresso: 8.3, honestidade: 8.4}
bloqueadores:
  - 'Contradição interna com o método: o capítulo resolveu o bloqueador da r1 no enredo e o recriou na seção de rede, agora dirigido ao leitor. A prosa afirma: "A agência pode voltar a ter um papel, e melhor do que o de antes, mas só depois que houver uma voz para amplificar. Até lá, qualquer arranjo novo repetiria o erro com outra roupa." A figura 4.2 põe "Você descobre a sua linguagem — As fases II e III deste livro" antes de "Você produz a matéria-prima" e de "O terceiro organiza e formata". Cinco páginas depois, a rede diz que "As regras valem se alguém edita ou publica por você" e manda, no dia 4, "Mandar três áudios por semana, de dois a quatro minutos, como insumo, em vez de aprovar pautas prontas". Esse é exatamente o arranjo novo que o capítulo acabou de chamar de "o erro com outra roupa" e que o plano reserva ao Otávio no cap. 24. O leitor que tem agência sai com duas ordens opostas: suspender, como Otávio, ou mudar o arranjo já. Além disso, "três áudios por semana" fixa um ritmo antes do cap. 8 ("O seu ritmo real"). Correção: na intro da rede, dizer ao leitor o que fazer agora e quando valem as regras. Ex.: "Se hoje alguém publica por você, a decisão desta semana é a do Otávio: suspender, ou reduzir ao mínimo, até você conhecer a sua matéria-prima. As regras abaixo são para quando você voltar a delegar, e já valem se o “terceiro” é uma ferramenta de IA que só formata o que você gravou." No primeiro item de "Faça assim", trocar por: "Quando voltar a delegar, mandar áudios curtos como insumo, no ritmo que você calcular no capítulo 8, em vez de aprovar pautas prontas."'
pontos_fortes:
  - 'A r1 foi atendida quase ponto por ponto, e o texto melhorou. Otávio suspende em vez de redelegar ("Otávio pediu à agência dois meses sem publicações"), o que casa com o cap. 6: a retomada "dali a algumas semanas", com o calendário que abre no Dia do Trabalhador, bate com março mais dois meses. A publicação agora está certa ("Estava certo.") e a tese sustenta a cena. A conta fecha ("quinhentas e tantas"). A frase-marca do cap. 16 saiu. Helena e a quinta-feira resolveram a colisão com Lúcia e com as terças. O teste com a mulher, que "nunca abriu o perfil do escritório", ficou verossímil e preciso.'
  - 'A abertura está entre as melhores do livro. Um ritual exato e banal ("responde com a mesma palavra de sempre: aprovado. Faz isso há três anos. Leva, em média, doze minutos.") é quebrado por um comentário plausível. Em seguida vem uma resposta de advogado tecnicamente exata: "só protege quem tem o acordo por escrito, controla o ponto com rigor, mês a mês, e compensa as horas dentro do prazo" confere com o art. 59, §§ 2º e 5º, da CLT. O modo do Otávio aparece já na primeira cena: "Escreveu a resposta à mão, antes de digitar".'
  - 'Frases com assinatura própria, sem tique de IA: "Tudo isso era verdade, e nada disso era ele."; "É um trabalho honesto, e o resultado é correto. Correto é o problema."; "Continuou pagando, porque cancelar também dava trabalho."; "riu de um “veja bem” que diz antes de toda má notícia, há décadas, sem nunca ter percebido". A seção "Por que gente competente terceiriza cedo" desarma a objeção do leitor-alvo com o argumento certo ("Entregar isso a outra pessoa equivale a delegar o próprio produto").'
  - 'O caderno ficou executável. Transcrever trinta segundos cabe nas 10 linhas. A grade de delegação tem sete linhas e três colunas. A pontuação 4/3/2 com corte em 7 exige o áudio. A tabela 4.1 agora inclui "Revisar a versão final | Nunca" e a ressalva ética ("dentro do que o seu código permite responder em público"). A rede parte da transcrição da oficina. A verificação tem as corretas em b, d, a e c, e os distratores são falsos para todas as profissões.'
problemas:
  - criterio: metodo
    trecho: "Mandar três áudios por semana, de dois a quatro minutos, como insumo, em vez de aprovar pautas prontas."
    por_que: 'Bloqueador (ver acima). A prosa diz que, antes de descobrir a voz, "qualquer arranjo novo repetiria o erro com outra roupa", e a rede prescreve ao leitor, no dia 4, o arranjo novo. A intro ("As regras valem se alguém edita ou publica por você") autoriza aplicá-lo já. O capítulo nunca diz ao leitor que tem agência o que fazer com ela nesta semana, e essa é a pergunta prática que o leitor-Otávio fecha o livro fazendo.'
    correcao: 'Ver a correção do bloqueador: uma frase na intro com a decisão desta semana (suspender ou reduzir ao mínimo) e o "Faça assim" 1 condicionado a "quando voltar a delegar", com o ritmo remetido ao cap. 8.'
  - criterio: honestidade
    trecho: "Muita gente se sente desconfortável ouvindo a própria voz gravada ou lendo o próprio texto publicado"
    por_que: 'A lição cap01-r4/cap02-r2 limita a 2 por capítulo as generalizações sem fonte sobre terceiros ("muita gente", "costuma", "a maioria", "quase todo"). A prosa tem pelo menos seis: "a resposta que muito profissional liberal dá"; "A terceirização prematura costuma nascer do raciocínio de um bom profissional"; "Muita gente se sente desconfortável…"; "Na maioria das vezes, ela se manifesta em sinais discretos"; "Muitos especialistas que produzem sozinhos terceirizam a voz de outro jeito"; e o parágrafo sobre agências (ver o próximo problema). Some-se o intertítulo "Como a história costuma acontecer" e a frase "é comum a ponto de parecer um roteiro".'
    correcao: 'Converter em observação do personagem ou cortar. "Otávio nunca gostou de ouvir a própria voz gravada nem de reler o que publicava, e esse desconforto encontrou alívio imediato quando outra pessoa assumiu o trabalho." Essa versão ainda prepara o riso do "veja bem". Depois: "No caso do Otávio, a terceirização nasceu do raciocínio de um bom profissional."; "Antes de um comentário assim, ela aparece em sinais discretos…"; "Quem produz sozinho também pode terceirizar a voz, de outro jeito:…". Manter no máximo duas: "muito profissional liberal" e "a conclusão mais comum".'
  - criterio: honestidade
    trecho: "Isso é eficiência para a agência e diluição para o cliente, que recebe, sem saber, uma versão ajustada do que outras dez empresas também recebem."
    por_que: 'É uma afirmação empírica sobre um setor inteiro, sem fonte, com um número inventado ("outras dez empresas") e uma acusação implícita ("sem saber"). Também contradiz o tom justo do resto do capítulo ("A agência do Otávio fez bem o trabalho que lhe foi pedido"; "É um trabalho honesto"). O leitor que tem uma boa agência, ou que é sócio de uma, lê isso como ataque de palco, que é o que o público "desconfiado de marketing de palco" rejeita.'
    correcao: 'Dar a observação ao personagem e tirar o número: "Otávio só entendeu o mecanismo quando reconheceu, no perfil de uma clínica odontológica atendida pela mesma agência, a arte azul e o “Você sabia?” que chegavam para ele. Para a agência, reaproveitar o que funciona é eficiência. Para o cliente, é diluição." Assim a ideia vira cena, o que também serve à concretude.'
  - criterio: clareza
    trecho: "Se alguém discorda nos comentários e você não sabe o que responder, a peça não saiu de você."
    por_que: 'A nota do sinal mais grave usa um critério que a cena de abertura desmente. Otávio sabia exatamente o que responder ("A senhora tem razão, e a publicação simplificou demais…"), e a peça não era dele. O que ele não conseguia era defendê-la: só podia corrigi-la. O sinal 4 da lista diz isso ("você não sabe defender o que foi publicado"), e a nota o afrouxou. O leitor apressado aplica a nota ao Otávio e conclui que a peça era dele.'
    correcao: '"Se alguém discorda nos comentários e você não consegue defender a peça, só corrigi-la ou se calar, ela não saiu de você. E, se ela funcionar, vai atrair pessoas à procura de alguém que você não é."'
  - criterio: clareza
    trecho: "Uma agência executa bem o que se transfere. A sua voz não se transfere antes de existir."
    por_que: 'O capítulo prova o contrário: a voz do Otávio existe antes de tudo, nos "e-mails longos e francos que os clientes costumavam guardar e reler" e na resposta à lavanderia. O que falta é tê-la descoberta, como diz a epígrafe ("antes de ser descoberta") e o conceito ("antes de ter identificado a própria linguagem"). O mesmo deslize aparece em "só depois que houver uma voz para amplificar". Um leitor apressado leva para casa "eu ainda não tenho voz", que contradiz a tese do livro ("transformar a pessoa e o profissional que já existem").'
    correcao: 'Guardar 1: "Uma agência executa bem o que se transfere. Uma voz que você ainda não conhece não se transfere." Prosa: "…mas só depois que ele souber qual é a própria voz."'
  - criterio: originalidade
    trecho: "Na semana em que suspendeu as publicações, Otávio gravou no celular, entre uma audiência e outra, três minutos sobre o que fazer quando um funcionário pede para “acertar por fora”."
    por_que: 'O cap. 3 tem a mesma cena: o protagonista acha a própria voz num áudio de celular gravado no meio do trabalho e depois o transcreve ("respondeu por áudio, andando entre os cavaletes"; "Depois, por curiosidade, ele transcreveu o áudio do taco"). O plano ainda reserva ao cap. 19 os áudios que Renata grava "entre um paciente e outro". A tarefa do PWA exige o áudio, mas o enquadramento da cena não precisa repetir o do capítulo anterior (lição cap02-r1). Otávio, que "pensa escrevendo" e "travaria diante de uma câmera ligada sem roteiro" (cap. 5), ganharia com uma gravação que lhe custa algo.'
    correcao: 'Tirar a cena do meio do expediente: "Na semana em que suspendeu as publicações, Otávio ficou no escritório depois que todos saíram, fechou a porta e gravou no celular três minutos sobre…". Trocar "Não pensou em publicar; gravou para ouvir." por "Gravou só para ouvir.", que também elimina a batida "não fez X; fez Y", esgotada na Fase I segundo a lição cap04-r1.'
  - criterio: originalidade
    trecho: "E, se ela funcionar, vai atrair pessoas à procura de alguém que você não é."
    por_que: 'A mesma ideia aparece quatro vezes, sem ganho da terceira em diante (lição cap02-r1). Na nota: "vai atrair pessoas à procura de alguém que você não é". Na prosa: "uma peça que você não defende aproxima as erradas". No Para guardar: "Uma peça que você não saberia defender atrai as pessoas erradas". No gabarito da questão 2: "vai atrair pessoas à espera de alguém que você não é". O capítulo também repete o movimento do cap. 3 ("A produção atrai também por um motivo menos confessável" / "Comprar equipamento é uma das formas mais respeitáveis de adiar") em "Há também um fator menos racional". São dois capítulos seguidos com a mesma estrutura: o erro técnico, depois o conforto emocional por trás dele.'
    correcao: 'Deixar a imagem na nota e no Para guardar. Na prosa, abrir o parágrafo direto no exemplo do cliente do banco de horas, sem a antítese "aproximar as certas / aproxima as erradas". No gabarito da questão 2, trazer um ganho novo: "…e desfazer uma expectativa custa mais caro do que nunca tê-la criado." Na seção "Por que gente competente…", tirar o anúncio "Há também um fator menos racional." e entrar direto no desconforto do Otávio (ver o problema de honestidade).'
  - criterio: coerencia
    trecho: "Um cliente que contratasse Otávio convencido de que basta assinar um acordo de banco de horas"
    por_que: 'A frase-marca "contrato assinado não é prova de nada" saiu, mas a ideia dela já circula três vezes antes do cap. 16, que é dela. No cap. 4: "clientes que acreditavam estar protegidos pelo acordo assinado" e "convencido de que basta assinar um acordo". No cap. 6: "papel assinado vale pouco quando alguém em carne e osso conta outra história". A abertura precisa da primeira. A segunda é dispensável e gasta a revelação do cap. 16.'
    correcao: 'No parágrafo do quarto sinal, trocar a expectativa por outra que também contradiz o modo dele: "Um cliente que contratasse Otávio atraído por uma publicação otimista chegaria esperando um advogado que diz o que ele quer ouvir, e encontraria um advogado que começa toda conversa pela pior hipótese."'
  - criterio: aplicabilidade
    trecho: "A sua grade de delegação: marque, para cada etapa, o que acontece hoje"
    por_que: 'A instrução pede "o que acontece hoje", mas a terceira coluna ("Deve voltar para mim") é um juízo, não um fato de hoje. Quem delega o rascunho e quer tomá-lo de volta não sabe se marca uma ou duas caixas. O leitor que produz tudo sozinho (o terceirizado "sem pagar mensalidade" do próprio capítulo, ou o leitor-Lúcia) marca "Faço" sete vezes e ganha 3 pontos sem ter descoberto nada. O rótulo "Diagramar e editar" também difere da tabela 4.1 ("Diagramar e editar o vídeo"), contra a lição cap03-r1.'
    correcao: 'Rótulo: "A sua grade de delegação: marque quem faz hoje cada etapa e, se for o caso, o que deve voltar para você". Acrescentar ao exemplo: "Se você faz tudo sozinho, marque “Deve voltar para mim” nas etapas em que hoje segue um modelo pronto ou o tom de outro perfil." Na linha da grade, usar "Diagramar e editar o vídeo".'
  - criterio: aplicabilidade
    trecho: "Anote os números (1 a 4) e um exemplo de cada."
    por_que: 'O campo pede até quatro números com um exemplo de cada e dá 3 linhas (p021). À mão, isso não cabe (lição cap04-r1: espaço dimensionado para o que se pede). A alternativa para quem não publica ("qual sinal mais aparece no perfil do colega que você mais admira") repete o recurso do cap. 3 ("faça o teste com a última peça de um colega que você admira") e soa estranha: o colega mais admirado é o que exibe o sinal. A ajuda do checklist ("Sei quais sinais se aplicam a mim") não serve para quem respondeu sobre o colega.'
    correcao: 'Subir o campo 04 para 5 linhas ou pedir "os números e um exemplo do sinal mais forte". Alternativa: "Se você nunca publicou, escolha um perfil da sua área que você acompanha e anote qual sinal aparece nele e como você evitaria repeti-lo." Ajuda do checklist: "Sei quais sinais aparecem no que publico, ou no perfil que analisei (campo 04)."'
  - criterio: voz
    trecho: "O conteúdo deveria aproximar você das pessoas certas; uma peça que você não defende aproxima as erradas."
    por_que: 'Há densidade de antíteses acima do teto da lição cap01-r1 (uma explícita por seção). Em "Por que gente competente…": "quando na verdade é uma extensão da atividade principal" e "não davam vergonha… Também não davam orgulho". Em "O que se perde": "eficiência para a agência e diluição para o cliente" e "Uma começa pelos riscos jurídicos; a outra…". Em "Os quatro sinais": esta e "esperando um advogado que confirma… e encontraria um advogado que começa…". Em "A ordem que funciona": "Não pensou em publicar; gravou para ouvir." e "a resposta ele tinha escrito com cuidado, e o áudio saiu sem nenhum". Cada uma, isolada, é boa. Juntas, viram cadência.'
    correcao: 'Ficar com uma por seção. Sugestão: manter "não davam vergonha… Também não davam orgulho", "Uma começa…; a outra…", o cliente do banco de horas (reescrito como no problema de coerência) e "com cuidado / sem nenhum". Cortar as outras como indicado nos problemas acima e na edição de linha da agência.'
  - criterio: ritmo
    trecho: "O segundo sinal tem um teste simples. Escolha três publicações recentes, cubra o nome e a foto"
    por_que: 'O parágrafo tem sete frases (teto: seis). O segundo parágrafo da abertura ("Numa quinta-feira de março…") também tem sete, com três frases curtas em série ("Estava certo." / "Tinha quarenta curtidas…" / "Helena queria saber…").'
    correcao: 'Abrir um parágrafo em "Otávio fez o teste com a mulher…". Na abertura, juntar "Estava certo." à frase anterior ("…desde que haja acordo, e estava certo.") ou partir o parágrafo em "Embaixo, havia um comentário…".'
edicoes_de_linha:
  - 'A pergunta da dona da lavanderia era a que ele mesmo faria, se alguém tivesse perguntado a ele antes de publicar. -> A dúvida da dona da lavanderia era a primeira que ele teria levantado, se alguém o tivesse consultado antes de publicar. (o "perguntado a ele" confunde quem pergunta o quê)'
  - 'Tinha quarenta curtidas, mais do que a própria publicação. -> O comentário tinha quarenta curtidas, mais do que a própria publicação. (sujeito ambíguo depois da citação)'
  - 'Nas ações contra pequenas empresas que chegam ao meu escritório, é quase sempre o primeiro pedido da lista. -> Nas ações contra pequenas empresas que chegam ao meu escritório, as horas extras de um banco mal controlado são quase sempre o primeiro pedido da lista. (o pedido é de horas extras, não de "banco de horas")'
  - 'Desde a resposta à dona da lavanderia, era a primeira vez que alguma coisa com o nome dele soava como ele. -> Desde a resposta à dona da lavanderia, era a primeira vez que alguma coisa dita por ele para fora do escritório soava como ele. (o áudio é privado e não leva o nome dele)'
  - 'Não pensou em publicar; gravou para ouvir. -> Gravou só para ouvir.'
  - 'Há também um fator menos racional. Muita gente se sente desconfortável… -> Otávio nunca gostou de ouvir a própria voz gravada nem de reler o que publicava, e esse desconforto encontrou alívio imediato quando outra pessoa assumiu o trabalho.'
  - 'Na maioria das vezes, ela se manifesta em sinais discretos -> Antes de um comentário assim, ela aparece em sinais discretos'
  - 'Muitos especialistas que produzem sozinhos terceirizam a voz de outro jeito: -> Quem produz sozinho também pode terceirizar a voz, de outro jeito:'
  - 'uma versão ajustada do que outras dez empresas também recebem -> uma versão ajustada do que outros clientes também recebem (se o parágrafo não virar cena)'
  - 'mas só depois que houver uma voz para amplificar -> mas só depois que ele souber qual é a própria voz'
  - 'A sua voz não se transfere antes de existir. -> Uma voz que você ainda não conhece não se transfere.'
  - 'Roteiro: Toda semana alguém me pergunta {o assunto}. -> Toda semana alguém me pergunta {a pergunta que você mais ouve}. ("me pergunta o assunto" não se lê em voz alta)'
  - 'Grade, campo 05: Diagramar e editar -> Diagramar e editar o vídeo (igual à tabela 4.1)'
  - 'Gabarito 02: vai atrair pessoas à espera de alguém que você não é, e isso cria um problema maior do que o silêncio -> …e desfazer uma expectativa errada custa mais do que nunca tê-la criado. (quarta repetição da mesma imagem)'
diagramacao:
  - 'p013: cerca de 22% de branco no pé antes de "Por que gente competente terceiriza cedo". Cabem o intertítulo e cinco ou seis linhas. p015: cerca de 22% de branco depois de "as quinhentas e tantas publicações somadas", antes de "Os quatro sinais". Os dois brancos já tinham sido apontados na r1 e continuam. A regra do h2 (break-after/orphans) está pedindo linhas demais depois do intertítulo; duas linhas bastam.'
  - 'p017: cerca de 15% de branco sob a figura 4.2, porque o parágrafo "Nem tudo na produção de uma presença…" desce preso à tabela. Prender só a legenda à tabela e deixar o parágrafo de introdução fluir para a p017.'
  - 'p012: na abertura em versalete, "SEGUNDA- FEIRA" sai com um espaço visível depois do hífen (o letter-spacing do span de abertura se soma ao hífen inquebrável). O código HTML da r1 sumiu, mas a primeira palavra composta do livro ainda imprime torta. Zerar o letter-spacing no hífen ou usar U+2011 dentro do span.'
  - 'p020: no título da oficina, "matéria–prima" continua com o hífen largo como meia-risca na Instrument Serif. Pendência da r1 não resolvida.'
  - 'p014: "pro-/duto." fecha o parágrafo com uma sílaba hifenizada de quatro letras. Pendência da r1 (hyphenate-limit-chars / última linha).'
  - 'p018: o parágrafo "Na semana em que suspendeu as publicações…" sai com recuo de primeira linha depois da tabela. Depois dos outros blocos o texto sai sem recuo (p013 depois do Conceito, p015 depois da figura 4.1, p016 depois da lista e da nota). Uniformizar sem recuo depois de tabela.'
  - 'p024: o cabeçalho "ROTEIRO DE FALA — PARA LER EM VOZ ALTA, GRAVANDO" contradiz a nota logo abaixo ("Fale, não leia um texto formal"). Neste capítulo, o cabeçalho deveria ser "PARA FALAR, GRAVANDO", ou o rótulo deveria sair do roteiro_nota.'
  - 'p015 e p017: as notas das figuras em Inter cinza, com cerca de 7,5 pt, continuam no limite para o leitor de 50 a 60 anos. Pendência dos caps. anteriores.'
  - 'Aceitos pelo projeto: p019 (Para guardar sozinho, cerca de 75% de branco antes da oficina, que abre página), p022 (branco antes do esqueleto indivisível) e p025 (fechamento). Extensão: p011 a p025, 15 páginas, dentro do alvo de 14 a 16. A figura 4.2 foi corrigida: nenhum rótulo cortado e nenhuma sobreposição. A legenda da tabela 4.1 agora está presa à tabela.'
veredito: "Capítulo muito melhor que na r1, com abertura, argumento e caderno de editora, mas ainda reprovado: a rede manda o leitor montar já o arranjo que a prosa acabou de chamar de “o erro com outra roupa” (bloqueador), há seis generalizações sem fonte com um número inventado sobre agências, a nota do sinal mais grave é desmentida pela própria cena de abertura, e dois brancos de página da r1 continuam."
