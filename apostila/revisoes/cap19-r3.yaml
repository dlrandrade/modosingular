bloqueadores: []
pontos_fortes:
  - "Quase tudo o que a r2 apontou foi resolvido, e resolvido no lugar certo. A nota da figura e o gabarito agora dizem 'davam peça' ('Poucos, e os que mais davam peça.' / 'Foram nove áudios, e seis davam peça.'). A conta do primeiro mês fecha ('Depois do primeiro mês, quando as escolhidas das sextas começaram a vencer a data, a fila passou a se encher sozinha'). A cronologia da abertura ficou clara ('Na noite daquele domingo') e o enunciado do cap. 12 foi respeitado ('A produção de terça e de quinta'). A oficina mede o atrito na grade ('Leva mais de 30 s'), e a rede tem saída para o leitor do dia 19 ('Se nenhuma data chegou ainda, use uma captura que não veio de atendimento')."
  - "A abertura é a melhor cena da Fase IV e sustenta o capítulo inteiro. 'gravação 212, gravação 213, gravação 214', o 'caderninho de capa verde que ficava na gaveta do consultório, com anotações a lápis de quando a bateria acabava', a reviravolta seca ('percebeu que a captura estava funcionando melhor do que nunca'), e uma consequência prática no lugar da moral: 'Cumpriu a regra e não compensou.'"
  - "O capítulo acrescenta ao PWA uma peça real de método, e a amarra ao sigilo do cap. 13 sem sermão: decidir não é liberar. 'Os escolhidos ganham um nome novo, com a palavra \"usar\", o assunto em três palavras e a data a partir da qual podem sair.' O fecho junta tudo numa ação: 'Na sexta, no carro, foi o primeiro da semana a ganhar nome: usar, repouso que piora. Ao lado, ela anotou a data de novembro.'"
  - "Detalhe de ofício exato e variado. O ortodontista ('tira o elástico para comer e esquece de pôr. As duas acham que uma noite sem não faz diferença'), a engenheira agrônoma ('na caminhonete, antes de sair da última propriedade'), o técnico de segurança ('o capacete atrapalha a ouvir o rádio'). A crença do repouso absoluto contra a orientação de andar está correta para a lombalgia crônica. Os callbacks ao cap. 15 ('ela passou por ele duas vezes sem mexer no nome') e ao cap. 8 ('peça que não sai na semana não passa para a seguinte') pesam pouco e rendem muito."
problemas:
  - criterio: metodo
    trecho: "a data se conta a partir do atendimento de onde sai a frase que vai na peça, e a peça usa as palavras que qualquer um deles diria"
    por_que: "A seleção manda usar 'as palavras que qualquer um deles diria', e a rede manda o contrário. A regra 1 diz 'Comece pelo que você viu, com as palavras de quem disse.' O esqueleto pede 'A frase crua, com as palavras de quem disse.' O roteiro abre com '{a frase crua, com as palavras de quem disse}'. O cap. 13 avisa que 'A frase mais bonita do atendimento costuma ser a que mais identifica'. O leitor vai abrir a peça pública com a frase literal de um paciente, que é justamente o que mais o identifica, e o capítulo lhe dá duas instruções opostas sobre isso. A frase também deixa uma dúvida: se a peça usa palavras de qualquer um, de qual atendimento 'sai a frase'?"
    correcao: "Alinhe a rede à seleção. Regra 1: 'Comece pela frase como as pessoas a dizem, nas palavras delas e não nas do seu jargão.' Porquê: '...Reescrita em linguagem técnica, ela vira texto de qualquer um. Se só uma pessoa diria a frase daquele jeito, troque-a pela forma comum.' Esqueleto e roteiro: '{a frase, do jeito que você a ouve}'. No parágrafo da seleção: 'Quando o assunto já é um padrão, a data se conta a partir do último atendimento de onde vem a frase que você vai usar, e a frase vai na forma em que qualquer um deles a diria.'"
  - criterio: aplicabilidade
    trecho: "Se nenhuma data chegou ainda, use uma captura que não veio de atendimento, como um incômodo com alguma coisa da sua área ou uma pergunta ouvida fora do trabalho."
    por_que: "A saída certa entrou na intro, mas o esqueleto e o roteiro não servem para ela, e a lição cap02-r1 pede que sirvam a todos os exemplos que o capítulo dá. Um incômodo é uma frase que o próprio leitor diria. Não cabe em 'Tem uma frase que eu ouço com frequência', nem em 'Faz sentido pensar assim, porque {de onde vem a crença}', nem em 'Por que se repete'. Uma pergunta também não é uma crença a explicar 'com boa-fé'. É justamente o caso do leitor do dia 19, que vai ser empurrado para essas capturas."
    correcao: "Restrinja a saída ao que o esqueleto aguenta: 'Se nenhuma data chegou ainda, use uma crença da sua área que você ouve fora do atendimento: de um parente, de um vizinho, de uma conversa de fila.' Ou acrescente ao roteiro uma variante de primeira linha: 'Tem uma pergunta que eu ouço com frequência: {a pergunta}. Quem pergunta isso costuma estar pensando que {a crença por trás}.'"
  - criterio: coerencia
    trecho: "As outras três o capítulo 6 já deu: meio minuto no máximo"
    por_que: "O cap. 6 não deu meio minuto. Deu 'A regra dos vinte segundos' (intertítulo), 'vinte segundos para uma frase crua' e o box 'Entre um atendimento e outro, vinte segundos'. O próprio cap. 19 alterna entre 'vinte segundos', 'em segundos', 'meio minuto' e '30 s'. A lição cap03-r1 pede que uma regra operacional apareça idêntica em todo o capítulo, e esta é a regra que dá nome ao conceito ('o único que custa segundos')."
    correcao: "'As outras três o capítulo 6 já deu: vinte segundos por captura, meio minuto no limite, porque...'. Mantenha 'meio minuto' só como teto (grade, critério, Para guardar), e 'vinte segundos' como a medida de referência em toda a prosa."
  - criterio: coerencia
    trecho: "Renata tinha três, e cada um parecia fazer sentido na hora: o gravador quando estava no carro, o grupo de mensagens quando estava com pressa, o caderninho quando o celular morria. Nenhum dos três era o caderno de campo."
    por_que: "Há três furos pequenos no mesmo trecho. (1) Os áudios do corredor, que são os mais apressados, também estão no gravador ('pulando os do corredor pelo tamanho'), então ele não era 'quando estava no carro', e o grupo não era 'quando estava com pressa'. (2) O aplicativo das etiquetas guardou duas semanas de abril ('ela gravava e deixava para etiquetar depois'), o que dá um quarto lugar que o texto não conta. (3) 'Nenhum dos três era o caderno de campo' briga com 'O caderno de campo tinha virado um arquivo que só se abria pela data', que diz que os três eram o caderno. No mesmo sentido, 'Ela capturava na segunda e produzia na terça' pode ser lido literalmente como publicar em um dia o que se ouviu no atendimento, o contrário do que o cap. 13 e o próprio capítulo ensinam."
    correcao: "'o gravador para quase tudo, o grupo de mensagens quando queria mandar a si mesma uma foto ou um link, o caderninho quando o celular morria. Dois lugares obrigam...' Corte 'Nenhum dos três era o caderno de campo.' No fim do parágrafo do aplicativo: '...sem nem apagar o aplicativo, onde ficaram duas semanas de abril que ela nunca mais abriu.' Isso é um quarto lugar e reforça a regra. 'Ela capturava todo dia e produzia às terças e quintas, e entre uma coisa e outra...'"
  - criterio: concretude
    trecho: "Às quatro da tarde, tinha ouvido mais de cem, pulando os do corredor pelo tamanho e demorando nos do carro, que eram longos."
    por_que: "A conta da busca não fecha com o que ela sabe. Os arquivos estão em ordem de data, ela sabe que foi 'em algum dia de julho' e 'no carro', e pula os do corredor pelo tamanho. Pela própria figura 19.2, um mês tem uns dezessete áudios de carro. Ouvir 'mais de cem' para achar um de julho gravado no carro só se explica se a lembrança do mês estava errada, e o texto afirma o mês como fato."
    correcao: "Torne a lembrança incerta: 'Tinha gravado, achava que em julho, a história de...' e acrescente à busca: 'Julho não tinha o áudio. Às quatro da tarde, tinha ouvido mais de cem, de junho a setembro, pulando os do corredor pelo tamanho...'"
  - criterio: clareza
    trecho: "No domingo, a distância seria grande demais, e a seleção voltaria a ser uma escuta de arquivo."
    por_que: "O argumento não se sustenta. Entre sexta e domingo são dois dias, e os áudios de segunda passam de quatro para seis dias. Ninguém acredita que isso transforma a seleção em 'escuta de arquivo'. A escolha da sexta é boa por outros motivos que o próprio capítulo já tem: é o carro, onde ela grava e onde está o enunciado, a semana está fechada, e o domingo é o dia que ela perdeu."
    correcao: "'Na sexta, a semana terminou e os áudios de segunda ainda são reconhecíveis: ela lembra da pessoa, da sala, do que veio antes. E o carro é onde está o enunciado e onde ela já grava. O domingo, ela tinha acabado de perder.'"
  - criterio: aplicabilidade
    trecho: "Passe cada uma pelas quatro perguntas, circule as escolhidas e escreva ao lado a data em que podem sair."
    por_que: "A oficina não diz quantas circular, e a entrega fixa um número que não é o do leitor: 'as duas capturas escolhidas da última semana'. Duas é o ritmo da Renata, e o do leitor saiu do cap. 8. Nenhum critério do 'Confira antes de seguir' verifica a data, que é a regra nova do capítulo ('As escolhidas do campo 05 estão circuladas, e as outras continuam na lista'). Também não fica claro se a pergunta 1 elimina ou só dá preferência. O texto diz que ela 'separa o episódio do padrão', a rede diz 'de preferência', e o campo 06 a lista como motivo de aprovação. O leitor que tem capturas de uma semana só dificilmente terá alguma que 'apareceu mais de uma vez'."
    correcao: "Campo 05: '...circule tantas quantas o seu ritmo do capítulo 8 pede e escreva ao lado a data em que cada uma pode sair. As perguntas estão na página 18.' Entrega: 'as capturas escolhidas para a próxima semana, cada uma com a sua data'. Critério: 'As escolhidas do campo 05 estão circuladas, cada uma com a data ao lado, e as outras continuam na lista.' Depois do box, uma frase: 'A primeira pergunta dá preferência, não elimina: o que apareceu uma vez só fica guardado até aparecer de novo.'"
  - criterio: ritmo
    trecho: "O corredor era o gatilho mais frequente: vinte segundos com o celular encostado na boca, antes de chamar o próximo nome. O carro vinha depois, com áudios mais longos e mais soltos."
    por_que: "A frase repete quase palavra por palavra as notas da figura 19.2, logo acima ('O mais frequente. Vinte segundos antes de chamar o próximo paciente.' / 'Mais longos, e mais soltos.'). O leitor lê a mesma coisa duas vezes na mesma página. Pouco antes, a seção abre com o resultado antes da descoberta e o mesmo sujeito duas vezes: 'Renata amarrou a captura [...]. Renata descobriu os seus gatilhos olhando para trás.' E fecha em frase de curso, que generaliza sem base: 'Os cinco servem para qualquer ofício que atende gente.'"
    correcao: "Tire as notas das duas primeiras barras da figura e deixe a prosa contar, ou corte as duas frases da prosa e comece por 'Ouvindo de novo os nove áudios...'. Abertura da seção: 'Renata descobriu os seus gatilhos olhando para trás. Na segunda semana de setembro, contou [...] e dois momentos respondiam por três de cada quatro.' Troque o fecho por uma ponte para a tabela: 'Na sua rotina, os cinco têm outro nome e outra hora.'"
  - criterio: voz
    trecho: "A primeira pergunta separa o episódio do padrão, a segunda e a quarta são a regra de sigilo do capítulo 13, e a terceira puxa o repertório da Fase II."
    por_que: "É o narrador explicando o próprio box, em tom de apostila, e o parágrafo começa por uma exceção técnica ('Quando o assunto já é um padrão...') antes de dizer para que servem as perguntas. A ordem obriga a ler duas vezes o trecho mais denso do capítulo."
    correcao: "Inverta: primeiro 'A primeira pergunta separa o episódio do padrão; a segunda e a quarta são o sigilo do capítulo 13; a terceira traz de volta o repertório e as opiniões da Fase II.' Depois a exceção do padrão, já reescrita (ver o primeiro problema), e por fim 'O que falha na segunda pode esperar meses...'."
  - criterio: honestidade
    trecho: "No corredor, com o próximo paciente de pé na sala de espera, ela gravava"
    por_que: "Num livro que trata o sigilo como regra do sistema, a cena-modelo mostra a fisioterapeuta ditando em voz alta, no corredor, a frase do paciente que acabou de sair, a poucos passos da sala de espera ('Ele disse: se eu parar de andar, a dor para.'). Sem nome ninguém se identifica, mas um leitor da saúde nota o descuido, e o capítulo não diz nada."
    correcao: "Um detalhe resolve: 'vinte segundos com o celular encostado na boca, de costas para a sala de espera, em voz baixa' ou 'no fim do corredor, longe da recepção'. Na oficina, a nota do campo 03 pode lembrar: 'se o gatilho acontece perto de clientes, a captura é por escrito ou em voz baixa'."
edicoes_de_linha:
  - "dois momentos respondiam por quase tudo -> dois momentos respondiam por três de cada quatro (31 + 17 de 65)"
  - "gravar antes de qualquer outro registro -> gravar ali mesmo, antes de chamar o próximo paciente (\"registro\" confunde com o prontuário)"
  - "Os escolhidos ganham um nome novo -> As escolhidas ganham um nome novo (o texto alterna \"os escolhidos\" e \"as duas escolhidas\"; o mesmo em \"Os outros continuam guardados\" -> \"As outras continuam guardadas\")"
  - "no carro ainda parado em frente ao consultório -> no carro, ainda no estacionamento da clínica (os caps. 7, 8, 9, 21 e 23 dizem \"estacionamento da clínica\")"
  - "Na sexta, a semana acabou, e os áudios de segunda -> Na sexta, a semana terminou e os áudios de segunda"
  - "e deixa o resto para a seleção -> e deixa o resto para a hora de produzir (a seleção decide; não termina a história)"
  - "a terceira puxa o repertório da Fase II -> a terceira traz de volta o repertório e as opiniões da Fase II"
  - "Em nenhuma ficou sem as duas escolhidas. -> manter"
  - "figura 19.1, nó 2: \"Agora sim se julga, e se escolhe o que vai para a produção.\" -> \"Agora se julga, se escolhe e se anota a data em que cada uma pode sair.\" (a figura omite a regra nova do capítulo)"
diagramacao:
  - "p. 13: a figura 19.1 continua como na r1 e na r2 (terceira vez). O nó 1 quebra 'Capturar: todo dia, em / segundos', o nó 2 empilha 'Selecionar: uma / vez por semana, / dez minutos', e o nó 3 sai alinhado à direita numa coluna de nove linhas ('Com a / matéria-prima / escolhida.'). Se o componente não permite alargar os nós, encurte os rótulos: 'Capturar: todo dia' / 'Selecionar: 1 vez por semana' / 'Produzir: no seu ritmo', com o resto na nota."
  - "p. 16: cerca de 22% em branco no pé, porque a tabela 19.1 foi inteira para a p. 17. É evitável: ponha 'Tabela: Cinco gatilhos...' logo depois do parágrafo de abertura da seção (antes da figura 19.2), ou deixe o parágrafo 'O modo de cada um...' antes da tabela."
  - "p. 13: cerca de 12% em branco abaixo da figura, porque o box Conceito vai inteiro para a p. 14. Com rótulos mais curtos, a figura encolhe e o branco some."
  - "p. 19 (cerca de 45% em branco antes da oficina) e p. 23 (cerca de 20% depois do roteiro, antes do fechamento em página nova): aceitos pelo projeto. p. 24–25: a verificação deixa cerca de 20% livres e o checklist ocupa só o terço superior da p. 25. O checklist não cabe na p. 24, então fica aceito."
  - "p. 21: o campo 05 cita 'as quatro perguntas' sem remeter à página. Num livro impresso, o leitor volta três páginas para procurar. Acrescente '(p. 18)'."
veredito: "O capítulo agora ensina um sistema coerente com o sigilo e tem a melhor abertura da fase. Para a aprovação faltam alinhar a rede à regra da frase no padrão, dar à saída do leitor do dia 19 um esqueleto que a comporte e fechar os furos pequenos de coerência: os vinte segundos do cap. 6, os lugares da Renata e a busca de julho."
