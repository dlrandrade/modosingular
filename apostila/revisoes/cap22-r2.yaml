capitulo: 22
iteracao: 2
notas: {metodo: 9.0, voz: 8.9, originalidade: 8.8, clareza: 8.9, ritmo: 9.0, concretude: 9.0,
        coerencia: 8.1, aplicabilidade: 8.9, impresso: 8.7, honestidade: 9.0}
bloqueadores:
  - "Gabarito contradiz o texto (erro de fato interno): a explicação da verificação 03 diz \"como Lúcia no texto sobre autocuidado nas férias\", mas o texto reescrito diz que o texto reprovado \"Falava de rotina matinal de produtividade\". O leitor que confere o Apêndice A encontra um episódio que o capítulo não tem mais (lição cap02-r2: conferir o gabarito contra o texto final a cada reescrita)."
pontos_fortes:
  - "Boa parte da r1 foi resolvida: a linha do tempo fecha (\"Fazia quase dois anos que tinha dito em voz alta, no grupo de estudos\"), o furo do manual de voz virou detalhe de cena (\"ela tinha parado de relê-lo em janeiro, quando as terças passaram a parecer fáceis\"), a grade do teste passou a ter o sim como resposta certa nas cinco linhas e a rede virou 'passe a limpo'."
  - "As duas imagens centrais continuam as melhores da Fase IV: \"Ela tinha levado a pele e deixado o esqueleto\" e o mecanismo das sete e quarenta (\"A voz entra pelo ouvido de quem admira, e sai na primeira página escrita logo depois\")."
  - "A seção final agora entrega o que o intertítulo promete: a admiração lida de igual para igual deixa uma posição própria (cansaço e tédio pedem conversas diferentes), e o fecho termina em cena, com Lúcia devolvendo uma pergunta, como faz com os pacientes, sem moral."
  - "O custo honesto sobrevive: \"O mais difícil de admitir foi que os textos de fevereiro tinham sido mais lidos que os de antes\". A cópia funcionava, e o capítulo não finge o contrário."
problemas:
  - criterio: coerencia
    trecho: "Se a resposta é não, você preencheu um molde com um assunto que não é seu, como Lúcia no texto sobre autocuidado nas férias, e se comprometeu com uma posição que não sustentaria."
    por_que: "Resto da versão anterior. O texto da Lúcia que não passa na quarta pergunta agora é sobre rotina matinal de produtividade. Ver bloqueador."
    correcao: "\"…como Lúcia no texto sobre rotina matinal de produtividade, e se comprometeu com uma posição que não sustentaria.\""
  - criterio: coerencia
    trecho: "Falava de rotina matinal de produtividade, um tema que Lúcia nunca tinha trabalhado com nenhum paciente, e afirmava que \"quem acorda cedo sofre menos\", uma frase que ela não sustentaria numa conversa com um colega. Tinha escrito porque a outra escrevia."
    por_que: "Furo de enredo (lição cap03-r3). O segundo parágrafo diz que os textos de fevereiro eram respostas à pergunta da semana da amiga (\"A amiga do grupo de estudos continuava mandando a pergunta da semana, e Lúcia continuava respondendo na terça às oito\"). Se todo texto responde a uma pergunta da amiga, Lúcia não escolheu o tema 'porque a outra escrevia'. Há também uma conta que não fecha: o ritmo dela é uma peça por semana, às terças (cap. 12), e fevereiro tem quatro terças, mas o texto fala em \"Os três textos daquele mês\"."
    correcao: "Mostrar o desvio a partir da pergunta: \"Um deles nem respondia direito à pergunta da amiga. A pergunta era sobre insônia; o texto escorregou para rotina matinal de produtividade, o assunto que a outra tinha publicado na véspera, e afirmava que 'quem acorda cedo sofre menos'…\". Para a contagem: \"A partir da segunda terça de fevereiro, os textos dela mudaram.\" Assim os três textos são os três últimos do mês."
  - criterio: coerencia
    trecho: "Uma fonoaudióloga vê o vídeo de um mecânico que abre com \"o barulho que o seu carro faz e você não conta na oficina\""
    por_que: "Os dois figurantes do capítulo aparecem em capítulos vizinhos, o que a lição cap02-r2 proíbe. A fonoaudióloga está no campo 01 da oficina do cap. 21 (\"Uma fonoaudióloga: 'A folha de exercícios que eu mando para os pais'\"), também falando com pais. A nutricionista do campo 02/03 está no campo 01 da oficina do cap. 23 (\"Uma nutricionista: 'Montar a arte de cada receita.'\"). A frase singular da fonoaudióloga também tem problemas próprios. \"Tem uma coisa que eu pergunto a todo pai, e quase ninguém tinha reparado\" tem o tempo verbal errado. \"Em que língua o seu filho brinca sozinho?\" só faz sentido em casa bilíngue, o que não combina com 'todo pai'. E \"algo que ouve na primeira consulta e que os pais nunca relatam\" se contradiz: se ela ouve, alguém relatou."
    correcao: "Exemplo: trocar por uma veterinária (sem uso em 21 a 23). Comum: \"Uma veterinária vê o vídeo de um mecânico… e publica 'o barulho que o seu cachorro faz e você não conta na consulta'.\" Singular: \"Escreve sobre algo que só aparece na consulta quando ela pergunta, com o jeito dela de abrir: 'Tem uma pergunta que eu faço a todo tutor de cachorro idoso: ele está bebendo mais água do que bebia no ano passado?'\" (o aumento da sede é sinal precoce conhecido de doença renal e endócrina, e o tutor raramente o conta sem ser perguntado). Oficina: trocar a nutricionista por uma consultora de RH: \"1. o lance que todo mundo viu; 2. o que ninguém viu no mesmo lance…\" / \"O lance: o pedido de demissão. O que ninguém viu no mesmo lance: a conversa de retorno adiada três meses antes.\" Isso também corrige o encaixe frouxo do exemplo atual: o lanche das quatro não está 'no mesmo lance' do café da manhã. Atualizar ESTADO.yaml › figurantes, que ainda lista dermatologista para o 22."
  - criterio: metodo
    trecho: "Escolheu o texto da psicóloga de São Paulo que mais a tinha feito pensar, e não o que tinha tido mais comentários."
    por_que: "A cena-modelo do método tira a estrutura da fonte que a Tabela 22.1 classifica como \"Colegas da sua área | … | Muito alto\" e que o 'Evite' proíbe (\"Usar um colega da sua área como modelo\"). O capítulo apresenta isso como sucesso (\"Agora sim.\") e nunca reconhece que a primeira engenharia reversa veio do lugar mais arriscado. O leitor que imita a cena faz o contrário da regra 1 da rede."
    correcao: "Reconhecer isso na abertura do parágrafo da fonte: \"O primeiro cartão tinha saído da fonte mais arriscada, e só deu certo porque ela fechou o celular antes de escrever. Os seguintes vieram de longe.\" Depois vem \"A fonte da referência também pesa.\""
  - criterio: voz
    trecho: "Ela olhava para aquilo que era da outra, a voz, e passava por cima do que qualquer pessoa poderia aprender, a ordem."
    por_que: "A ideia 'quem admira vê a voz e perde a ordem' aparece cinco vezes em poucas páginas: \"Ela tinha levado a pele e deixado o esqueleto\" (cena), \"as duas são as primeiras que o olho de quem admira percebe\", esta frase, a legenda da figura (\"O olho de quem admira percebe primeiro as camadas de cima\") e \"atribui o efeito à voz, que é o que aparece… e isso vinha da ordem\". A lição cap02-r1 limita a mesma ideia a duas vezes por capítulo. A repetição faz o texto soar como aula que martela."
    correcao: "Manter a imagem da cena e o parágrafo do mecanismo (\"Há um motivo para as pessoas levarem a camada errada…\"). Cortar \"e as duas são as primeiras que o olho de quem admira percebe\" (a frase termina em \"Nenhuma das duas é sua.\"). Fechar o parágrafo da colega em \"O erro estava em onde a admiração tinha pousado.\" e cortar a frase citada. A legenda da figura pode dizer outra coisa: \"A camada que se leva é a que não aparece; por isso é preciso escrevê-la num cartão para vê-la.\""
  - criterio: originalidade
    trecho: "Tem uma cena que eu vejo muito: {a cena comum, sem ninguém identificável}."
    por_que: "O roteiro é quase uma cópia do roteiro do cap. 21, na página vizinha do livro: \"Tem uma situação que aparece muito no meu trabalho: {o tipo de situação, sem ninguém}\" … \"faça a si mesmo esta pergunta: {a pergunta}\". Aqui: \"Tem uma cena que eu vejo muito\" … \"pergunte a si mesmo: {a pergunta}\". Num capítulo sobre não repetir a estrutura dos outros, o livro repete a própria. Além disso, o roteiro só serve ao esqueleto da cena e da crença; a roteiro_nota remenda, mas os dois exemplos do capítulo (a informação omitida, o lance de futebol) ficam sem modelo falado."
    correcao: "Diferenciar a abertura e o fecho do cap. 21: \"Toda semana alguém me descreve a mesma cena: {…}.\" / \"Quem vive isso costuma pensar: {a crença, com as palavras de quem acredita}.\" / \"…Mas falha quando {…}.\" / \"Da próxima vez, antes de {o gesto de sempre}, se pergunte: {a pergunta}.\" Outra saída: aproveitar a ESTRUTURA do PWA ('Vi uma coisa fora da minha área que explica bem o que eu vejo aqui: {a comparação}. No meu trabalho é igual: {…}. E é por isso que {…}'), que é distinta e encarna a regra 1 da rede."
  - criterio: clareza
    trecho: "A fonte da referência também pesa."
    por_que: "A seção 'O teste da contaminação' virou depósito (lição cap01-r2: a seção não pode tratar de assuntos que o intertítulo não cobre). Depois das cinco perguntas e do texto reprovado, ela passa a tratar de onde buscar referência (tabela 22.1), da melhor fonte (o atendimento) e do cartão da primeira sessão. Quem folheia o livro para achar 'onde buscar' não encontra o assunto pelo intertítulo."
    correcao: "Abrir um quinto intertítulo antes deste parágrafo: '## Onde buscar a estrutura'. Com isso o capítulo fica com 5 intertítulos, dentro do limite de 3 a 5, e o teste da contaminação termina em \"…anotou no caderno o motivo, para se lembrar.\""
  - criterio: clareza
    trecho: "- Porque os colegas percebem quando você os imita de perto."
    por_que: "Não é um distrator inequivocamente falso, como pede a lição cap01-r1: a cena de abertura prova o contrário. A amiga do grupo de estudos, psicóloga, percebeu a imitação (\"Gostei. Mas quem escreveu?\"). O leitor atento pode marcar b com base no próprio capítulo."
    correcao: "Trocar por algo falso e de tamanho parecido: \"Porque os colegas da sua área publicam menos.\""
  - criterio: concretude
    trecho: "O mecanismo era simples, e ela reconheceu nele uma coisa que via em pacientes."
    por_que: "A frase promete um paralelo clínico e nunca o entrega. O parágrafo passa direto para o horário do café. É a única abstração do capítulo que não desce a um caso, e logo no ponto em que o ofício da Lúcia poderia iluminar o conceito."
    correcao: "Entregar o paralelo em uma frase, com imagem ainda não usada no livro: \"…uma coisa que via em pacientes: quem volta de um fim de semana com a família costuma chegar à sessão falando com as palavras da mãe.\" Se não houver um caso bom, cortar a oração: \"O mecanismo era simples.\""
  - criterio: aplicabilidade
    trecho: "intro: \"Publique a peça da oficina. O assunto é uma crença, um caso ou um padrão da sua área; a estrutura veio de fora, e nada mais veio junto.\""
    por_que: "A rede diz ao leitor duas coisas que não combinam. A intro afirma que a estrutura da peça 'veio de fora'. A regra 2 manda \"Prefira a ordem do seu próprio atendimento\", e o texto chama essa fonte de 'a melhor que existe'. O 'Faça assim' fala em \"Anotar num caderno os esqueletos\", e o capítulo inteiro usa cartões numa caixa de fichas. O leitor não sabe se a peça que vai publicar deveria ter a estrutura da referência ou a do atendimento."
    correcao: "Intro: \"Publique a peça da oficina. O assunto é uma crença, um caso ou um padrão da sua área; da referência, só veio a ordem.\" Regra 2 como passo seguinte: \"Na próxima, experimente a ordem do seu próprio atendimento.\" Faça: \"Guardar em fichas, ou num caderno, os esqueletos que funcionaram com você, sem o conteúdo de cada um.\""
  - criterio: honestidade
    trecho: "Lúcia descobriu os textos de uma psicóloga de São Paulo que muita gente da área lia."
    por_que: "Pedido da r1 não atendido. O capítulo ainda tem três generalizações sobre terceiros sem fonte, acima do limite de duas: \"que muita gente da área lia\", \"que os pais nunca relatam\" (exemplo) e \"Há quem, com medo de virar cópia, pare de ler o que os outros publicam\". A última também fica sem caso que a sustente (voz.concretude)."
    correcao: "\"…uma psicóloga de São Paulo que as colegas do grupo de estudos liam.\" No exemplo, ver a troca acima. \"Há quem…\" vira observação de personagem: \"Lúcia conhecia uma colega do grupo que parou de ler o que os outros publicam, com medo de virar cópia, e passou a redescobrir sozinha…\""
  - criterio: ritmo
    trecho: "uma frase que ela não sustentaria numa conversa com um colega. Tinha escrito porque a outra escrevia. Esse é o risco maior da cópia: além de apagar a voz, ela compromete você com posições que você não sustentaria numa conversa."
    por_que: "Eco em três frases: 'não sustentaria numa conversa' duas vezes. Há outro eco no trecho: 'gente de verdade' aparece quatro vezes, em \"competência de verdade\", \"testada em gente de verdade\", \"com gente de verdade\" e na tabela e na regra 2 da rede, e 'centenas de vezes' aparece duas. Lido em voz alta, o fim da seção 3 fica pesado de repetições."
    correcao: "\"…ela compromete você com posições que você não defenderia.\" Cortar 'de verdade' em pelo menos duas ocorrências: \"já é uma estrutura testada centenas de vezes\"; \"Era um esqueleto testado havia anos, e ela nunca o tinha usado para escrever.\""
  - criterio: impresso
    trecho: "p. 13 (pé da página em branco depois de \"…a ordem.\")"
    por_que: "Dois problemas de diagramação apontados na r1 continuam. Ainda há cerca de 27% em branco no pé da p. 13, porque figura e Conceito passaram juntos para a p. 14. A legenda da figura 22.1 continua colada no bloco 'Estrutura'. Os detalhes estão em diagramacao."
    correcao: "Ver diagramacao."
edicoes_de_linha:
  - "\"e discordou de uma distinção: a outra tratava cansaço e tédio como a mesma coisa\" -> \"e sentiu falta de uma distinção: a outra tratava cansaço e tédio como a mesma coisa\" (a outra não fazia distinção nenhuma; não havia de que discordar)"
  - "\"A admiração, lida de colega para colega, tinha deixado isso.\" -> \"Lida de igual para igual, a outra tinha deixado nela uma posição.\" (admiração não se 'lê')"
  - "\"Em fevereiro, os textos dela mudaram.\" -> \"A partir da segunda terça de fevereiro, os textos dela mudaram.\" (fevereiro tem quatro terças; o texto fala em três)"
  - "\"o barulho que a sua criança faz\" -> \"o barulho que o seu filho faz\" (se o exemplo for mantido; 'sua criança' é decalque)"
  - "\"Havia uma ironia maior, que ela só viu quando releu os três lado a lado pela segunda vez.\" -> \"Havia uma ironia maior, que ela só viu na segunda leitura dos três textos lado a lado.\" (evita confundir com 'os três textos daquele mês')"
  - "\"já é uma estrutura testada em gente de verdade, centenas de vezes\" -> \"já é uma estrutura testada centenas de vezes\""
  - "esqueleto_rotulo: \"Passe a limpo a peça do campo 04, na ordem do seu esqueleto do campo 02\" -> \"Passe a limpo a peça do campo 04, na ordem do campo 02\" (hoje o '02' cai sozinho na segunda linha, p. 22)"
  - "\"compromete você com posições que você não sustentaria numa conversa\" -> \"compromete você com posições que você não defenderia\""
diagramacao:
  - "p. 13: cerca de 27% em branco no pé depois de \"…a ordem.\" (já apontado na r1). A figura 22.1 e o Conceito passaram juntos para a p. 14. Deixar a figura ir sozinha e o Conceito entrar no pé da p. 13, ou subir o parágrafo \"Há um motivo para as pessoas levarem a camada errada…\" para antes da figura."
  - "p. 14: a legenda da figura 22.1 continua colada no bloco 'Estrutura', sem respiro (já apontado na r1). Dar ~2 mm de margem superior à legenda."
  - "p. 16: o sobretítulo 'NA PRÁTICA' encosta no título 'A mesma referência, usada de dois jeitos', sem entrelinha. Os outros boxes têm respiro entre sobretítulo e título; igualar."
  - "p. 19: cerca de 22% em branco no pé depois do campo 02. O campo 03 (3 linhas de exemplo + 3 de escrita) parece caber com pouco ajuste de espaçamento; verificar antes de aceitar o branco como indivisível."
  - "p. 22: o rótulo do esqueleto quebra em duas linhas e deixa \"02\" sozinho (\"…DO SEU ESQUELETO DO CAMPO / 02\"). Encurtar o rótulo (ver edições de linha)."
  - "p. 21: ~20% em branco antes do esqueleto indivisível. Aceito pelo projeto."
veredito: "Melhorou bem desde a r1: método e oficina estão coerentes e a cena continua forte. Ainda há um gabarito que cita um texto que não existe mais, um furo de enredo nos textos de fevereiro, figurantes repetidos de capítulos vizinhos e um roteiro clonado do cap. 21, o que segura a coerência em 8,1; resolvidos esses pontos e cortada a repetição da ideia 'a voz aparece, a ordem não', o capítulo passa de 9."
