diagramacao:
  - 'p013, figura 3.1: a legenda está cortada na margem direita ("Os vídeos do Caio tinham a camada de cim|"), e o rótulo "A BASE" encosta na legenda sem respiro. Limitar a largura da legenda à caixa da figura e dar 2 a 3 mm entre o rótulo e a legenda.'
  - 'p016: cerca de 1/4 da página em branco depois do exemplo, porque o intertítulo "Para que serve, então, a boa produção" desceu com o parágrafo inteiro. Permitir a quebra do primeiro parágrafo depois de 2 linhas ou aproximar o bloco "Por quê" do box.'
  - 'p017: cerca de 1/3 da página em branco depois da nota "O mínimo que resolve quase tudo", porque a figura 3.2 não coube e foi para a p018. Cortar o parágrafo "Há ainda uma vantagem pouco comentada…" (ver problema 2) e pôr a figura antes da nota, ou deixar o texto seguinte correr antes da figura.'
  - 'p021/p022: a rede abre no terço final da p021 e a regra 1 fica sozinha, separada das regras 2 e 3 (p022). Manter o cabeçalho da rede e as três regras juntos: abrir a rede no alto da p022 ou forçar keep-together no bloco de regras. O branco de 60% da p022, antes do esqueleto indivisível, é aceito pelo projeto.'
  - 'p023: no roteiro, a lacuna "um detalhe específico da sua prática, uma frequência, um sinal" quebra no meio do sublinhado; abreviar para "{um detalhe da sua prática}" ou permitir que a lacuna ocupe uma linha própria.'
  - 'Extensão: o capítulo vai da p011 à p025 (15 páginas), acima do alvo de 10 a 14, com dois brancos evitáveis (p016, p017). As correções acima devem trazê-lo para 14.'
  - 'p020: o branco depois do campo 03, antes do campo 04 indivisível, é aceito. Se entrarem os dois campos novos da oficina (problema 4), conferir se o conjunto continua em duas páginas sem quebrar nenhum campo.'
veredito: "Capítulo com a melhor cena da Fase I e prosa madura, reprovado nesta iteração por instruções de gravação que se contradizem, uma imagem que expõe sigilo, oficina com checklist sem campos e roteiro com fecho pronto e indireta a colegas; tudo corrigível numa passada."
