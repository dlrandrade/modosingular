capitulo: 3
iteracao: 1
notas: {metodo: 8.4, voz: 8.4, originalidade: 8.5, clareza: 8.3, ritmo: 8.5, concretude: 8.6,
        coerencia: 7.9, aplicabilidade: 7.6, impresso: 8.0, honestidade: 8.4}
bloqueadores:
  - 'Contradição nas instruções que o leitor executa e confere (a quantidade de tomadas). A entrega diz "Uma peça feita em uma tomada"; o critério da oficina, que o leitor marca, diz "Uma tomada só. Se errou uma palavra, deixou."; a regra 2 diz "Uma tomada, um erro permitido."; o "Evite" admite até três ("Regravar mais de duas vezes atrás da versão perfeita."); e a nota do roteiro autoriza uma segunda e fala numa terceira ("Se precisar de uma segunda tomada, tudo bem; na terceira, publique a melhor das duas."). São três números diferentes em quatro páginas, e a nota contradiz o critério do capítulo-fonte ("Uma tomada só"). Quem segue a nota reprova no próprio checklist. Correção: uma regra só, repetida igual nos quatro lugares (ver problema 1).'
  - 'Problema ético (sigilo) numa instrução operativa, num livro para profissões regulamentadas. A prosa dá como modelo "Um advogado gravando no próprio escritório, com os processos empilhados atrás", e a regra 1 da rede manda "Grave onde você trabalha." sem nenhuma ressalva. Capa de processo tem nome de cliente e número; prontuário, tela de computador e paciente na sala de espera também aparecem em vídeo feito "onde você trabalha". O próprio livro trata o sigilo como inegociável (Lúcia, cap. 2; aviso de "Antes de começar"). Correção: trocar a imagem e acrescentar meia frase à regra 1 (ver problema 2).'
pontos_fortes:
  - 'A cena do taco é a melhor da Fase I até aqui: ofício exato ("aquele taco era de peroba, madeira que hoje quase não se encontra, que bastava raspar e recuperar"), fala própria ("O taco é a única coisa nesse apartamento que foi feita para durar cinquenta anos. Não troca o que está dando certo.") e um fecho que prova o argumento sem sublinhar ("na primeira reunião, que ouvira o áudio três vezes").'
  - 'O teste do mudo aplicado ao vídeo preferido é demonstração, e não só definição: "Reformamos um apartamento de 1972. Ficou bonito." Na segunda passada, a lista das decisões que não aparecem ("por que a janela da sala foi mantida mesmo torta, por que ele desaconselhou o forro de gesso") termina numa frase que o leitor guarda: "estavam todas fora do filme".'
  - 'Formulações próprias e com humor seco: "Comprar equipamento é uma das formas mais respeitáveis de adiar."; "ninguém comentou a trilha, porque não havia trilha"; "Enquanto ajustava a cor de um plano, ele não precisava decidir o que pensava sobre nada." O parágrafo do "motivo menos confessável" é contribuição que o PWA não tinha e acerta o nervo do público.'
  - 'A nuance que o PWA não tinha, e que protege o capítulo de virar "defesa do feio": "Existe, sim, um momento em que investir mais em produção faz sentido. Ele chega quando você já sabe o que diz, já tem um ritmo que se sustenta e percebe que algum atrito específico está custando atenção". A câmera que continua "útil para as fotos de entrega" dá a mesma nuance em cena.'
  - 'O exemplo comum-vs-singular trocou o dentista do PWA (já usado no cap. 2) por uma fonoaudióloga com detalhe clínico correto ("Rouquidão que piora ao longo da semana e melhora no domingo costuma ter mais a ver com o jeito de usar a voz do que com hidratação"). A dermatologista do protetor e da janela também é exata.'
  - 'Honestidade na hora do resultado: "É cedo para tirar conclusões de um único vídeo". Regra de ouro íntegra na rede ("A peça é sobre a sua área. A produção mínima é só o meio"). Lint limpo, média de frase 17,3 com desvio 9,6.'
problemas:
  - criterio: aplicabilidade
    trecho: "Grave antes de pensar demais. Se precisar de uma segunda tomada, tudo bem; na terceira, publique a melhor das duas."
    por_que: 'Bloqueador 1. Além de contradizer "Uma tomada só" e "Regravar mais de duas vezes", a frase em si é confusa ("na terceira, publique a melhor das duas": grava-se ou não a terceira?).'
    correcao: 'Fixar "uma tomada; uma segunda só se a primeira for interrompida" e repetir igual em todos os lugares. roteiro_nota: "Grave antes de pensar demais. Se errar uma palavra, siga em frente. Se a tomada for interrompida (o telefone tocou, alguém entrou), grave de novo uma vez e publique essa." Critério da oficina: "Uma tomada só, ou duas se a primeira foi interrompida. Se errou uma palavra, deixou." Evite: "Regravar atrás da versão perfeita." Entrega: "Uma peça feita de uma vez, sem edição…".'
  - criterio: metodo
    trecho: "Um advogado gravando no próprio escritório, com os processos empilhados atrás, uma nutricionista na bancada do consultório, um arquiteto no meio da obra"
    por_que: 'Bloqueador 2 (sigilo). O detalhe também é inexato em 2026: o processo judicial é quase todo eletrônico, e advogado que mostra pilha de autos soa antigo. A "nutricionista na bancada" não corresponde ao consultório de nutrição (não há bancada) e repete a nutricionista do cap. 1. O "arquiteto no meio da obra" é o próprio Caio. O parágrafo ainda repete quase literalmente a regra 1 da rede ("O fundo branco e bem iluminado apaga exatamente o contexto que ajudava a acreditar" / "Um cenário neutro remove o contexto que ajudava você").'
    correcao: 'Cortar o parágrafo da prosa (a ideia já está na regra 1 da rede, e o corte resolve o branco da p017) e reescrever a regra 1: {regra: "Grave onde você trabalha.", porque: "O ambiente real carrega prova, e um cenário neutro remove o contexto que ajudava você. Antes de gravar, confira o quadro: nenhum papel, tela, prontuário ou cliente identificável."}. Se o parágrafo ficar, trocar a imagem por "uma farmacêutica atrás do balcão, com as gavetas de medicamento ao fundo, um professor de cursinho diante do quadro ainda escrito".'
  - criterio: metodo
    trecho: "Se você for levar uma coisa só daqui, leve essa exceção. É ela que separa quem acerta de quem repete o manual."
    por_que: 'O roteiro deveria ser o esqueleto dito em voz alta (lição cap01-r1), mas o quarto passo do esqueleto ("O fecho: Uma frase repetível") virou uma fórmula pronta, igual para todo leitor e sem lacuna. E a fórmula é uma indireta a colegas ("quem repete o manual"), o que a lição cap01-r2 proíbe e os códigos de ética de saúde e advocacia restringem. O "Tem um detalhe que quase ninguém conta" puxa para o mesmo lado (insinua que os outros escondem) e tem cheiro de isca de vídeo.'
    correcao: 'roteiro: "{a afirmação direta, sem preâmbulo}\n\nNa prática, o que eu vejo é isto: {um detalhe específico da sua prática, uma frequência, um sinal}\n\nMas tem uma exceção: {quando a regra falha}\n\n{o fecho: a frase que você quer que a pessoa repita}".'
  - criterio: aplicabilidade
    trecho: "Anotei três sinais de autoridade que posso usar"
    por_que: 'Dois dos quatro itens do checklist (5 dos 10 pontos com "Identifiquei onde eu estava gastando esforço demais") não têm campo na oficina, o que viola a lição cap01-r1. A oficina pede um sinal só, em uma linha ("Qual sinal de autoridade você vai usar?"), e nada sobre a etapa de produção que travava. O exercício que sustentaria o item ("durante três dias, anotar ao fim do expediente uma frase que você disse a alguém e que um colega menos experiente não diria") está na prosa e some da oficina. Diferente do cap. 1, as ajudas do checklist não remetem aos campos.'
    correcao: 'Acrescentar dois campos: "A etapa de produção que mais adiou você, e quanto tempo ela custou" (2 linhas) e "Três frases que você disse esta semana e que um colega menos experiente não diria: um detalhe, uma exceção, uma recusa" (3 linhas). Trocar o campo 02 por "Qual sinal você vai usar, e como ele aparece na sua prática?" (2 linhas). Nas ajudas do checklist, remeter aos campos como no cap. 1 ("(campo 01)", "(campo 06)" etc.). Se faltar espaço, reduzir o campo "O que você vai dizer" de 7 para 6 linhas.'
  - criterio: aplicabilidade
    trecho: "“Não editei, não pus legenda, gravei na obra com o celular apoiado num cavalete.”"
    por_que: 'É o único exemplo de verdade da oficina, e é da profissão do personagem em foco (obra, cavalete), o que viola a lição cap01-r1 e a estrutura do capítulo ("Exemplos dos campos sempre em profissões variadas"). Os demais "exemplos" são instruções ("Detalhe específico, exceção nomeada, recusa…"; "Se sobrasse só esta frase…"). O leitor não vê como fica um campo preenchido em nenhuma área diferente da arquitetura. O exemplo ainda celebra a ausência de legenda, que a prosa acabou de defender (ver problema 8).'
    correcao: 'Dar a cada campo um exemplo em profissão da lista ainda não usada. Campo 02: "Um professor de cursinho: recusa. “Não passo lista de macetes para a prova de física, e explico por quê.”" Campo 03: "Uma farmacêutica: “Remédio para dor de cabeça tomado todo dia pode ser a causa da dor de cabeça.”" Campo 05: "Uma designer de interiores: “Gravei na sala da cliente, sem arrumar as almofadas, com o celular encostado na estante.”"'
  - criterio: aplicabilidade
    trecho: "entrega: Uma peça feita em uma tomada, sem edição, com pelo menos um dos cinco sinais de autoridade."
    por_que: 'A oficina manda entregar a peça já gravada, mas as regras de gravação ("Grave onde você trabalha", "Resolva o áudio"), o esqueleto e o roteiro só vêm depois, na rede. Na ordem do livro, o leitor grava antes de ler como gravar e escreve a fala (campo 04, sete linhas soltas) antes de ver o esqueleto de quatro partes que deveria organizá-la. No cap. 1 e no cap. 2, a oficina produz a matéria e a rede a transforma em peça; aqui as duas seções fazem a mesma coisa em ordem trocada.'
    correcao: 'Entrega da oficina: "O roteiro de uma peça em fala natural, com pelo menos um dos cinco sinais, pronto para gravar de uma vez." Campo 04 com o subtítulo "Em quatro tempos: a afirmação, o detalhe, a exceção, a frase que fica". A gravação fica na rede, com a intro: "Grave hoje, onde você trabalha, a partir do campo 04." O item 3 do checklist ("Gravei ou escrevi uma peça") continua valendo.'
  - criterio: clareza
    trecho: "Se o conteúdo continua funcionando para quem assiste sem som."
    por_que: 'O capítulo nunca explica o nome "teste do mudo", e o nome sugere justamente o distrator da questão 4. A prosa reforça a leitura errada ("Legenda permite assistir no ônibus, sem som"). Um leitor apressado explicaria o teste a um colega como "ver se o vídeo funciona sem áudio", o oposto do conceito, que consiste em tirar tudo menos o que foi dito. Com o nome sem explicação, o distrator deixa de ser inequivocamente falso.'
    correcao: 'Na primeira aparição, depois de "sem enfeite": "O nome vem daí: o teste cala tudo o que não é a ideia (a imagem, a trilha, o corte, a cor) e deixa só a fala, no papel." Mantido o distrator, ele passa a ser falso sem ambiguidade.'
  - criterio: coerencia
    trecho: "Legenda permite assistir no ônibus, sem som."
    por_que: 'A prosa põe a legenda entre as quatro coisas que "protegem a atenção de quem está do outro lado, e isso importa". Mas a regra 3 da rede manda "Resolva o áudio e ignore o resto", e o único exemplo da oficina apresenta "não pus legenda" como virtude. O leitor sai sem saber se legenda é atrito que se reduz ou enfeite que se corta.'
    correcao: 'Regra 3: porque: "Áudio ruim faz a pessoa sair. Imagem imperfeita, não. Se a plataforma gera legenda automática, deixe ligada e corrija os erros: custa dois minutos." Tirar "não pus legenda" do exemplo do campo 05.'
  - criterio: coerencia
    trecho: "No sétimo fim de semana, a edição começou a pesar. No décimo primeiro, Caio não abriu o programa."
    por_que: 'Contradição interna com a frase de abertura ("Caio passou onze fins de semana editando seis vídeos"), com o elenco ("seis vídeos cinematográficos em onze fins de semana de edição") e com o cap. 5 ("onze fins de semana para seis vídeos"). Se no décimo primeiro ele não abriu o programa, editou dez.'
    correcao: '"No sétimo fim de semana, a edição começou a pesar. No décimo primeiro, terminou o sexto vídeo. No décimo segundo, não abriu o programa."'
  - criterio: coerencia
    trecho: "Em quarenta segundos, explicou que aquele taco era de peroba"
    por_que: 'É a primeira cena do Caio no livro, e a lição cap01-r2 pede que o personagem em foco mostre o seu modo (elenco: "pensa CONTANDO — tudo vira história de obra"; marca "começa com ''teve uma obra…''") já na primeira aparição. No áudio, porém, ele argumenta: tese, dado, consequência. Nenhuma das três marcas dele aparece no capítulo (a história de obra, a parede que mente, medir com o passo), e perde-se o melhor lugar para plantar o sinal que o cap. 7 vai revelar.'
    correcao: '"Em quarenta segundos, contou outra obra: um casal que, dois anos antes, tinha arrancado um taco igual àquele e descoberto, tarde demais, que era peroba, madeira que hoje quase não se encontra. Bastava raspar e recuperar; o porcelanato custaria mais e valeria menos na hora de vender o imóvel." Na última seção, uma marca física: "mediu a parede com o passo antes de apoiar o celular".'
  - criterio: coerencia
    trecho: "por que a parede que o cliente queria demolir tinha que ficar"
    por_que: 'O plano reserva para o cap. 14 a cena central do Caio: "''Dá para derrubar essa parede?'' — a pergunta que Caio responde toda semana há oito anos". Gravar a resposta a essa pergunta já no cap. 3 gasta a cena antes da hora. Da mesma forma, "apoiou o celular num cavalete… quinta-feira" antecipa a virada do cap. 20 ("Da câmera ao celular… toda quinta"); como semente, serve, mas convém não fixar o dia da semana.'
    correcao: 'Trocar o assunto do vídeo: "por que o piso de granilite do corredor, que o cliente queria cobrir, valia mais polido do que escondido". Trocar "Na quinta-feira seguinte" por "Dias depois do teste do mudo".'
  - criterio: honestidade
    trecho: "Só isso já coloca você acima da média do seu mercado."
    por_que: 'Afirmação empírica sem fonte sobre "a média do seu mercado" de qualquer profissão, justamente o que a lição cap01-r1 veta ("nada de afirmação empírica sem fonte"). Soa como promessa.'
    correcao: '"Com isso, a forma deixa de atrapalhar. O resto depende do que você tem a dizer."'
  - criterio: honestidade
    trecho: "Os vídeos cinematográficos não tinham nenhum. A diferença de resultado entre os dois não tem mistério."
    por_que: 'A comparação mistura canais. O áudio não foi publicado: chegou à irmã pelas mãos de uma cliente, que é indicação, o canal que o cap. 1 descreve como limitado. Atribuir a diferença de resultado só aos sinais de autoridade é uma conclusão que o caso não sustenta, e um leitor exigente (o público do livro) nota isso.'
    correcao: '"Os vídeos cinematográficos não tinham nenhum. Parte da diferença de resultado veio do caminho, porque o áudio chegou pelas mãos de uma cliente. A outra parte está nesses três sinais."'
  - criterio: voz
    trecho: "Os capítulos sobre formato e sobre escala, mais adiante, tratam disso."
    por_que: 'Narrador que anuncia, voz de curso (lição cap01-r1). O capítulo tem quatro remissões desse tipo: esta; "ele é a matéria-prima dos próximos capítulos"; "e o livro não vai pedir que você tire. O que ele pede é que…"; e o fecho do texto corrido, que termina numa remissão ("O capítulo 5 volta a essa conta com mais cuidado.") em vez de terminar numa consequência prática, como pede a bíblia.'
    correcao: 'Cortar a primeira e a última. Fechar em "…e a presença que depende de esforço extraordinário termina no primeiro mês comum." Trocar "e o livro não vai pedir que você tire. O que ele pede é que você faça" por "Mas faça a experiência da produção mínima pelo menos uma vez antes de decidir o que ela vale para você."'
  - criterio: voz
    trecho: "A comparação não diz que o vídeo simples é melhor em tudo; diz que ele é sustentável."
    por_que: 'O lint só vê uma antítese, mas o tique está espalhado: "O teste do mudo não pergunta como a peça foi feita. Pergunta o que sobra…"; "não precisam ser inventados, só percebidos"; "em vez de adiar um problema que ainda nem apareceu"; "a pergunta muda de … para …"; "e não de qualquer escritório"; e esta. A última seção tem duas antíteses e "Para que serve" tem três, acima do limite da lição cap01-r1 (uma por seção).'
    correcao: '"Quatro minutos contra onze fins de semana. O vídeo simples não ganha em tudo, mas se repete: um especialista com a agenda cheia consegue gravar quatro minutos toda semana, o ano inteiro." Em "O vídeo seguinte": "As decisões que fizeram daquela reforma um trabalho dele estavam todas fora do filme." Em "Para que serve": "Nesses casos, o investimento resolve um problema que já apareceu."'
  - criterio: voz
    trecho: "Há também um motivo menos confessável para a produção atrair tanto."
    por_que: 'Muleta de transição que se repete no capítulo ("Há ainda uma vantagem pouco comentada da produção mínima") e no livro ("Há ainda um custo mais discreto", cap. 1; duas no cap. 4). Na terceira ocorrência do mesmo molde, o leitor ouve a fórmula.'
    correcao: '"A produção atrai também por um motivo menos confessável." O segundo "Há ainda" some se o parágrafo for cortado (problema 2).'
  - criterio: ritmo
    trecho: "No mesmo período, aconteceu uma coisa em que ele não prestou atenção."
    por_que: 'Três parágrafos passam do teto de 6 frases (lição cap01-r2): o do taco (8 frases), "Há também um motivo menos confessável" (7) e "Nada disso é uma defesa do feio" (7). No do taco, a virada (a irmã, o projeto fechado) fica enterrada no fim de um bloco de 14 linhas na p012.'
    correcao: 'Quebrar o parágrafo do taco depois de "Não troca o que está dando certo.”", de modo que "A cliente encaminhou o áudio para a irmã…" abra um parágrafo curto. Em "Nada disso é uma defesa", cortar "Uma boa diagramação faz o texto ser lido até o fim." ou fundi-la com a anterior. No "motivo menos confessável", começar novo parágrafo em "Caio não pensou nisso quando comprou a câmera".'
  - criterio: clareza
    trecho: "Para quem vive de vender produção, essa ideia faz sentido."
    por_que: '"Essa ideia" remete ao primeiro parágrafo da seção, mas entre os dois há o parágrafo do Caio e da arquitetura, que termina em "o raciocínio que levou àquele ambiente". Lida em sequência, "essa ideia" parece ser o raciocínio, e a frase perde o sentido.'
    correcao: 'Inverter a ordem dos parágrafos 2 e 3 da seção ("Para quem vive de vender produção…" logo após o parágrafo da história da ideia; "No caso do Caio…" em seguida), ou escrever "a ideia de que presença profissional precisa parecer peça publicitária faz sentido".'
  - criterio: concretude
    trecho: "Esse tipo de ação eu não aceito, e vou explicar por quê."
    por_que: 'A tabela é o lugar em que o leitor de outra área mais precisa se ver, e as frases estão genéricas ou concentradas numa área só. A da recusa repete quase literalmente a advogada de família do cap. 1 ("O tipo de ação que eu recuso, e por quê"). A da exceção ("menos para quem já teve uma lesão no joelho") não tem profissão. A do detalhe é do Caio outra vez e usa termo de leigo ("coluna de água da cozinha"; o arquiteto diria "prumada"). As de mudança de opinião e cálculo de risco são fórmulas vazias ("Eu pensava o contrário até alguns anos atrás").'
    correcao: 'Atribuir cada frase a uma profissão diferente, dentro da coluna: Detalhe: "Arquiteto: “Em quase todo apartamento dos anos 70 que eu abro, a prumada de ferro galvanizado da cozinha está no fim da vida.”" Recusa: "Designer de interiores: “Projeto sem visitar o imóvel eu não faço, e explico por quê.”" Mudança de opinião: "Professor de cursinho: “Até uns anos atrás eu mandava fazer lista de cem exercícios. O que me fez mudar foi…”". Fazer o mesmo com a exceção e o cálculo de risco, usando profissões da lista.'
  - criterio: originalidade
    trecho: "Caio não vendeu a câmera."
    por_que: 'Mesma batida de abertura de desfecho em três capítulos seguidos: "Lúcia não publicou nada naquela semana. Fez uma coisa mais útil" (cap. 2), "Otávio não demitiu a agência. Fez algo mais útil" (cap. 4) e esta. Lidos em sequência, os capítulos parecem feitos no mesmo molde.'
    correcao: 'Abrir a seção pela ação: "Dias depois do teste do mudo, Caio apoiou o celular num cavalete…". A câmera vem no fim do parágrafo: "A câmera ficou para as fotos de entrega, que ele faz uma vez por mês, com calma."'
  - criterio: aplicabilidade
    trecho: "Aumentar o alcance das peças nas plataformas."
    por_que: 'O distrator da questão 2 não é inequivocamente falso (lição cap01-r1). Pela lógica do próprio capítulo ("Áudio limpo faz a pessoa continuar ouvindo"), boa produção aumenta a retenção, e retenção afeta alcance. Um leitor informado marca "b" com bons argumentos.'
    correcao: '"Dispensar o especialista de ter uma opinião própria."'
edicoes_de_linha:
  - {trecho: "tiveram algumas milhares de visualizações", correcao: "tiveram alguns milhares de visualizações (milhar é masculino)"}
  - {trecho: "e uma recusa implícita (não troque)", correcao: "Recusa, na tabela, é recusar um serviço; o conselho do Caio é desaconselhar. Trocar por: \"e uma exceção nomeada (todo mundo troca o taco; aquele, não)\" ou \"e um conselho contra a moda (não troca)\", mantendo a forma da fala citada."}
  - {trecho: "Levou quatro minutos entre ligar a câmera e publicar.", correcao: "Levou quatro minutos entre abrir a câmera do celular e publicar."}
  - {trecho: "Esses sinais são pequenos, quase invisíveis para quem produz, e muito nítidos para quem consome. Nenhum deles depende de câmera.", correcao: "Cortar \"Nenhum deles depende de câmera.\": o exemplo da página seguinte fecha com a mesma batida (\"Nenhuma dessas três coisas precisa de câmera.\"), e é lá que ela rende."}
  - {trecho: "A pergunta certa não é quantos litros você bebe. É quantas horas por dia você fala mais alto que o barulho da sala.", correcao: "\"A pergunta certa é quantas horas por dia você fala mais alto que o barulho da sala.\" (tira o \"não é X. É Y.\" da boca da fonoaudióloga)"}
  - {trecho: "pergunte a si mesmo se aquilo interessaria", correcao: "pergunte-se se aquilo interessaria"}
  - {trecho: "Se você nunca publicou, faça o teste com o perfil de um colega da sua área que você admira.", correcao: "Se você nunca publicou, faça o teste com a última peça de um colega que você admira. (O teste é sobre uma peça, não sobre um perfil.) Na ajuda do item 1 do checklist: \"Reescrevi a minha última peça, ou a de um colega, em texto puro (campo 01)…\""}
  - {trecho: "titulo: A hierarquia que sustenta uma presença", correcao: "Título que afirma (princípio das figuras): \"Sem pensamento na base, nada se sustenta em cima\"."}
  - {trecho: "titulo: Onde o esforço rende mais", correcao: "\"Ter o que dizer rende mais que qualquer edição\"."}
  - {trecho: "Tem um detalhe que quase ninguém conta:", correcao: "Na prática, o que eu vejo é isto: (ver problema do roteiro)"}
