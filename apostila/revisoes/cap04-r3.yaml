bloqueadores: []
pontos_fortes:
  - 'O bloqueador da r2 foi resolvido do jeito certo. A intro da rede agora dá ao leitor a decisão da semana ("Se hoje alguém publica por você, a decisão desta semana é a do Otávio: suspender ou reduzir ao mínimo") e condiciona as regras a "quando você voltar a delegar, depois de conhecer a própria voz". O primeiro "Faça assim" remete o ritmo ao capítulo 8. Prosa, figura 4.2, rede e arco dos caps. 6 e 24 agora dizem a mesma coisa.'
  - 'A cena de abertura segue entre as melhores do livro, e as correções de linha da r2 a deixaram mais exata. Estão lá "O comentário tinha quarenta curtidas", "as horas extras de um banco mal controlado são quase sempre o primeiro pedido da lista" e "A dúvida da dona da lavanderia era a primeira que ele teria levantado". O modo do Otávio aparece logo na primeira cena ("Escreveu a resposta à mão, antes de digitar"), e o "veja bem" do fecho paga o desconforto com a própria voz plantado na seção 2.'
  - 'A observação sobre agências virou cena e ganhou força: "reconheceu, no perfil de uma clínica odontológica atendida pela mesma agência, a arte azul e o “Você sabia?” que chegavam para ele. Mandou um print para Helena, sem comentário." A gravação agora custa alguma coisa ao personagem ("ficou no escritório depois que todos saíram, fechou a porta"), e isso a separa do áudio do taco do cap. 3. O cliente do quarto sinal deixou de gastar a frase-marca do cap. 16 ("um advogado que começa toda conversa pela pior hipótese").'
  - 'O caderno está sólido. Trinta segundos cabem em 10 linhas, e a grade 7 x 3 tem instrução para quem faz tudo sozinho. A tabela 4.1 e a grade usam os mesmos sete rótulos. Os pesos 4/3/2 com corte em 7 exigem o áudio. A verificação tem as corretas em b, d, a e c, com distratores falsos para qualquer profissão, e o gabarito da questão 2 traz ganho novo ("desfazer uma expectativa errada custa mais do que nunca tê-la criado").'
problemas:
  - criterio: aplicabilidade
    trecho: "Se você nunca publicou, escreva qual sinal mais aparece no perfil do colega que você mais admira, e por que você não quer repeti-lo."
    por_que: 'Três dos quatro sinais descrevem a experiência de quem aprova a peça: "Você lê a publicação e pensa…", "Você aprova por falta de objeção…", "Quando alguém discorda nos comentários, você não sabe defender…". Ninguém consegue observá-los no perfil de outra pessoa. Só o sinal 2 pode ser verificado de fora. Do jeito que está escrita, a alternativa para quem não publica não se executa no papel. A escolha do "colega que você mais admira" ainda cria uma contradição: o perfil admirado é justamente o que exibe o defeito. O mesmo recurso já foi usado no cap. 3, na nota e no campo da oficina ("a última peça de um colega que você admira"). A r2 apontou o problema, e só a primeira metade foi corrigida.'
    correcao: 'Trocar a segunda frase do exemplo por: "Se você nunca publicou, aplique o teste do sinal 2 a três publicações de um perfil da sua área que você acompanha: cobrindo o nome, você saberia dizer de quem são? Anote o que torna a mais anônima delas intercambiável." Ajuda do checklist: "Sei quais sinais aparecem no que publico, ou apliquei o teste do sinal 2 a outro perfil (campo 04)."'
  - criterio: honestidade
    trecho: "A terceirização prematura costuma nascer do raciocínio de um bom profissional."
    por_que: 'A lição cap01-r4/cap02-r2 permite no máximo duas generalizações sem fonte sobre terceiros por capítulo. Continuam cinco: o intertítulo "Como a história costuma acontecer"; "é comum a ponto de parecer um roteiro"; "a resposta que muito profissional liberal dá"; "chegou à conclusão mais comum nessa situação"; e esta frase, cuja reescrita a r2 tinha sugerido literalmente ("No caso do Otávio, a terceirização nasceu do raciocínio de um bom profissional"). Na mesma linha, "Uma agência tem ainda um incentivo estrutural para o genérico. Ela atende muitos clientes ao mesmo tempo, e o que aprende com um aplica aos outros." afirma algo sobre o setor inteiro antes da cena que o prova. O leitor que tem uma boa agência lê isso como tese de palco.'
    correcao: 'Manter só "é comum a ponto de parecer um roteiro" e "muito profissional liberal". Intertítulo: "O caminho até a quinta-feira". "No caso do Otávio, ela nasceu do raciocínio de um bom profissional." "chegou a uma conclusão que parecia óbvia: rede social não funciona para advogado." Parágrafo da agência: "A agência do Otávio tinha ainda um incentivo para o genérico: atendia muitos clientes ao mesmo tempo, e o que aprendia com um aplicava aos outros."'
  - criterio: aplicabilidade
    trecho: "Parta da transcrição do campo 02 e das marcas do campo 03; o esqueleto só pede que você as ponha em ordem."
    por_que: 'O campo 02 só tem os primeiros trinta segundos. O esqueleto pede "A explicação — Inteira, na ordem em que ela sai naturalmente de você" e "O fecho curto", que estão nos minutos seguintes do áudio e não no papel. Quem segue a instrução ao pé da letra monta a peça com um terço da matéria-prima.'
    correcao: '"Parta do áudio inteiro, ouvido de novo, dos trinta segundos transcritos no campo 02 e das marcas do campo 03. O esqueleto só pede que você ponha tudo em ordem."'
  - criterio: coerencia
    trecho: "Toda semana alguém me pergunta {a pergunta que você mais ouve}. Eu explico sempre do mesmo jeito, e vou explicar igual aqui."
    por_que: 'O roteiro abre com o movimento do cap. 14 ("A pergunta recorrente", "Inventário de perguntas"), e o título da rede ("A explicação que já é sua") antecipa o do cap. 16 ("A explicação que você repete há anos", também do Otávio). A fonte do PWA abre de outro jeito: "Vou explicar isso exatamente do jeito que eu explico no atendimento." Seguir a fonte preserva o método e não gasta a peça de dois capítulos da Fase III. Há também uma fricção com o cap. 6, já escrito: "Otávio pensou no que diria quando a agência voltasse a publicar, dali a algumas semanas, e concluiu que não tinha nenhuma ideia". Semanas antes, no cap. 4, ele tinha gravado três minutos inteiros sobre o "acertar por fora".'
    correcao: 'Roteiro: "Vou explicar {o assunto} do jeito que eu explico {a um cliente | a um paciente} quando ele está na minha frente. Sem enfeite." Manter o resto. No cap. 6 (fora deste capítulo), acrescentar meia frase: "…concluiu que não tinha nenhuma ideia. O áudio do “acertar por fora” continuava no celular; não lhe ocorreu que aquilo fosse uma."'
  - criterio: ritmo
    trecho: "Para a agência, reaproveitar o que funciona é eficiência. Para o cliente, é diluição."
    por_que: 'A seção "O que se perde no caminho" fecha três parágrafos seguidos com uma antítese binária: "É um trabalho honesto, e o resultado é correto. Correto é o problema."; "Uma começa pelos riscos jurídicos; a outra, pelo efeito sobre a equipe que fica."; e esta. Lida em voz alta, a seção vira cadência. A frase anterior, "Mandou um print para Helena, sem comentário.", é um fecho mais seco e mais do Otávio. A densidade também aparece em "Por que gente competente…" ("quando na verdade é uma extensão da atividade principal" e "não davam vergonha… Também não davam orgulho") e no Para guardar, onde os três itens são antíteses.'
    correcao: 'Cortar as duas últimas frases do parágrafo, que passa a terminar em "sem comentário.". Em "Por que gente competente…": "O raciocínio falha num ponto só: ele supõe que comunicar é uma atividade periférica, como a contabilidade. No trabalho dele, comunicar é a própria atividade principal, dita em voz alta."'
  - criterio: coerencia
    trecho: "Otávio nunca gostou de ouvir a própria voz gravada nem de reler o que publicava; achava a voz grave demais e os textos longos demais"
    por_que: 'O capítulo não mostra que Otávio publicasse alguma coisa antes da agência. "reler o que publicava" pressupõe um histórico que não existe, e "os textos longos demais" fica ambíguo ao lado dos "e-mails longos e francos que os clientes costumavam guardar e reler", que o livro trata como virtude dele (modo: pensa escrevendo).'
    correcao: '"Otávio nunca gostou de ouvir a própria voz gravada nem de se imaginar lido por estranhos; achava a voz grave demais e os próprios textos longos demais para a internet, e esse desconforto…"'
  - criterio: honestidade
    trecho: "A peça deste capítulo é a explicação que você gravou na oficina, organizada para quem ainda não conhece você."
    por_que: 'A rede transforma em peça pública um áudio gravado para uso privado. O exemplo do próprio capítulo traz "um exemplo de um cliente de Caruaru, com o nome trocado". Para o público do livro (saúde, direito, psicologia), a passagem do privado para o público é o ponto em que o sigilo se perde. O livro lembra o código de ética na tabela 4.1, mas não aqui, que é onde o leitor publica.'
    correcao: 'Acrescentar ao fim da intro: "Antes de publicar, tire da peça qualquer detalhe que identifique um cliente, mesmo com o nome trocado."'
  - criterio: clareza
    trecho: "explicava que o banco de horas permite compensar horas extras com folgas, sem pagá-las, desde que haja acordo, e estava certo."
    por_que: 'O "e estava certo" pendurado no fim de uma frase longa lê-se como parte do conteúdo da arte ("explicava que… e [que] estava certo"). A informação é decisiva para a tese, porque o problema é o texto correto, e merece uma posição limpa.'
    correcao: '"Uma das publicações do mês, uma arte azul com o título “Você sabia?”, explicava corretamente que o banco de horas permite compensar horas extras com folgas, sem pagá-las, desde que haja acordo."'
edicoes_de_linha:
  - 'Como a história costuma acontecer -> O caminho até a quinta-feira'
  - 'A terceirização prematura costuma nascer do raciocínio de um bom profissional. -> No caso do Otávio, ela nasceu do raciocínio de um bom profissional.'
  - 'chegou à conclusão mais comum nessa situação: -> chegou a uma conclusão que parecia óbvia:'
  - 'Uma agência tem ainda um incentivo estrutural para o genérico. Ela atende muitos clientes ao mesmo tempo, e o que aprende com um aplica aos outros. -> A agência do Otávio tinha ainda um incentivo para o genérico: atendia muitos clientes ao mesmo tempo, e o que aprendia com um aplicava aos outros.'
  - 'Mandou um print para Helena, sem comentário. Para a agência, reaproveitar o que funciona é eficiência. Para o cliente, é diluição. -> Mandou um print para Helena, sem comentário.'
  - 'explicava que o banco de horas permite …, desde que haja acordo, e estava certo. -> explicava corretamente que o banco de horas permite …, desde que haja acordo.'
  - 'nem de reler o que publicava; achava a voz grave demais e os textos longos demais -> nem de se imaginar lido por estranhos; achava a voz grave demais e os próprios textos longos demais para a internet'
  - 'Ela apontou duas dos concorrentes como dele. -> Ela apontou como dele duas das publicações dos concorrentes. (a concordância fica clara e some a palavra solitária "dele." na última linha da p016)'
  - 'Tabela 4.1: dentro do que o seu código permite responder em público -> dentro do que o código de ética da sua profissão permite responder em público (o leitor sem profissão regulamentada não sabe que código é esse)'
  - 'Rede, intro: Parta da transcrição do campo 02 e das marcas do campo 03; o esqueleto só pede que você as ponha em ordem. -> Parta do áudio inteiro, ouvido de novo, dos trinta segundos transcritos no campo 02 e das marcas do campo 03. O esqueleto só pede que você ponha tudo em ordem.'
  - 'Roteiro: Toda semana alguém me pergunta {a pergunta que você mais ouve}. Eu explico sempre do mesmo jeito, e vou explicar igual aqui. -> Vou explicar {o assunto} do jeito que eu explico {a um cliente | a um paciente} quando ele está na minha frente. Sem enfeite.'
diagramacao:
  - 'p012: cerca de 20% de branco no pé, depois de "Passou o resto da semana com a pergunta." O intertítulo "Como a história costuma acontecer" e o primeiro parágrafo da seção (5 linhas) descem juntos para a p013. A causa provável está em livro.css l.70: com "orphans: 3; widows: 3", um parágrafo de 5 linhas não pode quebrar em 3+2 e, preso ao h2 por break-after: avoid, desce inteiro. Com "orphans: 2; widows: 2", cabem o intertítulo e o parágrafo, e o problema some também nas duas páginas seguintes.'
  - 'p013: cerca de 13% de branco depois do box Conceito. O parágrafo "A agência do Otávio fez bem o trabalho…" (5 linhas) poderia começar ali. É a mesma causa (widows: 3).'
  - 'p017: cerca de 15% de branco sob a figura 4.2. O parágrafo "Nem tudo na produção de uma presença…" (4 linhas, cerca de 22 mm) caberia inteiro ali, mas desce com a tabela 4.1 para a p018. Pendência da r2. Não é o widows, porque 4 linhas cabem sem quebrar: verificar se a figura (figure.fig com o SVG do ciclo) reserva altura ou margem maior do que o desenho, ou se há regra de quebra no parágrafo que antecede a div.tabela.'
  - 'p020: o título da oficina ainda imprime "matéria–prima", com o hífen da Instrument Serif largo como meia-risca. Pendência desde a r1.'
  - 'p018: "Na semana em que suspendeu as publicações…" continua com recuo de primeira linha depois da tabela 4.1. A regra ".texto table + p { text-indent: 0 }" existe, mas o orquestrador embrulha legenda e tabela em <div class="tabela">, e o seletor não casa. Acrescentar ".texto .tabela + p" à regra de livro.css l.72-75. Pendência da r2.'
  - 'p015 e p017: as notas das figuras em Inter cinza, com cerca de 7,5 pt, continuam no limite para o leitor de 50 a 60 anos. Pendência dos caps. anteriores.'
  - 'p016: "dele." fica sozinha na última linha do parágrafo do teste com a mulher. A edição de linha proposta resolve.'
  - 'Resolvidos desde a r2: "SEGUNDA-FEIRA" na abertura em versalete (p012) sem espaço depois do hífen, "pro-/duto." (p014) e o cabeçalho do roteiro, agora "PARA DIZER EM VOZ ALTA" (p024), coerente com a nota. Aceitos pelo projeto: p019 (Para guardar sozinho antes da oficina, que abre página), p022 (branco antes do esqueleto indivisível) e p025 (fechamento). Extensão: p011 a p025, 15 páginas, dentro do alvo.'
veredito: "Capítulo aprovado no limite. O bloqueador da r2 foi bem resolvido, e cena, argumento e caderno estão em nível de editora. O que resta é de linha e de caderno: a alternativa do campo 04 pede sinais que não se observam no perfil alheio, cinco generalizações passam do teto de duas, a rede manda partir de uma transcrição de trinta segundos, e três brancos de página vêm de widows: 3."
