bloqueadores: []
pontos_fortes:
  - 'Os pedidos da r3 foram quase todos atendidos. A tabela 13.1 agora ensina o método de fato: a linha Isolado carrega os identificadores ("A paciente sente um aperto no domingo às seis, quando a mãe passa as camisas e o cheiro do ferro atravessa a porta"), a linha Despersonalizado os retira, e a prosa diz isso com todas as letras ("Isolar é isso [...] e ainda com tudo o que a pessoa trouxe"). A tabela entra depois da quarta operação, como síntese. A folha dos identificadores fica "no caderno de sessão, trancado na gaveta", e isso dá verdade à imagem final. O esqueleto passou a ser "Passe a limpo", com 2 linhas por parte, e o campo 06 já traz a mesma ordem.'
  - 'A seção "A espera" é o melhor ensino ético do livro até aqui, porque mostra a regra em vez de só enunciá-la: "ela se reconheceria não pelos detalhes, que tinham saído, mas pela data. A regra do deslocamento vale também para o calendário." A segunda paciente de junho reinicia a contagem, e isso é um detalhe de ofício que o leitor de saúde reconhece como verdadeiro.'
  - 'As réguas são memoráveis e dá para repeti-las a outra pessoa: "A frase mais bonita da sessão é, em geral, a que mais identifica. Ela é bonita porque é particular, e é particular porque é da pessoa" e o teste do horóscopo ("se o padrão caberia num horóscopo, está grande demais; se só faz sentido para quem estava na sala, está pequeno demais"). O parágrafo da autorização ("a autorização dada nessas condições pode não ser tão livre quanto parece") continua sendo o trecho mais adulto do capítulo.'
  - 'A oficina é executável no papel. A grade "Tirei / Não havia", com sete linhas, transforma o sigilo numa conferência objetiva, e o checklist remete a campos numerados que existem.'
problemas:
  - criterio: metodo
    trecho: 'Desloque também a data da publicação: nunca na semana do atendimento, nem na semana de qualquer atendimento recente sobre o mesmo assunto.'
    por_que: 'A regra operacional mais importante do capítulo aparece com três medidas diferentes, contra a lição cap03-r1. A prosa e o roteiro_nota ("nunca publicado na semana do atendimento") põem o limite em uma semana. A cena mostra outra coisa: a Lúcia considera que publicar "cinco dias depois seria um recado" e espera "mais quatro semanas" depois do atendimento de junho. A oficina e a rede falam em "a data em que pode sair" e não dizem como calculá-la. Um leitor que siga a regra escrita publica oito dias depois da sessão, e a própria cena mostra que isso também seria um recado. "Nem na semana de qualquer atendimento recente" ainda é ambíguo: de que semana se trata, e o que conta como recente?'
    correcao: 'Fixe uma única medida, a da cena, e repita-a com as mesmas palavras na prosa, no critério 4 da oficina, na intro da rede e no roteiro_nota. Por exemplo: "Desloque também a data da publicação: nunca antes de um mês depois do último atendimento em que o assunto apareceu." Roteiro_nota: "[...] e nunca publicado antes de um mês do último atendimento sobre o assunto."'
  - criterio: concretude
    trecho: '“Antes de esperar pelo ano que vem, observe se ele entende o que você pede sem gesto.”'
    por_que: 'Esta é a regra que a pediatra do exemplo entrega aos pais, e ela sugere a conduta errada. Na forma em que está, dá a entender que, se a criança entende o que se pede sem gesto, dá para esperar mais um ano. Uma criança de quatro anos que fala pouco precisa de avaliação mesmo que a compreensão esteja boa. A compreensão separa tipos de atraso, mas não autoriza a espera. É justamente o padrão do campo 04 ("esperam a escola para agir") que o critério deveria desfazer, e ele o reforça. A lição cap09-r1 manda conferir o fato de ofício como um especialista da área conferiria. Além disso, o critério não entrega a régua inteira (cap02-r2): diz o que observar, mas não o que fazer com o que se observou.'
    correcao: '“Aos quatro anos, falar pouco não é preguiça: marque a avaliação sem esperar a escola, e conte na consulta se ele entende o que você pede sem gesto.”'
  - criterio: coerencia
    trecho: 'Contadores, consultores, arquitetos e corretores também trabalham com informações que o cliente não autorizou a divulgar, mesmo quando nenhuma lei fala em sigilo.'
    por_que: 'A mesma seção abre com os contadores na lista de quem "trabalha sob sigilo profissional: médicos, dentistas, psicólogos, advogados, contadores" e, três parágrafos depois, os põe no grupo em que "nenhuma lei fala em sigilo". O código de ética do contador trata de sigilo, e o de arquitetos (CAU) também tem regra sobre isso. A frase contradiz a abertura da seção e erra um fato de ofício num capítulo que manda o leitor ler o próprio código.'
    correcao: '"Consultores, arquitetos e corretores também lidam com informações que o cliente não autorizou a divulgar, tenha ou não a profissão uma regra escrita sobre sigilo."'
  - criterio: aplicabilidade
    trecho: 'O episódio não é desta semana, ou a folha ficou guardada com a data em que pode sair.'
    por_que: 'O critério cobra uma data que nenhum campo da oficina pede. O leitor chega ao "Confira antes de seguir" sem ter onde anotar a data e sem regra para calculá-la (ver o problema de método). A lição cap03-r3 diz que o critério precisa ser verificável no papel no momento em que a oficina termina, e a lição cap01-r1 pede um campo correspondente a cada item cobrado.'
    correcao: 'Acrescente ao fim do campo 06, ou como campo 07 de uma linha: "Data do atendimento: ____  Pode sair a partir de: ____ (um mês depois do último atendimento sobre o assunto)". O critério 4 passa a ser: "Anotei no campo 07 a data a partir da qual a peça pode sair."'
  - criterio: concretude
    trecho: 'nos processos que ele vê, ela existe, mas tem data posterior à falta, e o juiz percebe.'
    por_que: 'Toda advertência tem data posterior à falta, porque é assim que ela funciona. A frase que a r3 sugeriu continua tautológica, e o padrão jurídico, que é bom, fica ilegível para o leitor advogado. O próprio livro já tem a formulação precisa no cap. 28: advertências "escritas na véspera da audiência", "todas escritas na mesma tarde", com "a mesma caneta e a mesma letra". O cap. 13 planta esse fio e deveria plantá-lo com o mesmo detalhe.'
    correcao: '"...sobre a advertência escrita às pressas, depois que o problema estourou: nos processos que ele vê, as advertências existem, mas foram todas escritas na mesma tarde, meses depois das faltas que registram, e o juiz percebe."'
  - criterio: voz
    trecho: 'Não é ficção: nenhum dos elementos foi inventado. É agregação.'
    por_que: 'A seção "A linha que não se cruza" acumula quatro antíteses em cinco parágrafos: "O sigilo fecha um atalho [...] A tradução continua aberta", "Não é ficção [...] É agregação", "Quem a corta não empobrece o texto:" e "O sigilo não é assunto só da saúde." A lição cap01-r1 permite uma antítese explícita por seção. Somadas, elas dão ao trecho mais normativo do capítulo o tom de palestra.'
    correcao: 'Mantenha "Não é ficção [...] É agregação", que vem da fonte e é o conceito. Troque as outras: "O sigilo fecha um único atalho, o de publicar o caso como ele aconteceu, com o nome trocado e mais nada." / "Cortá-la custa ao texto uma imagem e poupa a paciente: [...]" (ver clareza) / "Fora da saúde, o problema é o mesmo. Otávio, no capítulo 4, [...]".'
  - criterio: clareza
    trecho: 'Quem a corta não empobrece o texto: a paciente que o lesse se reconheceria no domingo, como milhares de outras pessoas, mas não se veria exposta.'
    por_que: 'Os dois-pontos prometem mostrar por que o texto não empobrece, mas o que vem depois explica por que a paciente não fica exposta. São duas ideias costuradas como se uma fosse a prova da outra. Além disso, o texto empobrece, sim: perde a melhor imagem. Negar isso enfraquece a regra.'
    correcao: '"Cortá-la custa ao texto a melhor imagem e poupa a paciente: se o lesse, ela se reconheceria no domingo, como qualquer pessoa, mas não se veria exposta."'
  - criterio: originalidade
    trecho: 'Uma pediatra: “Uma mãe me disse que esperou a escola pedir avaliação, porque achava que o filho de quatro anos era só preguiçoso para falar.”'
    por_que: 'A r3 apontou que o exemplo repetia a fonoaudióloga do cap. 10 ("Escola que manda a criança para avaliação só em novembro"). A profissão mudou, mas a imagem continua a mesma: atraso de fala, escola e espera pela avaliação, três capítulos depois (lição cap02-r1). O leitor que lê em sequência reconhece o mesmo caso com outro jaleco.'
    correcao: 'Troque o episódio, mantendo a cadeia de quatro operações. Uma sugestão com a mesma pediatra: campo 01 "Uma mãe me disse que dá antitérmico ao filho sempre que o termômetro marca 37,5, até de madrugada, acordando a criança."; campo 03 "Há alguns anos, uma mãe me contou que acordava o filho de madrugada para dar antitérmico."; campo 04 "Pais tratam o número do termômetro, e não a criança."; campo 05 "Se ele está dormindo bem e respirando tranquilo, a febre pode esperar a manhã; o que não espera é criança prostrada, que não bebe nada ou respira com esforço." (Confira as faixas com uma pediatra antes de fixar o texto.)'
  - criterio: honestidade
    trecho: 'O padrão da Lúcia tem esse tamanho: o aperto do domingo é maior em quem descansou bem no sábado.'
    por_que: 'Na cena, o achado vem com cautela: "o aperto costuma ser maior em quem descansou bem no sábado". Na tabela ("O aperto é maior em quem descansou bem") e nesta frase, ele vira lei. Uma comparação ("maior em quem...") tirada de três casos compostos é observação clínica, não dado. O capítulo que ensina a generalizar no tamanho certo não deveria, no próprio exemplo, subir um degrau de certeza sem avisar. O leitor de saúde copia a forma.'
    correcao: 'Na prosa: "O padrão da Lúcia tem esse tamanho: nos casos que ela acompanha, o aperto do domingo é maior em quem descansou bem no sábado." Na tabela: "O aperto costuma ser maior em quem descansou bem no sábado: é a perda do descanso chegando antes".'
  - criterio: ritmo
    trecho: 'Lúcia tem dois cadernos, e nunca os mistura.'
    por_que: 'Há "nunca" doze vezes na prosa, quatro delas nas primeiras sete frases do terceiro e do quarto parágrafos: "nunca os mistura", "nunca um episódio", "nunca o que ele vivia", "nunca tinha publicado". Mais adiante vêm "Lúcia nunca pede", "nunca na semana" e "nunca vai conhecer". Lido em voz alta, o capítulo soa categórico por repetição, e a palavra perde força justamente onde precisa dela (a regra do sigilo).'
    correcao: 'Guarde "nunca" para as regras de sigilo e varie o resto: "Lúcia tem dois cadernos e não os mistura." / "sempre sem nome e sem episódio." / "o que atravessava era a crença que o paciente trazia de fora, e não o que ele vivia dentro da sala." / "E era, ao mesmo tempo, o tipo de coisa que ela ainda não tinha publicado".'
  - criterio: coerencia
    trecho: 'Cortou o ferro, a mãe e a porta. Ficou com o domingo, a tarde e o aperto'
    por_que: 'Aviso a jusante, sem efeito na nota deste capítulo. O cap. 15 chama a peça de "o domingo das seis da tarde", e esse é justamente o horário exato que o cap. 13 manda cortar ("Tirou horário exato"). Assim o livro volta a expor o identificador que ensinou a apagar.'
    correcao: 'No cap. 15: "e o texto do domingo à tarde é, no fundo, um caso-prova sobre ansiedade antecipatória."'
edicoes_de_linha:
  - 'quando a luz da sala mudava -> quando a luz da casa mudava (logo adiante, "a língua da sala" é o consultório; as duas salas se confundem)'
  - 'e passou o resto da tarde com ela na cabeça -> e passou o resto do dia com ela na cabeça (a sessão das cinco termina perto das seis; da tarde, sobra pouco)'
  - 'Ficou com o domingo, a tarde e o aperto, que são de milhares de pessoas. -> Ficou com o domingo, a tarde e o aperto, que não pertencem a ninguém. ("milhares de pessoas" volta na p. 17 e no gabarito)'
  - 'As peças que partiam de uma crença anotada no caderno, trazida por algum paciente, tinham caído para menos de uma hora desde março. -> Desde março, as peças que partiam de uma crença anotada no caderno, trazida por algum paciente, levavam menos de uma hora.'
  - 'Numa semana em que nem a amiga nem a lista trouxeram nada -> Numa semana em que nem a amiga nem o caderno trouxeram nada (o terceiro parágrafo diz que o caderno de campo substituiu a lista)'
  - 'Lúcia guardou a resposta no caderno, sem nome -> Lúcia guardou a resposta no caderno de campo, sem nome (são dois cadernos, e a frase seguinte fala do outro)'
  - 'e é honesta, desde que dita como tal -> e é honesta desde que declarada'
diagramacao:
  - 'p. 15: cerca de 28% da página em branco no pé, porque a tabela 13.1 foi inteira para a p. 16. Não é um branco aceito pelo projeto (não antecede oficina nem esqueleto). Deixe a tabela quebrar entre linhas, repetindo o cabeçalho, ou reduza o respiro acima dela para que as três primeiras linhas caibam na p. 15.'
  - 'p. 13, figura 13.1: a barra "Criada do zero: 180 min, sem terminar" continua desenhada cheia, como medida fechada. Isso foi apontado na r2 e na r3 e não foi resolvido. Um traço tracejado ou aberto na ponta seria mais honesto.'
  - 'p. 23: o rótulo do esqueleto, em versal espacejada, ocupa duas linhas ("PASSE A LIMPO A PEÇA DO CAMPO 06, NESTA ORDEM, DEPOIS DE CONFERIR A LISTA DO CAMPO 02") e fica pesado. Encurte no manuscrito para "Passe a limpo a peça do campo 06, depois de conferir o campo 02".'
  - 'Brancos aceitos pelo projeto: p. 19 (cerca de 55%, antes da oficina), p. 20 (cerca de 15%, porque o campo 03 é indivisível) e p. 22 (cerca de 20%, antes do esqueleto indivisível).'
veredito: 'O capítulo resolveu tudo o que a r3 pedia e está a uma passada de linha de aprovado; antes disso, precisa de uma única regra de calendário, igual em todos os lugares e com um campo para a data, de um critério pediátrico que não autorize a espera e da correção dos contadores "sem lei de sigilo".'
