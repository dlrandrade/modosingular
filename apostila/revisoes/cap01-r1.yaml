capitulo: 1
iteracao: 1
notas: {metodo: 8.3, voz: 8.3, originalidade: 8.4, clareza: 8.9, ritmo: 8.6, concretude: 8.7,
        coerencia: 8.2, aplicabilidade: 8.2, impresso: 7.5, honestidade: 8.5}
bloqueadores:
  - 'Regra de ouro violada no roteiro de fala (bloco rede). A intro promete que a peça é "sobre a sua área, nunca sobre presença digital", e o roteiro faz o leitor falar ao próprio público sobre a própria presença na internet e sobre começar a produzir conteúdo: "Tem uma coisa que quem trabalha comigo sabe e quem me encontra na internet não faz ideia." / "Então vou começar a falar." / "Nas próximas semanas eu explico o que quase ninguém explica." É exatamente o que o briefing proíbe ("Nenhuma oficina pode levar o leitor a falar de marketing, redes sociais ou produção de conteúdo para o público dele"), e contradiz a frase da própria página 19. O roteiro precisa ser reescrito sobre o problema da área do leitor.'
pontos_fortes:
  - 'A cena de abertura é de livro, não de curso: a pergunta de ofício ("e de manhã, como é?"), o encaminhamento ao reumatologista e o fecho "Renata riu na hora. À noite, em casa, a frase voltou, e ela já não achou graça." O conceito nasce do caso, como a bíblia pede.'
  - 'A seção "Por que os melhores costumam ter a distância maior" é contribuição própria, não está no PWA, e é o trecho mais memorável do capítulo (competência que vira reflexo, sinais que só aparecem ao vivo, escrúpulo). Prende o leitor exigente exatamente onde ele desconfiaria.'
  - 'A observação de que a presença digital age até sobre quem chega indicado ("é nesse intervalo, entre o nome recebido e a primeira mensagem, que a indicação se confirma ou perde força") dá à tese um argumento que o PWA não tinha e desarma a objeção "eu vivo de indicação".'
  - 'A regra de ouro está dita em prosa, com clareza e sem sermão: "Ninguém precisa ouvir você falar de presença digital. As pessoas precisam ouvir você falar do problema que você resolve." Lint limpo, ritmo de frase variado (média 15,9, desvio 10) e zero clichês da lista proibida.'
problemas:
  - criterio: metodo
    trecho: "Tem uma coisa que quem trabalha comigo sabe e quem me encontra na internet não faz ideia. […] Então vou começar a falar. […] Nas próximas semanas eu explico o que quase ninguém explica."
    por_que: 'Bloqueador (regra de ouro, ver acima). Além disso, o roteiro não tem relação com o esqueleto logo acima (cena, tensão, critério, frase que fica): o leitor rascunha uma peça de caso e recebe um roteiro de anúncio de estreia, que é a peça mais genérica da internet ("vou começar a falar") e, em profissões de saúde e psicologia, soa como promessa ("quem tem esse problema continua achando que não tem solução").'
    correcao: 'Reescrever o roteiro como a versão falada do esqueleto, 100% sobre a área: "Na semana passada, {cena: quem, onde, o que disse}. Quase todo mundo acha que {o problema aparente}. O que eu vi foi {o que você viu}. Quando isso aparece, eu {a sua régua: o que você pergunta, recusa ou verifica primeiro}. {A frase que fica.}" Tirar qualquer menção a internet, perfil, publicar ou "próximas semanas". Manter a nota sobre código de ética.'
  - criterio: voz
    trecho: "Ele chama isso de experiência, e não de conhecimento"
    por_que: 'O texto trocou o "não é X. É Y" (que o lint conta) pela forma ", e não Y", que o lint não conta. São 11 ocorrências no capítulo ("e não o contrário", "e não de conhecimento", "e não só um serviço", "e não antes dela", "e não em como gostaria", "e não de volume", "e não adjetivos", "e não com quem lê", "e não reconhecimento", "e não com uma resposta pronta", "e não de métrica"), além de antíteses disfarçadas: "Ela não tem nada contra o rapaz. Tem contra o fato de que…", "A assimetria tem pouco a ver com marketing […]. Ela é um problema de…", "Explicação e estratégia são coisas diferentes: a primeira… a segunda…", "A diferença entre as duas colunas é a diferença entre fabricar… e revelar…". É o mesmo tique com outra roupa; em 30 capítulos, vira assinatura. Para o piloto, isso é o problema de voz que mais escala.'
    correcao: 'Cortar pelo menos 7 das 11 ocorrências de ", e não", reescrevendo em afirmação simples (ex.: "Ele chama isso de experiência, e não de conhecimento" -> "Para ele, isso é só experiência"; "A conversa começa depois da objeção, e não antes dela" -> "A conversa começa com a objeção já vencida"; "O trabalho aqui é de singularidade, e não de volume" -> "Publicar mais não resolve; o trabalho aqui é de singularidade"). Manter no máximo uma antítese explícita por seção. Recomendação ao orquestrador: acrescentar ao lint a contagem de ", e não" e de "não X. Tem/É Y" com limite por capítulo.'
  - criterio: coerencia
    trecho: "Pessoas menos capacitadas, pessoas que falam errado, pessoas que não têm a autoridade, pessoas que não têm a vivência, acabam por roubar a parcela de mercado que seria delas."
    por_que: 'Três problemas. (1) Sem contexto, "delas" remete gramaticalmente a "pessoas menos capacitadas", e a frase diz o contrário do que se quer. (2) "Roubar" e "falam errado" (preconceito linguístico) contradizem a contenção que o próprio capítulo acabou de construir ("Ela não tem nada contra o rapaz") e a regra da página 19 ("Não acuse o público", "Atacar colegas… por indireta reconhecível"). (3) Destoa da voz de "mentor sênior que não precisa levantar a voz": dá ao leitor licença para o ressentimento que o livro, mais adiante, vai pedir que ele não publique.'
    correcao: 'Ou cortar a citação (a cena da cardiologista já faz o trabalho, e melhor), ou mantê-la com uma frase de enquadramento que a trate como o sentimento a ser reconhecido, e não como tese: "É assim que muita gente competente descreve o incômodo, com mais raiva do que gostaria de admitir:" e, depois da citação, uma frase que desloque a raiva para a ação ("A raiva é compreensível. O problema é que ela não publica nada."). Se mantiver, conferir no dossiê se a palavra final é mesmo "delas" e, se for, trocar o recorte para evitar a ambiguidade.'
  - criterio: aplicabilidade
    trecho: "Estimei quanto do meu movimento depende de indicação"
    por_que: 'O checklist dá 2 pontos (1/4 do total) por uma estimativa que o capítulo nunca pede no papel. A oficina não tem campo para isso, e o item do autodiagnóstico ("A maior parte dos meus clientes chega por indicação") é só concordo/discordo. Renata faz a conta na prosa ("de cada cinco pacientes novos, quatro chegavam por indicação de dois ortopedistas"), mas o leitor não tem onde fazer a dele. Um leitor honesto não consegue marcar o item.'
    correcao: 'Acrescentar à oficina, antes do campo 04, um campo curto: "A conta da Renata, feita por você: dos últimos dez clientes novos, quantos chegaram indicados? Por quem? (nomes ou iniciais)" com 3 linhas e exemplo de outra profissão (ex.: uma nutricionista: "7 de 10; 5 deles pela mesma endocrinologista"). Ajustar a ajuda do checklist para remeter a esse campo.'
  - criterio: aplicabilidade
    trecho: "Quem só viu o meu perfil consegue perceber o meu nível de profundidade."
    por_que: 'Parte relevante do público-alvo não tem perfil ou não publica (é o caso da Lúcia, personagem do livro). Para esse leitor, os itens 2 e 5 não fazem sentido e não há instrução do que marcar; ele vai pular linhas e a soma quebra. Além disso, o item 1 ("me trata como referência") e o item 4 ("Já vi profissionais menos preparados…") pontuam a autoridade real e o mercado, não a presença; quem ainda tem pouca autoridade real cai em "Assimetria baixa" e lê "A sua presença já comunica boa parte de quem você é", uma conclusão falsa.'
    correcao: 'Acrescentar à instrução: "Se você não tem perfil ou quase não publica, pense no que aparece quando alguém digita o seu nome e a sua profissão numa busca. Se não aparece nada, marque o extremo da assimetria (5 nas linhas comuns; 1 na linha invertida)." Na faixa baixa, trocar a leitura por algo condicional: "Ou a sua presença já comunica boa parte de quem você é, ou a sua autoridade fora da tela ainda está em construção. Releia as linhas 1 e 2: é a diferença entre elas que importa."'
  - criterio: metodo
    trecho: "A indicação é proibida em algumas profissões."
    por_que: 'Um distrator de verificação precisa ser inequivocamente falso, e este é discutível para parte do público: a advocacia veda a captação de clientela, e os conselhos de saúde vedam remunerar ou ser remunerado por encaminhamento. Um advogado marca "c" e tem argumento. Além disso, o gabarito é previsível: as três primeiras respostas corretas são "b", e nas questões 1 a 3 a correta é sempre a opção mais longa e mais técnica ("Porque a competência madura vira reflexo, os sinais dela só aparecem ao vivo e o escrúpulo freia a simplificação").'
    correcao: 'Trocar o distrator por um falso sem ambiguidade ("A indicação só funciona para quem já tem muitos seguidores."). Variar a posição das corretas (ex.: c, a, d, b) e igualar o comprimento das opções; na questão 3, encurtar a correta ("Porque o que eles sabem virou reflexo e só aparece ao vivo") e alongar os distratores.'
  - criterio: concretude
    trecho: "Pense numa cardiologista com vinte anos de pronto-socorro que abre o celular […] na semana seguinte, vai gastar metade de uma consulta desfazendo o que ele ensinou."
    por_que: 'Detalhe de ofício inconsistente: médico de pronto-socorro não tem "consulta na semana seguinte" com paciente próprio. Para leitores da saúde (público central), isso denuncia autor de fora. O mesmo vale, em grau menor, para "olhou como ele distribuía o peso entre as pernas" (um fisioterapeuta investigando dor lombar inflamatória testaria a mobilidade da lombar, não o apoio) e "acomodação do terreno" (engenheiro diz "recalque").'
    correcao: '"cardiologista com vinte anos de consultório"; "pediu que ele se curvasse para a frente e mediu, com a fita, quanto a lombar se abria"; "sabe, em segundos, se é recalque da fundação ou só retração do reboco".'
  - criterio: clareza
    trecho: "Se um deles se aposentasse, mudasse de cidade ou simplesmente esquecesse o nome dela por alguns meses, quase metade da agenda desapareceria"
    por_que: 'A conta não fecha: 4 de 5 pacientes NOVOS vêm de dois ortopedistas, então perder um deles corta cerca de 40% do fluxo de pacientes novos, não "metade da agenda" (a agenda inclui quem já está em tratamento). É a única conta do capítulo, feita por uma personagem que o livro apresenta como precisa; o leitor contador ou engenheiro vai notar.'
    correcao: '"quase metade dos pacientes novos deixaria de chegar, e em poucos meses a agenda sentiria, sem que ela tivesse feito nada de errado."'
  - criterio: ritmo
    trecho: "Três semanas depois daquela primeira consulta, Marcos voltou com o diagnóstico […] Se ainda não quiser publicar, guarde o rascunho. Ele vai servir mais adiante."
    por_que: 'O último parágrafo tem 9 frases e faz três trabalhos: fecha o arco do Marcos, pisca para capítulos futuros e lista as seções seguintes ("O autodiagnóstico mede…; a oficina dá nome…; a última parte transforma…"). O roteiro de seções é texto de curso e apaga o bom fecho de cena. O mesmo tom de apresentação aparece na lista de personagens ("Otávio, um advogado trabalhista do Recife que…; Lúcia, uma psicóloga…; e Caio, um arquiteto…"), que soa como trailer. Repetido 30 vezes, o fecho "as próximas páginas pedem uma caneta" vira fórmula.'
    correcao: 'Dividir em dois parágrafos. O primeiro fecha a cena e termina em consequência prática ("…Começaram a fisioterapia na mesma semana. Marcos só chegou até ali porque a mulher insistiu."). O segundo, curto, só: "Antes de qualquer técnica, meça a sua distância. As próximas páginas pedem uma caneta." Cortar a lista de seções (a diagramação já as anuncia). Na apresentação do elenco, dar a cada um uma imagem, não uma ficha (ex.: "um advogado do Recife que aprova todo mês quinze posts com o nome dele e não saberia defender metade").'
  - criterio: voz
    trecho: "Existe um paradoxo nessa história, e vale entendê-lo antes de seguir."
    por_que: 'Sinalização de texto de curso, repetida: "vale entendê-lo antes de seguir", "Antes de seguir, convém tirar da frente", "Por ora, vale olhar para onde esse caminho leva", "O nome importa menos do que a natureza do problema", "o que já é bastante". Cada uma sozinha é inocente; juntas, criam o narrador que anuncia em vez de dizer.'
    correcao: 'Cortar ou reduzir: "Há um paradoxo aqui: a assimetria tende a ser maior justamente em quem é muito bom no que faz, por três razões, e nenhuma é falta de jeito para a internet."; apagar "O nome importa menos do que a natureza do problema." e abrir o parágrafo em "A assimetria tem pouco a ver…"; apagar "o que já é bastante"; apagar "Por ora, vale olhar para onde esse caminho leva." (a figura se sustenta sozinha).'
  - criterio: honestidade
    trecho: "Quase todo mundo faz isso hoje."
    por_que: 'Afirmação empírica apresentada como fato, sem fonte, num livro que proíbe número e dado inventados. No mesmo espírito: "A sua distância real é medida no autodiagnóstico deste capítulo" (um questionário de 6 itens dá uma estimativa, não mede); "tudo o que você fizer daqui em diante vai gerar diferença perceptível" (promessa de resultado); "depois se sustenta com pouco esforço" (promessa de facilidade que o cap. 5 vai relativizar).'
    correcao: '"Você provavelmente faz o mesmo quando recebe o nome de um médico." / legenda: "Os tamanhos são ilustrativos. O autodiagnóstico deste capítulo dá uma estimativa da sua." / faixa alta: "…é o melhor lugar para começar: aqui, pequenas mudanças costumam aparecer rápido." / "mas depois pede menos esforço, porque cada peça sai de algo que você já faz".'
  - criterio: metodo
    trecho: "## Quando a distância começa a fechar"
    por_que: 'O capítulo tem 6 intertítulos (Duas Renatas; Por que os melhores…; A conta que ninguém faz; O incômodo que não cabe na planilha; O que este livro não vai pedir; Quando a distância começa a fechar), acima do limite de 3 a 5 da estrutura_do_capitulo. A prosa tem 1806 palavras, no piso da faixa (1800 a 2800), o que confirma que as páginas a mais vêm da diagramação, não do texto.'
    correcao: 'Fundir "O que este livro não vai pedir" com "Quando a distância começa a fechar" sob um só intertítulo (ex.: "O que muda, e o que não vai ser pedido") ou absorver "O incômodo que não cabe na planilha" no fim de "A conta que ninguém faz". Não cortar palavras para compensar.'
  - criterio: originalidade
    trecho: "A maior parte da sua autoridade está abaixo da linha d'água. O mercado decide pelo que consegue ver."
    por_que: 'O iceberg é a imagem mais gasta de apresentação corporativa; herdada do PWA, mas é a primeira coisa que o leitor vê. Contrasta com a força das imagens próprias do texto (as "duas Renatas", o intervalo entre o nome recebido e a primeira mensagem). Os exemplos da oficina também caem no previsível: o do fisioterapeuta repete a profissão da protagonista e a expressão da prosa ("deram por perdidas"), e soa como autoelogio.'
    correcao: 'Se a lista de ilustrações permitir, trocar por "espelho" ou "ponte" (as duas Renatas); se o iceberg ficar, dar à legenda uma formulação própria, ligada à cena: "Marcos viu a ponta. Quase foi embora." Na oficina, trocar o fisioterapeuta por outra profissão da lista de figurantes (ex.: uma fonoaudióloga: "…percebo, em dez minutos de brincadeira, se o atraso de fala é de linguagem ou de audição.").'
edicoes_de_linha:
  - 'Depois disso, ela passou a publicar em datas comemorativas e quando algum paciente pedia o contato. -> Depois disso, ela só publicava em datas comemorativas; no resto do tempo, o perfil servia para mandar o telefone a quem pedia.'
  - 'A presença digital, bem feita, muda a ordem dos acontecimentos. -> Bem feita, ela muda a ordem dos acontecimentos. (evita dois parágrafos seguidos abrindo com "A presença digital")'
  - 'por pelo menos três razões -> por três razões'
  - 'A indicação é o melhor canal que existe -> A indicação talvez seja o melhor canal que existe'
  - 'Talvez você já tenha percebido que também existe em duas versões. -> Talvez você já tenha percebido que também existe em duas versões, a da sala e a da tela.'
  - 'Pense numa cardiologista com vinte anos de pronto-socorro -> Pense numa cardiologista com vinte anos de consultório'
  - 'A distância que não aparece na agenda (título da fig. 1.1) -> manter; mas trocar a legenda "A sua distância real é medida no autodiagnóstico deste capítulo." -> "O autodiagnóstico deste capítulo dá uma estimativa da sua."'
  - 'Gabarito q3: o que falta a quem não o conhece -> o que falta a quem ainda não conhece esse profissional'
  - 'Roteiro (se mantido algum trecho): quem me encontra na internet não faz ideia -> [remover; ver bloqueador]'
  - 'Oficina, campo 01, exemplo: Um fisioterapeuta: “…resolvo dores que outros colegas deram por perdidas…” -> Uma fonoaudióloga: “…percebo, em dez minutos de brincadeira, se o atraso de fala é de linguagem ou de audição.”'
  - 'Os três pontos vão voltar ao longo do livro, porque cada um deles, tratado com método, vira matéria de trabalho. -> Os três vão voltar ao longo do livro, e cada um, tratado com método, vira matéria de trabalho.'
diagramacao:
  - 'p016: a faixa "23-30 Assimetria alta" ficou sozinha numa página ~90% em branco. O leitor soma na p015 e precisa virar a folha para ler o resultado mais provável do público-alvo. O autodiagnóstico inteiro (tabela, soma e três faixas) tem de caber numa página: reduzir a altura das linhas da tabela (~60px -> ~48px), apertar o espaço antes das faixas ou pôr as faixas em três colunas. Tratar como regra do template (vale para os caps. 5, 7 e 30).'
  - 'Espaço em branco sistemático por quebras forçadas de seção: p010 (~25% vazia, figura 1.1 empurrada), p011 (~15%), p012 (~12%), p013 (~12%), p014 (~60%, "Para guardar" sozinho), p018 (~45%), p020 (~35%), p022 (~55%). O capítulo ocupa 16 páginas (p007 a p022) contra o alvo de 10 a 14 com prosa no piso de palavras. Em 30 capítulos são ~60 a 90 páginas a mais, quase todas de branco. Permitir que figuras e boxes flutuem para depois do parágrafo seguinte (float/reordenação), e começar apenas a oficina em página nova; autodiagnóstico, rede e fechamento podem continuar na mesma página se couberem pelo menos o título e o primeiro bloco.'
  - 'p017-p018: as 6 linhas do campo 03 ("Três evidências reais") quebram 4 + 2; as duas linhas no topo da p018 ficam sem rótulo e o leitor não sabe a que campo pertencem. Aplicar break-inside: avoid ao conjunto rótulo+exemplo+linhas de cada campo (ou repetir o rótulo em versalete: "03 (continuação)").'
  - 'p019-p020: o esqueleto da peça quebra entre "A tensão" e "O critério"; o cabeçalho "ESQUELETO DA PEÇA — RASCUNHE AQUI" fica na p019 e duas das quatro partes na p020. Manter o esqueleto inteiro numa página. O espaço de escrita também é curto para escrever à mão: "A cena" tem efetivamente 1 linha útil e "A frase que fica" 1 linha. Subir para 3 / 3 / 4 / 2 linhas.'
  - 'p011, figura 1.1: em escala de cinza, o dourado da barra "Autoridade real" (luminância ~118) e o cinza da barra "Autoridade percebida" (~135) ficam quase iguais, e a hachura dourada fina sobre o bege (~235) some. Em impressão P&B, a área "a assimetria" vira quase só o contorno. Escurecer a hachura (traço mais grosso, cinza médio) e usar preto/cinza escuro na barra real, deixando o dourado como ênfase, conforme o princípio "o dourado é ênfase, nunca a única diferença".'
  - 'p011 e p013: as notas das figuras (Inter itálico, cinza claro, ~7-8 pt) estão no limite de legibilidade para o leitor de 50-60 anos em papel offset. Subir para 8,5 pt e escurecer o cinza.'
  - 'p008: hifenização de nomes próprios ("Re-/nata", "Mar-/cos") e p011 "pronto-so-/corro" quebrado fora do hífen. Proibir hifenização em nomes próprios (hyphens: manual nos nomes do elenco, ou lista de exceções) e, em palavra composta, quebrar só no hífen, repetindo-o na linha seguinte.'
  - 'p014: no bloco "Para guardar", o rótulo encosta no algarismo "1" (quase sem entrelinha entre o versalete e o numeral). Dar ~6 pt de respiro abaixo do rótulo.'
  - 'Medida do texto corrido: ~88 a 95 caracteres por linha (p008). Para um livro de exercício e um leitor de 30 a 60 anos, é longa. Considerar mancha um pouco mais estreita ou corpo maior (alvo de 70 a 80 caracteres).'
veredito: "Piloto promissor, com cena de abertura e argumento de nível editorial, mas ainda não aprovável: o roteiro da rede viola a regra de ouro, a voz troca um tique vigiado por outro não vigiado (', e não'), a oficina não pede o que o checklist pontua e a diagramação desperdiça páginas e quebra o autodiagnóstico; o padrão sustenta 30 capítulos só depois de corrigir o template e ampliar o lint."
