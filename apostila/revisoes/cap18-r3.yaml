pontos_fortes:
  - 'O problema central da r2 foi resolvido. A bifurcação ("há quem feche o que viu e deixe o aviso por conta do dono, e há quem abra antes de fechar"), a régua ("se ninguém que vai usar o espaço depois vai saber do problema que eu vi, eu abro antes de fechar, ou não faço a obra"), a recusa por escrito, o limite (a senhora que "pretendia informar o comprador de tudo") e a verificação 04 agora estão todos no mesmo eixo, o do aviso. O caso-modelo ensina a montar uma régua que responde à própria bifurcação.'
  - 'A cena de abertura tem ofício, custo material e o modo do Caio em ação. Os detalhes são certeiros: "isso era segurança, e ali não havia régua, havia norma"; "a infiltração abriu sozinha, no segundo verão, em cima da cama de casal"; a ata do sócio como "uma forma de dividir a culpa"; a caçamba vista "passando pela rodoviária". O fecho termina num gesto de obra e não num retorno comercial, como a r2 tinha pedido.'
  - 'A oficina está completa e coerente. A veterinária acompanha os quatro campos, inclusive o custo ("A limpeza agora custa o risco da anestesia; esperar custa dor e dente perdido."). O campo 02 pede a situação, e o roteiro abre com "Quando {a situação típica da sua área}", o que serve ao Caio, ao ortopedista, à veterinária e à Lúcia. A nota de saúde, psicologia e direito já não contradiz o "Depende de cada caso" condenado no texto.'
  - 'Há formulações próprias e memoráveis: "são a ausência dela dita com educação"; "os pontos em que você decide diferente de alguém que respeita são os pontos em que há critério"; "O investidor não se reconheceria na peça; quem estivesse pensando em fazer o mesmo, sim." O exemplo do ortopedista (lesão de desgaste acima dos quarenta, fisioterapia primeiro, exceção do joelho que trava) é tecnicamente correto.'
problemas:
  - criterio: aplicabilidade
    trecho: '{regra: "Publique o que você recusa.", porque: "A recusa é a régua mais fácil de ler: mostra o que você não faz, mesmo quando pagaria bem."}'
    por_que: 'A seção de rede manda publicar "a régua da oficina", e a nota diz "Uma régua por peça". Só que a oficina deixa o leitor escolher entre quatro tipos (entrada, escolha, parada, encaminhamento). Quem marcou "De escolha" ou "De parada" recebe na regra 3 a ordem de publicar outra coisa, uma recusa de trabalho. Para três dos quatro tipos, as regras se contradizem. A fonte tem a diretriz, mas ela pode ser formulada de modo a valer para qualquer tipo.'
    correcao: 'Regra 3: "Diga o que a sua régua faz você deixar de fazer." Porquê: "Toda régua tem um lado que você recusa, mesmo quando pagaria bem: o trabalho que não aceita, o caminho que não escolhe, o atendimento que não prolonga, o caso que manda para outro. É a parte mais fácil de ler." Fica a ideia da fonte, e a regra serve a qualquer peça que saia da oficina.'
  - criterio: coerencia
    trecho: 'O de Renata é de encaminhamento: quando a dor contraria o laudo, ela manda o paciente de volta ao médico antes de começar, mesmo que isso lhe custe o paciente; com Marcos, no capítulo 1, foi o reumatologista.'
    por_que: 'A régua geral agora é boa, mas o exemplo continua sendo o Marcos. No cap. 1, ele não foi mandado "de volta ao médico" por um laudo contrariado. Renata o mandou a um especialista novo porque a dor pior ao acordar e que melhora com o movimento é sinal clássico de lombalgia inflamatória, e isso é protocolo, que a r2 já tinha apontado. O próprio livro tem a ocorrência exata dessa régua no cap. 9: "o momento em que ela decidiu que um detalhe do supermercado valia mais que o laudo e pediu ao médico uma segunda olhada".'
    correcao: 'Troque o fim da frase: "…mesmo que isso lhe custe o paciente; com o ex-motorista do capítulo 9, um detalhe do supermercado valeu mais que o laudo de hérnia." Assim o exemplo cumpre a régua ao pé da letra e reforça o cap. 9 sem repetir cena.'
  - criterio: concretude
    trecho: 'O de Otávio é de escolha: quando a empresa tem o controle de ponto documentado, ele defende até a sentença; quando não tem, propõe acordo na primeira audiência, mesmo que o dono queira brigar.'
    por_que: 'O detalhe de ofício está incompleto para a clientela do Otávio, que são pequenas empresas. O controle de ponto só é obrigatório acima de vinte empregados (CLT, art. 74, § 2º). Abaixo disso, não ter ponto não inverte o ônus da prova da jornada, e "quando não tem, propõe acordo" deixa de ser uma condição verificável e razoável. Um advogado trabalhista notaria na hora. Além disso, a régua, do jeito que está, é o que quase qualquer colega faria. Falta o traço dele ("começa pela pior hipótese").'
    correcao: 'Algo como: "quando a jornada está documentada, ele defende até a sentença; quando a empresa era obrigada a ter o ponto e não tem, propõe acordo na primeira audiência, mesmo que o dono queira brigar, porque começa pela pior hipótese." Ou use o critério do cap. 9 (a testemunha que conta o episódio duas vezes com as mesmas palavras não vai à audiência), que já é dele e é de escolha.'
  - criterio: honestidade
    trecho: 'Quem chega concordando com a régua, por outro lado, aceita o prazo maior sem discussão, porque entendeu antes da primeira reunião por que ele existe.'
    por_que: 'Está afirmado como efeito certo, o que soa como promessa de resultado. E as generalizações sobre terceiros continuam acima do limite de duas: "quase nenhum cliente de arquiteto consegue fazer"; "Raramente repete a técnica"; "Quase ninguém publica a régua de parada"; "muitas vezes são os clientes que dariam problema depois"; "sempre no pior momento"; e, na figura, "A objeção mais comum".'
    correcao: '"Quem chega concordando com a régua já sabe, antes da primeira reunião, por que o prazo é maior." Fique com duas generalizações no máximo, por exemplo "Quase ninguém publica a régua de parada" (vem da fonte) e a do guardar. "Há uma coisa que quase nenhum cliente de arquiteto consegue fazer" -> "Há uma coisa que o cliente de um arquiteto não consegue fazer". "Raramente repete a técnica; não saberia." -> "Não repete a técnica; não saberia." "sempre no pior momento" -> "no pior momento". Na figura: "A objeção mais comum já foi respondida." -> "A objeção já foi respondida."'
  - criterio: coerencia
    trecho: 'A régua que você usa para escolher entre duas opções defensáveis.'
    por_que: 'A r2 pediu uma linha para distinguir o termo, e ela não entrou. No livro, "régua" já quer dizer outras coisas: no cap. 11 é o manual de voz ("a régua com que você revisa qualquer texto"); no cap. 12 é o enunciado de cinco perguntas (seção "A régua"); pelas lições do cap. 2 e pelo cap. 20, é o que o cliente leva da peça ("A régua que a pessoa leva"). Aqui "régua" aparece cerca de trinta vezes como sinônimo de critério de decisão. Quem lê o livro em sequência pode confundir os sentidos.'
    correcao: 'Acrescente uma frase à definição do conceito ou ao parágrafo seguinte: "Régua, neste capítulo, é a sua: a de quem decide. É diferente da régua que a peça entrega ao cliente e do enunciado do capítulo 12." Isso basta. A epígrafe da fonte justifica manter o termo.'
  - criterio: clareza
    trecho: 'A régua se publica sem quem a motivou. Caio não contou a história do investidor, nem o endereço do prédio, nem o número de apartamentos.'
    por_que: 'O texto descreve o que a peça não continha dois parágrafos antes de contar que ela foi feita ("Numa quinta de maio… publicou como um texto curto"). Quem lê recebe o cuidado sobre uma peça que ainda não existe na narrativa. Depois, "Caio contou a obra do cano" usa o artigo definido para uma obra que só é apresentada na frase seguinte.'
    correcao: 'Reordene: depois do parágrafo do investidor que "teria procurado outro escritório", venha o parágrafo "Numa quinta de maio…" ("Caio contou em voz alta ao sócio uma obra antiga, anotou o que tinha dito e publicou como um texto curto. Começou por uma obra em que tinha aberto uma parede…"). Em seguida, "A régua se publica sem quem a motivou…", depois o parágrafo da acusação e, por fim, o casal do Bosque.'
  - criterio: ritmo
    trecho: 'Os quatro personagens têm critérios dos quatro tipos, sem chamá-los assim. O de Caio, nesta semana, é de entrada. O de Otávio é de escolha:'
    por_que: 'É o parágrafo mais pesado do capítulo, com cerca de 140 palavras em quatro fichas seguidas e a mesma sintaxe ("O de X é de Y:"). Lido em voz alta, vira chamada de elenco, o que a lição do cap. 1 pede para evitar. Depois, "e é o mais raro dos quatro" é repetido na frase seguinte ("Quase ninguém publica a régua de parada").'
    correcao: 'Parta o parágrafo em dois: Caio e Otávio (entrada e escolha) num; Renata e Lúcia (encaminhamento e parada) no outro, que emenda com "Quase ninguém publica…". Varie a abertura das frases, por exemplo: "Otávio decide pela prova…", "Renata tem uma régua de encaminhamento…". Corte "e é o mais raro dos quatro".'
  - criterio: voz
    trecho: 'O outro cuidado é não transformar a régua em acusação.'
    por_que: 'Desde que "Há um cuidado a tomar" saiu (pedido da r2), o "outro" ficou sem o primeiro. A moldura "cuidado" continua sendo voz de curso que anuncia o que vem.'
    correcao: '"A régua também não se publica como acusação." Ou "Publicar a régua não é acusar quem usa outra."'
  - criterio: clareza
    trecho: 'Quando Caio explica por que recusa obras que escondem problemas, o leitor não precisa entender de impermeabilização para perceber que a decisão foi pensada.'
    por_que: 'O parágrafo fala do cliente ("Ele não tem repertório para isso"), e "o leitor" entra de repente sem dizer de qual texto: nesse ponto, Caio ainda não publicou nada. Parece o leitor deste livro.'
    correcao: '"…quem ouve não precisa entender de impermeabilização para perceber que a decisão foi pensada."'
  - criterio: originalidade
    trecho: 'O casal não pediu desconto nem prazo menor. Pediu que ele avisasse, antes de fechar qualquer parede, o que tinha encontrado.'
    por_que: 'O fecho já não gasta o retorno do cap. 25, mas o casal devolve a régua do Caio quase palavra por palavra, e isso fica arrumado demais, um laço de fita. Num casal que chegou por indicação e ainda não leu nada, o espelho perfeito soa como autor, não como cliente.'
    correcao: 'Deixe a consequência menos simétrica. Por exemplo, o marido pergunta quanto tempo leva abrir e se dá para morar lá enquanto isso, e Caio responde com a obra de sempre. Outra saída: termine no gesto do Caio ("disse que não sabia o que havia atrás dela"), sem a fala do casal.'
  - criterio: coerencia
    trecho: 'Uma veterinária: “Para cão idoso com tártaro e sopro leve, há a limpeza com anestesia agora e o controle em casa por mais seis meses.”'
    por_que: 'O exemplo é tecnicamente bom, mas a profissão está gasta nesta fase. O cap. 15 usa um veterinário com um cachorro no mesmo lugar (o exemplo comum e o singular), e o cap. 21 volta a usar veterinária nos exemplos da oficina. Em ESTADO.yaml, veterinária já aparece em 2, 10, 13, 15, 18 e 21.'
    correcao: 'Baixa prioridade. Se for mexer, escolha uma profissão pouco usada e distante (professora de piano ou mecânico de motos, por exemplo), com um fio de escolha igualmente limpo. Ou mantenha a veterinária e troque o figurante do cap. 21.'
edicoes_de_linha:
  - 'visitou com um casal, indicado por um cliente antigo, um apartamento de 1958 no Bosque -> foi ver com um casal, indicado por um cliente antigo, um apartamento de 1958 no Bosque (a regência de "visitou com… um apartamento" trava a leitura)'
  - 'O escritório que aceitou os três apartamentos trocou o quadro e a fiação, como Caio faria -> O escritório que aceitou os três apartamentos deve ter trocado o quadro e a fiação, que o investidor já tinha aceitado (Caio só viu a caçamba; não sabe o que foi feito)'
  - 'O de Lúcia é de parada, e é o mais raro dos quatro: -> O de Lúcia é de parada: (a frase seguinte já diz isso)'
  - 'Caio contou a obra do cano em voz alta ao sócio -> Caio contou em voz alta ao sócio uma obra antiga'
  - 'Só depois soube que ela pretendia informar o comprador de tudo -> Semanas depois, pelo corretor, soube que ela pretendia informar o comprador de tudo (diz como ele soube, lição cap03-r3)'
  - 'Nota da figura: "A objeção mais comum já foi respondida." -> "A objeção já foi respondida."'
diagramacao:
  - 'p17: a figura 18.1 continua com os dois defeitos da r2. O intervalo entre as faixas 3 e 4 é bem maior que entre 1-2 e 2-3, porque a nota da etapa 3 tem duas linhas. A faixa 1 está num bege mais escuro que 2 a 4, sem função, e em preto e branco compete com a 5. Fixar a altura das faixas, centralizar os rótulos em cada uma e uniformizar o tom de 1 a 4.'
  - 'p11: a epígrafe quebra e deixa "não." sozinho na segunda linha ("…A régua com que você decide, / não."). Justamente a virada da frase fica órfã. Usar text-wrap: balance na epígrafe ou um espaço inseparável em "decide,&nbsp;não".'
  - 'p14: na Tabela 18.1, "De encaminhamento" quebra em duas linhas na primeira coluna, e todas as outras células do tipo ficam em uma. Alargar a primeira coluna (cerca de 30%) à custa da terceira.'
  - 'p12: sobram cerca de quatro linhas em branco no pé da página depois de "contratou outro escritório.", porque o parágrafo seguinte foi inteiro para a p13. Com orphans/widows 2 ele se divide e o branco some. É menor.'
  - 'p18: metade da página em branco depois do Para guardar, antes da oficina em página nova. Aceito pelo projeto.'
  - 'p22-p24: um quarto da p22 em branco depois da verificação, dois terços da p23 depois do checklist, e a p24 em branco antes do apêndice em página ímpar. Aceito (fim de capítulo).'
veredito: 'O capítulo resolveu o que travava a r2 (régua e bifurcação no mesmo eixo, oficina completa, fecho sem retorno comercial) e está no nível de aprovação. Antes de fechar, precisa de uma passada curta na regra 3 da rede, no exemplo da Renata, na régua do Otávio, nas generalizações e na figura 18.1, que continua sem correção.'
