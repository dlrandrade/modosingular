capitulo: 4
iteracao: 1
notas: {metodo: 7.8, voz: 8.5, originalidade: 8.4, clareza: 8.5, ritmo: 8.6, concretude: 8.9,
        coerencia: 7.4, aplicabilidade: 8.2, impresso: 6.5, honestidade: 8.7}
bloqueadores:
  - 'Contradição com o método e com o arco do personagem. A figura 4.2 diz, no primeiro nó, "Você descobre a sua linguagem — As fases II e III deste livro. Não delegável.", e o capítulo inteiro sustenta que delegar antes de descobrir é o erro. Mas o protagonista, ainda na Fase I, faz exatamente isso, e o texto o apresenta como modelo: "Otávio explicou que não queria mais receber pautas prontas; ia mandar, toda semana, dois ou três áudios curtos sobre o que tinha acontecido no escritório, e a agência trabalharia a partir deles." A frase seguinte tenta remendar ("Os detalhes desse novo arranjo voltam no capítulo 24, quando ele estiver pronto para delegar de verdade") e só confirma o problema: se ele ainda não está pronto, o arranjo descrito como "algo mais útil" é a terceirização prematura com áudio no lugar de briefing. Há também colisão com o plano: o cap. 24 é "Otávio volta à agência — agora com áudios, um manual de voz e a última frase guardada para ele" (não há volta se ele nunca saiu, e os áudios já foram gastos aqui) e o cap. 6, já rascunhado, mostra Otávio sem nenhuma ideia para mandar à agência e recebendo o "calendário sugerido pela agência", o que desmente o compromisso semanal firmado no cap. 4. Correção: no cap. 4, Otávio suspende as publicações e grava o áudio para si, não para a agência; a conversa com a redatora e o arranjo "áudios em vez de pautas" saem daqui e ficam para o cap. 24 (ver problema de coerência).'
pontos_fortes:
  - 'A abertura é de editora: um ritual exato e banal ("Toda primeira segunda-feira do mês, às sete e quarenta", "responde com a mesma palavra de sempre: aprovado. Faz isso há três anos. Leva, em média, doze minutos.") quebrado por um comentário de uma dona de lavanderias de Olinda. O modo do Otávio aparece já na primeira cena, como pede a lição da r2: "Escreveu à mão, antes de digitar, como faz com tudo o que importa", e a frase "o que na prática significava discordar de si mesmo em público" é das melhores do livro até aqui.'
  - 'A seção "Por que gente competente terceiriza cedo" é contribuição própria, que o PWA não tinha, e desarma a objeção do leitor-alvo: a lógica de delegar a contabilidade e a limpeza aplicada à comunicação, e o ponto em que ela falha ("Entregar isso a outra pessoa equivale a delegar o próprio produto"). O fator emocional ("As publicações da agência não davam vergonha a Otávio. Também não davam orgulho.") é observado com precisão e sem psicologismo.'
  - 'Detalhes de ofício jurídico verossímeis para um advogado leitor: "o que acontece se o funcionário sair amanhã, que papel vai faltar, qual testemunha vai contradizer o que está escrito" e a última frase do áudio, "o papel que você assinou não vai te salvar se o ponto disser outra coisa", traduzem com exatidão a primazia da realidade no processo do trabalho. O cliente de Caruaru "com o nome trocado" planta o sigilo sem sermão.'
  - 'Boa ampliação do conceito para quem não contrata ninguém ("Um personal trainer que copia as frases de efeito de um colega com milhões de seguidores está tão terceirizado quanto Otávio, só que sem pagar mensalidade"), que prepara o cap. 22 da Lúcia e vira a pergunta 4 da verificação.'
  - 'Lint limpo (0 "não é/é", 0 frase-soco, 0 ", e não" na prosa, 0 sinalização; frase média 16,2, desvio 8,5). Verificação com corretas em posições variadas (b, d, a, c), opções de comprimento parecido e distratores inequivocamente falsos. Todo item do checklist tem campo correspondente na oficina. O roteiro de fala é 100% sobre a área do leitor e a rede lembra que a regra vale também para ferramentas de IA, amarrando o Apêndice C.'
problemas:
  - criterio: coerencia
    trecho: "Otávio explicou que não queria mais receber pautas prontas; ia mandar, toda semana, dois ou três áudios curtos sobre o que tinha acontecido no escritório, e a agência trabalharia a partir deles."
    por_que: 'Bloqueador (ver acima). Além de contradizer a figura 4.2, antecipa a resolução do arco (F4: "volta à agência na ordem certa"; cap. 24) no quarto dia de um livro de trinta, e colide com o cap. 6 ("Otávio pensou que precisava enviar à agência alguma ideia para o mês seguinte e concluiu que não tinha nenhuma"). A frase de remendo "Os detalhes desse novo arranjo voltam no capítulo 24, quando ele estiver pronto para delegar de verdade" é também narrador que anuncia (lição cap01-r1).'
    correcao: 'Reescrever o parágrafo da redatora: "Otávio não demitiu a agência. Pediu dois meses sem publicações, sem dar muitas explicações, e a agência aceitou com o alívio de quem também não sabia mais o que postar. Ele ainda não sabia o que queria no lugar daquilo; sabia só que não queria mais aprovar o que não diria." Cortar a redatora e a remissão ao cap. 24 (guardar a cena da redatora que "tinha a sensação de escrever para ninguém" para o cap. 24, onde ela rende). Manter o áudio como exercício do Otávio para si mesmo. Se o autor quiser manter a agência em cena no cap. 6, ajustar lá "o calendário sugerido pela agência" para a retomada depois dos dois meses.'
  - criterio: clareza
    trecho: "afirmava que o banco de horas é sempre vantajoso para o empregador"
    por_que: 'A tese do capítulo é que o texto terceirizado é "correto" e por isso anônimo ("É um trabalho honesto, e o resultado é correto. Correto é exatamente o problema."; "recebeu publicações bem diagramadas, gramaticalmente corretas e tecnicamente defensáveis"; "Nenhuma estava errada, e ele aprovava todas."). Mas a publicação que dispara a história é substancialmente enganosa (Otávio "pensava quase o contrário", "a publicação simplificou demais") e ele a aprovou mesmo conferindo "se não há nenhum erro de lei". O leitor apressado sai com a lição errada: "o problema é que a agência erra e eu reviso mal". O próprio texto se contradiz duas páginas depois.'
    correcao: 'Fazer a publicação correta e anônima, e o comentário expor o que ela não diz: "Uma das publicações do mês, uma arte azul com o título “Você sabia?”, explicava que o banco de horas permite compensar horas extras com folgas, sem pagá-las, desde que haja acordo. Estava certo. Embaixo, havia um comentário da dona de uma pequena rede de lavanderias de Olinda: “Eu tinha acordo e perdi uma ação trabalhista justamente por causa dele. O que vocês não contam?”". Otávio então percebe que a publicação está certa e não é dele: ele teria começado pela pior hipótese. Assim "Nenhuma estava errada" passa a ser verdade e reforça a tese.'
  - criterio: coerencia
    trecho: "e ela diz mais sobre o jeito dele de advogar do que as cento e poucas publicações somadas."
    por_que: 'A conta não fecha (lição cap01-r1: contas de personagens têm de fechar). O capítulo abre com "São quinze publicações" por mês e "Faz isso há três anos": são cerca de quinhentas e quarenta publicações, não "cento e poucas". Um leitor atento faz a conta na hora, e ela está na p015, a duas páginas da primeira.'
    correcao: '"…do que as quinhentas e tantas publicações somadas." (ou "do que três anos de publicações somados").'
  - criterio: coerencia
    trecho: "Era a primeira vez que alguma coisa com o nome dele soava como ele."
    por_que: 'Contradiz a abertura: a resposta escrita à mão à dona da lavanderia já saiu com o nome dele e soou tanto como ele que Júlia perguntou "por que o perfil do escritório não falava assim". Há ainda uma tensão com o elenco: Otávio "pensa ESCREVENDO" (cap. 5 reforça: "Otávio, que escreve pareceres longos por gosto"), e o capítulo faz do áudio a sua grande revelação sem reconhecer que a voz dele apareceu primeiro na escrita.'
    correcao: '"Desde a resposta à dona da lavanderia, era a primeira vez que alguma coisa com o nome dele soava como ele. Com uma diferença: a resposta ele tinha escrito com cuidado, e o áudio saiu sem nenhum." Isso preserva a tarefa do PWA (áudio) e planta o modo dele para o cap. 7.'
  - criterio: coerencia
    trecho: 'A frase que repete a todo cliente novo, "contrato assinado não é prova de nada", nunca apareceu no perfil.'
    por_que: 'O plano reserva essa frase e "a explicação que repete há anos" para o cap. 16 ("O discurso do Otávio para todo cliente novo: ''contrato assinado não é prova de nada''", técnica "Transcrição pura"). O cap. 4 já usa a frase, já transcreve sem corrigir a explicação que ele dá a todo cliente novo e intitula a rede "A explicação que já é sua", quase o título do cap. 16. O cap. 6 repete a imagem pela terceira vez ("papel assinado vale pouco quando alguém em carne e osso conta outra história"). O cap. 16 corre o risco de chegar sem nada novo.'
    correcao: 'No cap. 4, trocar a frase-marca por outro indício do modo dele (ex.: "A pergunta que faz a todo cliente novo, “e se ele sair amanhã?”, nunca apareceu no perfil.") e fazer o áudio tratar de um tema que não seja a explicação-assinatura (ex.: o que fazer quando um funcionário pede para "acertar por fora"). Registrar no ESTADO que a frase "contrato assinado" é do cap. 16.'
  - criterio: coerencia
    trecho: "Numa terça-feira de março, a sócia mais nova do escritório, Júlia, entrou na sala dele"
    por_que: '"Júlia" e "Lúcia" diferem em uma letra e meia e dividem a mesma fase do livro; num livro em que Lúcia é protagonista, o leitor apressado confunde as duas (o cap. 6 já tem "Júlia, que acompanhou a experiência de perto"). Além disso, a abertura do cap. 2 também é "numa terça-feira à noite" e o cap. 6 é a terça-feira do Otávio: três terças em cinco capítulos.'
    correcao: 'Renomear a sócia com nome de som distante de Lúcia/Renata (ex.: "Beatriz", "Helena") e propagar para o cap. 6. Trocar "Numa terça-feira de março" por "Numa quinta-feira de março" (e "até aquela terça-feira" por "até aquela quinta-feira").'
  - criterio: concretude
    trecho: "Otávio fez o teste com Júlia, misturando publicações dele com as de dois escritórios concorrentes. Ela errou duas das três."
    por_que: 'Inverossímil e ambíguo. A sócia do escritório segue o perfil (foi ela quem viu o comentário) e reconheceria as publicações pelo feed; o teste só vale com quem conhece o trabalho e não o perfil, que é o que o próprio parágrafo recomenda ("um cliente antigo, alguém da família"). E "duas das três" não diz de quantas peças se trata, se ela errou as dele ou as dos outros.'
    correcao: '"Otávio fez o teste com a mulher, que conhece o jeito dele de falar há trinta anos e nunca abriu o perfil do escritório. Misturou três publicações dele com três de dois escritórios concorrentes. Ela apontou duas dos concorrentes como dele."'
  - criterio: concretude
    trecho: "e riu de uma expressão que usa há décadas sem nunca ter percebido"
    por_que: 'A cena termina retendo justamente o detalhe que a prova. O mesmo vale para "uma pergunta retórica que ele faz sempre", também sem nome. Num capítulo cuja tese é que o modo está no detalhe, o leitor quer ouvir a expressão; ela é o exemplo vivo do campo 03 da oficina ("O que você notou na sua própria fala?").'
    correcao: 'Nomear as duas: "…uma pergunta retórica que ele faz sempre (“e quem vai provar isso, o senhor?”)…" e "riu de um “veja bem” que ele diz antes de toda má notícia, há décadas, sem nunca ter percebido."'
  - criterio: concretude
    trecho: "Na maioria das pequenas empresas que eu atendo, ele é a primeira coisa que aparece numa condenação."
    por_que: 'Um advogado de empresas não diria em público que a maioria dos seus clientes é condenada; a frase soa como autodepreciação e fere a própria imagem que ele protege. "A primeira coisa que aparece numa condenação" também é imprecisa (o que aparece primeiro é o pedido de horas extras). E a frase anterior, "O banco de horas só protege quem controla o ponto com rigor, mês a mês, e guarda os comprovantes", omite o requisito que um advogado trabalhista citaria antes: o acordo por escrito (individual, para compensação em até seis meses, ou coletivo, até um ano; CLT, art. 59, §§ 2º e 5º). Não está errada, mas um leitor advogado sente falta.'
    correcao: '"A senhora tem razão, e a publicação simplificou demais. O banco de horas só protege quem tem o acordo por escrito, controla o ponto com rigor, mês a mês, e compensa as horas dentro do prazo. Nas ações contra pequenas empresas que chegam ao meu escritório, é quase sempre o primeiro pedido da lista."'
  - criterio: clareza
    trecho: "No caso do Otávio, a perda era mensurável."
    por_que: 'Nada é medido no parágrafo, que descreve uma perda qualitativa (cenários em vez de abstrações, uma frase que nunca apareceu). O adjetivo promete um número que não vem.'
    correcao: '"No caso do Otávio, dava para apontar o que se perdeu."'
  - criterio: metodo
    trecho: "Nem tudo na produção de uma presença tem o mesmo peso."
    por_que: 'A tabela 4.1 que vem em seguida não tem a etapa que a figura 4.2 e a regra 2 da rede declaram indelegável: a revisão ("Você revisa contra a sua voz"; "Revise com uma pergunta só: eu falaria assim?"). Nem a última frase ("Guarde para você a última frase"). O leitor que usa a tabela como gabarito do campo 05 delega a revisão sem perceber. "Diagramar e editar | Sim" é ambíguo: editar o texto (trocar palavras) contraria "Pedir que as suas expressões sejam preservadas".'
    correcao: 'Acrescentar a linha "| Revisar a versão final | Nunca | Só você sabe se falaria assim |" antes de "Agendar e publicar" e trocar "Diagramar e editar" por "Diagramar e editar o vídeo". O exemplo do campo 05 passa a dizer "as sete etapas".'
  - criterio: aplicabilidade
    trecho: 'rotulo: "Grave o áudio. Depois transcreva aqui o primeiro minuto, palavra por palavra."'
    por_que: 'Um minuto de fala tem de 130 a 160 palavras; à mão, na largura da p020, cabem de 9 a 11 palavras por linha. São 13 a 17 linhas, e o campo tem 10. O leitor que segue a instrução ("palavra por palavra") fica sem espaço no meio, justamente no campo que o critério de qualidade mais cobra. O tempo também aperta: transcrever um minuto à mão, pausando e voltando, leva 8 a 10 minutos; com gravação, marcas, auditoria e tabela, 25 minutos é o piso, não a média.'
    correcao: '"Grave o áudio. Depois transcreva aqui os primeiros trinta segundos, palavra por palavra." (mantém 10 linhas) e ajustar a entrega, a ajuda do checklist e a cena ("sem corrigir nada" continua valendo). Ou manter o minuto e dar 16 linhas, subindo o tempo para 30 minutos.'
  - criterio: aplicabilidade
    trecho: "A sua tabela: o que você faz hoje, o que delega e o que deveria voltar para as suas mãos?"
    por_que: 'O campo pede uma tabela de seis etapas por três colunas e oferece quatro linhas corridas (p021). No papel, o leitor não tem onde pôr as etapas nem as colunas; vai escrever uma frase genérica e marcar o item do checklist "Preenchi a minha tabela" sem ter preenchido tabela alguma.'
    correcao: 'Imprimir uma grade: as etapas da tabela 4.1 já escritas na primeira coluna e três colunas para marcar ("Faço", "Delego", "Deve voltar para mim"). Se o motor não tiver bloco de grade, reduzir o pedido: "Das etapas da tabela 4.1, quais você delega hoje e quais deveriam voltar para as suas mãos?".'
  - criterio: aplicabilidade
    trecho: "Com 7 pontos ou mais, siga para o capítulo 5."
    por_que: 'Com três itens de 3 pontos, os totais possíveis são 0, 3, 6 e 9: "7 ou mais" significa 9, ou seja, tudo ou nada, e a regra dos 70% vira 100% (lição cap01-r2: testar a pontuação). Quem nunca publicou e não imita ninguém não tem como cumprir o campo 04 ("Se você não publica, pense no que publicou por último ou no perfil que costuma imitar"): soma 6 e é mandado de volta à oficina, justamente o leitor-Lúcia.'
    correcao: 'Redistribuir: áudio e transcrição 4, tabela 3, auditoria 2 (total 9; 70% = 7 exige o áudio). No campo 04: "Se você nunca publicou, escreva qual dos quatro sinais mais aparece no perfil do colega que você mais admira, e por que você não quer repeti-lo."'
  - criterio: aplicabilidade
    trecho: "A peça deste capítulo é a explicação que você dá toda semana, sobre um tema da sua área, com as suas palavras."
    por_que: 'A rede não aproveita o que a oficina acabou de produzir. O leitor tem nas mãos um áudio de três minutos e a transcrição de um minuto, que são exatamente a explicação que o esqueleto pede, e a intro não diz isso; ele vai rascunhar do zero, como se a oficina não existisse.'
    correcao: '"A peça deste capítulo é a explicação que você gravou na oficina, organizada para quem ainda não conhece você. Parta da transcrição do campo 02 e das marcas do campo 03: o esqueleto só pede que você as ponha na ordem certa. As regras valem se alguém edita ou publica por você, e também se o “terceiro” é uma ferramenta de IA."'
  - criterio: voz
    trecho: "Uma começa pelos riscos jurídicos; a outra, pelo efeito sobre a equipe que fica. Uma fala como quem já viu dezenas de desligamentos desastrosos; a outra, como quem leu sobre eles."
    por_que: 'Duas antíteses "uma… a outra…" seguidas, a estrutura que a lição cap01-r1 manda limitar. A segunda ainda desloca o argumento: "quem viu" contra "quem leu" é diferença de experiência (repertório, cap. 9), não de modo de pensar, que é o que o parágrafo quer provar. O exemplo, além disso, é de demissão e riscos jurídicos, território do próprio Otávio; uma profissão distante ilustraria melhor que o fenômeno é geral.'
    correcao: '"Duas consultoras de recursos humanos podem responder à mesma pergunta sobre a demissão de um funcionário antigo com a mesma informação técnica, e as duas estarão certas. Uma começa pelos riscos jurídicos; a outra, pelo efeito sobre a equipe que fica. O que diferencia as duas é o modo de pensar o problema, e é essa parte que não passa por um briefing." (cortar a segunda antítese).'
  - criterio: voz
    trecho: "O que diferencia você é justamente a parte que não se transfere."
    por_que: '"Justamente" aparece seis vezes e "exatamente" quatro num texto de 1.800 palavras ("justamente do raciocínio", "é justamente essa parte", "é justamente a parte", "que é justamente o que a informação", "exatamente onde nenhum cliente", "Correto é exatamente o problema"…). Vira muleta de ênfase, e num capítulo sobre voz própria a muleta aparece.'
    correcao: 'Deixar no máximo um de cada. Ex.: "A terceirização prematura costuma nascer do raciocínio de um bom profissional."; "que é onde nenhum cliente presta atenção"; "O áudio transfere o modo, que a informação não carrega."; legenda da figura: "A agência entrega bem o que é transferível. O que diferencia você não passa por ela."'
  - criterio: originalidade
    trecho: "Otávio não demitiu a agência. Fez algo mais útil:"
    por_que: 'É a quarta vez em quatro capítulos que a virada final usa a mesma batida "personagem não fez o gesto óbvio; fez outra coisa": cap. 1 "Renata não resolveu nada naquela noite. Só guardou…"; cap. 2 "Lúcia não publicou nada naquela semana. Fez uma coisa mais útil:"; cap. 3 "Caio não vendeu a câmera."; aqui, com a mesma expressão do cap. 2. O prosa também termina, pela terceira vez, apontando para a oficina ("A oficina deste capítulo pede o mesmo áudio, sobre a sua área."; cap. 2 "A oficina deste capítulo pede exatamente esse movimento."; cap. 1 "As próximas páginas pedem uma caneta."). Em trinta capítulos, o leitor antecipa a frase.'
    correcao: 'Abrir a seção pela ação, sem a negação: "Otávio pediu à agência dois meses sem publicações." Fechar a prosa na consequência da cena, sem remeter à oficina (ex.: terminar em "…e riu de um “veja bem” que ele diz antes de toda má notícia, há décadas, sem nunca ter percebido."). Registrar na bíblia que a batida "não fez X; fez Y" está esgotada na Fase I.'
  - criterio: originalidade
    trecho: "A agência entrega bem tudo o que é transferível; o que diferencia você é justamente a parte que não se transfere."
    por_que: 'Dois dos três itens do "Para guardar" repetem quase palavra por palavra textos que o leitor acabou de ler: o item 1 é a legenda da figura 4.1 ("A agência entrega bem o que é transferível. O que diferencia você é justamente a parte que não se transfere.") e o item 2 é a nota de alerta ("Se você não consegue defender nos comentários o que foi publicado com o seu nome, aquela peça não é sua."). No papel, com as três peças a quatro páginas uma da outra, parece enchimento. O Apêndice C repete a mesma frase uma terceira vez.'
    correcao: 'Reescrever a legenda da figura e o corpo da nota para que o "Para guardar" seja a formulação final, não uma cópia. Legenda: "Os tamanhos são ilustrativos. A proporção mostra onde a agência é boa e onde ela não tem como ajudar." Nota: "Se alguém discorda nos comentários e você não sabe o que responder, a peça não saiu de você. E, se ela funcionar, vai atrair pessoas à procura de alguém que você não é."'
  - criterio: ritmo
    trecho: "O caminho que levou Otávio até aquela terça-feira é comum a ponto de parecer um roteiro."
    por_que: 'O parágrafo tem nove frases (teto da bíblia: seis), com três "Perguntaram…, e ele…" em sequência. O parágrafo final da prosa ("Na semana em que suspendeu as publicações…") tem sete. Ambos seriam mais fortes partidos.'
    correcao: 'Partir depois de "numa sala de vidro, com duas pessoas simpáticas e um questionário.": o segundo parágrafo começa em "Perguntaram qual era o público…" e termina em "e nada disso era ele." A frase "A partir do mês seguinte, recebeu publicações…" abre o parágrafo seguinte. No parágrafo final, cortar "A oficina deste capítulo pede o mesmo áudio, sobre a sua área." (ver originalidade).'
  - criterio: honestidade
    trecho: "ele chegou à conclusão que quase todo especialista nessa situação chega"
    por_que: 'Duas generalizações empíricas sem fonte em dois parágrafos ("a resposta que quase todo profissional liberal dá"; esta), a mesma família que a lição cap01-r1 mandou cortar. Há ainda um erro de regência (chegar a algo: "à conclusão a que… chega") e um furo de verossimilhança: se ele concluiu "depois de alguns meses" que não funcionava, por que continuou pagando por três anos?'
    correcao: '"a resposta que muito profissional liberal dá"; "Depois de alguns meses sem resultado que justificasse o investimento, chegou à conclusão mais comum nessa situação: rede social não funciona para advogado. Continuou pagando, porque cancelar também dava trabalho."'
  - criterio: honestidade
    trecho: "Dúvidas técnicas voltam para você; logística, não"
    por_que: 'Para advogados, o Código de Ética da OAB veda "responder com habitualidade a consulta sobre matéria jurídica nos meios de comunicação social" (CED, art. 42, I), e conselhos de saúde têm restrições parecidas para orientação individual em rede. A tabela, lida por um advogado, recomenda sem ressalva uma prática que a ordem dele restringe; o livro prometeu em "Antes de começar" que a regra da profissão vence.'
    correcao: '"Dúvidas técnicas voltam para você, dentro do que o seu código permite responder em público; logística, não."'
  - criterio: voz
    trecho: "O problema está na ordem, e não na agência."
    por_que: 'Antítese ", e não" no box Conceito, o lugar mais lido do capítulo (o lint só conta a prosa). A prosa já tem "A conclusão estava errada, porque aquele perfil nunca tinha sido realmente dele.", onde "realmente" é enchimento herdado do PWA.'
    correcao: 'Conceito, porque: "O problema está na ordem em que as coisas acontecem. Executar antes de descobrir produz um perfil que poderia pertencer a qualquer profissional do mesmo setor." Prosa: "A conclusão estava errada, porque aquele perfil nunca tinha sido dele."'
  - criterio: impresso
    trecho: "TODA PRIMEIRA CLASS=\"NQ\">SEGUNDA-FEIRA do mês"
    por_que: 'Na p012, a primeira linha do texto corrido imprime código HTML em versalete. O regex que monta a abertura em versalete (render_cap, span "abre") pega as três primeiras palavras depois que sem_hifen() já envolveu "segunda-feira" num span "nq", e corta a tag ao meio. É a primeira linha de prosa do capítulo; nenhuma gráfica aceita. O mesmo defeito vai aparecer em qualquer capítulo cujas três primeiras palavras tenham palavra composta ou nome do elenco.'
    correcao: 'No orquestrador: aplicar o span "abre" antes de sem_hifen(), ou fazer o regex da abertura pular tags ("(?:<[^>]+>|\S)+"). Não mexer no manuscrito para contornar.'
  - criterio: impresso
    trecho: "Você revisa contra a sua voz"
    por_que: 'Na figura 4.2 (p017), os rótulos laterais do ciclo saem da caixa e são cortados: à esquerda lê-se "ocê revisa contra a sua" e "u falaria assim? É a única"; à direita, "Áudio de três minutos, no" perde o "ta" de "nota". A nota do nó 1 ("Não delegável.") passa por cima do círculo 1 ("dele①gável"). É a figura que resume o método do capítulo.'
    correcao: 'Reservar margem lateral para os rótulos dos nós 2 e 4 (ou quebrar os rótulos em até 14 caracteres por linha) e deslocar a nota do nó 1 para cima do círculo, sem sobreposição. Ver diagramação.'
edicoes_de_linha:
  - 'ele chegou à conclusão que quase todo especialista nessa situação chega -> chegou à conclusão mais comum nessa situação (regência: "a conclusão a que se chega")'
  - 'as cento e poucas publicações somadas -> as quinhentas e tantas publicações somadas'
  - 'No caso do Otávio, a perda era mensurável. -> No caso do Otávio, dava para apontar o que se perdeu.'
  - 'O que só existe na publicação se você tiver revelado antes. (nota da figura 4.1) -> O que só chega à publicação se você o tiver descoberto antes. ("revelado" fica sem objeto)'
  - 'Nenhum redator teria como adivinhá-la, porque ela é fruto de vinte e cinco anos de audiências, e ela diz mais -> Nenhum redator teria como adivinhá-la: ela é fruto de vinte e cinco anos de audiências e diz mais (dois "ela" e dois "e" na mesma frase)'
  - 'A conclusão estava errada, porque aquele perfil nunca tinha sido realmente dele. -> A conclusão estava errada, porque aquele perfil nunca tinha sido dele.'
  - 'A terceirização prematura costuma nascer justamente do raciocínio de um bom profissional. -> A terceirização prematura costuma nascer do raciocínio de um bom profissional.'
  - 'Ficavam num meio-termo confortável, que é exatamente onde nenhum cliente presta atenção. -> Ficavam num meio-termo confortável, que é onde nenhum cliente presta atenção.'
  - 'Você aprova por não ter objeção, sem nenhum entusiasmo. -> Você aprova por falta de objeção, nunca por entusiasmo. (restaura o contraste do PWA, que o sinal perdeu)'
  - 'Produzi matéria-prima bruta com a minha voz / Gravei os três minutos e transcrevi o primeiro sem corrigir -> Gravei os três minutos e transcrevi o primeiro minuto sem corrigir ("o primeiro" fica sem núcleo)'
  - 'O áudio transfere o modo, que é justamente o que a informação não carrega. -> O áudio transfere o modo, que a informação não carrega.'
  - 'Numa terça-feira de março -> Numa quinta-feira de março (e "até aquela terça-feira" -> "até aquela quinta-feira"), para não repetir a terça do cap. 2 e a do cap. 6'
  - 'Júlia -> outro nome, de som distante de Lúcia (Beatriz, Helena), propagando para o cap. 6'
  - 'Diagramar e editar | Sim | Acabamento -> Diagramar e editar o vídeo | Sim | Acabamento'
diagramacao:
  - 'CRÍTICO, p012: a abertura em versalete imprime "TODA PRIMEIRA CLASS="NQ">SEGUNDA-FEIRA". Bug do orquestrador (span "abre" aplicado depois de sem_hifen). Corrigir no motor antes de qualquer QA de outro capítulo.'
  - 'p017, figura 4.2: rótulos dos nós 4 (esquerda) e 2 (direita) cortados pela área da figura ("ocê revisa contra a sua", "u falaria assim? É a única", "Áudio de três minutos, no"); a nota do nó 1 sobrepõe o círculo numerado. Reduzir o raio do ciclo ou dar largura fixa com quebra aos rótulos laterais e ancorá-los dentro do viewBox.'
  - 'p017-p018: a legenda "TABELA 4.1 O que delegar e o que nunca delegar" fica sozinha no pé da p017 e a tabela abre a p018. Prender a caption à tabela (break-after: avoid na caption / break-inside: avoid no conjunto) ou deixar o parágrafo "Nem tudo na produção…" descer junto.'
  - 'p018: cerca de 17% de branco no pé, porque a regra que prende o último parágrafo da prosa ao "Para guardar" empurra as três linhas finais para a p019. O "Para guardar" não caberia na p018 de qualquer forma; soltar a regra (prender só a última frase, ou nada) recupera a p018 cheia. Mesmo problema apontado no cap. 1.'
  - 'p015: cerca de 14% de branco antes de "Os quatro sinais", espaço para o intertítulo e três linhas. p013: cerca de 10% antes de "Por que gente competente terceiriza cedo". Verificar a interação do break-after: avoid do h2 com as figuras seguintes.'
  - 'Extensão: o capítulo ocupa 15 páginas (p011 a p025), acima do alvo de 10 a 14, com a prosa no piso (1.823 palavras). Resolvidos os brancos de p013, p015 e p018, o capítulo cabe em 14. Os brancos de p019 (antes da oficina), p022 (antes do esqueleto indivisível) e p024-p025 (fechamento) são aceitos pelo projeto.'
  - 'p014: "pro-/duto." como última linha de parágrafo hifenizada; mesmo ajuste de hyphenate-limit-chars pedido no cap. 1.'
  - 'p020: no título da oficina, o hífen de "matéria-prima" na Instrument Serif fica largo como meia-risca ("matéria–prima"). Verificar o glifo ou usar U+2011 com a fonte de texto.'
  - 'p021, campo 05: sem grade para a tabela de delegação (ver aplicabilidade). p020, campo 02: 10 linhas para uma transcrição de um minuto (ver aplicabilidade).'
  - 'p015 e p017: notas das figuras em Inter cinza ~7,5 pt continuam no limite de legibilidade para o leitor de 50-60 anos; pendência dos caps. anteriores.'
veredito: "Capítulo com abertura e argumento de editora, mas reprovado nesta rodada: o protagonista redelega à agência na Fase I, contra a figura do próprio método e contra o arco dos caps. 6 e 24 (bloqueador); a cena de abertura usa uma publicação errada para provar que o problema é o texto correto; a conta das publicações não fecha; a oficina não dá espaço nem grade para o que pede, o checklist é tudo ou nada, e a p012 imprime código HTML."
