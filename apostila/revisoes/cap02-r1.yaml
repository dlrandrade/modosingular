capitulo: 2
iteracao: 1
notas: {metodo: 8.8, voz: 8.2, originalidade: 8.3, clareza: 8.8, ritmo: 8.4, concretude: 8.7,
        coerencia: 8.0, aplicabilidade: 8.3, impresso: 7.0, honestidade: 8.5}
bloqueadores:
  - 'Alternativa correta da verificação corrompida no impresso (p024, questão 02, opção c). O manuscrito traz "- O centro da peça: você mesmo ou o problema de quem lê." sem aspas; o YAML lê os dois-pontos como chave e a página imprime literalmente "{''O centro da peça'': ''você mesmo ou o problema de quem lê.''}". Além de ilegível, a forma estranha denuncia a resposta certa. Correção: pôr a opção entre aspas duplas ("O centro da peça: você mesmo ou o problema de quem lê.") ou reescrever sem dois-pontos ("O centro da peça, que pode ser você mesmo ou o problema de quem lê."). Sugestão ao build: recusar opção de verificação que não seja string.'
pontos_fortes:
  - 'A cena de abertura é das melhores do livro até aqui: "antes de sentar, pediu desculpas", o protocolo com detalhe exato ("respiração em quatro tempos ao acordar, diário de gratidão, nada de café depois das duas da tarde, dez minutos de sol") e a virada seca "No vigésimo segundo dia, ela acordou com o coração acelerado, como sempre. A conclusão veio sozinha: [...] o problema era ela." O dano é nomeado com precisão clínica: "O dano estava na promessa de prazo".'
  - 'Contribuições que o PWA não tinha e que desarmam o leitor: o efeito sobre quem nunca chega ("Quem desiste de procurar ajuda por causa de uma resposta ruim nunca aparece na agenda de ninguém para ser corrigido"); o retrato generoso do ocupante do espaço, com as três coisas que ele tem ("responde à pergunta que o público faz, com as palavras que o público usa, e responde de novo no dia seguinte"); e o quarto motivo da Lúcia, fechado com "o trabalho bem feito fala por si apenas para quem já está dentro da sala".'
  - 'A lista da Lúcia é concretude de primeira: "Se eu precisar de remédio, é porque a terapia não funcionou." "Terapia boa resolve em poucas sessões." "Ansiedade é falta do que fazer." "Se eu mexer no passado, vou ficar pior." Quatro crenças verossímeis, cada uma com efeito clínico real (atrasar a procura, desistir cedo). A veterinária ("quantas coisas entram num apartamento pela sola de um sapato") e o oftalmologista do aparelho novo dão amplitude de profissões sem virar catálogo.'
  - 'Regra de ouro íntegra: a oficina, o esqueleto e o roteiro de fala são 100% sobre a área do leitor; o roteiro não menciona internet, perfil ou publicação; a nota final lembra que em saúde, direito e finanças "o critério orienta, mas não substitui uma avaliação individual". O destravamento da Lúcia resolve o sigilo pelo caminho certo (tema = crença pública, nenhuma sessão contada), e a questão 03 da verificação testa isso.'
  - 'Nota "A conta invisível do silêncio" com fecho memorável ("A conta não some. Ela só muda de lugar na agenda."); lint limpo (0 "não é/é", 0 frase-soco, média de frase 16,6, desvio 8,2); figuras do plano presentes (tabela da ausência e balança com selo de esquema ilustrativo).'
problemas:
  - criterio: impresso
    trecho: "O centro da peça: você mesmo ou o problema de quem lê."
    por_que: 'Bloqueador (ver acima). Na p024 a opção c da questão 02 sai como dicionário Python entre chaves. É a resposta correta, e a anomalia visual entrega o gabarito.'
    correcao: 'Colocar a opção entre aspas no bloco verificacao: - "O centro da peça: você mesmo ou o problema de quem lê." Reconferir p024 e o Apêndice A depois do build.'
  - criterio: coerencia
    trecho: "O rapaz do vídeo garantia que, no fim das três semanas, a ansiedade estaria sob controle."
    por_que: 'O capítulo 1 já usou esta imagem, quase igual e sobre o mesmo sintoma: "um rapaz de camiseta explicando, com muita segurança e alguns erros, o que fazer quando o coração dispara. O vídeo tem centenas de milhares de visualizações [...] vai gastar metade de uma consulta desfazendo o que ele ensinou." No cap. 2, Débora acorda "com o coração acelerado", Lúcia encontra "dezenas de vídeos com milhões de visualizações" e passa "três sessões" desfazendo. O leitor que chega do cap. 1 lê a cena central do cap. 2 como repetição, e o cap. 1 ainda antecipa o tema do 2 no exemplo da oficina ("Tenho tempo para corrigir, em consulta, o que outros ensinam errado").'
    correcao: 'Trocar o ocupante e o sintoma aqui, já que o cap. 1 está mais adiantado: "A mulher do vídeo, voz mansa e fundo de plantas, garantia que no fim das três semanas a ansiedade estaria sob controle. [...] No vigésimo segundo dia, ela acordou com o mesmo aperto no peito." Em "Quem está ocupando o seu lugar", ajustar para "A moça do protocolo de vinte e um dias provavelmente acredita no que diz." Trocar "dezenas de vídeos com milhões de visualizações" por "dezenas de vídeos quase idênticos". Registrar na bíblia que o cap. 1 fica com o vídeo sobre coração disparado.'
  - criterio: ritmo
    trecho: "E você gasta a primeira parte do atendimento desfazendo o que outra pessoa ensinou."
    por_que: 'A batida "passar a consulta desfazendo o que outro ensinou" aparece cinco vezes no capítulo: as três sessões da Lúcia; esta frase; a veterinária que "passa os primeiros dez minutos de muitas consultas explicando isso, com paciência, para uma pessoa de cada vez"; a nota ("paga depois, em atendimento, corrigindo o que a internet ensinou no seu lugar"); e a lista ("corrigia toda semana, sempre com as mesmas palavras, para uma pessoa de cada vez"). "Para uma pessoa de cada vez" se repete palavra por palavra. A lição cap01-r2 limita a mesma batida a duas vezes por capítulo.'
    correcao: 'Cortar esta frase (o parágrafo termina em "já educada por ela"). Na lista da Lúcia, trocar o fim por um ganho novo: "Pelo menos dez eram equívocos que ela corrigia toda semana, sempre com as mesmas palavras. Eram dez correções prontas, testadas durante anos, que até ali só tinham sido ditas de porta fechada." Assim a imagem da porta fechada (primeiro motivo) volta transformada, e "uma pessoa de cada vez" fica só na veterinária.'
  - criterio: voz
    trecho: "Existe uma pergunta melhor, que mede consequência em vez de desejo"
    por_que: 'A seção "A pergunta que decide" empilha antíteses: "mede consequência em vez de desejo"; "Deixa de ser sobre gostar ou não de aparecer e passa a ser sobre quem vai ocupar o espaço que é seu"; "A primeira pergunta põe você no centro [...] A segunda põe no centro quem está do outro lado"; e o fecho "Ele pede menos coragem do que generosidade com quem ainda não chegou até você". São quatro na mesma seção; a lição cap01-r1 permite uma. O lint não pega "em vez de", "deixa de ser X e passa a ser Y" nem "menos X do que Y", mas o leitor pega.'
    correcao: 'Manter só a de "centro" (é a que traz ideia nova). Reescrever: "Existe outra pergunta: quem eu aceito que explique o meu trabalho para as pessoas que ainda não me conhecem? Formulada assim, a decisão sai do terreno do gosto." Cortar "Deixa de ser sobre gostar ou não de aparecer e passa a ser sobre…". No fecho, ver o problema sobre o último parágrafo.'
  - criterio: voz
    trecho: "A diferença está no centro de gravidade. Na autopromoção, o assunto é o profissional. Na ocupação de território, o assunto é a dúvida, o erro, o dilema de quem ainda não é cliente."
    por_que: 'É o molde que a lição cap01-r1 proíbe ("X e Y são coisas diferentes: a primeira… a segunda…"), e o intertítulo o anuncia literalmente: "Ocupar espaço e se promover são coisas diferentes". O quadro Compara, logo acima, já faz esse contraste item por item; a prosa o repete em forma de antítese e depois uma terceira vez com o oftalmologista ("Um oftalmologista pode [...] Ou pode [...]").'
    correcao: 'Intertítulo: "Quem é o assunto da peça". Cortar o parágrafo "A diferença está no centro de gravidade…" e fechar o parágrafo do oftalmologista com a única frase que ele trazia de novo: "…vai saber, sem que ninguém diga, com que tipo de médico está lidando. O profissional aparece pela forma como pensa, quase nunca como tema."'
  - criterio: voz
    trecho: "O terceiro motivo, o olhar dos colegas, costuma pesar mais do que se admite, e por isso merece uma observação."
    por_que: 'O narrador anuncia em vez de dizer, voz de curso que a lição cap01-r1 já apontou e que o lint não detectou. O capítulo faz isso várias vezes: "merecem um olhar calmo"; "merece uma observação"; "Cada um desses motivos merece respeito, e nenhum deles vai ser descartado neste livro"; "Mas é preciso olhar para o que a ausência produz do lado de fora"; "O nome parece forte, e é de propósito". Somam-se as aberturas-gancho em série: "Há um efeito ainda mais sério, e menos visível."; "Existe uma confusão que explica…"; "Existe uma pergunta melhor…"; "A troca tem um efeito colateral curioso."'
    correcao: 'Cortar "e por isso merece uma observação" (a frase termina em "do que se admite."). Trocar a abertura de "Quem está ocupando o seu lugar" por "O desprezo é a reação mais comum a quem ocupa esse espaço, e a que menos ajuda." Trocar "O nome parece forte, e é de propósito. A palavra renúncia lembra que existe uma escolha envolvida…" por "Renúncia, porque há uma escolha envolvida, mesmo quando ela não parece uma escolha." Cortar "A troca tem um efeito colateral curioso." e começar direto em "A primeira pergunta põe você no centro…". Acrescentar ao lint: "merece(m)", "é preciso olhar", "é de propósito".'
  - criterio: ritmo
    trecho: "O terceiro motivo, o olhar dos colegas, costuma pesar mais do que se admite"
    por_que: 'A seção "Os bons motivos da Lúcia" lista o primeiro, o segundo e o terceiro motivo em sequência de ficha ("O primeiro era exposição. [...] O segundo era sigilo [...] O terceiro era o olhar dos colegas"), passa ao quarto, fecha com a melhor frase da seção ("apenas para quem já está dentro da sala") e depois volta ao terceiro. A volta quebra o fecho, e a resposta aos colegas fica longe do motivo que ela responde.'
    correcao: 'Reordenar: primeiro, segundo e terceiro motivo; logo depois, o parágrafo dos colegas (sem "O terceiro motivo, o olhar dos colegas," no início: "Colegas que torcem o nariz para quem aparece…"); por último o quarto motivo, terminando em "dentro da sala". Em seguida: "O sigilo vai ganhar um capítulo inteiro mais adiante. Do lado de fora, independentemente das intenções de quem se ausenta, a ausência produz isto:" e a tabela, cuja segunda linha ("Deixando o trabalho falar") passa a ecoar o motivo que acabou de ser lido.'
  - criterio: honestidade
    trecho: "Um texto que corrige uma crença com cuidado quase nunca é lido como exibicionismo, nem pelos mais críticos. Com frequência é compartilhado por eles, porque diz em público o que também gostariam de dizer e não têm tempo."
    por_que: 'É uma afirmação empírica sem fonte ("quase nunca", "com frequência"), usada como promessa de que os colegas vão aprovar, o que a lição cap01-r1 veda. O mesmo vale para "Especialistas que travam diante da primeira pergunta costumam responder à segunda com uma rapidez que surpreende a eles mesmos" e, na legenda da figura 2.1, para "O desconforto é real, mas é seu e passa."'
    correcao: 'Converter em observação de personagem: "Lúcia lembrou de um texto assim, escrito por uma professora da formação, que circulou entre os colegas mais críticos sem que ninguém falasse em vaidade. Alguns compartilharam, porque dizia em público o que eles também gostariam de dizer." Para a segunda frase, mostrar a Lúcia respondendo (ver o problema de coerência sobre o modo dela). Legenda: "O desconforto é real e é seu. O custo de ceder a conversa recai sobre o seu público, e se renova a cada dúvida respondida por outra pessoa."'
  - criterio: coerencia
    trecho: "Lúcia atende adultos com ansiedade há nove anos em Porto Alegre, e já tinha ouvido versões parecidas dessa história."
    por_que: 'A lição cap01-r2 exige que o personagem em foco mostre o seu modo de pensar já na primeira cena. O modo da Lúcia é "pensa RESPONDENDO — ganha clareza quando alguém pergunta", e a marca dela é "responde pergunta com pergunta antes de responder". No capítulo inteiro, porém, Lúcia não diz uma palavra: não responde ao pedido de desculpas da Débora, e na seção "A pergunta que decide" a pergunta nova não é feita a ela, nem ela a responde. É justamente onde o modo apareceria sozinho. Isso também deixa a seção abstrata ("Durante anos, Lúcia se fez a mesma pergunta"). A troca do rótulo previsto no plano pelo protocolo é defensável, porque preserva o contraponto sobre rótulos do cap. 17.'
    correcao: 'Na cena 1, depois de "o problema era ela": "Lúcia não discutiu. Perguntou: ''E quem te disse que era um teste?''" (a fala pode usar "te"; se preferir: "E quem disse que era um teste?"). Na seção 5, trocar a frase genérica por uma cena de duas linhas: "Foi uma colega da supervisão quem formulou a outra pergunta, num café depois do grupo de estudos: quem você aceita que explique o seu trabalho para quem ainda não te conhece? Lúcia, que nunca soube responder se queria aparecer, respondeu a essa antes de a colega terminar: ''Aquela moça do protocolo, não.''" Isso mostra o modo, dá concretude à seção e substitui a generalização sem fonte.'
  - criterio: aplicabilidade
    trecho: "Tem uma coisa que eu ouço toda semana, e que já foi verdade, mas hoje não é mais."
    por_que: 'O gancho do roteiro e o esqueleto ("O contexto em que aquilo já fez sentido") só servem a equívocos que foram verdade um dia, como o do clareamento. Os exemplos do próprio capítulo nunca foram verdade: "Gato de apartamento não precisa de vacina", "Ansiedade é falta do que fazer", o protocolo de vinte e um dias. Um leitor que escolher um equívoco desse tipo (a maioria) vai começar a peça com uma frase falsa. A oficina acerta ("Por que esse equívoco existe?"), mas o roteiro estreita o método.'
    correcao: 'Roteiro: "Tem uma coisa que eu ouço toda semana, e que parece fazer todo sentido." Esqueleto, parte 2: "De onde ela vem: o que ela tem de verdade, ou o que já foi verdade um dia." Faça assim, item 2: "“O que mudou foi isto” ou “o que falta nessa ideia é isto”. Hoje, na prática, o que eu vejo é aquilo."'
  - criterio: aplicabilidade
    trecho: "Consigo dizer por que a minha peça não é sobre mim, embora fale do meu trabalho."
    por_que: 'O item vale 2 dos 10 pontos do checklist e nenhum campo da oficina pede isso. A lição cap01-r1 exige campo correspondente para todo item do checklist. Hoje o leitor marca o item de memória.'
    correcao: 'Acrescentar à oficina um campo curto, antes do "estoque": rotulo "Quem é o assunto desta peça? Diga em uma linha por que ela não é sobre você." exemplo "Um corretor de seguros: “O assunto é o erro de quem acha que seguro de vida só serve a quem tem filho pequeno. Eu apareço no jeito de explicar.”" linhas: 2. Na ajuda do checklist: "(campo 05)".'
  - criterio: aplicabilidade
    trecho: "Porque as plataformas reduzem o alcance de quem passa muito tempo sem publicar."
    por_que: 'A lição cap01-r1 pede distratores inequivocamente falsos. Este é plausível, talvez verdadeiro, e "Porque os clientes antigos podem achar que você encerrou as atividades" também. O próprio comentário admite isso ("O ponto não é a plataforma nem a métrica"), e o leitor que erra tem razão parcial. Na questão 03, a opção c ("Trocar o nome e a cidade da paciente antes de contar a sessão") é quase a regra que o cap. 1 ensinou ("Preserve o sigilo: mude o que identifica, mantenha o que ensina"). O leitor que aprendeu o cap. 1 tem motivo para marcá-la.'
    correcao: 'Q1: reformular para "Segundo o capítulo, o que acontece com a dúvida que o especialista não responde?" com opções "Fica sem resposta até que alguém qualificado apareça." / "É respondida por outra pessoa, que educa o seu público no seu lugar." / "Desaparece, porque o público só pergunta a quem tem formação." / "Chega intacta ao consultório, onde é respondida do zero." Q3, opção c: "Esperar a paciente encerrar a terapia para então contar a sessão."'
  - criterio: aplicabilidade
    trecho: "Uma veterinária: “Gato de apartamento não precisa de vacina.”"
    por_que: 'O exemplo repete o caso da prosa (a veterinária de Belo Horizonte), que o leitor acabou de ler, em vez de abrir outra profissão. O campo 03 não traz exemplo, só uma instrução ("O manual todo mundo já leu"), justo no campo mais difícil. O campo 05 promete "Eles vão voltar nos próximos capítulos", mas os capítulos 3 a 5 não os retomam, e o leitor fica esperando.'
    correcao: 'Campo 01: trocar a veterinária por "Um corretor de seguros: “Seguro residencial só vale para casa, não para apartamento.”" (ou outra profissão ainda não usada; não repetir o corretor se ele for para o campo novo). Campo 03: continuar o fio do dentista: "Um dentista: “Nos clareamentos que acompanho, o que aparece é sensibilidade nos primeiros dias, e passa. O esmalte continua lá.”" Campo 05: "Anote sem desenvolver. Cada um é uma peça futura; no capítulo 6 eles ganham um lugar fixo." (confirmar com o plano do cap. 6).'
  - criterio: concretude
    trecho: "Ou pode explicar por que a vista cansada no fim do dia, em quem passa oito horas diante de uma tela, raramente se resolve só com um grau novo nos óculos."
    por_que: 'No Brasil, "vista cansada" é o nome popular da presbiopia, que se resolve justamente com grau novo (óculos de perto). Um oftalmologista leria a frase como erro. O fenômeno descrito é o cansaço visual ou olho seco de quem passa horas na tela. A lição cap01-r1 pede detalhe de ofício exato.'
    correcao: '"Ou pode explicar por que os olhos que ardem e embaçam no fim do dia, em quem passa oito horas diante de uma tela, raramente melhoram só com um grau novo nos óculos."'
  - criterio: coerencia
    trecho: "Usar as palavras do público é uma questão de tradução, e este livro inteiro trata disso. Aparecer de novo é uma questão de sistema, e a quarta fase é dedicada a ele."
    por_que: 'Quem trata de tradução é a terceira fase ("A Tradução"), não "este livro inteiro". As duas remissões seguidas soam como sumário de curso. A tríade anafórica "é uma questão de escuta… é uma questão de tradução… é uma questão de sistema" tem o ritmo de texto gerado.'
    correcao: '"Responder à pergunta real depende de escuta, e você passa o dia ouvindo essas perguntas. Falar com as palavras do público e voltar no dia seguinte se aprendem; a terceira e a quarta fases deste livro existem para isso."'
  - criterio: ritmo
    trecho: "O silêncio, nesse contexto, não é ausência de posicionamento. Pode se tornar renúncia de influência."
    por_que: 'A citação do dossiê cai no fim da seção sobre autopromoção x território, onde não tem "contexto" nenhum ("nesse contexto" fica sem referente), e repete a definição do box Conceito três páginas antes. É também um "não é X" que o texto evita em todo o resto.'
    correcao: 'Mover a citação para logo depois do box Conceito, no lugar do parágrafo "O nome parece forte…", onde "nesse contexto" encontra o assunto. Ou cortá-la: o conceito já está dito.'
  - criterio: ritmo
    trecho: "Foi a primeira vez que ela olhou para aquilo como matéria-prima."
    por_que: 'O parágrafo da lista tem onze frases contando as quatro citadas, bem acima do teto de seis da bíblia. O parágrafo seguinte fecha a prosa descrevendo a oficina ("A oficina deste capítulo pede exatamente esse movimento. Você vai escolher…") e termina em moral ("Ele pede menos coragem do que generosidade"). A lição cap01-r1 manda fechar em consequência prática e não anunciar as seções seguintes.'
    correcao: 'Quebrar em "Nenhuma dessas frases era absurda." (novo parágrafo). Cortar o parágrafo "A oficina deste capítulo…" e fechar a prosa no ganho da Lúcia (ver a correção proposta para a repetição da batida): "…que até ali só tinham sido ditas de porta fechada. Escolheu a primeira naquela noite." Se quiser uma ponte, uma frase de consequência: "O seu estoque de equívocos já existe; ele só nunca foi escrito."'
  - criterio: clareza
    trecho: "A comparação serve menos para alimentar raiva do que para mostrar que a disputa pelo espaço, em si, é justa: ganha quem aparece."
    por_que: '"A comparação" não tem referente claro, porque nenhuma comparação foi anunciada. A frase também entra em atrito com o conceito, que chama o espaço de "seu por competência": se ele é do especialista por competência, a disputa em que "ganha quem aparece" não pode ser simplesmente "justa". É mais uma antítese de "menos X do que Y".'
    correcao: '"Olhar para ele sem desprezo mostra que a disputa pelo espaço tem regras simples: ganha quem aparece. O injusto, para o seu público, é que só apareça quem sabe menos."'
edicoes_de_linha:
  - 'Naquela noite, depois do último paciente -> Na noite da terceira sessão, depois do último paciente (o parágrafo anterior avança três sessões e "naquela noite" fica ambíguo).'
  - 'Quem tem pudor de autopromoção, e profissionais competentes costumam ter, conclui que a internet não é para ela. -> Quem tem pudor de autopromoção, e profissionais competentes costumam ter, conclui que não tem nada a fazer na internet. ("ela" não concorda com "quem" nem com "muita gente".)'
  - 'com uma rapidez que surpreende a eles mesmos -> com uma rapidez que surpreende até eles mesmos (se a frase sobreviver à correção de honestidade).'
  - 'Ele pede menos coragem do que generosidade -> "Ele" não tem antecedente masculino claro (oficina? movimento? equívoco?). Cortar junto com o parágrafo ou trocar por "O exercício pede…".'
  - 'Tabela, linha 4: Perde clientes que não têm outro critério de escolha -> Quem só tem a internet para comparar escolhe outro (sujeito explícito, como nas linhas 1 e 3).'
  - 'Isso acontece em todas as áreas, não só na saúde mental. -> Acontece em qualquer área. (evita a generalização absoluta e o "não só").'
  - 'Os colegas que torcem o nariz para quem aparece raramente estão julgando o conteúdo; estão julgando a vaidade. -> Quando torcem o nariz para quem aparece, os colegas costumam estar julgando a vaidade. (desfaz a antítese "não X; Y").'
  - 'O primeiro era exposição. -> O primeiro era o medo da exposição. (o motivo não é a exposição, é o receio dela).'
  - 'Oficina, campo 03: "O manual todo mundo já leu." -> "O que está no manual o seu cliente também encontra." (a versão atual tem um leve desdém que o próprio capítulo manda evitar).'
diagramacao:
  - 'p024: questão 02, opção c impressa como "{''O centro da peça'': ''você mesmo ou o problema de quem lê.''}" (bloqueador; aspas no YAML).'
  - 'p017: cerca de 40% da página em branco depois de "surpreende a eles mesmos", porque a figura 2.1 não coube e foi para a p018. Deixar a figura flutuar para depois do parágrafo seguinte ("Lúcia não publicou nada…"), ou reduzir a altura da balança em cerca de 25%.'
  - 'p018: cerca de 25% em branco no pé. O parágrafo de 4 linhas "A oficina deste capítulo…" foi empurrado para a p019 junto com o "Para guardar". O keep-with-next do bloco guardar está agressivo demais. (Se o parágrafo for cortado, conforme sugerido, o problema some.)'
  - 'p013: cerca de 7 linhas em branco no pé antes de "Quem está ocupando o seu lugar"; p014 e p016 perdem 4 ou 5 linhas cada pelo mesmo motivo (intertítulo ou citação empurrados inteiros). Aceitar intertítulo com 2 ou 3 linhas de texto no pé da página.'
  - 'Extensão: o capítulo ocupa 15 páginas (p011 a p025), acima do alvo de 10 a 14. Resolvidas as sobras das p013, p017 e p018 e feitos os cortes sugeridos, deve voltar a 14.'
  - 'p023: no esqueleto, "O que se costuma dizer", "Por que ela existe" e "A régua" têm 2 linhas numa coluna de cerca de 11 cm, pouco para letra de mão. Sobram cerca de 15% no pé da página: subir para 3 linhas nesses três blocos.'
  - 'p018: o rótulo "O custo de outro explicar por / você" deixa "você" sozinho na segunda linha. Alargar a caixa do rótulo ou quebrar antes de "explicar".'
  - 'Hifenização dentro de citações curtas: "apare-cer?”." (p017) e "lu-gar?”." (Para guardar, p019). Proibir hifenização em trechos entre aspas de até 6 palavras ou usar hyphens: manual nesses spans.'
  - 'p022: cerca de 70% em branco antes do esqueleto. O projeto aceita esse caso; fica registrado só como custo de página.'
veredito: "Reprovado na r1 (média estimada 8,4; impresso 7,0): a abertura é forte e a oficina é útil, mas a alternativa correta da verificação sai corrompida no papel, a imagem central repete o cap. 1 e o texto acumula antíteses e anúncios de narrador. Com uma passada focada nesses pontos, o capítulo chega a 9."
