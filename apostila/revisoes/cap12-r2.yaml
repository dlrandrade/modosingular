capitulo: 12
iteracao: 2
notas: {metodo: 8.7, voz: 8.8, originalidade: 8.4, clareza: 8.9, ritmo: 8.8, concretude: 9.1,
        coerencia: 8.2, aplicabilidade: 8.6, impresso: 8.5, honestidade: 9.2}
bloqueadores: []
pontos_fortes:
  - 'A r1 foi resolvida quase por inteiro. A paisagista pensa num dos quatro modos, a posição deixou de ser "a quinta", o fecho não anuncia a oficina, as perguntas da régua saíram numeradas, a oficina ganhou o campo 08 e a rede remete ao manifesto do cap. 10. A cena do Otávio agora mostra uma linha diferente de modo e ritmo: "a reforma em geral é informação pública, que qualquer colega explica; o que só ele tem é o documento feito depois do fato".'
  - 'A tabela 12.1 continua sendo o centro do capítulo e confere com os caps. 7 a 11: "O paciente que volta em março dizendo que estava tudo bem até o carnaval", "Não faço acordo de fachada (perdi um cliente de nove anos)", "Não vendo pacote antes de avaliar (perco quem compara preço)". O parágrafo que a antecede ensina a lê-la ("o repertório de cada um vem do tipo de caso que atende, e a posição, do tipo de pressão que sofre").'
  - 'A abertura resolve os quatro modos em quatro gestos, e o do Otávio é o melhor: "a final parecia uma cláusula de contrato, com o custo da posição anotado entre parênteses, como quem registra uma ressalva". A Lúcia sem a amiga seria melhor ainda (ver problemas), mas "na sexta, só faltava tirar as perguntas" é uma imagem exata do modo dialógico.'
  - 'A regra de desempate da seção final é útil e não está na fonte: "Uma posição dita em três minutos, no seu modo, vale mais do que a mesma posição num texto longo que nunca sai da gaveta." A resolução da Lúcia (duas perguntas em semanas seguidas) aplica a regra sem sermão.'
problemas:
  - criterio: aplicabilidade
    trecho: 'Se a sua linha está em aberto, publique duas e diga que a terceira você ainda está testando: isso também é posição.'
    por_que: 'O leitor que terminou o cap. 10 tem três opiniões, e o critério daquela oficina exige que cada uma tenha "um custo real nomeado no campo 04. Se não tem, é constatação." Se a linha da posição dele está "em aberto", nenhuma das três custou nada, e pelo próprio critério as três são constatações. A rede manda publicar duas delas, e o evite da mesma página diz "Posições que ninguém contestaria. Se ninguém discorda, é constatação." A intro também soma quatro itens para três vagas ("as três opiniões do manifesto... e a posição do seu enunciado"). Por fim, dizer "ainda estou testando" não é posição: é o contrário do que o capítulo ensinou na linha em branco.'
    correcao: 'Campo 04 da oficina: "A mais forte das três opiniões do seu manifesto do cap. 10, com o custo que você anotou lá. Se nenhuma tinha custo real, escreva “em aberto”." Intro da rede: "Use as três opiniões do manifesto do capítulo 10 (campos 01 a 03); a do seu enunciado é a primeira. Se a sua linha está em aberto, esta peça espera: volte a ela quando uma das três lhe custar alguma coisa, e publique antes uma peça de repertório (cap. 9)." Corte "isso também é posição".'
  - criterio: metodo
    trecho: 'Este formato respeita o meu modo?'
    por_que: 'A fonte traz a pergunta 1 inteira: "Este formato respeita o meu modo? Se não, como eu capturo no meu modo e só publico nele?". O capítulo cortou a segunda metade, que é justamente a regra do cap. 7 ("Canal e modo também não se confundem"; Renata grava e "transforma depois em texto"). Sem ela, a régua ensina a recusar formatos quando o método ensina a mudar a captura. A cena da Renata mostra o problema: "uma coluna escrita exigiria dela justamente a etapa que tinha travado o carrossel". Pelo cap. 7, isso não é verdade, porque ela já passa áudios a texto toda semana. O desfecho, a entrevista gravada, está certo, mas a justificativa contradiz o capítulo em que o modo foi ensinado.'
    correcao: 'Nota da régua, item 1: "Este formato respeita o meu modo? Se não, dá para capturar no meu modo e publicar nele?" Cena da Renata: "O enunciado respondeu antes dela: a coluna cabia, desde que nascesse falada. Em vez de escrever, propôs gravar uma conversa de dez minutos por mês com o editor, que a transcreveria e publicaria como entrevista."'
  - criterio: originalidade
    trecho: 'Eu penso contando: explico um jardim pela história do jardim anterior, o que morreu e por quê. [...] comparando planta com gente.'
    por_que: 'O único enunciado fora do elenco repete o do Caio em duas das cinco linhas. O modo é o mesmo, com o mesmo gesto de começar por uma obra anterior ("Teve uma obra…"), e o campo das comparações também ("Comparações: vêm de gente", ficha do cap. 11). A profissão é vizinha da dele. Isso desmente a frase que a tabela sustenta, "Nenhuma linha de um caberia no outro sem que alguém percebesse", e a lição cap01-r1 (exemplos em profissões diferentes da do personagem). A troca da r1 corrigiu o quinto modo, mas escolheu justamente o modo do arquiteto.'
    correcao: 'Troque o modo e a comparação e mantenha os ótimos detalhes do segundo verão: "Eu penso escrevendo: antes de visitar um terreno, escrevo à mão o que ele vai pedir daqui a três anos. [...] E eu falo em frases compridas, que voltam atrás para corrigir o nome da planta, comparando o jardim com uma cozinha: o que se usa todo dia fica perto da porta." Melhor ainda, troque a profissão por uma que esteja longe de arquitetura e não tenha sido usada nos caps. 11 a 13.'
  - criterio: coerencia
    trecho: 'falou de três obras seguidas [...]. No fim de cada história, disse em uma frase o que ela mostrava sobre ele. [...] descobriu que tinha quatro das cinco linhas do enunciado.'
    por_que: 'Três histórias e três frases viram quatro linhas, e uma delas é o ritmo ("Uma por semana, medida no mês de entrega"), que é conta de relógio do cap. 8 e não sai de uma história de obra. A cena mostra o resultado sem mostrar como se chegou a ele (lição cap03-r3), e é a cena que abre o capítulo.'
    correcao: '"...falou de três obras seguidas [...]. No fim de cada história, disse em uma frase o que ela mostrava sobre ele. O sócio anotou num guardanapo, e embaixo Caio acrescentou, de memória, o número que tinha tirado da conta do pior mês. No sábado, passando a limpo, viu que tinha quatro das cinco linhas." Ou conte quatro obras, uma por linha, se a do ritmo for a obra de entrega que engoliu o mês.'
  - criterio: coerencia
    trecho: 'Nos quatro casos, a decisão levou poucos minutos e não dependeu de força de vontade.'
    por_que: 'O parágrafo anterior diz o oposto sobre o Caio: "A tentação voltou por dois dias. Na terceira manhã, ele releu a segunda linha". Foram dois dias de força de vontade até a régua decidir. A generalização que fecha a série é desmentida pela cena imediatamente anterior.'
    correcao: '"Nos quatro casos, o enunciado decidiu depressa. A demora do Caio foi a de deixar de querer o estabilizador, não a de saber se precisava dele." Ou tire da cena do Caio os dois dias ("Leu a proposta, releu a segunda linha...").'
  - criterio: coerencia
    trecho: 'Duas peças por semana; a que falha não passa para a seguinte'
    por_que: 'A nota "A estrutura do enunciado" pede "[ritmo, com dia e hora]", o campo 02 da oficina pede "com dia e hora", e o cap. 8 diz que sem isso "a conta vira intenção". Só Lúcia ("terça às oito") e Otávio ("sexta à tarde") cumprem. A linha da Renata não tem dia, a do Caio ("Uma por semana, medida no mês de entrega") também não, e a da paisagista tem dia sem hora ("às segundas"). O modelo desobedece à regra que ele mesmo ilustra.'
    correcao: 'Renata: "Duas por semana, terça e quinta, no carro, antes de ligar o motor; a que falha não passa para a seguinte". Caio: "Uma por semana, na quinta de manhã; medida no mês de entrega" (é coerente com o plano do cap. 20, "toda quinta"). Paisagista: "às segundas, antes da primeira visita".'
  - criterio: coerencia
    trecho: 'Uma por semana, na sexta à tarde; medida pelo janeiro'
    por_que: 'A troca pedida na r1 quebrou uma remissão. O cap. 21 cita as palavras exatas do enunciado do Otávio: "Otávio tinha escrito ao lado do ritmo, uma peça por semana, três palavras que já eram um aviso: janeiro manda." A tabela do cap. 12, que mostra esse mesmo enunciado, não tem essas palavras. (E "janeiro manda" são duas palavras, não três; corrigir no cap. 21.)'
    correcao: 'Recupere a expressão, explicada na prosa: na abertura, "...com o custo da posição anotado entre parênteses e, ao lado do ritmo, duas palavras de aviso: janeiro manda." Na tabela: "Uma por semana, sexta à tarde; ao lado, “janeiro manda”". Registrar a correção do cap. 21 ("duas palavras").'
  - criterio: originalidade
    trecho: 'Caio guardou o guardanapo passado a limpo na gaveta da prancheta, com a linha da posição escrita a lápis. Nas semanas seguintes, releu a folha duas vezes'
    por_que: 'São três problemas no parágrafo que fecha a prosa. (1) O cap. 11 termina com a mesma batida e o mesmo personagem: "Caio guardou a ficha de léxico na mesma pasta dos projetos em andamento [...] e passou a relê-la". (2) O personagem-modelo faz o contrário do que o capítulo manda: o campo 08 diz "prenda onde você produz", o checklist dá 2 pontos a "Numa frase só, à vista", e Caio guarda o enunciado numa gaveta. (3) O objeto muda no meio: é o "guardanapo passado a limpo" e, na frase seguinte, "a folha".'
    correcao: '"Caio prendeu a folha passada a limpo na parede sobre a prancheta, com a linha da posição escrita a lápis. Nas semanas seguintes, olhou para ela duas vezes, as duas antes de decidir alguma coisa..." Mantenha o final (a linha vazia pedindo atenção), que é bom e prepara o cap. 14 sem entregá-lo.'
  - criterio: voz
    trecho: 'Para o Caio, ela vai aparecer na fase seguinte, numa pergunta que ele ouve toda semana há oito anos.'
    por_que: 'É o narrador anunciando a fase seguinte, o que a lição cap12-r1 veta ("o fecho do capítulo não anuncia as fases seguintes"). E ainda gasta a moldura da cena reservada ao cap. 14 ("a pergunta que Caio responde toda semana há oito anos", no plano). O último parágrafo já planta a mesma coisa pela cena ("passou a prestar atenção nas conversas de obra em que alguém lhe pedia para fazer uma coisa que ele não faria"), e o faz melhor.'
    correcao: 'Corte a frase. O parágrafo fica: "Uma linha em branco não impede o enunciado de funcionar. As outras quatro já decidem boa parte das dúvidas, e a da posição aparece quando a prática a revelar. Até lá, fica escrito a lápis, na margem: “em aberto”."'
  - criterio: ritmo
    trecho: 'Otávio usou a régua para recusar. Um grupo de empresários o convidou [...] Duas linhas responderam. A primeira: [...] A terceira: [...] Propôs responder por escrito [...] O grupo aceitou'
    por_que: 'O parágrafo tem 7 frases, acima do teto de 6 (lição cap01-r2). A série de quatro parágrafos com a mesma abertura ("Renata usou a régua...", "Otávio usou a régua para recusar.", "Lúcia usou a régua para aceitar.", "Caio usou a régua para não comprar nada.") ainda soa como inventário, como a r1 já apontava. Duas cenas mantêm a mesma batida de contraproposta ("Ela propôs outra coisa" / "Propôs responder por escrito"). O "formato mais caro que existe" do Otávio e o "formato mais barato que existe" da Lúcia, em parágrafos vizinhos, fazem eco.'
    correcao: 'Varie a entrada de duas cenas pela ação ("O convite do jornal do bairro chegou numa terça..." / "O estabilizador veio por mensagem de um fornecedor..."). Deixe a anáfora só para Otávio e Lúcia, que são par (recusar/aceitar). No Otávio, funda "Duas linhas responderam. A primeira:..." em "Responderam a primeira linha, porque ele pensa escrevendo e o improviso diante de uma câmera é o que mais lhe custa, e a terceira: ...". Troque um dos superlativos: "é o formato em que ela pensa melhor".'
  - criterio: originalidade
    trecho: 'Lúcia pediu à amiga do grupo de estudos que lhe fizesse as cinco perguntas por mensagem, uma por dia'
    por_que: 'A amiga, que a r1 já apontava como recurso gasto (caps. 7, 8, 11), aparece três vezes neste capítulo: na abertura, em "tem dia e hora amarrados à pergunta da amiga" e em "Resolveu pedindo à amiga duas perguntas em vez de uma". O cap. 13 abre a cena central da Lúcia com o mesmo gesto ("pediu à amiga do grupo de estudos que lhe mandasse quatro perguntas"). O modo dialógico tem outras vozes possíveis: um paciente (sem dados), a supervisora, a colega recém-formada do cap. 7.'
    correcao: 'Na abertura, troque a interlocutora: "Lúcia pediu à colega recém-formada do grupo de estudos, a mesma da pergunta sobre a primeira sessão, que lhe fizesse as cinco perguntas..." Ou use a supervisora. Na seção final, a solução das duas perguntas pode vir sem a amiga: "Resolveu dividindo a posição em duas perguntas, uma em cada semana."'
  - criterio: clareza
    trecho: 'Feito para durar meses, o enunciado não deve ser revisto toda semana.'
    por_que: 'A seção "A linha em branco" tem sete parágrafos, e dois tratam de outra coisa: o conflito entre linhas ("Às vezes o enunciado parece brigar consigo mesmo") e a frequência de revisão. A seção vira depósito de assuntos que o intertítulo não cobre (lição cap01-r2). O parágrafo da revisão também entra na conversa sobre o Caio sem transição, entre "em aberto" e "A tabela tem quatro enunciados".'
    correcao: 'Leve o parágrafo do conflito e o da revisão para o fim de "A régua", logo depois de "A régua funciona também ao contrário, na revisão", que é onde a revisão já está sendo discutida. Ou crie um quinto intertítulo curto ("Quando as linhas brigam"). "A linha em branco" fica só com o Caio e com o convite ao leitor.'
  - criterio: voz
    trecho: 'A tabela a seguir pode ser lida na vertical, uma coluna de cada vez, e depois na horizontal. [...] Na horizontal, as diferenças saltam.'
    por_que: 'São dois parágrafos seguidos apresentando a mesma tabela ("Os enunciados dos quatro personagens, lado a lado, mostram o que a estrutura produz" e "A tabela a seguir pode ser lida..."), com o narrador dizendo como ler antes de ler. "As diferenças saltam" é clichê de apresentação.'
    correcao: 'Funda os dois: "Os enunciados dos quatro personagens, lado a lado, mostram o que a estrutura produz. Lidos na vertical, cada um tem coerência interna: o modo de Otávio, escrever à mão, combina com [...]. Lidos na horizontal, nenhuma linha de um caberia no outro. O ritmo de Renata é o maior dos quatro porque [...]"'
  - criterio: coerencia
    trecho: 'Um mês antes, ela teria recusado por reflexo, pelo mesmo motivo de sempre: expor-se.'
    por_que: 'Desde julho, Lúcia publica um texto por semana e responde por áudio no grupo (caps. 8 e 11). "O mesmo motivo de sempre" ignora o arco: o receio de exposição já foi atravessado na escrita. O que ainda é novo para ela é a voz gravada e pública, e é isso que a frase deveria nomear.'
    correcao: '"Um mês antes, ela teria recusado por reflexo: texto ela já publicava, mas a própria voz, gravada, num canal aberto, ainda lhe parecia exposição demais."'
  - criterio: aplicabilidade
    trecho: '{rotulo: "A evidência", texto: "O que na sua prática levou você a cada uma delas.", linhas: 3}'
    por_que: 'São três evidências, uma por posição, em três linhas, e cada uma pede um caso típico sem nomes (regra 2 da rede). À mão, não cabe. A p022 tem mais de metade da página em branco, e o espaço existe (lição cap04-r1: espaço dimensionado para o que se pede).'
    correcao: 'Suba "A evidência" para 6 linhas ou numere os campos (1, 2, 3), com 2 linhas cada; "As três coisas" pode ficar com 3.'
  - criterio: clareza
    trecho: 'Um grupo de empresários o convidou [...] e publicou as respostas dele na newsletter da associação'
    por_que: 'O "grupo" vira "a associação" sem ter sido apresentado como tal. No parágrafo seguinte aparece outra associação ("o canal de uma associação de psicólogos"), e o leitor apressado mistura as duas.'
    correcao: '"Uma associação de pequenos empresários do Recife o convidou [...] A associação aceitou as perguntas por escrito e publicou as respostas dele na newsletter". Na cena da Lúcia: "para o canal que uma colega mantém com duas psicólogas do grupo de estudos".'
  - criterio: concretude
    trecho: 'Uma peça que ficou sem graça provavelmente falhou no repertório ou na posição. Uma que custou três noites falhou no modo ou no ritmo. Uma que ninguém reconheceu como sua falhou no léxico.'
    por_que: 'É o único uso da régua sem caso, e é o que o leitor mais vai repetir, na revisão das próprias peças. Depois de quatro cenas vivas, o parágrafo volta à abstração.'
    correcao: 'Ancore uma das três num personagem, em uma frase: "Otávio descobriu isso com um texto sobre banco de horas que levou três sextas: tinha começado a digitar direto, sem a folha pautada."'
  - criterio: honestidade
    trecho: 'A coincidência de uma parte não diz quase nada. A de todas as cinco é praticamente impossível.'
    por_que: '"Praticamente impossível" é uma afirmação probabilística sem base. Na mesma linha, "Quase toda peça ruim que você produzir nos próximos meses vai violar uma das cinco linhas" promete ao leitor um diagnóstico que o livro não verificou. As duas são defensáveis como opinião, mas estão escritas como dado.'
    correcao: '"A de todas as cinco eu nunca vi." ("eu" de opinião, permitido pela voz.) E: "Uma peça ruim quase sempre viola uma das cinco linhas, e o enunciado ajuda a dizer qual."'
  - criterio: impresso
    trecho: 'p012, p013 e p015: pé de página em branco em três páginas de texto corrido.'
    por_que: 'Em cada uma, um bloco (figura 12.1, box Conceito, box Na prática) não coube e deixou cerca de 20% da página vazia. São três brancos evitáveis em quatro páginas de abertura de capítulo, e o leitor sente a prosa "pulando". Ver diagramação.'
    correcao: 'Ver itens de diagramação.'
edicoes_de_linha:
  - 'As outras quatro linhas dele, mesmo sem a da posição, já bastam para decidir -> As outras quatro linhas dele já bastam para decidir'
  - 'Renata usou a régua na semana seguinte, e prendeu o enunciado no quebra-sol do carro, onde grava. -> Renata prendeu o enunciado no quebra-sol do carro, onde grava, e usou a régua na semana seguinte.'
  - 'uma coluna escrita exigiria dela justamente -> uma coluna escrita exigiria justamente (o "dela" já está na frase anterior)'
  - 'e o improviso diante de uma câmera é o formato mais caro que existe para ele -> e o improviso diante de uma câmera é o que mais lhe custa'
  - 'Só a vazia continuava pedindo atenção, e ele passou a prestar atenção nas conversas de obra -> Só a vazia continuava pedindo atenção, e ele passou a escutar de outro jeito as conversas de obra'
  - 'De quanto em quanto tempo o enunciado deve ser revisto? -> Quando o enunciado deve ser reescrito? (a resposta correta não é uma frequência)'
  - 'foi isso que eu vi separar {o resultado que funciona} de {o que só remedia}. -> foi isso que eu vi fazer a diferença entre {o que resolve} e {o que só remedia}. (evita "de o que")'
  - 'Faça assim: “Tem três coisas que eu defendo, e o meu trabalho parte delas.” -> Uma evidência por posição, contada como caso típico, sem nomes. (o item atual repete, com outra redação, a primeira linha do roteiro)'
  - 'Numa frase só, à vista, onde eu produzo (campo 08). -> Numa frase só, à vista: na mesa, no carro ou no caderno (campo 08). ("onde eu produzo" já está no rótulo)'
  - 'legenda: Cada parte foi o assunto de um capítulo desta fase. Nenhuma, sozinha, faz a sua linguagem; a combinação faz. -> legenda: Cada parte foi o assunto de um capítulo desta fase, e cada uma vira uma pergunta da régua. (o título já diz "Nenhuma parte sozinha faz a sua linguagem")'
  - 'Caio contou. Numa sexta-feira no fim da tarde -> Caio chegou ao enunciado contando. Numa sexta-feira no fim da tarde ("Caio contou" sozinho lê-se também como "contou os passos", o gesto do cap. 11)'
  - 'mesmo em setembro, que é o mês das obras de jardim -> mesmo em setembro, quando começam as obras de jardim da primavera'
diagramacao:
  - 'p012: cerca de 20% da página em branco no pé, depois de "descrito com precisão suficiente para ser usado." A figura 12.1 não coube e foi para a p013. Encolher a figura (a órbita ocupa quase meia página para cinco rótulos) ou deixar o parágrafo "Duas pessoas podem ter o mesmo modo..." subir antes dela.'
  - 'p013: cerca de 20% em branco no pé, depois de "no vigésimo terceiro dia". O box Conceito foi inteiro para a p014. Com a figura menor, o box cabe; outra saída é permitir que o parágrafo seguinte ("A mudança de pergunta...") suba para preencher.'
  - 'p015: cerca de 20% em branco no pé, depois do parágrafo sobre a coluna do Caio. O box "Na prática" (paisagista) foi para a p016, e a r1 já apontava isso. Permitir a quebra do box entre "O comum" e "O singular", ou antecipar o box para antes do parágrafo "A última coluna, a do Caio".'
  - 'p023: cerca de 25% em branco no pé, depois do Faça/Evite, porque o roteiro de fala foi para a p024. Como a p022 já tem mais de metade em branco antes do esqueleto (aceito pelo projeto), aproveite o espaço para aumentar as linhas de "A evidência" (ver problemas). O esqueleto cresce e o roteiro continua indo para a p024, sem branco novo.'
  - 'p015: a tabela 12.1 não tem coluna para o leitor, embora a prosa diga "A tabela tem quatro enunciados e espaço para mais um: o seu" e o plano do capítulo peça "o do leitor fica em branco". No papel, uma coluna "Você" vazia (ou uma grade de cinco linhas no fim da oficina) faria o que a frase só promete.'
veredito: 'Capítulo muito melhor que a r1, com tabela sólida e abertura boa. Ainda não passa, porque a rede e o campo 04 mandam publicar como posição o que o próprio livro chama de constatação, a régua perdeu a metade da pergunta 1 que protege o método, a paisagista repete o Caio em duas linhas e a série de cenas se contradiz ("poucos minutos" depois de "dois dias").'
