capitulo: 22
iteracao: 1
notas: {metodo: 9.0, voz: 8.6, originalidade: 8.8, clareza: 9.0, ritmo: 8.8, concretude: 8.8,
        coerencia: 7.8, aplicabilidade: 8.2, impresso: 8.8, honestidade: 8.7}
bloqueadores: []
pontos_fortes:
  - "A cena de abertura mostra a contaminação em vez de defini-la: a frase emprestada, 'acolher' e 'validar', o fecho 'você não está sozinha', a pergunta da amiga ('Gostei. Mas quem escreveu?') e o 'meia hora depois, parou de achar graça'. O conceito nasce do caso, como a bíblia pede."
  - "A virada 'Ela tinha levado a pele e deixado o esqueleto' e o mecanismo do café das sete e quarenta ('A voz entra pelo ouvido de quem admira, e sai na primeira página escrita logo depois') são as duas imagens do capítulo que ficam na memória."
  - "O método do PWA foi preservado e ganhou objeto físico: o cartão com o esqueleto, o celular na bolsa, a caixa de fichas na gaveta do consultório. A engenharia reversa passa a ser um gesto que o leitor consegue imitar."
  - "A honestidade sobre o custo ('os textos de fevereiro tinham sido mais lidos que os de antes') impede que o capítulo vire moral fácil: a cópia funcionava, e mesmo assim era preciso sair dela."
problemas:
  - criterio: coerencia
    trecho: "Em abril, notou que a outra tinha começado a abrir os textos de um jeito novo, com uma pergunta de leitor transcrita no alto. Anotou só isto num cartão: pergunta real no alto, resposta em três partes. Era, afinal, o jeito dela mesma de pensar, e ela precisou ver na outra para reconhecer."
    por_que: "Duas contradições na seção final. (1) Com o arco: Lúcia descobriu o próprio modo no cap. 7, escreveu o enunciado no cap. 12 e responde à pergunta da amiga toda terça desde o cap. 8. Ela não 'precisou ver na outra para reconhecer' que pensa respondendo a uma pergunta real; faz isso há dois anos. (2) Com o método do próprio capítulo: a Tabela 22.1 dá 'Colegas da sua área' como risco 'Muito alto' e o 'Evite' diz 'Usar um colega da sua área como modelo'. A cena de fecho mostra a personagem-modelo tirando estrutura justamente de uma colega da área dela. Além disso, o cartão de abril não é usado: a cena seguinte usa 'o cartão da primeira sessão'. A seção 'O que a admiração ensina' termina sem dizer o que a admiração ensina."
    correcao: "Reescrever a seção. Opção: Lúcia continua lendo a psicóloga de São Paulo como leitora, não como fonte (sem cartão, sem caixa por perto), e o que a admiração ensina é o que ela NÃO faz: reconhece na outra uma distinção que ela mesma faria diferente e anota isso como posição, não como forma. Ou: cortar o episódio de abril e fechar direto na terça com o cartão da primeira sessão. Tirar 'ela precisou ver na outra para reconhecer'."
  - criterio: coerencia
    trecho: "Desde aquela conversa no grupo de estudos, em maio do ano anterior, ela sabia que a pergunta \"o que você já tentou para não sentir isso?\" desmontava a dúvida de quase qualquer paciente novo."
    por_que: "Linha do tempo errada: a conversa é do cap. 7 (maio do ano 1). O cap. 8 põe o dezembro seguinte e o janeiro do ano 2; o contraponto do cap. 17 é de agosto e setembro do ano 2 ('havia mais de um ano' que publicava). Este capítulo vai de dezembro do ano 2 a abril do ano 3. 'Maio do ano anterior' seria o ano 2, e a conversa foi quase dois anos antes. A remissão também está errada: no cap. 7 a pergunta 'desmontou a dúvida da colega', não a de pacientes. 'Quase qualquer paciente' é mais uma generalização. E 'a ordem que aquela conversa costumava seguir' mistura a conversa única do grupo com a primeira sessão, que se repete."
    correcao: "\"Lúcia encontrou a sua na primeira sessão com cada paciente novo. Fazia quase dois anos que tinha dito em voz alta, no grupo de estudos, o que fazia ali: perguntar 'o que você já tentou para não sentir isso?'. Escreveu num cartão a ordem que essas primeiras sessões costumam seguir: …\""
  - criterio: aplicabilidade
    trecho: "esqueleto:\n  - {rotulo: \"A cena\", texto: \"Uma situação comum, sem ninguém identificável.\", linhas: 2}"
    por_que: "A oficina pede que o leitor extraia a estrutura da referência DELE (campo 02) e escreva a peça inteira (campo 04, 7 linhas). Depois a rede diz 'Publique a peça da oficina' e manda rascunhar de novo, em 9 linhas, dentro da estrutura da Lúcia (cena, crença, onde falha, pergunta). Isso viola duas lições: 'o esqueleto da rede não repete a oficina; quando a oficina já escreveu as partes, o esqueleto é passe a limpo' (cap02-r2) e 'esqueleto e roteiro precisam servir a TODOS os exemplos' (cap02-r1). O esqueleto não serve nem ao exemplo da dermatologista, que tem estrutura de informação omitida. A roteiro_nota corrige só o roteiro."
    correcao: "Trocar o esqueleto por um 'passe a limpo' neutro, com rótulos que remetem ao campo 02 ('Parte 1 do seu esqueleto', 'Parte 2'… até 5, 2 linhas cada), usando esqueleto_rotulo. Ou manter os quatro rótulos da Lúcia só como exemplo, em texto, e deixar as linhas em branco com 'na ordem do seu campo 02'."
  - criterio: aplicabilidade
    trecho: "- {rotulo: \"Passei no teste da contaminação\", ajuda: \"Com sim na quarta pergunta (campo 05).\", pontos: 2}"
    por_que: "Quem marca 'sim' na pergunta 1 (há expressão reconhecível de outra pessoa) ou 'não' na 5 (abertura e fecho não são meus) ganha os pontos do teste da contaminação. O PWA cobra 'cinco perguntas verificadas'. Além disso, a pergunta 1 da grade é a única em que 'sim' reprova, o que confunde quem preenche a grade de cima para baixo (lição cap01-r2: testar a pontuação contra itens invertidos)."
    correcao: "Reescrever a linha 1 da grade como '1. Todas as expressões são minhas?' (e o item correspondente na nota: 'Alguma expressão…' -> 'Todas as expressões desta peça são minhas, sem nenhuma reconhecível como de outra pessoa?'). Checklist: 'Sim nas cinco perguntas (campo 05)'. Critério da oficina: 'As cinco respostas do campo 05 são sim; se a 4 for não, a peça não sai.'"
  - criterio: aplicabilidade
    trecho: "exemplo: \"O cartão da Lúcia: uma cena comum, composta de várias; a crença que ela esconde; por que a crença faz sentido; onde ela falha; uma pergunta para levar.\""
    por_que: "O único exemplo concreto da oficina é da personagem em foco (lição cap01-r1: exemplos da oficina em profissões diferentes da do personagem). Os campos 01 e 03 só têm instrução, e o 04 não tem nada. O leitor de outra área não vê como fica um esqueleto tirado, por exemplo, de uma crônica esportiva e aplicado a uma contadora. Os 30 minutos também supõem uma peça de referência já escolhida e à mão, e a oficina não diz isso."
    correcao: "Campo 02: exemplo de outra profissão e de outra fonte ('Uma nutricionista, a partir de uma coluna de futebol: 1. o lance que todo mundo viu; 2. o que ninguém viu no mesmo lance; 3. por que isso decide o jogo; 4. o que observar no próximo'). Campo 03: um exemplo curto de preenchimento na mesma profissão. Acrescentar ao objetivo ou ao tempo_nota: 'Tenha à mão, antes de começar, a peça escolhida.'"
  - criterio: voz
    trecho: "Admirar alguém da própria área não é o problema. [...] isso vinha da ordem, e não das frases. [...] O problema nunca foi olhar. Está no que se leva quando se olha"
    por_que: "Três antíteses explícitas na mesma seção ('As três camadas'), e a cena de abertura já teve a sua ('não era a frase de abertura nem o fecho. Era a ordem'). A lição cap01-r1 limita a uma por seção. O lint passa no limite (nao_e_e 2, virgula_e_nao 3), e é justamente o tique que a revisão deve cortar. 'A estrutura não pertence a ninguém' e 'ninguém é dono de nenhuma dessas formas' repetem a mesma ideia no mesmo parágrafo, e ela volta na figura e na verificação."
    correcao: "Manter só uma antítese na seção. Ex.: 'Admirar uma colega da própria área faz parte do ofício. A psicóloga de São Paulo escrevia bem…' / 'Gostava, na verdade, de chegar ao fim de cada texto com uma pergunta para fazer a si mesma, e isso vinha da ordem.' / 'O risco está no que se leva quando se olha, e na hora em que se olha.' Cortar 'e ninguém é dono de nenhuma dessas formas'."
  - criterio: coerencia
    trecho: "Falava de autocuidado nas férias, um tema que Lúcia nunca tinha trabalhado com nenhum paciente e sobre o qual não tinha nada de seu a dizer."
    por_que: "Férias são o território mais marcado da Lúcia no livro: o dezembro do cap. 8 e o padrão do cap. 9 (paciente que interrompe em dezembro e volta em março dizendo que 'estava tudo bem até o carnaval'). Dizer que ela nunca trabalhou o tema e não tem nada a dizer sobre ele soa falso para quem leu os capítulos anteriores. A 'posição que não sustentaria' também não aparece: o leitor não sabe o que o texto afirmava."
    correcao: "Escolher um tema de fato alheio à prática dela (ex.: 'rotina matinal de produtividade') e mostrar a afirmação que ela não sustentaria numa conversa com um colega, em uma frase entre aspas."
  - criterio: coerencia
    trecho: "Em três semanas de leitura diária, ela tinha trocado a própria voz pela de outra pessoa sem perceber que estava trocando."
    por_que: "A cena põe a leitura diária em janeiro e a mudança em fevereiro: são quatro a seis semanas, não três. Há outro furo no arco: Lúcia tem um manual de voz desde o cap. 11 ('a régua com que você revisa qualquer texto que leve o seu nome antes de publicar'), e o capítulo não explica por que ele não pegou três textos seguidos. O teste da contaminação poderia citá-lo."
    correcao: "'Em cinco semanas de leitura diária…'. Acrescentar uma frase na cena: 'O manual de voz do ano anterior estava na mesma gaveta; ela tinha parado de relê-lo em janeiro, quando as terças passaram a parecer fáceis.' Ou incluir na 5ª pergunta: 'A abertura e o fecho passam no seu manual de voz?'"
  - criterio: honestidade
    trecho: "a contaminação, como a de fevereiro, quase nunca é percebida por quem escreve"
    por_que: "Generalizações sobre terceiros sem fonte passam do limite de duas por capítulo (lição cap01-r4/cap02-r2): 'que muita gente da área lia', 'quase nunca é percebida por quem escreve', 'quase todo paciente passa' (no exemplo da dermatologista), 'quase qualquer paciente novo'."
    correcao: "'…porque a contaminação, como a de fevereiro, é difícil de ver de dentro: Lúcia só viu quando alguém perguntou.' Nos outros casos, 'que as colegas do grupo liam' e 'a quantidade de protetor que ela vê os pacientes passarem'."
  - criterio: originalidade
    trecho: "Escreve sobre algo que vê há anos no consultório: a quantidade de protetor que quase todo paciente passa, bem menor do que a que protege, com o jeito dela de abrir."
    por_que: "Três problemas no box. (1) A dermatologista falando de protetor solar já apareceu no cap. 3 ('por que o protetor solar aplicado de manhã protege pouco…'), e o clareamento dental é o exemplo do dentista no cap. 2. (2) A quantidade insuficiente de protetor está entre os temas mais repetidos da dermatologia nas redes, o oposto de 'uma informação que costuma ser omitida', e o 'singular' fica menos singular do que promete. (3) 'Com o jeito dela de abrir' diz em vez de mostrar."
    correcao: "Trocar a figurante e o assunto por algo menos batido e verificável (ex.: uma fonoaudióloga que usa a estrutura de um vídeo de mecânico e escreve sobre o que ela ouve na primeira consulta e que os pais nunca relatam). Mostrar a primeira frase dela entre aspas."
  - criterio: clareza
    trecho: "Os textos de fevereiro continuavam começando pela pergunta da amiga, em abstrato, e dando voltas antes de chegar ao ponto."
    por_que: "Dois parágrafos antes, os textos de fevereiro 'passaram a abrir com uma frase que não era dela'. Pela pergunta ou pela frase emprestada? 'Dando voltas' também faz o estilo nativo da Lúcia parecer defeito justamente onde o capítulo quer defendê-lo."
    correcao: "'Depois da frase emprestada, os textos de fevereiro seguiam a ordem de sempre da Lúcia, a pergunta da amiga posta em abstrato, e chegavam ao ponto só no fim.'"
edicoes_de_linha:
  - "\"Começava por uma cena de consultório composta de várias, sem ninguém dentro\" -> \"Começava por uma cena de consultório composta de várias, sem ninguém que se pudesse reconhecer\""
  - "roteiro: \"{a cena comum, sem ninguém}\" -> \"{a cena comum, sem ninguém identificável}\""
  - "figura, nota do Conteúdo: \"Foram atendidos por ela.\" -> \"Vieram do consultório dela.\""
  - "\"o capítulo 11 mostrou quanto tempo ela leva para se formar\" -> \"o capítulo 11 mostrou como ela se forma, frase repetida por frase repetida\" (o cap. 11 trata de léxico e manual de voz, não de tempo)"
  - "\"Lúcia deixou de ler a psicóloga de São Paulo no café da manhã e passou a ler, às quintas,\" -> \"Lúcia tirou a psicóloga de São Paulo do café da manhã e passou a ler, às quintas,\" (evita o choque com \"Lúcia não deixou de ler a psicóloga de São Paulo\")"
  - "\"o de uma aula de rádio que respondia a três ouvintes\" -> \"o de um programa de rádio que respondia a três ouvintes\" (mesmo nome que no parágrafo da fonte)"
  - "\"com o caderno de esqueletos por perto\" -> \"com a caixa de fichas por perto\" (os esqueletos estão em cartões numa caixa, não num caderno)"
  - "\"é provável que você não tenha repertório sobre aquele assunto\" -> \"você não tem repertório sobre aquele assunto\""
  - "verificação 02, opção correta: \"Porque a estrutura é de todos.\" -> \"Porque a estrutura circula há séculos e não é de ninguém.\" (hoje é a mais curta e salta aos olhos; a b, a mais longa, também denuncia)"
  - "legenda da figura: \"que são justamente as que não se levam\" -> \"que são as que não se levam\""
diagramacao:
  - "p. 13: cerca de 28% da página em branco depois de \"…a ordem.\", porque a figura 22.1 e o box Conceito passaram juntos para a p. 14. É evitável: deixar o parágrafo \"Há um motivo para as pessoas levarem a camada errada…\" antes da figura, ou permitir que a figura vá sozinha e o Conceito fique no pé da p. 13."
  - "p. 20: cerca de 20% em branco no pé depois do 'Confira antes de seguir', porque a rede abre em página nova (só a oficina começa em página nova). Verificar se a rede pode começar no pé da p. 20."
  - "p. 14: a legenda da figura 22.1 cola no último bloco ('Estrutura'), sem respiro. Dar ~2 mm de margem superior à legenda."
  - "p. 21: ~40% em branco antes do esqueleto indivisível. Aceito pelo projeto; some se o esqueleto virar 'passe a limpo' curto, como pedido acima."
veredito: "A cena de abertura e as imagens de pele e esqueleto são das melhores da Fase IV, mas o fecho contradiz o arco da Lúcia e a regra do próprio capítulo, a linha do tempo erra um ano e a rede/checklist enfraquecem a oficina; precisa de uma passada de coerência e de aplicabilidade antes de chegar a 9."
