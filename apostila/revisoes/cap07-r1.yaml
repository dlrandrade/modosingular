capitulo: 7
iteracao: 1
notas: {metodo: 8.8, voz: 8.5, originalidade: 8.7, clareza: 8.4, ritmo: 8.3, concretude: 8.6,
        coerencia: 7.8, aplicabilidade: 8.4, impresso: 7.8, honestidade: 8.3}
bloqueadores:
  - 'Número inventado apresentado como dado, na faixa "Modo dominante" do autodiagnóstico (p020): "Evite formatos do eixo mais baixo por pressão do mercado: para você, eles custam o triplo." Nada no livro mede esse "triplo"; um teste de duas perguntas por eixo não sustenta nenhuma razão de custo. Trocar por: "Evite formatos do eixo mais baixo por pressão do mercado: para você, são os que tendem a custar mais. O seu quadro de atrito do capítulo 5 mostra quanto."'
pontos_fortes:
  - 'A cena de abertura faz o que o plano pede e mostra cada modo em ação, com detalhe de ofício, antes de lhe dar nome. Renata encontra a própria marca falando ("Eu trato a dor como um alarme, e alarme a gente investiga antes de desligar", com "As mãos desenhavam no ar uma coluna"). Otávio precisa de papel para achar a tese ("Na primeira, rodeou o assunto. Na segunda, contou duas audiências. No fim da terceira, apareceu"). Caio chega à ideia pela história ("um apartamento de 1968, na Vila Itapura", "decidir o que não mexer"). É o melhor material do capítulo.'
  - 'A honestidade melhora em relação ao PWA. O "atrito saiu de 87 para 18" some. No lugar entra a autoavaliação da personagem, com a ressalva que o torna crível: "A nota de atrito dessa etapa, refeita duas semanas depois, caiu para 4. O tempo gasto continuou parecido, e sentar para começar ficou bem mais fácil." O teste é chamado de "estimativa" que "o caderno de campo [...] vai confirmar ou corrigir".'
  - 'Duas contribuições que vão além da fonte e ajudam o leitor. A distinção entre modo e personalidade ("Lúcia é reservada [...] e mesmo assim o modo dela é dialógico") separa timidez de modo. O par risco e remédio de cada modo ("O risco típico é a divagação [...] O remédio é cortar depois, nunca antes de falar") dá ao leitor um uso imediato para o diagnóstico.'
  - 'O caderno do livro está bem amarrado. O autodiagnóstico foi redesenhado por eixo, com quatro caixas de soma; o do PWA, com um total único de 8 a 40, não distinguia os modos. O campo 03 aproveita as notas de atrito do cap. 5. O roteiro trata só da área do leitor. O capítulo remete corretamente ao Apêndice C e ao cap. 24. O lint está limpo: 0 travessão, 0 frase-soco, frase média de 16,9 palavras com desvio de 7,9.'
problemas:
  - criterio: coerencia
    trecho: "Otávio aceitou e, ao ouvir a pergunta, “o que você diria a eles?”, gaguejou, deu duas respostas vagas e pediu um tempo."
    por_que: 'O trecho contradiz o capítulo anterior e reaproveita a assinatura do modo dialógico. No cap. 6, Otávio "passou a sobremesa explicando quando ele manda fazer acordo" e, diante da pergunta do estagiário, "levou vinte minutos para responder". É exatamente o sinal que este capítulo atribui a Lúcia ("Lúcia respondeu durante vinte minutos"; "diante de uma pergunta, desenvolve por vinte minutos"). Quem leu os dois capítulos em sequência vai concluir que Otávio é dialógico. O reforço também tem problema: "Otávio fala bem em audiência, onde tem papel e roteiro, e trava no improviso". Audiência trabalhista é justamente o lugar do improviso (inquirir testemunha, contraditar, responder ao juiz), e o próprio cap. 6 mostra uma testemunha desmentindo os cartões de ponto. É detalhe de ofício errado.'
    correcao: 'Delimitar o que trava no Otávio: ele responde bem a perguntas técnicas, que já trazem a estrutura, e trava quando precisa formular uma ideia própria, aberta, sem papel. Cena: "Otávio aceitou e, ao ouvir a pergunta, “o que você diria a eles?”, respondeu com duas generalidades que ele mesmo achou fracas e pediu um tempo. Pergunta de cliente ele responde de pronto; uma ideia dele, sem ninguém perguntando nada de concreto, precisava de papel." Personalidade: trocar a frase da audiência por "Otávio responde com segurança a qualquer dúvida de cliente, porque a dúvida já traz o assunto recortado; o que ele não consegue é achar de improviso, falando, uma ideia que ainda não escreveu." Seção Escrito: "cujas falas de improviso ficam aquém do que ele sabe" -> "cujas ideias próprias só ganham forma no papel". Tirar "vinte minutos" da subseção Dialógico ("desenvolve longamente"), para a marca ficar só na cena da Lúcia.'
  - criterio: coerencia
    trecho: "Quem é dialógico anota quase só perguntas; quem é narrativo anota casos, com começo, meio e fim."
    por_que: 'O cap. 6 plantou esta pista explicitamente ("A fonte que mais aparece no seu caderno diz alguma coisa sobre o seu jeito de pensar, e essa pista vai ser útil na próxima fase") e deu os dados: "Renata acumula perguntas", "No da Lúcia, sobram objeções e crenças". Pela regra deste capítulo, Renata seria dialógica e Lúcia não. A pista é paga ao contrário, e o leitor atento percebe. A regra também põe o sinal no assunto anotado, quando o que distingue o modo é a forma de anotar.'
    correcao: 'Deslocar o sinal do "o quê" para o "como" e pagar a pista com os dados do cap. 6: "O caderno de campo do capítulo 6 dá pistas antes de qualquer teste, mais pelo jeito de anotar do que pelo assunto. Renata acumula perguntas, mas metade delas está em áudio, gravada no carro. Otávio enche o caderno preto de frases que depois reescreve em casa. Caio anota casos com começo, meio e fim. Lúcia anota melhor quando responde a alguém: as crenças dos pacientes aparecem no caderno já com a pergunta que ela faria de volta. Se você já tem uma semana de anotações, olhe para elas como se fossem de outra pessoa e pergunte que tipo de cabeça as produziu."'
  - criterio: clareza
    trecho: "Para dois dos quatro modos, é também um dos formatos mais caros que existem. O oral precisa traduzir fala em texto; o dialógico precisa inventar sozinho as perguntas que o fariam pensar."
    por_que: 'O texto contradiz a figura que está logo acima, na mesma página (p016). Na matriz, a coluna Carrossel só tem "não combina" para o Oral. Para o Dialógico, o carrossel aparece como "às vezes", no mesmo nível de vídeo falado e texto longo e acima de "Vídeo de caso", que é o único "não combina" dessa linha. O leitor que compara figura e texto fica sem saber em qual acreditar.'
    correcao: '"Para o modo oral, é o formato mais caro da tabela: exige traduzir fala em texto antes de começar. Para o dialógico, custa caro sempre que não há uma pergunta de partida, porque ele precisa inventar sozinho as perguntas que o fariam pensar." A figura fica como está.'
  - criterio: coerencia
    trecho: "Quando o formato não corresponde ao modo, aparece uma etapa que ninguém vê: a tradução."
    por_que: 'O livro usa "tradução" em dois sentidos opostos. Aqui ela é o custo a evitar: "sai do começo, onde é caríssima", "é técnica, e técnica se resolve, se delega ou se automatiza". A Fase III chama-se "A Tradução", e o cap. 13, em rascunho, define "Tradução" como conceito do glossário, com o sentido inverso: "Traduzir é barato e produz específico" e é o gesto central, que não se delega. O leitor que chega ao cap. 13 com a definição deste capítulo na cabeça vai ler que deve fazer o que aqui aprendeu a terceirizar. A verificação agrava o problema, porque a alternativa "d" da questão 02 ("trocar os termos técnicos por palavras que o público entende") é quase o que a Fase III chamará de tradução, e deixa de ser um distrator falso.'
    correcao: 'Fixar "tradução de formato" neste capítulo, e no cap. 5 onde aparecer "etapa de tradução". Na primeira ocorrência, marcar a diferença numa frase: "aparece uma etapa que ninguém vê: a tradução de formato, que é passar o pensamento da forma em que ele nasce para a forma em que vai sair. (A fase III usa a palavra tradução em sentido mais largo, para a passagem da experiência à peça; aqui ela é só troca de forma.)" Aplicar o mesmo à nota-tese, ao guardar 2 e à questão 02 da verificação. Registrar a decisão na bíblia de termos.'
  - criterio: metodo
    trecho: "Na mesma semana de maio, em quatro cidades, quatro pessoas ouviram mais ou menos a mesma pergunta."
    por_que: 'O plano pede "Os quatro personagens diante da mesma pergunta", e a frase de abertura promete isso, mas as perguntas não são as mesmas. Renata ouve "o que ela fazia de diferente". Caio ouve "o que um arquiteto faz numa reforma que um bom engenheiro não faria". Otávio ouve o que diria aos alunos "sobre o que o curso não ensina". Lúcia recebe uma dúvida clínica ("quando a ansiedade [...] é o problema principal e quando é o sintoma"). O argumento do capítulo ("O mesmo talento, quatro caminhos") depende de a entrada ser a mesma. Com perguntas de natureza diferente, o leitor pode atribuir a diferença de desempenho à pergunta, e não ao modo.'
    correcao: 'Dar aos quatro a mesma pergunta de fundo, "o que você faz que os outros da sua área não fazem?". Renata e Caio já estão nela. Otávio: "sobre o que ele sabe hoje que nenhum professor ensinou". Lúcia: "num grupo de estudos de psicólogas, uma colega recém-formada perguntou a Lúcia o que ela faz, na primeira sessão, que os livros não ensinam. Lúcia respondeu durante vinte minutos [...]". Assim a abertura pode dizer "quatro pessoas ouviram, com outras palavras, a mesma pergunta".'
  - criterio: voz
    trecho: "Quase todo especialista já tentou o carrossel, porque é o formato que o mercado mais recomenda para quem quer parecer sério."
    por_que: 'O capítulo tem pelo menos sete generalizações sem fonte sobre terceiros, e a lição cap01-r4/cap02-r2 limita a duas: "Essa diferença costuma passar despercebida porque o mercado trata o formato", "A pergunta anterior, que quase ninguém faz", "Há um motivo histórico para tanta gente desconhecer o próprio modo. A escola avalia quase tudo por escrito", "Muitos especialistas excelentes carregam essa sentença", este trecho, "O caderno de campo do capítulo 6 costuma denunciar" e "Quase ninguém tem um modo puro. O mais comum é". A voz escorrega do mentor que viu casos para o texto de curso que afirma tendências. O parágrafo da escola, em particular, é uma tese de sociologia da educação sem apoio (a escola brasileira também avalia por seminário e prova oral) e é o único trecho do capítulo sem personagem.'
    correcao: 'Converter em observação de personagem ou cortar. Carrossel: "Renata escolheu o carrossel porque uma colega jurou que era o formato que “mais salvava”. Para o modo dela, era o mais caro da tabela." Parágrafo da escola: "Renata passou a escola ouvindo que “se comunicava mal”, porque as notas vinham das redações; só nos seminários da faculdade descobriu que explicava melhor que os colegas. Otávio viveu o contrário: tirava dez em redação e suava nas apresentações. Os dois carregaram essas sentenças por décadas, até a primeira tentativa de publicar." Modo puro: "Nenhum dos quatro tem um modo puro. Cada um tem um dominante e um secundário próximo". "costuma passar despercebida porque o mercado trata" -> "passa despercebida quando se trata". "que quase ninguém faz" -> cortar.'
  - criterio: ritmo
    trecho: "É o modo da Renata, que desenha no ar enquanto explica e descobre frases enquanto as diz. O risco típico é a divagação: a ideia aparece, mas cercada de voltas. O remédio é cortar depois, nunca antes de falar."
    por_que: 'O capítulo se organiza em três enumerações paralelas de quatro itens: as quatro cenas ("Em Curitiba [...] No Recife [...] Em Porto Alegre [...] Em Campinas"), as quatro subseções e as quatro rotas ("Renata passou a [...] Otávio continuou [...] Lúcia pediu [...] Caio passou a"). Some-se a isso a lista "Renata falando, Otávio escrevendo, Lúcia respondendo, Caio contando" e a lista "Renata diante de uma página em branco, Otávio diante de uma câmera...". O par personagem–modo é dito cinco vezes, contra o limite de duas da lição cap02-r1. As quatro subseções seguem o mesmo molde de sete frases (definição, sinal, "É o modo de X", "O risco típico é", "O remédio é") e soam como apostila de curso. Há parágrafos acima do limite de seis frases: as cenas da Renata e do Otávio e as quatro subseções têm sete cada.'
    correcao: 'Nas subseções, cortar "É o modo de X", porque as cenas já fizeram essa associação, e variar o desenho. Por exemplo, fundir risco e remédio numa frase só em duas delas ("A divagação é o preço: a ideia aparece cercada de voltas, e se corta depois, nunca antes de falar") e abrir outra pelo sinal em vez da definição. Cada uma com no máximo cinco frases. Nas cenas, dividir as de Renata e Otávio em dois parágrafos (Renata: quebrar antes de "No meio da explicação"; Otávio: antes de "Naquela noite"). No primeiro parágrafo de "O mesmo talento", cortar a segunda lista ("Renata diante de uma página em branco, [...] Caio obrigado a começar pela tese") ou a primeira, e não manter as duas.'
  - criterio: aplicabilidade
    trecho: "Uma soma supera as outras por 2 pontos ou mais. A sua rota está clara."
    por_que: 'As faixas se sobrepõem e não dizem em que ordem ler (lição cap01-r4). Com somas 6-4-3-2, o leitor está em "Modo dominante" e também em "Perfil difuso" ("Nenhuma soma passa de 6"). Com 6-6-6-6, está em "Duas empatam" e em "Todas baixas". Com 9-9-9-3, três empatam e nenhuma faixa diz o que fazer. Em "Modo duplo", "Use a mais alta como padrão" não tem sentido quando as duas estão "empatadas". E "A sua rota está clara" afirma mais do que dois itens por eixo conseguem medir: uma diferença de 2 pontos vem de uma única resposta.'
    correcao: 'Na instrução: "Leia as faixas na ordem e pare na primeira que descreve as suas somas." Faixas, nesta ordem. "Todas baixas / Perfil difuso: Nenhuma soma passa de 6, ou três ou mais somas empatam. [...] Refaça o teste depois de uma semana de caderno de campo." "Uma se destaca / Modo dominante: A maior soma supera todas as outras por 2 pontos ou mais. Você tem um candidato claro a modo dominante; o caderno de campo vai confirmar." "Duas empatam / Modo duplo: As duas maiores somas estão empatadas ou a 1 ponto. Use como padrão a que o seu caderno de campo mais confirma e a outra como plano B nos dias difíceis."'
  - criterio: coerencia
    trecho: "Definir um único ponto de captura e usá-lo sem trocar até o fim do livro."
    por_que: 'A regra contradiz o próprio capítulo. O texto diz que o teste "é uma estimativa, e o caderno de campo, nas próximas semanas, vai confirmá-la ou corrigi-la". A faixa "Perfil difuso" manda refazer o teste depois de uma semana. Ficar preso ao mesmo ponto de captura por 23 capítulos impede justamente a correção que o capítulo promete. O objetivo da oficina repete a rigidez ("para usar daqui até o fim do livro").'
    correcao: 'Faça assim: "Definir um único ponto de captura e usá-lo sem trocar por quatro semanas, até o caderno de campo confirmar ou corrigir o teste." Objetivo da oficina: "...numa rota concreta de captura e publicação para testar nas próximas semanas."'
  - criterio: coerencia
    trecho: "Contou a história de uma cliente que queria derrubar tudo para ter uma cozinha aberta, dos azulejos portugueses escondidos debaixo de três camadas de tinta, da parede que ele decidiu manter."
    por_que: 'O trecho gasta antes da hora um motivo reservado. A lição cap04-r1 guarda "dá para derrubar essa parede?" para o cap. 14, e o cap. 18 é o do "projeto que Caio recusou". A cena da cliente que quer derrubar e da parede mantida antecipa os dois. Há risco parecido com Otávio: a tese dele ("o processo trabalhista se decide muito mais pela prova do que pela lei") é vizinha demais de "contrato assinado não é prova de nada", a frase-marca do cap. 16, que o cap. 6 já rondou ("papel assinado vale pouco").'
    correcao: 'Caio: "Contou a história de uma cliente que queria pôr a cozinha inteira abaixo e dos azulejos portugueses que ele achou debaixo de três camadas de tinta, raspou um por um e deixou à vista na cozinha nova." A conclusão "decidir o que não mexer" continua de pé. Otávio: trocar a tese por uma que não seja do cap. 16, como "o advogado de uma pequena empresa passa mais tempo dizendo ao cliente o que não fazer do que defendendo o que já foi feito", que ecoa o cap. 6 ("primeiro o que não fazer").'
  - criterio: voz
    trecho: "Timidez e extroversão dizem como você se sente diante de gente. O modo diz como o seu pensamento se organiza. São perguntas diferentes, e a segunda é a que interessa aqui."
    por_que: 'É literalmente o molde vetado na lição cap01-r1 ("X e Y são coisas diferentes: a primeira… a segunda…"). A seção "O custo da tradução" tem mais duas antíteses explícitas: "O custo não estava em ter ideias, nem em publicar. Estava no meio." e "Não há nada de errado com vídeo nem com carrossel. O que custa caro é o desencontro entre o modo e o formato." O limite é uma por seção. A primeira dessas duas ainda repete a batida final do cap. 5 ("O atrito morava no meio").'
    correcao: 'Primeira: "Timidez e extroversão dizem como você se sente diante de gente; o modo diz como o seu pensamento se organiza, e é só dele que este capítulo trata." O corte do "São perguntas diferentes" já resolve o molde. Segunda: cortar "O custo não estava em ter ideias, nem em publicar. Estava no meio." e fechar em "em frases curtas e ordenadas, depois de dez horas de atendimento". Manter a antítese do vídeo e do carrossel, que é a da seção.'
  - criterio: aplicabilidade
    trecho: "O que é a etapa de tradução, e por que ela é perigosa?"
    por_que: 'A pergunta pede duas coisas, e a alternativa correta ("É converter o pensamento do modo natural para outro formato") só responde à primeira. O "por que é perigosa" fica sem resposta nas alternativas e aparece só no gabarito. A alternativa "d" deixou de ser inequivocamente falsa no contexto do livro (ver o problema da tradução).'
    correcao: 'Pergunta: "O que é a etapa de tradução de formato?" Alternativa "d": "É escolher o melhor horário do dia para publicar cada peça." O "perigosa" passa para a explicação do gabarito, que já o contém.'
  - criterio: aplicabilidade
    trecho: "“Capturo em áudio de três minutos entre atendimentos, transcrevo e publico como texto curto e como vídeo legendado.”"
    por_que: 'O exemplo desrespeita o critério da própria oficina ("A rota tem no máximo três etapas"). Um vídeo legendado não sai de um áudio sem gravar, editar e legendar, ou seja, pelo menos mais duas etapas. O exemplo do campo 02 usa "Um professor de cursinho", a mesma profissão do exemplo da oficina do cap. 5 ("Um professor de cursinho: “Sem a lousa...”"), e ela aparece de novo no cap. 10. A lição cap02-r2 veta repetir profissão em capítulos vizinhos. A primeira evidência ("Dou aula há seis anos sem usar slide") também não aponta para o modo oral: há professores que não usam slide porque escrevem na lousa.'
    correcao: 'Campo 04: "Uma dentista: “Capturo em áudio de três minutos entre um paciente e outro, transcrevo e publico como texto curto.”" Campo 02: "Uma professora de piano: “Explico uma passagem difícil tocando e falando, e a aluna entende na hora; por escrito, a mesma explicação vira uma página que ninguém lê.” “Meus e-mails longos ficam confusos, mas explico o mesmo assunto em dois minutos de áudio.”"'
  - criterio: aplicabilidade
    trecho: "{o assunto da sua área}, explicado do jeito mais simples que eu conheço: {a explicação direta}."
    por_que: 'Dito em voz alta, o roteiro tropeça na concordância, porque a maioria dos assuntos é feminina ("Dor lombar, explicado..."; "A rescisão, explicado..."). A primeira lacuna abre a frase em minúscula (p025). No esqueleto (p024), o rótulo "Onde travam" é ambíguo num capítulo em que "travar" descreve o próprio especialista diante do formato ("Sozinha, a pessoa trava", "teria travado"). O leitor pode entender que deve falar de onde ELE trava.'
    correcao: 'Roteiro: "Vou explicar {o assunto da sua área} do jeito mais simples que eu conheço: {a explicação direta}." Rótulo do esqueleto: "Onde as pessoas se confundem", e no roteiro "A dúvida que sempre aparece aqui é {onde as pessoas se confundem}".'
  - criterio: honestidade
    trecho: "legenda: Uma leitura aproximada, para orientar os primeiros testes."
    por_que: 'A matriz reproduz os valores 0/1/2 do PWA, e a regra das figuras manda marcar esses esquemas com "ilustrativo: true" e o selo "esquema ilustrativo". A legenda atenua o problema, mas o leitor vê bolinhas cheias e vazias com aparência de dado. O mesmo cuidado vale para o conceito e o guardar ("é a origem de quase toda inconstância"), uma quantificação sem base herdada do PWA.'
    correcao: 'Acrescentar "ilustrativo: true" à figura. No conceito e no guardar, trocar "a origem de quase toda inconstância" por "uma das origens mais comuns da inconstância" ou, melhor, "o jeito mais rápido de tornar a constância cara".'
edicoes_de_linha:
  - '"O sinal é que as melhores frases saem em conversa, e quase nunca na preparação." -> "O sinal é que as melhores frases saem em conversa, quase nunca quando ela se prepara."'
  - '"Todas saíram impressionadas." -> "A colega saiu com a dúvida desfeita." (menos aplauso, mais efeito)'
  - '"titulo: Uma pessoa de modo oral publicando carrossel sem sofrer" -> "titulo: Uma pediatra de modo oral publicando carrossel sem sofrer", e no singular "como explicaria à mãe de um paciente" (a regra de concretude pede profissão, não "uma pessoa").'
  - '"Sozinha, a pessoa trava; diante de uma pergunta, desenvolve por vinte minutos." -> "Sozinha, a pessoa trava; diante de uma pergunta, desenvolve longamente."'
  - '"Ele é uma estimativa, e o caderno de campo, nas próximas semanas, vai confirmá-la ou corrigi-la com dados da sua própria prática." -> "É uma estimativa. O caderno de campo, nas próximas semanas, vai confirmá-la ou corrigi-la com a sua própria prática."'
  - '"Caio, por exemplo, conta histórias muito bem falando, e isso o aproxima do oral" -> "Caio conta as histórias dele melhor em voz alta do que por escrito, e isso o aproxima do oral"'
  - '"O teste a seguir ajuda a identificar os seus dois primeiros." -> "O teste a seguir ajuda a identificar os seus dois primeiros modos."'
  - '"uma etapa técnica que se aprende, se delega ou se automatiza" (p017) e "técnica se resolve, se delega ou se automatiza" (nota-tese): a mesma tríade duas vezes em duas páginas; na prosa, trocar por "uma etapa técnica, que pode sair das suas mãos".'
diagramacao:
  - 'p016, figura 7.1: o cabeçalho "Perguntas do público" não cabe na coluna. "Perguntas" encosta em "Conversa" ("PerguntasConversa"), e "público" desce sobre o símbolo da linha Oral, em cinza sobre o fundo. Quebrar os rótulos em duas linhas com largura fixa por coluna, encurtar para "Perguntas" e "Conversa" com a explicação na legenda, ou girar os cabeçalhos. Falta também o selo "esquema ilustrativo".'
  - 'p019–p020: o autodiagnóstico quebra e as três faixas de leitura ficam sozinhas na p020, com cerca de 80% da página em branco. A estrutura manda que o autodiagnóstico caiba numa página. A p019 tem uns 15% livres; reduzir o respiro das linhas da escala (ou pôr as faixas em linha, abaixo das caixas de soma) resolve e devolve uma página ao capítulo.'
  - 'p015: cerca de 35% em branco depois de "Estava no meio.", porque a figura 7.1 foi empurrada para a p016. Deixar o texto seguinte fluir antes da figura, ou pôr a figura depois do parágrafo "Quase todo especialista...", preenche a página.'
  - 'p022: metade da página em branco depois do "Confira antes de seguir". As regras da rede (a metade superior da p023) cabem ali. Esse branco não é dos aceitos: a rede não precisa de página inteira, e o esqueleto indivisível só começa na p024.'
  - 'p013: cerca de 20% em branco no pé da página antes do box Conceito, que foi para a p014. É aceitável se não houver como puxar o box; conferir depois dos outros ajustes, porque a paginação muda.'
veredito: "Capítulo de boa matéria-prima, com cenas de abertura de editora e um autodiagnóstico melhor que o do PWA, mas reprovado nesta rodada: um número inventado nas faixas, contradições com o cap. 6 (o Otávio que responde vinte minutos e a pista do caderno paga ao contrário) e com a própria figura, o conflito do termo tradução com a Fase III e duas falhas de diagramação (figura 7.1 e faixas isoladas)."
