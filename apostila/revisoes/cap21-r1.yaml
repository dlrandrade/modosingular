capitulo: 21
iteracao: 1
notas: {metodo: 9.0, voz: 8.6, originalidade: 8.9, clareza: 8.6, ritmo: 8.8, concretude: 8.6,
        coerencia: 7.4, aplicabilidade: 8.3, impresso: 9.0, honestidade: 8.4}
bloqueadores:
  - "Contradição interna que faz o caso-modelo quebrar a regra de sigilo pelo calendário (cap. 19, decisão de 2026-09-28; lição cap13-r1). Os versos só começam 'na segunda quinzena de dezembro' (o primeiro, 'em meados de dezembro'), e 'nenhum verso sai antes de um mês do parecer que o originou'; logo, nenhum verso estava liberado antes de meados de janeiro. Mesmo assim, a figura afirma 'Publicou nas quatro semanas de janeiro' e Helena confirma 'Quatro, em quatro semanas'. As peças das duas primeiras semanas de janeiro ou saíram sem a espera (quebra do sigilo que o capítulo ensina) ou vieram de uma fonte que o texto não mostra. Somado a isso, a cena da sexta diz que 'O que antes começava do zero agora começava de quatro parágrafos prontos', quando os quatro da semana são justamente os que não podem ser usados. Correção: antecipar o início dos versos para a segunda quinzena de novembro (e a tentativa depois do jantar para novembro), ou dizer numa frase que as duas primeiras peças de janeiro saíram de perguntas de e-mail de novembro, já liberadas, do caderno de campo; e trocar 'começava de quatro parágrafos prontos' por 'começava de um maço de parágrafos prontos, datados'."
pontos_fortes:
  - "A imagem central é própria e memorável e nasce do modo do Otávio (pensa escrevendo): 'antes de fechar a pasta, virou a folha. No verso em branco, com a mesma caneta, escreveu um parágrafo'. O conceito de incorporação desce a um gesto físico de ofício, e o livro inteiro depois pode apontar para 'o verso do parecer' (os caps. 24 e 30 já o fazem)."
  - "A troca de destinatário é a melhor explicação prática do capítulo, com duas frases que um leitor apressado consegue repetir: 'recomendamos que a empresa implante controle mensal assinado' contra 'quem tem uma pequena empresa e usa banco de horas precisa de uma folha por mês, assinada, e de alguém que a confira'. Dá ao leitor uma técnica, não só um princípio."
  - "Tratamento honesto dos números do PWA: somem os '380 minutos no feed alheio' e o 'menos do que a maioria das pessoas gasta rolando o feed'; os 120 contra 40 minutos são do personagem e a figura diz isso ('Os números são do Otávio'). A rede também corrige bem o PWA, que mandava falar do próprio processo ('Isso levou X minutos'): aqui o Evite proíbe 'Falar da sua rotina, da sua disciplina ou do seu jeito de produzir', e a peça fica sobre a área do leitor."
  - "O fecho com o maço de treze versos lido por Helena ('Seis dos treze falavam, de um jeito ou de outro, de controle de horário') termina em consequência prática e planta o cap. 28 sem anunciá-lo."
problemas:
  - criterio: coerencia
    trecho: "Lembrou da regra que tinha anotado ao fazer a conta do ritmo, a de que peça que não sai não passa para a semana seguinte. Não compensou. Mas a culpa ficou"
    por_que: "A regra é da Renata: ela a anota no cap. 8 ('peça que não saiu na semana não passa para a seguinte') e o cap. 12 a põe na coluna dela ('a que falha não passa para a seguinte'); na coluna do Otávio está só 'janeiro manda'. Pior, o cap. 19 acabou de usar a mesma batida, quase com as mesmas palavras ('A regra que tinha anotado quando fez a conta do próprio ritmo continuava de pé... Cumpriu a regra e não compensou. Mas passou a semana com a sensação incômoda'). É a terceira vez da cena e a segunda em três capítulos (lições cap02-r1 e cap01-r2). E a frase ainda é contradita na p. 15: 'Otávio tentou esse primeiro... para compensar a sexta perdida'."
    correcao: "Cortar a regra e o 'Não compensou'. Manter a culpa e ligá-la à tentativa do jantar, que passa a ser a prova do custo do evento: 'Nas duas sextas perdidas de dezembro, Otávio passou o fim de semana com a sensação de dever alguma coisa. Na segunda semana, tentou pagar a dívida em casa, depois do jantar.' E cortar 'é ela que, repetida, faz muita gente desistir de vez' (generalização sem fonte)."
  - criterio: coerencia
    trecho: "Otávio nunca deixou de terminar um parecer por estar cansado, e por isso nunca deixou de escrever o verso."
    por_que: "Contradiz a seção 'O que sobra': 'Nem todo parecer deixa um verso... Otávio fecha a pasta sem virar a folha'. A frase também vende o ritual como infalível, o que o próprio capítulo desmente com razão."
    correcao: "'Otávio nunca deixou de terminar um parecer por estar cansado, e por isso nunca deixou de fazer a pergunta no fim dele.' (A pergunta é o que o ritual exige, segundo 'O que sobra'.)"
  - criterio: clareza
    trecho: "Duas horas seguidas, com energia e sem interrupção, quase nunca existiram, e era isso que o desenho antigo pedia toda sexta."
    por_que: "É a ideia-chave do capítulo (o formato do tempo) e está contradita pela história do próprio personagem: o bloco de duas horas 'Funcionou em setembro, outubro e novembro' e, pela figura, 'Publicou em onze das treze semanas'. Duas horas seguidas existiram quase sempre, e sumiram justamente no pior mês. O leitor atento fica sem saber qual é o argumento. O mesmo erro se repete no Para guardar 3 ('duas horas seguidas, com energia, quase nunca') e no gabarito da questão 4."
    correcao: "Reformular pelo pior mês, que é o critério do livro (cap. 8): 'Quarenta minutos em pedaços de cinco existiram na semana do Otávio até em janeiro. Duas horas seguidas, com energia e sem interrupção, existiam nas semanas boas e sumiam exatamente nas que mais importavam.' Guardar 3: 'O problema do tempo é de formato: quarenta minutos em pedaços sobrevivem ao pior mês; duas horas seguidas, não.'"
  - criterio: concretude
    trecho: "Assinou a última folha, conferiu as datas e, antes de fechar a pasta, virou a folha. No verso em branco, com a mesma caneta, escreveu um parágrafo."
    por_que: "A logística física não fecha e um advogado com 25 anos de prática estranharia. Se é a folha assinada do parecer, o verso vai para o cliente com a 'pilha de saída', ou, se é a via do arquivo, Otávio arranca a folha da assinatura antes de arquivar ('Otávio os tirou dos pareceres antes de arquivar'). E os pareceres ficam semanas na 'pasta de saída' esperando a data a lápis. Detalhe de ofício no caso central tem de ser exato (lição cap09-r1)."
    correcao: "Usar a marca do personagem ('escreve à mão antes de digitar'): o verso é o da última folha do rascunho à mão, que não vai ao cliente nem ao arquivo. 'Terminou à mão a última folha do rascunho do parecer... virou a folha.' A pasta de saída vira 'a pasta dos versos', e 'os tirou dos pareceres antes de arquivar' vira 'separou os rascunhos dos pareceres já digitados'. Os caps. 24 e 30 continuam valendo ('verso da última folha')."
  - criterio: honestidade
    trecho: "É o primeiro encaixe que quase todo mundo tenta, e um dos que menos duram."
    por_que: "Afirmação empírica sem fonte, e o capítulo passa do limite de duas generalizações sobre terceiros (lição cap01-r4/cap02-r2): 'faz muita gente desistir de vez', 'Há três lugares em que a produção costuma caber', 'Quase todo ofício que atende gente', 'quase todo mundo tenta', 'O problema do tempo costuma ser de formato', além de 'costuma falhar' na questão 3."
    correcao: "Alerta: 'Parece o horário mais livre e é o pior de todos. A energia de decidir já foi gasta no dia, o contexto do trabalho ficou no escritório, e a casa tem outras coisas a pedir.' (parar aí; a cena do Otávio que vem logo depois é a prova). 'Há três lugares em que a produção cabe sem pedir espaço novo'; 'Muito ofício que atende gente tem um momento...'. Questão 3: 'Por que o encaixe depois do jantar falhou para o Otávio?'."
  - criterio: aplicabilidade
    trecho: "Escolha uma lição escrita no seu encaixe há mais de um mês; a desta semana vai para a pasta, com a data em que pode sair."
    por_que: "No dia 21 o leitor começa os encaixes hoje; não existe lição 'escrita no seu encaixe há mais de um mês'. A rede fica inexecutável como está. E a técnica central do capítulo (reescrever para um estranho a recomendação que você já dá ao cliente) não é praticada em nenhum campo da oficina: o campo 01 só nomeia o momento."
    correcao: "Rede: 'Escolha no caderno de campo uma captura já liberada pela seleção do capítulo 19 e escreva a lição dela para um estranho. A que você escrever hoje no seu encaixe vai para o caderno, com a data em que pode sair.' Oficina: no campo 05 pedir 'O encaixe que você testou hoje, o que aconteceu e a primeira lição que ele deixou, escrita para um estranho (sem nome, cidade ou setor)', com 4 linhas, e um critério correspondente."
  - criterio: aplicabilidade
    trecho: "A sua semana modelo: marque o que acontece em cada dia"
    por_que: "A grade só tem caixas de marcar, mas o critério pede 'Cada dia marcado no campo 03 corresponde a um momento que já existe na sua rotina', o que não é verificável no papel (lição cap03-r3): uma marca não diz qual momento. E o campo 04 pede o custo sem que a grade registre minutos."
    correcao: "Trocar as caixas por células de escrita curta (hora e lugar, ex. '18h, mesa do consultório') ou acrescentar uma quarta coluna 'Momento e minutos'. Critério: 'Cada dia marcado no campo 03 tem hora, lugar e minutos anotados.'"
  - criterio: concretude
    trecho: "a orientação que o veterinário escreve para o tutor levar para casa, o laudo, o orçamento que explica por que um item custa o que custa, o bilhete que o marceneiro deixa com o móvel entregue"
    por_que: "Os dois figurantes nomeados reaparecem idênticos na oficina ('Uma veterinária: “A orientação que eu escrevo para o tutor levar para casa.” Um marceneiro: “O bilhete que eu deixo com a peça entregue.”'). Viola 'uma participação por profissão, sem repetir no mesmo capítulo', e o exemplo da oficina não ensina nada que a prosa não tenha dado. Marceneiro já está nos caps. 8 e 11; veterinária no 18."
    correcao: "Manter veterinário e marceneiro na prosa e trocar os exemplos da oficina por profissões novas e variadas: 'Uma fonoaudióloga: “A folha de exercícios que eu mando para os pais com o que observar em casa.” Um técnico de ar-condicionado: “O que eu escrevo na ordem de serviço sobre por que o aparelho voltou a pingar.”' (conferir ESTADO.yaml › figurantes)."
  - criterio: coerencia
    trecho: "Quem pensa respondendo rende logo depois de uma conversa, enquanto a pergunta ainda ecoa."
    por_que: "Três linhas antes, a Lúcia (que pensa respondendo) acha a transição dela 'antes do primeiro paciente, com a sala ainda vazia e a cabeça ainda sem as sessões', o oposto de 'logo depois de uma conversa'. No mesmo parágrafo, 'as mãos não são necessárias' para quem pensa falando briga com a marca da Renata ('desenha no ar com as mãos'); o cap. 30 trata isso como perda ('sem poder desenhar a coluna no ar')."
    correcao: "'Quem pensa respondendo rende quando tem uma pergunta na frente, e a da semana pode esperar até a manhã seguinte, como a da Lúcia.' E: 'Quem pensa falando tende a render no deslocamento, porque a voz está livre, mesmo que as mãos fiquem no volante.'"
  - criterio: voz
    trecho: "A semana do Otávio não serve para mais ninguém, e é por isso que ela funciona: foi montada a partir do que já acontecia na dele, e não pediu que ele virasse outra pessoa para cumprir."
    por_que: "Parágrafo de uma frase só, que tira a moral da tabela e soa como lema de curso; traz uma antítese com ', e não' na seção que já tem 'A diferença de minutos é grande, mas a de formato é maior' e o par 'Quarenta minutos... Duas horas...' (lição cap01-r1: no máximo uma antítese explícita por seção). 'Virar outra pessoa' ainda repete o bordão do Antes de começar. Na seção 'Evento e consequência' acontece o mesmo com 'Incorporar não quer dizer que a peça fica de graça... Quer dizer que...'."
    correcao: "Cortar o parágrafo e deixar a cena de Helena vir direto depois da figura. Em 'Evento e consequência': 'Incorporar tem custo: o parágrafo leva cinco minutos, e a sexta, vinte. O esforço, porém, fica preso a alguma coisa que ia acontecer de qualquer jeito...'."
  - criterio: concretude
    trecho: "Dizia que o banco de horas é o acordo que mais protege uma pequena empresa e o que mais a expõe, porque só vale se houver controle mês a mês, assinado pelo funcionário. Sem o controle, um ano de horas compensadas"
    por_que: "O Otávio falaria com mais rigor. O que dá validade ao banco de horas é o acordo escrito (individual até seis meses; o anual depende de negociação coletiva, art. 59 da CLT), e o controle assinado é o que o sustenta na Justiça. 'Um ano' num acordo de pequena empresa sugere o banco anual por acordo individual, que a lei não permite. Um advogado trabalhista vai tropeçar aqui."
    correcao: "'...porque só se sustenta numa ação se houver acordo escrito e controle mês a mês, assinado pelo funcionário. Sem o controle, seis meses de horas compensadas viram seis meses de horas extras não pagas...'"
  - criterio: coerencia
    trecho: "Era o quarto parágrafo daquela semana."
    por_que: "Terça à noite já são quatro; na sexta, Otávio 'deixou os quatro versos da semana onde estavam', ou seja, nenhum parecer entre quarta e sexta, no janeiro de 'dezessete pareceres' em três semanas. A tabela também diz 'três a cinco vezes' por semana, abaixo do próprio ritmo de janeiro. Contas de personagem têm de fechar (lição cap01-r1)."
    correcao: "Na terça: 'Era o terceiro parágrafo daquela semana.' Na sexta: 'deixou os seis versos da semana'. Na tabela: 'Cinco minutos, quatro a seis vezes'. Conferir o total ('cerca de quarenta minutos') depois da troca."
  - criterio: clareza
    trecho: "O que mais pesava no desenho antigo do Otávio?"
    por_que: "O distrator 'O número de minutos, que era alto demais.' não é inequivocamente falso: o próprio texto diz 'A diferença de minutos é grande' (120 contra 40). E a correta é a única com dois-pontos e desdobramento, o que a denuncia (lição cap01-r1)."
    correcao: "Trocar o distrator por 'A falta de assuntos guardados no caderno.' e encurtar a correta para 'O formato do tempo que ele exigia.'"
edicoes_de_linha:
  - "Antes de escolher o encaixe, vale procurar o seu verso do parecer. -> Antes de escolher o encaixe, procure o seu verso do parecer."
  - "Pegou um dos primeiros que tinha escrito, em meados de dezembro -> Pegou um dos primeiros que tinha escrito, na segunda quinzena de dezembro (alinhar com 'O que mudou, na segunda quinzena de dezembro'; ou ajustar ambos conforme a correção do bloqueador)"
  - "e nenhum dos dois tinha percebido enquanto os escrevia -> e Otávio não tinha percebido enquanto os escrevia (Helena não escreveu os versos)"
  - "Publicou em onze das treze semanas de setembro a novembro, e caiu duas vezes em dezembro. -> Funcionou de setembro a novembro e caiu duas vezes em dezembro. (ou, se mantiver 11/13, trocar na prosa 'Funcionou em setembro, outubro e novembro' por 'Funcionou quase sempre de setembro a novembro')"
  - "O parágrafo das oficinas saiu em fevereiro, falando de pequenas empresas. -> cortar; a informação já está em 'O das oficinas ficou para fevereiro', duas páginas antes."
  - "Uma transição funciona porque a pessoa ainda está dentro do trabalho -> Uma transição funciona porque a pessoa está dentro do trabalho (a da Lúcia é antes do primeiro paciente, não depois)"
  - "Escolha uma lição escrita no seu encaixe há mais de um mês; a desta semana vai para a pasta -> (ver problema de aplicabilidade) ... vai para o caderno de campo; 'pasta' é objeto do Otávio, não do leitor"
diagramacao:
  - "p. 11: a ilustração de abertura (engrenagem) é a mesma dos caps. 20 e 5; em capítulos consecutivos, o leitor vira a página e vê a mesma abertura. Trocar por outra da lista em um dos dois capítulos, ou ao menos variar o desenho."
  - "p. 17: a Figura 21.1 tem só duas barras e repete em prosa o que a Tabela 21.1 da p. 16 já mostrou; o subtítulo 'minutos por semana, medidos por ele' em sans negrito concorre com os rótulos das barras. Aceitável, mas vale deixar o subtítulo em corpo menor e sem negrito."
  - "p. 20: a grade do campo 03 só tem caixas de marcar; não há espaço para escrever hora, lugar ou minutos, que são o que o critério e o campo 04 pedem (ver problema de aplicabilidade)."
  - "p. 19 e p. 21: cerca de um terço da página em branco antes da grade (p. 20) e do esqueleto (p. 22), ambos indivisíveis; aceito pelo projeto. p. 18 (Para guardar sozinho antes da oficina) também aceito."
veredito: "Capítulo com a melhor imagem da Fase IV (o verso do parecer) e boa adaptação do PWA, mas a linha do tempo do Otávio não fecha com a regra de sigilo que ele próprio ensina, a regra e a batida da Renata foram reaproveitadas, e a rede pede uma lição de mais de um mês que o leitor ainda não tem; precisa de uma passada de coerência e de ajuste na oficina."
