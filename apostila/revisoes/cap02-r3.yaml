bloqueadores: []
pontos_fortes:
  - 'A abertura continua sendo a melhor cena da Fase I e mostra o modo da Lúcia logo na primeira fala: "Lúcia não discutiu. Perguntou: “E quem disse que era um teste?”". A correção clínica pedida na r2 entrou bem: "Foram três sessões até a culpa por ter “falhado” num protocolo dar lugar a outra pergunta: como aquela ansiedade funcionava nela." Agora a Lúcia fala como psicóloga, sem tratar as sessões como tempo perdido.'
  - 'As contradições internas da r2 foram resolvidas. A peça que a Lúcia escolhe é a mesma nos três lugares: na seção 4 ("a culpa de quem “falha” num protocolo de vinte e um dias"), na cena final ("Foi pela que tinha levado Débora à sala dela") e no gabarito da Q3 ("a de que ansiedade se elimina com um protocolo e um prazo"). A pergunta-chave também está idêntica na prosa, no Para guardar e na Q4. A cena do café fecha a contradição anterior: "tinha respondido “não” à primeira sem pensar duas vezes [...] “A mulher do protocolo, não.”"'
  - 'Oficina e rede formam um sistema que funciona no papel. Os campos 01 a 04 escrevem as partes da peça, o esqueleto é só "Passe a limpo, em frases de quem lê", o campo 05 corresponde ao item 3 do checklist e o campo 01 somado ao 06 dá os cinco equívocos do item 1. A regra de ouro está íntegra: o roteiro não fala de internet nem de publicação, e a nota protege saúde, direito e finanças.'
  - 'O detalhe de ética agora está certo e bem dosado: "é vedado prometer resultado, fazer divulgação sensacionalista, expor qualquer pessoa atendida". A frase "Informar, esclarecer e corrigir uma crença [...] faz parte do papel de quem entende do assunto" está de acordo com o espírito do Código de Ética do Psicólogo (princípio V e art. 20). A veterinária e a sola do sapato continuam sendo o melhor exemplo fora da clínica.'
problemas:
  - criterio: voz
    trecho: "Lúcia não publicou nada naquela semana. Fez uma coisa mais útil: abriu uma nota no celular"
    por_que: 'A lição cap04-r1 diz que a batida "personagem não fez o óbvio; fez outra coisa" está esgotada na Fase I e manda abrir os desfechos pela ação. Aqui ela aparece duas vezes nos três últimos parágrafos da prosa, justamente no fecho do capítulo. A segunda ocorrência é "Naquela noite, escolheu por onde começar, e não foi pela frase mais repetida da lista. Foi pela que tinha levado Débora à sala dela." O leitor que acabou de ler os capítulos 1, 3 e 4 reconhece o molde.'
    correcao: 'Abrir pela ação nas duas: "Naquela semana, Lúcia abriu uma nota no celular e passou a anotar, ao fim de cada dia, as perguntas e as crenças com que os pacientes chegavam." E: "Naquela noite, escolheu por onde começar: a frase que tinha levado Débora à sala dela, embora não fosse a mais repetida da lista."'
  - criterio: honestidade
    trecho: "Tem, em compensação, três coisas que faltam a muita gente competente"
    por_que: 'A lição cap01-r4/cap02-r2 limita a 2 por capítulo as generalizações sobre terceiros com "muita gente", "costuma(m)", "a maioria" ou "quase todo". O capítulo tem quatro, e três delas são o mesmo molde "muito X": "três coisas que faltam a muita gente competente"; "Para muita gente, publicar é sinônimo de se promover"; "e muito profissional competente tem" (pudor); "o desejo de muito especialista sério é ficar longe dos holofotes". Além de afirmar sem fonte, a repetição vira um tique audível.'
    correcao: 'Manter só "Para muita gente, publicar é sinônimo de se promover", que descreve uma percepção. Nas outras, ancorar na personagem, o que também ganha concretude: "três coisas que faltavam à Lúcia e às colegas que ela respeitava"; "Quem tem pudor de autopromoção conclui que não tem nada a fazer na internet" (cortar a intercalada); "A pergunta trava porque mede desejo, e o desejo dela era ficar longe de qualquer vitrine."'
  - criterio: coerencia
    trecho: "O que o especialista tem e o ocupante do espaço não tem, a noção das exceções, do risco, do que não serve para todo mundo, é o que falta à conversa pública."
    por_que: 'A sobreposição com o cap. 1, apontada na r2, diminuiu mas não acabou. No cap. 1 a cardiologista já sente "ver o próprio lugar ocupado por quem sabe menos. A raiva é compreensível. O problema é que ela não publica nada." Esse é o argumento do cap. 2 inteiro, e aqui ele volta no intertítulo "Quem está ocupando o seu lugar" e no fecho "é que só apareça quem sabe menos". A r2 pediu para trocar a segunda ocorrência de "exceções". Ela ficou, e ecoa o cap. 1 ("Quem entende de verdade conhece as exceções") e o cap. 3 ("Exceção nomeada"). A frase ainda é a mais pesada da seção, com uma aposição longa entre vírgulas que obriga o leitor a reler.'
    correcao: 'No cap. 2, trocar pela coisa concreta da área da Lúcia: "À conversa pública falta o que a mulher do vídeo não tem: saber quando a respiração em quatro tempos não basta, o que pode piorar, para quem aquilo não serve." No cap. 1, na revisão de coerência da Fase I, cortar "O problema é que ela não publica nada" e "ocupado por quem sabe menos", deixando a cena só no reconhecimento, que é o tema de lá.'
  - criterio: aplicabilidade
    trecho: "“A pergunta certa não é se clareia. É se o seu dente já reage a gelado: se reage, a concentração começa baixa e o tempo de cada sessão é menor.”"
    por_que: 'O campo pede "O critério que a pessoa leva para decidir sozinha", mas o exemplo descreve a conduta do dentista (concentração e tempo), que o paciente não controla. Além disso, o modelo que o leitor vai copiar é exatamente a antítese "não é X. É Y" que o livro limita na prosa. Quem imita o exemplo aprende o tique e uma régua que não é de quem lê.'
    correcao: '"“Antes de clarear, veja se o seu dente já reage a gelado. Se reage, diga isso ao dentista e peça para começar com concentração baixa e sessões mais curtas. Se ele não perguntar, pergunte você.”" (É uma régua que o paciente usa sozinho em qualquer consultório.)'
  - criterio: coerencia
    trecho: "Não precisa de mim para usar. Guarda aí."
    por_que: 'A nota logo abaixo manda deixar claro, em saúde, direito e finanças, "que o critério orienta, mas não substitui uma avaliação individual". Para a Lúcia, para o dentista ou para qualquer profissional de saúde que leia o livro, a última linha do roteiro diz o contrário da nota. O leitor recebe duas instruções que se anulam na mesma página (p023).'
    correcao: '"Essa régua é sua. Guarda aí." Isso mantém a generosidade e não compete com a ressalva.'
  - criterio: ritmo
    trecho: "Antes de escrever a primeira linha, porém, releu o que o código de ética da profissão diz sobre publicidade."
    por_que: 'A r2 apontou isto e não foi resolvido. "A pergunta que decide" cobre a pergunta, a balança, o café, o código de ética, a lista de trinta e uma linhas, a escolha da peça e a primeira frase escrita. Metade da seção está fora do que o intertítulo promete (lição cap01-r2), e a cena final perde o respiro de uma entrada própria.'
    correcao: 'Manter 5 intertítulos: fundir "Quem está ocupando o seu lugar" em "O espaço vazio não fica vazio" (é continuação do mesmo argumento) e abrir "Trinta e uma linhas" antes de "Naquela semana, Lúcia abriu uma nota…". O parágrafo de ética fica como fecho de "A pergunta que decide".'
  - criterio: voz
    trecho: "Falar com as palavras do público e voltar no dia seguinte se aprendem; a terceira e a quarta fases deste livro existem para isso."
    por_que: 'É o narrador anunciando o sumário. A r2 marcou o tom, e ele ficou. Na mesma linha de fórmula pronta estão "Quando Lúcia entendeu essa diferença, alguma coisa destravou." ("alguma coisa destravou" é vago e próximo de "virar a chave") e "ficar longe dos holofotes".'
    correcao: '"Falar com as palavras do público e voltar no dia seguinte se aprendem." (ponto final; a remissão é desnecessária). "Quando Lúcia entendeu essa diferença, percebeu que podia falar da culpa de quem “falha”…" (cortar "alguma coisa destravou" e fundir as frases). "holofotes": ver o problema de honestidade acima.'
  - criterio: clareza
    trecho: "Lembrou de um texto de uma professora da formação que corrigia, com cuidado, uma crença comum sobre terapia; circulou entre os colegas mais críticos"
    por_que: 'O sujeito de "circulou" é ambíguo: pode ser a professora ou o texto. Numa leitura rápida, parece que foi a professora que circulou entre os colegas. "Lembrou de" também destoa do registro culto do resto do livro.'
    correcao: '"Lembrou-se de um texto em que uma professora da formação corrigia, com cuidado, uma crença comum sobre terapia. O texto circulou entre os colegas mais críticos sem que ninguém falasse em exibicionismo."'
  - criterio: clareza
    trecho: "mostra que a disputa pelo espaço tem regras simples: ganha quem aparece."
    por_que: '"Regras", no plural, anuncia várias e entrega uma só. E "ganha quem aparece" deixa de lado o que o parágrafo anterior acabou de estabelecer: a mulher do vídeo ganha porque responde à pergunta real, com as palavras do público, e volta no dia seguinte.'
    correcao: '"mostra que a disputa pelo espaço tem uma regra simples: ganha quem aparece e volta no dia seguinte."'
  - criterio: coerencia
    trecho: "“Se você seguiu um protocolo de vinte e um dias e a ansiedade continuou, o que falhou foi a promessa de prazo."
    por_que: 'A seção de rede manda evitar "Indireta a um concorrente identificável". Dentro da história, "o protocolo de vinte e um dias" é a assinatura da "mulher do protocolo", que publica todo dia. A primeira linha da Lúcia pode ser lida como indireta a ela, justamente na cena que serve de modelo para o leitor. O risco é pequeno, porque "21 dias" é um clichê difundido, mas vale uma palavra.'
    correcao: '"“Se você seguiu à risca um protocolo com prazo para acabar com a ansiedade e ela continuou, o que falhou foi a promessa de prazo.”" Isso mantém a ligação com Débora sem apontar para ninguém. Se preferir manter "vinte e um dias", acrescentar na prosa uma linha dizendo que o número aparece em dezenas de vídeos.'
edicoes_de_linha:
  - 'e ela não queria ser uma delas -> e ela não queria ser vista assim ("delas" não tem antecedente plural; a frase fala de "psicóloga que aparecia demais").'
  - 'Ela gosta da discrição do consultório -> Gostava da discrição do consultório (o parágrafo inteiro está no pretérito: "temia", "dava", "era").'
  - 'O sigilo tem capítulo próprio mais adiante. Do lado de fora, porém, a ausência produz isto, com ou sem intenção: -> O sigilo tem capítulo próprio mais adiante. Do lado de fora da sala, a ausência produz isto: ("porém" não contrasta com nada, e o título da tabela já diz "mesmo sem intenção").'
  - 'O assunto seria a ideia, amplamente difundida, de que -> O assunto seria a ideia, repetida em dezenas de vídeos, de que (retoma o que a Lúcia viu em vez de afirmar a difusão).'
  - 'Seria um texto sobre a dúvida de milhares de pessoas -> Seria um texto sobre uma dúvida que chegava ao consultório dela toda semana (troca um número sem fonte por uma observação da personagem).'
  - 'Roteiro: "Tem uma coisa que eu ouço toda semana, e que parece fazer todo sentido." -> "Tem uma coisa que eu ouço toda semana:" (a linha "E dá para entender por que tanta gente acredita nisso" já diz que a crença faz sentido; hoje o roteiro diz isso duas vezes seguidas).'
  - 'Faça assim 2: "“O que mudou foi isto”, ou “o que falta nessa ideia é isto”. Hoje, na prática, o que eu vejo é aquilo." -> "“O que mudou foi isto” ou “o que falta nessa ideia é isto”, seguido de “hoje, na prática, o que eu vejo é…”." (a metade sem aspas parece instrução, e "é aquilo" soa estranho).'
  - 'Q2, opção c: "Quem é o assunto: você ou o problema de quem lê." -> "Quem é o assunto, você ou quem lê." (a correta é a única com dois-pontos e a mais longa; igualar o porte das opções).'
diagramacao:
  - 'p015: cerca de 22% em branco no pé, depois da nota "A conta invisível do silêncio". "Quem é o assunto da peça" foi inteiro para a p016, porque o intertítulo segue preso ao quadro compara. É branco evitável: deixar o intertítulo e o primeiro parágrafo na p015 e o compara abrir a p016, ou subir a nota para antes da tabela.'
  - 'p016: cerca de 20% em branco no pé. "A pergunta que decide" e o primeiro parágrafo (5 linhas) cabiam ali, e hoje abrem a p017. Branco evitável; conferir a regra de manter o intertítulo junto do bloco seguinte.'
  - 'p021: cerca de 55% em branco depois das três regras, porque o esqueleto (indivisível) foi para a p022. O projeto aceita esse branco, mas o esqueleto é só uns 5% mais alto que o espaço livre. Reduzir o respiro entre as quatro partes, ou pôr a instrução de cada parte na mesma linha do rótulo, faria o esqueleto caber na p021. Aí a p022 recebe Faça/Evite e o roteiro, e a p022 deixa de ter o branco atual (ver abaixo).'
  - 'p022: cerca de 35% em branco no pé, porque o roteiro de fala não coube. Isso se resolve junto com o item da p021.'
  - 'p021: o "Confira antes de seguir" da oficina continua abrindo a página da rede (apontado na r2). O fio grosso agora separa os dois, o que é aceitável, mas ele ficaria melhor fechando a p020 se o campo 06 perdesse uma linha, ou com um rótulo "Oficina · critérios".'
  - 'p011: a epígrafe quebra com "lugar." sozinho na segunda linha. Estreitar a medida da epígrafe para equilibrar as duas linhas ou alargá-la para caber numa só.'
veredito: "Aprovável na r3 (média estimada 9,05): o capítulo resolveu as contradições e o detalhe de ética da r2 e tem a melhor abertura da Fase I. Para ficar folgado acima do gate faltam uma passada de voz (a batida 'não fez X; fez Y' duas vezes no fecho e quatro 'muita gente/muito X'), a régua do dentista reescrita como critério do paciente, o 'Não precisa de mim' do roteiro alinhado à nota e dois brancos evitáveis (p015 e p016)."
