bloqueadores: []
pontos_fortes:
  - "O bloqueador da r1 foi resolvido com uma solução crível: 'As duas primeiras sextas de janeiro, antes que qualquer verso passasse da data, tinham saído de perguntas de e-mail de novembro, já liberadas, que estavam no caderno de campo.' A linha do tempo agora fecha (versos da segunda quinzena de dezembro liberados a partir da terceira semana de janeiro), e o caso-modelo mostra a espera que o cap. 13 ensina."
  - "A imagem central continua a melhor da Fase IV e agora tem logística de ofício correta, presa à marca do personagem (escreve à mão antes de digitar): 'Terminou à mão a última folha do rascunho [...] virou a folha. No verso em branco, com a mesma caneta, escreveu um parágrafo.' A troca de destinatário ('A primeira frase era para quem já estava sentado diante dele. A segunda era para quem ainda não sabia que precisava estar.') é técnica que o leitor consegue repetir."
  - "O argumento do formato do tempo foi corrigido na prosa e no Para guardar, agora medido pelo pior mês, como pede o livro: 'Duas horas seguidas, com energia e sem interrupção, existiam nas semanas boas e sumiam exatamente nas que mais importavam.' A frase 'Presa a esse momento, a peça herda a regularidade dele' é a melhor formulação do conceito em todo o capítulo."
  - "Boa disciplina com o PWA e a regra de ouro: somem o feed alheio e os 380 minutos, os números da figura são do personagem ('Os números são do Otávio'), o roteiro troca o 'Estou entre dois atendimentos' do PWA por uma peça 100% sobre a área, o Evite proíbe 'Falar da sua rotina, da sua disciplina ou do seu jeito de produzir', e a 'versão mínima para semana ruim' do PWA foi retirada, preservando o protocolo reservado ao cap. 29."
problemas:
  - criterio: coerencia
    trecho: "Por isso nenhum verso sai antes de um mês do parecer que o originou"
    por_que: "A regra de sigilo pelo calendário já foi fixada no livro com outra âncora: cap. 13, 'nunca antes de um mês depois do último atendimento em que o assunto apareceu'; cap. 19, 'Um mês depois do último atendimento em que o assunto apareceu, no mínimo'. Aqui ela enfraquece para 'um mês do parecer que o originou', e a rede repete a versão fraca ('Deixe passar um mês.'). Uma regra operacional tem de aparecer idêntica em todo o livro (lição cap03-r1), e a diferença não é detalhe: o próprio capítulo diz que 'Seis dos treze falavam [...] de controle de horário' e que os pareceres de janeiro eram 'quase todos sobre rescisões'; pela regra do cap. 13, um verso sobre banco de horas ou sobre advertência na demissão dificilmente estaria liberado em janeiro. O caso-modelo e a rede ensinam ao leitor uma espera mais curta que a do livro."
    correcao: "Prosa: 'Por isso nenhum verso sai antes de um mês do último parecer sobre o mesmo assunto, a regra do capítulo 13: o da semana vai para a pasta com a data a lápis, e a data anda quando o assunto volta.' Se o assunto for padrão da carteira inteira (banco de horas em pequena empresa), dizer isso numa frase, como o cap. 13 prevê ('ou esperar até que ele se torne um padrão'). Rede, regra 2: 'Deixe passar um mês do último atendimento sobre o assunto.' Conferir se 'O das oficinas ficou para fevereiro' continua possível; se não, 'ficou para março'."
  - criterio: metodo
    trecho: "Escreva a lição para um estranho."
    por_que: "Regra de produção da rede dada no modo escrito para todos os leitores, o que a lição cap11-r1/cap12-r1 proíbe ('regras de produção dizem no seu modo, nunca grave ou escreva para todos'). A intro repete ('escreva a lição dela para um estranho'). O capítulo acabou de explicar que quem pensa falando rende gravando no carro e quem pensa contando rende com a obra na frente; a regra 1 contradiz o parágrafo dos modos. No papel (oficina, campo 05) escrever é aceitável; na peça, não."
    correcao: "Regra 1: 'Dirija a lição a um estranho, no seu modo.' Intro: '...e faça a lição dela para um estranho, no formato-base do capítulo 20.' O roteiro de fala já cobre quem grava."
  - criterio: aplicabilidade
    trecho: "A sua semana modelo: em cada dia, a hora, o lugar e os minutos"
    por_que: "O problema da r1 continua no impresso: a grade (p. 20) tem 21 caixinhas de cerca de 2 cm por 1 cm, sem linha de escrita. Não cabe à mão 'hora, lugar e minutos' em cada uma, e o critério agora cobra exatamente isso ('Cada dia preenchido no campo 03 tem hora, lugar e minutos'). O campo pede o que o espaço não comporta, e o critério fica inverificável."
    correcao: "Trocar a grade por uma tabela de escrita: linhas = dias; colunas = 'Momento (hora e lugar)', 'O que faço (captura, seleção ou produção)', 'Minutos'. Largura suficiente para '18h, mesa do escritório' na primeira coluna. Se o componente 'grade' não permitir, usar sete linhas de escrita rotuladas com o dia."
  - criterio: coerencia
    trecho: "Quem pensa contando rende no lugar em que a história aconteceu, no intervalo, com a obra na frente."
    por_que: "Contradiz a cena canônica do cap. 20: Caio escreve às sete e quarenta no degrau de um prédio sobre uma foto de junho, de 'uma obra entregue em agosto', e depois 'subiu para a obra do dia, que não tinha nada a ver com a peça'. Ele não está no lugar em que a história aconteceu. O mesmo desencaixe aparece em 'O primeiro é o intervalo, entre um atendimento e outro: [...] onde Caio escreve as cinco linhas, no degrau': o degrau das 7h40, antes de subir, é começo de turno, uma transição, e a do cap. 12 é 'na quinta de manhã'."
    correcao: "'Quem pensa contando rende com a história na frente, mesmo que seja numa foto: Caio escreve as cinco linhas no degrau, antes de subir para a obra do dia.' E mover o Caio do intervalo para a transição (ou trocar o exemplo do intervalo: 'onde Renata grava os áudios de vinte segundos, no corredor', basta)."
  - criterio: concretude
    trecho: "Terminou à mão a última folha do rascunho, a que Helena digitaria no dia seguinte"
    por_que: "Helena é 'a sócia mais nova do escritório' (cap. 4) e, no cap. 28, é quem conduz a planilha de origem dos clientes. Pô-la para digitar os rascunhos do sócio a rebaixa a secretária. E a logística volta a falhar: a folha que Helena precisa digitar no dia seguinte vai direto para 'a pasta dos versos' ('Depois pôs a folha na pasta dos versos e foi embora'), e no fim do mês Otávio 'separou os rascunhos dos pareceres já digitados', como se a pasta tivesse folhas ainda não digitadas."
    correcao: "'Terminou à mão a última folha do rascunho, a que a secretária digitaria no dia seguinte [...] Depois pôs a folha na bandeja da digitação com um clipe vermelho, o sinal de que ela voltava para a pasta dos versos.' No fim de janeiro, cortar 'separou os rascunhos dos pareceres já digitados,' e deixar 'grampeou os versos num maço'."
  - criterio: coerencia
    trecho: "e um parágrafo sobre oficinas mecânicas, publicado três dias depois do parecer, poderia levar alguém de Jaboatão a adivinhar o cliente"
    por_que: "Contradiz a abertura: 'O parágrafo não falava das oficinas.' O verso já sai sem nome, cidade e setor; o risco que o texto precisa mostrar é o da data, e não o do setor. A frase seguinte ('Ele também troca o setor quando o setor denuncia a empresa') também fica redundante com 'sem o nome, a cidade ou o setor da empresa' (p. 13)."
    correcao: "'O sigilo do advogado vale também para a lição, e um parágrafo sobre banco de horas publicado três dias depois do parecer poderia levar o dono das oficinas, ou um mecânico dele, a se reconhecer pela data.' Cortar 'Ele também troca o setor quando o setor denuncia a empresa e' e manter 'nunca usa um número que só aquele caso teria'."
  - criterio: clareza
    trecho: "Quarenta minutos em pedaços sempre existiram na semana dele, inclusive em janeiro. Duas horas seguidas, com energia e sem interrupção, quase nunca."
    por_que: "Gabarito da questão 4, apontado na r1 e não corrigido. A prosa e o Para guardar foram consertados, mas o gabarito ainda diz 'quase nunca', contra 'Funcionou em setembro, outubro e novembro'. O Apêndice A é onde o leitor confere o conceito; ali ele volta a ler o argumento errado. (Lição cap02-r2: conferir o gabarito contra o texto final a cada reescrita.)"
    correcao: "'Quarenta minutos em pedaços existiram na semana dele até em janeiro. Duas horas seguidas, com energia e sem interrupção, existiam nas semanas boas e sumiam justamente no pior mês.'"
  - criterio: ritmo
    trecho: "O que antes começava do zero agora começava de um maço de parágrafos prontos, datados. As duas primeiras sextas de janeiro, antes que qualquer verso passasse da data, tinham saído de perguntas de e-mail de novembro, já liberadas, que estavam no caderno de campo."
    por_que: "A correção do bloqueador entrou como remendo no fim do parágrafo mais cheio da cena, que ficou com sete frases (limite de seis, lição cap01-r2), e a última frase volta no tempo depois do fecho ('de duas horas para vinte minutos'). Lido em voz alta, o parágrafo termina numa explicação logística, não na imagem do maço."
    correcao: "Mover a informação para antes, onde a cronologia pede, e cortar o 'O das oficinas ficou para fevereiro' dali (ele já está implícito na data a lápis): '...deixou os seis da semana onde estavam, cada um com a data do mês seguinte a lápis no canto. As duas primeiras sextas de janeiro tinham saído de perguntas de e-mail de novembro, já liberadas, do caderno de campo; naquela, pela primeira vez, havia um verso vencido. Pegou um dos primeiros...'. O parágrafo termina em 'começava de um maço de parágrafos prontos, datados.'"
  - criterio: clareza
    trecho: "Quem pensa respondendo rende quando tem uma pergunta na frente, e a da semana pode esperar até a manhã seguinte, como a da Lúcia."
    por_que: "Correção da r1 que ficou críptica: 'a da semana' pode ser a pergunta ou o encaixe, e só quem lembra do cap. 8 (a amiga manda a pergunta na segunda à noite, Lúcia responde na terça às oito) entende 'a manhã seguinte'. O leitor apressado não consegue repetir a regra."
    correcao: "'Quem pensa respondendo rende quando tem uma pergunta na frente, e a pergunta pode chegar na véspera: a da Lúcia chega na segunda à noite, e ela responde na terça às oito.'"
  - criterio: honestidade
    trecho: "Quem pensa falando tende a render no deslocamento, porque a voz está livre, mesmo que as mãos fiquem no volante."
    por_que: "Sugere gravar dirigindo, o que o livro não deveria recomendar (celular ao volante é infração de trânsito), e nem é o que a Renata faz: ela grava 'no estacionamento, antes de ligar o motor' (caps. 8, 12 e 21). O exemplo e a regra apontam para situações diferentes."
    correcao: "'Quem pensa falando tende a render no carro, porque a voz está livre: Renata grava com o carro parado, antes de ligar o motor.'"
  - criterio: coerencia
    trecho: "Uma fonoaudióloga: “A folha de exercícios que eu mando para os pais, com o que observar em casa.”"
    por_que: "Fonoaudióloga é também a figurante do exemplo comum-vs-singular do cap. 22, capítulo vizinho, igualmente falando com pais ('o barulho que a sua criança faz'). A lição cap02-r2 veda profissões de figurantes repetidas em capítulos vizinhos; ESTADO.yaml já registra 21 e 22."
    correcao: "Trocar aqui por uma profissão sem uso recente, por exemplo uma professora de piano: 'O bilhete que eu mando para os pais com o que a criança deve estudar na semana e como perceber se está tocando rápido demais.' Atualizar ESTADO.yaml › figurantes."
  - criterio: coerencia
    trecho: "Dizia que o banco de horas é o acordo que mais protege uma pequena empresa e o que mais a expõe"
    por_que: "É, quase palavra por palavra, a resposta do Otávio no cap. 4 ('O banco de horas só protege quem tem o acordo por escrito, controla o ponto com rigor, mês a mês'). Como eco não assumido, soa repetição de exemplo entre capítulos (lição cap02-r1); como eco assumido, seria um ganho de arco: a explicação que a agência simplificou em março vira o primeiro verso."
    correcao: "Assumir numa oração: 'Era, com outras palavras, a resposta que ele tinha escrito à mão para a dona das lavanderias, em março, e que a agência não soubera dar.' Ou trocar o assunto do verso de abertura (ponto britânico, por exemplo) e deixar o banco de horas para o maço de Helena."
edicoes_de_linha:
  - "Nas duas sextas perdidas de dezembro, Otávio passou o fim de semana com a sensação de dever alguma coisa, e na segunda semana tentou pagar a dívida -> Depois da primeira sexta perdida, Otávio passou o fim de semana com a sensação de dever alguma coisa, e na semana seguinte tentou pagar a dívida (na segunda semana de dezembro só uma sexta tinha caído; a confraternização vem depois)"
  - "Janeiro, o mês que derrubava tudo, passou a ser o mês com mais matéria-prima do ano. -> Janeiro passou a ser o mês com mais matéria-prima do ano. ('o mês que derrubava tudo' já está na p. 12)"
  - "com a sala ainda vazia e a cabeça ainda sem as sessões -> com a sala vazia e a cabeça ainda sem as sessões"
  - "Muito ofício que atende gente tem um momento -> Muitos ofícios que atendem gente têm um momento"
  - "que já é seu e em geral fica vazio -> que já é seu e quase sempre passa em branco (ou cortar 'e em geral fica vazio': generalização desnecessária)"
  - "Com o verso da folha e a sexta das cinco e meia, a semana do Otávio ficou assim. Nada nela exige -> Com o verso da folha e a sexta das cinco e meia, a semana do Otávio não pedia nenhum horário que ele já não tivesse. (o 'ficou assim' aponta para uma tabela que só vem dois parágrafos depois)"
  - "e nunca usa um número que só aquele caso teria.  -> e nunca usa um número que só aquele caso teria. (espaço sobrando no fim da linha 84)"
  - "Compare com os minutos úteis que você calculou no capítulo 8. -> Compare com os minutos por semana que sobram no seu pior mês, da conta do capítulo 8. (o cap. 8 não usa 'minutos úteis')"
  - "O ritual, além das peças, tinha feito o retrato do que os clientes deles mais precisavam entender. -> cortar e terminar na ação: 'Helena escreveu no monte maior, a lápis: controle de horário.' (o fecho atual resume a moral; a cena já mostrou)"
  - "Na pasta dos versos havia ainda treze que não tinham sido escolhidos. -> conferir a conta: seis versos só na terceira semana, 'o mês com mais matéria-prima do ano' e dezessete pareceres em três semanas deixam treze no fim de janeiro apertado; 'dezenove' (e 'Oito dos dezenove') fecha melhor, ou justificar com 'Nem todo parecer deixa um verso'."
  - "Porque Otávio ficou sem assuntos no caderno. (q. 1) / A falta de assuntos guardados no caderno. (q. 4) -> trocar um dos dois distratores; o mesmo distrator em duas questões do mesmo quiz entrega o padrão."
  - "Critérios da oficina -> acrescentar: 'A lição do campo 05 não tem nome, cidade, setor nem data que leve a alguém, e tem a data em que pode sair.' (pedido da r1, que acrescentou o campo e não o critério)"
diagramacao:
  - "p. 20: a grade do campo 03 continua com 21 caixinhas de marcar (cerca de 2 x 1 cm), sem linhas; não cabe 'hora, lugar e minutos' escritos à mão, que é o que o rótulo e o critério pedem. Ver problema de aplicabilidade."
  - "p. 11: a ilustração de abertura (engrenagem) segue igual à dos caps. 20 e 5 (apontado na r1 e não resolvido). Em capítulos consecutivos, o leitor vira a página e vê a mesma abertura. Trocar em um dos dois (a legenda do 21 funciona também com 'ponte' ou 'raizes' não usadas na fase, ou redesenhar a engrenagem do 21 com uma segunda saída visível)."
  - "p. 17: cerca de cinco linhas em branco no pé da página antes de o parágrafo final passar para a p. 18 com só duas linhas; branco evitável (não há bloco indivisível logo depois, só o Para guardar). Ajustar widows/orphans ou deixar o parágrafo inteiro na p. 17."
  - "p. 16: cerca de quatro linhas em branco no pé porque a Figura 21.1 não coube; aceitável. p. 18 (Para guardar sozinho antes da oficina), p. 19 (branco antes da grade indivisível) e p. 22 (branco após o roteiro) aceitos pelo projeto."
  - "p. 17: o subtítulo da figura 'minutos por semana, medidos por ele' continua em sans negrito, no mesmo peso dos rótulos das barras (sugestão da r1); passar para corpo menor, sem negrito."
veredito: "Revisão sólida: o bloqueador e a maior parte da r1 foram resolvidos e o capítulo tem a melhor imagem da Fase IV, mas a regra de sigilo pelo calendário diverge da do cap. 13, a rede manda 'escrever' para todos os modos, a grade da oficina continua sem espaço para o que pede e o gabarito da q. 4 ainda traz o argumento errado; falta uma passada curta de coerência e de oficina."
