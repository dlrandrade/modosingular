bloqueadores: []
pontos_fortes:
  - "Tudo o que a r4 apontou foi resolvido. O bloqueador caiu: a abertura da cardiologista agora é 'Uma pergunta que ouço no consultório:', que se repete sem datar atendimento. A descoberta da sexta semana deixou de desmentir os caps. 7 e 11 ('Lidas juntas, as quatro abriam com a mesma frase e fechavam com uma régua'), e o parágrafo dos motivos legítimos fecha o argumento ('O que separa esses dois motivos da vontade da décima semana é a causa'). A barra de 50 minutos explica por que cai também no pior mês, o gabarito da questão 03 dá a razão certa, o inventário do cap. 14 foi reconciliado ('lhe dava o assunto em dois minutos; o formato, não') e a nota da base da Figura 20.2 enfim cabe numa linha."
  - "A peça-modelo continua sendo o melhor do capítulo. Tem hora, lugar e material ('bandeira de vidro canelado', 'fundo anticorrosivo'), autorização assinada e calendário ('Era de junho, de uma obra entregue em agosto'). A dissecação linha a linha mostra o modo narrativo funcionando como estrutura ('Quem pensa contando não precisa inventar uma estrutura'), e a quinta linha é uma régua que o cliente aplica sozinho."
  - "Os números conferem no livro inteiro. Lúcia ('setenta e dois', 'oitenta e quatro') e Renata ('uns trinta e cinco', 'duas') batem com o cap. 8. O calendário da 17ª quinta leva à trigésima 'na segunda semana de janeiro'. O exemplo da massoterapeuta fecha as datas. A venda das luzes em novembro prepara, sem conflito, a venda da câmera no cap. 30, e 'as quartas à noite' para a seleção já estão no cap. 29."
  - "A oficina está amarrada: cinco campos, grade sem a terceira coluna, a data da quarta peça marcada na própria linha e cada item do checklist remetendo a um campo. O tempo é honesto ('mais o tempo da peça, que é justamente o que você vai medir'), e a rede tem um roteiro_nota que faz o esqueleto servir a quem pensa contando."
problemas:
  - criterio: coerencia
    trecho: "Nas duas primeiras semanas, com a obra do Taquaral em entrega, ele voltou às legendas de uma linha que escrevia antes da ficha de léxico: \"mais uma cozinha entregando\", \"o antes e o depois do Taquaral\"."
    por_que: "A obra do Taquaral é a cozinha do casal do cap. 14 ('um terceiro andar de 1974 no Taquaral'), que o leitor conhece pelo nome do bairro. As duas legendas saem na semana da entrega e são sobre ela. O próprio capítulo diz, porém, que as dezessete fotos foram 'publicadas depois da seleção'. A regra da seleção (cap. 19) põe a data em 'Um mês depois do último atendimento, no mínimo', e a lição cap13-r1 manda que a 'peça que parte de um atendimento nunca sai na semana dele'. No cap. 14, o mesmo Caio adiava a pergunta 'para o fim do mês, depois que o casal decidisse'. Do jeito que está, o texto só condena as legendas por falta de repertório, e o gabarito repete isso ('custava dois minutos e não dizia nada'). O leitor aprende, por omissão, que um antes e depois da cozinha do cliente, com o bairro, na semana da entrega, estaria bem se tivesse cinco linhas. Fica a um passo de bloqueador. A correção é de uma linha."
    correcao: "Manter o motivo, que é a correria da entrega, e tirar as legendas da obra em curso: '...com a obra do Taquaral em entrega, ele voltou às legendas de uma linha que escrevia antes da ficha de léxico, sobre fotos antigas já liberadas: “mais um taco recuperado”, “cozinha de 1970, antes e depois”.' Conferir se o gabarito da questão 02, que cita “Mais uma cozinha entregando”, acompanha a troca."
  - criterio: coerencia
    trecho: "Desde o vídeo do granilite, Caio tinha publicado de quase todos os jeitos: vídeos com o celular num cavalete, regravados até sair certo; a legenda de três frases da parede que mentia; um texto de três parágrafos sobre janelas de ferro. Cada formato tinha funcionado uma vez."
    por_que: "Há dois atritos com capítulos vizinhos. O cap. 18 termina com um gancho explícito para este: 'Numa quinta de maio, antes de ter decidido qualquer formato, Caio contou em voz alta ao sócio uma obra antiga, anotou o que tinha dito e publicou como um texto curto'. O cap. 16 repete o método ('Caio conta a obra para o sócio e grava'). O cap. 20 não paga esse gancho: diz que o texto 'não passava no modo', sem lembrar que Caio já tinha feito um texto no modo dele, e o leitor fica sem saber por que esse caminho não virou a base. Além disso, o cap. 25 diz que o texto das janelas, na época, 'ele tinha achado que o texto não funcionou', o que desmente 'Cada formato tinha funcionado uma vez'."
    correcao: "Pôr o texto do cap. 18 na lista e dar a ele um motivo de ofício, como o capítulo já faz com a tomada única: '...um texto de três parágrafos sobre janelas de ferro; o texto curto contado antes ao sócio, que dependia de o sócio estar no escritório na quinta de manhã. Nenhum tinha se firmado.' Trocar 'Cada formato tinha funcionado uma vez' por 'Nenhum tinha se firmado' ou 'Cada um tinha dado uma boa peça e nenhum, duas seguidas'."
  - criterio: originalidade
    trecho: "Uma psicopedagoga que pensa falando escolhe um carrossel de dez lâminas, com arte própria. Mede o custo: noventa minutos. Na quarta semana, depois de uma reunião de pais que se estendeu, não publica."
    por_que: "É a história da Renata no cap. 5 com outra profissão: quem pensa falando, o carrossel e a desistência em poucas semanas. O cap. 7 volta a ela ('Renata escolheu o carrossel porque uma colega jurou') e ainda traz uma pediatra de modo oral 'publicando carrossel sem sofrer'. Na terceira vez, a imagem não traz nada novo (lições cap02-r1). O exemplo também fica ambíguo diante do cap. 7: o 'porque' culpa a arte ('exigia que ela virasse designer'), enquanto o cap. 7 ensinou que carrossel serve ao modo oral quando a captura é falada."
    correcao: "Trocar o formato caro por um que o livro ainda não gastou e que falhe claramente no modo. Ex.: 'Uma psicopedagoga que pensa falando escolhe um texto longo, com três intertítulos, escrito no computador depois do jantar. Mede o custo: noventa minutos...' No 'porque': '...O primeiro exigia que ela escrevesse a frio, fora do modo dela, e parou no primeiro imprevisto.'"
  - criterio: ritmo
    trecho: "Caio aplicou os quatro aos formatos que tinha tentado. O vídeo do granilite tinha custado quatro minutos, numa tomada só; [...] A foto era a obra na frente dele, e as cinco linhas eram o começo de uma história que ele sabia contar."
    por_que: "São sete frases e 164 palavras num só parágrafo, acima do teto de seis frases (lição cap01-r2) e com o dobro da extensão dos vizinhos. O parágrafo faz três julgamentos de formato em sequência, e a leitura em voz alta perde o fôlego no segundo. É o parágrafo mais importante da seção e o mais difícil de ler."
    correcao: "Partir em dois. O primeiro fica com o vídeo, do granilite até 'e o vídeo pedia quarenta'. O segundo começa em 'O texto de três parágrafos passava no repertório...' e vai até 'uma história que ele sabia contar'. O parágrafo seguinte ('Na foto, o primeiro teste a reprovar...') continua como está."
  - criterio: coerencia
    trecho: "O vídeo do granilite tinha custado quatro minutos, numa tomada só"
    por_que: "O cap. 3 dá a conta inteira: 'Tinha passado meia hora pensando no que diria, no caminho para a obra; a gravação e a publicação levaram quatro minutos.' O cap. 8 ensinou a medir 'do momento em que você senta até o momento em que publica', justamente porque 'a memória apaga as partes chatas'. Num capítulo que exige 'custo medido por relógio', contar só os quatro minutos da gravação é o erro que o livro manda evitar. Também enfraquece a tese de que o vídeo de uma tomada é mínimo."
    correcao: "'A gravação do granilite tinha levado quatro minutos, numa tomada só, depois de meia hora pensando no carro no que diria; os seguintes ele passou a regravar...' A meia hora no trajeto pode ficar de fora da conta do pior mês, desde que o texto diga que ficou."
  - criterio: clareza
    trecho: "- pergunta: O que mais pesava na semana do Caio antes do formato-base?"
    por_que: "A prosa mede um empate ('A decisão pesava tanto quanto a peça'; 'levava tanto tempo quanto a peça'). O distrator (a), 'O tempo de gravar e editar cada vídeo', fica então tão defensável quanto a correta para quem só olha os minutos. O intertítulo 'Decidir cansa mais do que fazer' também afirma mais do que a medição mostra. O que desempata é a ordem e o cansaço ('vinha primeiro, quando a cabeça já estava gasta'), e isso não chega à pergunta."
    correcao: "Reformular a pergunta para o que o texto sustenta sem ambiguidade: 'O que a medição de uma quarta de junho mostrou ao Caio?' Correta: 'Que decidir o formato levava tanto quanto fazer a peça, e vinha antes dela.' Trocar o distrator (a) por um inequivocamente falso, como 'Que a peça em vídeo levava o dobro da decisão.'"
  - criterio: voz
    trecho: "Os personagens do livro encontraram os seus sem chamá-los assim, e a tabela reúne o que cada um usa, ao lado de um quinto formato que serve a mais de um modo."
    por_que: "O narrador sai da história para falar do livro e da tabela, o que é voz de apostila. Em todo o resto do capítulo, os quatro são pessoas, e não 'personagens do livro'."
    correcao: "'Renata, Otávio, Lúcia e Caio chegaram aos seus sem dar nome a eles. Um quinto formato serve a mais de um modo.'"
  - criterio: ritmo
    trecho: "Lidas juntas, as quatro abriam com a mesma frase e fechavam com uma régua, e a moldura igual fazia cada obra parecer mais diferente das outras, e não menos."
    por_que: "A cauda ', e ...' virou tique: são 28 ocorrências em 1.900 palavras de prosa. Muitas frases fecham com uma oração coordenada que acrescenta um passo a mais ('e a decisão levava tanto tempo quanto a peça, e vinha primeiro'; 'e o vídeo pedia quarenta'; 'e o cansaço de quem faz não é'). Aqui são três 'e' numa frase, o último em antítese (', e não menos'). Lido em voz alta, o capítulo ganha uma cadência única, de acréscimo."
    correcao: "Cortar a cauda aqui ('...fechavam com uma régua. A moldura igual fazia cada obra parecer mais diferente das outras.'). Fazer o mesmo em pelo menos mais três frases, deixando ponto onde hoje há ', e'. Exemplo: 'O problema aparecia na quarta-feira à noite, quando ele se sentava para decidir qual seria o da semana. A decisão levava tanto tempo quanto a peça e vinha primeiro, com a cabeça já gasta.'"
  - criterio: clareza
    trecho: "As quartas-feiras à noite ficaram livres. Caio passou a usar dez minutos delas para a seleção do caderno de campo"
    por_que: "O parágrafo vem logo depois de 'Em novembro, vendeu as duas luzes', e a leitura põe a mudança depois de novembro. Mas a cena de abertura, em outubro, já mostra a seleção na quarta ('a foto que tinha escolhido na seleção da véspera'), e a liberação das quartas vem de junho e julho. O fecho é bom e só precisa de âncora temporal."
    correcao: "'Desde julho, as quartas-feiras à noite estavam livres. Caio usava dez minutos delas para a seleção...' Ou pôr o parágrafo antes de 'Naquela noite'."
edicoes_de_linha:
  - "Figura 20.1, legenda: 'Os números do vídeo e do texto são de abril e maio' -> 'Os números do vídeo e do texto são de abril a junho' (a prosa mede o vídeo 'Numa quarta de junho': 'A peça em si, um vídeo regravado três vezes, levou outros quarenta')."
  - "Rede, faça: 'Uma cardiologista: “Uma pergunta que ouço no consultório:”, toda semana, com a mesma foto do estetoscópio sobre a mesa.' -> 'Uma cardiologista que abre toda semana com “Uma pergunta que ouço no consultório”, sobre a mesma foto do estetoscópio na mesa.' (na p022, os dois-pontos antes das aspas seguidos de vírgula ficam tortos)."
  - "Esqueleto: 'O que a sua prática viu e sustenta a ideia.' -> 'O que você viu na prática e que sustenta a ideia.' (a prática não vê, e os dois verbos têm sujeitos diferentes)."
  - "Gabarito 03: 'e a repetição é o que começa a produzir reconhecimento.' -> 'e a repetição é o que dá a quem lê a chance de reconhecer quem escreve.' (a r4 tirou da regra da rede o efeito afirmado como certo; o gabarito ainda o afirma)."
  - "'A palavra \"mínimo\" costuma ser lida como \"o mais rápido possível\"' -> 'É fácil ler \"mínimo\" como \"o mais rápido possível\"' (tira a generalização sobre terceiros; lição cap02-r1)."
  - "Rede, intro: 'e não precisa ser anunciado a ninguém' repete o evite 'Contar ao público que você adotou um formato novo'. Cortar a oração da intro: '...o formato é o que você vai repetir.'"
  - "'Um formato-base precisa caber no número que você calculou, com folga' -> '...no número que você calculou no capítulo 8, que já desconta a margem' (a 'folga' da Lúcia é de doze minutos; e o 'uns trinta minutos' do Caio não diz se já é o número com margem)."
diagramacao:
  - "p022-p023: a p022 fecha com cerca de 60% livres depois do faça/evite porque esqueleto e roteiro de fala saem como um bloco só e foram juntos para a p023. O esqueleto sozinho (cerca de 40% de página) caberia na p022. O projeto aceita branco antes de um esqueleto indivisível, mas aqui o que não cabe é o conjunto. Permitir a quebra entre o esqueleto e o roteiro, mantendo cada um indivisível, e a p023 fica só com o roteiro e a nota."
  - "p015: o subtítulo da Figura 20.1 ('minutos por peça, medidos com relógio') segue em sans negrito, mais pesado que o título em itálico. Foi apontado na r1, r2 e r4. A figura também não marca a linha dos 30 minutos do pior mês do Caio, que é o que reprova as barras de 40 e 50. Uma linha vertical pontilhada rotulada 'pior mês: ~30' resolve a leitura sem a prosa."
  - "p013: cerca de 10% da página em branco depois de 'o que vai dentro.', porque o box Conceito foi inteiro para a p014. Melhorou em relação à r4 (25%). Se o corte do parágrafo das cinco linhas ou da cauda de 'O problema aparecia...' liberar duas linhas, o box sobe."
  - "p023-p025: a p023 fecha com uns 20% livres, a p024 com uns 25% e a p025 usa só o terço superior, seguida da p026 em branco. O arranjo é aceitável, e com a quebra sugerida na p022 a verificação pode subir para a p023, o que libera a p025."
veredito: "Capítulo sem bloqueadores e com tudo o que a r4 pediu resolvido. Falta uma passada de coerência: as legendas do Taquaral, publicadas na semana da entrega, contradizem a regra da seleção sem que o texto perceba. O texto contado ao sócio no cap. 18 não aparece na lista de formatos, e o granilite de 'quatro minutos' esquece a meia hora do cap. 3. A psicopedagoga do carrossel repete a Renata do cap. 5. São correções de linha, e com elas o capítulo passa com folga."
