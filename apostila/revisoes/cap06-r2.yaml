capitulo: 6
iteracao: 2
notas: {metodo: 9.2, voz: 9.0, originalidade: 8.8, clareza: 9.2, ritmo: 9.0, concretude: 9.0,
        coerencia: 8.4, aplicabilidade: 8.7, impresso: 8.7, honestidade: 9.2}
bloqueadores: []
pontos_fortes:
  - 'A terça-feira hora a hora segue sendo a melhor abertura da Fase I, e agora o mapeamento fecha com a cena: cada fonte tem um episódio próprio e exato ("Os recibos que os clientes pequenos não guardam, a pergunta do estagiário, eram um erro comum"). O detalhe de ofício é verificável (cartão de ponto com horário invariável, e-mails com "horário fixo, chefe e metas", regime misto sem controle de horas) e a São João com bandeirinhas é Recife de verdade.'
  - 'Todos os pontos graves da r1 foram resolvidos: o roteiro não tem mais indireta a colegas e termina no critério; o fecho-sumário da fase saiu e a prosa acaba na cena; o mecânico agora tem as sete fontes; a paráfrase da frase-marca do cap. 16 sumiu; a oficina ganhou o campo 07 e o procedimento dia/noite ("à noite, em quinze minutos, passe os registros para cá").'
  - 'O filtro ético entra cedo, sem sermão ("a pergunta sem o nome de quem perguntou, o padrão sem o caso, a decisão sem o cliente"), e o formato mínimo de captura (palavras exatas entre aspas, contexto, data) é a instrução mais útil do capítulo, executável no mesmo dia.'
  - 'Voz limpa: zero travessão na prosa, frase média 17,9 com desvio 12,3, sinalização zerada. Frases de autor como "Eram pedaços de trabalho, com nome de cliente, cheiro de fórum e pressa" e "Quem a fez não achou."'
problemas:
  - criterio: coerencia
    trecho: "Por exemplo: “Todo advogado só manda fazer acordo”, almoço, 14/5."
    por_que: 'Furo de cronologia (lição cap03-r3: quem sabia o quê, e quando). A frase é a da cliente no almoço daquela terça, e a cena termina em "Naquele único dia, ele tinha vivido pelo menos sete peças publicáveis sobre a própria área. Não guardou nenhuma." Se não guardou nenhuma, a anotação datada de 14/5 não existe. Soma-se a isso que a cena não mostra como Otávio sai do "não lhe ocorreu que aquilo fosse uma" para a compra do caderno: a mudança acontece fora do texto, sem gatilho.'
    correcao: 'Dar o gatilho e, com ele, legitimar a data. Na abertura do parágrafo do caderno: "Na manhã seguinte, o estagiário deixou sobre a mesa as duas páginas passadas a limpo, com uma dúvida no fim. Otávio leu e reconheceu nelas, quase palavra por palavra, a resposta que ele mesmo não tinha anotado. Na hora do almoço comprou um caderno pequeno de capa preta, e a primeira página foi a terça da véspera, reconstruída de memória." Assim "almoço, 14/5" passa a ser a primeira linha dessa página e "Não guardou nenhuma" continua verdadeiro para o dia.'
  - criterio: coerencia
    trecho: "No caderno do Otávio, sobram decisões e opiniões, escritas por extenso, porque ele passa o dia pesando riscos."
    por_que: 'Três choques. (1) O caderno ainda não foi apresentado: ele só entra na seção seguinte ("O instrumento é o caderno de campo"), e na cena o Otávio ainda nem o tem. (2) As anotações que o próprio capítulo mostra são o oposto: fragmentos ("Terceiro cliente no mês perguntando de férias." "Testemunha contra o ponto, de novo."), uma pergunta e um caso; e o que o encanta depois são "a frase de um cliente" e "a pergunta que um estagiário fez", nenhuma decisão ou opinião. (3) O cap. 7 (linha 84) repete o parágrafo quase literalmente ("Renata quase não escreve: três palavras e uma seta"; "Otávio enche o caderno preto de frases por extenso") e é lá que a revelação dos modos pertence.'
    correcao: 'Mover o parágrafo para depois do "Sem título, sem estrutura, sem julgamento." e reduzi-lo ao Otávio e ao leitor, deixando os outros três para o cap. 7: "Mesmo com vinte segundos, Otávio não consegue deixar uma frase pela metade: as anotações dele saem inteiras, com sujeito e verbo, e quase sempre terminam num risco. O que mais aparece no seu caderno, e o jeito como aparece, diz alguma coisa sobre como você pensa." Reescrever os dois exemplos como frases completas e cruas: "Terceiro cliente no mês querendo demitir funcionário em férias; ninguém sabe que não pode." "Testemunha desmontou o ponto britânico, de novo." Na seção "As sete fontes" fica só a lição dos ofícios (mecânico).'
  - criterio: aplicabilidade
    trecho: "Comece pelos quatro equívocos que você anotou no capítulo 2."
    por_que: 'O cap. 2 prometeu que os equívocos "entram no seu caderno de campo", e a oficina os manda para a página do livro, no campo 03, que tem três linhas para quatro equívocos mais as objeções do dia. Além disso, se eles contam para os dez, o leitor precisa de só seis itens novos, o que enfraquece o objetivo ("Provar para si mesmo que você já vive cercado de matéria-prima" num dia de trabalho).'
    correcao: 'Trocar a última frase do objetivo por: "Antes de começar, copie para a primeira página do caderno os quatro equívocos do capítulo 2; eles abrem o estoque e não entram na conta dos dez de hoje." Se preferir mantê-los na oficina, subir o campo 03 para 6 linhas e dizer no critério que os dez são além dos quatro.'
  - criterio: coerencia
    trecho: "Em três semanas, o caderno do Otávio tinha vinte e seis anotações."
    por_que: 'O capítulo tem três ritmos que não conversam. A oficina exige dez itens num único dia; a figura 6.2 mostra 9 anotações acumuladas ao fim da primeira semana; Otávio, que "tinha vivido pelo menos sete peças publicáveis" num só dia, junta vinte e seis em quinze dias úteis. O leitor que cumprir a oficina passa a figura no primeiro dia e se pergunta se o personagem estava fazendo direito.'
    correcao: 'Dizer que o primeiro dia é uma varredura e o resto é fluxo. Na oficina (objetivo) ou na regra: "O primeiro dia esvazia a memória; depois, o normal é uma ou duas linhas por dia." Com a página reconstruída da terça (problema 1), Otávio pode ter "onze linhas na primeira noite e, três semanas depois, trinta e poucas". Na figura, começar em 14 na semana 1 (ex.: [14, 32, 55, 78]).'
  - criterio: aplicabilidade
    trecho: "Fechar com “se você também pensava assim, o ponto é este”."
    por_que: 'O "Faça assim" contradiz o esqueleto e o roteiro que ele deveria ilustrar: os dois terminam em "O critério" ("E, da próxima vez, para decidir sozinho: {o critério}."), e este fecho é o antigo, da normalização. Também pressupõe uma crença errada, que uma pergunta não tem (quem pergunta não "pensava assim"). Há ainda três versões da mesma frase de frequência: "É a pergunta que eu mais ouço neste mês", "É a pergunta que eu mais ouço" (esqueleto) e "É das perguntas que eu mais ouço" (roteiro), esta última redundante com a primeira lacuna do roteiro, que já diz quantas vezes.'
    correcao: 'Trocar o terceiro "Faça assim" por "Terminar com a régua que a pessoa usa sozinha: o que observar, o que perguntar." No roteiro, segunda linha: "Faz todo sentido perguntar isso: {por que a dúvida é razoável}." (a frequência já está na primeira lacuna).'
  - criterio: aplicabilidade
    trecho: "Qual foi a escolha, e qual foi a régua."
    por_que: 'A decisão é, pelo próprio capítulo, a fonte mais valiosa ("A sua régua, a parte mais difícil de copiar"), e o campo 05 é o único dos difíceis sem exemplo em profissão. Dos sete campos, só três (01, 02, 07) trazem exemplo de ofício; o 07 pede "Erros comuns e opiniões" e exemplifica só o erro. A estrutura_do_capitulo pede exemplos dos campos em profissões variadas.'
    correcao: 'Campo 05: "Uma professora de piano: “Não passei o aluno para a peça que ele pediu; a régua é tocar a anterior inteira, sem parar, lendo a partitura.”" Campo 07, acrescentar a opinião: "Uma nutricionista: “Acho que cardápio fechado atrapalha mais do que ajuda quem janta fora três vezes por semana.”" Campo 03 pode ganhar um ofício: "Um corretor de seguros ouve: “Seguro de vida só serve para quem tem filho.”" (conferir ESTADO › figurantes antes de fixar).'
  - criterio: originalidade
    trecho: "O óbvio de quem sabe é o que falta a quem pergunta."
    por_que: 'A mesma formulação aparece três vezes neste capítulo (esta frase, a nota "O que é óbvio para você é raro para o mercado" e o primeiro item do Para guardar) e já tinha fechado um parágrafo do cap. 1 ("O que é óbvio para você é justamente o que falta a quem ainda não conhece você"). Lição cap02-r1: a mesma ideia no máximo duas vezes por capítulo. O texto já remete ao cap. 1 ("É o mesmo mecanismo do capítulo 1"), então a frase-resumo sobra.'
    correcao: 'Cortar a frase e terminar o parágrafo em "É o mesmo mecanismo do capítulo 1, a competência que vira reflexo." (sem "visto agora por outro ângulo", que é voz de curso). A nota e o Para guardar carregam a ideia.'
  - criterio: coerencia
    trecho: "A explicação que você repete há anos e considera básica é, para quem nunca a ouviu, a informação mais útil que vai receber hoje."
    por_que: '"A explicação que você repete há anos" é o título do cap. 16, reservado ao Otávio (arco F3: "publica a explicação que repete há anos"). Aqui aparece duas vezes, na nota e no Para guardar, e o leitor do cap. 16 encontra o título já gasto (lição cap04-r1). A rede também antecipa o cap. 14: as três regras e dois itens do "Evite" são quase idênticos aos de "A pergunta certa" (cap. 14: "Cite a pergunta como ela chega", "Uma pergunta por peça", "Juntar cinco perguntas numa lista dilui todas", "Reescrever a pergunta em linguagem técnica").'
    correcao: 'Na nota: "A resposta que você dá toda semana e considera básica é, para quem nunca a ouviu, a informação mais útil que vai receber hoje." No Para guardar: "O que é óbvio para você é raro para o mercado. A resposta que você já cansou de dar é novidade para quem nunca a ouviu." Quanto à rede, a do cap. 6 segue a fonte do PWA e pode ficar; registrar para o cap. 14 que as regras e o "Evite" dele precisam ser outros (o nível crítico, a variável esquecida), não repetir estas.'
  - criterio: concretude
    trecho: "a frase de um cliente que resumia um mal-entendido comum melhor do que qualquer manual, a pergunta que um estagiário fez e que nenhum advogado experiente teria coragem de fazer"
    por_que: 'É o ganho da cena do caderno e fica no abstrato: o leitor não vê a frase nem a pergunta, só os adjetivos ("melhor do que qualquer manual", "coragem"). É exatamente o que o capítulo ensina a não fazer (detalhe específico > adjetivo). O mesmo vale para o mecânico, que "decide não trocar uma peça que o cliente pediu para trocar" sem régua (lição cap02-r2) e "lembra da moto que chegou sem freio e com o dono jurando que era a pastilha" sem dizer o que ele viu.'
    correcao: 'Dar a frase: "a de um dono de padaria que resumia um mal-entendido inteiro, “se ele assinou, não reclama depois”, e a pergunta do estagiário sobre os recibos, que nenhum advogado experiente teria coragem de fazer." No mecânico: "decide não trocar a embreagem que o cliente pediu, porque o problema era o cabo mal regulado"; "lembra da moto que chegou sem freio, com o dono jurando que era a pastilha, e era o fluido que nunca tinha sido trocado".'
  - criterio: voz
    trecho: "Sete fontes, nenhum roteiro inventado."
    por_que: 'O fecho em fragmento "número, número, nenhum X" aparece duas vezes e vira fórmula: aqui e no fim da prosa ("Três semanas, vinte e seis linhas, nenhuma delas escrita diante de uma tela vazia."). O fim ainda repete o número do parágrafo anterior ("vinte e seis anotações"). Na seção "O que a frase quer dizer" há duas antíteses explícitas ("Ela não sugere que [...] O que ela afirma é" e "Otávio não vive esperando ter ideias. Vive tendo ideias"), acima do limite de uma por seção (lição cap01-r1).'
    correcao: 'Mecânico: terminar em "[...] o tipo de desgaste que aparece na oficina." (a conta das sete o leitor faz). Fecho: manter "Helena começou o dela na semana seguinte." como última frase, ou trocar a fórmula por uma ação: "Helena começou o dela na semana seguinte, num caderno igual, que pediu a ele que comprasse." Na seção 1: "Otávio vive tendo ideias o dia inteiro e não as reconhece porque, para ele, são óbvias."'
  - criterio: ritmo
    trecho: "Um mecânico de motos de Uberlândia ouve toda semana se vale a pena pôr gasolina aditivada numa moto de cento e cinquenta cilindradas; vê chegar motos com a corrente esticada demais porque o dono seguiu um vídeo;"
    por_que: 'Uma só frase de cerca de noventa palavras com sete orações em ponto e vírgula: lida em voz alta, o leitor perde o fôlego e a conta. Além disso, "o dono seguiu um vídeo" reaproveita a imagem do vídeo que ensina errado, já usada no cap. 1 e no cap. 2 (lição cap02-r1), e "revisão por quilometragem faz menos sentido que revisão por uso" é tecnicamente vago, porque quilometragem já é uso.'
    correcao: 'Partir em três frases (perguntas e objeções; caso, erro e decisão; opinião e observação). Trocar "porque o dono seguiu um vídeo" por "porque o dono apertou a corrente como se fosse de bicicleta". Trocar a opinião por "acha que, para quem roda o dia inteiro em entrega, a revisão pela quilometragem do manual chega tarde".'
  - criterio: honestidade
    trecho: "E há um formato mínimo que funciona para quase tudo"
    por_que: 'Pequenas afirmações sem base somadas às generalizações sobre terceiros ("costuma ser mal entendida, e o mal-entendido afasta justamente as pessoas sérias"; "Quem passa por isso culpa a inspiração"; "Quem lê percebe a diferença sem saber nomeá-la"), uma acima do limite de duas; e "Isso basta para recuperar a situação inteira semanas depois" promete.'
    correcao: '"E há um formato mínimo que serve para a maior parte das anotações" e "Em geral, isso basta para recuperar a situação semanas depois." Trocar "Quem passa por isso culpa a inspiração" por "A culpa costuma ir para a inspiração" ou atribuir ao Otávio: "Otávio teria culpado a inspiração."'
  - criterio: clareza
    trecho: "A regra sobre quando fazer acordo, uma opinião formada em décadas."
    por_que: 'O almoço rende duas fontes (a objeção da cliente e a opinião do Otávio), enquanto as outras cinco têm episódio próprio; e a cena não mostra onde Otávio discorda dos pares, que é o que a tabela define como opinião ("Onde você discorda dos seus pares"). O leitor apressado pode concluir que opinião é qualquer explicação.'
    correcao: 'Explicitar a discordância no almoço: "Otávio passou a sobremesa explicando quando ele manda fazer acordo, quando não manda e por que discorda dos colegas que fecham acordo na primeira audiência por hábito." E no mapeamento: "A regra sobre quando não fazer acordo, em que ele diverge de boa parte dos colegas, uma opinião."'
edicoes_de_linha:
  - 'Lúcia percebeu isso no capítulo 2, quando começou a anotar as crenças com que os pacientes chegavam, e Caio sem perceber quando mandou o áudio -> Lúcia percebeu isso no capítulo 2, quando começou a anotar as crenças com que os pacientes chegavam; Caio viveu o mesmo sem perceber, quando mandou o áudio (hoje "Caio [percebeu] sem perceber" soa como paradoxo)'
  - 'Nenhuma daquelas sete coisas parecia conteúdo. Elas não se pareciam com nada do que a agência publicava. -> Nenhuma daquelas sete coisas parecia conteúdo, nem se assemelhava ao que a agência publicava. ("parecia/pareciam/parecia sujo" três vezes no parágrafo)'
  - 'O juiz ouviu com atenção. -> cortar (não acrescenta nada à cena)'
  - 'e o livro volta ao assunto quando tratar de sigilo -> e o capítulo 13 volta ao assunto (remissão precisa, sem narrador que anuncia)'
  - 'A frase afasta a dependência de inspiração, e não a seleção. -> A frase livra a criação da dependência de inspiração; não dispensa escolher o que publicar. (gabarito Q1, hoje ambíguo)'
  - 'Os registros estão nos campos 02 a 07, com as palavras de quem falou. -> Os registros estão nos campos 02 a 07; as perguntas e objeções, com as palavras de quem falou. (decisão e observação não têm "quem falou")'
  - 'Pode ser um caderno de bolso ou uma nota fixa no celular, contanto que -> Pode ser um caderno de bolso ou uma nota fixa no celular, desde que'
diagramacao:
  - 'p016: continua o branco da r1, cerca de um quarto da página vazio depois de "uma carta escrita para si e uma circular.", porque o quadro comparativo foi inteiro para a p017. Subir o parágrafo "Lúcia percebeu isso..." para antes do quadro, ou permitir que a citação do dossiê suba para a p016.'
  - 'p016: última linha do segundo parágrafo da seção tem só "colega." (viúva). Ajustar tracking ou reescrever "poderiam ser de qualquer colega" -> "seriam de qualquer colega".'
  - 'p022-p023: o branco de ~45% na p022 antes do esqueleto é aceito, mas o Faça/Evite, que não é campo de escrita, foi para depois do esqueleto na p023. Pôr o Faça/Evite logo depois das três regras preenche a p022; o esqueleto fica inteiro na p023 e o roteiro de fala provavelmente sobe para o pé dela, evitando o branco de ~25% da p023.'
  - 'p018, figura 6.2: a unidade "anotações acumuladas no caderno" ficou embaixo dos rótulos das semanas e parece título do eixo horizontal. Colocá-la na vertical junto ao eixo y ou no topo à esquerda do gráfico.'
  - 'p013: linha 1 termina com o artigo "O" isolado ("nenhuma ideia. O / áudio do “acertar por fora”"). Evitar monossílabo no fim da linha (espaço inseparável depois de "O").'
veredito: 'Rodada de avanço real, sem bloqueadores e com todos os pontos graves da r1 resolvidos, mas ainda abaixo do gate por coerência interna (a anotação de 14/5 num dia em que Otávio "não guardou nenhuma", o caderno descrito antes de existir e com anotações que desmentem o próprio texto, três ritmos de captura incompatíveis) e por ajustes de oficina e rede; uma passada dirigida resolve.'
