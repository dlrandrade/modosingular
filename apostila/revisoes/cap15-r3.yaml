        coerencia: 8.7, aplicabilidade: 9.0, impresso: 8.8, honestidade: 9.3}
bloqueadores: []
pontos_fortes:
  - 'Quase tudo o que a r2 apontou foi resolvido. O critério que precisa sobreviver fora da história parte agora do que a pessoa observa: "se a sua dor piora sem motivo aparente, e sempre nos mesmos dias, procure o que você fez dois ou três dias antes, mesmo que na hora não tenha doído nada". A legenda do quadrante, o parágrafo dos adjetivos e o fecho contam a mesma coisa sobre o caso do senhor ("um critério que servia a ele e a quase mais ninguém"). O roteiro abre pela situação ("Há algum tempo, uma pessoa chegou achando que era"). O sigilo virou condição eliminatória ("Sem este item, a peça não sai, qualquer que seja o total").'
  - 'O caso da faxina continua sendo o melhor caso comum do livro, com detalhe de ofício exato e visual: "o rodo de cabo comprido no lugar do pano de joelhos, o banheiro num sábado e o quintal no outro, e uma pausa a cada hora". A cena final ganhou um efeito pequeno, crível e próprio da Renata: "um paciente de segunda-feira perguntou, antes de deitar na maca, se o futebol de sábado contava."'
  - 'O caso-modelo ensina a espera sem sermão: "Se o caso fosse das últimas semanas, Renata teria anotado a data na ficha e esperado." A grade do campo 07 transforma isso em algo que se confere no papel, e a nota do roteiro fecha a questão ética com precisão: "o critério orienta o que observar e o que perguntar, e nunca substitui uma avaliação."'
  - 'A seção dos quatro tempos ensina a ordem pelo próprio caso ("se a história começasse pelo sábado, a lição pareceria óbvia"), e o mapa dos defeitos agora é uma régua: "Sem o detalhe, a peça vira anedota; sem o porquê, vira propaganda; sem o critério, vira uma história bonita que ninguém consegue usar."'
problemas:
  - criterio: originalidade
    trecho: 'Era de uma paciente de quarenta e poucos anos [...] faxina na casa da mãe, que já não conseguia fazer sozinha'
    por_que: 'O caso central do cap. 13, dois capítulos antes e na mesma fase, é o de uma paciente cujo sintoma tem dia marcado no fim de semana e cuja mãe está na cena: "A semana dela não começava na segunda. Começava no domingo [...] quando a mãe, do quarto ao lado, começava a passar as camisas". Na generalização do cap. 13, o sábado também aparece: "o aperto costuma ser maior em quem descansou bem no sábado". Aqui o caso também é o de uma mulher com um sintoma de segunda-feira que vem do sábado, na casa da mãe. Somado ao eco com o cap. 3 que a r1 já apontou (a fonoaudióloga: "Rouquidão que piora ao longo da semana e melhora no domingo"), o leitor encontra pela terceira vez o mesmo sinal: um sintoma com dia da semana, ligado ao fim de semana. A lição cap02-r1 diz que nenhuma imagem ou cena se repete entre capítulos. O ritmo semanal é o coração do caso e pode ficar, mas a mãe é o eco mais visível e é fácil de trocar.'
    correcao: 'Tirar a mãe da faxina e manter o esforço, de joelhos e curvada. Por exemplo: "faxina na casa da sogra, que já não conseguia fazer sozinha" é a troca mínima. Melhor ainda é uma cena sem família, como "a faxina da casa de praia que ela aluga por temporada, quatro horas de joelhos entre a saída de um hóspede e a chegada do outro". Nesse caso, ajustar o tempo 3 ("o rodo de cabo comprido no lugar do pano de joelhos, a faxina dividida entre sábado e domingo, e uma pausa a cada hora"). Nos dois casos, conferir o parágrafo do sigilo ("O sábado da faxina virou “o sábado”").'
  - criterio: coerencia
    trecho: "O que convence é o documento, a testemunha, a sequência de fatos que leva o juiz a concluir que houve boa-fé."
    por_que: 'A frase põe o documento no topo do que convence, na boca de Otávio, advogado trabalhista. O capítulo seguinte é todo dele e se apoia na frase que o plano lhe reserva: "contrato assinado não é prova de nada". Na Justiça do Trabalho vale a primazia da realidade: o fato prevalece sobre o papel. Um advogado trabalhista, que é o leitor que mais confere esse detalhe, estranha a ordem. E o cap. 16 vai desmentir o 15 na página seguinte.'
    correcao: '"O que convence é a sequência de fatos, o ponto batido, a escala, a testemunha que viu, que leva o juiz a concluir que houve boa-fé." Isso também prepara o cap. 16 sem gastar a frase dele.'
  - criterio: voz
    trecho: "Contar um caso e afirmar uma coisa pedem coisas diferentes a quem ouve. [...] As duas histórias da Renata pedem coisas diferentes a quem ouve."
    por_que: 'A inversão pedida na r2 deixou a mesma fórmula abrindo duas seções seguidas, a um parágrafo de distância (p. 13 e p. 14). A primeira ainda tropeça em "uma coisa pedem coisas". A seção "O caso certo não é o mais bonito" também acumula antíteses bem acima de uma por seção (lição cap01-r1): "A do senhor [...] pede admiração. A da paciente das segundas pede", "O caso raro prova [...] O caso comum, bem contado, prova", "A paciente [...] era um exemplo de um padrão [...] Já o senhor da cadeira de rodas era único", "Contado por alguém que o público ainda não conhece [...] Contado por alguém cujo raciocínio". Em "O teste do coadjuvante" são duas: "Se sente admiração [...] Se sente que aprendeu" e "e nunca como plateia do profissional".'
    correcao: 'Abrir a seção 1 sem a fórmula: "Renata poderia escrever “eu investigo a rotina do paciente antes de mudar o tratamento”. É verdade, e é uma afirmação sobre ela." Manter "pedem coisas diferentes" só na p. 14. Na seção 2, ficar com a antítese raro x comum, que é a da fonte, e desmontar as outras. Por exemplo: "A paciente de quarenta e poucos anos era um exemplo de um padrão, e o padrão é o que torna o caso útil a quem lê; a lição do senhor da cadeira de rodas não se transfere." E: "Contado cedo demais, o milagre parece propaganda. Depois de meses de raciocínio acompanhado em público, parece consequência." No coadjuvante, cortar "e nunca como plateia do profissional".'
  - criterio: clareza
    trecho: "se a dor aparece dias depois do esforço, e não durante, a causa costuma estar dois ou três dias para trás"
    por_que: 'A versão da p. 15 ficou boa. Esta, na p. 13, é tautológica: se a dor aparece dias depois do esforço, é óbvio que o esforço ficou dias para trás. A frase não diz ao leitor o que observar, e ela vem logo depois do box Conceito, justo onde o critério tem de ficar inequívoco. O "e não durante" também soma uma antítese à seção.'
    correcao: '"O que o caso prova, no sentido mais estrito, é que o critério dela funciona: a dor lombar com dia marcado costuma ter a causa dois ou três dias antes, num esforço que na hora não doeu."'
  - criterio: aplicabilidade
    trecho: 'A advogada: “Em vez de entrar logo com a cobrança, pedi os extratos de dois anos e marquei os meses dos atrasos.” [...] A advogada: “Se os atrasos têm mês marcado, leve à consulta a lista dos meses: ela muda a estratégia.”'
    por_que: 'O campo 04 pede "qual régua usou", e o próprio capítulo diz que "o porquê [...] é o que ensina alguma coisa". O exemplo, porém, só dá o quê (pedir extratos, marcar meses) e nenhuma régua. O campo 05 termina em "ela muda a estratégia", critério que não entrega a régua inteira (lição cap02-r2) e que não dá a quem lê o que fazer com a lista. O leitor de outra área copia o modelo e escreve um tempo 3 sem porquê.'
    correcao: 'Campo 04: "Em vez de entrar logo com a cobrança, pedi os extratos de dois anos e marquei os meses dos atrasos, porque atraso com mês marcado quase sempre tem um motivo, e o motivo decide o caminho." Campo 05: "Se os atrasos têm mês marcado, leve à consulta a lista dos meses: é ela que mostra se o caminho é cobrar ou rever o acordo." Conferir com um advogado de família se a formulação é segura.'
  - criterio: honestidade
    trecho: "Porque a história era longa demais para caber num áudio de dois minutos."
    por_que: 'O distrator (b) da questão 2 é parcialmente verdadeiro pelo próprio texto: "O áudio saiu emocionado e comprido", e a versão publicada tem "dois minutos e meio". Um leitor atento pode defender (b) como motivo auxiliar da troca. A lição cap01-r1 pede distratores inequivocamente falsos.'
    correcao: 'Trocar por uma alternativa que o texto desmente sem ambiguidade: "Porque o senhor tinha pedido que a história não fosse contada." ou "Porque os ortopedistas que a indicavam desaprovavam o caso."'
  - criterio: coerencia
    trecho: 'Caio faz o mesmo sem dar nome ao método, desde a parede que mentia do capítulo 11: começa em "teve uma obra" e termina num critério.'
    por_que: '"Desde" data o hábito no cap. 11, mas o cap. 7 já o registra ("Caio passou a começar qualquer peça por “teve uma obra” [...] e a deixar a conclusão para o fim"), e o elenco faz disso uma marca antiga dele. A frase dá ao hábito uma data errada.'
    correcao: '"Caio faz o mesmo sem dar nome ao método, como na parede que mentia do capítulo 11: começa em “teve uma obra” e termina num critério."'
  - criterio: ritmo
    trecho: "Renata pôs as duas histórias lado a lado e sentiu a tentação de voltar à primeira. [...] A vontade era publicar a primeira. Mas o primeiro rascunho já tinha mostrado o que ela provava"
    por_que: 'O parágrafo dá a mesma batida duas vezes: "tentação de voltar à primeira" e "A vontade era publicar a primeira". "O que ela provava" é ambíguo, porque "ela" pode ser Renata ou a primeira história. Dois parágrafos passam do teto de seis frases (lição cap01-r2): o segundo da abertura ("O áudio saiu emocionado e comprido [...] Nenhum dos pacientes que ela queria atender se achava raro.", 7 frases) e o primeiro de "O argumento e o caso" (7 frases). "Ninguém" aparece 9 vezes na prosa, duas numa só frase ("perceber o que ninguém, nem a própria paciente, tinha levado a sério é a parte do trabalho que ninguém copia").'
    correcao: 'Cortar "A vontade era publicar a primeira." e escrever "Mas o primeiro rascunho já tinha mostrado o que a primeira provava, e a segunda [...]". No parágrafo 2, fundir "Percebeu também outra coisa, mais incômoda." com a frase seguinte ("Percebeu também outra coisa, mais incômoda: ninguém que a ouvisse teria o problema daquele senhor."). Na seção 1, a correção de voz acima já tira uma frase. Na frase dos dois "ninguém": "é a parte do trabalho que não se copia."'
  - criterio: concretude
    trecho: "O sábado da faxina virou “o sábado”, e o banheiro e o quintal sumiram, porque identificavam demais."
    por_que: 'Se a faxina também sumiu, a peça publicada perdeu o tempo 3 que o capítulo ensina como "o conteúdo": sem a faxina de joelhos, não sobra o rodo de cabo comprido nem o porquê da sobrecarga. O que identifica é a casa da mãe, e não a postura. O modelo de despersonalização corta o detalhe de ofício junto com o dado pessoal, e o campo 07 não ensina a separar os dois.'
    correcao: '"A faxina de joelhos ficou, porque era o que ensinava; a casa da mãe, o banheiro e o quintal sumiram, porque identificavam demais." (Se a mãe sair da cena, ver o problema de originalidade, adaptar.)'
  - criterio: concretude
    trecho: "Se o seu cachorro se coça sempre no mesmo lugar e na mesma hora, antes de trocar a ração, olhe por onde ele andou."
    por_que: 'A correção da r2 trocou o sinal para "ele lambia e mordia só as patas, e só depois de passear", mas o critério final voltou a "se coça", o sinal que o tutor já via e que o levou à ração. O critério que sobrevive fora da história não repete o detalhe que fez a virada. O exemplo também pula o porquê do tempo 3 ("Perguntei por onde eles passeavam. Tinha uma praça com grama recém-tratada."), num box cujo título promete os quatro tempos.'
    correcao: '"Se o seu cachorro lambe e morde as patas sempre depois do passeio, antes de trocar a ração, olhe por onde ele andou." E, no tempo 3: "Perguntei por onde eles passeavam, porque alergia de ração não escolhe hora. Tinha uma praça com grama recém-tratada."'
edicoes_de_linha:
  - 'Na versão que gravaria, Renata contou a virada na ordem em que ela aconteceu. -> No áudio novo, Renata contou a virada na ordem em que ela aconteceu. (o futuro do pretérito seguido de pretérito perfeito tropeça)'
  - 'Um caso-prova tem um limite: não promete resultado. O caso-prova mostra um critério -> Um caso-prova tem um limite: não promete resultado. Ele mostra um critério'
  - 'Eles têm lugar, depois que o especialista é conhecido pelo trabalho comum. -> Eles têm lugar depois que o especialista é conhecido pelo trabalho comum.'
  - 'Os casos comuns não pareciam caso à Renata -> Para Renata, os casos comuns não pareciam casos'
  - 'um paciente de segunda-feira perguntou -> um paciente que chegava toda semana com dor de segunda-feira perguntou (ou "um paciente das segundas": "de segunda-feira" lê-se como o dia da consulta)'
  - 'Ao transcrever, ela percebeu que tinha usado -> Ao transcrever, percebeu que tinha usado ("ela" dispensável; o parágrafo tem cinco "ela")'
diagramacao:
  - 'p. 21: dois terços da página em branco depois das três regras. É a terceira rodada com o mesmo branco. O esqueleto sozinho (cerca de 420 px na p. 22) cabe no espaço livre da p. 21 (cerca de 540 px). O branco vem de o esqueleto estar colado ao Faça/Evite, e não da indivisibilidade dele. Separar os dois blocos.'
  - 'p. 16: cerca de 18% da página em branco no pé, porque o box "Na prática" (veterinário) desceu inteiro para a p. 17. É a terceira rodada. O commit diz que o box ficou divisível, mas aqui ele não quebra. Deixar "O comum" na p. 16 ou mover o parágrafo "Os adjetivos denunciam a vaidade..." para antes do box.'
  - 'p. 13: cerca de 20% da página em branco depois do parágrafo "O que o caso prova...". O intertítulo "O caso certo não é o mais bonito" e o primeiro parágrafo (3 linhas) cabem ali. O bloco intertítulo + parágrafos + figura parece estar sendo mantido junto.'
  - 'p. 14, figura 15.1: os rótulos do eixo vertical continuam assimétricos. "Mostra o seu critério" está na horizontal, acima do eixo, e "Não mostra critério" está girado 90°, embaixo. Apontado na r2 e não corrigido.'
  - 'p. 23, roteiro de fala: a lacuna "o critério" quebra no fim da linha e deixa o artigo "o" sublinhado sozinho ("olhe primeiro para o / critério."). Impedir quebra dentro de lacunas curtas (white-space: nowrap até umas 4 palavras).'
veredito: "O capítulo resolveu quase tudo o que a r2 cobrou e tem o melhor caso comum do livro. Ainda ficam abaixo de 9: o eco com o cap. 13 (sintoma de fim de semana, com a mãe na cena), a analogia do Otávio que põe o documento acima do fato na véspera do cap. 16, antíteses em série na seção 2, o critério tautológico da p. 13 e exemplos da oficina sem régua. São correções de linha e de detalhe, e com elas o capítulo passa."
