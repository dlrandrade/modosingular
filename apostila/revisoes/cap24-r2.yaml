capitulo: 24
iteracao: 2
notas: {metodo: 8.9, voz: 9.0, originalidade: 9.0, clareza: 8.8, ritmo: 8.9, concretude: 9.3,
        coerencia: 8.4, aplicabilidade: 8.6, impresso: 9.1, honestidade: 9.0}
bloqueadores:
  - 'Sigilo profissional (problema ético): "A segunda peça vinha do maço de versos guardados em janeiro, que Otávio passou para Sílvia inteiro, com a instrução de usá-los na ordem em que ele numerou e de pular qualquer um cuja data a lápis ainda não tivesse chegado." O próprio capítulo lembra que os versos são "os parágrafos que escreve à mão atrás da última folha de cada parecer", e o cap. 21 mostra que é a folha física do rascunho do parecer ("a última folha do rascunho, a que a secretária digitaria"). Passar o maço "inteiro" a uma agência entrega a terceiros a frente dessas folhas, com o fim do parecer e as recomendações a clientes identificáveis. Um advogado de 25 anos não faria isso, e o livro trata o sigilo como regra (lição cap13-r1). Além disso, a conferência da data a lápis, que é a proteção de sigilo do calendário, passa para Sílvia. Correção: "A segunda peça vinha do maço de versos guardados em janeiro. Otávio separou os que já tinham passado da data a lápis, fotografou o verso de cada um, numerou as fotos e mandou todas a Sílvia de uma vez, com a instrução de usá-las na ordem." A regra do capítulo continua valendo: só a foto do verso sai do escritório.'
pontos_fortes:
  - 'A rodada anterior foi bem absorvida. "Quatro sinais" virou "quatro condições" e não colide mais com o cap. 4. A conta de linhas do manual (seis, sete, nove) fecha com a figura 24.1. A proposta de abril já vem escalonada ("A arte e a triagem dos comentários viriam depois, se nenhuma palavra voltasse trocada. Mais nada."). O cap. 30 agora conversa com o 24 ("A regra valia desde abril, na folha de fluxo; agora estava no contrato").'
  - 'A cena da pasta continua sendo o melhor do capítulo: quatro objetos tirados um a um, o calendário fechado a pedido e as cinco regras lidas em silêncio até "Eu nunca escrevo “você sabia?”". O conceito nasce dos objetos antes de ganhar nome no box.'
  - 'O capítulo adapta com precisão o que o PWA traz em abstrato. O "80%" do PWA virou "resolve a maior parte dos problemas antes que eles apareçam", a revisão de um minuto ganhou a condição que a separa da leitura inteira do cap. 23 e a lista dos "4 nuncas" agora remete às quatro etapas do capítulo anterior, sem repeti-las como se fossem novas.'
  - 'O fecho amarra três fios de capítulos anteriores sem anunciar nada: a empresária que veio depois do telefonema de Seu Ednaldo (cap. 10), a pergunta do banco de horas (caps. 4 e 21) e a frase sublinhada na folha de fluxo. O fecho termina numa ação, sem moral.'
problemas:
  - criterio: coerencia
    trecho: 'Sílvia tinha achado que faltava uma chamada. Otávio desfez a troca, e Sílvia não se ofendeu. Pediu que a regra entrasse também no manual, como sétima linha'
    por_que: 'Uma página antes, Otávio já tinha posto no manual uma sexta linha, "só para Sílvia", que diz "nenhuma chamada para contratar". A primeira troca é justamente uma chamada ("Conte sempre com uma assessoria jurídica especializada."), e o próprio texto diz que Sílvia a pôs "porque faltava uma chamada". A sétima linha, então, não cobre nada que a sexta já não cobrisse, e a lição da seção fica sem sustentação: "Cada vez que encontrava uma frase fora do lugar, em vez de só corrigir, acrescentava uma linha ao manual." Aqui, a frase estava fora do lugar mesmo com o manual cobrindo o caso. Isso sugere que o problema era de leitura, e não de instrução, o contrário do que o capítulo ensina.'
    correcao: 'Tirar da troca a natureza de chamada. Ex.: "A versão digitada terminava assim: “Controle é proteção.” Sílvia tinha achado que a pergunta deixava o texto em aberto e fechou com uma frase de efeito." Com isso, a sétima linha ("a última frase é sempre dele, e nunca muda") passa a cobrir de fato uma lacuna do manual. Outra saída é manter a chamada e tirar "nenhuma chamada para contratar" da sexta linha, que fica com promessa de resultado e nome de cliente.'
  - criterio: clareza
    trecho: 'Na primeira semana, levava uns quatro minutos por peça. Cada vez que encontrava uma frase fora do lugar, em vez de só corrigir, acrescentava uma linha ao manual.'
    por_que: 'No primeiro mês, a agência "só digitava e agendava", "sem trocar nenhuma palavra". O leitor não sabe de onde saem as frases fora do lugar que levaram o manual de sete para nove linhas nas semanas 3 e 4, nem o que a revisão de quatro minutos conferia num texto digitado palavra por palavra. A figura mostra o efeito ("Nove linhas. A revisão virou conferência.") sem mostrar a causa. É o mecanismo central da seção e está sem exemplo. Além disso, se houve trocas nas semanas 3 e 4, o prazo de "quatro semanas sem nenhuma troca de palavra" para passar a arte só vence por volta da oitava semana. O texto precisa mostrar que isso cabe no "segundo mês".'
    correcao: 'Dar uma origem concreta às linhas 8 e 9. O lugar natural é a legenda que acompanha a arte, única parte com palavras que a agência escreve. Ex.: depois de "acrescentava uma linha ao manual", inserir: "A oitava veio da legenda da terceira semana, que repetia a pergunta final com outras palavras; a nona, de uma hashtag que ele nunca usaria. As duas diziam o mesmo: a legenda é a primeira frase do texto, sem acréscimo." Depois, conferir se as quatro semanas sem troca terminam no segundo mês.'
  - criterio: metodo
    trecho: 'Se a revisão demora mais de dois minutos por peça, o problema está no manual, e não na equipe.'
    por_que: 'O texto fez a ressalva certa ("Um minuto basta quando ninguém corta nem reescreve, como no caso do Otávio. Se a sua ajuda corta o áudio, a revisão continua sendo a leitura inteira do capítulo 23"), mas o Para guardar e a questão 03 da verificação ("A revisão está levando cinco minutos por peça. Qual é o diagnóstico?" com gabarito "O manual de voz não está específico o bastante") voltam a apresentar a regra sem condição. O leitor cuja assistente corta áudios, que é o caso da Renata no capítulo anterior, lê a peça inteira como o cap. 23 manda, passa de dois minutos e ouve do gabarito que o manual dele está ruim. O fechamento contradiz a ressalva da prosa.'
    correcao: 'Guardar, item 3: "Quando a ajuda só digita e formata, uma revisão acima de dois minutos por peça aponta para o manual, e não para a equipe." Questão 03: "A sua ajuda só digita e formata o que você manda, e a revisão está levando cinco minutos por peça. Qual é o diagnóstico?"'
  - criterio: clareza
    trecho: 'Há quatro condições para delegar, e Otávio tinha as quatro. O primeiro é ter publicado ao menos trinta peças no seu formato-base'
    por_que: 'A troca de "sinais" por "condições" deixou a concordância de antes: "O primeiro... O segundo... O terceiro... O quarto" continuam no masculino, referidos a "condições". É o parágrafo que define a lista usada na oficina, no checklist e na verificação. Um revisor de editora pararia aqui na primeira leitura.'
    correcao: '"A primeira é ter publicado ao menos trinta peças no seu formato-base (capítulo 20)... A segunda é ter um manual de voz escrito... A terceira é que a etapa... A quarta é conseguir apontar uma frase..."'
  - criterio: coerencia
    trecho: 'A pergunta que o cliente deveria fazer'
    por_que: 'O título da seção Do caderno para a rede sobrou da versão anterior, em que a última frase de toda peça era uma pergunta. A intro e o esqueleto agora pedem "A situação / O risco / O que fazer / A última frase" com "O seu fecho de sempre (uma pergunta, uma consequência, uma regra)". O título promete uma peça sobre uma pergunta, e o esqueleto não a entrega. O esqueleto também é genérico: serve para qualquer peça de qualquer capítulo e não conversa com o tema. As três regras tratam do processo de delegar, e não do conteúdo da peça.'
    correcao: 'Duas saídas. (a) Mínima: renomear para "A primeira peça que vai para outras mãos". (b) Melhor: adotar a estrutura do PWA, que ninguém usou até aqui e espelha o tema do capítulo (escolher quem contratar): "Como escolher um profissional da sua área", com três critérios que um leigo consegue conferir sozinho, mais o convite honesto "se passar nos três, você está bem servido, comigo ou não". O resultado é uma peça nova, sobre a área do leitor, e a última frase continua sublinhada e dele.'
  - criterio: aplicabilidade
    trecho: 'O manual e o corpus: a linha que o seu código de ética exige no manual e as dez peças que você entregaria'
    por_que: 'São três problemas no mesmo campo. (1) O espaço não comporta o pedido: na p20 são três linhas numeradas, uma para a regra de ética e duas para dez títulos ou datas escritos à mão. (2) Parte do público não tem código de publicidade (consultoria, ensino, confeitaria, design de interiores, que o próprio capítulo usa como exemplo). Para esse leitor, o critério "O manual do campo 05 tem uma linha sobre o que o seu código proíbe" não tem como ser cumprido. (3) No dia 24, a maioria dos leitores não tem dez peças publicadas, e o campo não diz o que fazer nesse caso, embora o objetivo admita contratar "daqui a um ano".'
    correcao: 'Rótulo: "O manual e o corpus: a regra de ética (ou, se a sua profissão não tem código de publicidade, a regra que você nunca quebra) e as peças que você entregaria". Exemplo: "Na linha 1, a regra. Nas outras, as datas das peças que mais soam como você; se ainda não tem dez, as que tem e o mês em que terá as dez." Subir para 5 linhas numeradas. Critério: "O manual do campo 05 tem uma linha com a regra de ética ou a regra que você nunca quebra."'
  - criterio: honestidade
    trecho: 'Em áreas regulamentadas, nada de promessa de resultado nem de chamada para contratar.'
    por_que: 'A proibição de promessa de resultado é comum aos códigos. A de chamada para contratar varia: vale com rigor para a advocacia, mas as regras médicas revistas em 2023 passaram a admitir a divulgação de serviços e até de preços. Dita para todas as áreas regulamentadas, a regra vira afirmação de fato que o leitor médico pode desmentir (lição cap02-r2: na dúvida, formular pelo que é certo). O mesmo vale, em menor grau, para "como as da medicina, da psicologia e de outras áreas, proíbem promessa de resultado, captação indevida de clientela e menção a casos identificáveis", que se sustenta porque diz "captação indevida".'
    correcao: '"Em áreas regulamentadas, nada de promessa de resultado, e confira no seu código se a chamada para contratar é permitida. Na advocacia não é, e a pergunta final faz o papel que a chamada faria."'
  - criterio: ritmo
    trecho: 'Na quarta semana, a revisão caiu para pouco mais de um minuto, e continuou ali. O manual tinha passado de seis para nove linhas.'
    por_que: 'O parágrafo tem sete frases (a regra do projeto é no máximo seis) e junta três coisas: o dado do Otávio, a regra geral dos dois minutos e a ressalva para quem recebe corte. A ressalva, que é a informação mais importante para quem trabalha com áudio, fica soterrada entre duas frases de regra.'
    correcao: 'Dividir em dois. O primeiro fica com o Otávio e a regra: "Na quarta semana... nove linhas. A revisão curta é o sinal de que o documento está bom. Quando ela passa de dois minutos por peça, semana após semana, o problema está na instrução, e não na equipe." O segundo abre com a condição: "Um minuto basta quando ninguém corta nem reescreve. Se a sua ajuda corta o áudio... número de marcas. Melhorar o manual resolve de uma vez o que corrigir peça por peça resolve só naquela peça."'
  - criterio: ritmo
    trecho: 'Quando a triagem de comentários passou para a agência, no segundo mês, seguiu a mesma lógica.'
    por_que: 'O parágrafo da triagem continua em "Revisar sem virar gargalo", uma seção que não trata disso (lição cap01-r2: a seção não vira depósito de assuntos que o intertítulo não cobre), e narra o segundo mês antes de "Começar pequeno" explicar por que a triagem só entrou depois. A rodada anterior já pedia a mudança.'
    correcao: 'Levar o parágrafo inteiro para "Começar pequeno", logo depois de "Só depois de quatro semanas sem nenhuma troca de palavra ele passou a arte e a triagem de comentários.", abrindo com "A triagem seguiu a mesma lógica."'
  - criterio: voz
    trecho: 'O que este capítulo acrescenta é o prazo: observe um mês, e só passe a etapa seguinte depois de quatro semanas sem nenhuma troca.'
    por_que: 'O narrador aponta para o próprio livro, como em texto de curso. O capítulo tem "No capítulo 4" duas vezes na prosa, "capítulo 23" três vezes, "capítulo 11" no box e mais duas menções ao cap. 4 numa explicação de duas frases do gabarito. Uma remissão ajuda; esse volume transforma a prosa em índice.'
    correcao: '"A ordem é a do capítulo 23, da etapa mais mecânica para a menos, com um prazo: observe um mês, e só passe a etapa seguinte depois de quatro semanas sem nenhuma troca." Em "A pressa em delegar tudo de uma vez é a mesma pressa que, no capítulo 4, levou à agência antes da voz", tirar o número: "...a mesma que, dois anos antes, levou Otávio à agência antes da voz."'
  - criterio: metodo
    trecho: '“Arte, legenda e agendamento.”'
    por_que: '"Legenda" é ambígua: pode ser a legenda do vídeo, que transcreve a fala, ou o texto que acompanha a publicação, que alguém escreve. No segundo sentido, o escopo "que multiplica você" e o exemplo da paisagista ("transcrição sem troca de palavras, legenda e agendamento") passam à agência justamente a parte com palavras novas, o que contradiz a regra de que nenhuma frase é dela.'
    correcao: 'No compara: "“Arte, legenda tirada do texto, agenda.”" No exemplo do campo 02: "...transcrição sem troca de palavras, legendas do vídeo e agendamento."'
  - criterio: clareza
    trecho: 'Otávio não entregou tudo de uma vez, como tinha dito a Sílvia.'
    por_que: 'A frase admite duas leituras: ele disse a Sílvia que não entregaria tudo, ou não entregou, ao contrário do que tinha dito. A frase abre a seção que dá o exemplo de delegar por etapas.'
    correcao: '"Como tinha combinado com Sílvia, Otávio não entregou tudo de uma vez."'
  - criterio: ritmo
    trecho: 'a empresária das três lojas de material de construção, a que tinha chegado ao escritório depois do telefonema de Seu Ednaldo, cliente havia um ano, mandou ao escritório o link de uma das peças'
    por_que: 'Dois apostos encadeados separam o sujeito do verbo, e "cliente havia um ano" pode ser lido como aposto de Seu Ednaldo, que era cliente havia nove. A palavra "escritório" aparece duas vezes na mesma frase. É a frase que abre o fecho do capítulo.'
    correcao: '"No fim de maio, uma cliente mandou ao escritório o link de uma das peças. Era a empresária das três lojas de material de construção, que tinha chegado havia um ano, três semanas depois do telefonema de Seu Ednaldo. Perguntava se a folha do banco de horas dela estava certa. Tinha lido na terça e conferido na quarta."'
  - criterio: originalidade
    trecho: 'No capítulo 4, a agência fazia bem o trabalho que lhe tinham pedido, e o trabalho era impossível: inventar, a partir de uma reunião de uma hora, a voz de alguém que ainda não a conhecia.'
    por_que: 'Repete quase palavra por palavra o cap. 4 ("A agência do Otávio fez bem o trabalho que lhe foi pedido. O que ninguém percebeu é que o trabalho pedido era impossível... não pode inventá-la a partir de uma reunião de uma hora"). O eco pode ser intencional, mas, na abertura da primeira seção, o leitor da sequência lê como reciclagem. O ganho novo vem na frase seguinte ("a diferença não estava nela").'
    correcao: 'Condensar o eco numa oração e seguir para o que é novo: "Dois anos antes, a agência tinha recebido uma tarefa impossível: inventar a voz de alguém que ainda não a conhecia. Com as mesmas pessoas, passou a produzir peças do Otávio em abril, e a diferença não estava nela."'
  - criterio: coerencia
    trecho: 'Entre um momento e outro, Otávio aprendeu a dizer em que uma frase se afasta dele. Tudo o que levou na pasta saiu daí'
    por_que: 'Exagero lógico: o manual de voz sai daí, mas o maço de dez peças e a folha de fluxo saíram de um ano e meio publicando e da rotina dos versos (cap. 21). A frase atribui a pasta inteira à quarta condição.'
    correcao: '"...se afasta dele. O manual saiu daí, e o resto da pasta, de um ano e meio escrevendo toda semana. Nada daquilo uma agência consegue descobrir sozinha."'
edicoes_de_linha:
  - '"Helena foi a mais desconfiada." -> "Helena desconfiou." ("a mais" pressupõe um grupo que o texto não apresenta)'
  - '"A urgência, que foi o motivo do Otávio no capítulo 4, é o pior deles." -> "Dos motivos para contratar, a urgência, que foi a do Otávio no capítulo 4, é o pior."'
  - 'Verificação 01, opção correta: "Porque recebeu voz, manual e escopo definidos." -> "Porque recebeu manual, amostra de voz e escopo definidos." (a agência não recebe "voz")'
  - 'Gabarito 04: "A urgência foi o motivo do Otávio no capítulo 4, e é o pior. Contratar por falta de tempo, antes de conhecer a própria voz, é o erro do capítulo 4." -> "A urgência foi o motivo do Otávio no capítulo 4, e é o pior. Contratar por falta de tempo, antes de conhecer a própria voz, repete aquele erro."'
  - '"Uma dúvida técnica respondida por outra pessoa seria, afinal, uma opinião jurídica emitida em nome de quem não a leu." -> "Uma dúvida técnica respondida por outra pessoa seria, afinal, uma opinião jurídica que ele não deu, assinada com o nome dele."'
  - '"Ele marcaria qual deles seria publicado e, em cada um, sublinharia a última frase" -> "Antes das fotos, marcaria qual deles seria publicado e sublinharia a última frase de cada um" (a marca precisa estar na foto)'
  - '"publicado ao menos trinta peças no seu formato-base" -> "publicado ao menos trinta peças no seu formato-base (capítulo 20)" (a mesma régua das trinta repetições do cap. 20; a remissão justifica o número)'
diagramacao:
  - 'p20, campo 05: três linhas numeradas para uma regra de ética mais dez títulos ou datas escritos à mão. Não cabe. Subir para 5 linhas (ver problemas) e reconferir se o campo 06 continua na p20 sem quebrar.'
  - 'p22: cerca de 20% de branco no pé, depois da nota do roteiro, porque a verificação abre página nova na p23. É aceitável se a abertura em página nova do Fechamento for decisão de projeto; se não for, o título "Verificação" e as duas primeiras questões cabem ali.'
  - 'p18: cerca de 27% de branco depois do Para guardar, antes da oficina em página ímpar. Aceito pelo projeto. p24: cerca de 60% livres no fim do capítulo, também aceitável.'
  - 'p21: cerca de 15% de branco antes do esqueleto indivisível (p22). Aceito pelo projeto; fica só o registro.'
  - 'Figura 24.1 (p17): legível em preto e branco, com o valor por extenso no rótulo e título que afirma. Nada a corrigir. As PNGs (20:55) são posteriores ao manuscrito (20:54), portanto a revisão visual vale para o texto atual.'
veredito: 'O capítulo resolveu quase tudo o que a rodada 1 apontou e está a uma passada da aprovação, mas volta por um bloqueador ético de conserto simples (o maço de versos, com o verso de pareceres de clientes, entregue inteiro à agência) e por três pontas soltas: a sexta linha do manual já proibia a troca que gerou a sétima, a regra dos dois minutos aparece sem condição no Guardar e na verificação, e o título da rede não corresponde ao esqueleto.'
