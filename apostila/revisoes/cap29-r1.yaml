capitulo: 29
iteracao: 1
notas: {metodo: 9.0, voz: 8.4, originalidade: 8.6, clareza: 8.9, ritmo: 8.7, concretude: 8.8,
        coerencia: 7.8, aplicabilidade: 8.5, impresso: 8.4, honestidade: 8.3}
bloqueadores:
  - "Sigilo e contradição interna: a revisão que levou a peça mínima do Caio para uma 'foto do arquivo, de uma laje de outra obra, entregue em março e com a autorização do dono assinada' não chegou a três lugares. A oficina (campo 01) dá como modelo 'A do Caio: uma foto da obra do dia e a frase que ele diria ao cliente'; o protocolo-modelo diz 'Nas semanas sem tempo, publico a foto do dia com uma frase'; e o parágrafo da terceira linha fala de 'uma laje molhada sem tratamento de cor', que era a foto da versão antiga (laje de Barão Geraldo, obra em andamento). O leitor recebe como modelo exatamente a conduta que o livro proíbe (foto de obra em curso, sem autorização, na semana do atendimento; lições cap03-r2 e cap13-r1)."
pontos_fortes:
  - "Cena de abertura precisa e crível: três atrasos com três causas de ofício diferentes (serralheria, chuva sobre laje, síndico e plano de reforma), a quarta-feira perdida no sofá, a peça de três minutos. O protocolo nasce da cena, e não de uma definição."
  - "A distinção entre números 'barulhentos' e 'silenciosos' ('Quem mede o vale pelos números barulhentos conclui que nada está acontecendo. Quem mede pelos silenciosos vê pouca coisa, mas vê que alguma coisa está.') é própria, memorável e amarra o capítulo ao painel do cap. 28 sem repeti-lo."
  - "Fecho em cena, com ganho novo: a página arrancada, presa ao lado da prancheta, e a quinta linha escrita à mão. Não anuncia o capítulo 30 nem descreve a oficina."
  - "Honestidade gráfica exemplar na figura 29.1 ('sem escala; mostra a forma da curva, e não uma medição'; 'O momento exato da virada muda de pessoa para pessoa') e o box Conceito troca o 'mês 6 ao 9' do PWA por 'depois de meses'. A rede cumpre a regra de ouro: o vale é o do cliente na área do leitor, e o 'Evite' proíbe falar do próprio vale como produtor de conteúdo."
problemas:
  - criterio: coerencia
    trecho: "A do Caio: uma foto da obra do dia e a frase que ele diria ao cliente se tivesse um minuto."
    por_que: "Contradiz a cena ('Uma foto do arquivo, de uma laje de outra obra, entregue em março e com a autorização do dono assinada') e a p. 69 ('uma foto do arquivo de obras entregues'). Além disso, usa o personagem em foco como exemplo da oficina (lição cap01-r1: exemplos da oficina em profissões diferentes). O mesmo resíduo aparece em 'publico a foto do dia com uma frase' e em 'uma laje molhada sem tratamento de cor'. Ver bloqueador."
    correcao: "Campo 01: 'Seja específico. Um corretor de seguros: um áudio de noventa segundos respondendo a uma pergunta já anotada, sem regravar.' (ou outra profissão não usada nos caps. 28 e 30). P. 87: '“Nas semanas sem tempo, publico uma foto do arquivo com uma frase” serve'. P. 95: trocar 'uma laje molhada sem tratamento de cor' por 'uma foto de arquivo sem tratamento de cor'."
  - criterio: coerencia
    trecho: "Na primeira quinta daquele mês, às sete e quarenta, parado no degrau de uma obra que não andava"
    por_que: "Repete, quase palavra por palavra, a abertura do cap. 20 ('Às sete e quarenta da segunda quinta-feira de outubro, Caio sentou no degrau da escada de um prédio'): mesmo mês, mesma hora, mesmo degrau. Lida sem marcação, parece descuido (lição cap02-r1: nenhuma imagem ou cena se repete entre capítulos). Como eco deliberado, um ano depois, seria um achado, mas o texto não o faz."
    correcao: "Ou mudar hora e lugar ('Na primeira quinta daquele mês, às seis e meia, no carro, parado na fila da concreteira'), ou assumir o eco: 'Na primeira quinta daquele mês, às sete e quarenta, sentou no mesmo tipo de degrau em que, um ano antes, escrevia as cinco linhas sem esforço, e percebeu que não tinha foto nem assunto.'"
  - criterio: clareza
    trecho: "Ele não a tirou do formato-base encolhido por pressa. Pensou nela como outra peça, feita para existir num dia em que as cinco linhas não cabiam."
    por_que: "O cap. 20 definiu o formato mínimo viável como a peça que 'cabe no seu pior mês' e advertiu que 'a frase solta, a foto sem contexto' falham no teste do repertório. O leitor atento vai perguntar: se o FMV já cabe no pior mês, por que preciso de uma peça ainda menor, e por que agora a foto com uma linha vale? O capítulo não responde. Além disso, a falha do Caio na cena não foi de tempo (as cinco linhas custam menos de quinze minutos), foi de assunto: a seleção de quarta não aconteceu. A frase também repete a batida esgotada 'não fez o óbvio; fez outra coisa' (lição cap04-r1)."
    correcao: "Substituir as duas frases por algo como: 'O pior mês do capítulo 8 é o que se pode prever. Outubro não estava em conta nenhuma: faltou a quarta-feira da seleção, e sem ela não havia assunto. A peça mínima é a exceção para esse mês, e não um formato-base menor; por isso pode abrir mão da história inteira, como o capítulo 20 não permitiria toda semana.'"
  - criterio: voz
    trecho: "As quatro linhas que Caio tinha escrito em julho não eram uma promessa de esforço. Eram instruções"
    por_que: "Antíteses explícitas acima do teto de uma por seção (lição cap01-r1). Em 'O protocolo do mês difícil': 'não eram uma promessa de esforço. Eram instruções'; '“Vou me esforçar…” não serve… “Nas semanas sem tempo…” serve'; 'Quem lê raramente percebe uma quinta-feira mais curta. Percebe um aviso de que você sumiu.' Em 'Por que as pessoas param': 'A sequência não quebra na primeira semana vazia. Quebra na segunda'; 'Ele não a tirou… Pensou nela como outra peça'; 'um problema de quem escreve, e não de quem lê'. O lint conta 1 'não é X, é Y', mas o tique está espalhado em formas que ele não pega."
    correcao: "Manter uma por seção. Sugestões: 'As quatro linhas que Caio tinha escrito em julho eram instruções, escritas por alguém com a cabeça boa…'; cortar 'Quem lê raramente percebe uma quinta-feira mais curta. Percebe um aviso de que você sumiu.' e deixar 'Sem anúncio, a semana fraca continua sendo uma semana fraca, e passa.' como fecho do parágrafo; 'O tédio do formato costuma ser de quem escreve.'"
  - criterio: honestidade
    trecho: "Quase nunca alguém decide parar."
    por_que: "Generalizações sobre terceiros bem acima do teto de duas (lição cap01-r4/cap02-r2): 'o motivo que se diz costuma ser falta de tempo', 'Quase nunca alguém decide parar', 'O tédio do formato é quase sempre um problema de quem escreve', 'Quem lê raramente percebe', 'A vontade de mudar tudo costuma aparecer no vale', 'Quase sempre é o vale falando', 'Ele costuma voltar menor', 'na maior parte dos casos', e o título 'As quatro causas mais comuns de parar'. Somam-se afirmações categóricas sobre o tempo do retorno ('porque eles não aparecem no quarto mês') que a própria legenda da figura relativiza."
    correcao: "Deixar no máximo duas e converter o resto em observação do Caio ou em afirmação sobre o leitor. Ex.: 'Uma semana ruim passa sem peça…' (cortar 'Quase nunca alguém decide parar.'); tabela: 'Quatro causas de parar, e o antídoto de cada uma'; p. 21: 'E os resultados, quase sempre, ainda não apareceram.' (cortar 'porque eles não aparecem no quarto mês'); nota: 'Quase sempre é o vale falando' -> 'Pode ser o vale falando'."
  - criterio: honestidade
    trecho: "Depois do vale, a dinâmica se inverte, e é isso que torna o segundo ano mais leve que o primeiro."
    por_que: "Promessa de resultado em tom de lei. O parágrafo transpõe para a prosa o diagrama do PWA ('Alguém chega citando uma peça; a produção deixa de ser aposta e vira caminho; …; o custo de cada peça cai') como sequência garantida, e fecha com 'A presença passa a trabalhar sozinha'. É também o trecho mais genérico do capítulo, um resumo em lista no meio de uma seção que vinha em cena."
    correcao: "Ancorar no Caio e condicionar: 'Para o Caio, o segundo ano foi mais leve que o primeiro, e não por disciplina. Alguém tinha chegado citando uma peça; as dúvidas dos clientes novos entravam no caderno; as cinco linhas custavam menos do que em junho. Quando isso acontece, a produção deixa de ser aposta. A leveza vem de cada parte do sistema, dos capítulos 19 a 24, ter sido desenhada para custar pouco.'"
  - criterio: aplicabilidade
    trecho: "Defini a minha peça mínima"
    por_que: "Teste da pontuação linha a linha (lição cap01-r2): com 3+3+2+2 e corte em 7, o leitor que não definiu a peça mínima soma 3+2+2 = 7 e segue. O item central do capítulo pode ficar em branco. O campo 02 também perdeu, em relação à fonte, o 'por que essa?', que dá ao antídoto do campo 03 algo concreto em que se apoiar."
    correcao: "Pontos 4/2/2/2 com corte em 7, ou manter os pesos e escrever na condição: 'Com 7 pontos ou mais, e a peça mínima definida, siga para o capítulo 30.' No campo 02, acrescentar uma linha: 'Por que essa, em uma frase: quando ela já apareceu para você?'"
  - criterio: coerencia
    trecho: "Caio, em março, achou que já tinha falado demais de paredes úmidas; contou e viu que eram quatro peças em nove meses"
    por_que: "É a terceira vez que o livro dá ao Caio a mesma batida de 'tédio de quem escreve, desmentido por uma conta': cap. 20 ('A repetição que cansava o Caio ainda era novidade para quem lia', com a conta da leitora de seis das dez quintas) e cap. 25 ('A vontade de não voltar a um tema, porque já falei disso'). A ideia 'volte sem anunciar' também já tem nota própria no cap. 8 ('Volte sem anunciar'), sem remissão aqui."
    correcao: "Cortar a cena de março e resolver o tédio com uma remissão: 'O tédio do formato o capítulo 20 já resolveu com uma conta: quem lê viu uma parte pequena das suas peças.' Na quarta linha, remeter: 'O capítulo 8 já tinha avisado: volta anunciada pesa mais.' Usar o espaço para dar à comparação, hoje com duas frases, uma imagem do Caio ou de um figurante."
  - criterio: coerencia
    trecho: "Foi a primeira vez que Caio viu, num número, o efeito do conjunto de que trata o capítulo 25."
    por_que: "No cap. 25 o Caio já contava quem chegava citando peças ('Quando Caio passou a perguntar como as pessoas o tinham encontrado, o link mandado por alguém apareceu mais vezes do que a busca') e já tinha visto o conjunto trabalhar na mulher que leu vinte e um textos numa noite. 'Primeira vez' é falso para o arco."
    correcao: "'Foi a primeira vez que o conjunto trabalhou num mês em que ele quase não publicou.'"
  - criterio: concretude
    trecho: "Noutra, em Barão Geraldo, choveu doze dias seguidos sobre uma laje que precisava secar."
    por_que: "Detalhe de ofício impreciso para um arquiteto de reformas de apartamentos antigos: laje exposta à chuva pede cobertura ou terraço, e 'laje que precisava secar' lido por um engenheiro soa errado (concreto novo quer cura úmida; o que precisa de base seca é a impermeabilização). A frase publicada, 'laje que não secou não se cobre', herda a ambiguidade de 'cobrir'. No Guanabara, 'fosse carimbado de novo' também é vago para um plano de reforma."
    correcao: "'Noutra, a cobertura de um prédio em Barão Geraldo, choveu doze dias seguidos sobre a laje do terraço, que precisava estar seca para receber a impermeabilização.' Linha publicada: 'laje úmida não recebe manta, nem que a obra atrase um mês.' Guanabara: 'até que o plano de reforma, entregue em agosto, voltasse com a nova responsabilidade técnica assinada.'"
  - criterio: honestidade
    trecho: "ou apenas de uma tristeza sem motivo claro. O protocolo não pergunta a causa"
    por_que: "Num livro lido também por psicólogas e médicos, sugerir que uma tristeza persistente sem motivo se atravessa mantendo a sequência de publicações, sem nenhuma ressalva, é descuidado. O mesmo vale para 'doença na família' sob a regra 'nunca zero'. Não chega a ser bloqueador, mas o mentor do livro diria onde o protocolo não se aplica."
    correcao: "Trocar 'ou apenas de uma tristeza sem motivo claro' por 'ou de um cansaço que não passa com o fim de semana', e acrescentar ao fim do parágrafo: 'Há meses que pedem outra coisa, como um luto ou uma doença, sua ou de alguém próximo. Nesses, parar é legítimo, e a sequência se refaz depois; o protocolo é para o mês apertado, e não para a vida em crise.'"
  - criterio: honestidade
    trecho: "Por volta do terceiro mês, os pais acham que o filho parou de avançar. Quase sempre ele está consolidando."
    por_que: "O exemplo do 'Faça assim' é uma frase de saúde que tranquiliza sem critério, justamente o que a regra 3 da própria rede ('Não prometa o resultado') e o roteiro_nota ('nunca garanta o resultado') proíbem. Também não mostra o sinal, que é a regra 2."
    correcao: "'Uma fonoaudióloga: “Por volta do terceiro mês, muitos pais acham que o filho parou de avançar. Repare se ele entende mais palavras do que fala: isso costuma ser consolidação. Se nem isso mudou em um mês, a gente reavalia.”'"
  - criterio: ritmo
    trecho: "A primeira causa se trata com os números certos, como a seção anterior mostrou. A segunda causa é a mais traiçoeira"
    por_que: "Parágrafo com 7 frases (limite 6, lição cap01-r2). Na seção do protocolo, as linhas são comentadas na ordem 2, 4, 3, sem motivo aparente; a quarta ('a mais difícil de cumprir') funcionaria melhor como clímax, depois da terceira."
    correcao: "Cortar 'Quase nunca alguém decide parar.' (resolve também uma generalização). Inverter os parágrafos que começam por 'A quarta linha foi a mais difícil de cumprir' e 'A terceira linha pede desapego do acabamento'."
  - criterio: voz
    trecho: "Vale saber qual delas é a sua antes que ela apareça"
    por_que: "Narrador que anuncia (lição cap01-r1), e o tique se repete no fim: 'O protocolo vale para todos eles. Por isso vale relê-lo'. 'Quase' também vira tique: 'quase não se mexem', 'Quase nunca', 'quase sempre um problema', 'Quase sempre é o vale falando', 'quase todas sobre peças antigas'."
    correcao: "'Descubra qual delas é a sua antes que ela apareça…'; 'O protocolo serve para todos eles. Releia-o uma vez por ano, num mês bom…'."
edicoes_de_linha:
  - "Um ano e meio antes, aquela quinta teria sido o fim da sequência. -> Um ano e meio antes, quando ainda trocava de formato toda semana, uma quinta assim teria sido o fim de mais um. (Um ano e meio antes não havia sequência: as quintas começaram em junho do ano anterior.)"
  - "e são eles que a gente confere de manhã -> e são eles que se conferem de manhã (tratamento uniforme)"
  - "Tabela: As quatro causas mais comuns de parar, e o antídoto de cada uma -> Tabela: Quatro causas de parar, e o antídoto de cada uma"
  - "a serralheria que fazia as janelas de ferro da mulher da folha dobrada -> a serralheria que refazia as duas janelas de ferro da cliente da folha dobrada (no cap. 25, nove das onze janelas foram recuperadas; só duas foram refeitas)"
  - "Por volta da décima semana, teve vontade de mudar de formato; na vigésima, de parar. -> conferir com o cap. 20, em que na décima sétima semana o Caio está sereno e em novembro vende as luzes; sugerir 'na vigésima, depois de vender as luzes, de parar'"
  - "Uma foto torta, uma frase sem revisão, uma laje molhada sem tratamento de cor -> Uma foto torta, uma frase sem revisão, uma foto de arquivo sem tratamento de cor"
  - "O protocolo vale para todos eles. Por isso vale relê-lo uma vez por ano -> O protocolo serve para todos eles. Releia-o uma vez por ano"
  - "Guardar item 2 (três frases) -> 'A sequência não quebra na primeira semana ruim, e sim na segunda; a peça mínima impede que uma vire duas.' (Para guardar pede uma frase por ideia; o item 1 também tem duas.)"
  - "Quase sempre é o vale falando. -> Pode ser o vale falando."
  - "Verificação, questão 03, opção d: 'Porque a peça mínima precisa ser preparada com antecedência, no seu modo.' -> distrator parcialmente verdadeiro (a nota manda defini-la 'num mês bom'); trocar por 'Porque no mês bom o formato-base custa menos e sobra tempo para escrever.'"
diagramacao:
  - "Páginas desatualizadas: os PNG de apostila/saida/qa/cap29 são anteriores à última versão do manuscrito. P. 12 ainda traz 'Uma foto da laje molhada de Barão Geraldo, tirada ali mesmo' e 'foto do caixilho quebrado da serralheria'; p. 17 traz 'o Caio de três anos antes' e 'um síndico que achava que podia proibir a troca de piso'; p. 13 e 14 têm frases que não estão no .md ('e é nele que mais gente para'; 'quase nunca é por falta de tempo'). Refazer o build antes da próxima revisão; o QA visual abaixo vale só como indício."
  - "p. 15: cerca de sete linhas em branco no pé, antes de 'O protocolo do mês difícil' (intertítulo, parágrafo e figura 29.2 presos juntos). Branco evitável: deixar o parágrafo de abertura da seção acompanhar o intertítulo e soltar a figura."
  - "p. 14: cerca de cinco linhas em branco depois da tabela 29.1, com o parágrafo seguinte já na p. 15. Deixar o parágrafo quebrar entre as páginas."
  - "p. 20: quase metade da página em branco depois do 'Confira antes de seguir', antes da seção de rede, que começa na p. 21. A rede não precisa de página nova pelo projeto; o cabeçalho e as três regras caberiam aqui."
  - "p. 24: o checklist de aplicação fica sozinho, com cerca de 60% da página em branco. Aceitável por ser o fim do capítulo, mas vale testar se o respiro da p. 23 (verificação) comporta o cabeçalho do checklist."
  - "p. 13, figura 29.1: as curvas se cruzam entre o mês 9 e o 12, enquanto o texto situa o vale 'entre o segundo e o quinto mês'. Não é erro (o esquema é ilustrativo), mas um leitor apressado vê a virada muito depois do que a prosa sugere; considerar aproximar o cruzamento do mês 8 ou dizer na legenda que a virada pode vir depois do vale."
veredito: "Capítulo sólido, com cena de abertura e fecho de nível alto, mas não aprova: sobraram resíduos da versão anterior da peça mínima (foto da obra do dia) que contradizem a cena e a regra de sigilo, a abertura repete a do cap. 20, e o texto precisa cortar antíteses e generalizações e reconciliar a peça mínima com o FMV do cap. 20."
