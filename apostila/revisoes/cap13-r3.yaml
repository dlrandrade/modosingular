capitulo: 13
iteracao: 3
notas: {metodo: 9.0, voz: 9.1, originalidade: 9.2, clareza: 8.7, ritmo: 9.0, concretude: 9.2,
        coerencia: 8.6, aplicabilidade: 8.8, impresso: 8.9, honestidade: 9.0}
bloqueadores: []
pontos_fortes:
  - 'Os dois bloqueadores da r2 foram resolvidos, e de modo coerente em todos os lugares. A oficina pede um episódio "de preferência de semanas ou meses atrás", a rede abre com "Publique a peça da oficina quando o calendário permitir", o "Confira antes de seguir" cobra "O episódio não é desta semana, ou a folha ficou guardada com a data em que pode sair", e a cena mostra a espera por inteiro: "Lúcia anotou a data e esperou mais quatro semanas; agora eram duas pessoas que não podiam receber o texto como recado." A regra do calendário virou a lição mais bem ensinada do capítulo.'
  - 'O modo da Lúcia voltou, e de forma elegante: "pediu à amiga do grupo de estudos que lhe mandasse quatro perguntas, sem saber do caso". As quatro perguntas ("O que aconteceu, numa frase? O que disso é só daquela pessoa? Do que isso é exemplo? O que alguém faria com isso sozinho?") são as quatro operações ditas em linguagem comum. Isso ensina o método ao leitor e preserva o sigilo, porque a amiga nunca vê o caso.'
  - 'Duas réguas memoráveis e fáceis de repetir a outra pessoa: "A frase mais bonita da sessão é, quase sempre, a que mais identifica. Ela é bonita porque é particular, e é particular porque é da pessoa." e o teste do horóscopo ("se o padrão caberia num horóscopo, está grande demais; se só faz sentido para quem estava na sala, está pequeno demais"). As duas superam a fonte.'
  - 'O parágrafo da autorização ("Numa relação de cuidado, dizer não ao profissional que cuida de você é difícil, e a autorização dada nessas condições pode não ser tão livre quanto parece") e a grade "Tirei / Não havia" continuam sendo o que o capítulo tem de mais adulto e de mais executável no papel.'
problemas:
  - criterio: clareza
    trecho: 'Uma pessoa sente um aperto que começa no domingo à tarde'
    por_que: 'A tabela 13.1 é a demonstração do método, e nela a operação mais importante do capítulo fica vazia. A linha Isolado já chega sem nenhum identificador, e a linha Despersonalizado ("Alguém sente um aperto que começa no domingo, no fim da tarde") é a mesma frase com "Uma pessoa" trocada por "Alguém". O "O que fez" diz "Tirou horário exato, mãe, ferro e a frase literal", mas nada disso estava na linha de cima. "No fim da tarde" ainda é mais preciso que "à tarde", o que caminha na direção das seis horas que ela cortou. A prosa repete o problema: isolar dá "uma pessoa sente um aperto que começa no domingo à tarde", e logo depois a despersonalização trabalha sobre "aquela frase da sessão", isto é, sobre o bruto, e não sobre o isolado. O leitor apressado sai achando que isolar já apaga a pessoa e que despersonalizar é trocar um pronome. A oficina faz certo: o exemplo do campo 01 mantém "o filho de quatro anos", e o campo 03 o retira. Tabela e oficina ensinam coisas diferentes.'
    correcao: 'Isolar = o fato em uma frase, sem interpretação, ainda com os identificadores. Prosa: "A primeira foi fácil: a paciente das cinco sente um aperto no domingo, por volta das seis, quando a mãe começa a passar as camisas e o cheiro do ferro atravessa a porta. Isolar é isso..." Tabela, Isolado: "A paciente sente um aperto no domingo às seis, quando a mãe passa as camisas e o cheiro do ferro atravessa a porta". Despersonalizado: "Alguém sente um aperto que começa no domingo à tarde". Assim o "O que fez" (tirou horário, mãe, ferro e frase literal) corresponde ao que de fato sumiu entre as duas linhas.'
  - criterio: coerencia
    trecho: 'Guardou a folha dentro do caderno de campo e esperou.'
    por_que: 'A folha é a das quatro respostas escritas "no papel", e a resposta da segunda pergunta é justamente a lista do que identifica: "O horário exato. A mãe no quarto ao lado. O cheiro do ferro atravessando a porta". Essa folha vai para o caderno de campo, que "fica na bolsa" e guarda coisas "sempre sem nome, nunca um episódio". O capítulo do sigilo mostra a personagem mais cuidadosa do livro levando na bolsa, por dois meses, a lista dos identificadores de uma paciente. Isso desmente a imagem final ("O cheiro do ferro continuava no caderno trancado, onde pertencia"), porque o ferro também estava na folha da bolsa.'
    correcao: 'Uma frase resolve e ainda reforça a regra dos dois cadernos: "Com as quatro operações prontas, Lúcia copiou para o caderno de sessão a lista do que tinha tirado, rasgou essa parte da folha e guardou o resto no caderno de campo." Outra saída é a resposta 2 ser escrita, desde o início, no caderno de sessão.'
  - criterio: aplicabilidade
    trecho: '{rotulo: "O caso", texto: "Deslocado no tempo e sem nada que identifique alguém.", linhas: 3}'
    por_que: 'O esqueleto da rede repete a oficina, contra a lição cap02-r2. O leitor já escreveu o caso despersonalizado (campo 03), o padrão (04), o critério (05) e a peça montada em 7 linhas (06). Na p. 23, ele rascunha tudo de novo em 11 linhas, e a peça passa a ser escrita pela terceira vez. As duas estruturas também não batem: o campo 06 manda juntar "as quatro partes" (as operações), e o esqueleto tem outras quatro (caso, reconhecimento, padrão, critério). O "Reconhecimento" aparece só na rede, sem campo correspondente.'
    correcao: 'Use esqueleto_rotulo, como no cap. 10: "Passe a limpo a peça do campo 06, nesta ordem: o caso (campo 03), a frase de reconhecimento, o padrão (04) e o critério (05)", com 2 linhas por parte. Ou mude o exemplo do campo 06 para "Junte, nesta ordem, o caso, uma frase que diga a quem lê que isso não acontece só com ele, o padrão e o critério", e deixe o esqueleto só para passar a limpo.'
  - criterio: coerencia
    trecho: 'A frase literal de alguém, com as palavras dele.'
    por_que: 'O cap. 14, logo em seguida, manda o contrário: "Cite a pergunta como ela chega, entre aspas. As palavras de quem pergunta são o que faz outra pessoa se reconhecer", e seu checklist cobra "As perguntas estão com as palavras de quem perguntou". Na mesma caixa, a coluna ao lado diz "Publique a pergunta", e publicar a pergunta costuma ser publicar a frase literal de alguém. A distinção que o capítulo quer fazer (a frase que só uma pessoa diria contra a pergunta que muitos fazem) é boa, mas o item, do jeito que está, proíbe o que o capítulo seguinte ensina.'
    correcao: 'Nunca: "A frase de um atendimento que só aquela pessoa diria, com as palavras dela." Mais seguro: "A dúvida sem o dono: a pergunta que muitos fazem, e nunca quem a fez."'
  - criterio: clareza
    trecho: 'A angústia do domingo à tarde tem esse tamanho.'
    por_que: 'A frase confunde o tema com o padrão, justamente no parágrafo que ensina a calibrar o padrão. "A angústia do domingo à tarde" é o tema, e é um lugar-comum nacional (a r1 já apontou o risco do Fantástico): ele passa no teste do horóscopo que vem duas frases depois. O padrão da Lúcia é outro, e é bom: "o aperto costuma ser maior em quem descansou bem no sábado". O leitor que copia o exemplo aprende a parar no tema.'
    correcao: '"O padrão da Lúcia tem esse tamanho: o aperto do domingo é maior em quem descansou bem no sábado."'
  - criterio: honestidade
    trecho: 'Uma mãe chorou quando eu disse que o filho de quatro anos ia, sim, falar.'
    por_que: 'Dois problemas no exemplo que atravessa a oficina. (1) Publicado, mesmo despersonalizado ("uma mãe ouviu de mim que o filho ia falar, e chorou de alívio"), ele funciona como garantia de resultado, e o capítulo manda ler o código de ética da área, que costuma vedar isso na publicidade de saúde. O leitor fonoaudiólogo copia um prognóstico-promessa como modelo. (2) O padrão do campo 04 ("Pais de crianças com atraso de fala esperam a escola para agir") não sai do episódio, que é sobre alívio e medo, e não sobre espera. O exemplo pula a operação que o capítulo diz ser a mais esquecida. Ele também repete a fonoaudióloga do cap. 10, três capítulos antes, com a mesma ideia de escola e espera ("Escola que manda a criança para avaliação só em novembro").'
    correcao: 'Troque o episódio para um que gere o padrão e evite a promessa. Campo 01: "Uma mãe me disse que esperou a escola pedir avaliação, porque achava que o filho de quatro anos só era preguiçoso para falar." Campo 03: "Há alguns anos, uma mãe me contou que esperou a escola pedir a avaliação do filho." Os campos 04 e 05 podem ficar. Se a fonoaudióloga do cap. 10 pesar, troque por uma pediatra (figurante livre) e mantenha a mesma cadeia.'
  - criterio: voz
    trecho: 'Com as quatro operações prontas, Lúcia não publicou.'
    por_que: 'É a batida "personagem não fez o óbvio; fez outra coisa", que a lição cap04-r1 dá por esgotada ("Abrir desfechos pela ação"). Ela abre a seção decisiva do capítulo.'
    correcao: '"Com as quatro operações prontas, Lúcia guardou a folha dentro do caderno de campo e esperou." (combine com a correção da folha, acima).'
  - criterio: ritmo
    trecho: 'Tabela: O domingo, operação por operação'
    por_que: 'A tabela entra logo depois da primeira operação (p. 15) e mostra as cinco linhas, com o padrão e o critério, antes que a prosa conte a segunda, a terceira e a quarta. O achado da terceira operação ("o aperto costuma ser maior em quem descansou bem no sábado"), que é o momento em que "transformou o texto", chega ao leitor primeiro numa célula de tabela, e a prosa depois só o repete.'
    correcao: 'Mova a tabela para depois do parágrafo "A quarta operação foi devolver...", como síntese, e mantenha na p. 15 só o texto corrido das operações.'
  - criterio: ritmo
    trecho: 'Lúcia cortou o cheiro do ferro com pena, e fez bem.'
    por_que: 'O corte do ferro já foi narrado, com a mesma ideia, na seção anterior ("a imagem mais bonita da história e, por isso mesmo, a mais perigosa [...] Cortou o ferro, a mãe e a porta"). Ele volta aqui, no "Para guardar" (item 3), na verificação (questão 2) e no fecho. A regra geral do parágrafo é ganho novo; a recontagem do corte não é (lição cap02-r1: a terceira vez precisa trazer ganho novo).'
    correcao: 'Deixe o parágrafo só com o princípio e a consequência: "A frase mais bonita da sessão é, quase sempre, a que mais identifica. Ela é bonita porque é particular, e é particular porque é da pessoa. Quem a corta não empobrece o texto: a paciente que o lesse se reconheceria no domingo, como milhares de outras pessoas, mas não se veria exposta."'
  - criterio: concretude
    trecho: 'sobre o que acontece com toda advertência escrita às pressas: ela quase sempre existe, e quase sempre tem a data errada.'
    por_que: '"Ela quase sempre existe" é tautológico: uma advertência escrita às pressas existe por definição. O padrão jurídico, que é bom (a advertência feita depois do fato, que perde a imediatidade), fica ilegível, e "toda advertência" com "quase sempre" duas vezes soa como generalização sem fonte.'
    correcao: '"...numa lição, guardada no caderno, sobre a advertência escrita às pressas, depois que o problema estourou: nos processos que ele vê, ela existe, mas tem data posterior à falta, e o juiz percebe."'
  - criterio: metodo
    trecho: 'aí a saída é esperar ou escolher outro caso.'
    por_que: 'Esperar não torna menos identificável um caso raro numa cidade pequena: a raridade não passa com o tempo. A instrução promete uma saída que não protege, no parágrafo que trata do limite do caso composto.'
    correcao: '"Numa cidade pequena ou num caso raro, nem o caso composto basta; aí a saída é ficar só no padrão, sem caso, ou escolher outro caso."'
  - criterio: coerencia
    trecho: 'Tinha doze linhas, uma pergunta no fim e nenhum detalhe de ninguém.'
    por_que: 'O cap. 17, da mesma personagem e um mês depois, repete o detalhe: "O texto tinha doze linhas". Dois textos de doze linhas parecem gabarito (lição cap08-r1). Há também dois atritos a jusante, que convém avisar aos autores: o cap. 22 diz que "autocuidado aos domingos" era "um tema que Lúcia nunca tinha trabalhado com nenhum paciente", e que a psicóloga copiada começava pelo "fim de uma tarde de domingo", quando o domingo é o assunto do texto de maior resposta da Lúcia (e o cap. 27 o cita: "Aquele texto sobre o domingo"). O cap. 15, por sua vez, repete o gesto de cortar a mãe de um caso de fim de semana ("a casa da mãe sumiu").'
    correcao: 'Aqui: "Tinha onze linhas..." (ou tire o número). No cap. 22, troque o tema copiado por um que não seja o domingo, ou faça a Lúcia notar que copiava o próprio assunto na voz da outra. No cap. 15, troque a casa da mãe por outro identificador.'
  - criterio: voz
    trecho: 'Das quatro operações, a mais esquecida é a terceira.'
    por_que: 'Esta é uma afirmação empírica sem fonte sobre terceiros, e o capítulo já tem outra ("quem tenta generalizar antes de despersonalizar costuma levar para o padrão os detalhes do caso"). Com a do Otávio ("quase sempre", duas vezes), passa do limite de 2 da lição cap01-r4/cap02-r2. Vem da fonte, mas pode ser dita como observação.'
    correcao: '"Das quatro operações, a terceira é a que mais se pula quando se tem pressa." Ou atribua: "Na lista de crenças da Lúcia, a peça que não funcionou quase sempre tinha pulado a terceira."'
edicoes_de_linha:
  - 'Na sexta de manhã, fez o que faz quando precisa pensar -> Na sexta de manhã, Lúcia fez o que faz quando precisa pensar (o último sujeito explícito está a seis parágrafos e a figura 13.2 no meio; no impresso, a frase começa no pé da p. 14)'
  - 'Podia oferecer uma pergunta que ajuda a pessoa a observar o próprio domingo -> Podia oferecer uma pergunta com que a pessoa observasse o próprio domingo (três "ajuda" em três linhas)'
  - 'às vezes diminui o tamanho do aperto, e ajuda a decidir se vale procurar ajuda -> às vezes diminui o aperto, e ajuda a decidir se é hora de procurar um profissional'
  - 'Uma delas dizia que a pessoa tinha lido o texto num domingo -> Uma delas vinha de alguém que tinha lido o texto num domingo'
  - 'profissionais de saúde, advogados, psicólogos, contadores -> médicos, dentistas, psicólogos, advogados, contadores (psicólogos já são profissionais de saúde)'
  - 'numa cidade do tamanho de Caruaru, o tipo de empresa -> entre os empresários de Caruaru, que se conhecem, o tipo de empresa (Caruaru tem perto de 400 mil habitantes; "do tamanho de" sugere cidade pequena)'
  - 'As quatro operações, sempre nesta ordem, são isolar, despersonalizar, generalizar e devolver. A mais esquecida é a de generalizar. -> As quatro operações, sempre nesta ordem, são isolar, despersonalizar, generalizar e devolver, e a terceira é a que mais se pula. (Para guardar: uma frase por ideia; o item 1 também tem duas)'
  - '“O caso importa menos do que o que ele mostra.” -> “Esse caso não é raro. Raro é alguém dizer isso em voz alta.” (o Faça assim fala da área do leitor, e não sobre fazer conteúdo; lição cap01-r1)'
diagramacao:
  - 'p. 18: cerca de 20% da página em branco no pé; o último parágrafo da prosa quebra em "Lúcia guardou a resposta no caderno," e deixa duas linhas no topo da p. 19. É o mesmo problema da r2, não resolvido. O branco precede o "Para guardar", e não a oficina.'
  - 'p. 15: a tabela 13.1 aparece antes da explicação das operações 2 a 4 e antecipa o padrão e o critério (ver ritmo).'
  - 'p. 13, figura 13.1: a barra "Criada do zero: 180 min, sem terminar" continua desenhada cheia, como medida fechada; ficaria mais honesta em traço aberto ou tracejado (sugestão da r2).'
  - 'p. 23: o esqueleto dá 11 linhas para reescrever uma peça que o campo 06 (p. 21) já montou em 7; com esqueleto_rotulo e 2 linhas por parte, a rede cabe em menos espaço.'
  - 'p. 19: cerca de 65% em branco antes da oficina, e p. 22: cerca de 40% em branco antes do esqueleto indivisível. Os dois são aceitos pelo projeto.'
veredito: 'Os bloqueadores da r2 caíram, e o capítulo está a uma passada de linha da aprovação; faltam a tabela 13.1, em que Isolado e Despersonalizado são quase a mesma frase, a folha com o ferro guardada no caderno da bolsa e o esqueleto que repete a oficina.'
